<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="accountMenu">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid columns="2" styleClass="aon-width-all" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>

						<aon:panelGrid id="group_entries" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-account-entry aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.menu_entries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountEntry" action="accountEntry_search"
										actionListener="#{accountEntry.onEditSearch}"
										value="#{accountingBundle.accounting_entry_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account" action="account_list"
										value="#{accountBundle.account_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="autConcept" action="autConcept"
										value="#{accountingBundle.accounting_aut_concept_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_pred_entries" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-account-entry-predefined aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.menu_pred_entries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="invoiceEntry"
										action="account_invoice_entry"
										actionListener="#{invoiceEntry.onReset}"
										value="#{accountingBundle.accounting_entry_invoice_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="financeEntry"
										action="account_finance_entry"
										actionListener="#{financeEntry.onReset}"
										value="#{accountingBundle.accounting_entry_finance_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="financeTrackingEntry-accounting"
										action="account_finance_tracking_entry-accounting"
										actionListener="#{financeTrackingEntry.onReset}"
										value="#{accountingBundle.accounting_entry_finance_tracking_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseEntry"
										action="account_expense_entry"
										actionListener="#{expenseEntry.onReset}"
										value="#{accountingBundle.accounting_expense_entry_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="salaryEntry" action="account_salary_entry"
										actionListener="#{salaryEntry.onReset}"
										value="#{accountingBundle.accounting_salary_entry_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="socialInsuranceEntry"
										action="account_social_insurance_entry"
										actionListener="#{socialInsuranceEntry.onReset}"
										value="#{accountingBundle.accounting_social_insurance_entry_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_pred_entries_end_period"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-account-entry-close aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText
									value="#{accountingBundle.menu_end_period_entries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="endPeriodEntries"
										action="endPeriodEntries_form"
										actionListener="#{endPeriodEntries.onInit}"
										value="#{accountingBundle.accounting_en_period_entries_management}" />
								</aon:div>
<!-- 
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountOperatingEntry"
										action="accountOperatingEntry"
										actionListener="#{endPeriodEntries.onInitOperatingEntry}"
										value="#{accountingBundle.accounting_operating_entry_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountClosingEntry"
										action="accountClosingEntry"
										actionListener="#{endPeriodEntries.onInitClosingEntry}"
										value="#{accountingBundle.accounting_closing_entry_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountOpeningEntry"
										action="accountOpeningEntry"
										actionListener="#{endPeriodEntries.onInitOpeningEntry}"
										value="#{accountingBundle.accounting_opening_entry_module}" />
								</aon:div>
 -->
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_pred_entries_loan"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-moneybag aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText
									value="#{accountingBundle.accounting_loan_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="loanFeeEntry"
										action="account_loan_fee_entry"
										actionListener="#{loanFeeEntry.onReset}"
										value="#{accountingBundle.accounting_loan_fee_entry_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="loanEntry" action="account_loan_entry"
										actionListener="#{loanEntry.onReset}"
										value="#{accountingBundle.accounting_loan_entry_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="loan" action="loan_search"
										actionListener="#{loan.onEditSearch}"
										value="#{accountingBundle.accounting_loan_management_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>

					<aon:panelGroup>

						<aon:panelGrid id="group_reports" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-account-reports aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.menu_reports}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account_statement"
										action="account_statement_search"
										actionListener="#{trialBalance.onReset}"
										value="#{accountingBundle.accounting_statement_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="profitAndLossReport"
										action="profit_and_loss_search"
										actionListener="#{profitAndLossReport.onEditSearch}"
										value="#{accountingBundle.accounting_profit_and_loss_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="trialBalance-report" action="trialBalance_search-Report"
										actionListener="#{trialBalance.onReset}"
										value="#{accountingBundle.accounting_trial_balance_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="journal-Report" action="journal_search-Report"
										actionListener="#{journalReport.onEditSearch}"
										value="#{accountingBundle.accounting_journal_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="vat_report" action="vat_report_search"
										actionListener="#{vatReport.onReset}"
										value="#{financeBundle.finance_vat_report_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="retention_report" action="retention_report_search"
										actionListener="#{retentionReport.onReset}"
										value="#{fiscalBundle.fiscal_retention_report_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="invoice_report"   actionListener="#{invoiceReport.onReset}"
										action="invoiceReport_search" value="#{fiscalBundle.fiscal_invoice_report}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_balance" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-balance aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.menu_official_balances}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="journal-Balance" action="journal_search-Balance"
										actionListener="#{journalReport.onEditSearch}"
										value="#{accountingBundle.accounting_journal_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="ledger" action="ledger_search"
										actionListener="#{ledgerReport.onEditSearch}"
										value="#{accountingBundle.accounting_ledger_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="official-trialBalance-Balance" action="officialTrialBalance_search"
										actionListener="#{officialTrialBalance.onReset}"
										value="#{accountingBundle.accounting_trial_balance_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="operating_balance_sheet"
										action="balance_sheet_search-operating"
										actionListener="#{balanceSheet.onOperatingBalance}"
										value="#{accountingBundle.accounting_balance_menu_pyg}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="closing_balance_sheet"
										action="balance_sheet_search-closing"
										actionListener="#{balanceSheet.onClosingBalance}"
										value="#{accountingBundle.accounting_balance_menu_bs}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="patrimony_balance_sheet"
										action="balance_sheet_search-patrimony"
										actionListener="#{balanceSheet.onPatrimonyBalance}"
										value="#{accountingBundle.accounting_balance_menu_patrimony}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="custom_balance_sheet"
										action="balance_sheet_search-custom"
										actionListener="#{balanceSheet.onCustomBalance}"
										value="#{accountingBundle.accounting_balance_menu_custom}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accounting_balance" action="balance_list"
										value="#{accountingBundle.accounting_balance_menu}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_fixed_assets" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-fixed-asset aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.menu_fixed_assets}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortization" action="amortization_list"
										value="#{accountingBundle.accounting_amortization_form_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="periodAmortization"
										action="periodAmortization_search"
										value="#{accountingBundle.accounting_period_amortization_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortizationType"
										action="amortizationType_list"
										value="#{accountingBundle.accounting_amortization_type_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
