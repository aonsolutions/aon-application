<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="infoWebMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_infoweb_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{bundle.infoweb_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:if test="#{aonRole.config}">								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="companyWebInfo" 
											action="companyWebInfo" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{bundle.aon_addInfo}" >
											<aon:actionListener method="#{companyWebInfo.onLoadWebInfo}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="webPage" 
											action="webPage" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{bundle.infoweb_pages}" >
											<aon:actionListener method="#{webPage.onInit}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="webPageStyle" 
											action="webPageStyle" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{bundle.aon_template}" >
											<aon:actionListener method="#{webPageStyle.onLoad}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="images" 
											action="companyImages" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{bundle.company_images_module}">
											<aon:actionListener method="#{companyImages.onEditSearch}" />
											<aon:actionListener method="#{companyImages.onSearch}" />
										</aon:commandLink>
									</aon:div>
								</aon:if>
							</aon:div>							
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
						<aon:if test="#{aonRole.admin}">
							<aon:panelGrid id="group_infoweb_publish"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-task">
								<f:facet name="header">
									<aon:outputText value="#{bundle.infoweb_publish_group}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="generator" 
											action="generator" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{bundle.infoweb_generate}" >
											<aon:actionListener method="#{generator.onInit}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>

					</aon:panelGroup>													
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
