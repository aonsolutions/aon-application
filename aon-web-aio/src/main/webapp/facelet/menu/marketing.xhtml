<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="marketingMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<c:if test="#{aonRole.commercialOperator}">
							<aon:panelGrid id="group_marketing_masters"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_master_tables}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="target-marketing" 
											action="target_search-marketing" 
											actionListener="#{target.onEditSearch}"
											value="#{commercialBundle.commercial_target_module}" />
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</c:if>
					
						<aon:panelGrid id="group_marketing_marketing"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-marketing aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_marketing}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="marketingCampaign"
										action="marketingCampaign_list" actionListener="#{marketingCampaign.onSearch}"
										value="#{marketingBundle.marketing_campaign_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="communicationCenter"
										action="communicationCenter" actionListener="#{communicationCenter.onInit}"
										value="#{commercialBundle.commercial_communication_center_module}" />										
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_marketing_general"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-reservation">
								<f:facet name="header">
									<aon:outputText value="#{marketingBundle.marketing_survey_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="question"
											action="question_list" actionListener="#{question.onSearch}"
											value="#{commercialBundle.commercial_question_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="surveyResponse"
											action="surveyResponse_list" actionListener="#{surveyResponse.onSearch}"
											value="#{marketingBundle.marketing_survey_response_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="survey"
											action="survey_list" actionListener="#{survey.onSearch}" 
											value="#{marketingBundle.marketing_survey_module}" />
									</aon:div>								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="marketingTemplate"
											action="marketingTemplate_list" actionListener="#{marketingTemplate.onSearch}" 
											value="#{marketingBundle.marketing_template_module}" />
									</aon:div>								
								</aon:div>
							</aon:panelGrid>
						</c:if>

						<c:if test="#{aonRole.admin}">
							<aon:panelGrid id="group_marketing_infoweb"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{infowebBundle.infoweb_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="company-marketing" 
											action="company-marketing" actionListener="#{company.onLoad}"
											value="#{companyBundle.company_data_module}">
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="companyWebInfo" 
											action="companyWebInfo" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{infowebBundle.infoweb_data}" >
											<aon:actionListener method="#{companyWebInfo.onLoadWebInfo}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="images" 
											action="companyImages" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{companyBundle.company_images_module}">
											<aon:actionListener method="#{companyImages.onCancel}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="webPage" 
											action="webPage" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{infowebBundle.infoweb_pages}" >
											<aon:actionListener method="#{webPage.onInit}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="webPageStyle" 
											action="webPageStyle" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{infowebBundle.infoweb_template}" >
											<aon:actionListener method="#{webPageStyle.onLoad}" />
										</aon:commandLink>
									</aon:div>
									<c:if test="#{aonRole.admin}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="publishParameter" 
												action="publishParameter" 
												actionListener="#{publishParameter.onInit}"
												value="#{infowebBundle.infoweb_publish_parameters}" />
										</aon:div>
									</c:if>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="generator" 
											action="generator" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{infowebBundle.infoweb_generate}" >
											<aon:actionListener method="#{generator.onInit}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>													
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
