<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="marketingMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:if test="#{aonRole.commercialOperator}">
							<aon:panelGrid id="group_marketing_masters"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_contacts}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="target-marketing" 
											action="target_search-marketing" 
											actionListener="#{target.onEditSearch}"
											value="#{bundle.commercial_target_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="targetDeduplication-marketing" 
											action="targetDeduplication_search-marketing" 
											actionListener="#{targetDeduplication.onEditSearch}"
											value="#{bundle.commercial_target_deduplication_module}">
										</aon:commandLink>
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>
					
					<aon:panelGroup>
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_marketing_general"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-task">
								<f:facet name="header">
									<aon:outputText value="#{bundle.marketing_survey_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="question"
											action="question_list"
											actionListener="#{question.onEditSearch}"
											value="#{bundle.registry_question_module}" >
											<aon:actionListener method="#{question.onSearch}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="survey"
											action="survey_list"
											actionListener="#{survey.onEditSearch}" 
											value="#{bundle.marketing_survey_module}" >
											<aon:actionListener method="#{survey.onSearch}" />
										</aon:commandLink>
									</aon:div>								
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>						
						
					<aon:panelGroup>						
						<aon:panelGrid id="group_marketing_news"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-report aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_news_module}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="news_messages"
										action="news_list-messages"
										actionListener="#{news.onSetTypeMessage}"
										value="#{bundle.aon_messages}">
										<aon:actionListener method="#{news.onEditSearch}" />
										<aon:actionListener method="#{news.onSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="news_news"
										action="news_list-news"
										actionListener="#{news.onSetTypeNews}"
										value="#{bundle.marketing_newss}">
										<aon:actionListener method="#{news.onEditSearch}" />
										<aon:actionListener method="#{news.onSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="newsletter"
										action="newsletter_list"
										actionListener="#{newsletter.onSearch}"
										value="#{bundle.marketing_newsletter_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>						

					<aon:panelGroup>
						<aon:panelGrid id="group_marketing_communications"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-marketing">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_communications}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="marketingCampaign"
										action="marketingCampaign_list"
										actionListener="#{marketingCampaign.onSearch}"
										value="#{bundle.marketing_campaign_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="communicationCenter"
										action="communicationCenter"
										actionListener="#{communicationCenter.onInit}"
										value="#{bundle.commercial_communication_center_module}" />										
								</aon:div>
								<aon:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="surveyResponse"
											action="surveyResponse_list"
											actionListener="#{surveyResponse.onSearch}"
											value="#{bundle.marketing_survey_response_module}" />
									</aon:div>
								</aon:if>
							</aon:div>								
						</aon:panelGrid>
					</aon:panelGroup>				
					
					<aon:panelGroup>
						<aon:panelGrid id="group_marketing_rss"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_news_rss}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="channel" 
										action="channel_list"
										actionListener="#{channel.onSearch}" 
										value="#{bundle.marketing_channel_module}"/>	
								</aon:div>							
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="rss" action="rss_form"
										actionListener="#{rss.onInit}"
										value="#{bundle.marketing_rss_publish}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="previewRSS" action="rss_preview"
										actionListener="#{rss.onInit}"
										value="#{bundle.marketing_preview_online}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>			
					</aon:panelGroup>		
						
					<aon:panelGroup>							
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_marketing_templates"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-mail">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_templates}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="htmlTemplate" 
											action="htmlTemplate_list"
											actionListener="#{htmlTemplate.onEditSearch}"
											value="#{bundle.marketing_html_template_module}" />
									</aon:div>															
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="marketingTemplate"
											action="marketingTemplate_list"
											actionListener="#{marketingTemplate.onEditSearch}" 
											value="#{bundle.marketing_template_module}" >
											<aon:actionListener method="#{marketingTemplate.onSearch}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">																										
										<aon:commandLink id="images-marketing" 
											action="#{companyImages.initialAction}" 
											actionListener="#{companyImages.onEditSearch}"
											value="#{bundle.company_images_module}">
											<aon:actionListener method="#{companyImages.onSearch}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>													
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
