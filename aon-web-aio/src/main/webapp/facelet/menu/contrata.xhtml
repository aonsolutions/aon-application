<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="contrataMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_contrata_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-account-entry aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.contrata_main_menu_group}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="contract-contrata"
											action="#{contract.initialAction}"
											actionListener="#{contract.onEditSearch}"
											value="#{payrollBundle.payroll_contract_module}">
											<f:setPropertyActionListener target="#{contract.skipPayrollData}" value="#{true}" />
										</aon:commandLink>
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="person-contrata"
										action="#{person.initialAction}"
										actionListener="#{person.onEditSearch}"
										value="#{registryBundle.registry_person_module}"/>
								</aon:div>
							</aon:div>							
						</aon:panelGrid>
						<aon:panelGrid id="group_contrata_batch"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-renameFolder aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.batch_menu_group}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contrataBatch-contrata"
										action="contrataBatch_search-contrata"
										value="#{payrollBundle.payroll_contrataBatchWizard_module}" >
										<aon:actionListener method="#{contrataBatch.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
<!--  
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="certifica2Batch-contrata"
										action="certifica2Batch_search-contrata"
										actionListener="#{certifica2Batch.onEditSearch}"
										value="#{payrollBundle.payroll_certifica2BatchWizard_module}" />
								</aon:div>
-->
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
						
						<c:if test="#{!domainSwitcher.parentDomain or !domainSwitcher.domainManagementAvailable}">
						</c:if>
						<c:if test="#{aonRole.config}">												
							<aon:panelGrid id="group_contrata_parameters"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-config">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_configuration}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
								
									<c:if test="#{!domainSwitcher.domainManagementAvailable}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="enterprise-contrata"
												action="#{enterprise.initialAction}"
												actionListener="#{enterprise.onBasicViewSelect}"
												value="#{companyBundle.company_data_module}">
												<aon:actionListener method="#{enterprise.onEditSearch}" />
											</aon:commandLink>
										</aon:div>
									</c:if>
								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="payrollParams-contrata" 
											action="payrollDefaultParams-contrata"
											actionListener="#{payrollAppParams.onLoad}"
											value="#{payrollBundle.payroll_default_params_module}" >
											<f:setPropertyActionListener target="#{payrollAppParams.skipPayrollData}" value="#{true}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
					
						<aon:panelGrid id="group_contrata_auxiliaries"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_auxiliaries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="trainingCenter-contrata"
										action="trainingCenter_list-contrata"
										value="#{payrollBundle.payroll_trainingCenter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contractMode-contrata"
										action="contractOption_list-contrata"
										actionListener="#{contractModel.onReset}"
										value="#{payrollBundle.payroll_contract_mode_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contractCode-contrata"
										action="contractCode_list-contrata"
										actionListener="#{contractCode.onReset}"
										value="#{payrollBundle.payroll_contract_code_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cnae-contrata"
										action="cnae_list-contrata" 
										value="#{configBundle.config_cnae_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cnae2009-contrata"
										action="cnae2009_list-contrata" 
										value="#{configBundle.config_cnae2009_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cno-contrata"
										action="cno_list-contrata"  
										value="#{payrollBundle.payroll_cno_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="sepeTables-contrata"
										action="sepeTables_list-contrata"
										actionListener="#{sepeTables.onInit}"  
										value="#{payrollBundle.payroll_sepeTables_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_contrata_utilities"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-config">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contractLoader"
										action="contractLoader_form"
										actionListener="#{contractLoader.onStart}"
										value="#{payrollBundle.payroll_contractLoader_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>													
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
