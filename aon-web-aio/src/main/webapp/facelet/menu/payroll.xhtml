<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="payrollMenu">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<!--
						SALARIES 
					-->
					<c:if test="#{!domainSwitcher.domainManagementAvailable}">
						<aon:panelGroup>
							<aon:panelGrid id="group_main_payroll" styleClass="aon-width-all"
								columnClasses="aon-padding"
								headerClass="aon-icon-general aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.payroll_salary_menu_group}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{!domainSwitcher.domainManagementAvailable}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="gwt_employee" action="gwt_employee_tree"
												value="#{bundle.menu_integral}" target="gwt">
												<aon:actionListener method="#{enterprise.onTreeViewSelect}" />
												<aon:actionListener method="#{enterprise.onEditSearch}" />
											</aon:commandLink>
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="contractLeave-payroll"
												action="contractLeave_search-payroll"
												actionListener="#{contractLeave.onEditSearch}"
												value="#{bundle.payroll_contractLeave_module}" />
										</aon:div>
									</c:if>
									<!--
									<aon:div styleClass="aon-direct-access-list-element">
										<a4j:commandLink ajaxSingle="true" immediate="true"
											onclick="alert('#{bundle.aio_not_yet}');return false;"
											value="¿ Partes de accidente ?"
											style="color:red;text-decoration:line-through" />
									</aon:div>
									-->
									<!-- 
								<c:if test="#{domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_calculator"
											action="gwt_main_calculator"
											value="#{bundle.menu_main_calculator}" target="gwt">
										</aon:commandLink>

									</aon:div>
								</c:if>
								-->
								</aon:div>

							</aon:panelGrid>
						</aon:panelGroup>
					</c:if>


					<!--
						SS 
					-->
					<aon:panelGroup>
						<aon:panelGrid id="group_seguridad_social"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-winsuite aon-direct-access-panel">
							<f:facet name="header">
								<aon:div>
									<h:outputLink target="_blank" value="http://www.seg-social.es">
										<aon:outputText value="#{bundle.payroll_ss_menu_group}" />
									</h:outputLink>
									<h:outputLink target="_blank" value="http://www.seg-social.es"
										title="#{bundle.aon_navigate_to_official_website}">
										<h:graphicImage
											styleClass="aon-vertical-align-middle aon-margin-left"
											url="#{aonResource.resolve['/images/aon-icon/aon-icon-lookup-goto.png']}" />
									</h:outputLink>
								</aon:div>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contractBatch-payroll"
										action="contractBatch_search-payroll"
										actionListener="#{contractBatch.onEditSearch}"
										value="#{bundle.payroll_contrata_contractBatch_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fanBatch-payroll"
										action="fanBatch_search-payroll"
										actionListener="#{fanBatch.onEditSearch}"
										value="#{bundle.payroll_fanBatchWizard_module}" />

								<aon:div styleClass="aon-direct-access-list-element">

										action="craBatch_search-payroll"
										actionListener="#{craBatch.onEditSearch}"
										value="#{bundle.payroll_craBatch_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="leaveBatch-payroll"
										action="leaveBatch_search-payroll"
										actionListener="#{leaveBatch.onEditSearch}"
										value="#{bundle.payroll_leaveBatchWizard_module}" />
								</aon:div>
								<!--
								<aon:div styleClass="aon-direct-access-list-element">
									<a4j:commandLink ajaxSingle="true" immediate="true"
										onclick="alert('#{bundle.aio_not_yet}');return false;"
										value="¿ Fichero Delt@ ?"
										style="color:red;text-decoration:line-through" />
								</aon:div>
								-->
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<!--
						AUXILIARS 
						 -->
					<aon:panelGroup>
						<aon:panelGrid id="group_payroll_contrata_auxiliaries"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_auxiliaries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="trainingCenter-payroll"

										value="#{bundle.payroll_trainingCenter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">

										action="contractOption_list-payroll"
										actionListener="#{contractModel.onReset}"
										value="#{bundle.payroll_contract_mode_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">

										actionListener="#{payrollCodeTables.onInit}"
										value="#{bundle.payroll_predefined_tables}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>


					<!--
						EMPLOYEES 
						 -->
					<aon:panelGroup>
						<aon:panelGrid id="group_payroll_contrata_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-account-entry aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.contrata_main_menu_group}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="contract-payroll"
											action="contract_search-payroll"
											actionListener="#{contract.onEditSearch}"
											value="#{bundle.payroll_contract_module}" />
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="person-payroll"
										action="#{person.initialAction}"
										actionListener="#{person.onEditSearch}"
										value="#{bundle.report_room_persons}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_agreement"
											action="gwt_main_agreement"
											value="#{bundle.payroll_agreement_module}" target="gwt">
										</aon:commandLink>
									</aon:div>
								</aon:div>

							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<!-- 
							SEPE
						 -->
					<aon:panelGroup>
						<aon:panelGrid id="group_payroll_contrata_batch"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-sepe aon-direct-access-panel">
							<f:facet name="header">
								<aon:div>
									<h:outputLink target="_blank" value="http://www.sepe.es">
										<aon:outputText value="#{bundle.payroll_sepe_menu_group}" />
									</h:outputLink>
									<h:outputLink target="_blank" value="http://www.sepe.es"
										title="#{bundle.aon_navigate_to_official_website}">
										<h:graphicImage
											styleClass="aon-vertical-align-middle aon-margin-left"
											url="#{aonResource.resolve['/images/aon-icon/aon-icon-lookup-goto.png']}" />
									</h:outputLink>
								</aon:div>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contrataBatch-payroll"
										action="contrataBatch_search-payroll"
										value="#{bundle.sepe_contrataBatch_module}">
										<aon:actionListener method="#{contrataBatch.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="certifica2Batch-payroll"
										action="certifica2Batch_search-payroll"
										actionListener="#{certifica2Batch.onEditSearch}"
										value="#{bundle.sepe_certifica2Batch_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<!--
						CONFIG 
						 -->
					<aon:panelGroup>
						<aon:panelGrid id="group_payroll_contrata_parameters"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-config">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_configuration}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="gwt_main_system" action="gwt_main_system"
										value="#{bundle.payroll_system}" target="gwt">
									</aon:commandLink>
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="calendar-payroll" action="calendar_search"
										actionListener="#{calendar.onEditSearch}"
										value="#{bundle.calendar_menu_group}">
										<aon:actionListener method="#{calendar.onInitialize}" />
									</aon:commandLink>
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="holiday-payroll" action="holiday_search"
										actionListener="#{holiday.onEditSearch}"
										value="#{bundle.calendar_holidays}" />
								</aon:div>

							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<!--
						PROCESS 
						 -->
					<aon:panelGroup>
						<aon:panelGrid id="group_process_payroll"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-task aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_processes}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fbatchPayment-payroll"
										action="fbatch_search-Payroll"
										actionListener="#{fbatch.onEditSearchPayment}"
										value="#{bundle.payroll_fbatch_payment_module}">
										<f:setPropertyActionListener target="#{fbatch.payroll}"
											value="#{true}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="financePayment-payroll"
										action="finance_search-Payroll"
										actionListener="#{finance.onEditSearchPayment}"
										value="#{bundle.payroll_finance_payment_module}">
										<f:setPropertyActionListener target="#{finance.payroll}"
											value="#{true}" />
									</aon:commandLink>
								</aon:div>
								<!--  
								<aon:div styleClass="aon-direct-access-list-element">
									<a4j:commandLink ajaxSingle="true" immediate="true"
										onclick="alert('#{bundle.aio_not_yet}');return false;"
										value="Regularización IRPF" style="color:grey;font-style:oblique;" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<a4j:commandLink ajaxSingle="true" immediate="true"
										onclick="alert('#{bundle.aio_not_yet}');return false;"
										value="Generación Apuntes Contables" style="color:grey;font-style:oblique;" />
								</aon:div>
							-->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseInvoice-payroll"
										action="expenseInvoice_search-payroll"
										actionListener="#{expenseInvoice.onEditSearch}"
										value="#{bundle.finance_expense_invoice_management_module}" />
								</aon:div>
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="salaryPrint-payroll"
											action="salaryPrint_list-payroll"
											actionListener="#{salaryPrint.onInit}"
											value="#{bundle.payroll_salaryPrint_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<!--
						HACIENDA 
						 -->
					<aon:panelGroup>
						<aon:panelGrid id="group_hacienda" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-aeat aon-direct-access-panel">
							<f:facet name="header">
								<aon:div>
									<h:outputLink target="_blank"
										value="http://www.agenciatributaria.es">
										<aon:outputText value="#{bundle.payroll_aeat_menu_group}" />

									<h:outputLink target="_blank"
										value="http://www.agenciatributaria.es"
										title="#{bundle.aon_navigate_to_official_website}">
										<h:graphicImage
											styleClass="aon-vertical-align-middle aon-margin-left"
											url="#{aonResource.resolve['/images/aon-icon/aon-icon-lookup-goto.png']}" />
									</h:outputLink>
								</aon:div>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="irpfData-payroll"
										action="irpfData_search-payroll"
										actionListener="#{irpfData.onEditSearch}"
										value="#{bundle.payroll_model_145_module}">
										<aon:actionListener method="#{contract.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mod111-payroll"
										action="mod111_search-payroll"
										actionListener="#{mod111.onEditSearch}"
										value="Mod. 111 - #{bundle.fiscal_model_111_module_abbr}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="gwt_mod190-payroll"
										action="gwt_mod190-payroll"
										value="Mod. 190 - Resumen anual de retenciones e ingresos a cuenta ">
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<a4j:commandLink ajaxSingle="true" immediate="true"
										onclick="alert('#{bundle.aio_not_yet}');return false;"
										value="Modelo 216 - Retenciones de trabajo de No Residentes"
										style="color:grey;font-style:oblique;" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<a4j:commandLink ajaxSingle="true" immediate="true"
										onclick="alert('#{bundle.aio_not_yet}');return false;"
										value="Modelo 296 - Resumen IRPF Anual de No Residentes"
										style="color:grey;font-style:oblique;" />
								</aon:div>
							</aon:div>

					<aon:panelGroup>

					<!--

						 -->
					<aon:panelGroup>

					<c:if test="#{!domainSwitcher.domainManagementAvailable}">
						<aon:panelGroup>
						</aon:panelGroup>
					</c:if>

					<!--
						Interesting LINKS 
					<aon:panelGroup>
						<aon:panelGrid id="group_contrata_links"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-report aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="Enlaces externos" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<h:outputLink target="_blank" value="http://www.sepe.es/">
										<aon:outputText
											value="S.E.P.E. - Servicio Publico de Empleo Estatal" />
									</h:outputLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<h:outputLink target="_blank" value="http://www.seg-social.es">
										<aon:outputText value="S.S. - Seguridad Social" />
									</h:outputLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
						 -->
