<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="mainMenu">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<c:if test="#{!domainSwitcher.domainManagementAvailable}">
							<aon:panelGrid id="group_main_payroll" styleClass="aon-width-all"
								columnClasses="aon-padding"
								headerClass="aon-icon-config aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{payrollBundle.labor_menu_group}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{companyCollections.currentUserEnterprisesCount > 0}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="integral" 
												action="#{enterprise.initialAction}"
												actionListener="#{enterprise.onTreeViewSelect}" 
												value="#{payrollBundle.menu_integral}">
												<aon:actionListener method="#{enterprise.onEditSearch}" />
											</aon:commandLink>
										</aon:div>
									</c:if>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="salaryDraft"
											action="salaryDraft_search"
											actionListener="#{salaryDraft.onEditSearch}"
											value="#{payrollBundle.payroll_salaryDraft_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="paymentUpdate"
											action="paymentUpdate_list"
											actionListener="#{paymentUpdate.onEditSearch}"
											value="#{payrollBundle.payroll_payment_update_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="salary"
											action="salary_search"
											actionListener="#{salary.onEditSearch}"
											value="#{payrollBundle.payroll_salary_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="contractLeave" 
											action="contractLeave_form" 
											actionListener="#{contractLeave.onInit}"
											value="#{payrollBundle.payroll_contractLeave_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element" >
										<aon:commandLink id="gwt_employee" 
											action="gwt_employee_tree"
											value="#{gwtPayrollBundle.menu_employee_tree}">
											<aon:actionListener method="#{enterprise.onTreeViewSelect}" />
											<aon:actionListener method="#{enterprise.onEditSearch}" />
										</aon:commandLink>
									</aon:div>							

									<aon:div styleClass="aon-direct-access-list-element" >
										<aon:commandLink id="gwt_enterprise" 
											action="gwt_enterprise_site"
											actionListener="#{enterprise.onTreeViewSelect}"
											value="#{gwtPayrollBundle.menu_enterprise_site}">
											<aon:actionListener method="#{enterprise.onEditSearch}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
	
							</aon:panelGrid>
						</c:if>
						
						<aon:panelGrid id="launcher_wizard"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-reservation aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.payroll_salary_launchers}" />
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="salaryLauncher"
										action="salaryLauncher_form"
										actionListener="#{salaryLauncher.onStart}"
										value="#{payrollBundle.payroll_salary_launcher_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="salaryTestLauncher"
										action="salaryTestLauncher_form"
										actionListener="#{salaryTestLauncher.onStart}"
										value="#{payrollBundle.payroll_salary_test_launcher_module}"/>
								</aon:div>
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="salaryRemover"
											action="salaryRemover_search"
											actionListener="#{salary.onEditSearch}"
											value="#{payrollBundle.payroll_salary_remover_module}">
											<aon:actionListener method="#{salaryRemover.onInitialize}" />
										</aon:commandLink>
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="fiscal_wizard"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-aeat aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_fiscal}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="irpfLauncher"
										action="irpfLauncher_form"
										actionListener="#{irpfLauncher.onStart}"
										value="#{payrollBundle.payroll_irpfLauncher_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="irpfTestLauncher"
										action="irpfTestLauncher_form"
										actionListener="#{irpfTestLauncher.onStart}"
										value="#{payrollBundle.payroll_irpfTestLauncher_module}"/>
								</aon:div>
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="profRetention" 
											action="profRetention_search" 
											actionListener="#{profRetention.onEditSearch}"
											value="#{fiscalBundle.fiscal_professional_retention_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="model110" 
											action="withholdingReport_search" 
											actionListener="#{withholdingReport.onReset}"
											value="#{fiscalBundle.fiscal_withholding_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="irpfData"
											action="irpfData_search"
											actionListener="#{irpfData.onEditSearch}"
											value="#{payrollBundle.payroll_irpfData_module}">
											<aon:actionListener method="#{contract.onEditSearch}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="irpfDraft"
											action="irpfDraft_search"
											actionListener="#{irpfDraft.onEditSearch}"
											value="#{payrollBundle.payroll_irpfDraft_module}"/>
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
						
					</aon:panelGroup>

					<aon:panelGroup>
					
						<aon:panelGrid id="red_wizard"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-winsuite aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.red_menu_group}" />
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="leaveBatch" 
										action="leaveBatch_search"
										actionListener="#{leaveBatch.onEditSearch}"
										value="#{payrollBundle.payroll_leaveBatchWizard_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fanBatch" 
										action="fanBatch_search"
										actionListener="#{fanBatch.onEditSearch}"
										value="#{payrollBundle.payroll_fanBatchWizard_module}" />
								</aon:div>								
<!--
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fanBatchTest" 
										actionListener="#{fanBatchTest.onInit}"
										value="Chequeo de fichero FAN" />
								</aon:div>
-->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contractBatch" 
										action="contractBatch_search"
										actionListener="#{contractBatch.onEditSearch}"
										value="#{payrollBundle.payroll_contractBatchWizard_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="certificate_wizard"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-redtrabaja aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.certificate_menu_group}" />
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="settle"
											action="settle_search"
											actionListener="#{contract.onEditSearch}"
											value="#{payrollBundle.payroll_settle_module}"/>
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="certifica2Batch"
										action="certifica2Batch_search"
										actionListener="#{certifica2Batch.onEditSearch}"
										value="#{payrollBundle.payroll_certifica2BatchWizard_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="contrata_wizard"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-contrata aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.contrata_menu_group}" />
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="contract"
											action="contract_search"
											actionListener="#{contract.onEditSearch}"
											value="#{payrollBundle.payroll_contract_module}"/>
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contrataBatch"
										action="contrataBatch_search" disabled="true"
										value="#{payrollBundle.payroll_contrataBatchWizard_module}" >
										<aon:actionListener method="#{contrataBatch.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					
					</aon:panelGroup>
					
					<aon:panelGroup>
						<aon:panelGrid id="group_entity_payroll"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_master_tables}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="enterprise"
										action="#{enterprise.initialAction}"
										actionListener="#{enterprise.onBasicViewSelect}"
										value="#{companyBundle.company_enterprise_module}">
										<aon:actionListener method="#{enterprise.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="person"
										action="#{person.initialAction}"
										actionListener="#{person.onEditSearch}"
										value="#{registryBundle.registry_person_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="agreement" 
										action="#{agreement.initialAction}"
										actionListener="#{agreement.onEditSearch}"
										value="#{payrollBundle.payroll_agreement_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="calendar"
										action="#{calendar.initialAction}"
										actionListener="#{calendar.onEditSearch}"
										value="#{calendarBundle.aon_calendar_calendar_module}">
										<aon:actionListener method="#{calendar.onInitialize}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="holiday"
										action="#{holiday.initialAction}"
										value="#{calendarBundle.aon_calendar_festivities_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_config_editable"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-offer aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.payroll_concepts}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="paymentConcept"
										action="paymentConcept_search"
										actionListener="#{paymentConcept.onEditSearch}"
										value="#{payrollBundle.payroll_paymentConcept_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="deductionConcept"
										action="deductionConcept_search"
										actionListener="#{deductionConcept.onEditSearch}"
										value="#{payrollBundle.payroll_deductionConcept_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="bonusConcept"
										action="bonusConcept_search"
										actionListener="#{bonusConcept.onEditSearch}"
										value="#{payrollBundle.payroll_bonusConcept_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="systemData"
										action="systemData_grid"
										actionListener="#{systemData.onSearch}"
										value="#{payrollBundle.payroll_systemData_module}"/>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_config_predefined"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-account-entry aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.predefined_menu_group}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contractMode"
										action="contractOption_list"
										actionListener="#{contractModel.onReset}"
										value="#{payrollBundle.payroll_contract_mode_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cnae"
										action="cnae_list" 
										value="#{configBundle.config_cnae_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cnae2009"
										action="cnae2009_list" 
										value="#{configBundle.config_cnae2009_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cnae2009Rate"
										action="cnae2009Rate_list" 
										value="#{configBundle.config_cnae2009Rate_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cno"
										action="cno_list"  
										value="#{payrollBundle.payroll_cno_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="geozoneIrpf"
										action="geozoneIrpf_search" 
										actionListener="#{geozoneIrpf.onInitialize}" 
										value="#{payrollBundle.payroll_geozoneIrpf_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="systemPayment" 
										action="systemPayment_list"
										value="#{payrollBundle.payroll_systemPayment_module}"/>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="systemDeduction" 
										action="systemDeduction_list"
										value="#{payrollBundle.payroll_systemDeduction_module}"/>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
