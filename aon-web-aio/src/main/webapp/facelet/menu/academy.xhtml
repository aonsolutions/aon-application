<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="academyMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_academy_management"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-task aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_academic_management}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="alumn" 
										action="alumn"
										value="#{academyBundle.academy_alumn}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="course" 
										action="course"
										actionListener="#{course.onEditSearch}"
										value="#{academyBundle.academy_course}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="teacher" 
										action="teacher"
										value="#{academyBundle.academy_teacher}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mark" 
										action="mark"
										actionListener="#{mark.onNewSearch}"
										value="#{academyBundle.academy_mark}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="loan" 
										action="loan"
										actionListener="#{loan.onEditSearch}"
										value="#{academyBundle.academy_loan}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_academy_utilities"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="alumnReclassification" 
										action="alumnReclassification_search"
										actionListener="#{alumnReclassification.onEditSearch}"
										value="#{academyBundle.academy_alumn_reclassification}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">										
									<aon:commandLink id="closeGroup" 
										action="closeGroup_search"
										actionListener="#{closeGroup.onEditSearch}"
										value="#{academyBundle.academy_close_groups}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">										
									<aon:commandLink id="duplicateGroup" 
										action="duplicateGroup_search"
										actionListener="#{duplicateGroup.onEditSearch}"
										value="#{academyBundle.academy_duplicate_groups}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">																		
									<aon:commandLink id="academicSkillToGroup" 
										action="academicSkillToGroup_search"
										actionListener="#{academicSkillToGroup.onEditSearch}"
										value="#{academyBundle.academy_academic_skill_to_groups}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="feeToGroup" 
										action="feeToGroup_search"
										actionListener="#{feeToGroup.onEditSearch}"
										value="#{academyBundle.academy_fee_to_group}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
					</aon:panelGroup>

					<aon:panelGroup>

						<aon:panelGrid id="group_academy_auxiliaries"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-config">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_auxiliaries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="relationship-academy" 
										action="relationship_form-academy" 
										value="#{registryBundle.registry_relationship_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="segment_form-academy" 
										action="segment_form-academy" 
										value="#{registryBundle.registry_segment_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="academicYear" 
										action="academicYear"
										value="#{academyBundle.academy_academic_year}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="courseSubject" 
										action="courseSubject"
										value="#{academyBundle.academy_course_subject}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="courseLevel" 
										action="courseLevel"
										value="#{academyBundle.academy_course_level}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="academicSkill" 
										action="academicSkill"
										value="#{academyBundle.academy_academic_skill}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="qualification" 
										action="qualification"
										value="#{academyBundle.academy_qualification}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="observation" 
										action="observation"
										value="#{academyBundle.academy_observation}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="qualitySkill" 
										action="qualitySkill"
										value="#{academyBundle.academy_quality_skill}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>
				</h:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
