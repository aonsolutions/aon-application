<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="crmMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-200
					             , aon-vertical-align-top aon-width-200
					             , aon-vertical-align-top aon-width-200">

					<aon:panelGroup>	
						<aon:panelGrid id="group_commercial_agenda"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-commercial aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.commercial_agenda_module}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="commercialOperation"
										action="projectCommercial_search"
										actionListener="#{projectCommercial.onEditSearch}"
										value="#{bundle.commercial_operation_module}" />
								</aon:div>															
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="commercialTracking"
										action="commercialTracking_search"
										actionListener="#{commercialTracking.onEditSearch}"
										value="#{bundle.commercial_tracking_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="seller-commercial" 
										action="seller_search-commercial" 
										actionListener="#{seller.onEditSearch}"
										value="#{bundle.seller_module}" />
								</aon:div>
								<aon:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercialActivity"
											action="commercialActivity"
											actionListener="#{commercialActivity.onSearch}" 
											value="#{bundle.commercial_activity_module}" />
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_marketing_news"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-report aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_news_module}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="news_messages"
										action="news_list-messages"
										actionListener="#{news.onSetTypeMessage}"
										value="#{bundle.aon_messages}">
										<aon:actionListener method="#{news.onEditSearch}" />
										<aon:actionListener method="#{news.onSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="news_news"
										action="news_list-news"
										actionListener="#{news.onSetTypeNews}"
										value="#{bundle.marketing_newss}">
										<aon:actionListener method="#{news.onEditSearch}" />
										<aon:actionListener method="#{news.onSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="newsletter"
										action="newsletter_list"
										actionListener="#{newsletter.onSearch}"
										value="#{bundle.marketing_newsletter_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_statistics_mando"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-task aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.seller_stat_control}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl2"
											action="commercial_search_view-seller"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.seller_stat_control_seller}">
											<aon:actionListener method="#{commercialStat.onSellerType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl3"
											action="commercial_search_view-target"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.seller_stat_control_target}">
											<aon:actionListener method="#{commercialStat.onTargetType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl4"
											action="commercial_search_view-product"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.seller_stat_control_product}">
											<aon:actionListener method="#{commercialStat.onProductType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl5"
											action="commercial_search_view-category"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.seller_stat_control_category}">
											<aon:actionListener method="#{commercialStat.onCategoryType}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>					

					<aon:panelGroup>
						<aon:panelGrid id="group_commercial_commercial"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-offer aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_invoice_offers}"/>
							</f:facet>						
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="offer" 
										action="offer_search"
										actionListener="#{offer.onEditSearch}"
										value="#{bundle.commercial_offer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="sales-commercial" 
										action="sales_search-commercial"
										actionListener="#{sales.onEditSearch}"
										value="#{bundle.sales_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list">							
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="target-commercial" 
											action="target_search-commercial" 
											actionListener="#{target.onEditSearch}"
											value="#{bundle.commercial_target_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="targetDeduplication-commercial" 
											action="targetDeduplication_search-commercial" 
											actionListener="#{targetDeduplication.onEditSearch}"
											value="#{bundle.commercial_target_deduplication_module}">
										</aon:commandLink>
									</aon:div>									
								</aon:div>								
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_marketing_communications"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-marketing">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_communications}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="marketingCampaign"
										action="marketingCampaign_list"
										actionListener="#{marketingCampaign.onSearch}"
										value="#{bundle.marketing_campaign_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="communicationCenter"
										action="communicationCenter"
										actionListener="#{communicationCenter.onInit}"
										value="#{bundle.commercial_communication_center_module}" />										
								</aon:div>
								<aon:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="surveyResponse"
											action="surveyResponse_search"
											actionListener="#{surveyResponse.onEditSearch}"
											value="#{bundle.marketing_survey_response_module}" />
									</aon:div>
								</aon:if>
							</aon:div>								
						</aon:panelGrid>

						<aon:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_statistics" styleClass="aon-width-all"
								columnClasses="aon-padding"
								headerClass="aon-icon-statistics aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statCategory"
											action="commercial_category_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.stat_report_commercial_category}">
											<aon:actionListener method="#{commercialStat.onCategoryType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statZone"
											action="commercial_geozone_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.stat_report_commercial_geozone}">
											<aon:actionListener method="#{commercialStat.onGeozoneType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statSeller"
											action="commercial_seller_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.stat_report_commercial_seller}">
											<aon:actionListener method="#{commercialStat.onSellerType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statTarget"
											action="commercial_target_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.stat_report_commercial_target}">
											<aon:actionListener method="#{commercialStat.onTargetType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statProduct"
											action="commercial_product_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{bundle.stat_report_commercial_product}">
											<aon:actionListener method="#{commercialStat.onProductType}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
						
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_commercial_templates"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_templates}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercialTerm"
											action="commercialTerm"
											actionListener="#{commercialTerm.onSearch}" 
											value="#{bundle.commercial_term_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="htmlTemplate" 
											action="htmlTemplate_list"
											actionListener="#{htmlTemplate.onEditSearch}"
											value="#{bundle.marketing_html_template_module}" />
									</aon:div>															
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="marketingTemplate-commercial"
											action="marketingTemplate_list-commercial"
											actionListener="#{marketingTemplate.onSearch}" 
											value="#{bundle.marketing_template_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">																										
										<aon:commandLink id="images-commercial" 
											action="#{companyImages.initialAction}" 
											actionListener="#{companyImages.onEditSearch}"
											value="#{bundle.company_images_module}">
											<aon:actionListener method="#{companyImages.onSearch}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</aon:if>

						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_commercial_survey"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-task">
								<f:facet name="header">
									<aon:outputText value="#{bundle.marketing_survey_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="question-commercial"
											action="question_list-commercial"
											actionListener="#{question.onSearch}"
											value="#{bundle.registry_question_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="surveyResponse-commercial"
											action="surveyResponse_list-commercial"
											actionListener="#{surveyResponse.onSearch}"
											value="#{bundle.marketing_survey_response_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="survey-commercial"
											action="survey_list-commercial"
											actionListener="#{survey.onSearch}" 
											value="#{bundle.marketing_survey_module}" />
									</aon:div>								
								</aon:div>
							</aon:panelGrid>
						</aon:if>

						<aon:if test="#{aonRole.admin}">
							<aon:panelGrid id="group_agent_comisiones"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-warehouse aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="comisiones" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">			
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercial-commision-calculation"
											action="commissionCalculation"
											actionListener="#{commissionCalculation.onInitialize}" 
											value="#{bundle.commercial_commission_calculation_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="offer-detail-commision" 
											action="offerDetailCommission_search"
											actionListener="#{offerDetailCommission.onEditSearch}"
											value="#{bundle.commercial_commission_control_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commission-type" 
											action="commissionType_list"
											actionListener="#{commissionType.onSearch}"
											value="#{bundle.commercial_commission_type_module}" />
									</aon:div>									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commission" 
											action="commission_search"
											actionListener="#{commission.onEditSearch}"
											value="#{bundle.commercial_commission_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>								
					</aon:panelGroup>					

				</h:panelGrid>

			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
