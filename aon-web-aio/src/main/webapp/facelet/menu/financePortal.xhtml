<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="financePortalMenu">
			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:if test="#{aonRole.saleOperator}">
							<aon:panelGrid id="group_sales_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-sales aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_sales}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="customer-financePortal"
											action="customer_search-financePortal"
											actionListener="#{customer.onEditSearch}"
											value="#{bundle.customer_finance_checking}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleInvoice-financePortal"
											action="saleInvoice_search-financePortal"
											actionListener="#{saleInvoice.onEditSearch}"
											value="#{bundle.finance_sale_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="invoicePrint-financePortal"
											action="invoicePrint_search-financePortal"
											actionListener="#{invoicePrint.onEditSearch}"
											value="#{bundle.finance_invoice_print_module}"/>
									</aon:div>			
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>				
					
					<aon:panelGroup>
						<aon:if test="#{aonRole.purchaseOperator}">
							<aon:panelGrid id="group_purchase_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-purchase aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_purchases}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="supplier-financePortal" 
											action="supplier_search-financePortal"
											actionListener="#{supplier.onEditSearch}"
											value="#{bundle.aon_suppliers}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseInvoice-financePortal"
											action="purchaseInvoice_search-financePortal"
											actionListener="#{purchaseInvoice.onEditSearch}"
											value="#{bundle.finance_purchase_invoice_management_module}" />
									</aon:div>
									<aon:if test="#{aonRole.productOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="product-financePortal"
												action="product_search-financePortal"
												actionListener="#{product.onEditSearch}"
												value="#{bundle.aon_role_product}" />
										</aon:div>
									</aon:if>							
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:if test="#{aonRole.purchaseOperator}">				
							<aon:panelGrid id="group_expenses_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-expenses aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_expenses}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="creditor-financePortal" 
											action="creditor_search-financePortal"
											actionListener="#{creditor.onEditSearch}"
											value="#{bundle.finance_creditor_module}" >
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseInvoice-financePortal"
											action="expenseInvoice_search-financePortal"
											actionListener="#{expenseInvoice.onEditSearch}"
											value="#{bundle.finance_expense_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="undeductibleInvoice-financePortal"
											action="undeductibleInvoice_search-financePortal"
											actionListener="#{undeductibleInvoice.onEditSearch}"
											value="#{bundle.finance_undeductible_invoice_management_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>								

					<aon:panelGroup>						
						<aon:if test="#{aonRole.financeOperator}">
							<aon:panelGrid id="group_treasury_charge_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-charge aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_charge_menu}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financeCharge-financePortal"
											action="finance_search-charge-financePortal"
											actionListener="#{finance.onEditSearchCharge}"
											value="#{bundle.finance_charge_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fbatchCharge-financePortal" 
											action="fbatch_search-charge-financePortal"
											actionListener="#{fbatch.onEditSearchCharge}"
											value="#{bundle.finance_fbatch_charge_module}">
											<f:setPropertyActionListener target="#{fbatch.payroll}"
												value="#{false}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:if test="#{aonRole.financeOperator}">
							<aon:panelGrid id="group_treasury_payment_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-payment aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_payment_menu}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financePayment-financePortal"
											action="finance_search-payment-financePortal"
											actionListener="#{finance.onEditSearchPayment}"
											value="#{bundle.finance_payment_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fbatchPayment-financePortal" 
											action="fbatch_search-payment-financePortal"
											actionListener="#{fbatch.onEditSearchPayment}"
											value="#{bundle.finance_fbatch_payment_module}">
											<f:setPropertyActionListener target="#{fbatch.payroll}"
												value="#{false}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>			

					<aon:panelGroup>
						<aon:if test="#{aonRole.financeOperator}">
							<aon:panelGrid id="group_treasury_forecast_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-forecast aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_forecast_menu}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:if test="#{cashFlowForecast.availableRegistryBanks > 0}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="cashFlowForecast-financePortal"
												action="cashFlowForecast_search-financePortal"
												actionListener="#{cashFlowForecast.onEditSearch}"
												value="#{bundle.finance_cashflow_forecast_module}"/>
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="cashFlowForecastReport-financePortal"
												action="cashFlowForecastReport_search-financePortal"
												actionListener="#{cashFlowForecastReport.onEditSearch}"
												value="#{bundle.finance_cashflow_forecast_report_module}"/>
										</aon:div>
									</aon:if>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>							

					<aon:panelGroup>
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_auxiliary_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-config">
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.menu_auxiliary_tables}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="payMethod-financePortal"
											action="payMethod-financePortal"
											value="#{bundle.config_paymethod_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="geotreeParent_list-financePortal"
											action="geotreeParent_list-financePortal"
											actionListener="#{geotreeParent.onSearch}"
											value="#{bundle.geozone_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="segment_form-financePortal"
											action="segment_form-financePortal"
											value="#{bundle.registry_segment_module}" />
									</aon:div>				
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="productCategory-financePortal"
											action="productCategory-financePortal"
											value="#{bundle.aon_categories}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>					

					<aon:panelGroup>
						<aon:if test="#{aonRole.fiscal}">
							<aon:panelGrid id="group_taxes_financePortal"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-aeat aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.config_tax_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="vat_report-financePortal"
											action="vat_report_search-financePortal"
											actionListener="#{vatReport.onReset}"
											value="#{bundle.finance_vat_report_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="retention_report-financePortal"
											action="retention_report_search-financePortal"
											actionListener="#{retentionReport.onReset}"
											value="#{bundle.fiscal_retention_report_module}" />
									</aon:div>	
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_sii-financePortal"
											action="gwt_sii-financePortal"
											title="SII - Suministro Inmediato de Información"
											value="SII - Suministro Inmediato de Información" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
						<aon:if test="#{aonRole.financeOperator or aonRole.accountingOperator}">
							<aon:panelGrid id="group_conecta_financePortal" styleClass="aon-width-all"
								columnClasses="aon-padding"
								headerClass="aon-icon-accounting aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_conecta_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:if test="#{aonRole.financeOperator and bankStatement.availableRegistryBanks > 0}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="bankStatement-financePortal"
												action="bankStatement_search-financePortal"
												actionListener="#{bankStatement.onEditSearch}"
												value="#{bundle.finance_bank_statement_module}"/>
										</aon:div>
									</aon:if>
									<aon:if test="#{aonRole.accountingOperator and domainSwitcher.parentDomainUserInChildDomain}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="invoiceExporter-financePortal"
												action="#{exporter.initialAction}"
												actionListener="#{exporter.onInit}"
												value="#{bundle.finance_invoiceExport_module}">
												<aon:actionListener
													method="#{invoiceExporter.onEditSearch}" />
												<f:setPropertyActionListener value="invoiceExporter_search"
													target="#{exporter.backAction}" />
											</aon:commandLink>
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="financeExporter-financePortal"
												action="#{exporter.initialAction}"
												actionListener="#{exporter.onInit}"
												value="#{bundle.finance_account_export_module}">
												<aon:actionListener
													method="#{financeExporter.onEditSearch}" />
												<f:setPropertyActionListener value="financeExporter_search"
													target="#{exporter.backAction}" />
											</aon:commandLink>
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="fbatchExporter-financePortal"
												action="#{exporter.initialAction}"
												actionListener="#{exporter.onInit}"
												value="#{bundle.fbatch_account_export_module}">
												<aon:actionListener
													method="#{fbatchExporter.onEditSearch}" />
												<f:setPropertyActionListener value="fbatchExporter_search"
													target="#{exporter.backAction}" />
											</aon:commandLink>
										</aon:div>
									</aon:if>											
								</aon:div>
							</aon:panelGrid>
						</aon:if>																
					</aon:panelGroup>					

					<aon:panelGroup>
						<aon:panelGrid id="group_utilities_financePortal" styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-accounting aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:if test="#{aonRole.accountingOperator and (domainSwitcher.parentDomainUserInChildDomain or domainSwitcher.parentDomain) and !actionDenied.moduleEnabled['accounting']}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="account-financePortal"
											action="account_list-financePortal"
											value="#{bundle.account_module}" />
									</aon:div>
								</aon:if>
								<aon:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="globalConfiguration-financePortal"
											action="globalConfig_form-financePortal"
											actionListener="#{globalConfig.onInit}"
											value="#{bundle.admin_global_configuration}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aonLoader-financePortal"
											action="aonLoader_form-financePortal"
											actionListener="#{aonLoader.onStart}"
											value="#{bundle.aon_loader_module}" />
									</aon:div>										
								</aon:if>
								<aon:if test="#{aonRole.ESignature and company.EInvoice and certificate.certificateCount > 0}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleInvoiceSigner-financePortal"
											action="invoiceSigner_search-financePortal"
											actionListener="#{invoiceSigner.onEditSearch}"
											value="#{bundle.finance_invoice_signing_module}"/>
									</aon:div>								
								</aon:if>
								<aon:if test="#{aonRole.statisticsOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_invoiceStats-financePortal"
											action="gwt_invoiceStat-financePortal"
											title="#{bundle.aon_role_statistics}"
											value="#{bundle.aon_role_statistics}" />												
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
						
				</h:panelGrid>
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
