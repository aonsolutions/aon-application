<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="commercialMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
	
					<aon:panelGroup>	
						<c:if test="#{aonRole.commercialOperator}">
							<aon:panelGrid id="group_commercial_agenda"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-commercial aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{commercialBundle.commercial_agenda_module}" />
								</f:facet>							
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercialOperation"
											action="projectCommercial_search"
											actionListener="#{projectCommercial.onEditSearch}"
											value="#{commercialBundle.commercial_operation_module}" />
									</aon:div>															
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercialTracking"
											action="commercialTracking_search"
											actionListener="#{commercialTracking.onEditSearch}"
											value="#{commercialBundle.commercial_tracking_module}" />
									</aon:div>
									<c:if test="#{aonRole.config}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="commercialActivity"
												action="commercialActivity"
												actionListener="#{commercialActivity.onSearch}" 
												value="#{commercialBundle.commercial_activity_module}" />
										</aon:div>
									</c:if>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						
						<aon:panelGrid id="group_commercial_commercial"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-offer aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{commercialBundle.commercial_offers_module}"/>
							</f:facet>						
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="offer" 
										action="offer_search"
										actionListener="#{offer.onEditSearch}"
										value="#{commercialBundle.commercial_offer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="sales-commercial" 
										action="sales_search-commercial"
										actionListener="#{sales.onEditSearch}"
										value="#{salesBundle.sales_module}" />
								</aon:div>
								<c:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercialTerm"
											action="commercialTerm"
											actionListener="#{commercialTerm.onSearch}" 
											value="#{commercialBundle.commercial_term_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_commercial_masters"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_master_tables}" />
							</f:facet>
							<c:if test="#{aonRole.commercialOperator}">
								<aon:div styleClass="aon-direct-access-list">							
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="target-commercial" 
											action="target_search-commercial" 
											actionListener="#{target.onEditSearch}"
											value="#{commercialBundle.commercial_target_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="seller-commercial" 
											action="seller_search-commercial" 
											actionListener="#{seller.onEditSearch}"
											value="#{sellerBundle.seller_module}" />
									</aon:div>
								</aon:div>								
							</c:if>							
						</aon:panelGrid>						

						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_commercial_survey"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-reservation">
								<f:facet name="header">
									<aon:outputText value="#{marketingBundle.marketing_survey_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="question-commercial"
											action="question_list-commercial"
											actionListener="#{question.onSearch}"
											value="#{registryBundle.registry_question_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="surveyResponse-commercial"
											action="surveyResponse_list-commercial"
											actionListener="#{surveyResponse.onSearch}"
											value="#{marketingBundle.marketing_survey_response_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="survey-commercial"
											action="survey_list-commercial"
											actionListener="#{survey.onSearch}" 
											value="#{marketingBundle.marketing_survey_module}" />
									</aon:div>								
								</aon:div>
							</aon:panelGrid>
						</c:if>

						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_commercial_templates"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{marketingBundle.marketing_template_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="marketingTemplate-commercial"
											action="marketingTemplate_list-commercial"
											actionListener="#{marketingTemplate.onSearch}" 
											value="#{marketingBundle.marketing_template_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">																										
										<aon:commandLink id="images-commercial" 
											action="companyImages-commercial" 
											actionListener="#{companyWebInfo.onInit}"
											value="#{companyBundle.company_images_module}">
											<aon:actionListener method="#{companyImages.onCancel}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</c:if>

					</aon:panelGroup>					

					<aon:panelGroup>
						<c:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_statistics_mando"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-task aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{statBundle.seller_stat_control}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl2"
											action="commercial_search_view-seller"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.seller_stat_control_seller}">
											<aon:actionListener method="#{commercialStat.onSellerType}" />
										</aon:commandLink>
									</aon:div>
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl3"
											action="commercial_search_view-target"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.seller_stat_control_target}">
											<aon:actionListener method="#{commercialStat.onTargetType}" />
										</aon:commandLink>
									</aon:div>
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl4"
											action="commercial_search_view-product"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.seller_stat_control_product}">
											<aon:actionListener method="#{commercialStat.onProductType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sellerControl5"
											action="commercial_search_view-category"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.seller_stat_control_category}">
											<aon:actionListener method="#{commercialStat.onCategoryType}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
	
							<aon:panelGrid id="group_statistics" styleClass="aon-width-all"
								columnClasses="aon-padding"
								headerClass="aon-icon-statistics aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statCategory"
											action="commercial_category_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.stat_report_commercial_category}">
											<aon:actionListener method="#{commercialStat.onCategoryType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statZone"
											action="commercial_geozone_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.stat_report_commercial_geozone}">
											<aon:actionListener method="#{commercialStat.onGeozoneType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statSeller"
											action="commercial_seller_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.stat_report_commercial_seller}">
											<aon:actionListener method="#{commercialStat.onSellerType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statTarget"
											action="commercial_target_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.stat_report_commercial_target}">
											<aon:actionListener method="#{commercialStat.onTargetType}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="statProduct"
											action="commercial_product_stat_search"
											actionListener="#{commercialStat.onReset}"
											value="#{statBundle.stat_report_commercial_product}">
											<aon:actionListener method="#{commercialStat.onProductType}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						
						<c:if test="#{aonRole.admin}">
							<aon:panelGrid id="group_agent_comisiones"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-warehouse aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="comisiones" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">			
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commercial-commision-calculation"
											action="commissionCalculation"
											actionListener="#{commissionCalculation.onInitialize}" 
											value="#{commercialBundle.commercial_commission_calculation_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="offer-detail-commision" 
											action="offerDetailCommission_search"
											actionListener="#{offerDetailCommission.onEditSearch}"
											value="#{commercialBundle.commercial_commission_control_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commission-type" 
											action="commissionType_list"
											actionListener="#{commissionType.onSearch}"
											value="#{commercialBundle.commercial_commission_type_module}" />
									</aon:div>									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="commission" 
											action="commission_search"
											actionListener="#{commission.onEditSearch}"
											value="#{commercialBundle.commercial_commission_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>								
						
					</aon:panelGroup>					
					
				</h:panelGrid>

			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
