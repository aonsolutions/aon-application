<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="fiscalMenu">

			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid columns="2" styleClass="aon-width-all" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>

						<c:if test="#{domainSwitcher.domainManagementAvailable}">
							<aon:panelGrid id="group_fiscal_fiscal_batch"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-renameFolder aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.registry_batch_document}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fiscalBatch"
											action="fiscalBatch_search"
											actionListener="#{fiscalBatch.onEditSearch}"
											value="#{bundle.registry_batch_document}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>

						<aon:panelGrid id="group_fiscal_vat_tax_statement"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-invoice aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.fiscal_vat_tax_module2}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="vatTax" 
											action="vatTax_search"
											actionListener="#{vatTax.onEditSearch}"
											value="#{bundle.fiscal_model_303_module}">
											<aon:outputText value=" / Mod. 390 - Haciendas forales." />
										</aon:commandLink>
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="gwt_mod390"
										action="gwt_mod390"
										value="Mod. 390 - AEAT Resumen Anual I.V.A.">
										<!-- 
										<aon:outputText value=" (Beta.)" style="background-color: yellow;"/>
										 -->
									</aon:commandLink>
								</aon:div>
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod_340_report" 
											action="mod340_search"
											actionListener="#{mod340.onReset}"
											value="#{bundle.fiscal_model_340_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod347_report" 
											action="mod347_list"
											actionListener="#{mod347.onEditSearch}"
											value="#{bundle.fiscal_mod347_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod349_report" 
											action="mod349_list"
											actionListener="#{mod349.onEditSearch}" 
											value="#{bundle.fiscal_model_349_module}" />
									</aon:div>
								</c:if>																
							</aon:div>
						</aon:panelGrid>
						
						<c:if test="#{!domainSwitcher.domainManagementAvailable}">
							<aon:panelGrid id="group_fiscal_modules_module"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-tree-root aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.fiscal_modules_module}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fiscalActivity" 
											action="fiscalActivity_list"
											actionListener="#{fiscalActivity.onSearch}"
											value="#{bundle.fiscal_activities_modules}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod310" 
											action="mod310_search"
											actionListener="#{mod310.onEditSearch}"
											value="#{bundle.fiscal_model_310_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod131" 
											action="mod131_search"
											actionListener="#{mod131.onEditSearch}"
											value="#{bundle.fiscal_model_131_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						
						<aon:panelGrid id="group_fiscal_retention_tax_statement"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.fiscal_retention_tax_module}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod115" 
											action="mod115_search"
											actionListener="#{mod115.onEditSearch}"
											value="#{bundle.fiscal_model_115_module}" />
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="gwt_mod180"
										action="gwt_mod180"
										value=" Mod. 180 - Resumen anual de retenciones por alquileres ">
										<!-- 
										<aon:outputText value="(Beta)" style="background-color: yellow;"/>
										 -->
									</aon:commandLink>
								</aon:div>
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod111-fiscal" 
											action="mod111_search-fiscal"
											actionListener="#{mod111.onEditSearch}"
											value="#{bundle.fiscal_model_111_module}" />
									</aon:div>
								</c:if>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="gwt_mod190"
										action="gwt_mod190"
										value=" Mod. 190 - Resumen anual de retenciones e ingresos a cuenta ">
										<!-- 
										<aon:outputText value="(Beta)" style="background-color: yellow;"/>
										 -->
									</aon:commandLink>
								</aon:div>
								<c:if test="#{!domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod123" 
											action="mod123_search"
											actionListener="#{mod123.onEditSearch}"
											value="#{bundle.fiscal_model_123_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mod130" 
											action="mod130_search"
											actionListener="#{mod130.onEditSearch}"
											value="#{bundle.fiscal_model_130_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>	
					</aon:panelGroup>
					
					<aon:panelGroup>
						
						<c:if test="#{domainSwitcher.domainManagementAvailable}">
							<aon:panelGrid id="group_fiscal_accounting"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-account-entry aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_module_accounting}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="account-fiscal"
											action="account_list-fiscal"
											value="#{bundle.account_module}" />
									</aon:div>
									<c:if test="#{aonRole.config}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="autConcept-fiscal"
												action="autConcept-fiscal"
												value="#{bundle.accounting_aut_concept_module}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="accounting_balance-fiscal" 
												action="balance_list-fiscal"
												value="#{bundle.accounting_balance_menu2}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="amortizationType-fiscal"
												action="amortizationType_list-fiscal"
												value="#{bundle.accounting_amortization_type_module}" />
										</aon:div>
									</c:if>
								</aon:div>
							</aon:panelGrid>
						</c:if>
	
						<c:if test="#{!domainSwitcher.domainManagementAvailable}">
							<aon:panelGrid id="group_fiscal_mercantile_registry"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-registradores aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.fiscal_mercantile_registry}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="accountingBook_report"
											action="accountingBook_search"
											actionListener="#{accountingBook.onReset}"
											value="#{bundle.accounting_book_module}" />
									</aon:div>
	
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="annualFinancialStatements_report"
											action="annualFinancialStatements_search"
											actionListener="#{annualFinancialStatements.onReset}"
											value="#{bundle.accounting_annual_financial_statements_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>

							<aon:panelGrid id="group_fiscal_reports"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-balance aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.menu_reports_annual}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="report_template"
											action="reportAttach_form"
											actionListener="#{reportAttach.onSearch}"
											value="#{bundle.accounting_reports_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="report_launcher"
											action="reports_launcher"
											actionListener="#{reportsLauncher.onReset}"
											value="#{bundle.accounting_reports_launcher_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<a4j:commandLink ajaxSingle="true" immediate="true"
											onclick="alert('#{bundle.aio_not_yet}');return false;" 
											value="Memoria normalizada" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>

							<aon:panelGrid id="group_fiscal_accounting_entry_generation"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-account-entry aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.fiscal_accounting_entry_generation}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleInvoiceRecorder-fiscal"
											action="saleInvoiceRecorder_search-fiscal"
											actionListener="#{saleInvoiceRecorder.onEditSearch}"
											value="#{bundle.finance_sale_invoice_recording_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseInvoiceRecorder-fiscal"
											action="purchaseInvoiceRecorder_search-fiscal"
											actionListener="#{purchaseInvoiceRecorder.onEditSearch}"
											value="#{bundle.finance_purchase_invoice_recording_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseInvoiceRecorder-fiscal"
											action="expenseInvoiceRecorder_search-fiscal"
											actionListener="#{expenseInvoiceRecorder.onEditSearch}"
											value="#{bundle.finance_expense_invoice_recording_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="undeductibleInvoiceRecorder-fiscal"
											action="undeductibleInvoiceRecorder_search-fiscal"
											actionListener="#{undeductibleInvoiceRecorder.onEditSearch}"
											value="#{bundle.finance_undeductible_invoice_recording_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financeTrackingEntry-fiscal"
											action="financeTrackingEntry_form-fiscal"
											actionListener="#{financeTrackingEntry.onReset}"
											value="#{bundle.accounting_entry_finance_tracking_module}" />
									</aon:div>								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="accPeriod-fiscal" 
											action="accPeriod-fiscal"
											actionListener="#{accPeriod.onSearch}"
											value="#{bundle.accounting_period_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						
						<aon:panelGrid id="group_fiscal_sociedades"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-balance aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.fiscal_corporation_module}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<a4j:commandLink ajaxSingle="true" immediate="true"
										onclick="alert('#{bundle.aio_not_yet}');return false;" 
										value="#{bundle.fiscal_model_200_module}"/>
								</aon:div>																
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
