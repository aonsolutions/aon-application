<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="marketingMenu">

			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGrid id="group_asset" styleClass="aon-width-all"
						columnClasses="aon-padding"
						headerClass="aon-icon-query aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_asset_main}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink value="#{assetBundle.asset_reservation_main}" id="activityReservation"
									immediate="true" action="activityReservation_form">
									<aon:actionListener method="#{assetCalendar.onInitialize}" />
									<aon:actionListener
										method="#{activityDialog.onInitializeRequest}" />
								</aon:commandLink>
							</aon:div>
							<c:if test="#{aonRole.config}">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="asset" 
										value="#{assetBundle.asset_asset_main}"
										action="asset_list" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="assetActivity" 
										value="#{assetBundle.asset_activity_main}"
										immediate="true" action="activityDialog_grid">
										<aon:actionListener method="#{activityDialog.onInitialize}" />
										<aon:actionListener
											method="#{activityBasic.initializePendingList}" />
									</aon:commandLink>
								</aon:div>
							</c:if>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="assetStatistic" 
									value="#{assetBundle.asset_statistic_main}"
									immediate="true" actionListener="#{assetStat.onInitialize}"
									action="stat_form" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
					
					<aon:panelGroup/>
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
