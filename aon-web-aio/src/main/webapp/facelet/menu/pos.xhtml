<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="posMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_pos"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-pos aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_pos_module}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="pos_opening-tpv" 
										action="posOpening_form-tpv"
										actionListener="#{posOpening.onInit}"
										value="#{pmsBundle.pms_posOpening_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="pos_closing-tpv" 
										action="posClosing_form-tpv"
										actionListener="#{posClosing.onInit}" 
										value="#{pmsBundle.pms_posCashCount_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="pos_invoice" 
										action="posInvoice_form"
										actionListener="#{posInvoice.onReset}" 
										value="#{financeBundle.finance_pos_invoice_management_module}" />
								</aon:div>
								<c:if test="#{aonRole.financeOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="pos_finance_bath-tpv" 
											action="posFinance_search-tpv"
											actionListener="#{posFinance.onEditSearch}"
											value="#{pmsBundle.pms_posFinance_module}" />
									</aon:div>
								</c:if>
							</aon:div>							
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
						<aon:panelGrid id="group_pos_auxiliaries"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_auxiliaries}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="posDefinition-tpv" 
											action="pos_search-tpv"
											actionListener="#{pos.onEditSearch}"
											value="#{financeBundle.finance_pos_definition_module}" />
									</aon:div>
								</c:if>
								<c:if test="#{aonRole.admin or aonRole.config or aonRole.saleOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="posShift-tpv" 
											action="posShift_search-tpv"
											actionListener="#{posShift.onEditSearch}"
											value="#{pmsBundle.pms_posShift_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>													
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
