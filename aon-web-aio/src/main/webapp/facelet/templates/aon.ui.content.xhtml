<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:insert name="messages" >
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />
	</ui:insert>
	
	<aon:if test="#{!userUtils.newAONTheme}">
		<ui:insert name="menu" >
			<ui:include src="/facelet/homepage/menu.xhtml" />
		</ui:insert>
	</aon:if>
	
	<aon:componentGroup
		family="javax.faces.Command"
		rendered="#{aonRole.guest}"
		method="#{aonRole.renderedCommand}">
 	 	
 	 	<aon:if test="#{!userUtils.newAONTheme}">				
			<aon:div style="overflow: auto; height: calc(100vh - 103px)" id="contentScrollDiv" >
				<ui:insert name="content" />
			</aon:div>
			
			<aon:div>
			
		    <script>
                 window.GPTTConfig = {
                 uuid: "bd9ed844ccc940a5a477e4c2b6f5f59e",
                 token: "token=#{dur.generateToken()}" 
                 }
                 
            </script>
            <script src="https://app.gpt-trainer.com/widget-asset.min.js" defer="true" domain="#{domainSwitcher.domainNameURL}"> </script>
			
				
			
			</aon:div>
		</aon:if>
	  	
	  	<aon:if test="#{userUtils.newAONTheme}">
	  		<aon:panelGrid columns="2" 
	  			styleClass="aon-width-all aon-height-all"
				columnClasses="aon-none aon-width-min,aon-none aon-width-all">
				<aon:div style="overflow: auto; height: calc(100vh - 66px); width: min-content;" id="sidebarScrollDiv" >
					<ui:insert name="sidebar" >
						<ui:include src="/facelet/new/sidebar.xhtml" />
					</ui:insert>
				</aon:div>
				<aon:div style="overflow: auto; height: calc(100vh - 66px)" id="contentScrollDiv" >
					<ui:insert name="content" />
				</aon:div>
			</aon:panelGrid>				
		</aon:if>
	
	</aon:componentGroup>

</ui:composition>
