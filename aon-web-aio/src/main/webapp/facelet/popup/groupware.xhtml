<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="groupwareMenuPopup" style="display:none" 
	onclick="javascript:selectItemHeader(this.id)"
	onmouseout="javascript:hideMenuPopup(this.id)" 
	onmouseover="javascript:showMenuPopup(this.id)" >

		<aon:form id="groupwareMenuForm">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_project_management"
							rendered="#{actionDenied.renderedGroup('group_project_management')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-statistics">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_groupware}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="project"
										rendered="#{actionDenied.renderedOption('project_search')}"
										action="project_search"
										actionListener="#{project.onEditSearch}"
										value="#{bundle.aon_module_groupware}" />
								</aon:div>
								<aon:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="project_type"
											rendered="#{actionDenied.renderedOption('projectType_list')}"
											action="projectType_list"
											actionListener="#{projectType.onSearch}"
											value="#{bundle.project_project_type}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="activity_type"
											rendered="#{actionDenied.renderedOption('activityTypeStandalone_grid')}"
											action="activityTypeStandalone_grid"
											actionListener="#{activityTypeStandalone.onSearch}"
											value="#{bundle.project_activity_type}" />
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:panelGrid>
					
						<aon:panelGrid id="group_general_task"
							rendered="#{actionDenied.renderedGroup('group_general_task')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-task">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_tasks}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="groupware_taskInbox"
										rendered="#{actionDenied.renderedOption('task_list')}"
										action="task_list"
										actionListener="#{task.onLaunch}"
										value="#{bundle.groupware_task_inbox}" />
								</aon:div>
								<aon:if test="#{aonRole.statisticsOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="groupware_gantt"
											rendered="#{actionDenied.renderedOption('gantt_form')}"
											action="gantt_form"
											actionListener="#{gantt.onLaunch}"
											value="#{bundle.groupware_gantt_diagram}" />
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:panelGrid>
					
						<aon:panelGrid id="group_general_dailyTracking"
							rendered="#{actionDenied.renderedGroup('group_general_dailyTracking')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-version">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_daily_tracking_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="groupware_dailyTracking"
										rendered="#{actionDenied.renderedOption('dailyTracking_form')}"
										action="dailyTracking_form"
										actionListener="#{dailyTracking.onReset}"
										value="#{bundle.aon_daily_tracking_module}" />
								</aon:div>
								<aon:if test="#{aonRole.statisticsOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="groupware_dailyTracking_reports"
											rendered="#{actionDenied.renderedOption('daily_tracking_report')}"
											actionListener="#{dailyTrackingReport.onResetReportSearch}"
											action="daily_tracking_report"
											value="#{bundle.aon_reports}" />
									</aon:div>
								</aon:if>
								<aon:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="groupware_job_type"
											rendered="#{actionDenied.renderedOption('job_type')}"
											action="job_type"
											value="#{bundle.aon_job_type_module}" />
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<aon:if test="#{aonRole.config or aonRole.taskMonitor}">
						<aon:panelGroup>
							<aon:panelGrid id="group_general_processes"
								rendered="#{actionDenied.renderedGroup('group_general_processes')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-tree-root">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_processes}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:if test="#{aonRole.config}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="groupware_process"
												rendered="#{actionDenied.renderedOption('process_list')}"
												action="process_list"
												actionListener="#{process.onSearch}"
												value="#{bundle.aon_processes}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="groupware_processTransitionType"
												rendered="#{actionDenied.renderedOption('process_transition_type')}"
												action="process_transition_type"
												actionListener="#{processTransitionType.onSearch}"
												value="#{bundle.groupware_process_transition_types}" />
										</aon:div>
									</aon:if>
									<aon:if test="#{aonRole.taskMonitor}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="groupware_process_launcher"
												action="#{processWizard.start}"
												value="#{bundle.groupware_process_launcher}" />
										</aon:div>
									</aon:if>
								</aon:div>
							</aon:panelGrid>
	
							<aon:panelGrid id="group_general_campaigns"
								rendered="#{actionDenied.renderedGroup('group_general_campaigns')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-campaign">
								<f:facet name="header">
									<aon:outputText value="#{bundle.groupware_campaigns}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:if test="#{aonRole.taskMonitor}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="groupware_campaigns"
												rendered="#{actionDenied.renderedOption('campaign_search')}"
												action="campaign_search"
												actionListener="#{campaign.onEditSearch}"
												value="#{bundle.groupware_campaign_monitor}" />
										</aon:div>
									</aon:if>
									<aon:if test="#{aonRole.config}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="groupware_campaignTypes"
												rendered="#{actionDenied.renderedOption('campaign_type')}"
												action="campaign_type"
												actionListener="#{campaignType.onSearch}"
												value="#{bundle.groupware_campaign_types}" />
										</aon:div>
									</aon:if>
								</aon:div>
							</aon:panelGrid>
	
							<aon:if test="#{aonRole.config}">
								<aon:panelGrid id="group_general_taskHolders"
									rendered="#{actionDenied.renderedGroup('group_general_taskHolders')}"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-direct-access-panel aon-icon-contactGroup">
									<f:facet name="header">
										<aon:outputText value="#{bundle.groupware_user_management}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="taskHolder-management"
												rendered="#{actionDenied.renderedOption('taskHolder_search')}"
												action="taskHolder_search"
												actionListener="#{taskHolder.onEditSearch}"
												value="#{bundle.groupware_taskHolders}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="workgroup-management"
												rendered="#{actionDenied.renderedOption('workgroup_list')}"
												action="workgroup_list"
												actionListener="#{workGroup.onEditSearch}"
												value="#{bundle.config_workgroup_module}" />
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="costProfile-management"
												rendered="#{actionDenied.renderedOption('costProfile_list')}"
												action="costProfile_list"
												actionListener="#{costProfile.onSearch}"
												value="#{bundle.groupware_cost_profiles}" />
										</aon:div>
									</aon:div>
								</aon:panelGrid>
							</aon:if>
						</aon:panelGroup>
					</aon:if>
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</aon:div>
</ui:composition>
