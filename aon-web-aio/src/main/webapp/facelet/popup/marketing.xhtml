<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="marketingMenuPopup" style="display:none" 
	onclick="javascript:selectItemHeader(this.id)"
	onmouseout="javascript:hideMenuPopup(this.id)" 
	onmouseover="javascript:showMenuPopup(this.id)" >

		<aon:form id="marketingMenuForm">
		
			<aon:div styleClass="aon-scroll-area">		
				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-200
				             , aon-vertical-align-top aon-width-200
				             , aon-vertical-align-top aon-width-200">
					<aon:panelGroup>	
						<aon:panelGrid id="group_marketing_news"
							rendered="#{actionDenied.renderedGroup('group_marketing_news')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-report aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_news_module}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">	
								<!-- Mensajes -->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="news_messages"
										rendered="#{actionDenied.renderedOption('news_list-messages')}"
										action="news_list-messages"
										actionListener="#{news.onSetTypeMessage}"
										value="#{bundle.aon_messages}">
										<aon:actionListener method="#{news.onEditSearch}" />
										<aon:actionListener method="#{news.onSearch}" />
									</aon:commandLink>
								</aon:div>
								
								<!-- Noticias -->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="news_news"
										rendered="#{actionDenied.renderedOption('news_list-news')}"
										action="news_list-news"
										actionListener="#{news.onSetTypeNews}"
										value="#{bundle.marketing_newss}">
										<aon:actionListener method="#{news.onEditSearch}" />
										<aon:actionListener method="#{news.onSearch}" />
									</aon:commandLink>
								</aon:div>
								
								<!-- Boletines -->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="newsletter"
										rendered="#{actionDenied.renderedOption('newsletter_list')}"
										action="newsletter_list"
										actionListener="#{newsletter.onSearch}"
										value="#{bundle.marketing_newsletter_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
	
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_commercial_templates"
								rendered="#{actionDenied.renderedGroup('group_commercial_templates')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_templates}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<!-- Cabeceras y Pies de Plantilla -->
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="htmlTemplate" 
											rendered="#{actionDenied.renderedOption('htmlTemplate_list')}"
											action="htmlTemplate_list"
											actionListener="#{htmlTemplate.onEditSearch}"
											value="#{bundle.marketing_html_template_module}" />
									</aon:div>					
											
									<!-- Plantillas de Correo -->								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="marketingTemplate-commercial"
											rendered="#{actionDenied.renderedOption('marketingTemplate_list-commercial')}"
											action="marketingTemplate_list-commercial"
											actionListener="#{marketingTemplate.onSearch}" 
											value="#{bundle.marketing_template_module}" />
									</aon:div>
									
									<!-- Imágenes -->
									<aon:div styleClass="aon-direct-access-list-element">																										
										<aon:commandLink id="images-commercial" 
											action="#{companyImages.initialAction}" 
											actionListener="#{companyImages.onEditSearch}"
											value="#{bundle.company_images_module}">
											<aon:actionListener method="#{companyImages.onSearch}" />
										</aon:commandLink>
									</aon:div>
									
									<!-- Personalización de Envío Email -->
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="mailProcess" 
											rendered="#{actionDenied.renderedOption('mailProcess_form')}"
											action="mailProcess_form"
											actionListener="#{mailProcess.onInit}"
											value="#{bundle.webmail_mailAccount_process}" />
									</aon:div>
								</aon:div>							
							</aon:panelGrid>
						</aon:if>
						
					</aon:panelGroup>					

					<aon:panelGroup>
						<aon:panelGrid id="group_marketing_communications"
							rendered="#{actionDenied.renderedGroup('group_marketing_communications')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-marketing">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_communications}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">	
								<!-- Campañas -->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="marketingCampaignModule" action="gwt_marketingCampaignModule"
										value="#{bundle.marketing_campaign_module}" />
								</aon:div>
								
								<!-- Campañas -->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="marketingCampaign"
										rendered="#{actionDenied.renderedOption('')}"
										action="marketingCampaign_list"
										actionListener="#{marketingCampaign.onSearch}"
										value="#{bundle.marketing_campaign_module} [Antiguo]" />
								</aon:div>
								
								<!-- Centro de Comunicaciones -->
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="communicationCenter"
										rendered="#{actionDenied.renderedOption('communicationCenter')}"
										action="communicationCenter"
										actionListener="#{communicationCenter.onInit}"
										value="#{bundle.commercial_communication_center_module}" />										
								</aon:div>
								
								<aon:div style="height: 26px;">
						
								</aon:div>
							</aon:div>								
						</aon:panelGrid>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_commercial_survey"
								rendered="#{actionDenied.renderedGroup('group_commercial_survey')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-task">
								<f:facet name="header">
									<aon:outputText value="#{bundle.marketing_survey_module}" />
								</f:facet>

								<aon:div styleClass="aon-direct-access-list">
									<!-- Preguntas -->
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="questionModule" action="gwt_questionModule"
											value="#{bundle.registry_question_module}" />
									</aon:div>
									
									<!-- Cuestionarios -->
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="survey-commercial"
											rendered="#{actionDenied.renderedOption('survey_list-commercial')}"
											action="survey_list-commercial"
											actionListener="#{survey.onSearch}" 
											value="#{bundle.marketing_survey_module}" />
									</aon:div>								
									
									<!-- Respuestas de Cuestionarios -->
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="surveyResponse"
											rendered="#{actionDenied.renderedOption('surveyResponse_search')}"
											action="surveyResponse_search"
											actionListener="#{surveyResponse.onEditSearch}"
											value="#{bundle.marketing_survey_response_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>							
					</aon:panelGroup>					
				</h:panelGrid>

			</aon:div>
				
		</aon:form>

	</aon:div>

</ui:composition>
