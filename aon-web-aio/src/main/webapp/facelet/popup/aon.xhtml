	<script type='text/javascript' >
		function showMenuPortlet(menuPortlet){
			
			document.getElementById("aonContent:mainForm:mainMenuPortlet").style.display='none';
			document.getElementById("aonContent:mainForm:hideRightButton").style.display='none';
			document.getElementById("aonContent:mainForm:infoGroupRightSupportDiv").style.visibility='hidden';

			document.getElementById("aonContent:mainForm:"+menuPortlet+"MenuPortlet").style.display='block';
		}
		function hideMenuPortlet(menuPortlet){
			document.getElementById("aonContent:mainForm:"+menuPortlet+"MenuPortlet").style.display='none';
			
			document.getElementById("aonContent:mainForm:mainMenuPortlet").style.display='block';
			document.getElementById("aonContent:mainForm:hideRightButton").style.display='block';
			document.getElementById("aonContent:mainForm:infoGroupRightSupportDiv").style.visibility='visible';
		}

	</script>
