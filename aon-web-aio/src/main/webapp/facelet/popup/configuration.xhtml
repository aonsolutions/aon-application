<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="configurationMenuPopup" style="display:none" 
	onclick="javascript:selectItemHeader(this.id)"
	onmouseout="javascript:hideMenuPopup(this.id)" 
	onmouseover="javascript:showMenuPopup(this.id)" >

		<aon:form id="configurationMenuForm">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>

						<aon:panelGrid id="group_general_email" 
							rendered="#{actionDenied.renderedGroup('group_general_email')}"
							styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-mail">
							<f:facet name="header">
								<aon:outputText
									value="#{bundle.aon_mail_configuration} (#{loggedUser.loggedUserName})" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mailAccount" 
										rendered="#{actionDenied.renderedOption('mailAccount_list')}"
										action="mailAccount_list"
										actionListener="#{mailConfig.onInitMailAccount}"
										value="#{bundle.webmail_mailAccount_full}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="signature" 
										rendered="#{actionDenied.renderedOption('signature_list')}"
										action="signature_list"
										actionListener="#{mailConfig.onInitSignature}"
										value="#{bundle.webmail_signature_full}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="contact"
										rendered="#{actionDenied.renderedOption('contact_list')}"
										action="contact_list"
										actionListener="#{mailConfig.onInitContact}"
										value="#{bundle.aon_contacts}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_config_company"
							rendered="#{actionDenied.renderedGroup('group_config_company')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-company aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.company_data_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:if test="#{aonRole.admin or aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="globalConfiguration"
											rendered="#{actionDenied.renderedOption('globalConfig_form')}"
											action="globalConfig_form"
											actionListener="#{globalConfig.onInit}"
											value="#{bundle.admin_global_configuration}" />
									</aon:div>
								</aon:if>
								
								<aon:if test="#{aonRole.admin or aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<h:outputLink value="https://www.aonsolutions.es/solicitud-copia-de-seguridad-datos-empresa/" target="_blank">
											Descarga de Empresas
										</h:outputLink>
									</aon:div>
<!--
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_DomainDump"
											action="https://www.aonsolutions.es/solicitud-copia-de-seguridad-datos-empresa/"
											title="Descarga de Empresas">
											<aon:outputText value="Descarga de Empresas" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="dump" action="backup_form"
											actionListener="#{backup.onInit}"
											value="#{bundle.admin_backup}" />
									</aon:div>
 -->
								</aon:if>
								
								<aon:if test="#{actionDenied.moduleEnabled['hotel'] and aonRole.purchaseOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="hotel" 
											rendered="#{actionDenied.renderedOption('hotel_list')}"
											action="hotel_list"
											value="#{bundle.pms_hotel_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="department" 
											rendered="#{actionDenied.renderedOption('department_grid')}"
											action="department_grid"
											value="#{bundle.company_department_module}" />
									</aon:div>
								</aon:if>
								
								<aon:if test="#{aonRole.sysAdmin}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="applicationParameter"
											rendered="#{actionDenied.renderedOption('applicationParameter_list')}"
											action="applicationParameter_list"
											actionListener="#{applicationParameter.onSearch}"
											value="#{bundle.config_app_param_module}" />
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:panelGrid>

						<aon:if
							test="#{aonRole.saleOperator or aonRole.purchaseOperator or aonRole.productOperator or aonRole.commercialOperator}">
							<aon:panelGrid id="group_configuration_masters"
								rendered="#{actionDenied.renderedGroup('group_configuration_masters')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_master_tables}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:if
										test="#{!domainSwitcher.parentDomain or !domainSwitcher.domainManagementAvailable}">
										<aon:if test="#{aonRole.saleOperator}">
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="customer-configuration"
													rendered="#{actionDenied.renderedOption('customer_search-configuration')}"
													action="customer_search-configuration"
													actionListener="#{customer.onEditSearch}"
													value="#{bundle.customer_finance_checking}" />
											</aon:div>
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="aon_invoicing_group-configuration"
													rendered="#{actionDenied.renderedOption('invoicingGroup_list-configuration')}"
													action="invoicingGroup_list-configuration"
													value="#{bundle.customer_invoicing_group_module}" />
											</aon:div>
										</aon:if>
										<aon:if test="#{aonRole.purchaseOperator}">
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="supplier-configuration"
													rendered="#{actionDenied.renderedOption('supplier_search-configuration')}"
													action="supplier_search-configuration"
													actionListener="#{supplier.onEditSearch}"
													value="#{bundle.aon_suppliers}" />
											</aon:div>
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="creditor-configuration"
													rendered="#{actionDenied.renderedOption('creditor_search-configuration')}"
													action="creditor_search-configuration"
													actionListener="#{creditor.onEditSearch}"
													value="#{bundle.finance_creditor_module}" />
											</aon:div>
										</aon:if>
									</aon:if>
									<aon:if test="#{aonRole.productOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="product-configuration"
												rendered="#{actionDenied.renderedOption('product_search-configuration')}"
												action="product_search-configuration"
												actionListener="#{product.onEditSearch}"
												value="#{bundle.aon_role_product}" />
										</aon:div>
									</aon:if>
									<aon:if
										test="#{aonRole.productOperator or aonRole.purchaseOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseItem-configuration"
												rendered="#{actionDenied.renderedOption('expenseItem-configuration')}"
												action="expenseItem-configuration"
												value="#{bundle.aon_expenses}" />
										</aon:div>
									</aon:if>
									<aon:if
										test="#{!domainSwitcher.parentDomain or !domainSwitcher.domainManagementAvailable}">
										<aon:if test="#{aonRole.commercialOperator}">
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="target-configuration"
													rendered="#{actionDenied.renderedOption('target_search-configuration')}"
													action="target_search-configuration"
													actionListener="#{target.onEditSearch}"
													value="#{bundle.commercial_target_module}" />
											</aon:div>
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="seller-configuration"
													rendered="#{actionDenied.renderedOption('seller_search-configuration')}"
													action="seller_search-configuration"
													actionListener="#{seller.onEditSearch}"
													value="#{bundle.seller_module}" />
											</aon:div>
										</aon:if>
									</aon:if>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_management_tables"
								rendered="#{actionDenied.renderedGroup('group_management_tables')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-config">
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.aon_management_auxiliaries_tables}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="payMethod-configuration"
											rendered="#{actionDenied.renderedOption('payMethod-configuration')}"
											action="payMethod-configuration"
											value="#{bundle.config_paymethod_module}" />
									</aon:div>
									<aon:if test="#{aonRole.accountingOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="paymethodTypeDetail-configuration"
												rendered="#{actionDenied.renderedOption('paymethodTypeDetail-configuration')}"
												action="paymethodTypeDetail-configuration"
												value="#{bundle.config_paymethodTypeDetail_module}" />
										</aon:div>
									</aon:if>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="bankConcept" 
											rendered="#{actionDenied.renderedOption('bankConcept')}"
											action="bankConcept"
											value="#{bundle.finance_bank_concept_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="series-configuration"
											rendered="#{actionDenied.renderedOption('series-configuration')}"
											action="series-configuration"
											value="#{bundle.config_series_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="tax-configuration"
											rendered="#{actionDenied.renderedOption('tax_list-configuration')}"
											action="tax_list-configuration"
											value="#{bundle.config_tax_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="geotreeParent_list-configuration"
											rendered="#{actionDenied.renderedOption('geotreeParent_list-configuration')}"
											action="geotreeParent_list-configuration"
											actionListener="#{geotreeParent.onSearch}"
											value="#{bundle.geozone_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="segment_form-configuration"
											rendered="#{actionDenied.renderedOption('segment_form-configuration')}"
											action="segment_form-configuration"
											value="#{bundle.registry_segment_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="relationship" 
											rendered="#{actionDenied.renderedOption('relationship_form')}"
											action="relationship_form"
											value="#{bundle.registry_relationship_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>

						<aon:if test="#{aonRole.config}">
							<aon:panelGrid id="group_prodyct_tables"
								rendered="#{actionDenied.renderedGroup('group_prodyct_tables')}"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-config">
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.aon_product_auxiliaries_tables}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="productTag" 
											rendered="#{actionDenied.renderedOption('productTag_form')}"
											action="productTag_form"
											actionListener="#{productTag.onCancel}"
											value="#{bundle.product_tag_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="packingTag" 
											rendered="#{actionDenied.renderedOption('packingTag_form')}"
											action="packingTag_form"
											actionListener="#{packingTag.onCancel}"
											value="#{bundle.product_packing_tag_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="productCategory-configuration"
											rendered="#{actionDenied.renderedOption('productCategory-configuration')}"
											action="productCategory-configuration"
											value="#{bundle.aon_categories}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="brand-configuration"
											rendered="#{actionDenied.renderedOption('brand-configuration')}"
											action="brand-configuration"
											value="#{bundle.product_brand_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="tariff-configuration"
											rendered="#{actionDenied.renderedOption('tariff_list-configuration')}"
											action="tariff_list-configuration"
											actionListener="#{tariff.onSearch}"
											value="#{bundle.product_tariff_module2}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="catalogue-configuration"
											rendered="#{actionDenied.renderedOption('catalogue_search-configuration')}"
											action="catalogue_search-configuration"
											actionListener="#{catalogue.onEditSearch}"
											value="#{bundle.product_catalogue_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:panelGrid id="group_utilities" 
							rendered="#{actionDenied.renderedGroup('group_utilities')}"
							styleClass="aon-width-all"
							columnClasses="aon-padding"
							headerClass="aon-icon-accounting aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_conecta_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:if test="#{aonRole.config}">
									<aon:if  test="#{!domainSwitcher.parentDomain or !domainSwitcher.domainManagementAvailable  }">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="template-import-configuration"
													rendered="#{actionDenied.renderedOption('gwt_import')}"
													action="gwt_import" title="Importar Excel">
												<aon:outputText styleClass="aon-fiscal-link-label aon-icon-new-text"
													style="margin-left: 5px; padding-left: 20px;"
													value="Carga de datos desde ficheros Excel (Predefinidos)" />
											</aon:commandLink>
										</aon:div>
									</aon:if>								
									<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="template-configuration"
													rendered="#{actionDenied.renderedOption('gwt_templates')}"
													action="gwt_templates" title="#{bundle.aon_templates}">
												<aon:outputText value="Gestión Plantillas para carga de datos" />
											</aon:commandLink>
									</aon:div>
									<aon:if
										test="#{!domainSwitcher.parentDomain or !domainSwitcher.domainManagementAvailable}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="aonLoader" 
												rendered="#{actionDenied.renderedOption('aonLoader_form')}"
												action="aonLoader_form"
												actionListener="#{aonLoader.onStart}"
												value="Carga de datos desde ficheros Texto (CSV)" />
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="gwt_invoiceReport"
												rendered="#{actionDenied.renderedOption('gwt_invoiceReport')}"
												action="gwt_invoiceReport"
												title="Descarga de datos en formato Excel">
												<aon:outputText value="Descarga de datos en formato Excel" />
											</aon:commandLink>
										</aon:div>

 
 										<aon:if test="#{aonRole.accountingOperator and exporter.configuration.configured}">
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="invoiceExporter"
													action="#{exporter.initialAction}"
													actionListener="#{exporter.onInit}"
													value="#{bundle.finance_invoiceExport_module}">
													<aon:actionListener
														method="#{invoiceExporter.onEditSearch}" />
													<f:setPropertyActionListener value="invoiceExporter_search"
														target="#{exporter.backAction}" />
												</aon:commandLink>
											</aon:div>
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="financeExporter"
													action="#{exporter.initialAction}"
													actionListener="#{exporter.onInit}"
													value="#{bundle.finance_account_export_module}">
													<aon:actionListener
														method="#{financeExporter.onEditSearch}" />
													<f:setPropertyActionListener value="financeExporter_search"
														target="#{exporter.backAction}" />
												</aon:commandLink>
											</aon:div>
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="fbatchExporter"
													action="#{exporter.initialAction}"
													actionListener="#{exporter.onInit}"
													value="#{bundle.fbatch_account_export_module}">
													<aon:actionListener method="#{fbatchExporter.onEditSearch}" />
													<f:setPropertyActionListener value="fbatchExporter_search"
														target="#{exporter.backAction}" />
												</aon:commandLink>
											</aon:div>
										</aon:if>
									</aon:if>
									<aon:if test="#{company.dsiLoaderEnabled}">
										<aon:if test="#{!domainSwitcher.childDomain}">
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="boe_import" 
													rendered="#{actionDenied.renderedOption('boe_import_form')}"
													action="boe_import_form"
													title="#{bundle.boe_import_module}">
													<aon:outputText styleClass="aon-icon-aeat"
														style="white-space: normal; margin-left: 5px; padding-left: 20px;"
														value="" />
													<aon:outputText value="#{bundle.boe_import_module}" />
												</aon:commandLink>
											</aon:div>
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="zip_dsi_import" 
													rendered="#{actionDenied.renderedOption('aonZipLoader_form')}"
													action="aonZipLoader_form"
													actionListener="#{aonZipLoader.onStart}"
													title="Carga de empresas DSI (formato ZIP)">
													<aon:outputText styleClass="aon-icon-dsi-gestion"
														style="white-space: normal; margin-left: 5px; padding-left: 20px;"
														value="" />
													<aon:outputText value="Carga de empresas DSI (formato ZIP)" />
												</aon:commandLink>
											</aon:div>
										</aon:if>
									</aon:if>
								</aon:if>
								<aon:if
									test="#{aonRole.accountingOperator and !domainSwitcher.childDomain and !actionDenied.moduleEnabled['accounting']}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="account-configuration"
											rendered="#{actionDenied.renderedOption('account_list-configuration')}"
											action="account_list-configuration"
											value="#{bundle.account_module}" />
									</aon:div>
								</aon:if>
								
								<aon:if test="#{company.ediSupportEnabled and domainSwitcher.betaDomain}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_seres"
												rendered="#{actionDenied.renderedOption('gwt_seres')}"
												action="gwt_seres"
												title="Comunicaciones Seres">
												<aon:outputText
													styleClass="aon-fiscal-link-label aon-icon-beta-text"
													style="margin-left: 5px; padding-left: 20px; text-decoration: line-through;" 
													value="Comunicaciones Seres" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="gwt_communication"
											rendered="#{actionDenied.renderedOption('gwt_communication')}"
											action="gwt_communication"
											title="Consola de comunicaciones">
											<aon:outputText value="Consola de comunicaciones"
												styleClass="aon-fiscal-link-label aon-icon-beta-text"
												style="margin-left: 5px; padding-left: 20px;" />
										</aon:commandLink>
									</aon:div>
								</aon:if>
								
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</aon:div>
</ui:composition>
