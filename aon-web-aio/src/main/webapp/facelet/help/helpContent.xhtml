<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<style>
	.list .list-item {
		margin: 6px; background-color : white;
		font-size: 14px !important;
		border: 1px solid #f1f1f1 !important;
		background-color: white;
	}
	
	.breadcrumb .material-icons {
		margin-right: .5rem;
		font-size: 32px !important;
	}
	.breadcrumb .list-item {
		font-size: 14px !important;
	}
	.material-icons {
	  font-family: 'Material Symbols Outlined';
	  font-weight: normal;
	  font-style: normal;
	  font-size: 24px;
	  line-height: 1;
	  letter-spacing: normal;
	  text-transform: none;
	  display: inline-block;
	  white-space: nowrap;
	  word-wrap: normal;
	  direction: ltr;
	  -moz-font-feature-settings: 'liga';
	  -moz-osx-font-smoothing: grayscale;
	  font-variation-settings:
	  'FILL' 0,
	  'wght' 200,
	  'GRAD' 0,
	  'opsz' 24;
	}
	</style>

	<aon:form id="appForm" > 

		<aon:commandButton 
			id="appButton" 
			style="display: none;" 
			action="drive_content"
		>
			<aon:if test="#{dur.portal}">
				<f:setPropertyActionListener target="#{help.homeByName}" value="Portal" />
				<f:setPropertyActionListener target="#{help.fileByName}" value="Portal" />
			</aon:if>
			
		</aon:commandButton>
	</aon:form>
	
	<script type="text/javascript">
	//<![CDATA[
		#{rich:element('appButton')}.click();	
	//]]>
	</script>
	
	<!--  
	<ui:include src="/com/code/aon/web/help/facelet/drive_content.xhtml" />
	-->

</ui:composition>
