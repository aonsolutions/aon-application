<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">
	
	<aon:div id="desktopDiv1" style="padding-top: 0px; width:3.5rem" >
		
	<style>
		.aon-portlets-column1{
			width : 3.5rem;
			padding: 0px;
			text-align: right;
		}
		.aon-show-button {
			opacity: 0.6; 
			padding: 10px;
			position:relative;
			background-color: #ddd; 
			border-top-right-radius: 50%; 
			border-bottom-right-radius: 50%;  
		}
		.aon-hide-button {
			z-index: 66;
			opacity: 0.6; 
			padding: 10px;
			position:relative;
			background-color: #ddd; 
			transform: rotate(180deg);
			border-top-right-radius: 50%; 
			border-bottom-right-radius: 50%;  
		}
		
		.aon-portlet-title {
			color: gray;
			font-size: 12px;
			font-weight: normal;
			margin-top: 15px;			
			margin-left: 15px;
			margin-bottom: 10px;
			text-transform: uppercase;
		}
		
	</style>
	
	<script type='text/javascript' >

		function collapseMenuPortlet(el) {
			el.nextSibling.style.display= "none";
			el.firstChild.innerText= 'expand_more';
			el.onclick=function() { expandMenuPortlet(el); };
		} 
		function expandMenuPortlet(el) {
			el.nextSibling.style.display= "block";
			el.firstChild.innerText= 'expand_less';
			el.onclick=function() { collapseMenuPortlet(el); };
		} 

	</script>
	

	<aon:div id="infoGroupDiv" style="position:relative; top: -0px; width: min-content;" >
		<ui:include src="/facelet/new/portlet/menuPortlet.xhtml" >
			<ui:param name="reRender" value="#{reRender}"/>
		</ui:include>
	</aon:div>
		
	</aon:div>
					
	<script type='text/javascript' >
		#{rich:element('desktopDiv1')}.style.width='100%';
		#{rich:element('infoGroupDiv')}.style.display='block';
	</script>

</ui:composition>
