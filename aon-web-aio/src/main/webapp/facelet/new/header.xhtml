<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<style>
	.aon-menuBar {
		border-bottom: none;
	}
	
	.aon-top-menu-item-select {
    	background-color: #fff !important;
	}
	.aon-header-logout {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-logout.png) no-repeat scroll center center;
	}
	.aon-header-domain {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-domain.png) no-repeat scroll center center;
	}
	.aon-header-home {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-home.png) no-repeat scroll center center;
	}	
	.aon-direct-access-panel {
		height:16px;
    	border-bottom: 1px solid #ccc;
    	background-color: #f7f7f7 !important;
		border-top-right-radius: 50px 50px;
    	border-bottom-right-radius: 50px 50px;
		color: #0a0a0a;
		padding-left: 12px;
    	background-image: none;
	}	
	
	.aon-direct-access-panel img {
  		filter: grayscale(100%);
	}
	
	.aon-direct-access-list-element {
    	background: none;
    	padding: 5px 0 8px 12px;
    	border-bottom: none;
	}	
	.aon-direct-access-list-element:hover {
    	background-color: #f6f6f6 !important;
		border-top-right-radius: 50px 50px;
    	border-bottom-right-radius: 50px 50px;
	}	
	
	.aon-finding-title {
    	background: none;
	}
	.aon-finding-toolbar{
    	background: none;
	}

	.aon-finding-title-toolbar {
		padding: 2px 0px;
   		background: none;
    	border: #ddd 1px solid;
    	background-color: #f6f6f6;
    	border-top: none;
		border-bottom: 1px #ddd solid;
    	/*background: #d7d7d6 url(#{aonResource.resolve['/images/aon-header/aon-menuBar.png']}) scroll left top repeat-x !important;*/
	}	
	
	.aon-dataTable-header {
    	background: none;
    	background-color: #f6f6f6;
    	border-bottom: #ddd 1px solid;
	}
	
	.aon-dataScroller {
    	background-color: #f6f6f6;
    	border: #ddd 1px solid;
	}
	
	.aon-finding-toolbar-item {
    	border-right: #ddd 1px solid;
	}
	
	.aon-header-domain-title {
		font-weight: normal;
	}
	
	.aon-dataTable tr {
	}
	
	.gwt-Selector .gwt-StackLayoutPanel .gwt-StackLayoutPanelHeader {
    	background: #f6f6f6;
    	border-bottom: 1px solid #ddd;
	}	
	
	.gwt-TabLayoutPanelTab {
		background-color: #ddd;
	}
	
	
	</style>
		
	<aon:div id="aonHeader" styleClass="aon-header" style="border-top: 0px solid #999999; border-bottom: 1px solid #ddd;" >
		<aon:panelGrid columns="3" width="100%" 
			columnClasses="aon-header-name aon-vertical-align-middle,aon-header-options aon-width-300" style="height:60px;" >
			
			<aon:panelGroup>

				<aon:outputConnectionStatus id="aonStatus" layout="block"
					style=""
					startStyle="#{customize.statusStartStyle}; margin-top: 5px;"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyle="#{customize.statusStopStyle}; margin-top: 5px;"
					stopStyleClass="aon-outputConnectionStatus-stop"
					onstart="resetStatusError();" />
				<aon:div id="status_error"
					style="#{customize.statusFailedStyle} display: none; margin-top: 5px;"
					styleClass="aon-outputConnectionStatus-failed" />

				<aon:div style="margin-bottom:2px;">
					<aon:commandLink id="index" action="index" title="#{bundle.aon_home}" >
					<aon:graphicImage style="margin-left: 150px; height: 30px; vertical-align: middle;"
						value="#{customize.headerLogo}" />
					</aon:commandLink>
					<aon:if test="#{customize.separator != null}">					
						<aon:outputText value="#{customize.separator}"
							style="#{customize.fontStyle}"
							styleClass="aon-nowrap aon-header-domain-title"/>
					</aon:if>

				</aon:div>
			</aon:panelGroup>
			
			<aon:div styleClass="aon-nowrap aon-padding-left" rendered="#{loggedUser.logged}"
				style="color:#999;">
				<aon:form id="headerOptionsForm">
					<aon:panelGroup style="display:inline;">
						<aon:outputText value="#{domainSwitcher.domainName}"
							style="vertical-align: middle; color: #5f6368;"
							styleClass="aon-nowrap aon-header-domain-title aon-margin-right"/>
						<aon:commandLink id="home" action="index"
							rendered="#{!aonConfiguration.properties.hideMenuHome}"
							title="#{bundle.aon_home}"
							styleClass="aon-header-home"
							value="&#160;" 
							reRender="aonContent" />
						<aon:if test="#{(!domainSwitcher.childDomain) and (!domainSwitcher.adminDomain) and (domainSwitcher.domainCount > 0)}">
							<aon:panelGroup >
			 					<h:outputLink id="DomainSwitch" 
									title="#{bundle.aon_module_enterprise}"
									styleClass="aon-header-domain"
									style="#{customize.fontStyle}" >
								</h:outputLink>
							</aon:panelGroup>
						</aon:if>
						<aon:if test="#{domainSwitcher.enabledGoToParent}">
			 				<h:commandLink id="DomainSwitch" 
								title="#{bundle.aon_module_enterprise}"
								styleClass="aon-header-domain"
								style="#{customize.fontStyle}"
								actionListener="#{domainSwitcher.onUpperDomain}"					
								action="start" />
						</aon:if>
						<aon:commandLink id="logout"
							style="#{customize.fontStyle}" styleClass="aon-header-logout"
							title="#{bundle.aon_login_user_logout}"
							action="logout"
							actionListener="#{aonConfiguration.logout}" >
						</aon:commandLink>
					</aon:panelGroup> 
				</aon:form>
			</aon:div>
		</aon:panelGrid>
	</aon:div>
	<aon:if test="#{desktop.logEnabled}">
		<a4j:log hotkey="Z" level="ALL" popup="true" />
	</aon:if>

</ui:composition>
