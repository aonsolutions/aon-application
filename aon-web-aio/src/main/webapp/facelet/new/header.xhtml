<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<style>
	.aon-menuBar {
		border-bottom: 1px #ddd solid;
		background-image: none !important;
		background-color: #f6f6f6 !important;
	}
	
	.aon-top-menu-item-select {
    	background-color: #fff !important;
	}
	.aon-header-search {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-search.svg) no-repeat scroll center center;
	}
	.aon-header-logout {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-logout.png) no-repeat scroll center center;
	}
	.aon-header-domain {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-domain.png) no-repeat scroll center center;
	}
	.aon-header-home {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-home.png) no-repeat scroll center center;
	}	

	.aon-header-help {
		padding: 14px 20px;
		border-radius: 50%;
		background: transparent url(css/images/aon-icon/aon-icon-help.png) no-repeat scroll center center;
	}	

	.aon-direct-access-panel {
		height:16px;
    	border-bottom: 1px solid #ccc;
    	background-color: #f7f7f7 !important;
		border-top-right-radius: 50px 50px;
    	border-bottom-right-radius: 50px 50px;
		color: #0a0a0a;
		padding-left: 12px;
    	background-image: none;
	}	
	
	.aon-direct-access-panel img {
  		filter: grayscale(100%);
	}
	
	.aon-direct-access-list-element {
    	background: none;
    	padding: 5px 0 8px 12px;
    	border-bottom: none;
	}	
	.aon-direct-access-list-element:hover {
    	background-color: #f6f6f6 !important;
		border-top-right-radius: 50px 50px;
    	border-bottom-right-radius: 50px 50px;
	}	
	
	.aon-finding-title {
    	background: none;
	}
	.aon-finding-toolbar{
    	background: none;
	}

	.aon-finding-title-toolbar {
		padding: 2px 0px;
   		background: none;
    	border: #ddd 1px solid;
    	background-color: #f6f6f6;
    	border-top: none;
		border-bottom: 1px #ddd solid;
    	/*background: #d7d7d6 url(#{aonResource.resolve['/images/aon-header/aon-menuBar.png']}) scroll left top repeat-x !important;*/
	}	
	
	.aon-dataTable-header {
    	background: none;
    	background-color: #f6f6f6;
    	border-bottom: #ddd 1px solid;
	}
	
	.aon-dataScroller {
    	background-color: #f6f6f6;
    	border: #ddd 1px solid;
	}
	
	.aon-finding-toolbar-item {
    	border-right: #ddd 1px solid;
	}
	
	.aon-header-domain-title {
		font-weight: normal;
	}
	
	.aon-dataTable tr {
	}
	
	.gwt-Selector .gwt-StackLayoutPanel .gwt-StackLayoutPanelHeader {
    	background: #f6f6f6;
    	border-bottom: 1px solid #ddd;
	}	
	
	.gwt-TabLayoutPanelTab {
		background-color: #ddd;
	}
	
	.aon-table-row-hover {
		background-color: #eee !important;
	}

	.aon-panelGrid-search {
    	background-color: #fafafa;
    	border: #ddd 1px solid;
	}
	
	.aon-panelGrid-search-info {
    	background: none;
    	border-bottom: #ddd 1px solid;
	}	
	
	.aon-panelGrid-search .aon-panelGrid-odd,
	.aon-panelGrid-search .aon-panelGrid-even {
    	background-color: #fafafa;
	}
	
	.aon-panelGrid-search .rich-stglpanel-header {
    	background-image: none;
    	background-color: #f6f6f6;
	}
	
	.aon-commandButton,
	.aon-search-lookup-button {
    	background: none;
    	border: #ddd 1px solid;
    	background-color: #eee;
	}	
	
	.aon-header .aon-dropDownMenu {
		display: inline-block;
	}
		
	.rich-menu-list-border {
    	border-color: #ddd;
    	background-color: #ddd;
    	box-shadow: 2px 2px 5px 1px #ddd;
	}
	
	.rich-menu-list-bg {
    	border: none;
    	background: none;
    	background-image: none;
	}
	
	.aon-dropDownMenu{
 		font-size: 13px;
 		font-weight: normal;
 		background-color: #fff; 
	}
	
	.aon-dropDownMenu-item {
    	text-align: left;
    	filter: grayscale(100%);
    	padding: 7px 20px 7px 12px;
	}
	
	
 	.aon-menuItem-styleClass {
    	font-size: 13px;
    	font-weight: normal;
    	background-color: #fff;
    	text-transform: none;
    	text-align: left;
    	padding: 7px 20px 7px 12px;
	}
 	
 	.rich-menu-item:hover ,
 	.aon-menuItem-selectClass
 	{
 		border:none;
 		font-size: 13px;
 		font-weight: normal;
 		background-color: #eee; 
 		text-transform: none;	 
 	}	

	.aon-dropDownMenu-selectItem{	
		border: none;
    	text-align: left;
		background-color:#eee;
 		text-transform: none;	 
    	padding: 7px 20px 7px 12px;
	} 

	.aon-dropDownMenu-disabledItem{ 		
  	}
  	
  	.rich-tab-active{
  		background-image:none;
  		background-color: #fff;
  	}
  	
  	.rich-tab-inactive{
  		background-image:none;
  		border-color: #eee;
  		background-color: #eee;
  	}
  	
  	.aon-panelGrid-odd,
  	.aon-panelGrid-even{
  		padding: 5px;
    	border: #fff 2px solid;
	}
	
	.aon-toolbar {
	    border: #ddd 1px solid;
    	background-color: #f6f6f6;
	}
	
	.rich-menu-separator {
    	margin: 0px;
    	border-top-color: #ddd;
	}
	
	.aon-editDataTable-header,
	.aon-editDataTable-footer{
    	border: #ddd 1px solid;
    	background-image: none;
    	background-color: #f6f6f6;
	}
	
	.rich-mpnl-mask-div-opaque{
		background-color: #ddd;
	}
	
	.rich-mpnl-shadow {
    	background-color: transparent;
		box-shadow: 2px 2px 5px 1px #ddd;
	}
	
	.aon-portlet-body,
	.aon-portlet-title {
		border: none;
	}
	
	.aon-dataTable td {
    	padding-left: 1.0em;
	}	
	
	.aon-input-search {
		width: 75%;
		padding: 4px; 
		border: 1px solid #ddd;
	}
	
	.aon-input-search:focus {
		outline:none;
		background-color:white;
	}

	.search-results-popup {
		
	}
	
	.search-results-popup td,
	.search-results-popup th,
	.search-results-popup table {
		border:none;
	}

	.search-results-popup table {
		padding-left : 20px;
	}

	.search-results-popup td {
		padding-top: 5px;
		padding-left: 10px;
		padding-bottom: 5px;
	}

	.search-results-popup > div {
		padding: 5px;
		background-color: white;
		box-shadow: 2px 2px 5px 1px #ddd;
	}

	.search-results-popup div {
	}
	
	.search-results-popup-filter
	 {
		padding-top: 20px;
		padding-left: 10px;
		padding-bottom: 10px;
		background-color: white;
	}
	
	.search-results-popup-title
	 {
		color: black;
		padding: 10px;
		font-size: 15px;
		background-color: white;
		border-bottom : 1px solid #ddd;
	}

	</style>
		
	<aon:div id="aonHeader" styleClass="aon-header" style="border-top: 0px solid #999999; border-bottom: 1px solid #ddd;" >
		<aon:panelGrid columns="4" width="100%" 
			columnClasses="aon-header-name aon-vertical-align-middle,aon-header-name  aon-width-all, aon-header-options aon-width-300" style="height:60px;" >
			

			<aon:panelGroup>

				<aon:outputConnectionStatus id="aonStatus" layout="block"
					style=""
					startStyle="#{customize.statusStartStyle}; margin-top: 5px;"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyle="#{customize.statusStopStyle}; margin-top: 5px;"
					stopStyleClass="aon-outputConnectionStatus-stop"
					onstart="resetStatusError();" />
				<aon:div id="status_error"
					style="#{customize.statusFailedStyle} display: none; margin-top: 5px;"
					styleClass="aon-outputConnectionStatus-failed" />

				<aon:div style="margin-bottom:2px;">
					<aon:commandLink id="index" action="index" title="#{bundle.aon_home}" >
					<aon:graphicImage style="margin-left: 150px; height: 24px; vertical-align: middle;"
						value="#{customize.headerLogo}" />
					</aon:commandLink>
					<aon:if test="#{customize.separator != null}">					
						<aon:outputText value="#{customize.separator}"
							style="#{customize.fontStyle}"
							styleClass="aon-nowrap aon-header-domain-title"/>
					</aon:if>

				</aon:div>
			</aon:panelGroup>
			
		
			<aon:panelGroup style="text-align:left" >
				<aon:form id="smartFilterForm">
					<aon:commandLink styleClass="aon-italic aon-margin-right aon-header-search" reRender="smartFilterTableContainer" >
						<f:setPropertyActionListener target="#{aonConfiguration.properties.showSearchResults}" value="#{true}" />
					</aon:commandLink>
					<aon:inputText id="smartFilter" size="60" value="#{search.filter}" placeholder="Buscar" styleClass="aon-input-search"  autocomplete="off" >
						<a4j:support 
						event="onkeyup"
						reRender="smartFilterTableContainer"
						eventsQueue="domainSwitcherFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true">
							<f:setPropertyActionListener target="#{aonConfiguration.properties.showSearchResults}" value="#{true}" />
						</a4j:support> 
						
						<a4j:support 
						event="onblur"
						reRender="smartFilterTableContainer"
						eventsQueue="domainSwitcherFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true">
							<f:setPropertyActionListener target="#{aonConfiguration.properties.showSearchResults}" value="#{false}" />
						</a4j:support> 
					</aon:inputText>
					
					<aon:div id="smartFilterTableContainer" styleClass="search-results-popup" style="z-index:6; position:absolute; width:50%">
						<aon:if test="#{aonConfiguration.properties.showSearchResults}">
						<aon:div>
							<aon:div styleClass="search-results-popup-filter" >
								<aon:outputText value="Resultados de búsqueda de '#{search.filter}'"
								styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
							</aon:div>
						
							<aon:div styleClass="search-results-popup-title" >
								<aon:outputText value="#{domainSwitcher.model.rowCount} Empresas encontradas"
								styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
							</aon:div>
						
							<aon:methodParam name="rowSelectorAction" value="start" />
							<aon:methodParam name="rowSelectorActionListener" value="#{domains.onSelectChildDomain}" type="actionListener" />
							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
							
								<ui:param name="skipSelectButton" value="#{true}" />
								<ui:param name="showDataScroller" value="#{false}" />
							
								<ui:param name="controller" value="#{domainSwitcher}" />
								<ui:param name="skipFocusFirst" value="true" />
							
								<ui:define name="columns">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
									<aon:outputText value="#{to.getDisplay(search.filter)}"
										title="#{(!to.active)?bundle.admin_domain_inactive:''}#{(to.expired)?bundle.admin_domain_expired:''}"
										style="#{(!to.active or to.expired)?'color:red;font-style:italic;':''}"  escape="false" />					
								</aon:column>
								</ui:define>
							</ui:decorate>
							
							<!--
							<aon:div styleClass="search-results-popup-title" >
								<aon:outputText value="#{domainSwitcher.model.rowCount} Trabajadores encontrados"
								styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
							</aon:div>
							-->
						
						</aon:div>
						</aon:if>
					</aon:div>
	
				</aon:form>
			</aon:panelGroup>
					
			<aon:div styleClass="aon-width-all aon-nowrap aon-padding-left" rendered="#{loggedUser.logged}"
				style="color:#999;">

					<aon:form id="headerOptionsForm">
					
					<aon:panelGroup style="display:inline;">
						<aon:outputText value="#{domainSwitcher.domainName}"
							style="vertical-align: middle; color: #5f6368;"
							styleClass="aon-nowrap aon-header-domain-title aon-margin-right"/>
						<aon:commandLink id="home" action="index"
							rendered="#{!aonConfiguration.properties.hideMenuHome}"
							title="#{bundle.aon_home}"
							styleClass="aon-header-home"
							value="&#160;" 
							reRender="aonContent" />
						<aon:if test="#{(!domainSwitcher.childDomain) and (!domainSwitcher.adminDomain) and (domainSwitcher.domainCount > 0)}">
							<aon:panelGroup >
			 					<h:outputLink id="DomainSwitch" 
									title="#{bundle.aon_module_enterprise}"
									styleClass="aon-header-domain"
									style="#{customize.fontStyle}" >
								</h:outputLink>
							</aon:panelGroup>
						</aon:if>
						<aon:if test="#{domainSwitcher.enabledGoToParent}">
			 				<h:commandLink id="DomainSwitch" 
								title="#{bundle.aon_module_enterprise}"
								styleClass="aon-header-domain"
								style="#{customize.fontStyle}"
								actionListener="#{domainSwitcher.onUpperDomain}"					
								action="start" />
						</aon:if>

						<aon:dropDownMenu>
			                <f:facet name="label"> 
			 					<h:outputLink 
									title="#{bundle.aon_help}"
									styleClass="aon-header-help"
									style="#{customize.fontStyle}" >
								</h:outputLink>
							</f:facet>
			                <aon:if test="#{aonConfiguration.bean.alarm.showList}">
		                		<aon:menuItem id="alarm"
									value="#{bundle.aon_alarm}"
									action="home_alarm" actionListener="#{alarm.onInit}" 
									iconClass="aon-icon-alarm" />
							</aon:if>	
							<aon:menuItem id="favorites" action="home_favorite"
								update="aonContent"
								rendered="#{!aonConfiguration.properties.hideMenuFavorite}"
								iconClass="aon-icon-favorite"
								actionListener="#{actionFavorite.onInit}"
								value="#{bundle.aon_favorites_management}" />
							<aon:if test="#{!aonRole.sysAdmin and (domainSwitcher.type != 'ADMIN')}">
								<aon:menuItem id="advancedMode" action="home_advanced"
								actionListener="#{adminMain.onInitAdvancedMode}"
								rendered="#{!aonConfiguration.properties.hideMenuAdvancedMode}"
								value="#{bundle.admin_advanced_mode}" />
							</aon:if>
							<aon:menuItem id="config_userProfile" action="home_user"
								iconClass="aon-icon-menu-user"
								actionListener="#{domainUser.onInitUserProfile}"
								value="#{bundle.admin_user_profile}" />
							<aon:menuItem id="changePassword" action="home_password"
								iconClass="aon-icon-changePassword"
								actionListener="#{changePassword.onInit}"
								value="#{bundle.aon_security_change_password}" />
			                <aon:menuGroup
			                	rendered="#{!aonConfiguration.properties.hideMenuChooseLanguage}"
			                	value="#{bundle.aon_chooseLocale}">
		                		<aon:menuItem id="spanishLanguage" reRender="aonHeader,aonContent"
		                			value="#{aonConfiguration.locales[0].displayName}"
									iconClass="#{aonConfiguration.locales[0].iconClass}" 
									actionListener="#{aonConfiguration.locales[0].onChangeLanguage}" />
		                		<aon:menuItem id="englishLanguage" reRender="aonHeader,aonContent"
		                			value="#{aonConfiguration.locales[1].displayName}"
									iconClass="#{aonConfiguration.locales[1].iconClass}" 
									actionListener="#{aonConfiguration.locales[1].onChangeLanguage}" />
			                </aon:menuGroup>	
							<aon:menuItem submitMode="none" reRender="aonStatus"
								rendered="#{!aonConfiguration.properties.hideMenuHelp}"
								iconClass="aon-icon-menu-help">
								<h:outputLink style="font-size:1em;"
									value="#{aonConfiguration.helpURL}"
									target="_blank" >
									<aon:outputText value="#{bundle.aon_help}" />
								</h:outputLink>
							</aon:menuItem>
							<aon:menuItem id="about" reRender="aboutWindowPanel"
								rendered="#{!aonConfiguration.properties.hideMenuAbout}"
								iconClass="aon-icon-about"
								value="#{bundle.aon_about}" >
								<f:setPropertyActionListener target="#{aonConfiguration.properties.showAbout}" value="#{true}" />
							</aon:menuItem>
						</aon:dropDownMenu>

						<aon:commandLink id="logout"
							style="#{customize.fontStyle}" styleClass="aon-header-logout"
							title="#{bundle.aon_login_user_logout}"
							action="logout"
							actionListener="#{aonConfiguration.logout}" >
						</aon:commandLink>
					</aon:panelGroup> 
					</aon:form>
			</aon:div>
		</aon:panelGrid>
	</aon:div>
	<aon:if test="#{desktop.logEnabled}">
		<a4j:log hotkey="Z" level="ALL" popup="true" />
	</aon:if>

</ui:composition>
