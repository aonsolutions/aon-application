	<script type="text/javascript">
	
			selected = -1;
		    helpTooltipTimeout = null;
			
			function showSearchResults(){
				if ( #{rich:element('smartFilter')}.value ) {
					#{rich:element('smartFilterTableContainer')}.classList.add("show");
				}
			}
			
			function hideSearchResults(){
				setTimeout(function() {
					if ( document.activeElement != #{rich:element('smartFilterTablePanel')} )
						#{rich:element('smartFilterTableContainer')}.classList.remove("show");
				}, 200);
			}
			
			
			function escSearchResults(e){
				if ( e.which === 27 ) {
					#{rich:element('smartFilterTableContainer')}.classList.remove("show");
					e.stopPropagation();
      				e.preventDefault();  
      				e.returnValue = false;
      				e.cancelBubble = true;
      				
      				hideHelpTooltip(true);
      				return false;
				}
				
				// if arrows or enter
				if(e.which === 38 || e.which === 40 || e.which === 13) {
					e.stopPropagation();
      				e.preventDefault();  
      				e.returnValue = false;
      				e.cancelBubble = true;
      				
      				const searchResults = #{rich:element('smartFilterTablePanel')}.querySelectorAll(".selectable");
      				if(searchResults.length == 0){
      					return;
      				}
      				
    				// Arrow up
    				if(e.which === 38) {
    					selected--;
    					
    					if(selected &lt; 0){
    						selected = searchResults.length -1;
    					}
    					
    					resetResultStates(searchResults, selected)
    					
    				}
    				
    				// Arrow down
    				if(e.which === 40) {
          				selected++;
          				
          				if(selected >= searchResults.length){
          					selected = 0;
          				}
          				
          				resetResultStates (searchResults, selected)
    				}
    				
    				// Enter
    				if(e.which === 13) {
    					
    					const link = searchResults[selected].querySelector("a");
    					searchResults[selected].click();
    					
    					if(link) {
    						link.click();
    					}
    					
    				}
      				
				} else {
					selected = -1;
				}
				

				
			}
			
			function resetResultStates (searchResults, selected) {
				searchResults.forEach(p => {
					p.style.background = "transparent";
				})
				
				hideHelpTooltip();
				
				const mouseover =  searchResults[selected].onmouseover;
				if(mouseover){
					mouseover({
						target : searchResults[selected],
						clientX : searchResults[selected].getBoundingClientRect().right - (searchResults[selected].offsetWidth / 2),
					});
				}
				
				searchResults[selected].style.background = "#f1f1f1";
			}
			
			function focusSearchResults(){
				setTimeout(function() {
					if ( #{rich:element('smartFilterTablePanel')} ) {
						#{rich:element('smartFilterTablePanel')}.classList.add("show");
					}
					#{rich:element('smartFilter')}.focus();
				}, 300);
			}

			
			/**
			* 	Show help tooltip
			*	@param event The event activating the function
			*   @param url The url to show
			*/
			function showHelpTooltip( event, url ){
				
					helpTooltipTimeout = setTimeout(function(){
						
						const tooltip = document.getElementById("helpTooltip");
						const frame = document.querySelector("#helpTooltip iframe");
						const optionRect = event.target.getBoundingClientRect();;
						
						if(!tooltip || !frame){
							return;
						}
						
						if(Math.abs(event.clientY - optionRect.top) > 18){
							return;
						}
						
						tooltip.dataset.url = url;
						
						// Set loading animation
						frame.style.transition = "none";
						frame.style.opacity = 1;
						

						// Get the right tooltip URL						
						const filename = url.substr( url.lastIndexOf('/') + 1, url.lastIndexOf('.pdf')-5);
						let name = url.substr( url.lastIndexOf('#') + 1);
						
						let tooltipUrl = "";
						
						if(url.lastIndexOf('#') == -1) {
							tooltipUrl = b64EncodeUnicode("../../Tooltip/?page=" + 0 + "&amp;filename=" + filename)						
						} else {
							tooltipUrl = b64EncodeUnicode("../../Tooltip/?name=" + name + "&amp;filename=" + filename)
						}
						
						frame.src =  "html/pdfjs/viewer.html?encoded=true&amp;file=" + tooltipUrl +"#zoom=page-width"; 
						
						// Show tooltip						
						tooltip.style.display = "block";
						tooltip.style.top = ( optionRect.top + 20 ) + "px";
						
						tooltip.style.left = event.clientX  + "px";
						tooltip.style.transform = "translateX(-50%)";
						setTimeout(() => tooltip.style.opacity = "1", 250);
												
					}, 150);

			}
			
			
			/**
			*	Encode unicode to base64 
			*	@param str The string to encode
			*/
			function b64EncodeUnicode(str) {
		        // first we use encodeURIComponent to get percent-encoded UTF-8,
		        // then we convert the percent encodings into raw bytes which
		        // can be fed into btoa.
		        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
		            function toSolidBytes(match, p1) {
		                return String.fromCharCode('0x' + p1);
		        }));
		    }
			
			/**
			* Hide the help tooltip
			* @param force force the hide tooltip, false by default
			*/
			function hideHelpTooltip(force = false) {
				clearTimeout(helpTooltipTimeout);
				const tooltip = document.getElementById("helpTooltip");
				
				if(!tooltip){
					return;
				}
				
				if(!force &amp;&amp; tooltip.classList.contains("focus")){
					return;
				}
				
			
				
				tooltip.style.opacity = "0";
				setTimeout(() => tooltip.style.display = "none", 20);
			}
			
			
			function listenGlobalKeys(e) {
				const key = e.keyCode || e.witch;
				if(key == 113){
					
					const tooltip = document.getElementById("helpTooltip");
					const frame = document.querySelector("#helpTooltip iframe");
					const message = document.getElementById("tooltip-key-message");
					tooltip.onclick = () => tooltip.classList.remove("focus");
					
					if(!frame.src){
						return;
					}
					
					const isSearch = #{rich:element('smartFilterTableContainer')}.classList.contains("show");
	
					if(isSearch &amp;&amp; tooltip.className.indexOf("focus") == -1){
						tooltip.classList.add("focus");
						
						const content = frame.contentWindow || frame.contentDocument;
						content.addEventListener("keydown", (e) => {
							listenGlobalKeys(e);
							
							const key = e.keyCode || e.witch;
							if(key == 113 || key == 27){
								tooltip.classList.remove("focus");
								hideHelpTooltip();
							}
							
							 // CTRL + ENTER
				            if (event.ctrlKey &amp;&amp; event.code === 'Enter') {
				            	tooltip.classList.remove("focus");
				            	hideHelpTooltip(true);				            	
				            	window.open(tooltip.dataset.url,'_blank');
				            }
				               
						});
						
						frame.focus();
												
						const f2Icon = document.createElement("span");
						const ctrlIcon = document.createElement("span");
						const enterIcon = document.createElement("span");
						
						f2Icon.className = "keyboard-icon";
						ctrlIcon.className = "keyboard-icon";
						enterIcon.className = "keyboard-icon";
						
						f2Icon.innerHTML = "F2";
						ctrlIcon.innerHTML = "Ctrl";
						enterIcon.innerHTML = "Enter";
						
						message.innerHTML = "Pulse " + f2Icon.outerHTML + " para soltar la ventana | " + ctrlIcon.outerHTML + " " + enterIcon.outerHTML + " para ir al pdf";
					} else {
						tooltip.classList.remove("focus");
						
						const f2Icon = document.createElement("span");
						f2Icon.className = "keyboard-icon";
						f2Icon.innerHTML = "F2";
						
						message.innerHTML = "Pulse " + f2Icon.outerHTML + " para fijar la ventana";
					}
				}
			}
			
			function copyToClipboard(event,text) {
				
				 if (navigator &amp;&amp; navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
					navigator.clipboard.writeText(text)
				 } else {
					 console.log("Clipboard API not available, make sure that app is running via HTTPS protocol.");
					 console.log("Trying legacy method...");
					 legacyCopyToCliboard(text);
				 }
				 
				 showCopyTooltip(event);
			}
			
			function legacyCopyToCliboard(text) {
				  const el = document.createElement('textarea');
				  el.value = text;
				  el.setAttribute('readonly', '');
				  el.style.position = 'absolute';
				  el.style.left = '-9999px';
				  document.body.appendChild(el);
				  el.select();
				  document.execCommand('copy');
				  document.body.removeChild(el);
			}
			
			
			function showCopyTooltip(e){
				
				const tooltip = document.getElementById("copyTooltip");
				tooltip.style.top = e.target.getBoundingClientRect().top + "px"
				tooltip.style.left = e.target.getBoundingClientRect().left + "px"
				tooltip.classList.add("show");
				
				
				setTimeout(() => {
					tooltip.classList.add("up");

					setTimeout(() => {
						tooltip.classList.remove("up");
						
						setTimeout(() => {
							tooltip.classList.remove("show");
						}, 100);
						
					}, 1200);
				}, 100);
				
				
			}
			
			
			/**
			*  GLOBAL WINDOW CONTROLS
			*/
			document.documentElement.addEventListener("keydown", listenGlobalKeys)
			
			/**
			* SONAR : Keep session alive  
			*/
			sonar = new XMLHttpRequest();
			sonar.onload = function() {
				console.log(this.responseText);
			}
  			setInterval(function(){
				sonar.open("GET", "sonar");				
				sonar.send();				
				
			}, 300000);
			
		
	</script>

		<aon:panelGrid columns="4" width="100%" 
			columnClasses="aon-header-name aon-vertical-align-middle,aon-header-name,aon-header-name  aon-width-all, aon-header-options aon-width-300 aon-pl-10" style="height:60px;" >

			<aon:panelGroup>

				<aon:div style="margin-bottom:2px;">
					<aon:commandLink id="index" action="start" title="#{bundle.aon_home}" >
					<aon:graphicImage style="vertical-align: middle; padding-left: 6px;"
						value="#{aonResource.resolve['/images/logo-aon.png']}" />
					</aon:commandLink>
					<aon:if test="#{customize.separator != null}">					
						<aon:outputText value="#{customize.separator}"
							style="#{customize.fontStyle}"
							styleClass="aon-nowrap aon-header-domain-title"/>
					</aon:if>

				</aon:div>
			</aon:panelGroup>
			<aon:panelGroup>
				<aon:commandLink 
					id="new_aon"

					style="color: #000;"

					actionListener="#{userUtils.disableNewAONTheme}" >
					<aon:outputText
						value="toggle_on"  
						styleClass="material-icons" 
						style="position:absolute; font-size:38px; transform: translateY(-10px); " 
						/>
					<aon:outputText
					value="Nuevo Diseño" 
					style="padding-left: 38px; white-space: nowrap;" 
					/>
				</aon:commandLink>
			</aon:panelGroup>
			
			<aon:panelGroup style="text-align:left; display:flex" >
					<aon:div styleClass="aon-panel-search" >
						<aon:commandLink styleClass="aon-italic aon-margin-right aon-header-search" onclick="javascript:focusSearchResults(); return true;">
						</aon:commandLink>
						<aon:inputText 
							id="smartFilter" 
							size="60" 
							value="#{search.filter}" 
							placeholder="Buscar Empresas y Trabajadores" 
							styleClass="aon-input-search aon-skip-focus"

							onblur="javascript:hideSearchResults()" 
							onfocus="javascript:showSearchResults()" 
							onkeydown="javascript:escSearchResults(event)"
							>
							<a4j:support 
							event="onkeyup"
							onsubmit="if (window.event.which == 27 || window.event.which == 38 || window.event.which == 40) {return false;}"
							oncomplete="javascript:showSearchResults()"
							reRender="smartFilterTableContainer"
							eventsQueue="domainSwitcherFilterKeyUp"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true">
								<f:setPropertyActionListener target="#{aonConfiguration.properties.showSearchResults}" value="#{true}" />
							</a4j:support> 
							
						</aon:inputText>
					</aon:div>
					
					<aon:div id="smartFilterTableContainer" 
							styleClass="search-results-popup" 
							style="z-index:6; position:absolute; width:50%; margin-top:1.7rem;"

							<aon:if test="#{aonConfiguration.properties.showSearchResults}" >

							<aon:div styleClass="search-results-popup-filter" >

							</aon:div>
							
							<aon:div styleClass="search-results-popup-title" >
								<aon:if test="#{helpSwitcher.model.rowCount eq 0 }" >

									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
								<aon:if test="#{helpSwitcher.model.rowCount eq 1}" >
									<aon:outputText value="Un resultado en Ayuda"
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
								<aon:if test="#{helpSwitcher.model.rowCount le 10 and helpSwitcher.model.rowCount gt 1  }" >
									<aon:outputText value=" #{helpSwitcher.model.rowCount} resultados en Ayuda"
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
								<aon:if test="#{helpSwitcher.model.rowCount gt 10 }" >
									<aon:outputText value="Más de 10 resultados en Ayuda"
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
							</aon:div>
							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
								<ui:param name="rows" value="10" />
							
								<ui:param name="skipSelectButton" value="#{true}" />
								<ui:param name="showDataScroller" value="#{false}" />
							
								<ui:param name="controller" value="#{helpSwitcher}" />
								<ui:param name="skipFocusFirst" value="true" />
							
								<ui:define name="columns">
								<aon:column 
									styleClass="aon-editDataTable-textColumn aon-width-auto selectable" 
									onmouseover="javascript:showHelpTooltip(event,'#{to.getURI()}')"
									onmouseout="javascript:hideHelpTooltip(event)"
									onclick="javascript:hideHelpTooltip(true)"
									>
									
									<h:outputLink target="#{to.getTitle()}" value="#{to.getURI()}" style="display: inline-block;width: 100%;">
										<aon:outputText 
											value="#{to.getDisplay(search.filter)}"
											
											escape="false" />
									</h:outputLink> 					
								</aon:column>
								</ui:define>
							</ui:decorate>

							<aon:if test="#{(!domainSwitcher.adminDomain) and (domainSwitcher.domainCount > 0)}">
								<aon:div styleClass="search-results-popup-title" >

										<aon:outputText value="Ninguna Empresa encontrada"
										styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
									</aon:if>
									<aon:if test="#{domainSwitcher.model.rowCount eq 1}" >
										<aon:outputText value="Una Empresa encontrada"
										styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
									</aon:if>
									<aon:if test="#{domainSwitcher.model.rowCount le 10 and domainSwitcher.model.rowCount gt 1}" >
										<aon:outputText value="#{domainSwitcher.model.rowCount} Empresas encontradas"
										styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
									</aon:if>
									<aon:if test="#{domainSwitcher.model.rowCount gt 10 }" >
										<aon:outputText value="Más de 10 Empresas encontradas"

									</aon:if>
								</aon:div>
						
								<aon:methodParam name="rowSelectorAction" value="start" />

								<aon:methodParam name="rowSelectorActionListener" value="#{search.onSelectChildDomain}" type="actionListener" />
								<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
									<ui:param name="rows" value="10" />
								
									<ui:param name="skipSelectButton" value="#{true}" />
									<ui:param name="showDataScroller" value="#{false}" />
								
									<ui:param name="controller" value="#{domainSwitcher}" />
									<ui:param name="skipFocusFirst" value="true" />
								
									<ui:define name="columns">
									<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto selectable">
										<aon:outputText value="#{to.getDisplay(search.filter)}"
											title="#{(!to.active)?bundle.admin_domain_inactive:''}#{(to.expired)?bundle.admin_domain_expired:''}"
											style="#{(!to.active or to.expired)?'color:red;font-style:italic;':''}"  escape="false" />					
									</aon:column>
									<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="text-align: right;">
										<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
											onmouseout="enableRowSelector();" layout="inline" >				
																	
											<aon:div styleClass="material-icons clipboard-icon" onclick="copyToClipboard(event,'#{domainSwitcher.currentDomainURL}')">
												content_copy
											</aon:div>
										</aon:div>
									</aon:column>
									</ui:define>
								</ui:decorate>
						
								<aon:div></aon:div>
							</aon:if>

							<aon:if test="#{(!domainSwitcher.adminDomain)}">
							<aon:div styleClass="search-results-popup-title" >
								<aon:if test="#{contractSwitcher.model.rowCount eq 0 }" >
									<aon:outputText value="Ningún Trabajador encontrado"
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
								<aon:if test="#{contractSwitcher.model.rowCount eq 1 }" >
									<aon:outputText value="Un Trabajador encontrado"
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
								<aon:if test="#{contractSwitcher.model.rowCount le 10 and contractSwitcher.model.rowCount gt 1 }" >
									<aon:outputText value="#{contractSwitcher.model.rowCount} Trabajadores encontrados"
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
								<aon:if test="#{contractSwitcher.model.rowCount gt 10 }" >
									<aon:outputText value="Más de 10 Trabajadores Encontrados "
									styleClass="aon-nowrap on-editDataTable-textColumn aon-margin-right aon-bold"/>
								</aon:if>
							</aon:div>
							<aon:methodParam name="rowSelectorAction" value="home_employee" />
							<aon:methodParam name="rowSelectorActionListener" value="#{search.onSelectContractDomain}" type="actionListener" />
							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
								<ui:param name="rows" value="10" />
							
								<ui:param name="skipSelectButton" value="#{true}" />
								<ui:param name="showDataScroller" value="#{false}" />
							
								<ui:param name="controller" value="#{contractSwitcher}" />
								<ui:param name="skipFocusFirst" value="true" />
						
								<ui:define name="columns">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto selectable">
									<aon:outputText value="#{to.getDisplay(search.filter)}"
										title="#{(!to.active)?bundle.admin_domain_inactive:''}"
										style="#{(!to.active)?'color:gray;font-style:italic;':''}"  escape="false" />					
								</aon:column>
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="text-align: right;">
								<aon:outputText value="#{to.domainDescription}"
										title="#{(!to.active)?bundle.admin_domain_inactive:''}"
										style="#{(!to.active)?'color:gray;font-style:italic;':''}" />					
								</aon:column>
								</ui:define>
							</ui:decorate>
							<aon:div></aon:div>
							</aon:if>
						
							</aon:if>
						</aon:div>
					
					</aon:div>
	
			</aon:panelGroup>
					
			<aon:div styleClass="aon-width-all aon-nowrap aon-padding-left" rendered="#{loggedUser.logged}"
				style="color:#999; padding-left: 10px;">

					
					<aon:panelGroup style="display:inline;">
						<aon:outputText value="#{domainSwitcher.domainName}"
							style="vertical-align: middle; color: #5f6368;"
							styleClass="aon-nowrap aon-header-domain-title aon-margin-right"/>
						<aon:commandLink id="home" action="start"
							rendered="#{!aonConfiguration.properties.hideMenuHome}"
							title="#{bundle.aon_home}"
							styleClass="aon-header-home"
							value="&#160;" 
							reRender="aonContent" />
						<aon:if test="#{(!domainSwitcher.childDomain) and (!domainSwitcher.adminDomain) and (domainSwitcher.domainCount > 0)}">
							<aon:panelGroup >
			 					<h:outputLink id="DomainSwitch" 
									title="#{bundle.aon_module_enterprise}"
									styleClass="aon-header-domain"
									style="#{customize.fontStyle}" >
								</h:outputLink>
							</aon:panelGroup>
						</aon:if>
						<aon:if test="#{domainSwitcher.enabledGoToParent}">
			 				<h:commandLink id="DomainSwitch" 
								title="#{bundle.aon_module_enterprise}"
								styleClass="aon-header-domain"
								style="#{customize.fontStyle}"
								actionListener="#{domainSwitcher.onUpperDomain}"					
								action="start" />
						</aon:if>

						<aon:dropDownMenu id="aonHelpMenu">
			                <f:facet name="label"> 
			 					<h:outputLink 
									title="#{bundle.aon_help}"
									styleClass="aon-header-help"
									style="#{customize.fontStyle}" >
								</h:outputLink>
							</f:facet>
	                		<aon:menuItem id="enableSupport"
								value="Activar Soporte"
								rendered="#{!desktop.state.supportEnabled and (!domainSwitcher.adminDomain or (domainSwitcher.adminDomain and desktop.state.adminRole))}"
								actionListener="#{desktop.onEnableSupport}"
								reRender="aonHelpMenu"
								iconClass="aon-icon-circle-green" />
	                		<aon:menuItem id="disableSupport"
								value="Desactivar Soporte"
								rendered="#{desktop.state.supportEnabled and (!domainSwitcher.adminDomain or (domainSwitcher.adminDomain and desktop.state.adminRole))}"
								actionListener="#{desktop.onDisableSupport}"
								reRender="aonHelpMenu"
								iconClass="aon-icon-circle-red" />
	                		<!-- *** SUSTITUIDO POR REDMIME.
	                		<aon:menuItem id="cauMessenger"
								value="Soporte / CAU"
								action="portal_cau_messenger" 
								iconClass="aon-icon-helpdesk" />
							-->
			                <aon:if test="#{aonConfiguration.bean.alarm.showList}">
		                		<aon:menuItem id="alarm"
									value="#{bundle.aon_alarm}"
									action="home_alarm" actionListener="#{alarm.onInit}" 
									iconClass="aon-icon-alarm" />
							</aon:if>	
							<aon:menuItem id="favorites" action="home_favorite"
								update="aonContent"
								rendered="#{!aonConfiguration.properties.hideMenuFavorite}"
								iconClass="aon-icon-favorite"
								actionListener="#{actionFavorite.onInit}"
								value="#{bundle.aon_favorites_management}" />
							<aon:if test="#{!aonRole.sysAdmin and (domainSwitcher.type != 'ADMIN')}">
								<aon:menuItem id="advancedMode" action="home_advanced"
								actionListener="#{adminMain.onInitAdvancedMode}"
								rendered="#{!aonConfiguration.properties.hideMenuAdvancedMode}"
								value="#{bundle.admin_advanced_mode}" />
							</aon:if>
<!--						<aon:menuItem id="config_userProfile" action="home_user"
								iconClass="aon-icon-menu-user"
								actionListener="#{domainUser.onInitUserProfile}"
								value="#{bundle.admin_user_profile}" /> -->
							<aon:menuItem id="changePassword" action="home_password"
								iconClass="aon-icon-changePassword"
								actionListener="#{changePassword.onInit}"
								value="#{bundle.aon_security_change_password}" />
			                <aon:menuGroup
			                	rendered="#{!aonConfiguration.properties.hideMenuChooseLanguage}"
			                	value="#{bundle.aon_chooseLocale}">
		                		<aon:menuItem id="spanishLanguage" reRender="aonHeader,aonContent"
		                			value="#{aonConfiguration.locales[0].displayName}"
									iconClass="#{aonConfiguration.locales[0].iconClass}" 
									onclick="localStorage.setItem('aon_language','es')"
									actionListener="#{aonConfiguration.locales[0].onChangeLanguage}" />
		                		<aon:menuItem id="englishLanguage" reRender="aonHeader,aonContent"
		                			value="#{aonConfiguration.locales[1].displayName}"
									iconClass="#{aonConfiguration.locales[1].iconClass}" 
									onclick="localStorage.setItem('aon_language','en')"
									actionListener="#{aonConfiguration.locales[1].onChangeLanguage}" />
								<aon:if test="#{dur.alpha}">
	 	 		                	<aon:menuItem id="deutschLanguage" reRender="aonHeader,aonContent"
		                				value="#{aonConfiguration.locales[2].displayName}"
										iconClass="#{aonConfiguration.locales[2].iconClass}" 
										onclick="localStorage.setItem('aon_language','de')"
										actionListener="#{aonConfiguration.locales[2].onChangeLanguage}" />
	 		                		<aon:menuItem id="basqueLanguage" reRender="aonHeader,aonContent"
										value="#{aonConfiguration.locales[3].displayName}"
										iconClass="#{aonConfiguration.locales[3].iconClass}" 
										onclick="localStorage.setItem('aon_language','eu')"
										actionListener="#{aonConfiguration.locales[3].onChangeLanguage}" /> 
 	 		                		<aon:menuItem id="catalanLanguage" reRender="aonHeader,aonContent"
		                				value="#{aonConfiguration.locales[4].displayName}"
										iconClass="#{aonConfiguration.locales[4].iconClass}" 
										onclick="localStorage.setItem('aon_language','ca')"
										actionListener="#{aonConfiguration.locales[4].onChangeLanguage}" /> 
 	 		                		<aon:menuItem id="galicianLanguage" reRender="aonHeader,aonContent"
		                				value="#{aonConfiguration.locales[5].displayName}"
										iconClass="#{aonConfiguration.locales[5].iconClass}" 
										onclick="localStorage.setItem('aon_language','gl')"
										actionListener="#{aonConfiguration.locales[5].onChangeLanguage}" /> 
								</aon:if>
							</aon:menuGroup>	
													
							<!--  
							<aon:if test="#{dur.aula or domainSwitcher.snapshot}">
								<aon:menuItem submitMode="none" reRender="aonStatus"
									rendered="#{!aonConfiguration.properties.hideMenuHelp}"
									iconClass="aon-icon-menu-help">
	
									<aon:htmlCommandLink id="help" value="#{bundle.aon_help}" target="_blank" action="main_help">
									</aon:htmlCommandLink>
								</aon:menuItem>
							</aon:if>
							<aon:menuItem id="about" reRender="aboutWindowPanel"
								rendered="#{!aonConfiguration.properties.hideMenuAbout}"
								iconClass="aon-icon-about"
								value="#{bundle.aon_about}" >
								<f:setPropertyActionListener target="#{aonConfiguration.properties.showAbout}" value="#{true}" />
							</aon:menuItem>
							-->
						</aon:dropDownMenu>

						<aon:commandLink id="logout"
							style="#{customize.fontStyle}" styleClass="aon-header-logout"
							title="#{bundle.aon_login_user_logout}"
							action="logout"
							actionListener="#{aonConfiguration.logout}" >
						</aon:commandLink>
					</aon:panelGroup> 
					
			</aon:div>
		
		</aon:panelGrid>
		</aon:form>
	</aon:div>
	<aon:if test="#{desktop.logEnabled}">
		<a4j:log hotkey="Z" level="ALL" popup="true" />
	</aon:if>
	<aon:div id="helpTooltip"> 
		<iframe></iframe>
		<div id="tooltip-key">
			<span id="tooltip-key-message">Pulse <span class="keyboard-icon">F2</span> para fijar la ventana</span>
			<span class="material-icons" id="pin">push_pin</span>
		</div>
	</aon:div>
	<aon:div id="copyTooltip"> 
		<span class="material-icons" id="pin">task_alt</span>
		<span> Copiado al portapapeles</span>
	</aon:div>
