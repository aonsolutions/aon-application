<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
>
	<aon:div id="configurationMenuBar" style="display:none" styleClass="aon-configuration-menu-bar" >
	
			<aon:div 
			style="cursor:pointer;" 
			styleClass="aon-portlet-title" 
			onclick="javascript:collapseMenuBar(this)">
				<aon:outputText styleClass="aon-portlet-title-line"/>
				<aon:outputText value="#{bundle.aon_mail_configuration}" />
			</aon:div>
			
			<aon:div styleClass="aon-direct-access-list">
				<aon:div styleClass="aon-direct-access-list-element">
					<aon:commandLink id="mailAccount" 
						rendered="#{actionDenied.renderedOption('mailAccount_list')}"
						action="mailAccount_list"
						actionListener="#{mailConfig.onInitMailAccount}"
						>
							<aon:outputText styleClass="material-icons  aon-left-menu-bar-icon" value="mail" />
							<aon:outputText styleClass="aon-left-menu-bar-text" value=" #{bundle.webmail_mailAccount_full}" />
					</aon:commandLink>
				</aon:div>
				<aon:div styleClass="aon-direct-access-list-element">
					<aon:commandLink id="signature" 
						rendered="#{actionDenied.renderedOption('signature_list')}"
						action="signature_list"
						actionListener="#{mailConfig.onInitSignature}"
						>
						<aon:outputText styleClass="material-icons  aon-left-menu-bar-icon" value="draw" />
						<aon:outputText styleClass="aon-left-menu-bar-text" value=" #{bundle.webmail_signature_full}" />
					</aon:commandLink>
				</aon:div>
				<aon:div styleClass="aon-direct-access-list-element">
					<aon:commandLink id="contact"
						rendered="#{actionDenied.renderedOption('contact_list')}"
						action="contact_list"
						actionListener="#{mailConfig.onInitContact}"
						>
						<aon:outputText styleClass="material-icons  aon-left-menu-bar-icon" value="contacts" />
						<aon:outputText styleClass="aon-left-menu-bar-text" value=" #{bundle.aon_contacts}" />
					</aon:commandLink>
				</aon:div>
			</aon:div>
			
	
	</aon:div>
	
</ui:composition>
