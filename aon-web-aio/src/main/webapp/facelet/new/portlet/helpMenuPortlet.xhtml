<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
>
	<aon:div id="helpMenuBar" style="display:none" styleClass="aon-help-menu-bar" >
	
			<aon:div 
			style="cursor:pointer;" 
			styleClass="aon-portlet-title" 
			onclick="javascript:collapseMenuBar(this)">
				<aon:outputText styleClass="aon-portlet-title-line"/>
				<aon:outputText value="#{bundle.aon_help}" />
			</aon:div>
	
			<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
				<aon:div styleClass="aon-direct-access-list">
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="infoNotifications">
							<aon:outputText styleClass="material-icons  aon-left-menu-bar-icon" value="rss_feed" />
							<aon:outputText styleClass="aon-left-menu-bar-text"  value=" Notificaciones" />
							<f:setPropertyActionListener target="#{help.contentEnabled}" value="#{false}" />
							<f:setPropertyActionListener target="#{help.notificationsEnabled}" value="#{true}" />
						</aon:commandLink> 	
					</aon:div>
					
					<aon:div styleClass="aon-direct-access-list-element #{help.contentEnabled ? 'selected':''}">
						<aon:commandLink id="helpIndex" >
							<aon:outputText styleClass="material-icons  aon-left-menu-bar-icon" value="school" />
							<aon:outputText styleClass="aon-left-menu-bar-text"  value=" Índice Contenidos" />
							<f:setPropertyActionListener target="#{help.contentEnabled}" value="#{true}" />
							<f:setPropertyActionListener target="#{help.notificationsEnabled}" value="#{false}" />
						</aon:commandLink> 	
					</aon:div>
	
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="infoAbout">
							<aon:outputText styleClass="material-icons  aon-left-menu-bar-icon" value="info" />
							<aon:outputText styleClass="aon-left-menu-bar-text"  value=" Acerca de ..." />
							<f:setPropertyActionListener target="#{aonConfiguration.properties.showAbout}" value="#{true}" />
						</aon:commandLink> 	
					</aon:div>
	
				</aon:div>
			</aon:div>
	
	</aon:div>
</ui:composition>
