<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
>
	<script type="text/javascript">
        //<![CDATA[


        	function setupS3UploadPanel(el) {
 	       		;['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
	       			el.addEventListener(eventName, (e) => {
	      			  e.preventDefault()
	    			  e.stopPropagation()
	       			}, false)
	       		});
 	       		;['dragenter', 'dragover'].forEach(eventName => {
	       		  el.addEventListener(eventName, (e) => {
	       			  el.classList.add('highlight');
	       		  }, false)
	       		});
	       		;['dragleave', 'drop'].forEach(eventName => {
	       		  el.addEventListener(eventName, (e) => {
	       			  el.classList.remove('highlight');
	       		  }, false)
	       		});   

	       		el.addEventListener('drop', (e) => {
	    		  let dt = e.dataTransfer;
	    		  let files = dt.files;
	    		  ([...files]).forEach((file) => {
	    			  alert(file);
	    		  });
	       		}, false)
	       		
	       		
	       		el.addEventListener('click', (e) => {
	       			document.forms.s3UploadForm.file.click();
		       	}, false)

	       		
	       	}

        	//]]>
    </script>

  <form name="s3UploadForm" action="http://sigv4examplebucket.s3.amazonaws.com/" method="post" enctype="multipart/form-data" style="display:none;">
    <!--  Key to upload: --> 
    <input type="input"  name="key" value="user/user1/${filename}" /><br />
    <input type="hidden" name="acl" value="public-read" />
    <input type="hidden" name="success_action_redirect" value="http://sigv4examplebucket.s3.amazonaws.com/successful_upload.html" />
    <!--  Content-Type: --> 
    <input type="input"  name="Content-Type" value="image/jpeg" /><br />
    <input type="hidden" name="x-amz-meta-uuid" value="14365123651274" /> 
    <input type="hidden" name="x-amz-server-side-encryption" value="AES256" /> 
    <input type="text"   name="X-Amz-Credential" value="AKIAIOSFODNN7EXAMPLE/20151229/us-east-1/s3/aws4_request" />
    <input type="text"   name="X-Amz-Algorithm" value="AWS4-HMAC-SHA256" />
    <input type="text"   name="X-Amz-Date" value="20151229T000000Z" />

    <!-- Tags for File: --> 
    <input type="input"  name="x-amz-meta-tag" value="" /><br />
    <input type="hidden" name="Policy" value='Base64-encoded policy string' />
    <input type="hidden" name="X-Amz-Signature" value="signature-value" />
    <!-- File: --> 
    <input type="file"  name="file" /> <br />
    <!-- The elements after this will be ignored -->
    <input type="submit" name="submit" value="Upload to Amazon S3" />
  </form>
  	
</ui:composition>
