<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<style>
	.aon-left-menu-item {
		cursor: pointer;
		text-align: left;
	}
	
	.aon-left-menu-item > * {
		display: inline-block;
		vertical-align: middle;
	}
	.aon-left-menu-bar-text{
		width: 14.6rem;
		overflow: hidden;
		white-space: nowrap;
		text-overflow: ellipsis;
		text-transform: uppercase;
	}
	
	
	.aon-portlet-body .aon-direct-access-list-element {
		border-radius: 0.2rem;
	}

	.aon-left-menu-bar-icon {
		size : 1.7rem;
		color: var(--main-color) !important;
	} 
	
	.aon-left-menu-text,
	.aon-left-help-text,
	.aon-left-filter-text {
		display:none;
	}
	
	.aon-left-menu-item[id$=menu_enterprise] .material-icons {
		color: var(--main-color) !important;
	}
	
	.aon-left-menu-item[id$=menu_enterprise] .material-icons:hover,
	.aon-left-menu-item[id$=menu_enterprise].selected .material-icons{
		background-color: var(--main-background-color) !important;
	}

	.aon-left-menu-item[id$=menu_fiscal] .material-icons {
		color: var(--fiscal-color) !important;
	}
	.aon-left-menu-item[id$=menu_fiscal] .material-icons:hover,
	.aon-left-menu-item[id$=menu_fiscal].selected .material-icons{
		background-color: var(--fiscal-background-color) !important;
	}

	.aon-left-menu-item[id$=menu_payroll] .material-icons {
		color: var(--payroll-color) !important;
	}
	.aon-left-menu-item[id$=menu_payroll] .material-icons:hover,
	.aon-left-menu-item[id$=menu_payroll].selected .material-icons{
		background-color: var(--payroll-background-color) !important;
	}
	
	.aon-left-menu-item[id$=menu_accounting] .material-icons {
		color: var(--accounting-color) !important;
	}
	.aon-left-menu-item[id$=menu_accounting] .material-icons:hover,
	.aon-left-menu-item[id$=menu_accounting].selected .material-icons {
		background-color: var(--accounting-background-color) !important;
	}
	
	.aon-left-menu-item[id$=menu_configuration] .material-icons {
		color: var(--configuration-color) !important;
	}
	.aon-left-menu-item[id$=menu_configuration] .material-icons:hover,
	.aon-left-menu-item[id$=menu_configuration].selected .material-icons{
		background-color: var(--configuration-background-color) !important;
	}

	.aon-left-menu-item[id$=menu_help] .material-icons {
		color: var(--help-color) !important;
	}
	.aon-left-menu-item[id$=menu_help] .material-icons:hover,
	.aon-left-menu-item[id$=menu_help].selected .material-icons{
		background-color: var(--help-background-color) !important;
	}

	.aon-help-menu-bar .aon-left-menu-bar-icon {
		color: var(--help-color) !important;
	}

	.aon-fiscal-menu-bar .aon-left-menu-bar-icon {
		color: var(--fiscal-color) !important;
	}

	.aon-payroll-menu-bar .aon-left-menu-bar-icon {
		color: var(--payroll-color) !important;
	}

	.aon-enterprise-menu-bar .aon-left-menu-bar-icon {
		color: var(--main-color) !important;
	}
	
	.aon-accounting-menu-bar .aon-left-menu-bar-icon {
		color: var(--accounting-color) !important;
	}

	[class$="-menu-bar"] .aon-direct-access-list-element{
		padding : 10px;
		text-align: left;
		border-radius: 0.2rem;
	}
	
	.aon-enterprise-menu-bar > .aon-direct-access-list-element{
		background-color: var(--main-color) !important;
	}

	.aon-enterprise-menu-bar > .aon-direct-access-list-element:hover{
		background-color: var(--main-color) !important;
	}

	.aon-enterprise-menu-bar > .aon-direct-access-list-element *{
		font-weight:bold;
		color: #fff !important;
	}
	
	.aon-help-menu-bar .aon-direct-access-list-element:hover{
		background-color: var(--help-background-color) ;
	}

	.aon-fiscal-menu-bar .aon-direct-access-list-element:hover{
		background-color: var(--fiscal-background-color) ;
	}

	.aon-payroll-menu-bar .aon-direct-access-list-element:hover{
		background-color: var(--payroll-background-color) ;
	}

	.aon-enterprise-menu-bar .aon-direct-access-list-element:hover{
		background-color: var(--main-background-color) ;
	}
	
	.aon-accounting-menu-bar .aon-direct-access-list-element:hover{
		background-color: var(--accounting-background-color) ;
	}
	
	.aon-menu-portlet-column1 {
		border-right: solid 0.05rem #d2d2d6;
	}
	
	.aon-menu-portlet-column1,
	.aon-menu-portlet-column2 {
		vertical-align: top;
		height: calc(100vh - 66px);
	}
	.aon-menu-portlet-column2 > * {
		height: calc(100vh - 70px);
		overflow-y: scroll;
	}
	
	.aon-menu-portlet-column2 {
		display: none;
		border-right: solid 0.05rem #d2d2d6;
	}

	.aon-menu-portlet-column2 [class$="-menu-bar"] {
  		/*width: 100%;*/
  		padding: 1rem;
		min-width: 20.4rem;
	}
	
	.aon-left-menu-bar-icon,
	.aon-left-menu-bar-text {
		display: inline-block;
		vertical-align: middle;
		padding-left: 0.5rem;
	}
	
	.aon-portlet-title{
		overflow: hidden;
		color: black !important;
		font-weight:bold !important;
		margin-left: 5px !important;
		margin-top: 0px  !important;
		margin-bottom: 5px !important;
		padding-top: 25px  !important;
	}

	.aon-portlet-title-line {
		max-width: 0rem;
  		height: 1.35rem;
  		border-radius: 20rem;
  		margin-right: 0.5rem;
  		border: 0.15rem solid;
	}
	
	.aon-help-menu-bar .aon-portlet-title-line{
  		border-color: var(--help-color);
  	}	

	.aon-fiscal-menu-bar .aon-portlet-title-line{
  		border-color: var(--fiscal-color);
  	}	
	.aon-payroll-menu-bar .aon-portlet-title-line{
  		border-color: var(--payroll-color);
  	}	

	.aon-accounting-menu-bar .aon-portlet-title-line{
  		border-color: var(--accounting-color);
  	}	
  	
	.aon-configuration-menu-bar .aon-portlet-title-line{
  		border-color: var(--configuration-color);
  	}	

  	.collapsed {
  		display: none;
  	}
  	
  	[id$="timeControlTodayTime"],
  	[id$="timeControlContent"] ,
  	[id$="timeControlContent"] * {
		text-align: center;
  	}

	/* copied from aon.solutions's .aonButton */
	.aonButton {
		-webkit-appearance: none;
		-moz-appearance: none;
		background: var(--aonBlue);
		border: none;
		border-radius: 6px;
		box-shadow: 0 2px 4px rgb(0,0,0,.15);
		color: #fff;
		cursor: pointer;
		display: inline-block;
		font-family: sans-serif;
		font-size: 1rem;
		font-weight: 700;
		margin: 0;
		outline: none !important;
		padding: 1rem 2rem;
		text-align: center;
		text-decoration: none;
		transition: background .25s ease-in-out,transform .15s ease;
	}		

</style>

<script>

	function expandMenuTexts(el) {
		
 		const menuTexts = document.querySelectorAll(".aon-left-menu-text");
		for ( const menuText of menuTexts ) {
			menuText.style.display= "inline-block";
			menuText.parentElement.style.width= "176px";
		}
		#{rich:element('expandMenuTextsButton')}.style.left = '178px';
		#{rich:element('expandMenuTextsButton')}.textContent = 'keyboard_arrow_left';
		el.onclick=function() { collapseMenuTexts(el) };
	} 

	function collapseMenuTexts(el) {
		
 		const menuTexts = document.querySelectorAll(".aon-left-menu-text");
		for ( const menuText of menuTexts ) {
			menuText.style.display= "none";
			menuText.parentElement.style.width= "46px";
		}
		#{rich:element('expandMenuTextsButton')}.style.left = '48px';
		#{rich:element('expandMenuTextsButton')}.textContent = 'keyboard_arrow_right';
		el.onclick=function() { expandMenuTexts(el); };
	} 

	function collapseMenuBar(el) {
		el.nextSibling.style.display= "none";
		el.onclick=function() { expandMenuBar(el); };
	} 
	function expandMenuBar(el) {
		el.nextSibling.style.display= "block";
		el.onclick=function() { collapseMenuBar(el); };
	} 
	
	function showColumn(el) {
		var parentElement = el.parentElement;
		while ( parentElement ) {
			if ( parentElement.tagName === 'TD' ) {
				parentElement.style.display = 'table-cell';	
				return;
			}
			parentElement = parentElement.parentElement;
		}
	}

	function showMenu(el) {
		showColumn(el);
		el.style.display = 'block';
	}
	
	function hideAllMenus() {
		#{rich:element('helpMenuBar')}.style.display = 'none';
		#{rich:element('fiscalMenuBar')}.style.display = 'none';
		#{rich:element('payrollMenuBar')}.style.display = 'none';
		#{rich:element('accountingMenuBar')}.style.display = 'none';
		#{rich:element('enterpriseMenuBar')}.style.display = 'none';
		#{rich:element('timeControlMenuBar')}.style.display = 'none';
		#{rich:element('configurationMenuBar')}.style.display = 'none';
	}
 	function selectMenu(el){
		el.classList.add("selected");
	}
 	function unselectMenu(el){
 		try {
			el.classList.remove("selected");
 		} catch ( err ){
 		}
	}
	
	function unselectMenus() {
		unselectMenu(#{rich:element('menu_help')});
		unselectMenu(#{rich:element('menu_fiscal')});
		unselectMenu(#{rich:element('menu_payroll')});
		unselectMenu(#{rich:element('menu_accounting')});
		unselectMenu(#{rich:element('menu_enterprise')});
		unselectMenu(#{rich:element('menu_time_control')});
		unselectMenu(#{rich:element('menu_configuration')});
	}

	function showHelpMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('helpMenuBar')});
		selectMenu(#{rich:element('menu_help')});
	}

	function showFiscalMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('fiscalMenuBar')});
		selectMenu(#{rich:element('menu_fiscal')});
	}

	function showEnterpiseMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('enterpriseMenuBar')});
		selectMenu(#{rich:element('menu_enterprise')});
	}
	function showAccountingMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('accountingMenuBar')});
		selectMenu(#{rich:element('menu_accounting')});
	}
	function showPayrollMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('payrollMenuBar')});
		selectMenu(#{rich:element('menu_payroll')});
	}

	function showTimeControlMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('timeControlMenuBar')});
		selectMenu(#{rich:element('menu_time_control')});
	}
	
	function showConfigurationMenu () {
		hideAllMenus();	
		unselectMenus();
		showMenu(#{rich:element('configurationMenuBar')});
		selectMenu(#{rich:element('menu_configuration')});
	}
	
</script>
<aon:panelGrid columns="2" styleClass=""
				columnClasses="aon-menu-portlet-column1,aon-menu-portlet-column2">
				
	<aon:div id="menuControlPortlet" styleClass="aon-portlet aon-menu-portlet">
		<aon:div 
		style="cursor:pointer; overflow: visible" 
		styleClass="aon-portlet-title" 
		onclick="javascript:expandMenuTexts(this)"
		>
			<aon:outputText value="MENU" />
			<aon:outputText 
			id="expandMenuTextsButton"
			styleClass="material-icons" 
			value="keyboard_arrow_right" 
			style="position:absolute; top: 20px; left: 48px; z-index: 6; color : #787885; border: solid 0.05rem #d2d2d6; border-radius: 8rem; background-color: #fff" 
			/>
		</aon:div>
		
		<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
			<aon:div 
				id="menuMenuPortlet" >
			</aon:div>
			<aon:div styleClass="aon-direct-access-list">
					<aon:if test="#{domainSwitcher.domainManagementAvailable and (aonRole.sysAdmin or !domainSwitcher.disableDomainManagement)}">
						<aon:if test="#{aonRole.admin}">
							<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
								<aon:commandLink 
									id="menu_enterprise"
									reRender="aonDesktopContent"
									styleClass="aon-left-menu-item" 
									onclick="javascript:showEnterpiseMenu();" 
									actionListener="#{desktop.onSelectEnterprise}"
								>
									<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="domain" />
									<aon:outputText styleClass="aon-left-menu-text" value=" #{bundle.aon_module_enterprise}" />
								</aon:commandLink>
							</aon:div>
						</aon:if>
					</aon:if>
					<aon:if test="#{aonRole.accountingOperator}">
						<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
							<aon:commandLink 
								id="menu_accounting"
								reRender="aonDesktopContent"
								styleClass="aon-left-menu-item" 
								onclick="javascript:showAccountingMenu()"
								actionListener="#{desktop.onSelectAccounting}"
								title=" #{bundle.aon_module_accounting}"
								>
									<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="insert_chart" />
									<aon:outputText styleClass="aon-left-menu-text"  value=" #{bundle.aon_module_accounting}" />
								</aon:commandLink>
						</aon:div>
					</aon:if>

					<aon:if test="#{aonRole.fiscal}">
						<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
							<aon:commandLink 
								id="menu_fiscal"
								reRender="aonDesktopContent"
								styleClass="aon-left-menu-item" 
								onclick="javascript:showFiscalMenu()"
								actionListener="#{desktop.onSelectFiscal}"
								title=" #{bundle.aon_module_fiscal}"
							>
								<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="euro" />
								<aon:outputText styleClass="aon-left-menu-text"  value=" #{bundle.aon_module_fiscal}" />
							</aon:commandLink>
						</aon:div>
					</aon:if>

					<aon:if test="#{aonRole.payroll}">
						<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
							<aon:commandLink 
								id="menu_payroll"
								reRender="aonDesktopContent"
								styleClass="aon-left-menu-item"
								onclick="javascript:showPayrollMenu()" 
								actionListener="#{desktop.onSelectPayroll}"
								title=" #{bundle.aon_module_payroll}"
							>
								<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="group" />
								<aon:outputText styleClass="aon-left-menu-text" value=" #{bundle.aon_module_payroll}" />
							</aon:commandLink>
						</aon:div>
					</aon:if>

					<aon:if test="#{!((domainSwitcher.type == 'ADMIN') and !aonRole.admin)}">		
						<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
							<aon:commandLink 
								id="menu_configuration"
								reRender="aonDesktopContent"
								styleClass="aon-left-menu-item" 
								onclick="javascript:showConfigurationMenu()" 
								actionListener="#{desktop.onSelectConfiguration}"
								title=" #{bundle.aon_module_configuration}"
							>
								<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="construction" />
								<aon:outputText styleClass="aon-left-menu-text"  value=" #{bundle.aon_module_configuration}" />
							</aon:commandLink>
						</aon:div>
					</aon:if>

					<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
						<aon:commandLink 
							id="menu_help"
							reRender="aonDesktopContent"
							styleClass="aon-left-menu-item"
							onclick="javascript:showHelpMenu()" 
							actionListener="#{desktop.onSelectHelp}"
						>
							<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="help_center" />
							<aon:outputText styleClass="aon-left-menu-text"  value=" #{bundle.aon_module_configuration}" />
						</aon:commandLink>
					</aon:div>
					
					<aon:div styleClass="aon-direct-access-list-element aon-align-left ">
						<aon:commandLink 
							id="menu_time_control"
							reRender="aonDesktopContent"
							styleClass="aon-left-menu-item"
							onclick="javascript:showTimeControlMenu()" 
							actionListener="#{desktop.onSelectTimeControl}"
							title=" Control Horario"
						>
							<aon:outputText styleClass="material-icons  aon-vertical-middle aon-left-menu-icon" value="timer" />
							<aon:outputText styleClass="aon-left-menu-text"  value=" Control Horario" />
						</aon:commandLink>
					</aon:div>
					

			</aon:div>
		</aon:div>
	</aon:div>
	
	<aon:div id="menuBarPortlet" styleClass="aon-portlet aon-menu-bar-portlet" >
		<aon:form id="menuBarPortletForm">
	
			<aon:if test="#{aonRole.admin}">
				<ui:include src="/facelet/new/portlet/enterpriseMenuPortlet.xhtml" />
			</aon:if>
		
			<ui:include src="/facelet/new/portlet/accountingMenuPortlet.xhtml" />
		
			<ui:include src="/facelet/new/portlet/fiscalMenuPortlet.xhtml" />
	
			<ui:include src="/facelet/new/portlet/payrollMenuPortlet.xhtml" />
	
			<ui:include src="/facelet/new/portlet/configurationMenuPortlet.xhtml" />
	
			<ui:include src="/facelet/new/portlet/helpMenuPortlet.xhtml" />
	
			<ui:include src="/facelet/new/portlet/timeControlMenuPortlet.xhtml" />

		</aon:form>
	</aon:div>
	
	
</aon:panelGrid>		

</ui:composition>
