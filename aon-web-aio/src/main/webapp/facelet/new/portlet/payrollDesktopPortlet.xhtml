<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
>
	<style>
		
		[id$=payrollMenuDesktop] .aon-menu-desktop-element-icon {
			color: var(--payroll-color);
			background-color: var(--payroll-background-color);
		}
		
		[id$=payrollMenuDesktop]  .aon-menu-desktop-header-line, 
		[id$=payrollMenuDesktop]  .aon-menu-desktop-element-line{
			border-color: var(--payroll-color);
		}
		
	</style>

	<aon:div id="payrollMenuDesktop" styleClass="aon-menu-desktop" >
			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="1" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-200">

					<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
						<aon:panelGrid id="group_main_payroll"
							columns="3"
							headerClass="aon-menu-desktop-header"
							columnClasses="aon-padding aon-menu-desktop-element-col, aon-padding aon-menu-desktop-element-col, aon-menu-desktop-element-col"
							styleClass="aon-width-all aon-menu-desktop-panel" 
							rendered="#{actionDenied.renderedGroup('group_main_payroll')}"					
							>
							<f:facet name="header">
								<aon:div>
									<aon:outputText styleClass="aon-menu-desktop-header-line" />
									<aon:outputText styleClass="aon-menu-desktop-header-text" value="#{bundle.payroll_salary_menu_group}" />
								</aon:div>
							</f:facet>
							<aon:div styleClass="aon-menu-desktop-element">
 									<h:panelGrid columns="3" styleClass="aon-width-all">
 										
										<aon:outputText styleClass="aon-menu-desktop-element-line" />
										<aon:div>
											<aon:commandLink id="gwt_employee"
												rendered="#{actionDenied.renderedOption('gwt_employee_tree')}"
												action="gwt_employee_tree"
												title="#{bundle.menu_integral}"
												>
												<aon:outputText styleClass="material-icons aon-menu-desktop-element-icon" value="account_tree" />
												<aon:outputText styleClass="aon-menu-desktop-element-text" value="#{bundle.menu_integral}" />
											</aon:commandLink>	
										</aon:div>
										<aon:outputText styleClass="material-icons aon-menu-desktop-element-go" value="keyboard_arrow_right" />
									</h:panelGrid>
									<aon:div id="payrollGraphContainer"
										style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
										<aon:div styleClass="aon-bold">
											<aon:outputText value="Nóminas por Meses del Ejercicio" />
											<aon:selectOneMenu id="salaryYearSelect"
												style="border: none;" value="#{dashboard.salaryYear}">
												<a4j:support event="onchange"
													actionListener="#{dashboard.onSalaryYearChanged}"
													reRender="payrollGraphContainer" ajaxSingle="true" />
												<f:selectItem itemLabel="-" itemValue="" />
												<f:selectItems value="#{dashboard.payrollYears}" />
											</aon:selectOneMenu>
										</aon:div>
										
										<aon:div id="salaryChartDiv" style="width: 100%; height: 180px;" />
					
										<script type="text/javascript"> 
												function drawSalaryColumnChart(){
													var data = new google.visualization.DataTable();
													data.addColumn('string', 'Mes');
													data.addColumn('number', 'Nominas');
													data.addColumn('number', 'Extras');
													data.addColumn('number', 'Finiquitos');
													data.addColumn('number', 'Atrasos');
													
													<c:forEach var="entry" items="#{dashboard.periodPayrollCount}">		
														
														data.addRow(['#{entry.Mes}',
														             #{entry.Nominas},
														             #{entry.Extras}, 
														             #{entry.Finiquitos}, 
														             #{entry.Atrasos} ]);		
													</c:forEach>
													
													var options = {
														chartArea:{
															left:30,
															right:5,
															top:15,
															width:"100%",
															height:"60%"
														},									       
													       legend: { 
													       	position: 'top', 
													       	maxLines: 12 
													    },
													    tooltip: {
													     	isHtml: true
													    },
														bar: { 
															groupWidth: '75%' 
														},
													   	isStacked: true,
													    theme: 'material',
													    
													};
													      
													var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:salaryChartDiv'));
													chart.draw(data, options);
												}
												
												google.charts.load('current', {packages: [ 'corechart']});
												google.charts.setOnLoadCallback(drawSalaryColumnChart);
																
										   </script>
									</aon:div>
									
							</aon:div>
							<aon:div styleClass="aon-menu-desktop-element">
									<h:panelGrid columns="3" styleClass="aon-width-all">
										<aon:outputText styleClass="aon-menu-desktop-element-line" />
										<aon:div>
											<aon:commandLink 
												id="gwt_main_contrata"
												title="#{bundle.payroll_contract_module}"
												rendered="#{actionDenied.renderedOption('gwt_main_contrata')}"
												action="gwt_main_contrata"
											>
												<aon:outputText styleClass="material-icons aon-menu-desktop-element-icon" value="group" />
												<aon:outputText styleClass="aon-menu-desktop-element-text" value="#{bundle.payroll_contract_module}" />
											</aon:commandLink>	
										</aon:div>
										<aon:outputText styleClass="material-icons aon-menu-desktop-element-go" value="keyboard_arrow_right" />
									</h:panelGrid>
									<aon:div id="ContractsGraphContainer"
										style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
										<aon:div styleClass="aon-bold">
											<aon:outputText value="Altas y Bajas de Contratos" />
											<aon:selectOneMenu id="contractYearSelect"
												style="border: none;" value="#{dashboard.contractYear}">
												<a4j:support event="onchange"
													actionListener="#{dashboard.onContractYearChanged}"
													reRender="ContractsGraphContainer,messageList" ajaxSingle="true" />
												<f:selectItem itemLabel="-" itemValue="" />
												<f:selectItems value="#{dashboard.payrollYears}" />
											</aon:selectOneMenu>
										</aon:div>
										<aon:div id="contractChartDiv"
											style="width: 100%; height: 180px;" />
					
										<script type="text/javascript"> 
												function drawContractColumnChart(){
										
													var data = new google.visualization.DataTable();
													data.addColumn('string', 'Mes');
													data.addColumn('number', 'Altas');
													data.addColumn('number', 'Bajas');							
													
													<c:forEach var="staff" items="#{dashboard.periodContractCount}">
													
														data.addRow(['#{staff.month}',
														             #{staff.altas},
														             #{staff.bajas} ]);	
														
													</c:forEach>
													
													var options = {
														chartArea:{
															left:30,
															right:5,
															top:15,
															width:"90%",
															height:"60%"
														},									       
													    legend: { 
													    	position:'top', 
													        maxLines: 12 
													    },
													    tooltip: {
													    	isHtml: true
													    },
														bar: { 
															groupWidth: '75%' 
														},
													    //isStacked: true,
													    theme: 'material',
													};
													var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:contractChartDiv'));
													chart.draw(data, options);
												}
												
												google.charts.load('current', {packages: ['bar']});
												google.charts.setOnLoadCallback(drawContractColumnChart);
																	
										   </script>
									</aon:div>
									
							</aon:div>
							<aon:div styleClass="aon-menu-desktop-element">
									<h:panelGrid columns="3" styleClass="aon-width-all">
										<aon:outputText styleClass="aon-menu-desktop-element-line" />
										<aon:div>
											<aon:commandLink 
												id="gwt_main_it"
												rendered="#{actionDenied.renderedOption('gwt_main_it')}"
												action="gwt_main_it"
												title="#{bundle.payroll_contractLeave_module_new}"
											>
												<aon:outputText styleClass="material-icons aon-menu-desktop-element-icon" value="personal_injury" />
												<aon:outputText styleClass="aon-menu-desktop-element-text" value="#{bundle.payroll_contractLeave_module_new}" />
											</aon:commandLink>	
										</aon:div>
										<aon:outputText styleClass="material-icons aon-menu-desktop-element-go" value="keyboard_arrow_right" />
									</h:panelGrid>
									<aon:div  style="width: 98%; height: 200px; text-align: center; margin-left: 5px; padding-top: 5px;">
									</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:if>


					<aon:if test="#{domainSwitcher.domainManagementAvailable}">
						<aon:panelGrid id="group_payroll_contrata_auxiliaries2"
							columns="3"
							headerClass="aon-menu-desktop-header"
							columnClasses="aon-padding"
							styleClass="aon-width-all aon-menu-desktop-panel" 
							rendered="#{actionDenied.renderedGroup('group_payroll_contrata_auxiliaries2')}"					
							>
							<f:facet name="header">
								<aon:div>
									<aon:outputText styleClass="aon-menu-desktop-header-line" />
									<aon:outputText styleClass="aon-menu-desktop-header-text" value="#{bundle.aon_auxiliaries}" />
								</aon:div>
							</f:facet>
							<aon:div styleClass="aon-menu-desktop-element">
									<h:panelGrid columns="3" styleClass="aon-width-all">
										<aon:outputText styleClass="aon-menu-desktop-element-line" />
										<aon:div>
											<aon:commandLink 
												id="gwt_agreement2"
												rendered="#{actionDenied.renderedOption('gwt_main_agreement')}"
												title="#{bundle.payroll_agreement_module}"
												action="gwt_main_agreement" 
											>
												<aon:outputText styleClass="material-icons aon-menu-desktop-element-icon" value="list" />
												<aon:outputText styleClass="aon-menu-desktop-element-text" value="#{bundle.payroll_agreement_module}" />
											</aon:commandLink>	
										</aon:div>
										<aon:outputText styleClass="material-icons aon-menu-desktop-element-go" value="keyboard_arrow_right" />
									</h:panelGrid>
									
							</aon:div>
							
							<aon:div styleClass="aon-menu-desktop-element">
									<h:panelGrid columns="3" styleClass="aon-width-all">
										<aon:outputText styleClass="aon-menu-desktop-element-line" />
										<aon:div>
											<aon:commandLink id="contractMode-payroll2"
												rendered="#{actionDenied.renderedOption('contractMode-payroll2')}"
												action="contractOption_list-payroll"
												actionListener="#{contractModel.onReset}"
											>
												<aon:outputText styleClass="material-icons aon-menu-desktop-element-icon" value="list" />
												<aon:outputText styleClass="aon-menu-desktop-element-text" value="#{bundle.payroll_contract_mode_module}" />
											</aon:commandLink>
										</aon:div>
										<aon:outputText styleClass="material-icons aon-menu-desktop-element-go" value="keyboard_arrow_right" />
									</h:panelGrid>
							</aon:div>
							
							<aon:div styleClass="aon-menu-desktop-element">
									<h:panelGrid columns="3" styleClass="aon-width-all">
										<aon:outputText styleClass="aon-menu-desktop-element-line" />
										<aon:div>
											<aon:commandLink id="holiday-payroll2"
												rendered="#{actionDenied.renderedOption('holiday_search')}"
												action="holiday_search"
												actionListener="#{holiday.onEditSearch}"
											>
												<aon:outputText styleClass="material-icons aon-menu-desktop-element-icon" value="calendar_month" />
												<aon:outputText styleClass="aon-menu-desktop-element-text" value="#{bundle.calendar_holidays}"  />
											</aon:commandLink>
										</aon:div>
										<aon:outputText styleClass="material-icons aon-menu-desktop-element-go" value="keyboard_arrow_right" />
									</h:panelGrid>
							</aon:div>
								
						</aon:panelGrid>


					</aon:if>
				</h:panelGrid>
			</aon:div>

	</aon:div>
</ui:composition>
