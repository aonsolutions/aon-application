<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<style>
		/* copied from aon.solutions's .aonButton */
		.aonButton {
			-webkit-appearance: none;
			-moz-appearance: none;
			background: var(--aonBlue);
			border: none;
			border-radius: 6px;
			box-shadow: 0 2px 4px rgb(0,0,0,.15);
			color: #fff;
			cursor: pointer;
			display: inline-block;
			font-family: sans-serif;
			font-size: 1rem;
			font-weight: 700;
			margin: 0;
			outline: none !important;
			padding: 1rem 2rem;
			text-align: center;
			text-decoration: none;
			transition: background .25s ease-in-out,transform .15s ease;
		}		
	</style>

	
	
	<aon:div id="timeControlPortlet" styleClass="aon-portlet">
		<aon:div styleClass="aon-portlet-title">
			<aon:outputText value="CONTROL HORARIO" />
		</aon:div>
		
		<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
			<aon:div 
				id="timeControlTodayTime" 
				style="font-size: 30px; cursor: default;" >
				#{timeControl.todayTime}
			</aon:div>
			
			<aon:div id="timeControlContent">
				<aon:if test="#{timeControl.in}">
					<aon:commandButton 
						value="SALIDA" 
						styleClass="aonButton" 
						id="timeControlButtonOut"
						actionListener="#{timeControl.out}"
						style="background-color: rgb(220, 77, 48); padding: 1rem; width: 87px; margin-right:5px;" />
					<aon:commandButton 
						value="PAUSA" 
						styleClass="aonButton" 
						id="timeControlButtonPause"
						actionListener="#{timeControl.pause}"
						style="background-color: rgb(243, 159, 29); padding: 1rem; width: 87px; " />
					<aon:if test="#{timeControl.todayLastTimeIn != null}" >
						<aon:div id="timeControltodayLastTimeIn" style="margin-top: 10px; color: grey; font-size: 12px; cursor: default;">Ult. entrada hoy, #{timeControl.todayLastTimeIn}</aon:div>
					</aon:if>
					<script type='text/javascript' >
							
						function chronometer () {
							timeControlTodayTime = document.getElementById('aonContent:mainForm:timeControlTodayTime');
							todayTimeString = timeControlTodayTime.textContent.trim();
							todayDateTime = new Date('1975-05-03T' + todayTimeString  + '');
							
							todayDateTime.setSeconds(todayDateTime.getSeconds()+1);
							
							hours = todayDateTime.getHours();
							minutes = todayDateTime.getMinutes();
							seconds = todayDateTime.getSeconds();

							timeControlButtonOut = document.getElementById('aonContent:mainForm:timeControlButtonOut');
							if ( !timeControlButtonOut ) 
								return;

							timeControlTodayTime.textContent = 
							String(hours).padStart(2,'0') 
							+ ":" + String(minutes).padStart(2,'0') 
							+ ":" + String(seconds).padStart(2,'0');							
							
							setTimeout(chronometer, 1000);	
						}
						setTimeout(chronometer, 1000);
							
					</script>
				</aon:if>
				<aon:if test="#{timeControl.out}">
					<aon:commandButton 
						value="ENTRADA"
						styleClass="aonButton" 
						id="timeControlButtonIn" 
						actionListener="#{timeControl.in}"
						style="background-color: rgb(134, 211, 100); padding: 1rem; width: 120px;"/>
					<aon:if test="#{timeControl.todayLastTimeOut != null}" >
						<aon:div id="timeControltodayLastTimeOut" style="margin-top: 10px; color: grey; font-size: 12px; cursor: default;">Ult. salida hoy, #{timeControl.todayLastTimeOut}</aon:div>
					</aon:if>
					<script type='text/javascript' >
						function chronometer () {
						}
					</script>
				</aon:if>
				<aon:if test="#{timeControl.pause}">
					<aon:commandButton
						value="VUELTA" 
						styleClass="aonButton" 
						id="timeControlButtonBack" 
						actionListener="#{timeControl.back}"
						style="background-color: rgb(134, 211, 100); padding: 1rem; width: 120px;" />
					<aon:if test="#{timeControl.todayLastTimePause != null}" >
						<aon:div id="timeControltodayLastTimePause" style="margin-top: 10px; color: grey; font-size: 12px; cursor: default;">Ult. pausa hoy, #{timeControl.todayLastTimePause}</aon:div>
					</aon:if>
					<script type='text/javascript' >
						function chronometer () {
						}
					</script>
				</aon:if>
				
				<aon:div id="timeControlWeekTime" style="margin-top: 10px; color: grey; font-size: 12px; cursor: default;" data-sum-hour="169888000">Horas semana actual: <span style="font-weight: 800; color: black;" id="timeControlWeekTimeSpan">#{timeControl.weekTime}</span>

				</aon:div>
			</aon:div>		
		</aon:div>
	</aon:div>



</ui:composition>
