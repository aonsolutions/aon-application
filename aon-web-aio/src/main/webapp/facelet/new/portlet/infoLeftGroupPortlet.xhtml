<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">
	
	
	<aon:div id="desktopDiv1" style="padding-top: 5px; width:30px" >
		
	<style>
		.aon-portlets-column1{
			width : 30px;
			padding: 0px;
			text-align: right;
		}
		.aon-show-button {
			opacity: 0.6; 
			padding: 10px;
			position:relative;
			background-color: #ddd; 
			border-top-right-radius: 50%; 
			border-bottom-right-radius: 50%;  
		}
		.aon-hide-button {
			z-index: 66;
			opacity: 0.6; 
			padding: 10px;
			position:relative;
			background-color: #ddd; 
			transform: rotate(180deg);
			border-top-right-radius: 50%; 
			border-bottom-right-radius: 50%;  
		}
		
		.aon-portlet-title {
			color: gray;
			font-size: 12px;
			font-weight: normal;
			margin-top: 15px;			
			margin-left: 15px;
			margin-bottom: 10px;
			text-transform: uppercase;
		}
		
		/* copied from aon.solutions's .aonButton */
		.aonButton {
			-webkit-appearance: none;
			-moz-appearance: none;
			background: var(--aonBlue);
			border: none;
			border-radius: 6px;
			box-shadow: 0 2px 4px rgb(0,0,0,.15);
			color: #fff;
			cursor: pointer;
			display: inline-block;
			font-family: sans-serif;
			font-size: 1rem;
			font-weight: 700;
			margin: 0;
			outline: none !important;
			padding: 1rem 2rem;
			text-align: center;
			text-decoration: none;
			transition: background .25s ease-in-out,transform .15s ease;
		}		
	</style>
	
	<script type='text/javascript' >

		function collapseMenuPortlet(el) {
			el.nextSibling.style.display= "none";
			el.firstChild.innerText= 'expand_more';
			el.onclick=function() { expandMenuPortlet(el); };
		} 
		function expandMenuPortlet(el) {
			el.nextSibling.style.display= "block";
			el.firstChild.innerText= 'expand_less';
			el.onclick=function() { collapseMenuPortlet(el); };
		} 

		function showInfoGroup() {
			document.getElementById("aonContent:mainForm:desktopDiv1").parentNode.style.width='250px';
			document.getElementById("aonContent:mainForm:desktopDiv1").style.width='100%';
			document.getElementById("aonContent:mainForm:infoGroupDiv").style.display='block';
		}
		
		function hideInfoGroup() {
			document.getElementById("aonContent:mainForm:desktopDiv1").parentNode.style.width='30px';
			document.getElementById("aonContent:mainForm:desktopDiv1").style.width='30px';
			document.getElementById("aonContent:mainForm:infoGroupDiv").style.display='none';
		}
	</script>

		<aon:div id="infoGroupDiv" style="display:none;  position:relative; top: -0px" >

			<ui:include src="/facelet/homepage/portlet/logoPortlet.xhtml" />					

			<aon:if test="#{!domainSwitcher.childDomain}">
			<ui:include src="/facelet/new/portlet/summaryControlPortlet.xhtml" /> 
			<ui:include src="/facelet/new/portlet/filterControlPortlet.xhtml" />
			</aon:if>
			<aon:if test="#{dur.aula}">
				<ui:include src="/facelet/new/portlet/helpControlPortlet.xhtml" />
			</aon:if>
			<aon:if test="#{timeControl.active}">
				<ui:include src="/facelet/new/portlet/timeControlPortlet.xhtml" />
			</aon:if>

		</aon:div>
		
		<aon:if test="#{!domainSwitcher.childDomain or timeControl.active or dur.aula}">
			<script type='text/javascript' >
				showInfoGroup();
			</script>
		</aon:if>
	
	</aon:div>
					
</ui:composition>
