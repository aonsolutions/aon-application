<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<h:panelGrid columns="3" styleClass="aon-width-all aon-margin-bottom"
		style="border: solid #CCCCCC 1px; color: #777777; background-color: #F5F5F5;" 
		columnClasses="aon-width-50 aon-vertical-align-center
					,aon-width-all aon-vertical-align-center
					,aon-nowrap aon-vertical-align-center">
					
		<aon:commandLink id="goToParentFromLogo-back" 
			action="home" actionListener="#{domains.onParentDomain}"
			reRender="aonHeader,aonContent" 
			disabled="#{!domainSwitcher.enabledGoToParent}">
			<!--  a4j:mediaOutput
				mimeType="#{parentDomain.mimeTypeName}"
				cacheable="false" element="img" 
				value="aon-parent-logo" 
				style="height:60px;"
				createContent="#{parentDomain.createLogoContent}">
			</a4j:mediaOutput-->
			<img
				style="height:60px;"				
				src="aonDocuments/company.logo?#{domainSwitcher.parentDomainId}"/>
			
		</aon:commandLink>
		
		<h:panelGrid styleClass="aon-padding-left aon-width-all">
			<aon:commandLink id="goToParentFromName-back"
				action="home" actionListener="#{domains.onParentDomain}"
				reRender="aonHeader,aonContent"
				style="font-size: 1.2em;" styleClass="aon-bold" value="#{parentDomain.name}" 
				disabled="#{!domainSwitcher.enabledGoToParent}" />
			<aon:outputText value="#{parentDomain.phone}"/>						
			<aon:commandLink title="#{bundle.webmail_send_email}" 
				ajaxSingle="true" reRender="showNewMessageWindow"
				value="#{parentDomain.email}"
				actionListener="#{webmailMessage.onSendEmail}" >
				<f:setPropertyActionListener target="#{webmailMessage.showNewMessageWindow}" value="#{true}" />
				<f:param name="email" value="#{parentDomain.email}" />
			</aon:commandLink>
		</h:panelGrid>
		
		<aon:div styleClass="aon-text-center">
			<aon:div>
				<aon:div style="font-size: 1.1em;">
					<aon:outputText value="#{bundle.aon_support_title}" />
				</aon:div>
				<aon:div style="font-size: 1.3em; font-weight: bold;">
					<aon:outputText value="#{customize.supportTelephone}" />
				</aon:div>
			</aon:div>
			<aon:div style="font-weight: bold;">
				<aon:commandLink title="#{bundle.webmail_send_email}" 
				ajaxSingle="true" reRender="showNewMessageWindow"
				value="#{customize.supportEmail}"
				style="color:#888888; text-decoration:none;"
				actionListener="#{webmailMessage.onSendEmail}" >
				<f:setPropertyActionListener target="#{webmailMessage.showNewMessageWindow}" value="#{true}" />
				<f:param name="email" value="#{customize.supportEmail}" />
				</aon:commandLink>							    
			</aon:div>			
		</aon:div>
				

	</h:panelGrid>

</ui:composition>
