	<ui:define name="menuContentPopup">
		<script type="text/javascript" > 
			//<![CDATA[
   			var aonPopupTimer;
   			var menuContentPopupTimer;

			function delayMenu(fn, ms) {
      			clearTimeout(menuContentPopupTimer);
      			menuContentPopupTimer = setTimeout(fn, ms || 250);
			};

			function delayAon(fn, ms) {
      			clearTimeout(aonPopupTimer);
      			aonPopupTimer = setTimeout(fn, ms || 250);
			};

			function showAonPopup(menuPopup, el){
				delayAon( function(){
					aonContentPopup = document.getElementById('aonContent:aonContentPopup');
					aonContentPopup.style.display = "block";
				});
			}

			function hideAonPopup(menuPopup, el){
				delayAon( function(){
					aonContentPopup = document.getElementById('aonContent:aonContentPopup');
					aonContentPopup.style.display = "none";
				});
			}

			function getMenuPopup(menuPopup){
				menuContentPopup = document.getElementById('aonContent:menuContentPopup');
				menuPopups = menuContentPopup.children
				for ( i = 0; i < menuPopups.length; i++ ){
					menuPopupId = menuPopups[i].id; 
					if ( menuPopupId.includes(menuPopup) ) {
						return menuPopups[i];
					} 
				}
			}
			
			function select(el) {
				if ( el )  el.classList.add('aon-top-menu-item-selected');
			}
			
			function cleanSelected() {
				selected = document.getElementsByClassName('aon-top-menu-item-selected');
				for ( i = 0; i < selected.length; i++ ){
					selected[i].classList.remove('aon-top-menu-item-selected');
				}
			}
			
			function enable(){
				disabledMenuPopup = undefined; 
			}

			function disable(el){
				disabledMenuPopup = el.id; 
			}
			
			function isDisabled(el){
				try {
					if ( disabledMenuPopup == el.id ) 
						return true;
				} catch ( e ) {
				} 
				return false;
			}

			function hideMenuPopup(menuPopup){
      			clearTimeout(menuContentPopupTimer);

				menuPopup = getMenuPopup(menuPopup);
				
				elementAtMouse = getElementAtMousePosition();
				while ( elementAtMouse ) { 
					if ( menuPopup == elementAtMouse ) 
						return;
					elementAtMouse = elementAtMouse.parentElement; 
				}
				
				
				//menuPopup.style.display = "none";
				setTimeout(function(){
					menuPopup.style.display = "none";
				}, 260);
				
				 
				cleanSelected();
				enable();
			}

			function hideAllMenuPopup(){
				menuContentPopup = document.getElementById('aonContent:menuContentPopup');
				menuPopups = menuContentPopup.children
				for ( i = 0; i < menuPopups.length; i++ ){
					menuPopups[i].style.display="none"; 
				}
			}
			
			function disableMenuPopup(menuPopup, el){
				hideMenuPopup(menuPopup);
				disable(el);
			}
			
			function showMenuPopup(menuPopup, el){
				if ( isDisabled(el) ) 
					return;
				if(el.classList.contains("aon-top-menu-item-select"))
					return;
				select(el);
				delayMenu( function() { 
						menuPopup = getMenuPopup(menuPopup);
						menuPopup.style.display = "block";
					} 
				);
			}
			
			function getElementAtMousePosition(e) {
    			e = e || window.event;
    			x = e.clientX;
    			y = e.clientY;
    			return document.elementFromPoint(x,y);
			}

			//]]>
		</script>
