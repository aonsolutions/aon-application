<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="enterpriseMenuPopup" style="display:none" 
	onclick="javascript:selectItemHeader(this.id)"
	onmouseout="javascript:hideMenuPopup(this.id)" 
	onmouseover="javascript:showMenuPopup(this.id)" >

		<aon:form id="enterpriseMenuForm">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_enterprise_security"
							rendered="#{actionDenied.renderedGroup('group_enterprise_security')}"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-company aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_enterprise}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="newDomain-enterprise"
										rendered="#{actionDenied.renderedOption('newDomain_form-enterprise')}"
										action="newDomain_form-enterprise"
										actionListener="#{adminNewDomain.onInit}"
										value="#{bundle.admin_new_domain}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="removeDomain-enterprise"
										rendered="#{actionDenied.renderedOption('removeDomain_form-enterprise')}"
										action="removeDomain_form-enterprise"
										actionListener="#{adminRemoveDomain.onInit}"
										value="#{bundle.admin_remove_domain}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</aon:div>
</ui:composition>
