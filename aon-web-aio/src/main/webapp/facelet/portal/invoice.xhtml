<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<meta name="gwt:property" content="locale=es_ES" />


	<style>
	body {
		margin: 0;
	}
	</style>


	<ui:include
		src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />

	<ui:include src="/facelet/homepage/menu.xhtml" />


	<script type="text/javascript">
        //<![CDATA[
        
 		delete Array.prototype.toJSON;
        
        function getCurrentUser() {
        	return '#{domainSwitcher.currentUser}';
        }

        function getCurrentDomainNameURL() {
        	return '#{domainSwitcher.currentDomainNameURL}';
        }
        
        function loadInvoicePanel(el) {
			el.innerHTML='<aon-invoice-panel></aon-invoice-panel>';
       	} 
       	
       	function loadStylesSheet( stylesheet ) {
			var link = document.createElement( "link" );
			link.type = "text/css";
			link.rel = "stylesheet";
			link.media = "screen,print";
			link.href = stylesheet;

			document.getElementsByTagName( "head" )[0].appendChild( link );
       	}
       	
       	loadStylesSheet('https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css');
       	loadStylesSheet('https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined');
       	loadStylesSheet('https://code.getmdl.io/1.3.0/material.indigo-pink.min.css');

       	loadStylesSheet('css/aon.css');
       	loadStylesSheet('css/aon-toast.css');
       	loadStylesSheet('css/aon-grid.css');
       	loadStylesSheet('css/aon-input.css');
       	loadStylesSheet('css/aon-switch.css');
       	loadStylesSheet('css/aon-input-loading.css');
       	loadStylesSheet('css/aon-input-loading.css');
       	
		localStorage.setItem('aon_domain_id', #{domainSwitcher.domainId});
		localStorage.setItem('aon_domain_name', '#{domainSwitcher.currentDomainNameURL}');
		localStorage.setItem('aon_session_id', '#{domainSwitcher.token}');
       	

        //]]>
    </script>
    
	<script src="//mozilla.github.io/pdf.js/build/pdf.js"></script>    

	<script type="module" src="modules/invoice/aon-invoice-panel.js"></script>

	<!--script type="text/javascript"

	</div>




	<script type="text/javascript">
		//<![CDATA[ 
		loadInvoicePanel(document.getElementById('rootPanel'));
		//]]>
	</script>
	


</ui:composition>
