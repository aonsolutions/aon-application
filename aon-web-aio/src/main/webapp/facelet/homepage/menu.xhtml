<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<aon:graphicImage style="margin-left: 6px;margin-right: 4px;"
			value="#{customize.toolbarLogo}" />			
					
		<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
			<aon:commandLink id="menu_garage"
				value="#{bundle.aon_module_garage}"
				action="menu_garage" immediate="true"
				styleClass="aon-top-menu-item" />
	
			<aon:commandLink id="menu_academy"
				value="#{bundle.aon_module_academy}"
				action="menu_academy" immediate="true"
				styleClass="aon-top-menu-item" />

			<aon:commandLink id="menu_hotel"
				value="#{bundle.aon_module_hotel}"
				action="menu_hotel" immediate="true"
				styleClass="aon-top-menu-item" />
		</aon:if>

		<aon:if test="#{domainSwitcher.domainManagementAvailable and (aonRole.sysAdmin or !domainSwitcher.disableDomainManagement)}">
			<aon:if test="#{aonRole.admin}">
				<aon:commandLink id="menu_enterprise"
					value="#{bundle.aon_module_enterprise}"
					action="menu_enterprise" immediate="true"
					styleClass="aon-top-menu-item" />
			</aon:if>
		</aon:if>

		<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
			<aon:if test="#{aonRole.commercialOperator}">
				<aon:commandLink id="menu_crm"
					value="#{bundle.aon_module_crm}"
					action="menu_crm" immediate="true"
					styleClass="aon-top-menu-item" />
			</aon:if>

			<aon:commandLink id="menu_infoweb"
				value="#{bundle.aon_module_infoweb}"
				action="menu_infoweb" immediate="true"
				styleClass="aon-top-menu-item" />
			
			<aon:if test="#{aonRole.saleOperator or aonRole.purchaseOperator}">
				<aon:commandLink id="menu_management"
					value="#{bundle.aon_module_management}" 
					action="menu_management" immediate="true"
					styleClass="aon-top-menu-item"/>
			</aon:if>
			
			<aon:if test="#{aonRole.financeOperator}">
				<aon:commandLink id="menu_treasury"
					value="#{bundle.aon_module_finance}"
					action="menu_treasury" immediate="true"
					styleClass="aon-top-menu-item" />
			</aon:if>
			
			<aon:if test="#{aonRole.warehouseOperator}">
				<aon:commandLink id="menu_warehouse"
					value="#{bundle.aon_module_warehouse}"
					action="menu_warehouse" immediate="true"
					styleClass="aon-top-menu-item" />
			</aon:if>

			<aon:commandLink id="menu_pos"
				value="#{bundle.aon_module_pos}"
				action="menu_pos" immediate="true"
				styleClass="aon-top-menu-item" />

			<aon:commandLink id="menu_groupware"
				value="#{bundle.aon_module_groupware}"
				action="menu_groupware" immediate="true"
				styleClass="aon-top-menu-item" />
		</aon:if>
			
		<aon:if test="#{aonRole.accountingOperator}">
			<aon:commandLink id="menu_accounting"
				value="#{bundle.aon_module_accounting}"
				action="menu_accounting" immediate="true"
				styleClass="aon-top-menu-item" />
		</aon:if>

		<aon:if test="#{aonRole.fiscal}">
			<aon:commandLink id="menu_fiscal"
				value="#{bundle.aon_module_fiscal}"
				action="menu_fiscal" immediate="true"
				styleClass="aon-top-menu-item" />
		</aon:if>
		
		<aon:commandLink id="menu_contrata"
			value="#{bundle.aon_module_contrata}"
			action="menu_contrata" immediate="true"
			styleClass="aon-top-menu-item" />
		
		<aon:if test="#{aonRole.payroll}">
			<aon:commandLink id="menu_payroll"
				value="#{bundle.aon_module_payroll}"
				action="menu_payroll" immediate="true"
				styleClass="aon-top-menu-item" />
			<aon:if test="#{!domainSwitcher.domainManagementAvailable}">				
				<aon:commandLink id="menu_payroll_portal"
					value="#{bundle.aon_payroll_portal}"
					action="gwt_enterprise_site" immediate="true"
					styleClass="aon-top-menu-item" />
			</aon:if>
		</aon:if>
		
		<aon:if test="#{!selectedMenu.document}">
			<aon:commandLink id="menu_document" 
				value="#{bundle.aon_module_document}"
				action="gwt_documents"
				actionListener="#{gwtSelectedMenu.onDocumental}"
				immediate="true"
				styleClass="aon-top-menu-item" />
		</aon:if>
		<aon:if test="#{selectedMenu.document}">
			<a id="menu_document"
				onclick="onreload();"
				class="aon-top-menu-item-select aon-top-menu-item" >Documental</a>
		</aon:if>
		
		<aon:commandLink id="menu_aonOne"
			value="#{bundle.aon_module_aonOne}"
			action="menu_aonOne" immediate="true"
			styleClass="aon-top-menu-item" />

		<aon:commandLink id="menu_eCommerce"
			value="#{bundle.aon_module_eCommerce}"
			action="menu_eCommerce" immediate="true"
			styleClass="aon-top-menu-item" />
		
		<aon:if test="#{!((domainSwitcher.type == 'ADMIN') and !aonRole.admin)}">		
			<aon:commandLink id="menu_configuration"
				value="#{bundle.aon_module_configuration}"
				action="menu_configuration" immediate="true"
				styleClass="aon-top-menu-item" />
		</aon:if>
		
		<rich:jQuery timing="onload"
			selector="body" query="removeClass('aon-overflow-hidden')" />						
	</ui:define>
	
	<ui:define name="callCenterMenuContent">
		<aon:if test="#{aonRole.callCenter}">
			<aon:if test="#{!selectedMenu.issues}">
				<aon:commandLink id="menu_call_center" 
					action="gwt_issues"
					actionListener="#{gwtSelectedMenu.onIssues}"
					title="C.A.U. POLYMER" 
					value="&#160;"
					inmediate="true"
					styleClass="aon-menu-icon aon-icon-helpdesk" />
			</aon:if>
			<aon:if test="#{selectedMenu.issues}">
				<a id="menu_call_center" 
					onclick="onreload();"
					class="aon-menu-icon aon-icon-helpdesk aon-height-20"/>
			</aon:if>
		</aon:if>
	</ui:define>	
	
	<ui:define name="beforeWebMapMenuContent">
		<aon:menuItem id="favorites" action="actionFavorite"
			rendered="#{!aonConfiguration.properties.hideMenuFavorite}"
			iconClass="aon-icon-favorite"
			actionListener="#{actionFavorite.onInit}"
			value="#{bundle.aon_favorites_management}" />
		<aon:if test="#{!aonRole.sysAdmin and (domainSwitcher.type != 'ADMIN')}">
			<aon:menuItem id="advancedMode" action="advancedMode"
				actionListener="#{adminMain.onInitAdvancedMode}"
				rendered="#{!aonConfiguration.properties.hideMenuAdvancedMode}"
				value="#{bundle.admin_advanced_mode}" />
		</aon:if>
		<aon:menuItem id="config_userProfile" action="domainUser_profile"
			iconClass="aon-icon-menu-user"
			actionListener="#{domainUser.onInitUserProfile}"
			value="#{bundle.admin_user_profile}" />
		<aon:menuItem id="changePassword" action="changePassword_form"
			iconClass="aon-icon-changePassword"
			actionListener="#{changePassword.onInit}"
			value="#{bundle.aon_security_change_password}" />
	</ui:define>	
		
 </ui:composition>
