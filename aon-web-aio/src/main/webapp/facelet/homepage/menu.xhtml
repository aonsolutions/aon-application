<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<aon:outputText styleClass="aon-icon-logo" 
			style="padding-left: 20px; margin-left: 12px;" 
			value="&#160;"/>
			
		<c:if test="#{domainSwitcher.domainManagementAvailable}">
			<aon:commandLink id="enterprise"
				value="#{bundle.aon_module_enterprise}"
				action="menu_enterprise" immediate="true"
				styleClass="aon-top-menu-item" />
		</c:if>

		<c:if test="#{!domainSwitcher.domainManagementAvailable}">
			<c:if test="#{aonRole.commercialOperator}">
				<aon:commandLink id="marketing"
					value="#{bundle.aon_module_marketing}"
					action="menu_marketing" immediate="true"
					styleClass="aon-top-menu-item" />
				<aon:commandLink id="commercial"
					value="#{bundle.aon_module_commercial}"
					action="menu_commercial" immediate="true"
					styleClass="aon-top-menu-item" />
			</c:if>
	
			<aon:commandLink id="management" value="#{bundle.aon_module_management}" 
				action="menu_management" 
				immediate="true" styleClass="aon-top-menu-item"/>
			<c:if test="#{aonRole.financeOperator}">
				<aon:commandLink id="treasury"
					value="#{bundle.aon_module_finance}"
					action="menu_treasury" immediate="true"
					styleClass="aon-top-menu-item" />
			</c:if>
			<c:if test="#{aonRole.warehouseOperator}">
				<aon:commandLink id="warehouse"
					value="#{bundle.aon_module_warehouse}"
					action="menu_warehouse" immediate="true"
					styleClass="aon-top-menu-item" />
			</c:if>
			<c:if test="#{aonRole.config}">
				<aon:commandLink id="groupware"
					value="#{bundle.aon_module_groupware}"
					action="menu_groupware" immediate="true"
					styleClass="aon-top-menu-item" />
			</c:if>
			<c:if test="#{aonRole.accountingOperator}">
				<aon:commandLink id="accounting"
					value="#{bundle.aon_module_accounting}"
					action="menu_accounting" immediate="true"
					styleClass="aon-top-menu-item" />
				<aon:commandLink id="fiscal"
					value="#{bundle.aon_module_fiscal}"
					action="menu_fiscal" immediate="true"
					styleClass="aon-top-menu-item" />
				<aon:commandLink id="payroll"
					value="#{bundle.aon_module_payroll}"
					action="menu_payroll" immediate="true"
					styleClass="aon-top-menu-item" />
			</c:if>
			<aon:commandLink id="document"
				value="#{bundle.aon_module_document}"
				action="menu_document" immediate="true"
				styleClass="aon-top-menu-item" />
		</c:if>
		<aon:commandLink id="utilities"
			value="#{bundle.aon_module_configuration}"
			action="menu_configuration" immediate="true"
			styleClass="aon-top-menu-item" />

		<rich:jQuery timing="onload"
			selector="body" query="removeClass('aon-overflow-hidden')" />						
	</ui:define>
	
	<ui:define name="beforeWebMapMenuContent">
		<c:if test="#{!aonRole.sysAdmin}">
			<aon:menuItem id="advancedMode" action="advancedMode"
				value="#{adminBundle.admin_advanced_mode}" />
		</c:if>
		<aon:menuItem id="changePassword" action="changePassword_form"
			iconClass="aon-icon-changePassword"
			actionListener="#{changePassword.onInit}"
			value="#{securityBundle.aon_security_change_password}" />
	</ui:define>	
		
 </ui:composition>
