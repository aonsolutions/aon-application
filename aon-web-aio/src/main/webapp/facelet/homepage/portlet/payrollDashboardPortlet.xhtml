<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div styleClass="aon-portlet">
		<script type="text/javascript"
			src="http://www.google.com/jsapi?callback=__gwt_AjaxLoader_onLoad"></script>
		<script type="text/javascript">
			Array.prototype.reduce=function(fun){var len=this.length&#62;&#62;&#62;0;if(typeof fun!="function")throw new TypeError;if(len==0&#38;&#38;arguments.length==1)throw new TypeError;var i=0;if(arguments.length&#62;=2)var rv=arguments[1];else{do{if(i in this){var rv=this[i++];break}if(++i&#62;=len)throw new TypeError;}while(true)}for(;i&#60;len;i++)if(i in this)rv=fun.call(undefined,rv,this[i],i,this);return rv}; 
		</script>
		
		<aon:div styleClass="aon-portlet-title">
			<aon:div styleClass="aon-portlet-title-buttons">
			</aon:div>
			<aon:outputText value="#{bundle.daily_tracking_graphic}"
				styleClass="aon-portlet-title-text aon-icon aon-icon-stat" />
		</aon:div>
		<aon:div styleClass="aon-portlet-body">
			<aon:panelGrid columns="2" styleClass="aon-width-all"
				columnClasses="aon-width-half,aon-width-half">

				<!-- Container 1 Payrolls Informations by Colors -->

				<aon:div id="payrollGraphContainer"
					style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="Nóminas por Meses del Ejercicio" />
						<aon:selectOneMenu id="Dashboard_payrollPeriod"
							style="border: none;" value="#{dashboard.salaryYear}">
							<a4j:support event="onchange"
								actionListener="#{dashboard.onSalaryYearChanged}"
								reRender="payrollGraphContainer,messageList" ajaxSingle="true" />
							<f:selectItems value="#{dashboard.salaryYears}" />
						</aon:selectOneMenu>
					</aon:div>
					<aon:div id="payroll_chart_div" style="width: 100%; height: 180px;" />
					<!-- 
					<script type="text/javascript" src="https://www.google.com/jsapi"></script>
 -->
					<script type="text/javascript"> 
							google.load("visualization", "1", {'callback' : 'drawCharts' ,'packages':["corechart"], 'language': 'en'});
							function drawCharts(){
								 var whatever = Array.prototype.reduce;
								try {
									Array.prototype.reduce=function(fun){var len=this.length&#62;&#62;&#62;0;if(typeof fun!="function")throw new TypeError;if(len==0&#38;&#38;arguments.length==1)throw new TypeError;var i=0;if(arguments.length&#62;=2)var rv=arguments[1];else{do{if(i in this){var rv=this[i++];break}if(++i&#62;=len)throw new TypeError;}while(true)}for(;i&#60;len;i++)if(i in this)rv=fun.call(undefined,rv,this[i],i,this);return rv};					
									var data = new google.visualization.DataTable();
									data.addColumn('string', 'Mes');
									data.addColumn('number', 'Nominas');
									data.addColumn('number', 'Extras');
									data.addColumn('number', 'Finiquitos');
									data.addColumn('number', 'Atrasos');
									data.addColumn('number', 'Vacaciones');
									

									<c:forEach var="entry" items="#{dashboard.periodPayrollCount}">		
										
										data.addRow(['#{entry.Mes}',
										             #{entry.Nominas},
										             #{entry.Extras}, 
										             #{entry.Finiquitos}, 
										             #{entry.Atrasos}, 
										             #{entry.Vacaciones} ]);											
									</c:forEach>
									
									var options = {
											chartArea:{left:30,right:5,top:15,width:"90%",height:"60%"},									       
									        legend: { position: 'top', maxLines: 12 },
									        tooltip: {isHtml: true},
										bar: { groupWidth: '75%' },
									        isStacked: true,
									      };
									var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:payroll_chart_div'));
									chart.draw(data, options);
								} finally {
									Array.prototype.reduce = whatever;			
								}
								
							}
					   </script>
				</aon:div>


				<!-- Container 2 Contracts information-->

				<aon:div id="ContractsGraphContainer"
					style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="Altas y Bajas de Contratos" />
						<aon:selectOneMenu id="Dashboard_ContractsPeriod"
							style="border: none;" value="#{dashboard.contractYear}">
							<a4j:support event="onchange"
								actionListener="#{dashboard.onContractYearChanged}"
								reRender="ContractsGraphContainer,messageList" ajaxSingle="true" />
							<f:selectItems value="#{dashboard.contractYears}" />
						</aon:selectOneMenu>
					</aon:div>
					<aon:div id="contract_chart_div"
						style="width: 100%; height: 180px;" />
					<!-- 
					<script type="text/javascript" src="https://www.google.com/jsapi"></script>
 -->
					<script type="text/javascript"> 
							google.load("visualization", "1", {'callback' : 'drawCharts' ,'packages':["corechart"], 'language': 'en'});
							function drawCharts(){
								 var whatever = Array.prototype.reduce;
								try {
									Array.prototype.reduce=function(fun){var len=this.length&#62;&#62;&#62;0;if(typeof fun!="function")throw new TypeError;if(len==0&#38;&#38;arguments.length==1)throw new TypeError;var i=0;if(arguments.length&#62;=2)var rv=arguments[1];else{do{if(i in this){var rv=this[i++];break}if(++i&#62;=len)throw new TypeError;}while(true)}for(;i&#60;len;i++)if(i in this)rv=fun.call(undefined,rv,this[i],i,this);return rv};
						
									//---------------------------------
									var data = new google.visualization.DataTable();
									data.addColumn('string', 'Mes');
									data.addColumn('number', 'Altas');
									data.addColumn('number', 'Bajas');							
									
									<c:forEach var="staff" items="#{dashboard.periodContractCount}">
									
										data.addRow(['#{staff.month}',
										             #{staff.altas},
										             #{staff.bajas} ]);	
										
									</c:forEach>
									
									var options = {
											chartArea:{left:30,right:5,top:15,width:"90%",height:"60%"},									       
									        legend: { position: 'top', maxLines: 12 },
									        tooltip: {isHtml: true},
										bar: { groupWidth: '75%' },
									        isStacked: true,
									      };
									var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:contract_chart_div'));
									chart.draw(data, options);
								} finally {
									Array.prototype.reduce = whatever;		
								}
							}
					   </script>
				</aon:div>
			</aon:panelGrid>
		</aon:div>
	</aon:div>
</ui:composition>
