<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div styleClass="aon-portlet">
		<aon:div styleClass="aon-portlet-title">
			<aon:div styleClass="aon-portlet-title-buttons">
			</aon:div>
			<aon:outputText value="#{bundle.daily_tracking_graphic}"
				styleClass="aon-portlet-title-text aon-icon aon-icon-stat" />
		</aon:div>
		<aon:div styleClass="aon-portlet-body">
			<aon:panelGrid columns="2" styleClass="aon-width-all"
				columnClasses="aon-width-half,aon-width-half">

				<!-- Container 1 Payrolls Informations by Colors -->

				<aon:div id="payrollGraphContainer"
					style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="Nóminas por Meses del Ejercicio" />
						<aon:selectOneMenu id="salaryYearSelect"
							style="border: none;" value="#{dashboard.salaryYear}">
							<a4j:support event="onchange"
								actionListener="#{dashboard.onSalaryYearChanged}"
								reRender="payrollGraphContainer" ajaxSingle="true" />
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{dashboard.payrollYears}" />
						</aon:selectOneMenu>
					</aon:div>
					
					<aon:div id="salaryChartDiv" style="width: 100%; height: 180px;" />

					<script type="text/javascript"> 
							function drawSalaryColumnChart(){
								var data = new google.visualization.DataTable();
								data.addColumn('string', 'Mes');
								data.addColumn('number', 'Nominas');
								data.addColumn('number', 'Extras');
								data.addColumn('number', 'Finiquitos');
								data.addColumn('number', 'Atrasos');
								

								<c:forEach var="entry" items="#{dashboard.periodPayrollCount}">		
									
									data.addRow(['#{entry.Mes}',
									             #{entry.Nominas},
									             #{entry.Extras}, 
									             #{entry.Finiquitos}, 
									             #{entry.Atrasos} ]);		
								</c:forEach>
								
								var options = {
									chartArea:{
										left:30,
										right:5,
										top:15,
										width:"90%",
										height:"60%"
									},									       
								       legend: { 
								       	position: 'top', 
								       	maxLines: 12 
								    },
								    tooltip: {
								     	isHtml: true
								    },
									bar: { 
										groupWidth: '75%' 
									},
								   	isStacked: true,
								    theme: 'material',
								    
								};
								      
								var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:salaryChartDiv'));
								chart.draw(data, options);
							}
							
							google.charts.load('current', {packages: [ 'corechart']});
							google.charts.setOnLoadCallback(drawSalaryColumnChart);
											
					   </script>
				</aon:div>


				<!-- Container 2 Contracts information-->

				<aon:div id="ContractsGraphContainer"
					style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="Altas y Bajas de Contratos" />
						<aon:selectOneMenu id="contractYearSelect"
							style="border: none;" value="#{dashboard.contractYear}">
							<a4j:support event="onchange"
								actionListener="#{dashboard.onContractYearChanged}"
								reRender="ContractsGraphContainer,messageList" ajaxSingle="true" />
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{dashboard.payrollYears}" />
						</aon:selectOneMenu>
					</aon:div>
					<aon:div id="contractChartDiv"
						style="width: 100%; height: 180px;" />

					<script type="text/javascript"> 
							function drawContractColumnChart(){
					
								var data = new google.visualization.DataTable();
								data.addColumn('string', 'Mes');
								data.addColumn('number', 'Altas');
								data.addColumn('number', 'Bajas');							
								
								<c:forEach var="staff" items="#{dashboard.periodContractCount}">
								
									data.addRow(['#{staff.month}',
									             #{staff.altas},
									             #{staff.bajas} ]);	
									
								</c:forEach>
								
								var options = {
									chartArea:{
										left:30,
										right:5,
										top:15,
										width:"90%",
										height:"60%"
									},									       
								    legend: { 
								    	position:'top', 
								        maxLines: 12 
								    },
								    tooltip: {
								    	isHtml: true
								    },
									bar: { 
										groupWidth: '75%' 
									},
								    //isStacked: true,
								    theme: 'material',
								};
								var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:contractChartDiv'));
								chart.draw(data, options);
							}
							
							google.charts.load('current', {packages: ['bar']});
							google.charts.setOnLoadCallback(drawContractColumnChart);
												
					   </script>
				</aon:div>
			</aon:panelGrid>
		</aon:div>
			<!--
			-->			
			<script type="text/javascript" > 
				//<![CDATA[
				function selectPayrollYear() {
					// current year
					payrollYear = new Date().getFullYear() ; 
					
					for ( id of  ['salaryYearSelect', 'contractYearSelect'] ) {
						let select = document.getElementById('aonContent:mainForm:'+id);
							
						for ( option of select.options ) {
							if ( option.text == payrollYear ) {
								if ( select.value != option.value ){
									select.value = option.value;
									select.onchange();
								}
								break;
							}
						}
					}
				}
				document.addEventListener('DOMContentLoaded', selectPayrollYear, false );
				//]]>
			</script>
	</aon:div>
</ui:composition>
