<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div styleClass="aon-support" >
		<aon:div>
			<aon:div style="font-size: 1.1em;">
				<aon:outputText value="#{bundle.aon_support_title}" />
			</aon:div>
			<aon:div style="font-size: 1.3em; font-weight: bold;">
				<aon:outputText value="#{customize.supportTelephone}" />
			</aon:div>
		</aon:div>
		<aon:div style="font-weight: bold;">
			<aon:commandLink title="#{bundle.webmail_send_email}" 
				ajaxSingle="true" reRender="showNewMessageWindow"
				value="#{customize.supportEmail}"
				style="color:#888888; text-decoration:none;"
				actionListener="#{webmailMessage.onSendEmail}" >
				<f:setPropertyActionListener target="#{webmailMessage.showNewMessageWindow}" value="#{true}" />
				<f:param name="email" value="#{customize.supportEmail}" />
			</aon:commandLink>							    
		</aon:div>
        <aon:div styleClass="aon-margin-top" style="font-size: 1.1em;">
        	<aon:outputText value="#{bundle.aon_support_remote_access}" />
			<aon:div id="remoteSupport" style="text-transform:uppercase;font-weight: bold;">
				<aon:outputText
					style="#{(desktop.state.supportEnabled)?'color:red;':'color:green;'}"
					value="[ #{(desktop.state.supportEnabled)?(bundle.aon_active):(bundle.aon_inactive)} ]" />
				<aon:div styleClass="aon-margin-top aon-margin-bottom">
					<aon:commandButton value="#{bundle.aon_activate}"
						actionListener="#{desktop.onEnableSupport}"
						reRender="remoteSupport"
						rendered="#{!desktop.state.supportEnabled and (!domainSwitcher.adminDomain or (domainSwitcher.adminDomain and desktop.state.adminRole))}" />
					<aon:commandButton value="#{bundle.aon_deactivate}"
						actionListener="#{desktop.onDisableSupport}"
						reRender="remoteSupport"
						rendered="#{desktop.state.supportEnabled and (!domainSwitcher.adminDomain or (domainSwitcher.adminDomain and desktop.state.adminRole))}" />
				</aon:div>
			</aon:div>
		</aon:div>
		
	</aon:div>

</ui:composition>
