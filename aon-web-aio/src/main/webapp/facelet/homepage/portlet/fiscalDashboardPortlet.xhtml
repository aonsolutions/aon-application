<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:if test="#{!domainSwitcher.udapa}">
		<aon:div styleClass="aon-portlet">
			<aon:div styleClass="aon-portlet-title">								
				<aon:div styleClass="aon-portlet-title-buttons">
				</aon:div>
				<aon:outputText value="#{bundle.daily_tracking_graphic}" styleClass="aon-portlet-title-text aon-icon aon-icon-stat"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body">
				<aon:panelGrid columns="1" styleClass="aon-width-all"
					columnClasses="aon-vertical-align-top">
					<aon:panelGrid id="accountMessagesDiv" columns="2" styleClass="aon-width-all" 
						columnClasses="aon-width-half aon-vertical-align-top,aon-width-half aon-vertical-align-top">
					
						<aon:div id="fiscal_status_div" style="height: 400px; width: 100%;">
							<ui:decorate template="/com/esferalia/aon/gwt/fiscal/facelet/innerGwt.xhtml">
								<ui:param name="module" value="aon_gwt_fiscal" />
								<ui:param name="entryPoint" value="ModelMatrix" />
							</ui:decorate>
						</aon:div>
						
						<aon:div id="accountingGraphContainer" 
							style="width: 98%; min-height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;padding-top: 5px;">
							<aon:div styleClass="aon-bold">
								<aon:outputText value="Apuntes por Meses del Ejercicio"/>
								<!--
								 								
 								-->								
								<aon:selectOneMenu id="accountPeriodSelect"
									style="border: none;"
									value="#{dashboard.accountingPeriod}">
									<a4j:support event="onchange"
										actionListener="#{dashboard.onAccountingPeriodChanged}" 
										reRender="accountMessagesDiv"
										ajaxSingle="true" />
									<f:selectItem itemLabel="-" itemValue="" />
									<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
								</aon:selectOneMenu>
							</aon:div>
							<!--
							Loads account column chart
							-->
							<aon:div id="accountColumnChartDiv" style="width: 100%; min-height: 180px;"/>
							<script type="text/javascript">
								function drawAccountColumnChart(){
									var data = new google.visualization.DataTable();
									data.addColumn('string', 'Mes');
									data.addColumn('number', 'Apuntes');
									
									<c:forEach var="entry" items="#{dashboard.periodEntriesCount}">
									data.addRow(['#{entry.name}', #{entry.value} ]);
									</c:forEach>
									var options = {
										chartArea:{
											left:30,
											right:5,
											top:15,
											width:"90%",
											height:"60%"
										},
										legend: {
											position: 'none'
										},
										tooltip: {
											isHtml: true,
											
										},
										theme: 'material'
									};
									var accountChart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:accountColumnChartDiv'));
									accountChart.draw(data, options);
									
								}
																
								google.charts.load('current', {packages: ['corechart']});
								google.charts.setOnLoadCallback(drawAccountColumnChart);							
								
						   	</script>

							<aon:div id="messageList"  style="width: 99%; margin-left: 5px; border:solid #BBB 1px; text-align: center; margin-top: 10px;padding-bottom: 10px;padding-top: 5px;">
								<aon:div styleClass="aon-bold">
									<aon:outputText value="Datos relativos al ejercicio Contable #{dashboard.accountingPeriod.name}"/>
								</aon:div>
								<!--
								Account messages list ( reRender )
								-->
								<ul class="aon-width-all aon-text-left" 
									style="margin-left: 10px; margin-top: 10px; list-style-type:none">
									<c:forEach var="msg" items="#{dashboard.messages}">
										<li style="margin-left: 5px;">
											<aon:outputText value="#{msg.category}" 
												style="padding-left: 20px;"
												styleClass="aon-bold aon-icon-point-#{msg.level}"/>
											<aon:outputText value="#{msg.message}" styleClass="aon-padding-left" />
										</li>
									</c:forEach>
								</ul>
							</aon:div>


						</aon:div>
					</aon:panelGrid>
				</aon:panelGrid>	
			
			</aon:div>
			
			<script type="text/javascript" > 
				//<![CDATA[
				function selectYear() {
					// current year
					fiscalYear = new Date().getFullYear() ; 
					let select = document.getElementById('aonContent:mainForm:accountPeriodSelect');
					for ( option of select.options ) {
						if ( option.text == fiscalYear ) {
							if ( select.value != option.value ){
								select.value = option.value;
								select.onchange();
							}
							break;
						}
					}
				}
				document.addEventListener('DOMContentLoaded', selectYear, false );
				//]]>
			</script>

		</aon:div>
	</aon:if>
</ui:composition>
