<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

		<aon:div styleClass="aon-portlet">
			<aon:div styleClass="aon-portlet-title">								
				<aon:div styleClass="aon-portlet-title-buttons">
				</aon:div>
				<aon:outputText value="Panel de Control" styleClass="aon-portlet-title-text aon-icon aon-icon-stat"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-width-half,aon-width-half">
					
					<aon:div id="fiscal_status_div" 
					style="width: 100%; height: 200px; border:solid #BBB 1px; text-align: center;;padding-top: 5px;">
						<aon:div styleClass="aon-bold">
							<aon:outputText value="Tabla fiscal del ejercicio "/>
							<aon:selectOneMenu id="Dashboard_fiscalYear"
								style="border: none;"
								value="#{dashboard.fiscalYear}">
								<a4j:support event="onchange"
									actionListener="#{dashboard.onFiscalPeriodChanged}" 
									reRender="fiscal_status_div"
									ajaxSingle="true" />
								<f:selectItem itemLabel="2009" itemValue="2009" />
								<f:selectItem itemLabel="2010" itemValue="2010" />
								<f:selectItem itemLabel="2011" itemValue="2011" />
								<f:selectItem itemLabel="2012" itemValue="2012" />
								<f:selectItem itemLabel="2013" itemValue="2013" />
								<f:selectItem itemLabel="2014" itemValue="2014" />
								<f:selectItem itemLabel="2015" itemValue="2015" />
								<f:selectItem itemLabel="2016" itemValue="2016" />
								<f:selectItem itemLabel="2017" itemValue="2017" />
								<f:selectItem itemLabel="2018" itemValue="2018" />
								<f:selectItem itemLabel="2019" itemValue="2019" />
								<f:selectItem itemLabel="2020" itemValue="2021" />
							</aon:selectOneMenu>
						</aon:div>
						
						<table style="margin: 10px;">
							<tr>
								<td style="width: 80px;">
									<aon:outputText value="&#160;"/>
								</td>
								<c:forEach var="fsmodel" items="#{dashboard.models}">
									<c:if test="#{fsmodel != '347'}">
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;">
											<aon:outputText value="#{fsmodel}"/>
										</td>
									</c:if>
								</c:forEach>
							</tr>
							<c:forEach var="fs" items="#{dashboard.fiscalStatus}">
								<c:if test="#{fs.period.name == 'An'}">
									<tr>
										<td style="width: 25px; font-weight: bold;"><aon:outputText value="&#160;"/></td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="190"/></td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="180"/></td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="184"/></td>
										<td style="width: 25px; font-weight: bold;"><aon:outputText value="&#160;"/></td>
										<td style="width: 25px; font-weight: bold;"><aon:outputText value="&#160;"/></td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="391"/></td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="390"/></td>
										<td style="width: 25px; font-weight: bold;"><aon:outputText value="&#160;"/></td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="347"/></td>
									</tr>
									<tr>
										<td style="border: solid #BBB 1px; white-space: nowrap;">
											<aon:outputText value="#{fs.period}"/>
										</td>
										<c:forEach var="fsmodel" items="#{dashboard.models}">
											<c:if test="#{fsmodel == '130' or fsmodel == '131' or fsmodel == '349'}">
												<td></td>
											</c:if>
											<c:if test="#{fsmodel != '130' and fsmodel != '131' and fsmodel != '349'}">
												<td style="border: solid #BBB 1px;">
													<aon:outputText value="--"
														rendered="#{fs.models[fsmodel] == -1}"
														style="font-weight:bold;"
														title="No Creado"/>
													<aon:outputText value="&#160;"
														rendered="#{fs.models[fsmodel] == 0}"
														title="Creado, Sin terminar"
														style="padding-left: 15px;" 
														styleClass="aon-icon-edit"/>
													<aon:outputText value="&#160;"
														rendered="#{fs.models[fsmodel] == 1}"
														title="Finalizado"
														style="padding-left: 15px;" 
														styleClass="aon-icon-lock"/>
												</td>
											</c:if>
										</c:forEach>
									</tr>
								</c:if>
								<c:if test="#{fs.period.name != 'An'}">
									<tr>
										<td style="border: solid #BBB 1px; white-space: nowrap;">
											<aon:outputText value="#{fs.period}"/>
										</td>
										<c:forEach var="fsmodel" items="#{dashboard.models}">
											<c:if test="#{fsmodel != '347'}">
												<td style="border: solid #BBB 1px;">
													<aon:outputText value="--"
														rendered="#{fs.models[fsmodel] == -1}"
														style="font-weight:bold;"
														title="No Creado"/>
													<aon:outputText value="&#160;"
														rendered="#{fs.models[fsmodel] == 0}"
														title="Creado, Sin terminar"
														style="padding-left: 15px;" 
														styleClass="aon-icon-edit"/>
													<aon:outputText value="&#160;"
														rendered="#{fs.models[fsmodel] == 1}"
														title="Finalizado"
														style="padding-left: 15px;" 
														styleClass="aon-icon-lock"/>
												</td>
											</c:if>
										</c:forEach>
									</tr>
								</c:if>
							</c:forEach>
						</table>
					</aon:div>

					<aon:div id="accountingGraphContainer" 
					style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;;padding-top: 5px;">
						<aon:div styleClass="aon-bold">
							<aon:outputText value="Apuntes por Meses del Ejercicio "/>
							<aon:selectOneMenu id="Dashboard_accountPeriod"
								style="border: none;"
								value="#{dashboard.accountingPeriod}">
								<a4j:support event="onchange"
									actionListener="#{dashboard.onAccountingPeriodChanged}" 
									reRender="accountingGraphContainer,messageList"
									ajaxSingle="true" />
								<f:selectItem itemLabel="-" itemValue="" />
								<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
							</aon:selectOneMenu>
						</aon:div>
						<aon:div id="bar_chart_div" style="width: 100%; height: 180px;"/>
						<script type="text/javascript" src="https://www.google.com/jsapi"></script>
						<script type="text/javascript">
							google.load("visualization", "1", {callback : drawCharts ,packages:["corechart"]});
							function drawCharts(){
								var whatever = Array.prototype.reduce;
								try {
									Array.prototype.reduce = undefined;
									
									//---------------------------------
									var data = new google.visualization.DataTable();
									data.addColumn('string', 'Mes');
									data.addColumn('number', 'Apuntes');
									<c:forEach var="entry" items="#{dashboard.periodEntriesCount}">
										data.addRow(['#{entry.name}', #{entry.value}]);
									</c:forEach>
									var options = {
										chartArea:{left:30,right:5,top:15,width:"90%",height:"60%"},
										legend: {position: 'none'},
										series: [{color: 'SteelBlue'}],
									};
									var chart = new google.visualization.ColumnChart(document.getElementById('aonContent:mainForm:bar_chart_div'));
									chart.draw(data, options);
								} finally {
									Array.prototype.reduce = whatever;			
								}
							}
					   </script>
					</aon:div>
				</aon:panelGrid>
				<aon:div id="messageList" style="width: 99%; border:solid #BBB 1px; text-align: center; margin-top: 10px;padding-bottom: 10px;padding-top: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="Datos relativos al ejercicio Contable "/>
						<aon:selectOneMenu id="Dashboard_accountPeriod2"
							style="border: none;"
							value="#{dashboard.accountingPeriod}">
							<a4j:support event="onchange"
								actionListener="#{dashboard.onAccountingPeriodChanged}" 
								reRender="accountingGraphContainer,messageList"
								ajaxSingle="true" />
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
						</aon:selectOneMenu>
					</aon:div>
					<ul class="aon-width-all aon-text-left" 
						style="margin-left: 10px; margin-top: 10px; list-style-type:none;">
						<c:forEach var="msg" items="#{dashboard.messages}">
							<li style="margin-left: 5px;">
								<aon:outputText value="#{msg.category}" 
									style="padding-left: 20px;"
									styleClass="aon-bold aon-icon-point-#{msg.level}"/>
								<aon:outputText value="#{msg.message}" styleClass="aon-padding-left" />
							</li>
						</c:forEach>
					</ul>
				</aon:div>				
			</aon:div>
		</aon:div>
</ui:composition>
