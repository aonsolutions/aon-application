<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:if test="#{company.withLogo}">	
		<aon:div styleClass="aon-text-center aon-margin-bottom">
			<!--  a4j:mediaOutput
				mimeType="#{company.logoMimeType}" 
				cacheable="false" element="img" 
				value="#{company.logoFile.key}" 
				style="max-width:201px;"
				onload="setMaxWidth(this, 200);"
				createContent="#{company.createLogoContent}"
				>
			</a4j:mediaOutput-->
			<img 
				class="aon-logo-img"
				style="max-width: 201px;"
				src="aonDocuments/company.logo?#{domainSwitcher.domainId}"
				onload="setMaxWidth(this, 200);"/>
		</aon:div>
		<script type="text/javascript">
			function setMaxWidth(img, width) {
				if (img.width > width) {
		    		img.width = width;
				}
			}
		</script>	
	</aon:if>

</ui:composition>
