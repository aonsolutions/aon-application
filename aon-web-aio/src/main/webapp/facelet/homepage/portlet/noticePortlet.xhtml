<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div styleClass="aon-portlet">
		<aon:div styleClass="aon-portlet-title">								
			<aon:div styleClass="aon-portlet-title-buttons">
				<aon:commandLink id="notice-reset" actionListener="#{notice.onReset}" action="notice_form">
						<aon:outputText value="&#160;" styleClass="aon-icon-portlet aon-icon-new"/>
				</aon:commandLink>
			</aon:div>
			<aon:commandLink id="notice-search" actionListener="#{notice.onSearch}" action="notice_list">
				<aon:outputText value="#{groupwareBundle.aon_notice}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
			</aon:commandLink>
		</aon:div>
		<aon:div styleClass="aon-portlet-body">
			<aon:panelGrid columns="3" styleClass="aon-width-all"
				rowClasses="aon-table-portlet-row"
				columnClasses="aon-table-portlet-column,aon-table-portlet-column,aon-table-portlet-column">
				
				<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-call.png']}" />
				<aon:outputText value="#{desktop.noticeInfo.callType}"/>
				<aon:outputText value="#{desktop.noticeInfo.callCount}"/>
				

				<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-visit.png']}" />
				<aon:outputText value="#{desktop.noticeInfo.visitType}"/>
				<aon:outputText value="#{desktop.noticeInfo.visitCount}"/>

				<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-message.png']}" />
				<aon:outputText value="#{desktop.noticeInfo.messageType}"/>
				<aon:outputText value="#{desktop.noticeInfo.messageCount}"/>

				<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-info.png']}" />
				<aon:outputText value="#{desktop.noticeInfo.communicationType}"/>
				<aon:outputText value="#{desktop.noticeInfo.communicationCount}"/>
			</aon:panelGrid>
		</aon:div>
	</aon:div>

</ui:composition>
