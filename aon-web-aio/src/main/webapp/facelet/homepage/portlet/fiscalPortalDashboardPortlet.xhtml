<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

		<aon:div styleClass="aon-portlet">
			<script type="text/javascript" src="https://www.google.com/jsapi"></script>
			<aon:div styleClass="aon-portlet-title">								
				<aon:div styleClass="aon-portlet-title-buttons">
				</aon:div>
				<aon:outputText value="#{bundle.menu_enterprise_site} - #{bundle.finance_fiscal_account_information}" 
					styleClass="aon-portlet-title-text aon-icon aon-icon-stat"/>
			</aon:div>
			
			<aon:div styleClass="aon-portlet-body">
				<aon:panelTabSet id="fiscalPortletTab" selectedTab="#{dashboard.fiscalPortal.selectedTab}">

					<aon:panelTab id="fiscalPortletTabY" label="#{bundle.account_year_evolution}"
						rendered="#{desktop.state.accountingInfoVisibleForPortal}"
						actionListener="#{dashboard.fiscalPortal.onPygGraph}">
						<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabY'}">
						<aon:panelGrid columns="1" styleClass="aon-width-all" columnClasses="aon-width-all">
							<aon:div id="yearPygGraphContainer" 
								style="width: 98%; min-height: 300px; border:solid #BBB 1px; text-align: center; margin-left: 5px;padding-top: 5px;">
								<aon:div id="pyg_chart_div" style="width: 100%; min-height: 280px;"/>
								<script type="text/javascript"> 
									google.load("visualization", "1", {'callback' : 'drawCharts' ,'packages':["corechart","table"], 'language': 'es'});
									function drawCharts(){
										var data = new google.visualization.DataTable();
										data.addColumn('string', 'Año');
										data.addColumn('number', 'Ingresos');
										data.addColumn('number', 'Compras');
										data.addColumn('number', 'Gastos');
										data.addColumn('number', 'Amortizaciones');
										data.addColumn('number', 'Margen Bruto');
										data.addColumn('number', 'EBITDA');
										data.addColumn('number', 'Resultado');
										
										<c:forEach var="entry" items="#{dashboard.fiscalPortal.yearPygEntries}">
											data.addRow(['#{entry.period}',
											             #{entry.income},
											             #{entry.purchase}, 
											             #{entry.expense},
											             #{entry.amortization},
											             #{entry.income - entry.purchase},
											             #{entry.income - entry.purchase - entry.expense},
											             #{entry.income - entry.purchase - entry.expense - entry.amortization}
											             ]);
										</c:forEach>
										var options = {
											chartArea:{right:5,top:15,width:"80%",height:"60%"},
											legend: {position: 'bottom'},
											tooltip: {isHtml: true},
											series: { 4: {type: 'bars'},
												      5: {type: 'bars'},
											          6: {type: 'bars'},
											        },
									    };
										var formatter = new google.visualization.NumberFormat({suffix: '€'});
										formatter.format(data, 1);
										formatter.format(data, 2);
										formatter.format(data, 3);
										formatter.format(data, 4);
										formatter.format(data, 5);
										formatter.format(data, 6);
										formatter.format(data, 7);
										var chart = new google.visualization.ComboChart(document.getElementById('aonContent:mainForm:yearPygGraphContainer'));
										chart.draw(data, options);
									}
							   </script>
							</aon:div>
						</aon:panelGrid>
						</aon:if>
					</aon:panelTab>

					<aon:panelTab id="fiscalPortletTabM" label="#{bundle.account_month_evolution}"
						rendered="#{desktop.state.accountingInfoVisibleForPortal}"
						actionListener="#{dashboard.fiscalPortal.onPygGraph}">
						<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabM'}">
						<aon:div styleClass="aon-bold">
							<aon:outputText value="Ejercicio"/>
							<aon:selectOneMenu id="Dashboard_pygGraphAccountPeriod"
								style="border: none; margin-left: 5px;"
								value="#{dashboard.fiscalPortal.pygEntriesPeriod}">
								<a4j:support event="onchange"
									actionListener="#{dashboard.fiscalPortal.onPygGraph}" 
									reRender="pygGraphContainer"
									ajaxSingle="true" limitToList="true" />
								<f:selectItem itemLabel="-" itemValue="" />
								<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
							</aon:selectOneMenu>
						</aon:div>
						<aon:panelGrid id="pygGraphContainer" columns="1" 
							styleClass="aon-width-all  aon-margin-top" columnClasses="aon-width-all">
							<aon:div style="width: 98%; min-height: 300px; border:solid #BBB 1px; text-align: center; margin-left: 5px;padding-top: 5px;">
								<aon:div id="pyg_chart_div" style="width: 100%; min-height: 280px;"/>
								<script type="text/javascript"> 
									google.load("visualization", "1", {'callback' : 'drawCharts' ,'packages':["corechart"], 'language': 'es'});
									function drawCharts(){
										var data = new google.visualization.DataTable();
										data.addColumn('string', 'Mes');
										data.addColumn('number', 'Ingresos');
										data.addColumn('number', 'Compras');
										data.addColumn('number', 'Gastos');
										data.addColumn('number', 'Amortizaciones');
										data.addColumn('number', 'Margen Bruto');
										data.addColumn('number', 'EBITDA');
										data.addColumn('number', 'Resultado');
										
										<c:forEach var="entry" items="#{dashboard.fiscalPortal.pygEntries}">
											data.addRow(['#{entry.period}',
											             #{entry.income},
											             #{entry.purchase}, 
											             #{entry.expense},
											             #{entry.amortization},
											             #{entry.income - entry.purchase},
											             #{entry.income - entry.purchase - entry.expense},
											             #{entry.income - entry.purchase - entry.expense - entry.amortization}
											             ]);
										</c:forEach>
										var options = {
											chartArea:{right:5,top:15,width:"80%",height:"60%"},
											legend: {position: 'bottom'},
											tooltip: {isHtml: true},
											series: { 4: {type: 'bars'},
												      5: {type: 'bars'},
											          6: {type: 'bars'},
											        },
									    };
										var formatter = new google.visualization.NumberFormat({suffix: '€'});
										formatter.format(data, 0);
										formatter.format(data, 1);
										formatter.format(data, 2);
										formatter.format(data, 3);
										formatter.format(data, 4);
										formatter.format(data, 5);
										formatter.format(data, 6);
										formatter.format(data, 7);
										var chart = new google.visualization.ComboChart(document.getElementById('aonContent:mainForm:pyg_chart_div'));
										chart.draw(data, options);
									}
							   </script>
							</aon:div>
						</aon:panelGrid>
						</aon:if>
					</aon:panelTab>

					<aon:panelTab id="fiscalPortletTabE" label="#{bundle.accounting_expense_breakdown}"
						rendered="#{desktop.state.accountingInfoVisibleForPortal}"
						actionListener="#{dashboard.fiscalPortal.onExpenseGraph}">
						<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabE'}">
						<aon:div styleClass="aon-bold">
							<aon:outputText value="Ejercicio"/>
							<aon:selectOneMenu id="Dashboard_expenseGraphAccountPeriod"
								style="border: none; margin-left: 5px;"
								value="#{dashboard.fiscalPortal.expensesPeriod}">
								<a4j:support event="onchange"
									actionListener="#{dashboard.fiscalPortal.onExpenseGraph}" 
									reRender="Dashboard_expenseGraphAccountPeriod,expenseGraphContainer"
									ajaxSingle="true" limitToList="true"/>
								<f:selectItem itemLabel="-" itemValue="" />
								<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
							</aon:selectOneMenu>
						</aon:div>
						<aon:panelGrid id="expenseGraphContainer" columns="1" 
							styleClass="aon-width-all aon-margin-top" columnClasses="aon-width-all">
							<aon:div style="width: 98%; min-height: 300px; border:solid #BBB 1px; text-align: center; margin-left: 5px;padding-top: 5px;">
								<aon:div id="expense_chart_div" style="width: 100%; min-height: 280px;"/>
								<script type="text/javascript"> 
									google.load("visualization", "1", {'callback' : 'drawCharts' ,'packages':["corechart"], 'language': 'es'});
									function drawCharts(){
										var data = google.visualization.arrayToDataTable([
											['Gasto','Importe'],
										<c:forEach var="entry" items="#{dashboard.fiscalPortal.expensesEntries}">
											['#{entry.name}',#{entry.value},],
										</c:forEach>
									    ]);
										var options = {
											chartArea:{left:30,right:5,top:15,width:"90%",height:"90%"},
											tooltip: {showColorCode: true},
											pieSliceText: 'percentage',
											pieHole: 0.4,
											sliceVisibilityThreshold: 1/600,
									    };
										var formatter = new google.visualization.NumberFormat({suffix: '€'});
										formatter.format(data, 1);
										var chart = new google.visualization.PieChart(document.getElementById('aonContent:mainForm:expense_chart_div'));
										chart.draw(data, options);
									}
							   </script>
							</aon:div>
						</aon:panelGrid>
						</aon:if>
					</aon:panelTab>

					<aon:panelTab id="fiscalPortletTabF" label="#{bundle.finance_fiscal_information}"
						rendered="#{desktop.state.fiscalInfoVisibleForPortal}">
						<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabF'}">
						<aon:div id="fiscal_status_div">
							<aon:div styleClass="aon-bold">
								<aon:outputText value="Tabla fiscal del ejercicio "/>
								<aon:selectOneMenu id="Dashboard_fiscalYear"
									style="border: none; margin-left: 5px;"
									value="#{dashboard.fiscalYear}">
									<a4j:support event="onchange"
										actionListener="#{dashboard.onFiscalPeriodChanged}" 
										reRender="fiscal_status_div_inner"
										ajaxSingle="true" />
									<f:selectItem itemLabel="2011" itemValue="2011" />
									<f:selectItem itemLabel="2012" itemValue="2012" />
									<f:selectItem itemLabel="2013" itemValue="2013" />
									<f:selectItem itemLabel="2014" itemValue="2014" />
									<f:selectItem itemLabel="2015" itemValue="2015" />
									<f:selectItem itemLabel="2016" itemValue="2016" />
									<f:selectItem itemLabel="2017" itemValue="2017" />
									<f:selectItem itemLabel="2018" itemValue="2018" />
									<f:selectItem itemLabel="2019" itemValue="2019" />
									<f:selectItem itemLabel="2020" itemValue="2021" />
								</aon:selectOneMenu>
							</aon:div>
							<aon:div id="fiscal_status_div_inner">
								<aon:if test="#{empty dashboard.fiscalInfo}">
										<aon:div style="padding-top: 10px;">
											<aon:outputText value="No se encontraron resultados"/>
										</aon:div>
								</aon:if>
								<table style="margin: 10px;margin-left: auto; margin-right: auto; ">
								<aon:if test="#{not empty dashboard.fiscalInfo}">
									<tr>
										<td></td>
										<td></td>
										<td></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="E"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="F"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="M"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="A"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="M"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="J"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="X"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="A"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="S"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="O"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="N"/></td>
										<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="D"/></td>
									</tr>
								</aon:if>
								<ui:repeat var="modelConfig" value="#{dashboard.fiscalInfo}">
									<tr>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;">
											<aon:outputText value=""
												style="padding-left: 16px;"
												rendered="#{modelConfig.administration != null}"
												styleClass="#{modelConfig.administrationStyle} aon-nowrap"
												/>
											<aon:outputText value="?"
												rendered="#{modelConfig.administration == null}"/>
										</td>
										<td style="width: 55px; border: solid #BBB 1px; font-weight: bold; white-space: nowrap;">
											<aon:outputText value="#{modelConfig.model.name}"/>
										</td>
										<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;">
											<aon:div style="display:inline;cursor:pointer;"
												rendered="#{modelConfig.document != null}">
												<aon:outputText value="&#160;" 
													style="padding-left:15px;" styleClass="aon-icon-comment"/>
												<rich:toolTip value="#{modelConfig.document} - #{modelConfig.name}" 
													showEvent="onmouseover"
													style="width: 400px;">
													<f:facet name="defaultContent">
														<aon:outputText value="#{bundle.aon_in_progress}" />
													</f:facet>
												</rich:toolTip>
											</aon:div>
										</td>
										<ui:repeat var="status" value="#{modelConfig.statusList}">
											<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"
												title="Modelo #{modelConfig.model.name}/#{status.period} - #{status.message}"
												colspan="#{12 / modelConfig.numberOfStatuses}">
												<aon:outputText value=""
													style="padding-left: 16px;"
													styleClass="#{status.styleClass} aon-nowrap"
													/>
											</td>
										</ui:repeat>
									</tr>
								</ui:repeat>
								</table>
							</aon:div>
						</aon:div>
						</aon:if>
					</aon:panelTab>
				</aon:panelTabSet>						
			</aon:div>
		</aon:div>
</ui:composition>
