<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
>
	<script type="text/javascript">
        //<![CDATA[
        	var uploadCount = 0;
        	
        	function upload(file, success, error ){
				let formData = new FormData();
				let xhr = new XMLHttpRequest();
				
				const user = '#{domainSwitcher.currentUser}';  
				const uploadId =  '#{uploadId}'
				const domainName = '#{domainSwitcher.currentDomainName}';
				const domainDocument = '#{domainSwitcher.currentDomainDocument}';
				const domainDescription =  '#{domainSwitcher.currentDomainDescription}';
				
				const fileOrder = ('0' + uploadCount++ ).slice(-2);  
				
    			formData.append('key', 
    					'#{s3Prefix}'
    					+'/' + domainName
    					+ ( domainDocument ? '/' + domainDocument : '' )
    					+'/' + user
    					+ ( uploadId ? '/' + uploadId : '' )
    					+ '/' + fileOrder + '_' + file.name);
    			formData.append('success_action_status', '201');
    			formData.append('x-amz-meta-company-name', domainDescription );
    			formData.append('Content-Type', file.type);
				formData.append('file', file);
    			
    			xhr.open('POST', "https://#{s3Bucket}.s3.amazonaws.com/", true);
    			xhr.addEventListener('readystatechange', function(e) {
				if (xhr.readyState == 4 && xhr.status == 201) {
				      // Done. Inform the user
				      success(file);
				    }
				    else if (xhr.readyState == 4 && xhr.status != 200) {
				      // Error. Inform the user
				      error(file, xhr);
				    }
				})	    			  
    			xhr.send(formData);
        	}

        	function setupS3UploadPanel(el , success, error ) {
 	       		;['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
	       			el.addEventListener(eventName, (e) => {
	      			  e.preventDefault()
	    			  e.stopPropagation()
	       			}, false)
	       		});
 	       		;['dragenter', 'dragover'].forEach(eventName => {
	       		  el.addEventListener(eventName, (e) => {
	       			  el.classList.add('highlight');
	       		  }, false)
	       		});
	       		;['dragleave', 'drop'].forEach(eventName => {
	       		  el.addEventListener(eventName, (e) => {
	       			  el.classList.remove('highlight');
	       		  }, false)
	       		});   
	       		
	       		el.addEventListener('drop', (e) => {
	    		  let dt = e.dataTransfer;
	    		  let files = dt.files;
	    		  ([...files]).forEach( (file) => upload(file,success, error ) );
	       		}, false);

	       		document.forms.s3UploadForm.file.addEventListener('change', (e) => {
	    		  let files = document.forms.s3UploadForm.file.files;
	    		  ([...files]).forEach( (file) => upload(file,success, error ) );
	       		});

	       		
	       		el.addEventListener('click', (e) => {
	       			document.forms.s3UploadForm.file.click();
		       	}, false);
	       		
	       	}

        	//]]>
    </script>
    
	<form name="s3UploadForm" action="https://aon-upload-post.s3.amazonaws.com/" method="post" enctype="multipart/form-data" target="_blank" style="display:none" >
	  
	  <!--  Key to upload: -->
	   
	  <input type="text"  name="key" value="invoice/${filename}" /><br />
	  <!--      
	  <input type="hidden" name="acl" value="private" />
	  -->
	  <input type="hidden" name="success_action_status" value="200" />
	  <!--  
	  <input 
	  type="hidden" 
	  name="success_action_redirect" 
	  value="http://sigv4examplebucket.s3.amazonaws.com/successful_upload.html" /> 
	  -->
	  
	  <!--
	Required for authenticated requests
	   <input type="hidden" name="Policy" value='Base64-encoded policy string' />
	   <input type="text"   name="X-Amz-Date" value="20151229T000000Z" />
	   <input type="hidden" name="X-Amz-Signature" value="signature-value" />
	   <input type="text"   name="X-Amz-Algorithm" value="AWS4-HMAC-SHA256" />
	   <input type="text"   name="X-Amz-Credential" value="AKIAIOSFODNN7EXAMPLE/20151229/us-east-1/s3/aws4_request" />
	   -->
	
	  <!--
	  x-amz-*headers
	  <input type="hidden" name="x-amz-meta-uuid" value="14365123651274" /> 
	  <input type="hidden" name="x-amz-server-side-encryption" value="AES256" /> 
	  -->
	
	  <!-- 
	  Tags for File: 
	  <input type="input"  name="x-amz-meta-tag" value="" /><br />
	  -->
	
	  <!--  Content-Type: --> 
	  <input type="input"  name="Content-Type" value="image/jpeg" /><br />
	  
	  
	  <!-- File: --> 
	  <input type="file"  name="file" multiple="multiple" /> <br />
	  <!-- The elements after this will be ignored -->
	  <input type="submit" name="submit" value="Upload to Amazon S3" />
	</form>
	
    <aon:div id="aonUploadToast" styleClass="aon-upload-toast" style="display:none;">
		<aon:panelGrid columns="2" columnClasses="aon-width-all,aon" styleClass="aon-upload-toast-header" >
			<aon:outputText id="aonUploadToastHeaderText" styleClass="aon-upload-toast-header-text" value="Se ha subido una factura" />
			<aon:outputText id="aonUploadToastHeaderIcon" styleClass="material-icons aon-upload-toast-header-icon" value="check_circle"/>
		</aon:panelGrid>
		<aon:div styleClass="aon-scroll-area">
			<aon:panelGrid id="aonUploadToastTable" columns="3" columnClasses="aon-width-40,aon-width-all,aon-width-40" styleClass="aon-upload-toast-body"  >
				
				<aon:outputText styleClass="material-icons aon-upload-toast-body-type" value="picture_as_pdf" />
				<aon:outputText styleClass="aon-upload-toast-body-name" value="ARCHIVO.PDF" />
				<aon:outputText styleClass="material-icons aon-upload-toast-body-icon" value="folder" />
			
			</aon:panelGrid>
		</aon:div>
    </aon:div>
  	
	<script type='text/javascript' >
    //<![CDATA[
    	
    	function getIcon(file) {
    		const mimeType = file.type;
    		if ( mimeType.match(/pdf/gi) ) 
    			return 'picture_as_pdf';
    		if ( mimeType.match(/image/g) ) 
    			return 'image';
    		return  'description'
    	} 
    	setupS3UploadPanel(
    	#{rich:element(uploadPanel)}
    	, (file) => {
    		#{rich:element('aonUploadToast')}.style.display = 'block';
    		const fileRow = #{rich:element('aonUploadToastTable')}.rows[0].cloneNode(true);
    		
    		const cells = fileRow.cells;

    		const fileTypeCell = cells[0];
    		const fileTypeElement = cells[0].firstChild;
    		fileTypeElement.innerText = getIcon(file);

    		const fileNameCell = cells[1];
    		const fileNameElement = cells[1].firstChild;
    		fileNameElement.innerText = file.name;
    		
    		
    		#{rich:element('aonUploadToastTable')}.appendChild(fileRow);	
    		
    		const documents = #{rich:element('aonUploadToastTable')}.rows.length - 1 ;
    		
    		if ( #{rich:element('aonUploadToastTable')}.rows.length === 2 )
    			#{rich:element('aonUploadToastHeaderText')}.innerText = '#{uploadOneTitle}' ;
    		else 
    			#{rich:element('aonUploadToastHeaderText')}.innerText = `#{uploadManyTitle}`;
    		
    	}
    	, (file, xhr ) => {
    		alert(xhr);
    	}
    	);
    	
    //]]>
	</script>
</ui:composition>
