<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">
	
	<aon:div id="fiscal_status_div">
		<aon:div styleClass="aon-bold">
			<aon:outputText value="Tabla fiscal del ejercicio "/>
			<aon:selectOneMenu id="Dashboard_fiscalYear"
				style="border: none; margin-left: 5px;"
				value="#{dashboard.fiscalYear}">
				<a4j:support event="onchange"
					actionListener="#{dashboard.onFiscalPeriodChanged}" 
					reRender="fiscal_status_div_inner"
					ajaxSingle="true" />
				<f:selectItem itemLabel="2011" itemValue="2011" />
				<f:selectItem itemLabel="2012" itemValue="2012" />
				<f:selectItem itemLabel="2013" itemValue="2013" />
				<f:selectItem itemLabel="2014" itemValue="2014" />
				<f:selectItem itemLabel="2015" itemValue="2015" />
				<f:selectItem itemLabel="2016" itemValue="2016" />
				<f:selectItem itemLabel="2017" itemValue="2017" />
				<f:selectItem itemLabel="2018" itemValue="2018" />
				<f:selectItem itemLabel="2019" itemValue="2019" />
				<f:selectItem itemLabel="2020" itemValue="2021" />
			</aon:selectOneMenu>
		</aon:div>
		<aon:div id="fiscal_status_div_inner">
			<aon:if test="#{empty dashboard.fiscalInfo}">
					<aon:div style="padding-top: 10px;">
						<aon:outputText value="No se encontraron resultados"/>
					</aon:div>
			</aon:if>
			<table style="margin: 10px;margin-left: auto; margin-right: auto; ">
			<aon:if test="#{not empty dashboard.fiscalInfo}">
				<tr>
					<td></td>
					<td></td>
					<td></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="E"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="F"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="M"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="A"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="M"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="J"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="X"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="A"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="S"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="O"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="N"/></td>
					<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"><aon:outputText value="D"/></td>
				</tr>
			</aon:if>
			<ui:repeat var="modelConfig" value="#{dashboard.fiscalInfo}">
				<tr>
					<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;">
						<aon:outputText value=""
							style="padding-left: 16px;"
							rendered="#{modelConfig.administration != null}"
							styleClass="#{modelConfig.administrationStyle} aon-nowrap"
							/>
						<aon:outputText value="?"
							rendered="#{modelConfig.administration == null}"/>
					</td>
					<td style="width: 55px; border: solid #BBB 1px; font-weight: bold; white-space: nowrap;">
						<aon:outputText value="#{modelConfig.model.name}"/>
					</td>
					<td style="width: 25px; border: solid #BBB 1px; font-weight: bold;">
						<aon:div style="display:inline;cursor:pointer;"
							rendered="#{modelConfig.document != null}">
							<aon:outputText value="&#160;" 
								style="padding-left:15px;" styleClass="aon-icon-comment"/>
							<rich:toolTip value="#{modelConfig.document} - #{modelConfig.name}" 
								showEvent="onmouseover"
								style="width: 400px;">
								<f:facet name="defaultContent">
									<aon:outputText value="#{bundle.aon_in_progress}" />
								</f:facet>
							</rich:toolTip>
						</aon:div>
					</td>
					<ui:repeat var="status" value="#{modelConfig.statusList}">
						<td style="width: 20px; border: solid #BBB 1px; font-weight: bold;"
							title="Modelo #{modelConfig.model.name}/#{status.period} - #{status.message}"
							colspan="#{12 / modelConfig.numberOfStatuses}">
							<aon:outputText value=""
								style="padding-left: 16px;"
								styleClass="#{status.styleClass} aon-nowrap"
								/>
						</td>
					</ui:repeat>
				</tr>
			</ui:repeat>
			</table>
		</aon:div>
	</aon:div>

</ui:composition>
