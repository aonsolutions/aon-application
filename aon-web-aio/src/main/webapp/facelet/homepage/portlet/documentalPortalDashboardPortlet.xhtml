<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div styleClass="aon-portlet aon-width-half" style="display: inline-block;">
		<script type="text/javascript">
			window.onload= function{
				var aux =  "#{dashboard.initialize}"
			}
	</script>
	
		<aon:div styleClass="aon-portlet-title">
			<aon:div styleClass="aon-portlet-title-buttons">
			</aon:div>
			<aon:outputText value="#{bundle.documental_portal}"
				styleClass="aon-portlet-title-text aon-icon aon-icon-stat" />
		</aon:div>
		<aon:div styleClass="aon-portlet-body">
			<aon:panelGrid columns="2" styleClass="aon-width-all"
				columnClasses="aon-width-all">

					
				<!--  CONTAINER 2 -->

				<aon:div id="recentsFileGraphContainer"
					style="width: 98%; height: 200px; border:solid #BBB 1px; text-align: center; margin-left: 5px;padding-top: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:commandLink id="gwtDocuments2" action="gwt_documents">
							<span class="aon-outputText aon-icon-documental-docs" style="padding-left:20px;color: #4b4b4b !important;">Documental - Archivos recientes</span>
						</aon:commandLink>						
					</aon:div>
					<aon:div id="table_div-recent_files"
						style="width: 100%; height: 180px;" />

				    <!-- script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script -->
				    <script type="text/javascript">
				    	google.charts.load('current', {'packages':['corechart','table']});
				    	google.charts.setOnLoadCallback(drawTable);
				      
				
						var recentsFiles = []; 
    					<c:forEach var="recent" items="#{dashboard.recentsFiles}">
    						recentsFiles[recentsFiles.length] = {fileId:#{recent.id}, driveId:#{(empty recent.driveId)  ? 'null' : "\"".concat(recent.driveId).concat("\"")}, mimetype:#{recent.mimetype != null ? recent.mimetype : '-1' }, icon:"#{recent.icon}", title:"#{recent.name}" };
						</c:forEach>
						
						function drawTable() {
        					var data = new google.visualization.DataTable();
        					data.addColumn('string', '#{bundle.doc_date}');
        					data.addColumn('string', '#{bundle.aon_name}');
        					data.addColumn('string', '#{bundle.aon_category}');
        					data.addColumn('string', '#{bundle.doc_size}');

							<c:set var="count" value="0" scope="page" />						
        					<c:forEach var="recent" items="#{dashboard.recentsFiles}" >
    							data.addRow(['&lt;div style="cursor:pointer;"  &gt; #{recent.date != null ? recent.date : "&amp;nbsp;"  } &lt;/div&gt;',
							            "&lt;div style=\"cursor:pointer; text-align:left; \" &gt; &lt;span class=\"#{recent.icon}\" style=\"padding-left: 20px;\" &gt;  &lt;/span&gt;#{recent.name} &lt;/div&gt;",
						             	'&lt;div style="cursor:pointer;"  &gt; #{( empty recent.category ) ? "&amp;nbsp;"  : recent.category }&lt;/div&gt;',
						             	'&lt;div style="cursor:pointer;"  &gt; #{( empty recent.sizeString ) ? "&amp;nbsp;" : recent.sizeString }&lt;/div&gt;']);
        						<c:set var="count" value="${count + 1}" scope="page"/>
							</c:forEach>
						
							var cssClasses = {headerRow: 'aon-chart-table-header', headerCell:'aon-chart-table-header-cell'};

							var divRecentFiles = document.getElementById('aonContent:mainForm:table_div-recent_files');
							
    	    				var options = {
        						showRowNumber: false,
        						allowHtml: true,
        						cssClassNames:cssClasses
						  	};
        					var table = new google.visualization.Table(divRecentFiles);
           					table.draw(data, options);
      					}
    				</script>
					</aon:div>
					</aon:panelGrid>
				</aon:div>
		</aon:div>
</ui:composition>
