<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<c:if test="#{domainSwitcher.childDomain and desktop.state.showExternalApplications}">
		<aon:div styleClass="aon-margin-top">
			<c:if test="#{desktop.state.showTirant}">
				<aon:div styleClass="aon-portlet aon-margin-bottom">
					<aon:div styleClass="aon-portlet-title">								
						<h:outputLink id="tirantWeb" target="_blank"
							value="#{bundle.aon_external_tirant_url}" >
							<h:graphicImage
								url="#{aonResource.resolve['/images/icon-tirant-asesores.png']}" />
							<aon:outputText value="#{bundle.aon_external_tirant}"
								styleClass="aon-portlet-title-text"/>
						</h:outputLink>
					</aon:div>
				</aon:div>
			</c:if>
			<c:if test="#{desktop.state.showServiconvenios}">
				<aon:div styleClass="aon-portlet aon-margin-bottom">
					<aon:div styleClass="aon-portlet-title">								
						<h:outputLink id="serviconveniosWeb" target="_blank"
							value="#{bundle.aon_external_serviconvenios_url}" >
							<h:graphicImage
								url="#{aonResource.resolve['/images/icon-serviconvenios.png']}" />
							<aon:outputText value="#{bundle.aon_external_serviconvenios}"
								styleClass="aon-portlet-title-text"/>
						</h:outputLink>
					</aon:div>
				</aon:div>
			</c:if>
			<c:if test="#{desktop.state.showDehOnline}">
				<aon:div styleClass="aon-portlet aon-margin-bottom">
					<aon:div styleClass="aon-portlet-title">								
						<h:outputLink id="dehOnlineWeb" target="_blank" 
							value="#{bundle.aon_external_dehOnline_url}" >
							<h:graphicImage
								url="#{aonResource.resolve['/images/icon-deh-online.png']}" />
							<aon:outputText value="#{bundle.aon_external_dehOnline}"
								styleClass="aon-portlet-title-text"/>
						</h:outputLink>
					</aon:div>
				</aon:div>
			</c:if>
		</aon:div>
	</c:if>
					
</ui:composition>
