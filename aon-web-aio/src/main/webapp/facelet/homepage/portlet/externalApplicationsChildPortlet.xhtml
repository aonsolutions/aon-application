<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:if test="#{domainSwitcher.childDomain and desktop.state.showExternalApplications}">
		<aon:div styleClass="aon-margin-top">
			
			<!-- TEDI CENTER -->
			<aon:if test="#{desktop.state.tediCenter}">
				<aon:div styleClass="aon-portlet aon-margin-bottom">
					<aon:div >								
						<h:outputLink id="tediWeb" target="_blank"
							value="https://tedi.center" >
							<h:graphicImage style="max-width: 201px;"
								url="https://tedi-snapshot.firebaseapp.com/assets/logo.png" />
						</h:outputLink>
					</aon:div>
				</aon:div>
			</aon:if>
			
			<!-- TEDI CENTER [TEST] -->
			<aon:if test="#{desktop.state.tediCenter and domainSwitcher.betaUser}">
				<aon:div styleClass="aon-portlet aon-margin-bottom">
					<aon:div >								
						<h:outputLink id="tediWebTest" target="_blank"
							value="https://tedi-snapshot.firebaseapp.com/" >
							<h:graphicImage style="max-width: 201px;"
								url="https://tedi-snapshot.firebaseapp.com/assets/logo-snapshot.png" />
						</h:outputLink>
					</aon:div>
				</aon:div>
			</aon:if>
		</aon:div>
	</aon:if>
					
</ui:composition>
