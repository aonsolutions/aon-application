<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">
	
	<aon:div id="yearPygGraphContainer" style="width: 100%;border:solid #BBB 1px;">
		<aon:div styleClass="aon-text-center aon-padding-bottom aon-padding-top">
			<aon:outputText value="#{bundle.account_year_evolution}" styleClass="aon-margin-right aon-bold"/>
		</aon:div>
		<aon:div id="pyg_chart_div" style="width: 100%; min-height: 280px;"/>
		
		<script type="text/javascript">
		 	google.charts.load('current', {'packages':['corechart'], 'language': 'es'});
		    google.charts.setOnLoadCallback(drawChartsYearPygGraph);
		    
			function drawChartsYearPygGraph(){
				var data = google.visualization.arrayToDataTable([
					['Año','Ingresos','Compras','Gastos','Amortizaciones','Margen Bruto','EBITDA','Resultado'],
					<c:forEach var="entry" items="#{dashboard.fiscalPortal.yearPygEntries}">
					['#{entry.period}',#{entry.income},#{entry.purchase},#{entry.expense},#{entry.amortization},
						#{entry.income - entry.purchase},
						#{entry.income - entry.purchase - entry.expense},
						#{entry.income - entry.purchase - entry.expense - entry.amortization}
					],
				</c:forEach>
			    ]);
				
				var options = {
					chartArea:{width:"85%",height:"60%"},
					legend: {position: 'bottom'},
					tooltip: {isHtml: true},
					series: { 4: {type: 'bars'},
						      5: {type: 'bars'},
					          6: {type: 'bars'},
					        },
			    };
				var formatter = new google.visualization.NumberFormat({suffix: '€'});
				formatter.format(data, 1);
				formatter.format(data, 2);
				formatter.format(data, 3);
				formatter.format(data, 4);
				formatter.format(data, 5);
				formatter.format(data, 6);
				formatter.format(data, 7);
				var chart = new google.visualization.ComboChart(document.getElementById('aonContent:mainForm:pyg_chart_div'));
				chart.draw(data, options);
			}
	   </script>
	</aon:div>
	
</ui:composition>
