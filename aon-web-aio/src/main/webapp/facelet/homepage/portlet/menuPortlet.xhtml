	<script type='text/javascript' >
	
		function getParentForm(el){
			return el.closest("form");
		}
	
		function scrollToTop(id) {
		    const scrollContainer = document.getElementById(id);
		    scrollContainer.scrollTop = 0;
		}
		
		function showMenuPortlet(menuPortlet, commandLink){
			
			mainForm = getParentForm(commandLink).id;
			
			document.getElementById(mainForm+":mainMenuPortlet").style.display='none';
			try {
				document.getElementById(mainForm+":hideRightButton").style.display='none';
				document.getElementById(mainForm+":infoGroupRightSupportDiv").style.visibility='hidden';
			} catch ( e ) {
			}

			document.getElementById(mainForm+":"+menuPortlet+"MenuPortlet").style.display='block';
		}
		function hideMenuPortlet(menuPortlet, commandLink){

			mainForm = getParentForm(commandLink).id;

			document.getElementById(mainForm+":"+menuPortlet+"MenuPortlet").style.display='none';
			
			document.getElementById(mainForm+":mainMenuPortlet").style.display='block';
		
			try {
				document.getElementById(mainForm+":hideRightButton").style.display='block';
				document.getElementById(mainForm+":infoGroupRightSupportDiv").style.visibility='visible';
			} catch ( e ) {
			}
			
		}
		
		function addNote() {
			noteEl = document.querySelector("#notesDiv aon-note");
			if (noteEl) {
				noteEl.addNote();
				mainForm = getParentForm(noteEl).id;
				scrollToTop(mainForm + ":" + "notes" + "notesContainer");
			}
		}

	</script>
