<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">
	
	<aon:if test="#{actionFavorite.moreUsedOptionsAvailable}">
	
	<aon:valueParam name="columnNumber" default="4" />
	
	<aon:div styleClass="aon-portlet">
		<aon:div styleClass="aon-portlet-title">								
			<aon:div styleClass="aon-portlet-title-buttons"></aon:div>
			<aon:outputText value="Visitados recientemente" styleClass="aon-portlet-title-text aon-icon aon-icon-stat"/>
		</aon:div>
		<aon:div styleClass="aon-portlet-body">
			<aon:div styleClass="aon-direct-access-list">
				<h:panelGrid styleClass="aon-option-favorite" style="width:75%; margin: 0 auto;" columns="#{columnNumber}"
					columnClasses="aon-width-fourth aon-text-left,aon-width-fourth aon-text-left, aon-width-fourth aon-text-left, aon-width-fourth aon-text-left"> 
					<aon:dynamicInclude value="#{actionFavorite.template}" />
				</h:panelGrid>
			</aon:div>
		</aon:div>
	</aon:div>
	
	</aon:if>

	
</ui:composition>
