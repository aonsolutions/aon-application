<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="aonHeader" styleClass="aon-header">
		<aon:panelGrid columns="3" width="100%" 
			columnClasses="aon-header-name,aon-header-options aon-width-300">
			
			<aon:div style="margin-top: 6px">
				<aon:outputConnectionStatus id="aonStatus" layout="block"
					startStyle="#{customize.statusStartStyle}"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyle="#{customize.statusStopStyle}"
					stopStyleClass="aon-outputConnectionStatus-stop"
					onstart="resetStatusError();" />
				<aon:div id="status_error"
					style="#{customize.statusFailedStyle} display: none;"
					styleClass="aon-outputConnectionStatus-failed" />
				<aon:graphicImage style="margin-left: 150px;"
					value="#{customize.headerLogo}" />
				<aon:outputText value="/"
					style="#{customize.fontStyle}"
					styleClass="aon-header-title-without-image" />
				<aon:outputText value="#{domainSwitcher.domainName}"
					style="#{customize.fontStyle}"
					styleClass="aon-nowrap aon-header-domain-title"/>
			</aon:div>

			<aon:div styleClass="aon-nowrap aon-padding-left" rendered="#{loggedUser.logged}"
				style="color:#999;">
				<aon:form id="headerOptionsForm">
					<c:if test="#{(!domainSwitcher.childDomain) and (!domainSwitcher.adminDomain) and (domainSwitcher.domainCount > 0)}">
						<aon:panelGroup styleClass="aon-margin-right">
			 				<h:outputLink id="DomainSwitch" 
								title="#{bundle.aon_module_enterprise}"
								value="."
								styleClass="aon-header-domain aon-margin-right"
								style="#{customize.fontStyle}" >
								<aon:outputText value="#{bundle.aon_module_enterprise}" />
							</h:outputLink>
							<aon:outputText value="|" style="#{customize.fontStyle}" />
						</aon:panelGroup>
					</c:if>
					<c:if test="#{domainSwitcher.enabledGoToParent}">
						<aon:panelGroup styleClass="aon-margin-right">
			 				<h:commandLink id="DomainSwitch" 
								title="#{bundle.aon_module_enterprise}"
								value="#{bundle.aon_module_enterprise}"
								styleClass="aon-header-domain aon-margin-right"
								style="#{customize.fontStyle}"
								actionListener="#{domainSwitcher.onUpperDomain}"					
								action="start" />
							<aon:outputText value="|" style="#{customize.fontStyle}" />
						</aon:panelGroup>
					</c:if>
					<aon:panelGroup>
						<aon:commandLink id="logout"
							style="#{customize.fontStyle}" styleClass="aon-header-logout"
							title="#{bundle.aon_login_user_logout}"
							value="#{bundle.aon_login_user_logout}"
							action="logout"
							actionListener="#{aonConfiguration.logout}" >
						</aon:commandLink>
					</aon:panelGroup> 
				</aon:form>
			</aon:div>
		</aon:panelGrid>

		<aon:div styleClass="aon-header-additionalInfo">
			<c:if test="#{!aonConfiguration.properties.hideHeaderLinks}">
				<aon:div styleClass="aon-float-right">
					<aon:div styleClass="aon-header-menu-item aon-nowrap">
						<c:if test="#{loggedUser.logged}">		
							<aon:outputText value="#{loggedUser.loggedUserName} &#183; #{loggedUser.companyName}" />
						</c:if>		
					</aon:div>
				</aon:div>
			</c:if>
			<c:if test="#{!aonConfiguration.properties.hideApplicationVersion}">
				<aon:outputFormat value="#{bundle.aon_version}"
					styleClass="aon-version-label"
					rendered="#{customize.applicationVersion != null}" >
					<f:param value="#{customize.applicationVersion}" />
				</aon:outputFormat>
			</c:if>				
			<ui:include src="#{userUtils.loggedUser.toolbar.template}" />
		</aon:div>
	</aon:div>

</ui:composition>
