<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<a4j:region>
		<h:form>
			<a4j:poll status="aonStatus" interval="300000"
				actionListener="#{desktop.onRefresh}" reRender="desktopDiv1" />
		</h:form>
	</a4j:region>

	<aon:form id="mainForm">

		<aon:div styleClass="aon-scroll-area">

			<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting"
				columnClasses="#{(domainSwitcher.childDomain and desktop.fiscalEnabled)?'':'aon-portlets-column1,'}
					aon-portlets-column2,aon-portlets-column3">

				<c:if test="#{!(domainSwitcher.childDomain and desktop.fiscalEnabled)}">
					<aon:div id="desktopDiv1">
						<c:if test="#{domainSwitcher.parentDomain or (domainSwitcher.childDomain and !desktop.fiscalEnabled)}">
						
						
						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">								
								<aon:commandLink id="menu_refresh"
									title="#{bundle.aon_refresh}"
									reRender="desktopDiv1" immediate="true"
									actionListener="#{desktop.onRefresh}">
									<aon:outputText value="#{bundle.aon_refresh}" styleClass="aon-portlet-title-text aon-icon aon-icon-refresh"/>
								</aon:commandLink>
							</aon:div>
						</aon:div>
						
						
						
							<c:if test="#{domainSwitcher.parentDomain or desktop.groupwareEnabled}">
								<ui:include src="/facelet/homepage/portlet/taskPortlet.xhtml" />
							</c:if>
							<ui:include src="/facelet/homepage/portlet/noticePortlet.xhtml" />
							<ui:include src="/facelet/homepage/portlet/notePortlet.xhtml" />
							<ui:include src="/facelet/homepage/portlet/favoritePortlet.xhtml" />
						</c:if>
					</aon:div>
				</c:if>
				<aon:div styleClass="aon-width-all">
					<c:if test="#{domainSwitcher.childDomain}">
						<ui:include src="/facelet/homepage/portlet/parentDomainInfoPortlet.xhtml" />
						<c:if test="#{desktop.fiscalEnabled}">
							<ui:include	src="/facelet/homepage/portlet/fiscalDashboardPortlet.xhtml" />
						</c:if>
						<c:if test="#{desktop.payrollEnabled}">
							<ui:include	src="/facelet/homepage/portlet/payrollDashboardPortlet.xhtml" />
						</c:if>
						<c:if test="#{!desktop.fiscalEnabled}">
							<ui:include src="/facelet/homepage/portlet/optionFavoritePortlet.xhtml" />
						</c:if>
					</c:if>
					<c:if test="#{!domainSwitcher.childDomain}">
						<c:if test="#{domainSwitcher.domainCount > 0}">
							<ui:include	src="/facelet/homepage/portlet/domainSwitchPortlet.xhtml" />
						</c:if>
						<c:if test="#{!domainSwitcher.domainManagementAvailable}">
							<ui:include src="/facelet/homepage/portlet/optionFavoritePortlet.xhtml" />
						</c:if>
					</c:if>
				</aon:div>

				<aon:div>
					<ui:include src="/facelet/homepage/portlet/logoPortlet.xhtml" />
					<ui:include src="/facelet/homepage/portlet/supportPortlet.xhtml" />
				</aon:div>
			</aon:panelGrid>

		</aon:div>
	</aon:form>
</ui:composition>
