<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<script type="text/javascript">
  		//<![CDATA[
		hideNewsPopup = function () {
			#{rich:element('newsPopup')}.style.display = 'none';
			#{rich:element('newsButton')}.style.display = 'block';
		}
		
		showNewsPopup = function () {
			#{rich:element('newsPopup')}.style.display = 'block';
			#{rich:element('newsButton')}.style.display = 'none';
		}
      	//]]>
	</script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>	

	<ui:include	src="/facelet/shared/array.prototype.js.xhtml" />
	
	<style>
	.menu-panel-categoryNews{
		display: block !important;
		overflow-y: auto; 
		max-height: calc(100vh - 303px);
	}
	[id$="fiscal_status_div"] *{
		color: #4b4b4b !important;
		text-transform: uppercase;
	}
	
	[id$="fiscal_status_div"] .aon_width_400 {
		width: 66% !important;
		min-width: 400px;
	}
	</style>	
	
	<aon:form id="mainForm" >

		<aon:div styleClass="aon-scroll-area aon-height-all" style="padding: .0em 1.5em 0 0 !important;">

			<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting aon-height-all"
				columnClasses="aon-portlets-column1,aon-portlets-column2">

				<aon:if test="#{!userUtils.newAONTheme}">				
					<ui:include src="/facelet/homepage/portlet/infoLeftGroupPortlet.xhtml" />
				</aon:if>
				<!--  
				<aon:if test="#{userUtils.newAONTheme}">				
					<ui:include src="/facelet/new/portlet/infoLeftGroupPortlet.xhtml" />
				</aon:if>
				-->
				<aon:div id="aonDesktopContent" styleClass="aon-width-all">
					
					<aon:if test="#{userUtils.newAONTheme}">				
						
						<aon:if test="#{desktop.accountingSelected}">
							<ui:include src="/facelet/new/portlet/accountingDesktopPortlet.xhtml" />
						</aon:if>
						<aon:if test="#{desktop.payrollSelected}">
							<ui:include src="/facelet/new/portlet/payrollDesktopPortlet.xhtml" />
						</aon:if>
						
						<aon:if test="#{desktop.fiscalSelected}">
							<aon:div id="accountingMenuDesktop" styleClass="aon-menu-desktop" >
						
									<aon:div styleClass="aon-margin aon-menu-desktop-panel">
						
										<aon:div styleClass="aon-menu-desktop-header" >
											<aon:outputText styleClass="aon-menu-desktop-header-line" />
											<aon:outputText styleClass="aon-menu-desktop-header-text" value="#{bundle.config_tax_module}" />
										</aon:div>
										<aon:div id="fiscal_status_div" style="width: 100%;">
											<ui:decorate template="/com/esferalia/aon/gwt/fiscal/facelet/innerGwt.xhtml">
												<ui:param name="module" value="aon_gwt_fiscal" />
												<ui:param name="entryPoint" value="ModelMatrix" />
											</ui:decorate>
										</aon:div>

									</aon:div>
									
							</aon:div>

						</aon:if>


						<aon:if test="#{desktop.enterpriseSelected or desktop.helpSelected or desktop.configurationSelected }">
							<aon:if test="#{!domainSwitcher.childDomain}">
								<aon:if test="#{domainSwitcher.domainCount >= 0}">
			  						<aon:if test="#{!userUtils.newAONTheme}">				
										<ui:include	src="/facelet/homepage/portlet/domainSwitchPortlet.xhtml" />
									</aon:if>
			  						<aon:if test="#{userUtils.newAONTheme}">				
										<ui:include	src="/facelet/new/portlet/domainSwitchPortlet.xhtml" />
									</aon:if>
									
								</aon:if>
								<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
			  						<aon:if test="#{userUtils.newAONTheme}">				
										<ui:include src="/facelet/new/portlet/optionFavoritePortlet.xhtml" />
									</aon:if>
			  						<aon:if test="#{!userUtils.newAONTheme}">				
										<ui:include src="/facelet/homepage/portlet/optionFavoritePortlet.xhtml" />
									</aon:if>
								</aon:if>
							</aon:if>
							<aon:if test="#{domainSwitcher.childDomain}">
			  					<aon:if test="#{!userUtils.newAONTheme}">				
									<ui:include src="/facelet/homepage/portlet/parentDomainInfoPortlet.xhtml" />
								</aon:if>
								
			  					<aon:if test="#{userUtils.newAONTheme}">				
									<ui:include src="/facelet/new/portlet/optionFavoritePortlet.xhtml" />
								</aon:if>
							
								<aon:if test="#{desktop.showGraphicsPortlet}">
									<aon:if test="#{desktop.state.fiscalEnabled and !desktop.state.fiscalInfoVisibleForPortal}">
										<ui:include	src="/facelet/homepage/portlet/fiscalDashboardPortlet.xhtml" />
									</aon:if>
									
									<aon:if test="#{desktop.state.fiscalInfoVisibleForPortal or desktop.state.accountingInfoVisibleForPortal or desktop.state.payrollInfoVisibleForPortal}">
										<aon:div styleClass="aon-portlet">
											
											<aon:div styleClass="aon-portlet-title">								
												<aon:div styleClass="aon-portlet-title-buttons">
												</aon:div>
												<aon:outputText value="#{bundle.menu_enterprise_site} - #{bundle.finance_fiscal_account_information} XXXX" 
													styleClass="aon-portlet-title-text aon-icon aon-icon-stat"/>
											</aon:div>
											
											<aon:div styleClass="aon-portlet-body">
												<aon:panelTabSet id="fiscalPortletTab" selectedTab="#{dashboard.fiscalPortal.selectedTab}">
												
													<aon:panelTab id="fiscalPortletTabY" label="#{bundle.account_year_evolution}"
														rendered="#{desktop.state.accountingInfoVisibleForPortal}"
														actionListener="#{dashboard.fiscalPortal.onYearPygGraph}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabY'}">
															<ui:include	src="/facelet/homepage/portlet/yearPygGraphic.xhtml" />
														</aon:if>
													</aon:panelTab>
								
													<aon:panelTab id="fiscalPortletTabM" label="#{bundle.account_month_evolution}"
														rendered="#{desktop.state.accountingInfoVisibleForPortal}"
														actionListener="#{dashboard.fiscalPortal.onPygGraph}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabM'}">
															<ui:include	src="/facelet/homepage/portlet/monthPygGraphic.xhtml" />
														</aon:if>
													</aon:panelTab>
								
													<aon:panelTab id="fiscalPortletTabE" label="#{bundle.accounting_expense_breakdown}"
														rendered="#{desktop.state.accountingInfoVisibleForPortal}"													
														actionListener="#{dashboard.fiscalPortal.onExpenseGraph}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabE'}">
															<ui:include	src="/facelet/homepage/portlet/accountExpenseGraphic.xhtml" />
														</aon:if>
													</aon:panelTab>
								
													<aon:panelTab id="fiscalPortletTabF" label="#{bundle.finance_fiscal_information}"
														rendered="#{desktop.state.fiscalInfoVisibleForPortal}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabF'}">
															<ui:include	src="/facelet/homepage/portlet/fiscalInfo.xhtml" />
														</aon:if>
													</aon:panelTab>
													
													<aon:panelTab id="fiscalPortletTabP" label="#{bundle.admin_portal_salary_info}"
														rendered="#{desktop.state.payrollInfoVisibleForPortal}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabP'}">
															<ui:include	src="/facelet/homepage/portlet/payrollPortalDashboardPortlet.xhtml" />
														</aon:if>
													</aon:panelTab>
													
												</aon:panelTabSet>						
											</aon:div>
										</aon:div>
									</aon:if>							
								</aon:if>
							<aon:if test="#{desktop.state.payrollEnabled and !desktop.state.payrollInfoVisibleForPortal}">
								<ui:include	src="/facelet/homepage/portlet/payrollDashboardPortlet.xhtml" />
							</aon:if>
							</aon:if>
							
						</aon:if>
					</aon:if>
					
					
					<aon:if test="#{!userUtils.newAONTheme}">				
						<aon:if test="#{help.notificationsEnabled}">
							<aon:div  >
								<aon:div styleClass="aon-margin-left aon-margin-top aon-margin-right" >
									<span class="material-icons aon-vertical-middle" >rss_feed</span><span class="aon-outputText aon-bold">NOTIFICACIONES</span>
									<aon:commandLink id="closeInfoNotifications"
										styleClass="aon-width-all aon-black "
									>
										<span class="material-icons aon-vertical-middle" style="float:right; " >close</span>
										<f:setPropertyActionListener target="#{help.notificationsEnabled}" value="#{false}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="1aon-height-all" >
									<ui:include src="/com/code/aon/web/help/facelet/notifications.xhtml" />
								</aon:div>
							</aon:div>
						</aon:if>
						<aon:if test="#{!help.notificationsEnabled and help.contentEnabled }" >
							<aon:div  >
								<aon:div styleClass="aon-margin-left aon-margin-top aon-margin-right" >
									<span class="material-icons aon-vertical-middle" >help</span><span class="aon-outputText aon-bold"> ÍNDICE CONTENIDOS</span>
									<aon:commandLink id="closeHelpIndex"
										styleClass="aon-width-all aon-black "
									>
										<span class="material-icons aon-vertical-middle" style="float:right; " >close</span>
										<f:setPropertyActionListener target="#{help.contentEnabled}" value="#{false}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="1aon-height-all" style="overflow-y: scroll; height: calc(100vh - 303px);">
									<ui:include src="/com/code/aon/web/help/facelet/drive_content.xhtml" />
								</aon:div>
							</aon:div>
						</aon:if>
	
						<aon:if test="#{!help.notificationsEnabled and !help.contentEnabled  }" >
							<aon:if test="#{domainSwitcher.childDomain}">
			  					<aon:if test="#{!userUtils.newAONTheme}">				
									<ui:include src="/facelet/homepage/portlet/parentDomainInfoPortlet.xhtml" />
								</aon:if>
			  					<aon:if test="#{userUtils.newAONTheme}">				
								</aon:if>
								
			  					<aon:if test="#{userUtils.newAONTheme}">				
									<ui:include src="/facelet/new/portlet/optionFavoritePortlet.xhtml" />
								</aon:if>
		
								<aon:if test="#{desktop.showGraphicsPortlet}">
									<aon:if test="#{desktop.state.fiscalEnabled and !desktop.state.fiscalInfoVisibleForPortal}">
										<ui:include	src="/facelet/homepage/portlet/fiscalDashboardPortlet.xhtml" />
									</aon:if>
									
									<aon:if test="#{desktop.state.fiscalInfoVisibleForPortal or desktop.state.accountingInfoVisibleForPortal or desktop.state.payrollInfoVisibleForPortal}">
										<aon:div styleClass="aon-portlet">
											
											<aon:div styleClass="aon-portlet-title">								
												<aon:div styleClass="aon-portlet-title-buttons">
												</aon:div>
												<aon:outputText value="#{bundle.menu_enterprise_site} - #{bundle.finance_fiscal_account_information} XXXX" 
													styleClass="aon-portlet-title-text aon-icon aon-icon-stat"/>
											</aon:div>
											
											<aon:div styleClass="aon-portlet-body">
												<aon:panelTabSet id="fiscalPortletTab" selectedTab="#{dashboard.fiscalPortal.selectedTab}">
												
													<aon:panelTab id="fiscalPortletTabY" label="#{bundle.account_year_evolution}"
														rendered="#{desktop.state.accountingInfoVisibleForPortal}"
														actionListener="#{dashboard.fiscalPortal.onYearPygGraph}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabY'}">
															<ui:include	src="/facelet/homepage/portlet/yearPygGraphic.xhtml" />
														</aon:if>
													</aon:panelTab>
								
													<aon:panelTab id="fiscalPortletTabM" label="#{bundle.account_month_evolution}"
														rendered="#{desktop.state.accountingInfoVisibleForPortal}"
														actionListener="#{dashboard.fiscalPortal.onPygGraph}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabM'}">
															<ui:include	src="/facelet/homepage/portlet/monthPygGraphic.xhtml" />
														</aon:if>
													</aon:panelTab>
								
													<aon:panelTab id="fiscalPortletTabE" label="#{bundle.accounting_expense_breakdown}"
														rendered="#{desktop.state.accountingInfoVisibleForPortal}"													
														actionListener="#{dashboard.fiscalPortal.onExpenseGraph}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabE'}">
															<ui:include	src="/facelet/homepage/portlet/accountExpenseGraphic.xhtml" />
														</aon:if>
													</aon:panelTab>
								
													<aon:panelTab id="fiscalPortletTabF" label="#{bundle.finance_fiscal_information}"
														rendered="#{desktop.state.fiscalInfoVisibleForPortal}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabF'}">
															<ui:include	src="/facelet/homepage/portlet/fiscalInfo.xhtml" />
														</aon:if>
													</aon:panelTab>
													
													<aon:panelTab id="fiscalPortletTabP" label="#{bundle.admin_portal_salary_info}"
														rendered="#{desktop.state.payrollInfoVisibleForPortal}">
														<aon:if test="#{dashboard.fiscalPortal.selectedTab == 'fiscalPortletTabP'}">
															<ui:include	src="/facelet/homepage/portlet/payrollPortalDashboardPortlet.xhtml" />
														</aon:if>
													</aon:panelTab>
													
												</aon:panelTabSet>						
											</aon:div>
										</aon:div>
									</aon:if>							
									
									<aon:if test="#{desktop.state.payrollEnabled and !desktop.state.payrollInfoVisibleForPortal}">
										<ui:include	src="/facelet/homepage/portlet/payrollDashboardPortlet.xhtml" />
									</aon:if>
									
		 							
								</aon:if>
		
							</aon:if>
							
							<aon:if test="#{!domainSwitcher.childDomain}">
								<aon:if test="#{domainSwitcher.domainCount >= 0}">
			  						<aon:if test="#{!userUtils.newAONTheme}">				
										<ui:include	src="/facelet/homepage/portlet/domainSwitchPortlet.xhtml" />
									</aon:if>
			  						<aon:if test="#{userUtils.newAONTheme}">				
										<ui:include	src="/facelet/new/portlet/domainSwitchPortlet.xhtml" />
									</aon:if>
									
								</aon:if>
								<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
			  						<aon:if test="#{userUtils.newAONTheme}">				
										<ui:include src="/facelet/new/portlet/optionFavoritePortlet.xhtml" />
									</aon:if>
			  						<aon:if test="#{!userUtils.newAONTheme}">				
										<ui:include src="/facelet/homepage/portlet/optionFavoritePortlet.xhtml" />
									</aon:if>
								</aon:if>
							</aon:if>
						
						</aon:if>
					</aon:if>
				</aon:div>
				<!-- ui:include src="/facelet/homepage/portlet/infoRightGroupPortlet.xhtml" /-->
			</aon:panelGrid>
	

		</aon:div>
	</aon:form>
	
	<script type="text/javascript">
		const allElements = document.querySelectorAll('*');
	
		allElements.forEach((element) => {
		  element.classList.remove('aon-top-menu-item-select');
		});
	</script>
	<script type='text/javascript' >
		#{rich:element('desktopDiv1')}.style.width='100%';
		#{rich:element('infoGroupDiv')}.style.display='block';
	</script>
	 
</ui:composition>
