<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

   <a4j:region>
        <h:form>
            <a4j:poll status="aonStatus" interval="300000"
            	actionListener="#{desktop.onRefresh}"
            	reRender="desktopDiv1" />
        </h:form>
    </a4j:region>
    
	<aon:form id="mainForm">

		<aon:div styleClass="aon-scroll-area">		

				<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column1,aon-portlets-column2,aon-portlets-column3">

					<aon:div id="desktopDiv1">
						<c:if test="#{desktop.taskHolderAvailable}">
							<aon:div styleClass="aon-portlet">
								<aon:div styleClass="aon-portlet-title">
									<aon:commandLink id="desktop_groupware_taskInbox"
										action="task_list"
										actionListener="#{task.onLaunch}">
										<aon:outputText value="#{bundle.aon_tasks}" 
											styleClass="aon-portlet-title-text aon-icon aon-icon-task-assume"/>
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-portlet-body">
									<aon:dataTable id="taskSummaryList"
										value="#{desktop.taskSummaryModel}" var="to"
										columnClasses="aon-table-portlet-column"
										rowClasses="aon-table-portlet-row"
										styleClass="aon-width-170 aon-table-portlet">
	
										<aon:column styleClass="aon-text-left" >
											<aon:outputText value="#{to.description}"/>
										</aon:column>
	
										<aon:column styleClass="aon-text-right" >
											<aon:outputText value="#{to.total}"/>
										</aon:column>
	
									</aon:dataTable>
								</aon:div>
							</aon:div>
						</c:if>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">								
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink actionListener="#{notice.onReset}" action="notice_form">
 										<aon:outputText value="&#160;" styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink actionListener="#{notice.onSearch}" action="notice_list">
									<aon:outputText value="#{groupwareBundle.aon_notice}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</aon:commandLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="noticeSummaryList" columns="3"
									value="#{desktop.noticeSummaryModel}" var="to"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:column styleClass="aon-text-left" >
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-call.png']}" rendered="#{to.call}"/>
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-visit.png']}" rendered="#{to.visit}"/>
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-message.png']}" rendered="#{to.message}"/>
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-info.png']}" rendered="#{to.communication}"/>
									</aon:column>
									<aon:column styleClass="aon-text-left" >
										<aon:outputText value="#{to.noticeType}"/>
									</aon:column>
									<aon:column styleClass="aon-text-right" >
										<aon:outputText value="#{to.count}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink actionListener="#{note.onReset}" action="note_form">
 										<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink actionListener="#{note.onSearch}" action="note_list">
									<aon:outputText value="#{groupwareBundle.aon_note}" styleClass="aon-portlet-title-text aon-icon aon-icon-notes"/>
								</aon:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
								<aon:dataTable id="recentNoteList"
									value="#{desktop.recentNoteModel}" var="to" rows="5"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:rowSelector action="note_form" actionListener="#{desktop.onSelectNote}"/>
									
									<aon:column>
										<aon:outputText value="#{to.subject}"/>
									</aon:column>			

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink id="desktopFavoriteReset" actionListener="#{favorite.onReset}" action="favorite_form">
 										<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink id="desktopFavoriteSearch" actionListener="#{favorite.onSearch}" action="favorite_list">
									<aon:outputText value="#{groupwareBundle.aon_favorites}" styleClass="aon-portlet-title-text aon-icon aon-icon-favorite"/>
								</aon:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
								<aon:dataTable id="desktopFavoriteList"
									value="#{favorite.model}" var="to" rows="5"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:column>
										<h:outputLink target="_blank" value="#{to.url}">
											<aon:outputText value="#{to.description}"/>	
										</h:outputLink>	
									</aon:column>			

								</aon:dataTable>
							</aon:div>
						</aon:div>
						
					</aon:div>

					<aon:div styleClass="aon-width-all">
						<c:if test="#{domainSwitcher.childDomain}">
							<h:panelGrid columns="2" styleClass="aon-width-all aon-margin-bottom"
								style="border: solid #CCCCCC 1px; color: #777777; background-color: #F5F5F5;" 
								columnClasses="aon-width-50 aon-vertical-align-top
											,aon-width-auto aon-vertical-align-top">
											
								<c:if test="#{domainSwitcher.parentDomainUserInChildDomain}">
									<h:commandLink action="start" actionListener="#{domainSwitcher.onParentDomain}">
									
										<!--
											a4j:mediaOutput duplicado un poco mas abajo, cuando el link esta deshabilitado 
										 -->
										<a4j:mediaOutput
											mimeType="#{parentDomain.mimeTypeName}"
											cacheable="false" element="img" 
											value="aon-parent-logo" 
											style="height:60px;"
											createContent="#{parentDomain.createLogoContent}">
										</a4j:mediaOutput>
									</h:commandLink>
								</c:if>
								
								<c:if test="#{!domainSwitcher.parentDomainUserInChildDomain}">
										<!--
											a4j:mediaOutput duplicado un poco mas arriba, cuando el link esta habilitado 
										 -->
									<a4j:mediaOutput
										mimeType="#{parentDomain.mimeTypeName}"
										cacheable="false" element="img" 
										value="aon-parent-logo" 
										style="height:60px;"
										createContent="#{parentDomain.createLogoContent}">
									</a4j:mediaOutput>
								</c:if>
									
								<h:panelGrid styleClass="aon-padding-left aon-width-all">
									<aon:outputText style="font-size: 1.2em;" styleClass="aon-bold" value="#{parentDomain.name}"/>
									<aon:outputText value="#{parentDomain.phone}"/>								
									<aon:outputText value="#{parentDomain.email}"/>
								</h:panelGrid>
	
							</h:panelGrid>
						</c:if>

						<c:if test="#{!domainSwitcher.childDomain and domainSwitcher.domainCount > 0}">
							<aon:div styleClass="aon-portlet">
								<aon:div styleClass="aon-portlet-title">
									<aon:div styleClass="aon-portlet-title-buttons">
										<aon:commandLink id="newDomainDesktop" actionListener="#{adminNewDomain.onInit}" action="newDomain_form">
												<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
										</aon:commandLink>
									</aon:div>
									<aon:outputText value="#{configBundle.config_domain_module}" styleClass="aon-portlet-title-text aon-icon aon-icon-company"/>
								</aon:div>
								<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
									<ui:include src="/com/code/aon/ui/config/facelet/domain/selection_listContent.xhtml" >
										<ui:param name="domainSwitcherRows" value="5" />
										<aon:methodParam name="rowSelectorAction" default="start" resolve="false" />										
									</ui:include>
								</aon:div>
							</aon:div>
						</c:if>
						
						<aon:componentGroup
							family="javax.faces.Command"
							rendered="#{aonRole.guest}"
							method="#{aonRole.doNothing}">
				
							<h:panelGrid styleClass="aon-width-all aon-vertical-align-top"
								headerClass="aon-direct-access-panel aon-icon-optionFavorite">
								<f:facet name="header">
									<h:panelGrid style="height: 20px;" columns="3"
										columnClasses="aon-nowrap,aon-width-all," >
										<aon:outputText value="#{auditBundle.audit_favorite_module}" />
										<aon:outputText value="&#160;" />
										<aon:commandLink id="favorite" immediate="true"
											value="&#160;" title="#{bundle.aon_editing}"
											action="actionFavorite" actionListener="#{actionFavorite.onInit}"
											styleClass="aon-icon-edit" />
									</h:panelGrid>						
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:dynamicInclude value="#{actionFavorite.template}" />
								</aon:div>
							</h:panelGrid>
			
						</aon:componentGroup>		

					</aon:div>

					<aon:div>
						<c:if test="#{company.withLogo}">
							<aon:div styleClass="aon-text-center">
								<a4j:mediaOutput
									mimeType="#{company.logoMimeType}" 
									cacheable="false" element="img" 
									value="#{company.aonFile.key}" 
									style="#{desktop.bigLogo?'width:200px':''}"
									createContent="#{company.createLogoContent}">
								</a4j:mediaOutput>
							</aon:div>
						</c:if>
						<!--  soporte -->
						<aon:div styleClass="aon-support" 
							style="text-align:center; color:#888888; background-color:#eeeeee;">
							<aon:div>
								<aon:div style="font-size: 1.1em;">
									<aon:outputText value="#{bundle.aon_support_title}" />
								</aon:div>
								<aon:div style="font-size: 1.3em; font-weight: bold;">
									<aon:outputText value="#{bundle.aon_support_telephone_number}" />
								</aon:div>
							</aon:div>
							<aon:div style="font-weight: bold;">
								<aon:outputLink target="_blank" value="http://www.esferalia.com/aon-soporte/es/aon-soporte.html"
									style="color:#888888; text-decoration:none;">
									<aon:outputText value="#{bundle.aon_support_send_email}" />
							    </aon:outputLink>
							</aon:div>
						</aon:div>
						<!-- fin soporte -->
					</aon:div>
					
				</aon:panelGrid>

		</aon:div>

	</aon:form>

</ui:composition>
