<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<a4j:region>
		<h:form>
			<a4j:poll status="aonStatus" interval="300000"
				actionListener="#{desktop.onRefresh}" reRender="desktopDiv1" />
		</h:form>
	</a4j:region>
	
	<ui:include	src="/facelet/shared/array.prototype.js.xhtml" />

	<aon:form id="mainForm">

		<aon:div styleClass="aon-scroll-area">

			<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting"
				columnClasses="#{(desktop.showGraphicsPortlet)?'':'aon-portlets-column1,'}
					aon-portlets-column2,aon-portlets-column3">

				<c:if test="#{!desktop.showGraphicsPortlet}">
					<ui:include src="/facelet/homepage/portlet/infoGroupPortlet.xhtml" />
				</c:if>
				<aon:div styleClass="aon-width-all">
					<c:if test="#{domainSwitcher.childDomain}">
						<ui:include src="/facelet/homepage/portlet/parentDomainInfoPortlet.xhtml" />
						
						<c:if test="#{desktop.state.fiscalEnabled and !desktop.state.fiscalInfoVisibleForPortal}">
							<ui:include	src="/facelet/homepage/portlet/fiscalDashboardPortlet.xhtml" />
						</c:if>

						<c:if test="#{desktop.state.fiscalInfoVisibleForPortal}">
							<ui:include	src="/facelet/homepage/portlet/fiscalPortalDashboardPortlet.xhtml" />
						</c:if>
						
						<c:if test="#{desktop.state.payrollEnabled and !desktop.state.payrollInfoVisibleForPortal}">
							<ui:include	src="/facelet/homepage/portlet/payrollDashboardPortlet.xhtml" />
						</c:if>
						<c:if test="#{desktop.state.documentalEnabled and !desktop.state.documentalInfoVisibleForPortal}">
							<ui:include	src="/facelet/homepage/portlet/documentalDashboardPortlet.xhtml" />
						</c:if>
						<!-- payroll portal -->
						<c:if test="#{desktop.state.payrollInfoVisibleForPortal}">
							<ui:include	src="/facelet/homepage/portlet/payrollPortalDashboardPortlet.xhtml" />
						</c:if>
						<!-- docs -->
						<c:if test="#{desktop.state.documentalInfoVisibleForPortal}">
							<ui:include src="/facelet/homepage/portlet/documentalPortalDashboardPortlet.xhtml" />
						</c:if>

						<c:if test="#{!desktop.showGraphicsPortlet}">
							<ui:include src="/facelet/homepage/portlet/optionFavoritePortlet.xhtml" />
						</c:if>

					</c:if>
					<c:if test="#{!domainSwitcher.childDomain}">
						<c:if test="#{domainSwitcher.domainCount > 0}">
							<ui:include	src="/facelet/homepage/portlet/domainSwitchPortlet.xhtml" />
						</c:if>
						<c:if test="#{!domainSwitcher.domainManagementAvailable}">
							<ui:include src="/facelet/homepage/portlet/optionFavoritePortlet.xhtml" />
						</c:if>
					</c:if>
				</aon:div>

				<aon:div>
					<ui:include src="/facelet/homepage/portlet/logoPortlet.xhtml" />					
					<ui:include src="/facelet/homepage/portlet/externalApplicationsChildPortlet.xhtml" />
					<c:if test="#{desktop.showGraphicsPortlet}">
						<ui:include src="/facelet/homepage/portlet/infoGroupPortlet.xhtml" />
					</c:if>			
					<ui:include src="/facelet/homepage/portlet/supportPortlet.xhtml" />
					<ui:include src="/facelet/homepage/portlet/externalApplicationsParentPortlet.xhtml" />
				</aon:div>
			</aon:panelGrid>

		</aon:div>
	</aon:form>
</ui:composition>
