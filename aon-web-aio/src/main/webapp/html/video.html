<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
  </head>
  <style>
    html {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .div-horizontal-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    iframe {
      user-select: none;
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      border: none;
      width: 100%;
      height: 100%;
    }

    * {
      scroll-behavior: smooth;
    }
  </style>
  <body> 
 	<iframe width="560" height="315" src="https://www.youtube.com/embed/u_P4fWxWgYI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <script>
      function b64DecodeUnicode(str) {
        // Going backwards: from bytestream, to percent-encoding, to original string.
        return decodeURIComponent(
          atob(str)
            .split('')
            .map(function (c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            })
            .join(''),
        )
      }

      window.onload = () => showVideo()
      window.onhashchange = showVideo

      async function showVideo() {
    	//return;
        // Get the video from the url
        const source = document.querySelector('iframe')
       
        let video = window.location.hash.substr(1)
        video = b64DecodeUnicode(video)

        if (!source) return

        const title = "Aon solutions"
        document.title = title
        window.title = title

        source.src = video
        player.load()
        player.play()
      }
    </script>
  </body>
</html>
