    .color-chaser path:nth-of-type(5) { animation-delay: 1s; }
    .color-chaser path:nth-of-type(6) { animation-delay: 1.25s; }
    .color-chaser path:nth-of-type(7) { animation-delay: 1.5s; }
    .color-chaser path:nth-of-type(8) { animation-delay: 1.75s; }
  </style>
  
