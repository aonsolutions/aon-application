<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes chase {
      0%, 100% {
        opacity: 1;
      }
      12.5% {
        opacity: 0.1;
      }
    }
    .color-chaser path {
      animation: chase 2s linear infinite;
    }
    .color-chaser path:nth-of-type(1) { animation-delay: 0s; }
    .color-chaser path:nth-of-type(2) { animation-delay: 0.25s; }
    .color-chaser path:nth-of-type(3) { animation-delay: 0.5s; }
