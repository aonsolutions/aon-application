<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="templatesForm">
	
		<aon:div>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_web_info_template}" />
				<ui:param name="controller" value="#{webPageStyle}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipSpin" value="true" />
			</ui:include>
			<rich:panel styleClass="aon-content-home">
				<aon:div style="text-align:center;margin-top:20px">
					<aon:outputText value="#{appBundle.aon_web_info_sytle_template} "/>
					<aon:selectOneMenu value="#{webPageStyle.template}" style="width:200px">
						<f:selectItems value="#{webPageStyle.templates}" />
						<a4j:support actionListener="#{webPageStyle.onChangeTemplate}" event="onchange" reRender="variables"/> 
					</aon:selectOneMenu>
				</aon:div>
		
				<aon:div id="variables" style="margin-top:20px">
					<aon:div layout="none" rendered="#{webPageStyle.templateSelected}">
					
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{webPageStyle}" />
							<ui:param name="skipResetButton" value="true" />
							<ui:param name="skipRemoveButton" value="true" />
							<ui:define name="columns">

								<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
									<f:facet name="header">
										<aon:outputText value="&#160;"/>
									</f:facet>
									<aon:graphicImage value="/images/#{webPageStyle.iconByType}" style="margin:2px"/>
									<f:facet name="footer">
										<aon:div>
											<aon:outputText value="&#160;"/>
										</aon:div>
									</f:facet>
								</aon:column>
					
								<aon:column style="aon-editDataTable-textColumn aon-width-300">
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_web_info_sytle_variable}" />
									</f:facet>
									<aon:div rendered="#{to != webPageStyle.to}">
										<aon:outputText value="#{webPageStyle.rowVariableName}" />
									</aon:div>
									<aon:div rendered="#{to == webPageStyle.to}" >
										<aon:outputText value="#{webPageStyle.toVariableName}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div>
											<aon:outputText value="&#160;"/>
										</aon:div>
									</f:facet>
								</aon:column>
					
								<aon:column style="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_web_info_sytle_value}" />
									</f:facet>
									<aon:div rendered="#{to!=webPageStyle.to}">
										<aon:div value="&#160;" style="width:64px;height:17px;border:1px black solid;background-color:#{to.value}" rendered="#{webPageStyle.color}" />
										<aon:outputText value="#{webPageStyle.fontName}" rendered="#{webPageStyle.font}" style="font-family:#{webPageStyle.fontType};font-size:15px"/>
										<aon:outputText value="#{to.value}" rendered="#{webPageStyle.number}"/>
										<aon:outputText value="#{webPageStyle.rattachName}" rendered="#{webPageStyle.image}" />
									</aon:div>
									<aon:div id="div_rgb" rendered="#{to==webPageStyle.to}">
										<aon:inputText id="rgb2" value="#{webPageStyle.to.value}" onfocus="showColorPicker(this);" size="10" maxlength="7" rendered="#{webPageStyle.color}"/>
										<aon:selectOneMenu id="WebInfoPageResource_font" value="#{webPageStyle.to.value}" rendered="#{webPageStyle.font}" >
											<f:selectItems value="#{webPageStyle.fontTypes}" />
										</aon:selectOneMenu>
										<rich:inputNumberSpinner value="#{webPageStyle.to.value}" required="#{true}" step="1" rendered="#{webPageStyle.number}"/>
										<aon:selectOneMenu id="WebInfoPageResource_rattach" value="#{webPageStyle.to.value}" rendered="#{webPageStyle.image}" >
											<f:selectItems value="#{webPageStyle.images}" />
										</aon:selectOneMenu>
									</aon:div>
									<f:facet name="footer">
										<aon:div>
											<aon:outputText value="&#160;"/>
										</aon:div>
									</f:facet>
								</aon:column>
							</ui:define>
						</ui:decorate>				
					</aon:div>
				</aon:div>

			</rich:panel>
		</aon:div>	
		</aon:form>

	</ui:define>
</ui:composition>
