<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition>
	<style>
.info {
	height: 500px;
	width: 94%;
	overflow: auto;
}
</style>

	<aon:form id="previewForm">
		<aon:panelGroup id="showPreviewModalPanel">
			<c:if test="#{webPageStyle.showPreviewModalPanel}">
				<rich:modalPanel id="previewModalPanel"
					rendered="#{webPageStyle.showPreviewModalPanel}" showWhenRendered="true"
					headerClass="aon-popupWindow-title" minHeight="600" height="500"
					minWidth="850" width="850" top="40" left="50" zindex="1000">

					<f:facet name="header">
						<h:outputText value="#{appBundle.infoweb_template_preview}" />
					</f:facet>

					<aon:div id="info">
						<rich:panel bodyClass="info">
							<aon:div id="preview" style="text-align:left;float:left;padding:5px"> 
								<aon:graphicImage value="preview.template?tpl=#{webPageStyle.template}&amp;big=true" style="border:1px #CCC solid;"/>
							</aon:div>
						</rich:panel>
					</aon:div>

					<aon:div id="closeModalPanel">
						<aon:div style="text-align:right;">
							<rich:spacer height="3" />
							<br />
							<aon:panelGrid style="float:right;border:1px gray solid">
								<aon:commandButton id="closeDocument"
									reRender="info, closeModalPanel" style="padding-right:15px"
									value="#{appBundle.infoweb_close}" immediate="true"
									styleClass="aon-icon-commandButton aon-icon-cancel">
									<f:setPropertyActionListener
										target="#{webPageStyle.showPreviewModalPanel}" value="#{false}" />
									<rich:componentControl for="previewModalPanel" operation="hide"
										event="onclick" />
								</aon:commandButton>
							</aon:panelGrid>
						</aon:div>
					</aon:div>

				</rich:modalPanel>
			</c:if>
		</aon:panelGroup>
	</aon:form>

</ui:composition>
</body>
</html>
