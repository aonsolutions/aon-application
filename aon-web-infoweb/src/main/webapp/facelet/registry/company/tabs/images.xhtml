<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="imagesForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_web_info_images}" />
				<ui:param name="controller" value="#{companyImages}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
			<rich:panel styleClass="aon-content-home">
				<aon:panelGrid cellpadding="5" cellspacing="0" border="0" columns="2" style="width:100%"
					styleClass="aon-noborder"
					columnClasses="aon-midle-width  aon-vertical-align-top,aon-midle-width" id="imagesPanel">	
					<aon:div>
						<aon:editDataTable id="companyImages" value="#{companyImages.model}"
							var="to" style="width:300px" 
							columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn">
			
							<aon:rowSelector toggleOnClick="#{true}" actionListener="#{companyImages.onSelect}" reRender="image_form"/>
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;"/>
								</f:facet>
								<aon:outputText value="&#160;"/>
								<f:facet name="footer">
									<aon:div rendered="#{companyImages.model.rowCount &lt; 21}">
										<aon:commandButton id="reset" reRender="imagesPanel"
											styleClass="aon-editDataTable-button aon-icon-reset"
											value="" rendered="#{!companyImages.new}"
											actionListener="#{companyImages.onReset}"
											accesskey="#{bundle.aon_key_new_line}">
										</aon:commandButton>
									</aon:div>
								</f:facet>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"/>
								<f:facet name="footer">
									<aon:outputText value="&#160;"/>
								</f:facet>
							</aon:column>
					
						</aon:editDataTable>
					
						<aon:dataScroller dataTable="companyImages" for="companyImages" style="width:300px"
							model="#{companyImages.model}" showNote="true" rowCount="20"/>
					</aon:div>	
					
					<aon:div id="image_form" >	
						<aon:div styleClass="aon-group" rendered="#{(companyImages.to != null) or (companyImages.new)}">	
							<aon:div styleClass="aon-group-title">		
								<aon:outputLabel for="RegistryAttachment_preview" value="#{appBundle.aon_web_info_images_preview}" />
							</aon:div>
							<aon:div styleClass="aon-group-body">
								<aon:div styleClass="aon-toolbar" >
									<aon:commandButton id="save_image" value="#{bundle.aon_save}"					
										styleClass="aon-icon-accept aon-finding-toolbar-item"
										actionListener="#{companyImages.onAccept}" reRender="imagesPanel"/>
									<aon:commandButton id="remove_image" value="#{bundle.aon_remove}"
										styleClass="aon-icon-delete aon-finding-toolbar-item"
										rendered="#{!companyImages.new}"
										actionListener="#{companyImages.onRemove}" reRender="imagesPanel"/>
									<aon:commandButton id="cancel_image" value="#{bundle.aon_cancel}"
										styleClass="aon-icon-cancel aon-finding-toolbar-item" reRender="imagesPanel"
										actionListener="#{companyImages.onCancel}"/>	
								</aon:div>	
			
								<aon:panelGrid columns="2" style="margin-left:10px;" 
									cellpadding="0" cellspacing="0" width="100%"
									rendered="#{companyImages.to != null}">	
									<aon:outputLabel for="RegistryAttachment_description" value="#{bundle.aon_description}" />
									<aon:inputText id="RegistryAttachment_description" size="45"
										maxlength="50" value="#{companyImages.to.description}" />		
			
									<aon:outputLabel for="RegistryAttachment_inputFile" value="#{appBundle.aon_web_info_images_file}" />
									<aon:fileUpload id="RegistryAttachment_inputFile" width="100%" rendered="#{companyImages.fileData == null}"
											addControlLabel="#{appBundle.aon_web_info_add}" 
											stopControlLabel="#{appBundle.aon_web_info_stop}" 
											stopEntryControlLabel="#{appBundle.aon_web_info_stop}"
											uploadControlLabel="#{appBundle.aon_web_info_uploading}"
											cancelEntryControlLabel="#{appBundle.aon_web_info_cancel}"
											clearAllControlLabel="#{appBundle.aon_web_info_clear_all}" 
											clearControlLabel="#{appBundle.aon_web_info_clear}"
											doneLabel="#{appBundle.aon_web_info_done}" 
											progressLabel="#{appBundle.aon_web_info_progress}" 
											sizeErrorLabel="#{appBundle.aon_web_info_size_error}" 
											transferErrorLabel="#{appBundle.aon_web_info_transfer_error}" 
											fileUploadListener="#{companyImages.uploadListener}"
											immediateUpload="true" autoclear="false" listHeight="70px" listWidth="100%">
										<a4j:support event="onuploadcomplete" reRender="image_preview" />
									</aon:fileUpload>
			
									<aon:panelGroup id="image_preview" styleClass="aon-text-center" rendered="#{companyImages.fileData != null}">
										<a4j:mediaOutput id="RegistryAttachment_preview" 
											element="img" cacheable="false" style="width:200px" 
											createContent="#{companyImages.paint}" 
											mimeType="#{companyImages.mimeType}" />
									</aon:panelGroup>
								</aon:panelGrid>
							</aon:div>			
						</aon:div>	
					</aon:div>	
			
				</aon:panelGrid>
			</rich:panel>
		
		</aon:form>
	</ui:define>
</ui:composition>
