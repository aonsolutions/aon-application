<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition>
	<style>
.info {
	height: 450px;
	width: 94%;
	overflow: auto;
}
</style>

	<aon:form id="pagesGenericForm">
		<aon:panelGroup id="showGenericModalPanel">
			<c:if test="#{webPage.showGenericModalPanel}">
				<rich:modalPanel id="genericModalPanel"
					rendered="#{webPage.showGenericModalPanel}" showWhenRendered="true"
					headerClass="aon-popupWindow-title" minHeight="540" height="540"
					minWidth="770" width="770" top="40" left="50" zindex="1000">

					<f:facet name="header">
						<h:outputText value="#{appBundle.infoweb_page_generic}" />
					</f:facet>

					<aon:div id="info">
						<rich:panel bodyClass="info">

							<aon:div styleClass="aon-toolbar">
								<aon:commandButton id="saveg" value="#{bundle.aon_save}"
									styleClass="aon-finding-toolbar-item aon-icon-accept"
									actionListener="#{webPage.onAcceptDetail}">
									<f:setPropertyActionListener
										target="#{webPage.showGenericModalPanel}" value="#{false}" />
									<rich:componentControl for="genericModalPanel" operation="hide"
										event="onclick" />
								</aon:commandButton>
							</aon:div>

							<aon:div id="genericDetail" style="float:left;margin-right:20px;">
								<aon:panelGrid columns="2" dir="true">

									<aon:outputLabel for="Generic_title"
										value="#{appBundle.infoweb_page_title}" />
									<aon:inputText id="Generic_title" size="80" maxlength="255"
										value="#{webPage.detail.title}" />

									<aon:outputLabel for="Generic_layout"
										value="#{appBundle.infoweb_page_layout}" />
									<aon:selectOneMenu id="Generic_layout"
										value="#{webPage.detail.layout}">
										<f:selectItems value="#{webinfoCollections.layoutTypes}" />
									</aon:selectOneMenu>

									<aon:outputLabel for="Generic_content_richTextEnabled"
										value="#{appBundle.infoweb_page_rich_enable}" />
									<aon:selectBooleanCheckbox id="Generic_content_richTextEnabled"
										value="#{webPage.richTextEnabled}">
										<a4j:support ajaxSingle="true" event="onclick"
											reRender="genericDetail" />
									</aon:selectBooleanCheckbox>

									<aon:outputLabel for="Generic_content"
										value="#{appBundle.infoweb_page_content}" />
									<aon:inputTextarea id="Generic_content"
										rendered="#{!webPage.richTextEnabled}"
										value="#{webPage.detail.content}" cols="100" rows="12" />
									<aon:div style="width:600px"
										rendered="#{webPage.richTextEnabled}">
										<aon:inputRichText style="width:100%"
											id="Generic_content_HTML" value="#{webPage.detail.content}" />
									</aon:div>

								</aon:panelGrid>
							</aon:div>

							<rich:spacer height="10" />

							<aon:editDataTable id="WebInfoPageGenericResource_datatable"
								value="#{webPage.resources}" var="to" rows="5"
								columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
									aon-editDataTable-textColumn aon-width-auto, aon-editDataTable-textColumn, 
									aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

								<aon:rowSelector toggleOnClick="false" />
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<a4j:support actionListener="#{webPage.onSelectResource}"
										event="onclick"
										reRender="WebInfoPageGenericResource_datatable" />
									<aon:outputText value="&#160;" />
									<f:facet name="footer">
										<aon:div>
											<aon:commandButton id="resetGR"
												styleClass="aon-icon-reset aon-icon-commandButton" value=""
												rendered="#{!webPage.newResource}"
												actionListener="#{webPage.onResetResource}"
												accesskey="#{bundle.aon_key_new_line}">
											</aon:commandButton>
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column style="width:140px">
									<f:facet name="header">
										<aon:outputText
											value="#{appBundle.infoweb_page_resource}" />
									</f:facet>
									<aon:div rendered="#{to != webPage.resource}">
										<a4j:support actionListener="#{webPage.onSelectResource}"
											event="onclick"
											reRender="WebInfoPageGenericResource_datatable" />
										<aon:outputText value="#{to.rattach.description}" />
									</aon:div>
									<aon:div rendered="#{to == webPage.resource}">
										<h:selectOneMenu id="WebInfoPageGenericResource_rattach"
											value="#{webPage.rattachId}">
											<f:selectItems value="#{webPage.images}" />
										</h:selectOneMenu>
									</aon:div>
									<f:facet name="footer">
										<aon:div>
											<aon:div rendered="#{webPage.newResource}">
												<h:selectOneMenu id="WebInfoPageGenericResource_rattach_new"
													value="#{webPage.rattachId}">
													<f:selectItems value="#{webPage.images}" />
												</h:selectOneMenu>
											</aon:div>
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText
											value="#{bundle.aon_description}" />
									</f:facet>
									<aon:div rendered="#{to!=webPage.resource}">
										<a4j:support actionListener="#{webPage.onSelectResource}"
											event="onclick"
											reRender="WebInfoPageGenericResource_datatable" />
										<aon:outputText value="#{to.content}" />
									</aon:div>
									<aon:div rendered="#{to==webPage.resource}">
										<aon:inputText value="#{webPage.resource.content}" size="32" />
									</aon:div>
									<f:facet name="footer">
										<aon:div>
											<aon:div rendered="#{webPage.newResource}">
												<aon:inputText value="#{webPage.resource.content}" size="32" />
											</aon:div>
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:div rendered="#{to == webPage.resource}">
										<aon:commandButton title="#{bundle.aon_save}"
											actionListener="#{webPage.onAcceptResource}" value=""
											styleClass="aon-editDataTable-button aon-icon-accept"
											accesskey="#{bundle.aon_key_save_line}" reRender="info" />
										<aon:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{webPage.onCancelResource}"
											immediate="#{true}"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											reRender="info" value=""
											accesskey="#{bundle.aon_key_cancel_line}" />
										<aon:commandButton title="#{bundle.aon_remove}"
											actionListener="#{webPage.onRemoveResource}"
											styleClass="aon-editDataTable-button aon-icon-delete"
											value="" accesskey="#{bundle.aon_key_remove_line}"
											reRender="info" />
									</aon:div>
									<f:facet name="footer">
										<aon:div>
											<aon:outputText rendered="#{!webPage.newResource}"
												value="&#160;" />
											<aon:commandButton title="#{bundle.aon_save}"
												actionListener="#{webPage.onAcceptResource}"
												rendered="#{webPage.newResource}" value=""
												styleClass="aon-editDataTable-button aon-icon-accept"
												accesskey="#{bundle.aon_key_save_line}" reRender="info" />
											<aon:commandButton title="#{bundle.aon_cancel}"
												actionListener="#{webPage.onCancelResource}"
												immediate="#{true}" rendered="#{webPage.newResource}"
												reRender="info"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												value="" accesskey="#{bundle.aon_key_cancel_line}" />
										</aon:div>
									</f:facet>
								</aon:column>
							</aon:editDataTable>

							<aon:dataScroller2 for="WebInfoPageGenericResource_datatable" showNote="false" />

						</rich:panel>
					</aon:div>

					<aon:div id="closeModalPanel">
						<aon:div style="text-align:right;">
							<rich:spacer height="3" />
							<br />
							<aon:panelGrid style="float:right;border:1px gray solid">
								<aon:commandButton id="closeDocument"
									reRender="info, closeModalPanel" style="padding-right:15px"
									value="#{appBundle.infoweb_close}" immediate="true"
									styleClass="aon-icon-commandButton aon-icon-cancel">
									<f:setPropertyActionListener
										target="#{webPage.showGenericModalPanel}" value="#{false}" />
									<rich:componentControl for="genericModalPanel" operation="hide"
										event="onclick" />
								</aon:commandButton>
							</aon:panelGrid>
						</aon:div>
					</aon:div>

				</rich:modalPanel>
			</c:if>
		</aon:panelGroup>
	</aon:form>

</ui:composition>
</body>
</html>
