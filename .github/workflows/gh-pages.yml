# This script deploys your website automatically
name: GitHub Pages

# Only trigger this script when you push to the master branch
on:
  push:
    branches: [ master ]
    
# Specify the tasks to run when this script gets triggered
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs our deployment command
      - name: Deploying the AON Suite to GitHub Pages
        run: |
          git push origin :gh-pages
          && git subtree push --prefix aon-suite/public origin gh-pages
