# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up MySQL
      run: |
        sudo systemctl start mysql.service
        sudo mysql -u root --password=root -v  <<-EOSQL
        --
        SET GLOBAL sql_mode = '';
        SET GLOBAL time_zone = '+01:00';
        --
        CREATE USER 'dbuser'@'%' IDENTIFIED WITH mysql_native_password BY 'serubd2000' ;
        GRANT ALL ON *.* TO 'dbuser'@'%' ;
        --
        -- default privileges include a row with Host='localhost' and User=''. 
        CREATE USER 'dbuser'@'localhost' IDENTIFIED WITH mysql_native_password BY 'serubd2000' ;
        GRANT ALL ON *.* TO 'dbuser'@'localhost';
        EOSQL
    - name: Build with Maven
      run: mvn -B --fail-at-end -Dgwt.working=true -DskipTests=true clean install
    
    # - name: Build the Docker images
