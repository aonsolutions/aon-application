
name: Java CI with Maven

on:
  # push:
  #   branches: [ "master" ]
  pull_request:
    # By default, a workflow only runs when a pull_request event's activity type
    # is opened, synchronize, or reopened. types: [opened, synchronize, reopened]
    branches: [ "master" ]
  workflow_dispatch:

env:
  TZ: Europe/Madrid
  AWS_REGION: eu-west-1
  
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github

    - name: Set up MySQL
      run: |
        sudo systemctl start mysql.service
        sudo mysql -u root --password=root -v  <<-EOSQL
        --
        SET GLOBAL sql_mode = '';
        SET GLOBAL time_zone = '+01:00';
        --
        CREATE USER 'dbuser'@'%' IDENTIFIED WITH mysql_native_password BY 'serubd2000' ;
        GRANT ALL ON *.* TO 'dbuser'@'%' ;
        --
        -- default privileges include a row with Host='localhost' and User=''. 
        CREATE USER 'dbuser'@'localhost' IDENTIFIED WITH mysql_native_password BY 'serubd2000' ;
        GRANT ALL ON *.* TO 'dbuser'@'localhost';
        EOSQL

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create connection file
      run: |
        sudo mkdir /etc/aon-aio
        sudo tee -a /etc/aon-aio/connection >/dev/null <<-EOF
        driverClass=com.mysql.cj.jdbc.Driver
        jdbcUrl=jdbc:mysql://127.0.0.1:3306
        user=dbuser
        password=serubd2000
        useSSL=false
        sessionVariables=SQL_SAFE_UPDATES=1
        EOF
    # - name: Set Timezone ${{env.TZ}}
    #  run: export TZ=${{env.TZ}}

    - name: Get changed projects
      run: |
        export PROJECTS=$(\
        git diff --name-only origin/master |\
        cut -d/ -f1 | sort -u |\
        while read module; \
          do  [ -f $module/pom.xml ] && echo $module; \
        done |\
        sed -e '$ ! s/$/,/g' | tr -d '\n')
        echo "PROJECTS=${PROJECTS}" >> $GITHUB_ENV

    - name: Build with Maven
      run: mvn -B -pl ${PROJECTS:=.} -Dgwt.working=true -DskipTests=true clean install

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy
      env:
        GITHUB_TOKEN: ${{ github.token }}
