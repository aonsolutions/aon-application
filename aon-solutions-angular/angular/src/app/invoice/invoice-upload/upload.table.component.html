<mat-table #matTable [dataSource]='datasource'>

  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox color='primary' (change)="$event ? masterToggle() : null" [checked]="selection && selection.hasValue() && isAllSelected()"
        [indeterminate]="selection && selection.hasValue() && !isAllSelected()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox color='primary' (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
        [checked]="selection.isSelected(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef='iconButton'>
    <mat-header-cell *matHeaderCellDef>
      <button mat-icon-button (click)="onClickAll($event,element)">
        <mat-icon>cloud_upload</mat-icon>
      </button>
    </mat-header-cell>
    <mat-cell *matCellDef='let element'>
      <mat-spinner [diameter]="20" *ngIf="element.isLoading" class="progress-margin"></mat-spinner>
      <button mat-icon-button *ngIf="!element.isLoading" (click)="onClick($event,element)"
            [title]="element.isPending()?'Importar':'Ver'">
        <mat-icon>{{element.stateIcon()}}</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef='icon'>
    <mat-header-cell *matHeaderCellDef> </mat-header-cell>
    <mat-cell *matCellDef='let element'>
        <mat-icon>{{element.type.icon}}</mat-icon>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef='name'>
    <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
    <mat-cell *matCellDef='let element'>
      <div *ngIf="!element.isDone()"> {{element.file.name}} </div>
      <button mat-button color="primary" *ngIf="element.isDone()" (click)="onInvoice($event,element)" style="padding-left: 0px;">
        {{element.file.name}}
      </button>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef='size'>
    <mat-header-cell *matHeaderCellDef> Tamaño </mat-header-cell>
    <mat-cell *matCellDef='let element'> {{element.decoratedSize()}}</mat-cell>
  </ng-container>

  <ng-container matColumnDef='type'>
    <mat-header-cell *matHeaderCellDef> </mat-header-cell>
    <mat-cell *matCellDef='let element'> {{element.type.friendlyType}} </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef='displayedColumns; sticky: true'></mat-header-row>
  <mat-row *matRowDef='let row; columns: displayedColumns'
      [ngClass]="{'row-highlighted': row.isDone()
                 ,'row-error': row.isError()}">
  </mat-row>
</mat-table>
<div #targetDiv></div>
