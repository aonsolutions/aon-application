<div class="container">
  <h3 class="title">
    {{title}}
  </h3>
  <div >
    <mat-form-field>
      <mat-select placeholder="Tipo"  [(ngModel)]="type">
        <mat-option *ngFor="let t of types" [value]="t.value">
          {{t.viewValue}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div  mat-dialog-actions >
    <button mat-raised-button (click)="accept()">Aceptar</button>
  </div>
</div>
