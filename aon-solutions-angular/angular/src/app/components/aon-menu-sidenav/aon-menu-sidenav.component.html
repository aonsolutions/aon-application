<div *ngIf="isPrincipalMenu()" class="aon-menu-sidenav-content">
  <mat-list>
    <mat-list-item style="height:80px;" *ngFor="let app of apps">
      <a style="width:80px;cursor: pointer;margin:8px 2px;text-align: center;" (click)='appSelection(app.app)'>
        <div>
          <img [src]="app.logo" style="width:40px;" [title]="app.title">
          <div>
            <span style="font-size: 12px; color: rgba(0,0,0,.87);font-family: Roboto,sans-serif;"> {{app.title}} </span>
          </div>
        </div>
      </a>
    </mat-list-item>
  </mat-list>
</div>

<div *ngIf="!isPrincipalMenu()" class="aon-menu-sidenav-app-content">
  <mat-toolbar [ngClass]="getAppToolbarClass()">
    <span>{{app.title}}</span>

    <span class="tedi-right40" >
      <button mat-icon-button >
        <mat-icon>launch</mat-icon>
      </button>
    </span>

    <span class="tedi-right0" >
      <button mat-icon-button (click)="backMenu()">
        <mat-icon>close</mat-icon>
      </button>
    </span>
  </mat-toolbar>

  <mat-list>
    <mat-list-item style="height:30px;" *ngFor="let option of app.options" [title]="option.title">
      <a class="aon-menu-link" (click)='optionSelection(option)'>
        <span style="font-size: 12px; color: rgba(0,0,0,.87);font-family: Roboto,sans-serif;"> {{option.title}} </span>
      </a>
    </mat-list-item>
  </mat-list>
</div>
