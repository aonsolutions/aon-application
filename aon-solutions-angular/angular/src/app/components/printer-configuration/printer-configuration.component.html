
<mat-card>
  <mat-card-header>
    <mat-card-title>Impresión de Facturas <b>({{cpService.company.name}})</b></mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div style='text-align: left;margin-left: 10px;'>
      <mat-form-field >
        <input #header matInput placeholder="Cabecera" [value]='properties.header' (change)='onchange(header.value, footer.value, adjustment.value, detailed.value)'>
      </mat-form-field>
    </div>
    <div style='text-align: left;margin-left: 10px;'>
      <mat-form-field >
        <input #footer matInput placeholder="Pie" [value]='properties.footer' (change)='onchange(header.value, footer.value, adjustment.value, detailed.value)'>
      </mat-form-field>
    </div>
    <div style='text-align: left;margin-left: 10px;margin-bottom: 10px;'>
      <mat-checkbox #adjustment color="primary" [checked]='properties.adjustment' (change)='onchange(header.value, footer.value, adjustment.checked, detailed.checked)'>Ajustar Fondo</mat-checkbox>
      <button title="Adjuntar Fichero" mat-icon-button>
        <input #fileInput style="display:none;" type="file" name="file" id="file" (change)="attach()" />
        <label for="file" style="padding-top: 15px;cursor: pointer;">
          <mat-icon>add_photo_alternate</mat-icon>
        </label>
      </button>
    </div>

    <div style='text-align: left;margin: 10px;'>
      <mat-checkbox #detailed color="primary" [checked]='properties.detailed' (change)='onchange(header.value, footer.value, adjustment.checked, detailed.checked)'>Detallado</mat-checkbox>
    </div>

    <div  style='text-align: left;margin: 10px;'>
      <button mat-raised-button (click)="showPreview()">Vista Preliminar</button>
    </div>

</mat-card-content>
</mat-card>
