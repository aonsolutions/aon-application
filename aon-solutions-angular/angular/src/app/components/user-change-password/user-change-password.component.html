
<mat-card>
  <mat-card-header>
    <mat-card-title>Cambiar Contraseña</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form>

      <mat-form-field class="example-full-width">
        <input #oldPassword matInput placeholder="Contraseña Actual" type="password">
      </mat-form-field>

      <mat-form-field class="example-full-width">
        <input #newPassword matInput placeholder="Nueva Contraseña" type="password">
      </mat-form-field>

      <mat-form-field class="example-full-width">
        <input #repeatNewPassword matInput placeholder="Repetir Nueva Contraseña" type="password">
      </mat-form-field>

      <div mat-dialog-actions>
        <button mat-raised-button type="submit" (click)="changePassword(oldPassword.value, newPassword.value, repeatNewPassword.value)">Guardar</button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
