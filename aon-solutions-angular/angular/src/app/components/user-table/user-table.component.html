<div class="table-overflow"
    infiniteScroll
    [infiniteScrollDistance]="2"
    [infiniteScrollThrottle]="50"
    (scrolled)="onScroll()"
    [scrollWindow]="false"  style="height:calc(100vh - 80px);">

  <mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Name Column -->
    <ng-container *ngIf="!isMobile()" matColumnDef="name">
      <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
    </ng-container>

    <!-- Surname Column -->
    <ng-container *ngIf="!isMobile()" matColumnDef="surname">
      <mat-header-cell *matHeaderCellDef> Apellidos </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.surname}} </mat-cell>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef> Email </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.email}} </mat-cell>
    </ng-container>

    <!-- Document Column -->
    <ng-container *ngIf="!isMobile()" matColumnDef="document">
      <mat-header-cell *matHeaderCellDef> DNI/NIE </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.document}} </mat-cell>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>  </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button  mat-icon-button (click)="editUser(element)"><mat-icon>create</mat-icon></button>
        <button  mat-icon-button (click)="showSure(element.email)"><mat-icon>delete</mat-icon></button>
        <button  mat-icon-button (click)="permissionUser(element)"><mat-icon>lock</mat-icon></button>
      </mat-cell>
    </ng-container>
    <div *ngIf="!isMobile()">
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </div>
    <div  *ngIf="isMobile()">
      <mat-header-row *matHeaderRowDef="displayedMobileColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedMobileColumns;"></mat-row>
    </div>
  </mat-table>
</div>
