<mat-toolbar class="tedi-toolbar">
  <span>
    <img *ngIf="!isMobile() && isParent()" class="aon-logo" (click)="home()" [src]="logo"  width="240px" />
    <img *ngIf="!isMobile() && !isParent()" class="aon-logo" (click)="home()" [src]="logoCompany"  width="135px" />
    <img *ngIf="!isMobile() && !isParent()" class="aon-parent-logo" (click)="home()" [src]="getCompanyParentLogo()"/>
    <img *ngIf="isMobile() && !mobileSearching" style="cursor: pointer;margin-top: 10px;margin-left: 10px;" (click)="home()" [src]="logoMobile"  height="30px" />
  </span>

  <!-- <span *ngIf="!isMobile() && isParent()" class="search-panel">
    <app-search-box> </app-search-box>
  </span> -->

  <span *ngIf="isMobile() && mobileSearching">
    <button mat-icon-button (click)="closeSearch()"><mat-icon>arrow_back</mat-icon></button>
  </span>

  <span *ngIf="isMobile() && mobileSearching">
    <app-mobile-search-box> </app-mobile-search-box>
  </span>


  <span *ngIf="!isMobile() && !mobileSearching" class="tedi-right140">
    <img *ngIf="!isMobile() && !isParent()" class="aon-company-logo" (click)="home()" [src]="getCompanyLogo()" />
  </span>

  <span *ngIf="isParent()" [ngClass]="{'aon-border-bottom' : searching }" class="tedi-right100">
    <button mat-icon-button (click)="search()">
      <mat-icon>search</mat-icon>
    </button>
    <app-mobile-search-box *ngIf="searching"> </app-mobile-search-box>
  </span>

  <span *ngIf="!isParent() && !mobileSearching" class="tedi-right100">
    <button mat-icon-button (click)="company()" title="Selección de Empresa">
      <mat-icon>business</mat-icon>
    </button>
  </span>

  <span *ngIf="!mobileSearching" class="tedi-right60">
    <button mat-icon-button  (click)="apps()" title="Aplicaciones">
      <mat-icon>apps</mat-icon>
    </button>
  </span>

  <span *ngIf="!mobileSearching" class="tedi-right20" >
    <button mat-icon-button (click)="openDialog()" [title]="getUserEmail()">
      <mat-icon>account_circle</mat-icon>
    </button>
  </span>
</mat-toolbar>

<div style="border-bottom: 1px solid #ddd; height: 25px; background-color: white;">
  <span class="tedi-company-name">
    <span>{{getCompanyName()}}</span>
  </span>
  <span *ngIf="!isParent()" class="aon-second-button tedi-right100">
    <button mat-icon-button (click)="home()">
      <mat-icon>home</mat-icon>
    </button>
  </span>
  <span id="showMenuButton" *ngIf="!isParent()" class="aon-show-menu-button" style="padding-right: 20px;">
    <button mat-icon-button (click)="showMenu()">
      <mat-icon>{{showMenuIcon}}</mat-icon>
    </button>
  </span>
<div>
