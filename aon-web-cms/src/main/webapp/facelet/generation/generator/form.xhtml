<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="generatorForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_generate}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_editing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="generate"
							value="#{appBundle.aon_generate}" 
							reRender="generatorForm"
							actionListener="#{generatorApplication.onGenerate}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick" 
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid" 
								onclick="javascript:Richfaces.showModalPanel('gen_log',{width:1000, top:50});" />
						</aon:commandButton>
						<aon:commandButton id="publish_ok"
							value="#{appBundle.aon_publish}" 
							reRender="generatorForm"
							rendered="#{generator_status.generated}"
							actionListener="#{generator_status.onPublish}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick" 
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid" 
								onclick="javascript:Richfaces.showModalPanel('gen_log',{width:1000, top:50});" />
						</aon:commandButton>
						<!-- 
						<aon:commandButton id="publish_preview_ok"
							value="#{appBundle.aon_publish} PREVIEW" 
							reRender="generatorForm"
							rendered="#{generator_status.generated}"
							actionListener="#{generator_status.onPublishPreview}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick" 
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid" 
								onclick="javascript:Richfaces.showModalPanel('gen_log',{width:1000, top:50});" />
						</aon:commandButton>
						<h:outputLink 
							id="preview_url"
							rendered="#{generator_status.generated}"
							value="#{generator_status.previewURL}" 
							target="_blank"
							style="line-height:18px;">
							PREVIEW
						</h:outputLink>
						 -->
						<h:outputLink 
							id="web_url"
							rendered="#{generator_status.published}"
							value="#{generator_status.webURL}" 
							target="_blank"
							style="line-height:18px;">
							WEB
						</h:outputLink>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml">
			<ui:param name="modalPanelName" value="gen_log" />
		</ui:include>

	</ui:define>
</ui:composition>

</body>
</html>
