<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="cmsMenu">
		<aon:menuBar>
			<a4j:outputPanel styleClass="aon-float-right" ajaxRendered="true">
				<aon:panelGrid id="aon_language_panelGrid">
					<a4j:repeat id="languageSelection" value="#{i18n.languageList}" var="column">
						<aon:commandButton id="changeLanguage" 
							actionListener="#{i18n.onChangeLanguage}" styleClass="aon-noborder"
							rendered="#{i18n.currentLanguage.id != column.id}" style="padding:3px"
							image="/images/flags/#{column.language.locale.language}_off.gif"/>
						<aon:graphicImage id="changeLanguage_on" styleClass="aon-noborder"
							rendered="#{i18n.currentLanguage.id == column.id}" style="padding:3px"
							url="/images/flags/#{column.language.locale.language}_on.gif">
						</aon:graphicImage> 
					</a4j:repeat>
				</aon:panelGrid>
			</a4j:outputPanel>
			<aon:dropDownMenu value="#{menuBundle.cms_configuration}" rendered="#{cms.roleDesigner}">
				<aon:menuItem value="#{menuBundle.cms_language}" 
					rendered="#{cms.roleDesigner}"
					actionListener="#{language.onReset}" action="language_list" />
				<aon:menuItem value="#{menuBundle.cms_config}" 
					rendered="#{cms.roleDesigner}"
					actionListener="#{config.onInit}" action="config_form"/>
			</aon:dropDownMenu>
			<aon:dropDownMenu id="structure"
				value="#{menuBundle.cms_structure}"
				rendered="#{cms.roleDesigner or cms.roleEditor}">
				<aon:menuItem id="menu" value="#{menuBundle.cms_menu}"
					rendered="#{cms.roleDesigner or cms.roleEditor}"
					action="menu_list"
					actionListener="#{menu.onSearch}"/>
				<aon:menuItem id="header" value="#{menuBundle.cms_header}"
					rendered="#{cms.roleDesigner}"
					action="header_list"
					actionListener="#{headers.onSearch}"/>
				<aon:menuItem id="footer" value="#{menuBundle.cms_footer}"
					rendered="#{cms.roleDesigner}"
					action="footer_list"
					actionListener="#{footer.onSearch}"/>
				<aon:menuItem id="sidebar" value="#{menuBundle.cms_sidebar}"
					rendered="#{cms.roleDesigner}"
					action="sidebar_list"
					actionListener="#{sidebar.onSearch}"/>
				<aon:menuItem id="section" value="#{menuBundle.cms_section}"
					rendered="#{cms.roleDesigner}"
					action="section_list"
					actionListener="#{section.onSearch}"/>							
			</aon:dropDownMenu>
			<aon:dropDownMenu id="galleries"
			value="#{menuBundle.cms_galleries}"
				rendered="#{cms.roleEditor}">
				<aon:menuItem id="image_gallery" 
					rendered="#{cms.roleEditor}"
					value="#{menuBundle.cms_image_gallery}"
					action="gallery_list"/>
				<aon:menuItem id="document_gallery" 
					rendered="#{cms.roleEditor}"
					value="#{menuBundle.cms_document_gallery}"
					action="document_list"/>
			</aon:dropDownMenu>
			<aon:dropDownMenu id="content"
				value="#{menuBundle.cms_content}"
				rendered="#{cms.roleEditor or cms.roleRevisor}" >
				<aon:menuItem id="link" value="#{menuBundle.cms_link}"
					rendered="#{domainUtils.linkMenu and ( cms.roleEditor or cms.roleRevisor )}"
					action="link_list"
					actionListener="#{link.onSearch}" />
				<aon:menuItem id="faq" value="#{menuBundle.cms_faq}"
					rendered="#{domainUtils.faqMenu and ( cms.roleEditor or cms.roleRevisor )}"
					actionListener="#{faq.onSearch}" 
					action="faq_list"/>
				<aon:menuItem id="download" 
					value="#{menuBundle.cms_download}"
					rendered="#{domainUtils.downloadMenu and ( cms.roleEditor or cms.roleRevisor )}"
					action="download_list"
					actionListener="#{download.onSearch}" />
				<aon:menuItem id="album" 
					value="#{menuBundle.cms_album}"
					rendered="#{domainUtils.albumMenu and ( cms.roleEditor or cms.roleRevisor )}"
					action="album_list"
					actionListener="#{album.onSearch}" />
				<aon:menuItem id="album_image" 
					value="#{menuBundle.cms_album_image}"
					rendered="#{domainUtils.albumMenu and ( cms.roleEditor or cms.roleRevisor )}"
					action="album_image_form"
					actionListener="#{albumImage.onReset}" />
				<aon:menuItem id="banner" 
					value="#{menuBundle.cms_banner}"
					rendered="#{domainUtils.bannerMenu and ( cms.roleEditor or cms.roleRevisor )}"
					actionListener="#{banner.onSearch}" 
					action="banner_list"/>
				<aon:menuItem id="direct_access" 
					value="#{menuBundle.cms_direct_access}"
					rendered="#{domainUtils.directAccessMenu and ( cms.roleEditor or cms.roleRevisor )}"
					actionListener="#{direct_access.onSearch}" 
					action="direct_access_list"/>
				<aon:menuItem id="article" 
					value="#{menuBundle.cms_article}"
					rendered="#{domainUtils.articleMenu and ( cms.roleEditor or cms.roleRevisor )}"
					actionListener="#{article.onSearch}" 
					action="article_list"/>
				<aon:menuItem id="modular_page" 
					value="#{menuBundle.cms_modular_page}"
					rendered="#{domainUtils.modularMenu and ( cms.roleEditor or cms.roleRevisor )}"
					action="modular_page_list"
					actionListener="#{modular_page.onSearch}"/>
				<aon:menuItem id="generic_page" 
					value="#{menuBundle.cms_generic_page}"
					rendered="#{domainUtils.genericPageMenu and ( cms.roleEditor or cms.roleRevisor )}"
					actionListener="#{generic_page.onSearch}" 
					action="generic_page_list"/>
				<aon:menuItem id="company" 
					rendered="#{domainUtils.activityMenu and ( cms.roleEditor or cms.roleRevisor )}"
					value="#{menuBundle.cms_company}"
					actionListener="#{company.onSearch}" 
					action="company_list"/>
				<aon:menuItem id="product" 
					value="#{menuBundle.cms_product}"
					rendered="#{domainUtils.productMenu and ( cms.roleEditor or cms.roleRevisor )}"
					actionListener="#{product.onSearch}" 
					action="product_list"/>
			</aon:dropDownMenu>
			<aon:dropDownMenu id="hiru"
				value="#{menuBundle.cms_hiru}"
				rendered="#{domainUtils.hiruMenu and ( cms.roleEditor or cms.roleRevisor or cms.rolePublisher)}">
				<aon:menuItem id="hiru_organizer_centre" value="#{menuBundle.cms_hiru_organizer_centre}"
					rendered="#{cms.roleEditor or cms.roleRevisor}"
					action="hiru_organizer_centre_list"
					actionListener="#{hiru_organizer_centre.onInit}"/>
				<aon:menuItem id="hiru_course" value="#{menuBundle.cms_hiru_course}"
					rendered="#{cms.roleEditor or cms.roleRevisor}"
					action="hiru_course_list"
					actionListener="#{hiru_course.onSearch}"/>
				<aon:menuItem id="hiru_generator" value="#{menuBundle.cms_hiru_generator}"
					rendered="#{cms.roleEditor or cms.rolePublisher}"
					action="hiru_generator"
					actionListener="#{hiru_generator.onInit}"/>
			</aon:dropDownMenu>
			<aon:dropDownMenu id="bulletins"
				value="#{menuBundle.cms_bulletins}"
				rendered="#{domainUtils.bulletinMenu and ( cms.roleEditor or cms.roleRevisor or cms.rolePublisher)}">
				<aon:menuItem id="bulletin" 
					rendered="#{cms.roleEditor or cms.roleRevisor}"
					value="#{menuBundle.cms_bulletin}"
					action="bulletin_list"
					actionListener="#{bulletin.onSearch}" />
				<aon:menuItem id="bulletin_emails" 
					rendered="#{cms.roleEditor or cms.roleRevisor}"
					value="#{menuBundle.cms_bulletin_emails}"
					action="bulletin_email_list"
					actionListener="#{bulletin_email.onSearch}" />
				<aon:menuItem id="bulletin_send" 
					rendered="#{cms.roleEditor or cms.rolePublisher}" 
					value="#{menuBundle.cms_bulletin_send}"
					action="bulletin_send_list"
					actionListener="#{bulletin.onInit}" />
			</aon:dropDownMenu>
			<aon:dropDownMenu id="sport"
				value="#{menuBundle.cms_sport}"
				rendered="#{domainUtils.sportMenu and ( cms.roleEditor or cms.roleRevisor )}" >
				<aon:menuItem id="sport_category" value="#{menuBundle.cms_sport_category}"
					action="sport_category_list"
					actionListener="#{sport_category.onSearch}"/>
				<aon:menuItem id="sport_club" value="#{menuBundle.cms_sport_club}"
					action="sport_club_list"
					actionListener="#{sport_club.onSearch}"/>
				<aon:menuItem id="sport_position" value="#{menuBundle.cms_sport_position}"
					action="sport_position_list"
					actionListener="#{sport_position.onSearch}"/>
				<aon:menuItem id="sport_nationality" value="#{menuBundle.cms_sport_nationality}"
					action="sport_natiolity_list"
					actionListener="#{sport_nationality.onSearch}"/>
				<aon:menuItem id="sport_player" value="#{menuBundle.cms_sport_player}"
					action="sport_player_list"
					actionListener="#{sport_player.onSearch}"/>
				<aon:menuItem id="sport_coach" value="#{menuBundle.cms_sport_coach}"
					action="sport_coach_list"
					actionListener="#{sport_coach.onSearch}"/>
				<aon:menuItem id="sport_config" value="#{menuBundle.cms_sport_config}"
					action="sport_config_list"
					actionListener="#{sport_config.onInit}"/>
			</aon:dropDownMenu>
			<aon:dropDownMenu id="production"
				value="#{menuBundle.cms_production}"
				rendered="#{cms.roleEditor or cms.rolePublisher or cms.roleDesigner}">
				<aon:menuItem id="template" value="#{menuBundle.cms_template}"
					rendered="#{cms.roleDesigner}"
					action="template_list" actionListener="#{template.onInit}" />
				<aon:menuItem id="generator" value="#{menuBundle.cms_generate_pages}"
					rendered="#{cms.roleEditor or cms.rolePublisher}"
					action="generator_form"
					actionListener="#{generator_status.onInit}"/>
			</aon:dropDownMenu>
			<a4j:outputPanel styleClass="aon-float-right" rendered="#{!cms.administrator}">
				<aon:commandLink 
					value="| #{appBundle.aon_advanced_mode}" immediate="true"
					style="border-right:0;" action="admin_form" />
			</a4j:outputPanel>
		</aon:menuBar>

	</aon:form>
			
</ui:composition>
