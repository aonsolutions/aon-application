<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:panelGroup>
		<aon:div>
			<aon:panelGroup>
				<!-- main menu declaration  -->
				<aon:form>
					<aon:menuBar id="menu_bar">
						<aon:dropDownMenu id="configuration"
							value="#{menuBundle.cms_configuration}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="language" value="#{menuBundle.cms_language}" 
								actionListener="#{language.onReset}" action="language_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="config" value="#{menuBundle.cms_config}" 
								actionListener="#{config.onInit}" action="config_form"
								styleClass="aon-main-menu-leaf"/>
						</aon:dropDownMenu>
						<aon:dropDownMenu id="structure"
							value="#{menuBundle.cms_structure}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="menu" value="#{menuBundle.cms_menu}"
								action="menu_list"
								actionListener="#{menu.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="header" value="#{menuBundle.cms_header}"
								action="header_list"
								actionListener="#{headers.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="footer" value="#{menuBundle.cms_footer}"
								action="footer_list"
								actionListener="#{footer.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="sidebar" value="#{menuBundle.cms_sidebar}"
								action="sidebar_list"
								actionListener="#{sidebar.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="section" value="#{menuBundle.cms_section}"
								action="section_list"
								actionListener="#{section.onSearch}"
								styleClass="aon-main-menu-leaf"/>							
						</aon:dropDownMenu>
						<aon:dropDownMenu id="galleries"
							value="#{menuBundle.cms_galleries}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="image_gallery" 
								value="#{menuBundle.cms_image_gallery}"
								action="gallery_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="document_gallery" 
								value="#{menuBundle.cms_document_gallery}"
								action="document_list"
								styleClass="aon-main-menu-leaf"/>
						</aon:dropDownMenu>
						<aon:dropDownMenu id="content"
							value="#{menuBundle.cms_content}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="modular_page" value="#{menuBundle.cms_modular_page}"
								action="modular_page_list"
								actionListener="#{modular_page.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="generic_page" value="#{menuBundle.cms_generic_page}"
								actionListener="#{generic_page.onSearch}" 
								action="generic_page_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="link_category" value="#{menuBundle.cms_link_category}"
								actionListener="#{link_category.onInit}" 
								action="link_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="faq_category" value="#{menuBundle.cms_faq_category}"
								actionListener="#{faq_category.onInit}" 
								action="faq_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="article_category" value="#{menuBundle.cms_article_category}"
								actionListener="#{article_category.onInit}" 
								action="article_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="banner_category" value="#{menuBundle.cms_banner_category}"
								actionListener="#{banner_category.onSearch}" 
								action="banner_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="download_category" value="#{menuBundle.cms_download_category}"
								actionListener="#{download_category.onInit}" 
								action="download_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="album_category" value="#{menuBundle.cms_album_category}"
								actionListener="#{album_category.onInit}" 
								action="album_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="direct_access_group_page" value="#{menuBundle.cms_direct_access_group}"
								actionListener="#{direct_access_group.onSearch}" 
								action="direct_access_group_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="activity" 
								value="#{menuBundle.cms_activity}"
								actionListener="#{activity.onSearch}" 
								action="activity_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="company" 
								value="#{menuBundle.cms_company}"
								actionListener="#{company.onSearch}" 
								action="company_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="diary" 
								value="#{menuBundle.cms_diary}"
								actionListener="#{diary.onInit}" 
								action="diary_form"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="productCategory" 
								value="#{menuBundle.cms_product_category}"
								actionListener="#{productCategory.onSearch}" 
								action="product_category_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="brand" value="#{menuBundle.cms_brand}"
								actionListener="#{brand.onSearch}" 
								action="brand_list"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="product" value="#{menuBundle.cms_product}"
								actionListener="#{product.onReset}" action="product_list"
								styleClass="aon-main-menu-leaf"/>
						</aon:dropDownMenu>
						<aon:dropDownMenu id="hiru"
							value="#{menuBundle.cms_hiru}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="hiru_organizer_centre" value="#{menuBundle.cms_hiru_organizer_centre}"
								action="hiru_organizer_centre_list"
								actionListener="#{hiru_organizer_centre.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="hiru_course" value="#{menuBundle.cms_hiru_course}"
								action="hiru_course_list"
								actionListener="#{hiru_course.onSearch}"
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="hiru_generator" value="#{menuBundle.cms_hiru_generator}"
								action="hiru_generator"
								actionListener="#{hiru_generator.onInit}"
								styleClass="aon-main-menu-leaf"/>
						</aon:dropDownMenu>
						<aon:dropDownMenu id="bulletins"
							value="#{menuBundle.cms_bulletins}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="bulletin" 
								value="#{menuBundle.cms_bulletin}"
								action="bulletin_list"
								actionListener="#{bulletin.onSearch}" 
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="bulletin_emails" 
								value="#{menuBundle.cms_bulletin_emails}"
								action="bulletin_email_list"
								actionListener="#{bulletin_email.onSearch}" 
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="bulletin_send" 
								value="#{menuBundle.cms_bulletin_send}"
								action="bulletin_send_list"
								actionListener="#{bulletin.onInit}" 
								styleClass="aon-main-menu-leaf"/>
						</aon:dropDownMenu>
						<aon:dropDownMenu id="production"
							value="#{menuBundle.cms_production}" submitMode="ajax"
							event="onclick">
							<aon:menuItem id="template" value="#{menuBundle.cms_template}"
								action="template_list" actionListener="#{template.onInit}" 
								styleClass="aon-main-menu-leaf"/>
							<aon:menuItem id="generator" value="#{menuBundle.cms_generate_pages}"
								action="generator_form"
								actionListener="#{generator_status.onInit}"
								styleClass="aon-main-menu-leaf"/>
						</aon:dropDownMenu>
					</aon:menuBar>
				</aon:form>
			</aon:panelGroup>
		</aon:div>
	</aon:panelGroup>
			
</ui:composition>

</body>
</html>
