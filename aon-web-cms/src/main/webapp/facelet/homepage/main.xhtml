<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
	<aon:form id="main_form">
		<rich:panel styleClass="aon-content-home">
			<h:panelGrid columns="2">
			
		        <rich:panel rendered="#{cms.roleDesigner or cms.roleEditor}" style="width:600px;height:125px">
		            <f:facet name="header">
		                <aon:outputText value="#{appBundle.cms_home_menu}"/>
		            </f:facet>
					<h:panelGrid columns="1"  styleClass="aon-text-center" style="width:100%">
						<aon:commandButton id="cms-icon-menu"
							rendered="#{cms.roleDesigner or cms.roleEditor}"
							value="#{menuBundle.cms_menu}"
							image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-menu.png']}"
							styleClass="aon-icon-commandButton" 
							action="menu_list">
							<aon:actionListener method="#{menu.onSearch}" />
						</aon:commandButton> 
		                <aon:outputText value="#{menuBundle.cms_menu}"
		                	rendered="#{cms.roleDesigner or cms.roleEditor}"/>
					</h:panelGrid>
		        </rich:panel>

		        <rich:panel rendered="#{cms.roleEditor or cms.rolePublisher}" style="width:200px;height:125px" >
		            <f:facet name="header">
		                <aon:outputText value="#{appBundle.cms_home_generator}"/>
		            </f:facet>
					<h:panelGrid columns="1" styleClass="aon-text-center" style="width:100%">
						<aon:commandButton id="cms-icon-generator"
							rendered="#{cms.roleEditor or cms.rolePublisher}"
							value="#{menuBundle.cms_generate_pages}"
							image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-generator.png']}"
							styleClass="aon-icon-commandButton" 
							action="generator_form">
							<aon:actionListener method="#{generator_status.onInit}" />
						</aon:commandButton>
		                <aon:outputText value="#{menuBundle.cms_generate_pages}"
		                	rendered="#{cms.roleEditor or cms.rolePublisher}"/>
					</h:panelGrid> 
		        </rich:panel>
		
		        <rich:panel rendered="#{cms.roleEditor or cms.roleRevisor}" style="width:600px;height:250px">
		            <f:facet name="header">
		                <aon:outputText value="#{appBundle.cms_home_contents}"/>
		            </f:facet>
					<h:panelGrid columns="4" styleClass="aon-text-center" style="width:100%">
						<h:panelGrid columns="1"  
							rendered="#{domainUtils.articleMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-news"
								value="#{menuBundle.cms_article}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-news.png']}"
								styleClass="aon-icon-commandButton" 
								action="article_list">
								<aon:actionListener method="#{article.onSearch}" />
							</aon:commandButton>
			                <aon:outputText value="#{menuBundle.cms_article}"/>
			            </h:panelGrid>

						<h:panelGrid columns="1"  
							rendered="#{domainUtils.linkMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-links"
								value="#{menuBundle.cms_link}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-links.png']}"
								styleClass="aon-icon-commandButton" 
								action="link_list">
								<aon:actionListener method="#{link.onSearch}" />
							</aon:commandButton>
			                <aon:outputText value="#{menuBundle.cms_link}"/>
			            </h:panelGrid>

						<h:panelGrid columns="1"  
							rendered="#{domainUtils.faqMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-faq"
								value="#{menuBundle.cms_faq}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-faq.png']}"
								styleClass="aon-icon-commandButton" 
								action="faq_list">
								<aon:actionListener method="#{faq.onSearch}" />
							</aon:commandButton> 
			                <aon:outputText value="#{menuBundle.cms_faq}"/>
			            </h:panelGrid>

						<h:panelGrid columns="1"  
							rendered="#{domainUtils.genericPageMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-generic-page"
								value="#{menuBundle.cms_generic_page}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-generica.png']}"
								styleClass="aon-icon-commandButton" 
								action="generic_page_list">
								<aon:actionListener method="#{generic_page.onSearch}" />
							</aon:commandButton> 
			                <aon:outputText value="#{menuBundle.cms_generic_page}"/>
			            </h:panelGrid>
					</h:panelGrid>
					<h:panelGrid columns="4" styleClass="aon-text-center" style="width:100%">
						<h:panelGrid columns="1"  
							rendered="#{domainUtils.modularMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-modular"
								value="#{menuBundle.cms_modular_page}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-modular.png']}"
								styleClass="aon-icon-commandButton" 
								action="modular_page_list">
								<aon:actionListener method="#{modular_page.onSearch}" />
							</aon:commandButton> 
			                <aon:outputText value="#{menuBundle.cms_modular_page}"/>
			            </h:panelGrid>

						<h:panelGrid columns="1"  
							rendered="#{domainUtils.downloadMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-document-download"
								value="#{menuBundle.cms_download}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-document-download.png']}"
								styleClass="aon-icon-commandButton" 
								action="download_list">
								<aon:actionListener method="#{download.onSearch}" />
							</aon:commandButton>
			                <aon:outputText value="#{menuBundle.cms_download}"/>
			            </h:panelGrid>

						<h:panelGrid columns="1"  
							rendered="#{domainUtils.albumMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-album"
								value="#{menuBundle.cms_album}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-album-list.png']}"
								styleClass="aon-icon-commandButton" 
								action="album_list">
								<aon:actionListener method="#{album.onSearch}" />
							</aon:commandButton> 
			                <aon:outputText value="#{menuBundle.cms_album}"/>
			            </h:panelGrid>

						<h:panelGrid columns="1"  
							rendered="#{domainUtils.albumMenu and ( cms.roleEditor or cms.roleRevisor )}">
							<aon:commandButton id="cms-icon-album_image"
								value="#{menuBundle.cms_album_image}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-album.png']}"
								styleClass="aon-icon-commandButton" 
								action="album_image_form">
								<aon:actionListener method="#{albumImage.onReset}" />
							</aon:commandButton>
			                <aon:outputText value="#{menuBundle.cms_album_image}"/>
			            </h:panelGrid>
					</h:panelGrid>
		        </rich:panel>
		        
		        <rich:panel rendered="#{cms.roleEditor}" style="width:200px;height:250px">
		            <f:facet name="header">
		                <aon:outputText value="#{appBundle.cms_home_galleries}"/>
		            </f:facet>
					<h:panelGrid columns="1" styleClass="aon-text-center" style="width:100%">
						<h:panelGrid columns="1"  
							rendered="#{cms.roleEditor}">
							<aon:commandButton id="cms-document-upload"
								value="#{menuBundle.cms_document_gallery}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-document-upload.png']}"
								styleClass="aon-icon-commandButton" 
								action="document_list">
							</aon:commandButton> 
			                <aon:outputText value="#{menuBundle.cms_document_gallery}"/>
			            </h:panelGrid>
						<h:panelGrid columns="1"  
							rendered="#{cms.roleEditor}">
							<aon:commandButton id="cms-icon-image-upload"
								value="#{menuBundle.cms_image_gallery}"
								image="#{aonResource.resolveLocal['/images/cms/icons/cms-icon-image-upload.png']}"
								styleClass="aon-icon-commandButton" 
								action="gallery_list">
							</aon:commandButton> 
			                <aon:outputText value="#{menuBundle.cms_image_gallery}"/>
			            </h:panelGrid>
					</h:panelGrid>
		        </rich:panel>
		        
			</h:panelGrid>
		</rich:panel>
	</aon:form>	

	</ui:define>
</ui:composition>
