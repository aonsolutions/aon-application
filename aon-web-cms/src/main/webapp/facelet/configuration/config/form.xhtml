<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="configForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.config}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{config.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							actionListener="#{config.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept" />
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">

					<aon:panelTabSet id="configTabSet">
						<aon:panelTab id="general" label="#{appBundle.aon_content}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="Config_sitename"
									value="#{appBundle.config_sitename}" />
								<aon:inputText id="Config_sitename"
									required="true" size="75" maxlength="75"
									value="#{config.toI18n.sitename}" />
	
								<aon:outputLabel for="ConfigDetail_description"
									value="#{bundle.aon_description}" />
								<aon:inputTextarea id="ConfigDetail_description"
									cols="60" rows="20" 
									value="#{config.toI18n.description}"/>	
							</aon:panelGrid>
						</aon:panelTab>
						<aon:panelTab id="css" label="#{appBundle.config_css}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="Config_css"
									value="#{appBundle.config_css}" />
								<aon:inputTextarea id="Config_css"
									cols="60" rows="20" 
									value="#{config.toI18n.css}"/>
							</aon:panelGrid>
						</aon:panelTab>
						<aon:panelTab id="js" label="#{appBundle.config_javascript}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="Config_javascript"
									value="#{appBundle.config_javascript}" />
								<aon:inputTextarea id="Config_javascript"
									cols="60" rows="20" 
									value="#{config.toI18n.javascript}"/>
							</aon:panelGrid>
						</aon:panelTab>
						<aon:panelTab id="words" label="#{appBundle.config_keywords}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="ConfigDetail_keywords"
									value="#{appBundle.config_keywords}" />
								<aon:inputTextarea id="ConfigDetail_keywords"
									cols="60" rows="20" 
									value="#{config.toI18n.keywords}"/>
							</aon:panelGrid>
						</aon:panelTab>
						<aon:panelTab id="offline" label="#{appBundle.config_offline_message}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="ConfigDetail_offline_message"
									value="#{appBundle.config_offline_message}" />
								<aon:div style="width:600px">
									<aon:inputRichText id="ConfigDetail_offline_message"
										toolbarSet="Default" 
										value="#{config.toI18n.offline_message}"/>
								</aon:div>
							</aon:panelGrid>
						</aon:panelTab>
						<aon:panelTab id="smtp" label="#{appBundle.config_smtp_server}" rendered="#{cms.administrator}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="Config_smtp_server"
									value="#{appBundle.config_smtp_server}" />
								<aon:inputText id="Config_smtp_server"
									required="true" size="60" maxlength="128"
									value="#{config.to.smtp_server}" />

								<aon:outputLabel for="Config_smtp_user"
									value="#{appBundle.config_smtp_user}" />
								<aon:inputText id="Config_smtp_user"
									required="true" size="20" maxlength="32"
									value="#{config.to.smtp_user}" />

								<aon:outputLabel for="Config_smtp_password"
									value="#{appBundle.config_smtp_password}" />
								<aon:inputText id="Config_smtp_password"
									required="true" size="20" maxlength="32"
									value="#{config.to.smtp_password}" />

								<aon:outputLabel for="Config_from_name"
									value="#{appBundle.config_from_name}" />
								<aon:inputText id="Config_from_name"
									required="true" size="32" maxlength="64"
									value="#{config.to.from_name}" />

								<aon:outputLabel for="Config_from_email"
									value="#{appBundle.config_from_email}" />
								<aon:inputText id="Config_from_email"
									required="true" size="75" maxlength="128"
									value="#{config.to.from_email}" />
							</aon:panelGrid>
						</aon:panelTab>
						<aon:panelTab id="ftp" label="#{appBundle.config_ftp_server}" rendered="#{cms.administrator}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="Config_ftp_server"
									value="#{appBundle.config_ftp_server}" />
								<aon:inputText id="Config_ftp_server"
									required="true" size="60" maxlength="128"
									value="#{config.to.ftp_server}" />

								<aon:outputLabel for="Config_ftp_user"
									value="#{appBundle.config_ftp_user}" />
								<aon:inputText id="Config_ftp_user"
									required="true" size="20" maxlength="32"
									value="#{config.to.ftp_user}" />

								<aon:outputLabel for="Config_ftp_password"
									value="#{appBundle.config_ftp_password}" />
								<aon:inputText id="Config_ftp_password"
									required="true" size="20" maxlength="32"
									value="#{config.to.ftp_password}" />

								<aon:outputLabel for="Config_ftp_path"
									value="#{appBundle.config_ftp_path}" />
								<aon:inputText id="Config_ftp_path"
									required="true" size="75" maxlength="128"
									value="#{config.to.ftp_path}" />
							</aon:panelGrid>
						</aon:panelTab>
					</aon:panelTabSet>

			</aon:div>
			
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
