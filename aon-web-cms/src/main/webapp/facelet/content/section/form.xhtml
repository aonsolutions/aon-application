<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sectionForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.section}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{headers.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="section_form"
							rendered="#{!section.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" >
							<aon:actionListener method="#{section.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							action="section_form"
							value="#{bundle.aon_save}" rendered="#{section.to!=null or section.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{section.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!section.new and !section.to.default_}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{section.onRemove}" confirmAction="section_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="section_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{section.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
	
					<aon:panelTabSet id="menuTabSet">

						<aon:panelTab id="content" label="CONTENIDO">
							<aon:panelGrid columns="2" dir="true">
							
								<aon:outputLabel for="section_alias" style="width:100px"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.cms_alias}" />
								<aon:inputText id="section_alias"
									styleClass="aon-form-input-text aon-form-input-text-number"
									required="true" size="32" maxlength="32"
									value="#{section.to.alias}">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
	
								<aon:outputLabel for="section_header"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_header}" />
								<aon:div>
									<aon:selectOneMenu id="section_header" 
										styleClass="aon-form-selectOneMenu-field"
										value="#{section.to.header.id}">
										<f:selectItem itemLabel="-" itemValue="-1" />
										<f:selectItems value="#{collections.headerList}" />
									</aon:selectOneMenu> 
								</aon:div>
	
								<aon:outputLabel for="section_footer"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_footer}" />
								<aon:div>
									<aon:selectOneMenu id="section_footer" 
										styleClass="aon-form-selectOneMenu-field"
										value="#{section.to.footer.id}">
										<f:selectItem itemLabel="-" itemValue="-1" />
										<f:selectItems value="#{collections.footerList}" />
									</aon:selectOneMenu> 
								</aon:div>
	
								<aon:outputLabel for="section_sidebar"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_sidebar}" />
								<aon:div>
									<aon:selectOneMenu id="section_sidebar" 
										styleClass="aon-form-selectOneMenu-field"
										value="#{section.to.sidebar.id}">
										<f:selectItem itemLabel="-" itemValue="-1" />
										<f:selectItems value="#{collections.sidebarList}" />
									</aon:selectOneMenu> 
								</aon:div>
	
								<aon:outputLabel for="section_menu"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_menu}"/>
								<aon:div>
									<aon:selectOneMenu id="section_menu"  
										styleClass="aon-form-selectOneMenu-field"
										value="#{section.to.menu.id}">
										<f:selectItem itemLabel="-" itemValue="-1" />
										<f:selectItems value="#{collections.menuSideList}" />
									</aon:selectOneMenu> 
								</aon:div>
	
								<aon:outputLabel for="section_menu_alt"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_menu_alt}"/>
								<aon:div>
									<aon:selectOneMenu id="section_menu_alt"  
										styleClass="aon-form-selectOneMenu-field"
										value="#{section.to.menu_alt.id}">
										<f:selectItem itemLabel="-" itemValue="-1" />
										<f:selectItems value="#{collections.menuInnerList}" />
									</aon:selectOneMenu> 
								</aon:div>
								
								<aon:outputLabel for="Section_parent_"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_parent}"/>
								<aon:div>
									<aon:selectOneMenu id="Section_parent_"  
										styleClass="aon-form-selectOneMenu-field"
										value="#{section.to.parent_.id}">
										<f:selectItem itemLabel="-" itemValue="-1" />
										<f:selectItems value="#{collections.availableParentSectionList}" />
									</aon:selectOneMenu>
									<aon:outputLabel for="parent_sidebar_left"
										styleClass="aon-form-input-text-label"
										value="#{appBundle.section_parent_sidebar_left}" />
									<aon:selectBooleanCheckbox id="parent_sidebar_left" 
										value="#{section.to.parent_sidebar_left}" />
									<aon:outputLabel for="parent_sidebar_right"
										styleClass="aon-form-input-text-label"
										value="#{appBundle.section_parent_sidebar_right}" />
									<aon:selectBooleanCheckbox id="parent_sidebar_right" 
										value="#{section.to.parent_sidebar_right}" />
								</aon:div>

						</aon:panelGrid>
					</aon:panelTab>

					<aon:panelTab id="visual" label="VISUALIZADO">
						<aon:panelGrid columns="2" dir="true">
							
							<aon:outputLabel for="section_header_selected"
								styleClass="aon-form-input-text-label"
								value="Visualizar Cabecera" />
							<aon:div>
								<aon:selectBooleanCheckbox id="section_header_selected" 
									value="#{section.to.show_header}" />
							</aon:div>

							<aon:outputLabel for="section_footer_selected"
								styleClass="aon-form-input-text-label"
								value="Visualizar Pie" />
							<aon:div>
								<aon:selectBooleanCheckbox id="section_footer_selected" 
									value="#{section.to.show_footer}" />
							</aon:div>

							<aon:outputLabel for="section_sidebar_left_selected"
								styleClass="aon-form-input-text-label"
								value="Visualizar Laterales" />
							<aon:div>
								<aon:outputLabel for="section_sidebar_left_selected"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_sidebar_left_enabled}" />
								<aon:selectBooleanCheckbox id="section_sidebar_left_selected" 
									value="#{section.to.show_sidebar_left}" />
								<aon:outputLabel for="section_sidebar_right_selected"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.section_sidebar_right_enabled}" />
								<aon:selectBooleanCheckbox id="section_sidebar_right_selected" 
									value="#{section.to.show_sidebar_right}" />
							</aon:div>

							<aon:outputLabel for="section_menu_selected"
								styleClass="aon-form-input-text-label"
								value="Visualizar Menu Principal"/>
							<aon:div>
								<aon:selectBooleanCheckbox id="section_menu_selected" 
									value="#{section.to.show_menu}" />
							</aon:div>

							<aon:outputLabel for="section_menu_alt_selected"
								styleClass="aon-form-input-text-label"
								value="Visualizar Rastro de Migas"/>
							<aon:div>
								<aon:selectBooleanCheckbox id="section_menu_alt_selected" 
									value="#{section.to.show_menu_alt}" />
							</aon:div>
							
						</aon:panelGrid>
					</aon:panelTab>
				</aon:panelTabSet>
				
			</aon:div>
		</aon:div>
	</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
