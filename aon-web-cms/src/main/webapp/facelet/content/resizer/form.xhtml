<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>


<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<h:form>
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.resizer_resizer}"/>	  						
					</aon:div>					
					
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<h:commandButton id="resize"
							value="#{bundle.aon_accept}"
							action="gallery_list" 
							actionListener="#{resizer.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_accept}">
						</h:commandButton>
						<h:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="gallery_list" 
							actionListener="#{resizer.onCancel}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</h:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">

				<aon:panelGrid id="main_panel" columns="2" dir="true">

					<aon:outputLabel for="ratio"
						value="#{appBundle.resizer_ratio}"/>
					<aon:selectBooleanCheckbox id="ratio" 
						value="#{resizer.ratio}" />

					<aon:outputLabel for="width"
						value="#{appBundle.resizer_width}" />
					<rich:inputNumberSlider id="width" 
						value="#{resizer.width}" 
						width="500" 
						minValue="1" 
						maxValue="#{resizer.maxWidth}">
						<a4j:support 
							event="onchange" 
							actionListener="#{resizer.onChangeWidth}"
							reRender="main_panel" />
					</rich:inputNumberSlider>

					<aon:outputLabel for="height"
						value="#{appBundle.resizer_height}" />
					<rich:inputNumberSlider id="height" 
						value="#{resizer.height}" 
						width="500" 
						minValue="1" 
						maxValue="#{resizer.maxHeight}">
						<a4j:support 
							event="onchange" 
							actionListener="#{resizer.onChangeHeight}"
							reRender="main_panel" />
					</rich:inputNumberSlider>
					
					<aon:outputLabel value="#{resizer.resizeImage.name}" />
					<aon:graphicImage url="#{resizer.resizeImage.thumb}" alt="#{resizer.resizeImage}"/>
							            		
				</aon:panelGrid>
						
				</aon:div>
			</aon:div>
		</h:form>
	</ui:define>

</ui:composition>

</body>
</html>
