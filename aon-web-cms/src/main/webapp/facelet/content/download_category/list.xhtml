<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.download_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="download_category_form"
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{download_category.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="download_category_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{download_category.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{download_category.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="sectionGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
					
						<aon:outputLabel for="LinkCategory_section"
							value="#{appBundle.section}"/>
							
						<aon:selectOneMenu id="LinkCategory_section"  
							value="#{generator_config.sectionId}">
							<f:selectItem itemLabel="-" itemValue="-1" />
							<f:selectItems value="#{collections.sectionList}" />
						</aon:selectOneMenu>
						
						<aon:div styleClass="aon-finding-toolbar-item-group">					
							<aon:commandButton id="save"
								value="#{bundle.aon_save}"
								action="download_category_list" 
								styleClass="aon-finding-toolbar-item aon-icon-accept">
								<aon:actionListener method="#{generator_config.onSaveDownloadConfig}" />
							</aon:commandButton>
						</aon:div>		
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" rows="#{download_category.pageLimit}" var="to"
					value="#{download_category.model}" rendered="#{download_category.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-iconColumn">
			
					<aon:rowSelector
						action="download_category_form" actionListener="#{download_category.onSelect}" />			
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.download_category_label}" />
						</f:facet>
						<aon:outputText value="#{download_category.i18nLabel}"
							styleClass="aon-editDataTable-button"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText for="LinkCategory_position" 
								value="#{appBundle.download_category_position}" />
						</f:facet>
						<aon:outputText value="#{to.position}" styleClass="aon-editDataTable-button" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.download_category_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																																				
							<aon:commandLink title="#{appBundle.download_category_activate}" 
								action="download_category_list"
								actionListener="#{download_category.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="LinkCategory_active" alt="#{appBundle.download_category_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.download_category_deactivate}" 
								action="download_category_list"
								actionListener="#{download_category.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="LinkCategory_deactive" alt="#{appBundle.download_category_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
