<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.album_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{album_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="album_category_form"
							actionListener="#{album_category.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<h:commandButton id="save_new"
							value="#{bundle.aon_save}" 
							rendered="#{album_category.new}"
							action="album_category_form"
							actionListener="#{album_category.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<h:commandButton id="save_edit"
							value="#{bundle.aon_save}" 
							rendered="#{album_category.to!=null and !album_category.new}"
							actionListener="#{album_category.accept}"
							action="album_category_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!album_category.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{album_category.onRemove}"
							confirmAction="album_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="exit" value="#{bundle.aon_close}"
							action="album_category_list" 
							actionListener="#{album_category.onSearch}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
						<h:commandButton id="partial_generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{album_category.to!=null}"
							actionListener="#{generator.onGenerateCurrentAlbumCategory}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>										
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="AlbumCategory_alias" style="width:100px"
						value="#{appBundle.album_category_alias}" />
					<aon:inputText id="AlbumCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{album_category.to.alias}" />

					<aon:outputLabel for="AlbumCategory_label"
						value="#{appBundle.album_category_label}" />
					<aon:inputText id="AlbumCategory_label"
						required="true" size="50" maxlength="64"
						value="#{album_category.toI18n.label}" />

					<aon:outputLabel for="AlbumCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="AlbumCategory_section"  
						value="#{album_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
							
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!album_category.new and album_category.toI18n.id != null}">
				<f:facet name="header">#{appBundle.album}</f:facet>
				
				<aon:panelGrid styleClass="none" columnClasses="aon-vertical-align-top">
				
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<h:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!album.new}"
										action="album_form"
										actionListener="#{album.onReset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}"/>
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!album.checklistEmpty and album.to==null}" 
										immediate="#{true}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{album.onRemoveSelected}" 
										confirmAction="album_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>

						<aon:dataTable id="detail_list" value="#{album.model}" var="to"
							rows="#{album.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<f:facet name="header">
									<aon:div>
										&nbsp;
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox 
										value="#{album.rowChecked}">
										<a4j:support 
											event="onclick"  
											reRender="buttonsGrid_list" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									action="album_form"
									actionListener="#{album.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.album_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
										styleClass="aon-editDataTable-button"/>
							</aon:column>
				
							<aon:column>
								<a4j:support 
									action="album_form"
									actionListener="#{album.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.album_title}"/>
								</f:facet>
								<aon:outputText value="#{album.i18nTitle}"  
										styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.album_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.album_activate}" 
									actionListener="#{album.onActivate}"
									reRender="detail_list" 
									rendered="#{!to.active}">
									<aon:graphicImage alt="#{appBundle.album_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.album_deactivate}" 
									actionListener="#{album.onDeactivate}" 
									reRender="detail_list" 
									rendered="#{to.active}">
									<aon:graphicImage alt="#{appBundle.album_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText for="banner_position" 
										value="#{appBundle.album_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<h:commandButton  
									reRender="detail_list"
									actionListener="#{album.onMoveUp}" 
									rendered="#{to.position != 0 and album.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<h:commandButton 
									reRender="detail_list" 
									actionListener="#{album.onMoveDown}"
									rendered="#{to.position &lt; (album.model.rowCount - 1)  and album.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>
				
						</aon:dataTable>

				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
