<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.albumImage}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{albumImage.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!albumImage.new and cms.roleEditor}"
							action="album_image_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{albumImage.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{albumImage.to!=null or albumImage.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{albumImage.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!albumImage.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{albumImage.onRemove}"
							confirmAction="album_image_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="album_image_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{albumImage.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="album_image_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{albumImage.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{albumImage.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="categories"
							value="#{appBundle.album}"
							action="album_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">

					<aon:outputLabel for="AlbumImage_category"
						value="#{appBundle.album}"/>
					<aon:div>
						<aon:selectOneMenu id="AlbumImage_category"  
							required="true"
							value="#{albumImage.to.album.id}">
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{collections.albumList}" />
						</aon:selectOneMenu>
						<aon:commandButton id="categories_new"
							rendered="#{albumImage.new}" 
							value="#{appBundle.album}"
							action="album_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{album.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="categories_edit"
							rendered="#{!albumImage.new}" 
							value="#{appBundle.album}"
							action="album_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{album.onAlbumImageCriteria}" />
							<aon:actionListener method="#{album.onSearch}" />
							<aon:actionListener method="#{album.onSelectFirst}" />
						</aon:commandButton>
					</aon:div>

					<aon:outputLabel for="AlbumImageDetail_title"
						value="#{appBundle.albumImage_title}" />
					<aon:inputText id="AlbumImageDetail_title"
						required="true" size="64" maxlength="128"
						value="#{albumImage.toI18n.title}" />
					
					<aon:outputLabel for="AlbumImageDetail_richTextEnabled"
						value="#{appBundle.generic_page_richtext_enabled}" />
					<aon:selectBooleanCheckbox id="AlbumImageDetail_richTextEnabled"
						value="#{albumImage.richTextEnabled}">
						<a4j:support 
							ajaxSingle="true"
							event="onclick"  
							reRender="albumImage_richtext" />
					</aon:selectBooleanCheckbox>
				
					<aon:outputLabel for="AlbumImageDetail_description" 
						style="width:100px"
						value="#{bundle.aon_description}" />
					<aon:div id="albumImage_richtext">		
						<aon:div style="width:600px;" rendered="#{albumImage.richTextEnabled}">
							<aon:inputRichText 
								id="AlbumImageDetail_description" 
								value="#{albumImage.toI18n.description}" />
						</aon:div>
						<aon:inputTextarea id="AlbumImageDetail_description-TA"
							rendered="#{!albumImage.richTextEnabled}" 
							rows="10" style="width:98%" 
							value="#{albumImage.toI18n.description}"/>
					</aon:div>					

					<aon:outputLabel for="AlbumImageDetail_alt"
						value="#{appBundle.albumImage_alt}" />
					<aon:inputText id="AlbumImageDetail_alt"
						size="64" maxlength="64"
						value="#{albumImage.toI18n.alt}" />

					<aon:outputLabel for="AlbumImageDetail_alt_thumbnail"
						value="#{appBundle.albumImage_alt_thumbnail}" />
					<aon:inputText id="AlbumImageDetail_alt_thumbnail"
						size="64" maxlength="64"
						value="#{albumImage.toI18n.alt_thumbnail}" />

					<aon:outputLabel 
						value="#{appBundle.albumImage_image}" />
					<aon:panelGroup id="thumbnail_preview_line1">
						<aon:graphicImage 
							url="#{albumImage.to.image}.thumbnail" 
							alt="#{albumImage.to.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview_line1"
		                    actionListener="#{albumImage.onDelImage}">
							<aon:graphicImage url="/images/cms/inactive.png" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp_line1" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{albumImage}" />
							<ui:param name="reRender" value="thumbnail_preview_line1" />
							<ui:param name="image" value="#{true}" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
   
						<aon:outputLabel 
							value="#{appBundle.article_thumbnail}" />
						<aon:graphicImage
							url="#{albumImage.to.thumbnail}.thumbnail" 
							alt="#{albumImage.to.thumbnail}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview_line1"
		                    actionListener="#{albumImage.onDelThumbnail}">
							<aon:graphicImage url="/images/cms/inactive.png" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp_thumbnail" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{albumImage}" />
							<ui:param name="reRender" value="thumbnail_preview_line1" />
							<ui:param name="image" value="#{false}" />
							<ui:param name="thumbnail" value="#{true}" />
						</ui:include>
					</aon:panelGroup>

					<aon:outputLabel for="AlbumImage_position"
						value="#{appBundle.albumImage_position}"/>
					<aon:inputText id="AlbumImage_position"
						required="true" size="10" maxlength="8"
						value="#{albumImage.to.position}" />
						
					<aon:outputLabel for="AlbumImage_active"
						value="#{appBundle.albumImage_active}"/>
					<aon:selectBooleanCheckbox id="AlbumImage_active" 
						value="#{albumImage.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
