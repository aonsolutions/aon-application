<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="albumImageForm">
		
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.albumImage}" />
				<ui:param name="controller" value="#{albumImage}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />
			</ui:include>	
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">

					<aon:outputLabel for="AlbumImage_category"
						value="#{appBundle.album}"/>
					<aon:div>
						<aon:selectOneMenu id="AlbumImage_category"  
							required="true"
							value="#{albumImage.to.album.id}">
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{collections.albumList}" />
						</aon:selectOneMenu>
						<aon:commandButton id="categories_new"
							rendered="#{albumImage.new}" 
							value="#{appBundle.album_new}"
							action="album_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{album.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="categories_edit"
							rendered="#{!albumImage.new}" 
							value="#{appBundle.album_edit}"
							action="album_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon aon-finding-toolbar-item-no-border">
							<aon:actionListener method="#{album.onAlbumImageCriteria}" />
							<aon:actionListener method="#{album.onSearch}" />
							<aon:actionListener method="#{album.onSelectFirst}" />
						</aon:commandButton>
					</aon:div>

					<aon:outputLabel for="AlbumImageDetail_title"
						value="#{appBundle.albumImage_title}" />
					<aon:inputText id="AlbumImageDetail_title"
						required="true" size="64" maxlength="128"
						value="#{albumImage.toI18n.title}" />
					
					<ui:include src="/facelet/content/utils/contentInput.xhtml" >
						<ui:param name="inputTextId" value="AlbumImageDetail_description" />
						<ui:param name="inputTextValue" value="#{albumImage.toI18n.description}" />
						<ui:param name="richTextEnabled" value="#{albumImage.richTextEnabled}" />
					</ui:include>
						
					<aon:outputLabel for="AlbumImageDetail_alt"
						value="#{appBundle.albumImage_alt}" />
					<aon:inputText id="AlbumImageDetail_alt"
						size="64" maxlength="64"
						value="#{albumImage.toI18n.alt}" />

					<aon:outputLabel for="AlbumImageDetail_alt_thumbnail"
						value="#{appBundle.albumImage_alt_thumbnail}" />
					<aon:inputText id="AlbumImageDetail_alt_thumbnail"
						size="64" maxlength="64"
						value="#{albumImage.toI18n.alt_thumbnail}" />

					<aon:outputLabel 
						value="#{appBundle.albumImage_image}" />
					<h:panelGrid columns="2" id="thumbnail_preview_line1">
						<aon:panel styleClass="aon-margin-top" style="height:120;width:170" >
							<f:facet name="header">
								<aon:outputLabel value="#{appBundle.cms_source_size}" />
							</f:facet>
							<aon:graphicImage 
								url="#{albumImage.to.image}.thumbnail" 
								alt="#{albumImage.to.image}"/>
			                <aon:commandLink
			                	immediate="#{true}"
			                	reRender="thumbnail_preview_line1"
			                    actionListener="#{albumImage.onDelImage}">
								<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
			        		</aon:commandLink>
							<ui:include src="/facelet/content/utils/image_modal_button.xhtml">
								<ui:param name="listenerBean" value="#{albumImage}" />
								<ui:param name="reRender" value="thumbnail_preview_line1" />
								<ui:param name="thumbnail" value="#{false}" />
							</ui:include>
						</aon:panel>

						<aon:panel styleClass="aon-margin-top" style="height:120;width:170" >
							<f:facet name="header">
								<aon:outputLabel value="#{appBundle.cms_thumbnail}" />
							</f:facet>
	   						<aon:graphicImage
								url="#{albumImage.to.thumbnail}.thumbnail" 
								alt="#{albumImage.to.thumbnail}"/>
			                <aon:commandLink
			                	immediate="#{true}"
			                	reRender="thumbnail_preview_line1"
			                    actionListener="#{albumImage.onDelThumbnail}">
								<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
			        		</aon:commandLink>
			        		<ui:include src="/facelet/content/utils/image_modal_button.xhtml">
								<ui:param name="listenerBean" value="#{albumImage}" />
								<ui:param name="reRender" value="thumbnail_preview_line1" />
								<ui:param name="thumbnail" value="#{true}" />
							</ui:include>
						</aon:panel>
					</h:panelGrid>

					<aon:outputLabel for="AlbumImage_position"
						value="#{appBundle.albumImage_position}"/>
					<aon:inputText id="AlbumImage_position"
						required="true" size="10" maxlength="8"
						value="#{albumImage.to.position}" />
						
					<aon:outputLabel for="AlbumImage_active"
						value="#{appBundle.albumImage_active}"/>
					<aon:selectBooleanCheckbox id="AlbumImage_active" 
						value="#{albumImage.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
		<ui:include src="/facelet/content/utils/image_modal.xhtml" />
	</ui:define>

</ui:composition>

</body>
</html>
