<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.album}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{album.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!album.new and cms.roleEditor}"
							action="album_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{album.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{album.to!=null or album.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{album.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!album.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{album.onRemove}"
							confirmAction="album_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="album_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{album.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="album_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{album.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{album.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{album.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="images"
							value="#{appBundle.albumImage}"
							action="album_image_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item">
							<aon:actionListener method="#{albumImage.onAlbumCriteria}" />
							<aon:actionListener method="#{albumImage.onSearch}" />
						</aon:commandButton>
						<aon:commandButton id="categories"
							value="#{appBundle.album_category}"
							action="album_category_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item">
							<aon:actionListener method="#{album_category.onInit}" />
							<aon:actionListener method="#{album_category.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">


					<aon:outputLabel for="Album_alias" style="width:100px"
						value="#{appBundle.album_alias}" />
					<aon:inputText id="Album_alias"
						required="true" size="32" maxlength="32"
						value="#{album.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="Album_category"
						value="#{appBundle.album_category}"/>
					<aon:selectOneMenu id="Album_category"  
						required="true"
						value="#{album.to.albumCategory.id}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.albumCategoryList}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Album_publishDate"
						value="#{appBundle.album_publish_date}" />
					<aon:selectInputDate id="Album_publishDate" 
						 style="z-index:2001;margin:0;vertical-align:middle;"
						 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
						 value="#{album.to.publishDate}" renderAsPopup="true"
						 enableManualInput="true"
						 popupDateFormat="#{bundle.aon_date_pattern}">
						 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
					</aon:selectInputDate>	
			
					<aon:outputLabel for="Album_itemsPerPage"
						value="#{appBundle.album_items_per_page}" />
					<rich:inputNumberSlider id="Album_itemsPerPage" 
						value="#{album.to.itemsPerPage}" 
						width="500" 
						minValue="1" 
						maxValue="50" />
						
					<aon:outputLabel for="AlbumDetail_title"
						value="#{appBundle.album_title}" />
					<aon:inputText id="AlbumDetail_title"
						required="true" size="80" maxlength="128"
						value="#{album.toI18n.title}" />
					
					<aon:outputLabel for="AlbumDetail_description"
						value="#{appBundle.album_description}" />
					<aon:inputTextarea id="AlbumDetail_description" 
						style="width:300px;height:60px"
						value="#{album.toI18n.description}" />

					<aon:outputLabel for="AlbumDetail_alt"
						value="#{appBundle.album_alt}" />
					<aon:inputText id="AlbumDetail_alt"
						size="64" maxlength="64"
						value="#{album.toI18n.alt}" />

					<aon:outputLabel 
						value="#{appBundle.album_image}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{album.to.image}.thumbnail" 
							alt="#{album.to.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{album.onDelImage}">
							<aon:graphicImage url="/images/cms/inactive.png" />
		                </aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{album}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="image" value="#{true}" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>		

					<aon:outputLabel for="Album_position"
						value="#{appBundle.album_position}"/>
					<aon:inputText id="Album_position"
						required="true" size="10" maxlength="8"
						value="#{album.to.position}" />
		        	
					<aon:outputLabel for="Album_active"
						value="#{appBundle.album_active}"/>
					<aon:selectBooleanCheckbox id="Album_active" 
						value="#{album.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
