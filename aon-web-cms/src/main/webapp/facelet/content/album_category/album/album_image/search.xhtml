<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="albumImageSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.albumImage}" />
				<ui:param name="controller" value="#{albumImage}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{albumImage}" />
				<ui:define name="searchContent">
	
					<aon:outputLabel for="AlbumImage_thumbnail"
						value="#{appBundle.albumImage_thumbnail}" />
					<aon:inputText id="AlbumImage_thumbnail" size="50"
						valueChangeListener="#{albumImage.addExpression}" />

					<aon:outputLabel for="AlbumImage_album_id"
						value="#{appBundle.album}"/>
					<aon:selectOneMenu id="AlbumImage_album_id"  
						valueChangeListener="#{albumImage.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.albumList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="AlbumImage_position"
						value="#{appBundle.albumImage_position}" />
					<aon:inputText id="AlbumImage_position" size="10"
						valueChangeListener="#{albumImage.addExpression}" />
	
					<aon:outputLabel for="AlbumImage_active"
						value="#{appBundle.cms_active}" />
					<aon:selectOneMenu id="AlbumImage_active"
						valueChangeListener="#{albumImage.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>	
	
				</ui:define>
			</ui:decorate>
						
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
