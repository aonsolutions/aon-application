<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:valueParam name="labelValue" default="#{appBundle.cms_content}" />
	<aon:valueParam name="inputTextRequired" default="#{false}" />

	<aon:outputLabel for="#{inputTextId}" value="#{labelValue}" />
	<a4j:region>
		<aon:selectBooleanCheckbox id="#{inputTextId}_richTextEnabled"
			value="#{richTextEnabled}" >
			<a4j:support reRender="#{inputTextId}" event="onclick"	/>
		</aon:selectBooleanCheckbox>
		<aon:outputLabel for="#{inputTextId}_richTextEnabled"
			value="#{appBundle.cms_richtext_enabled}" />	
		<rich:editor id="#{inputTextId}"
			viewMode="#{richTextEnabled?'visual':'source'}"
			value="#{inputTextValue}" required="#{inputTextRequired}"
			height="250" width="640" configuration="tinyMCE" 
			language="#{facesContext.application.defaultLocale.language}" />																		
	</a4j:region>

</ui:composition>
