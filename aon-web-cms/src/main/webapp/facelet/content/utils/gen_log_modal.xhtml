<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition>

<style>
.bodyPanel {
	width:300px;
    height:500px;
    overflow:auto;
}
</style>
    <a4j:region>
        <h:form>
            <a4j:poll id="poll" interval="2000" enabled="#{generator_status.activePoll}" reRender="poll,grid"/>
        </h:form>
    </a4j:region>
	<h:form>
        <rich:modalPanel  id="#{modalPanelName}"  
            height="350" width="675" zindex="2000">
            <f:facet name="header">
                <h:outputText value="Generator LOG" />
            </f:facet>
            <f:facet name="controls">
                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('#{modalPanelName}')" />
            </f:facet>
			<rich:panel bodyClass="inpanelBody" id="grid">
	        	<f:facet name="header">
	                    Console Log
	            </f:facet>
		        <rich:dataList id="dataList" var="msg" value="#{generator_status.status}" rows="10">
					<h:outputText value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList" maxPages="20" />
			</rich:panel>
        </rich:modalPanel>													
	</h:form>
</ui:composition>

</body>
</html>
