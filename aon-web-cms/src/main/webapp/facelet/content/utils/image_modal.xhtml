<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition>

<style>
.bodyPanel {
	width:300px;
    height:500px;
    overflow:auto;
}
</style>

		<a href="javascript:Richfaces.showModalPanel('#{modalPanelName}',{width:680, top:100})">select</a>
        <rich:modalPanel  id="#{modalPanelName}"  
            height="560" width="675" zindex="2000">
            <f:facet name="header">
                <h:outputText value="Modal Panel Title" />
            </f:facet>
            <f:facet name="controls">
                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('#{modalPanelName}')" />
            </f:facet>
			<h:panelGrid id="#{modalPanelName}_treeGrid" columns="2">
	            <rich:panel bodyClass="bodyPanel">
				    <rich:tree style="width:300px"
				    	switchType="server" 
				    	stateAdvisor="#{treeStateAdvisor}">
				        <rich:recursiveTreeNodesAdaptor roots="#{roots}" 
				        	var="item" 
				        	nodes="#{item.nodes}">
							<rich:treeNode>
				                <aon:commandLink
				                	action="#{item.onSelectFolder}" 
				                	value="#{item}"
				                	immediate="#{true}"
				                	reRender="#{modalPanelName}_treeGrid" />
							</rich:treeNode>
				        </rich:recursiveTreeNodesAdaptor>
				    </rich:tree>
				</rich:panel>
	            <rich:panel bodyClass="bodyPanel">
					<aon:panelGroup>
						<aon:outputLabel value="#{galleryBean.currentRelativePath}" />
						<rich:dataList var="item" value="#{galleryBean.model}" >	
							<aon:panelGrid columns="2" cellpadding="5px" cellspacing="0px">
					                <aon:commandLink
					                	rendered="#{image}"
					                	immediate="#{true}"
					                	reRender="#{reRender}"
					                    actionListener="#{listenerBean.onSelectImage}"
					                    value="#{item.name}">
					            		<aon:graphicImage url="#{item.thumb}" alt="#{item.name}"/>
					        		</aon:commandLink>
					                <aon:commandLink
					                	rendered="#{thumbnail}"
					                	immediate="#{true}"
					                	reRender="#{reRender}"
					                    actionListener="#{listenerBean.onSelectThumbnail}"
					                    value="#{item.name}">
					            		<aon:graphicImage url="#{item.thumb}" alt="#{item.name}"/>
					        		</aon:commandLink>
							</aon:panelGrid>
						</rich:dataList>
					</aon:panelGroup>
				</rich:panel>
			</h:panelGrid>		
        </rich:modalPanel>													

</ui:composition>

</body>
</html>
