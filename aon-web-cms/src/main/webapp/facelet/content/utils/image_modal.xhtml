<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">	

	<c:if test="#{thumbnail}">
		<aon:valueParam name="showWindow" default="#{gallery.showThumbnailImageWindow}" />
	</c:if>
	<c:if test="#{!thumbnail}">
		<aon:valueParam name="showWindow" default="#{gallery.showImageWindow}" />				        	
	</c:if>

	<aon:commandLink style="padding-left:0.4em;" immediate="true"
		reRender="#{modalPanelName}-PanelGroup" ajaxSingle="true">
		<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/select.png']}" alt="#{appBundle.image_modal_open}"/>
		<f:setPropertyActionListener target="#{showWindow}" value="#{true}" />						
	</aon:commandLink>
	<aon:panelGroup id="#{modalPanelName}-PanelGroup">
		<c:if test="#{showWindow}">
			<rich:modalPanel id="#{modalPanelName}"
				rendered="#{showWindow}" showWhenRendered="true"
				height="660" width="710">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{appBundle.image_modal_title}" />
					</aon:div>
				</f:facet>
		        <f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close"
						immediate="true" reRender="#{modalPanelName}-PanelGroup,#{reRender}">
						<f:setPropertyActionListener target="#{showWindow}" value="#{false}" />
						<rich:componentControl for="#{modalPanelName}"
							operation="hide" event="onclick" />
					</aon:commandButton>
		        </f:facet>
				<h:panelGrid id="#{modalPanelName}_treeGrid" columns="2"
					columnClasses="aon-width-300 aon-border aon-vertical-align-top, aon-width-auto aon-vertical-align-top">
					<aon:div styleClass="aon-scroll">
					    <rich:tree 
					    	switchType="server" 
					    	stateAdvisor="#{treeStateAdvisor}">
					        <rich:recursiveTreeNodesAdaptor roots="#{roots}" 
					        	var="item" 
					        	nodes="#{item.nodes}">
								<rich:treeNode>
					                <aon:commandLink
					                	action="#{item.onSelectFolder}" 
					                	value="#{item}"
					                	immediate="#{true}"
					                	reRender="#{modalPanelName}_treeGrid" />
								</rich:treeNode>
					        </rich:recursiveTreeNodesAdaptor>
					    </rich:tree>
					</aon:div>
					<aon:div> 
						<aon:div styleClass="aon-header">
							<aon:panelGrid columns="1" width="100%" columnClasses="aon-header-name">
								<aon:div>
									<aon:outputLabel value="#{gallery.currentRelativePath}" styleClass="aon-applicationName"/>
								</aon:div>
							</aon:panelGrid>
						</aon:div>
						<aon:div style="height:582;overflow:auto;">
							<rich:dataGrid var="item" value="#{gallery.model}" columns="3">
								<aon:div style="with:125px;text-align:center">
									<c:if test="#{thumbnail}">
						                <aon:commandLink immediate="true"
						                	reRender="#{modalPanelName}-PanelGroup,#{reRender}"
						                    actionListener="#{listenerBean.onSelectThumbnail}">
						                    <f:setPropertyActionListener target="#{showWindow}" value="#{false}" />
						            		<aon:graphicImage url="#{item.thumb}" alt="#{item.name}" styleClass="aon-border aon-padding"/>
						            		<aon:div style="width:112px;overflow:hidden;">
						            			<aon:outputText value="#{item.name}"/>
						            		</aon:div>
						        		</aon:commandLink>
						        	</c:if>
									<c:if test="#{!thumbnail}">				        	
						                <aon:commandLink immediate="true"
						                	reRender="#{modalPanelName}-PanelGroup,#{reRender}"
						                    actionListener="#{listenerBean.onSelectImage}">
						                    <f:setPropertyActionListener target="#{showWindow}" value="#{false}" />
						            		<aon:graphicImage url="#{item.thumb}" alt="#{item.name}" styleClass="aon-border aon-padding"/>
						            		<aon:div style="width:112px;overflow:hidden;">
						            			<aon:outputText value="#{item.name}"/>
						            		</aon:div>
						        		</aon:commandLink>
						        	</c:if>
								</aon:div>
							</rich:dataGrid>
						</aon:div>
					</aon:div>
				</h:panelGrid>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>													

</ui:composition>
