<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="companyForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.company}" />
				<ui:param name="controller" value="#{company}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="activities_link"
						value="#{appBundle.activity}"
						action="activity_list"
						actionListener="#{activity.onSearch}"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{activity.onInit}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>		
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Company_name" style="width:100px"
						value="#{appBundle.company_name}" />
					<aon:inputText id="Company_name"
						required="true" 
						size="70" maxlength="64"
						value="#{company.to.name}" />

					<aon:outputLabel for="Company_telephone" style="width:100px"
						value="#{appBundle.company_telephone}" />
					<aon:inputText id="Company_telephone"
						size="25" maxlength="20"
						value="#{company.to.telephone}" />
						
					<aon:outputLabel for="Company_fax" style="width:100px"
						value="#{appBundle.company_fax}" />
					<aon:inputText id="Company_fax"
						size="25" maxlength="20"
						value="#{company.to.fax}" />
						
					<aon:outputLabel for="Company_email" style="width:100px"
						value="#{appBundle.company_email}" />
					<aon:inputText id="Company_email"
						size="70" maxlength="64"
						value="#{company.to.email}" />

					<aon:outputLabel for="Company_address" style="width:100px"
						value="#{appBundle.company_address}" />
					<aon:inputText id="Company_address"
						size="90" maxlength="128"
						value="#{company.to.address}" />

					<aon:outputLabel for="Company_locality" style="width:100px"
						value="#{appBundle.company_locality}" />
					<aon:inputText id="Company_locality"
						size="70" maxlength="64"
						value="#{company.to.locality}" />

					<aon:outputLabel for="Company_province" style="width:100px"
						value="#{appBundle.company_province}" />
					<aon:inputText id="Company_province"
						size="70" maxlength="64"
						value="#{company.to.province}" />

					<aon:outputLabel for="Company_postal_code" style="width:100px"
						value="#{appBundle.company_postal_code}" />
					<aon:inputText id="Company_postal_code"
						size="7" maxlength="16"
						value="#{company.to.postal_code}" />

					<aon:outputLabel for="Company_coordinates" style="width:100px"
						value="#{appBundle.company_coordinates}" />
					<aon:inputText id="Company_coordinates"
						size="90" maxlength="255"
						value="#{company.to.coordinates}" />

					<aon:outputLabel for="Company_web" style="width:100px"
						value="#{appBundle.company_web}" />
					<aon:inputText id="Company_web"
						size="90" maxlength="128"
						value="#{company.to.web}" />

					<aon:outputLabel for="Company_logo" style="width:100px"
						value="#{appBundle.company_logo}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage id="Company_logo" 
							url="#{company.to.logo}.thumbnail" 
							alt="#{company.to.logo}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{company.onDelImage}">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="listenerBean" value="#{company}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>
		        	
				</aon:panelGrid>

				<aon:div id="detail_panel">
					<aon:div styleClass="aon-form-group" rendered="#{!company.new}">
						<aon:div styleClass="aon-form-group-title">
							<aon:div styleClass="aon-form-group-title-internal">
								<aon:outputLabel for="dataTableCurrent" value="#{appBundle.activity}" />
							</aon:div>
						</aon:div>

						<aon:panelGrid id="activities" columns="2" styleClass="none"  
							columnClasses="aon-vertical-align-top, aon-vertical-align-top">
							<aon:dataTable id="dataTableCurrent" rows="10"
								value="#{company.currentActivitiesModel}" var="to"
								columnClasses="aon-editDataTable-textColumn aon-width-300">
								<aon:column>
									<f:facet name="header">
										<aon:div>
											<aon:outputText value="ACTUALES" />
										</aon:div>	
									</f:facet>
									<a4j:support 
										actionListener="#{company.removeCurrentActivity}"
										reRender="activities" 
										event="onclick" />
						            <aon:outputText value="#{to.activity.alias}" styleClass="aon-editDataTable-button aon-icon-delete"/>
								</aon:column>
								<aon:dataScroller2 for="dataTableCurrent" />
					        </aon:dataTable>
					        
					        <aon:div styleClass="aon-margin-left">
								<aon:dataTable id="dataTableAvailable" rows="10"
									value="#{company.activityModel}" var="to"								
									columnClasses="aon-editDataTable-textColumn aon-width-300">
									<aon:column>
										<f:facet name="header">
											<aon:div>
												<aon:outputText value="DISPONIBLES" />
											</aon:div>	
										</f:facet>
										<a4j:support 
											actionListener="#{company.addCurrentActivity}"
											reRender="activities" 
											event="onclick" />
							            <aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button aon-icon-accept"/>
									</aon:column>
						        </aon:dataTable>
						        <aon:dataScroller2 for="dataTableAvailable" />
							</aon:div>
												        
						</aon:panelGrid>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
