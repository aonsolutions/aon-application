<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.link_category}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="link_category_form"
						rendered="#{cms.roleEditor}" 
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{link_category.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="link_category_search"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionListener method="#{link_category.onEditSearch}" />
					</aon:commandButton>
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="#{link_category.getBack}" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="sectionGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:outputLabel for="LinkCategory_section"
						value="#{appBundle.section}"/>
						
					<aon:selectOneMenu id="LinkCategory_section"  
						value="#{generator_config.section}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="save"
							value="#{bundle.aon_save}"
							action="link_category_list" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<aon:actionListener method="#{generator_config.onSaveLinkConfig}" />
						</aon:commandButton>
					</aon:div>		
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">
					
			<aon:dataTable id="dataTable" value="#{link_category.model}" var="to"
				rows="#{link_category.pageLimit}" 
				columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
					aon-editDataTable-textColumn, aon-editDataTable-iconColumn">
				
				<aon:rowSelector
					action="link_category_form" actionListener="#{link_category.onSelect}" />
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.cms_alias}" />
					</f:facet>
					<aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.link_category_label}" />
					</f:facet>
					<aon:outputText value="#{link_category.i18nLabel}"
						styleClass="aon-editDataTable-button"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText for="LinkCategory_position" 
							value="#{appBundle.link_category_position}" />
					</f:facet>
					<aon:outputText value="#{to.position}" styleClass="aon-editDataTable-button" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.link_category_active}" />
					</f:facet>
					<aon:div onmouseover="disableRowSelector();"
						onmouseout="enableRowSelector();" >				
						<aon:commandLink title="#{appBundle.link_category_activate}" 
							action="link_category_list"
							actionListener="#{link_category.onActivate}"
							rendered="#{!to.active}">
							<aon:graphicImage id="LinkCategory_active" alt="#{appBundle.link_category_activate}"
								url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
						</aon:commandLink>
						<aon:commandLink title="#{appBundle.link_category_deactivate}" 
							action="link_category_list"
							actionListener="#{link_category.onDeactivate}" 
							rendered="#{to.active}">
							<aon:graphicImage id="LinkCategory_deactive" alt="#{appBundle.link_category_deactivate}"
								url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
						</aon:commandLink>
					</aon:div>
				</aon:column>

			</aon:dataTable>
				
			<aon:dataScroller2 for="dataTable" showNote="true" />					

		</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
