<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.link_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{link_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="link_category_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{link_category.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{link_category.to!=null or link_category.new}"
							action="link_category_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{link_category.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!link_category.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{link_category.onRemove}"
							confirmAction="link_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="link_category_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{link_category.onSearch}" />
						</aon:commandButton>
						<aon:commandButton id="partial_generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{link_category.to!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateCurrentLinkCategory}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="LinkCategory_alias" style="width:100px"
						value="#{appBundle.link_category_alias}" />
					<aon:inputText id="LinkCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{link_category.to.alias}" />

					<aon:outputLabel for="LinkCategoryDetail_label"
						value="#{appBundle.link_category_label}" />
					<aon:inputText id="LinkCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{link_category.toI18n.label}" />

					<aon:outputLabel for="LinkCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="LinkCategory_section"  
						value="#{link_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!link_category.new and link_category.toI18n.id != null}">
				<f:facet name="header">#{appBundle.link}</f:facet>
				
				<aon:panelGrid columns="2" styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
				
					<rich:panel id="detail_list_panel">
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!link.new}"
										action="link_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{link.onReset}" />
									</aon:commandButton>
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!link.checklistEmpty and link.to==null}" 
										immediate="#{true}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{link.onRemoveSelected}" 
										confirmAction="link_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
						
						<aon:dataTable id="dataTable" value="#{link.model}" var="to"
							rows="#{link.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<f:facet name="header">
									<aon:div>
										&nbsp;
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox id="Row_checked"
										value="#{link.rowChecked}">
										<a4j:support 
											event="onclick"  
											action="link_category_form" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									action="link_category_form"
									actionListener="#{link.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.link_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<a4j:support 
									immediate="#{true}"
									action="link_category_form"
									actionListener="#{link.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.link_label}"/>
								</f:facet>
								<aon:outputText value="#{link.i18nLabel}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.link_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.link_activate}" 
									actionListener="#{link.onActivate}"
									action="link_category_form"
									rendered="#{!to.active}">
									<aon:graphicImage id="link_active" alt="#{appBundle.link_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.link_deactivate}" 
									action="link_category_form"
									actionListener="#{link.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="link_deactive" alt="#{appBundle.link_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText for="link_position" value="#{appBundle.link_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton id="moveUp" 
									action="link_category_form"
									actionListener="#{link.onMoveUp}" 
									rendered="#{to.position != 0 and link.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<aon:commandButton id="moveDown"
									action="link_category_form"
									actionListener="#{link.onMoveDown}"
									rendered="#{to.position &lt; (link.model.rowCount - 1)  and link.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>

						</aon:dataTable>
							
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{link.new or link.to != null}">
        				<f:facet name="header">#{link.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="save_list_form"
										value="#{bundle.aon_save}" 
										rendered="#{link.to!=null or link.new}"
										action="link_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}">
										<aon:actionListener method="#{link.onAccept}" />
									</aon:commandButton>
									<aon:commandButton id="cancel_list_form"
										value="#{bundle.aon_cancel}" 
										rendered="#{link.to!=null or link.new}" immediate="#{true}"
										action="link_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}">
										<aon:actionListener method="#{link.onCancel}" />
									</aon:commandButton>
									<aon:confirmButton id="remove_list_form"
										value="#{bundle.aon_remove}" rendered="#{!link.new}" 
										immediate="true"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{link.onRemove}" 
										confirmAction="link_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
			
						<aon:div styleClass="aon-scroll-area">
							<aon:panelGrid id="sidebarOptionGrid" columns="2" dir="true">

								<aon:outputLabel for="Link_alias" style="width:100px"
									value="#{appBundle.link_alias}" />
								<aon:inputText id="Link_alias"
									required="true" size="32" maxlength="32"
									value="#{link.to.alias}" />
	
								<aon:outputLabel for="LinkDetail_label"
									value="#{appBundle.link_label}" />
								<aon:inputText id="LinkDetail_label"
									required="true" size="50" maxlength="255"
									value="#{link.toI18n.label}" />
	
								<aon:outputLabel for="Link_url" style="width:100px"
									value="#{appBundle.link_url}" />
								<aon:inputText id="Link_url"
									required="true" size="80" maxlength="255"
									value="#{link.to.url}" />
													
							</aon:panelGrid>
						</aon:div>
					</rich:panel>
				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
