<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="bulletinList">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.bulletin}" />
				<ui:param name="toolbarDescription" value="#{menuBundle.cms_bulletin_send}" />
			</ui:include>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div id="bulletinDiv">
					<aon:methodParam name="rowSelectorAction" value="" />
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{bulletin}" />
						<ui:param name="rowSelectorReRender" value="bulletinDiv" />
						<ui:define name="columns">			
								    
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-200" >
								<f:facet name="header">
									<aon:outputText value="#{appBundle.cms_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}"
									styleClass="#{(to==bulletin.to)?'aon-bold':''}" />									
							</aon:column>
		
							<aon:column styleClass="aon-editDataTable-textColumn" >
								<f:facet name="header">
									<aon:outputText value="#{appBundle.article_title}" />
								</f:facet>
								<aon:outputText value="#{bulletin.i18nTitle}"
									styleClass="#{(to==bulletin.to)?'aon-bold':''}" >
									<aon:abbreviateConverter maxWidth="60" />
								</aon:outputText>
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-120" >
								<f:facet name="header">
									<aon:outputText value="#{appBundle.bulletin_publishDate}"/>
								</f:facet>
								<aon:outputText value="#{to.publish_date}"
									styleClass="#{(to==bulletin.to)?'aon-bold':''}" >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>						
							</aon:column>					
		
							<aon:column styleClass="aon-editDataTable-buttonsColumn" >
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{to!=bulletin.to}" />
								<aon:div rendered="#{to==bulletin.to}">
									<aon:commandButton id="send" reRender="aonStatus"
										title="#{appBundle.bulletin_send_emails} (#{bundle.aon_key_save_line_accelerator})"
										actionListener="#{bulletin.onGenerate}"
										rendered="#{bulletin.to!=null and ( cms.roleEditor or cms.rolePublisher )}"
										styleClass="aon-editDataTable-button aon-icon-accept"
										accesskey="#{bundle.aon_key_save_line}" >
										<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
									</aon:commandButton>			
									<aon:commandButton id="cancel"
										title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
										actionListener="#{bulletin.onCancel}" immediate="true"
										rendered="#{cms.roleEditor or cms.rolePublisher}"
										reRender="bulletinDiv"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel_line}" />							
								</aon:div>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{appBundle.bulletin}" />
		</ui:include>			

	</ui:define>

</ui:composition>

</body>
</html>
