<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bulletin_email">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.bulletin_emails}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!bulletin_email.new and cms.roleEditor}"
							reRender="dataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{bulletin_email.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{bulletin_email.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{bulletin_email.onAccept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{bulletin_email.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							accesskey="#{bundle.aon_key_cancel}" >
							<aon:actionListener method="#{bulletin_email.onCancel}" />
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div id="parent_" styleClass="aon-scroll-area">
			
				<aon:dataTable id="dataTable" 
					value="#{bulletin_email.model}" var="to" rows="20"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

					<aon:rowSelector toggleOnClick="#{bulletin_email.to == null}"
						action="bulletin_email_list" actionListener="#{bulletin_email.onSelect}" />
											
					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="&nbsp;" />
							</aon:div>	
						</f:facet>
						<aon:outputText value="&#160;" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="dataTable,gridToolbar"
									rendered="#{!bulletin_email.new and cms.roleEditor}"
									accesskey="#{bundle.aon_key_new_line}">
									<aon:actionListener method="#{bulletin_email.onReset}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.bulletin_email}" />
						</f:facet>
						<aon:outputText value="#{to.email}"
							rendered="#{to!=bulletin_email.to}" 
							styleClass="aon-editDataTable-button">
						</aon:outputText>	
						<aon:inputText value="#{to.email}"
							rendered="#{to==bulletin_email.to}"
							required="#{true}" size="85" maxlength="255" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{bulletin_email.to.email}"
									rendered="#{bulletin_email.new}"
									required="#{true}" size="85" maxlength="255" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.language_language}" />
						</f:facet>
						<aon:outputText value="#{to.language.description}"
							rendered="#{to!=bulletin_email.to}" 
							styleClass="aon-editDataTable-button">
						</aon:outputText>	
						<aon:selectOneMenu 
							rendered="#{to==bulletin_email.to}" 
							value="#{to.language.id}">
							<f:selectItems value="#{collections.languages}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:div>
								<aon:selectOneMenu  
									rendered="#{bulletin_email.new}"
									value="#{bulletin_email.to.language.id}">
									<f:selectItems value="#{collections.languages}" />
								</aon:selectOneMenu>
							</aon:div>
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=bulletin_email.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==bulletin_email.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable,gridToolbar">
								<aon:actionListener method="#{bulletin_email.onAccept}" />
							</aon:commandButton>
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable,gridToolbar" immediate="true">
								<aon:actionListener method="#{bulletin_email.onCancel}" />
							</aon:commandButton>
							<aon:commandButton id="lineRemove"
								rendered="cms.roleEditor"
								title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable,gridToolbar" immediate="true">
								<aon:actionListener method="#{bulletin_email.onRemove}" />
							</aon:commandButton>
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{bulletin_email.new}">
								<f:verbatim rendered="#{!bulletin_email.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable,gridToolbar">
									<aon:actionListener method="#{bulletin_email.onAccept}" />
								</aon:commandButton>
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable,gridToolbar" immediate="true">
									<aon:actionListener method="#{bulletin_email.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="dataTable" showNote="true" />					
					
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
