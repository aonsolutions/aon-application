<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>


<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="1" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.gallery}"/>	  						
					</aon:div>					
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
<style>
.bodyGalleryImages {
	width:250px;
    height:500px;
    overflow:auto;
}
.bodyImages {
	width:400px;
    height:500px;
    overflow:auto;
}
</style>
							<h:panelGrid id="treeGrid" columns="2">
							
								<t:inputFileUpload id="image_file"
									value="#{gallery.inputFile}"
									accept="image/*" size="45"
									storage="file"/>
								<h:commandButton value="#{bundle.aon_fileupload_insert}"
									action="gallery_list"
									styleClass="aon-icon-attach aon-finding-toolbar-item"
									actionListener="#{gallery.fileUploaded}"/>
							
					            <rich:panel bodyClass="bodyGalleryImages">
								    <rich:tree
								    	switchType="server" 
								    	stateAdvisor="#{treeStateAdvisor}">
								        <rich:recursiveTreeNodesAdaptor roots="#{fileSystemBean.imageRoots}" 
								        	var="item" 
								        	nodes="#{item.nodes}">
											<rich:treeNode>
								                <aon:commandLink
								                	action="#{item.onSelectFolder}" 
								                	value="#{item}"
								                	immediate="#{true}"
								                	reRender="treeGrid" />
											</rich:treeNode>
								        </rich:recursiveTreeNodesAdaptor>
								    </rich:tree>
								</rich:panel>
					            <rich:panel bodyClass="bodyImages">
									<aon:panelGroup>
										<aon:div styleClass="aon-finding-title-toolbar">
											<aon:panelGrid columns="1" dir="true" 
												columnClasses="aon-finding-toolbar">				
											
												<aon:div styleClass="aon-finding-toolbar-item-group">
													<aon:outputText value="#{gallery.currentRelativePath}"/>	  						
													<h:commandButton value="#{bundle.aon_remove}"
														rendered="#{gallery.emptyDir}"
														action="gallery_list"
														actionListener="#{gallery.deleteFolder}"/>
												</aon:div>					
												
											</aon:panelGrid>
											<aon:panelGrid columns="1" dir="true" 
												columnClasses="aon-finding-toolbar">				
											
												<aon:div styleClass="aon-finding-toolbar-item-group">
													<aon:inputText 
														size="25" maxlength="30"
														value="#{gallery.folderName}">
														<f:validator validatorId="AliasValidator" />
													</aon:inputText>
													<h:commandButton value="crear carpeta"
														action="gallery_list"
														actionListener="#{gallery.createFolder}"/>
												</aon:div>					
												
											</aon:panelGrid>
										</aon:div>
										<rich:dataList var="item" value="#{gallery.model}">	
											<aon:panelGrid columns="3" cellpadding="5px" cellspacing="0px">
							            		<aon:graphicImage url="#{item.thumb}" alt="#{item.name}"/>
												<aon:outputText value="#{item.name}"/>	  						
								                <aon:commandLink
								                	action="gallery_list"
								                    actionListener="#{gallery.onDeleteFile}"
								                    value="Borrar">
								        		</aon:commandLink>
											</aon:panelGrid>
										</rich:dataList>
									</aon:panelGroup>
								</rich:panel>
							</h:panelGrid>		
			</aon:div>
					
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
