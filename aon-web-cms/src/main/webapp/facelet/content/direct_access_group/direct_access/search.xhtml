<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="directAccessSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.direct_access}" />
				<ui:param name="controller" value="#{direct_access}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{direct_access}" />
				<ui:define name="searchContent">
		
					<aon:outputLabel for="DirectAccess_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="DirectAccess_alias" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="DirectAccess_details_label"
						value="#{appBundle.direct_access_label}" />
					<aon:inputText id="DirectAccess_details_label" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="DirectAccess_details_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="DirectAccess_details_description" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="DirectAccess_type"
						value="#{appBundle.direct_access_type}" />
					<aon:selectOneMenu id="DirectAccess_type" 
						valueChangeListener="#{controller.addEqualExpression}">
						<aon:enumConverter enum="com.code.aon.cms.enumeration.PageType" />
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{collections.pageTypes}" />
					</aon:selectOneMenu> 
					
					<aon:outputLabel for="DirectAccess_directAccessGroup_id"
						value="#{appBundle.direct_access_group}"/>
					<aon:selectOneMenu id="DirectAccess_directAccessGroup_id"  
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.directAccessGroupList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="DirectAccess_position"
						value="#{appBundle.direct_access_position}" />
					<aon:inputText id="DirectAccess_position" size="10"
						valueChangeListener="#{controller.addExpression}" />
	
					<aon:outputLabel for="DirectAccess_active"
						value="#{appBundle.cms_active}" />
					<aon:selectOneMenu id="DirectAccess_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>	
						
				</ui:define>
			</ui:decorate>	
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
