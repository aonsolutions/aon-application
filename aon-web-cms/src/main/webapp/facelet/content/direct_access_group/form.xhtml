<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.direct_access_group}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{direct_access_group.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{direct_access_group.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{direct_access_group.to!=null or direct_access_group.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{direct_access_group.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!direct_access_group.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{direct_access_group.onRemove}"
							confirmAction="direct_access_group_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="direct_access_group_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{direct_access_group.onSearch}" />
						</aon:commandButton>
						<aon:commandButton id="partial_generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{direct_access_group.to!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateCurrentDirectAccessCategory}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="DirectAccessGroup_alias" style="width:100px"
						value="#{appBundle.direct_access_group_alias}" />
					<aon:inputText id="DirectAccessGroup_alias"
						required="true" size="32" maxlength="32"
						value="#{direct_access_group.to.alias}" />

					<aon:outputLabel for="DirectAccessGroupDetail_label"
						value="#{appBundle.direct_access_group_label}" />
					<aon:inputText id="DirectAccessGroupDetail_label"
						required="true" size="50" maxlength="64"
						value="#{direct_access_group.toI18n.label}" />

					<aon:outputLabel for="DirectAccessGroup_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="DirectAccessGroup_section"  
						value="#{direct_access_group.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
							
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!direct_access_group.new and direct_access_group.toI18n.id != null}">
				
					<rich:panel id="detail_list_panel"  rendered="#{direct_access.to == null}">
						<f:facet name="header">#{appBundle.direct_access} - #{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!direct_access.new}"
										reRender="detail_panel"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{direct_access.onReset}" />
									</aon:commandButton>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>

						<aon:dataTable id="dataTable" value="#{direct_access.model}" var="to"
							rows="#{direct_access.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									reRender="detail_panel"
									actionListener="#{direct_access.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.direct_access_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>
				
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									reRender="detail_panel"
									actionListener="#{direct_access.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.direct_access_label}"/>
								</f:facet>
								<aon:outputText value="#{direct_access.i18nLabel}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.direct_access_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.direct_access_activate}" 
									actionListener="#{direct_access.onActivate}"
									reRender="dataTable"
									rendered="#{!to.active}">
									<aon:graphicImage alt="#{appBundle.direct_access_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.direct_access_deactivate}" 
									actionListener="#{direct_access.onDeactivate}" 
									reRender="dataTable"
									rendered="#{to.active}">
									<aon:graphicImage alt="#{appBundle.direct_access_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText for="banner_position" 
										value="#{appBundle.direct_access_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton  
									reRender="dataTable"
									actionListener="#{direct_access.onMoveUp}" 
									rendered="#{to.position != 0 and direct_access.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<aon:commandButton 
									reRender="dataTable"
									actionListener="#{direct_access.onMoveDown}"
									rendered="#{to.position &lt; (direct_access.model.rowCount - 1)  and direct_access.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>
				
						</aon:dataTable>
						
						<aon:dataScroller for="dataTable"
							rowCount="#{direct_access.model.rowCount}" 
							showNote="true" />					
						
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{direct_access.new or direct_access.to != null}">

        				<f:facet name="header">#{appBundle.direct_access} - #{direct_access.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>

								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<aon:commandButton id="reset_list_form" value="#{bundle.aon_reset}"
												rendered="#{!direct_access.new}"
												reRender="detail_panel"
												styleClass="aon-finding-toolbar-item aon-icon-reset"
												accesskey="#{bundle.aon_key_new}">
												<aon:actionListener method="#{direct_access.onReset}" />
											</aon:commandButton>
											<aon:commandButton id="save_list_form"
												value="#{bundle.aon_save}" 
												rendered="#{direct_access.to!=null or direct_access.new}"
												reRender="detail_panel"
												styleClass="aon-finding-toolbar-item aon-icon-accept"
												accesskey="#{bundle.aon_key_save}">
												<aon:actionListener method="#{direct_access.onAccept}" />
											</aon:commandButton>
											<aon:commandButton id="cancel_list_form"
												value="#{bundle.aon_cancel}" 
												rendered="#{direct_access.to!=null or direct_access.new}" immediate="#{true}"
												reRender="detail_panel"
												styleClass="aon-finding-toolbar-item aon-icon-cancel"
												accesskey="#{bundle.aon_key_cancel}">
												<aon:actionListener method="#{direct_access.onCancel}" />
											</aon:commandButton>
											<aon:confirmButton id="remove_list_form"
												value="#{bundle.aon_remove}" rendered="#{!direct_access.new}" 
												immediate="#{true}"
												confirmAction="direct_access_group_form"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{bundle.aon_remove_confirm}"
												confirmActionListener="#{direct_access.onRemove}" 
												styleClass="aon-finding-toolbar-item aon-icon-delete"
												accesskey="#{bundle.aon_key_remove}"/>
									    </aon:div>
										
									</aon:panelGrid>
								</aon:div>
					
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="detailOptionGrid" columns="2" dir="true">
		
										<aon:outputLabel for="DirectAccess_alias" style="width:100px"
											value="#{appBundle.direct_access_alias}" />
										<aon:inputText id="DirectAccess_alias"
											required="true" size="32" maxlength="32"
											value="#{direct_access.to.alias}" />
			
										<aon:outputLabel for="DirectAccessDetail_label"
											value="#{appBundle.direct_access_label}" />
										<aon:inputText id="DirectAccessDetail_label"
											required="true" size="50" maxlength="64"
											value="#{direct_access.toI18n.label}" />
			
										<aon:outputLabel for="DirectAccessDetail_description"
											value="#{appBundle.direct_access_description}" />
										<aon:inputText id="DirectAccessDetail_description"
											size="80" maxlength="100"
											value="#{direct_access.toI18n.description}" />

										<aon:outputLabel for="DirectAccess_type"
											value="#{appBundle.direct_access_type}" />
										<aon:selectOneMenu id="DirectAccess_type" 
											value="#{direct_access.to.type}" >
											<f:selectItems value="#{collections.pageTypes}">
											</f:selectItems>
												<a4j:support 
													event="onchange"  
													reRender="detailOptionGrid" />
										</aon:selectOneMenu> 
			
										<aon:outputLabel for="DirectAccess_level"
											value="#{appBundle.direct_access_level}" 
											rendered="#{direct_access.visibleLevel}"/>
										<aon:selectOneMenu id="DirectAccess_level" 
											rendered="#{direct_access.visibleLevel}" 
											value="#{direct_access.to.level}">
											<f:selectItems value="#{direct_access.levels}">
											</f:selectItems>
												<a4j:support 
													event="onchange"  
													reRender="detailOptionGrid" />
										</aon:selectOneMenu>											
			
										<aon:outputLabel for="DirectAccess_ident"
											value="#{appBundle.direct_access_ident}" 
											rendered="#{direct_access.visibleIdent}"/>
										<aon:selectOneMenu id="DirectAccess_ident" 
											rendered="#{direct_access.visibleIdent}" 
											value="#{direct_access.to.ident}"
											 partialSubmit="true">
											<f:selectItems value="#{direct_access.idents}" />
										</aon:selectOneMenu> 
			
										<aon:outputLabel for="DirectAccessDetail_url"
											value="#{appBundle.direct_access_url}" 
											rendered="#{direct_access.visibleUrl}"/>
										<aon:inputText id="DirectAccessDetail_url" 
											rendered="#{direct_access.visibleUrl}"
											required="true" size="80" maxlength="255"
											value="#{direct_access.toI18n.url}" />

										<aon:outputLabel 
											value="#{appBundle.direct_access_image}" />
										<aon:panelGroup id="thumbnail_preview">
											<aon:graphicImage 
												url="#{direct_access.to.image}.thumbnail" 
												alt="#{direct_access.to.image}"/>
							                <aon:commandLink
							                	immediate="#{true}"
							                	reRender="thumbnail_preview"
							                    actionListener="#{direct_access.onDelImage}">
												<aon:graphicImage url="/images/cms/inactive.png" />
							        		</aon:commandLink>
											<ui:include src="/facelet/content/utils/image_modal.xhtml">
												<ui:param name="modalPanelName" value="mp" />
												<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
												<ui:param name="galleryBean" value="#{gallery}" />
												<ui:param name="listenerBean" value="#{direct_access}" />
												<ui:param name="reRender" value="thumbnail_preview" />
												<ui:param name="image" value="#{true}" />
												<ui:param name="thumbnail" value="#{false}" />
											</ui:include>
							        	</aon:panelGroup>
							        </aon:panelGrid>
								</aon:div>

					</rich:panel>

			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
