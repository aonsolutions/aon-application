<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="sidebarForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.sidebar}" />
				<ui:param name="controller" value="#{sidebar}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>		
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true">
	
					<aon:outputLabel for="sidebar_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="sidebar_alias"
						required="true" size="32" maxlength="32"
						value="#{sidebar.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>
				</aon:panelGrid>
				
				<aon:div id="detail_panel">
					<c:if test="#{!sidebar.new}" >
						<aon:div styleClass="aon-form-group">
							<aon:div styleClass="aon-form-group-title">
								<aon:div styleClass="aon-form-group-title-internal">
									<aon:outputText value="#{appBundle.sidebar_option}" />
								</aon:div>
							</aon:div>
						
							<c:if test="#{sidebar_option.to == null}">
								<aon:div styleClass="aon-toolbar">
									<aon:div styleClass="aon-finding-toolbar-item-group">
										<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
											reRender="detail_panel" 
											styleClass="aon-finding-toolbar-item aon-icon-reset"
											accesskey="#{bundle.aon_key_new}">
											<aon:actionListener method="#{sidebar_option.onReset}" />
										</aon:commandButton>
									</aon:div>								
								</aon:div>
								
								<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
									<ui:param name="controller" value="#{sidebar_option}" />
									<ui:param name="rowSelectorReRender" value="detail_panel" />
									<ui:define name="columns">								
											
										<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{appBundle.cms_alias}"/>
											</f:facet>
											<aon:outputText value="#{to.alias}" />
										</aon:column>
		
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{appBundle.cms_label}"/>
											</f:facet>
											<aon:outputText value="#{sidebar_option.i18nLabel}" />
										</aon:column>
			
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{appBundle.sidebar_option_type}"/>
											</f:facet>
											<aon:outputText value="#{to.type}" />
										</aon:column>
		
										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="#{appBundle.sidebar_option_active}" />
											</f:facet>
											<aon:div onmouseover="disableRowSelector();"
												onmouseout="enableRowSelector();" >																	
												<aon:commandLink title="#{appBundle.sidebar_option_activate}" action="sidebar_form"
													actionListener="#{sidebar_option.onActivate}"
													reRender="#{dataTableId}" 
													rendered="#{!to.active}">
													<aon:graphicImage id="SidebarOption_active" alt="#{appBundle.sidebar_option_activate}"
														url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
												</aon:commandLink>
												<aon:commandLink title="#{appBundle.sidebar_option_deactivate}" action="sidebar_form"
													actionListener="#{sidebar_option.onDeactivate}" 
													reRender="#{dataTableId}" 
													rendered="#{to.active}">
													<aon:graphicImage id="SidebarOption_deactive" alt="#{appBundle.sidebar_option_deactivate}"
														url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
												</aon:commandLink>
											</aon:div>
										</aon:column>
			
										<aon:column styleClass="aon-width-80 aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText for="MenuOption_position" value="#{appBundle.sidebar_option_position}" />
											</f:facet>
											<aon:div onmouseover="disableRowSelector();"
												onmouseout="enableRowSelector();" >			
												<aon:commandLink id="moveUp" reRender="#{dataTableId}"
													title="#{appBundle.cms_move_up}" immediate="true"
													actionListener="#{sidebar_option.onMoveUp}" 
													styleClass="aon-margin-right"
													rendered="#{to.position != 0 and sidebar_option.to==null}">
													<aon:graphicImage alt="#{appBundle.cms_move_up}"
														url="#{aonResource.resolveLocal['/images/cms/up.gif']}" />
												</aon:commandLink>
												<aon:commandLink id="moveDown" reRender="#{dataTableId}"
													title="#{appBundle.cms_move_down}" immediate="true"
													actionListener="#{sidebar_option.onMoveDown}" 
													rendered="#{to.position &lt; (sidebar_option.model.rowCount - 1)  and sidebar_option.to==null}">
													<aon:graphicImage alt="#{appBundle.cms_move_down}"
														url="#{aonResource.resolveLocal['/images/cms/down.gif']}" />
												</aon:commandLink>
											</aon:div>
										</aon:column>
									</ui:define>
								</ui:decorate>	
								
							</c:if>
							
							<c:if test="#{sidebar_option.to != null}">
						
								<aon:div styleClass="aon-toolbar">
									<aon:div styleClass="aon-finding-toolbar-item-group">						
										<aon:commandButton id="reset_list_form" value="#{bundle.aon_reset}"
											reRender="detail_panel" 
											actionListener="#{sidebar_option.onReset}"
											styleClass="aon-finding-toolbar-item aon-icon-reset"
											accesskey="#{bundle.aon_key_new}">
										</aon:commandButton>
										<aon:commandButton id="save_list_form"
											value="#{bundle.aon_save}" 
											rendered="#{sidebar_option.to!=null or sidebar_option.new}"
											reRender="detail_panel"
											actionListener="#{sidebar_option.accept}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											accesskey="#{bundle.aon_key_save}">
										</aon:commandButton>
										<aon:commandButton id="cancel_list_form"
											value="#{bundle.aon_cancel}" 
											rendered="#{sidebar_option.to!=null or sidebar_option.new}" immediate="#{true}"
											actionListener="#{sidebar_option.onCancel}"
											reRender="detail_panel"
											styleClass="aon-finding-toolbar-item aon-icon-cancel"
											accesskey="#{bundle.aon_key_cancel}">
										</aon:commandButton>
										<aon:confirmButton id="remove_list_form"
											value="#{bundle.aon_remove}" rendered="#{!sidebar_option.new}" 
											immediate="true"
											confirmTitle="Confirmation Dialog" 
											confirmMessage="#{bundle.aon_remove_confirm}"
											confirmActionListener="#{sidebar_option.onRemove}" 
											confirmAction="sidebar_form"
											styleClass="aon-finding-toolbar-item aon-icon-delete"
											accesskey="#{bundle.aon_key_remove}"/>
									</aon:div>
								</aon:div>
				
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuOptionGrid" columns="2" dir="true">
	
										<aon:outputLabel for="Alias" 
											value="#{appBundle.cms_alias}" />
										<aon:inputText id="Alias"
											value="#{sidebar_option.to.alias}" 
											required="true"
											size="40" maxlength="64">
											<f:validator validatorId="AliasValidator" />
										</aon:inputText>
											
										<aon:outputLabel for="Label" 
											value="#{appBundle.sidebar_option_label}" />
										<aon:inputText id="Label"
											value="#{sidebar_option.toI18n.label}" 
											required="true"
											size="50" maxlength="64" />
			
										<aon:outputLabel for="SidebarOption_type" 
											value="#{appBundle.sidebar_option_type}" />
										<aon:selectOneMenu  
											id="SidebarOption_type" 
											value="#{sidebar_option.to.type}" 
											required="true">
											<f:selectItems value="#{collections.sidebarTypes}" />
											<a4j:support event="onchange" reRender="menuOptionGrid" />										
										</aon:selectOneMenu> 
			
										<aon:outputLabel for="SidebarOption_ident"
											value="#{appBundle.sidebar_option_ident}" 
											rendered="#{sidebar_option.visibleIdent}" />
										<aon:selectOneMenu id="SidebarOption_ident"
											rendered="#{sidebar_option.visibleIdent}"
											value="#{sidebar_option.to.ident}">
											<f:selectItems value="#{sidebar_option.idents}" />
										</aon:selectOneMenu>
			
										<aon:outputLabel for="Side"
											value="#{appBundle.sidebar_option_side}" />
										<aon:selectOneMenu id="Side"
											value="#{sidebar_option.to.side}" >
											<f:selectItems value="#{collections.sidebarSides}" />
										</aon:selectOneMenu> 
					
									</aon:panelGrid>
								</aon:div>
							</c:if>
						</aon:div>
					</c:if>
				</aon:div>
			</aon:div>			
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
