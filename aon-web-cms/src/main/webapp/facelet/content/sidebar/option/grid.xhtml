<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.sidebar_option}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="sidebar_option_grid"
							actionListener="#{sidebar_option.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!sidebar_option.checklistEmpty}" 
							inmediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{sidebar_option.onRemoveSelected}"
							confirmAction="sidebar_option_grid"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="sidebar_grid" 
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
						
				<aon:dataTable id="dataTable" value="#{sidebar_option.model}" var="to"
					rows="20" styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to==sidebar_option.to}" />
						<aon:commandButton rendered="#{to!=sidebar_option.to}"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{sidebar_option.onSelect}" value="" immediate="true"
							reRender="dataTable">
						</aon:commandButton>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset" value=""
									immediate="true" reRender="dataTable"
									rendered="#{!sidebar_option.new}" actionListener="#{sidebar_option.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="#{bundle.aon_check}" />
							</aon:div>	
						</f:facet>
						<aon:selectBooleanCheckbox id="Row_checked"
								value="#{sidebar_option.rowChecked}">
								<a4j:support 
									event="onclick"  
									reRender="dataTable,buttonsGrid" />
						</aon:selectBooleanCheckbox>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sidebar_option_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" rendered="#{to!=sidebar_option.to}" 
							styleClass="aon-editDataTable-button"/>
						<aon:panelGrid id="editData" 
							columns="2" rendered="#{to==sidebar_option.to}" 
							style="width:90%">
							<aon:outputText value="#{appBundle.sidebar_option_alias}" />
							<aon:inputText value="#{to.alias}" 
								size="40" maxlength="64" />
								
							<aon:outputText value="#{appBundle.sidebar_option_label}" />
							<aon:inputText value="#{sidebar_option.toI18n.label}" 
								size="50" maxlength="64" />

							<aon:outputText value="#{appBundle.sidebar_option_type}" />
							<aon:selectOneMenu  
								value="#{sidebar_option.to.type}" 
								required="true">
								<f:selectItems value="#{collections.sidebarTypes}" />
								<a4j:support 
									event="onchange"  
									reRender="editData" />
							</aon:selectOneMenu> 

							<aon:outputText value="#{appBundle.sidebar_option_ident}" 
									rendered="#{sidebar_option.visibleIdent}" 
									/>
							<aon:div id="selectOneMenu_edit">
								<aon:selectOneMenu  
									rendered="#{sidebar_option.visibleIdent}" 
									value="#{sidebar_option.to.ident}">
									<f:selectItems value="#{sidebar_option.idents}" />
								</aon:selectOneMenu>
							</aon:div> 

							<aon:outputText value="#{appBundle.sidebar_option_side}" />
							<aon:selectOneMenu  
								value="#{sidebar_option.to.side}" >
								<f:selectItems value="#{collections.sidebarSides}" />
							</aon:selectOneMenu> 
						</aon:panelGrid>
						<f:facet name="footer">
							<aon:panelGrid id="newData" 
								columns="2" rendered="#{sidebar_option.new}" 
								style="width:90%">
								<aon:outputText value="#{appBundle.sidebar_option_alias}" />
								<aon:inputText value="#{sidebar_option.to.alias}" 
									size="40" maxlength="64" />
									
								<aon:outputText value="#{appBundle.sidebar_option_label}" />
								<aon:inputText value="#{sidebar_option.toI18n.label}" 
									size="50" maxlength="64" />
	
								<aon:outputText value="#{appBundle.sidebar_option_type}" />
								<aon:selectOneMenu 
									value="#{sidebar_option.to.type}">
									<f:selectItems value="#{collections.sidebarTypes}" />
									<a4j:support ajaxSingle="true" 
										event="onchange"  
										reRender="newData" />
								</aon:selectOneMenu> 
	
								<aon:outputText value="#{appBundle.sidebar_option_ident}" 	
									rendered="#{sidebar_option.visibleIdent}" />
								<aon:selectOneMenu 
									rendered="#{sidebar_option.visibleIdent}" 
									value="#{sidebar_option.to.ident}">
									<f:selectItems value="#{sidebar_option.idents}" />
								</aon:selectOneMenu>
	
								<aon:outputText value="#{appBundle.sidebar_option_side}" />
								<aon:selectOneMenu  
									value="#{sidebar_option.to.side}" >
									<f:selectItems value="#{collections.sidebarSides}" />
								</aon:selectOneMenu> 
							</aon:panelGrid>
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sidebar_option_active}" />
						</f:facet>
						<aon:commandLink title="#{appBundle.sidebar_option_activate}" action="sidebar_option_list"
							actionListener="#{sidebar_option.onActivate}"
							reRender="dataTable" 
							rendered="#{!to.active}">
							<aon:graphicImage id="SidebarOption_active" alt="#{appBundle.sidebar_option_activate}"
								url="/images/cms/inactive.png" />
						</aon:commandLink>
						<aon:commandLink title="#{appBundle.sidebar_option_deactivate}" action="sidebar_option_list"
							actionListener="#{sidebar_option.onDeactivate}" 
							reRender="dataTable" 
							rendered="#{to.active}">
							<aon:graphicImage id="SidebarOption_deactive" alt="#{appBundle.sidebar_option_deactivate}"
								url="/images/cms/active.png" />
						</aon:commandLink>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>
	
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=sidebar_option.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==sidebar_option.to}">
							<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable"
								actionListener="#{sidebar_option.onAccept}" />
							<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable" immediate="true"
								actionListener="#{sidebar_option.onCancel}" />
							<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable" immediate="true"
								actionListener="#{sidebar_option.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{sidebar_option.new}">
								<f:verbatim rendered="#{!sidebar_option.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable"
									actionListener="#{sidebar_option.onAccept}" />
								<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable" immediate="true"
									actionListener="#{sidebar_option.onCancel}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>
			
				<aon:dataScroller dataTable="dataTable" model="#{sidebar_option.model}" />

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
