<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.article_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{article_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="article_category_form"
							actionListener="#{article_category.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<h:commandButton id="save_new"
							value="#{bundle.aon_save}" 
							rendered="#{article_category.new}"
							action="article_category_form"
							actionListener="#{article_category.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<h:commandButton id="save_edit"
							value="#{bundle.aon_save}" 
							rendered="#{article_category.to!=null and !article_category.new}"
							actionListener="#{article_category.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!article_category.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{article_category.onRemove}"
							confirmAction="article_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="exit" value="#{bundle.aon_close}"
							action="article_category_list" 
							actionListener="#{article_category.onSearch}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
						<h:commandButton id="generate_articleCategory"
							value="#{appBundle.aon_generate}" 
							rendered="#{article_category.to!=null}"
							action="article_category_form"
							actionListener="#{generator.onGenerateCurrentArticleCategory}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>										
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="ArticleCategory_alias" style="width:100px"
						value="#{appBundle.article_category_alias}" />
					<aon:inputText id="ArticleCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{article_category.to.alias}" />

					<aon:outputLabel for="ArticleCategoryDetail_label"
						value="#{appBundle.article_category_label}" />
					<aon:inputText id="ArticleCategoryDetail_label"
						size="50" maxlength="64"
						value="#{article_category.toI18n.label}" />

					<aon:outputLabel for="ArticleCategory_section"
						value="#{appBundle.section}"/>
					<h:selectOneMenu id="ArticleCategory_section"  
						value="#{article_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</h:selectOneMenu>
					
					<aon:outputLabel for="ArticleCategory_elementSection"
						value="#{appBundle.section} (Only Elements)"/>
					<h:selectOneMenu id="ArticleCategory_elementSection"  
						value="#{article_category.to.elementSection.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</h:selectOneMenu>
							
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!article_category.new and article_category.toI18n.id != null}">
				<f:facet name="header">#{appBundle.article}</f:facet>
				
				<aon:panelGrid columns="2" styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
				
					<rich:panel id="detail_list_panel">
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<h:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!article.new}"
										actionListener="#{article.onReset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}"
										reRender="detail_panel,tab0,tab1,tab2,tab3" />
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!article.checklistEmpty and article.to==null}" 
										immediate="#{true}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{article.onRemoveSelected}" 
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"
										reRender="detail_panel,tab0,tab1,tab2,tab3"  />
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>

						<aon:panelTabSet id="tabPanelTypes"  
							valueChangeListener="#{article.processTabChange}"> 
							<aon:panelTab id="#{article.tabID0}" label="#{article.tabID0}">
								<ui:include src="/facelet/content/article_category/tab.xhtml">
									<ui:param name="dataTable" value="tab0" />
								</ui:include>
		                    </aon:panelTab>
							<aon:panelTab id="#{article.tabID1}" label="#{article.tabID1}">
								<ui:include src="/facelet/content/article_category/tab.xhtml">
									<ui:param name="dataTable" value="tab1" />
								</ui:include>
		                    </aon:panelTab>
							<aon:panelTab id="#{article.tabID2}" label="#{article.tabID2}">
								<ui:include src="/facelet/content/article_category/tab.xhtml">
									<ui:param name="dataTable" value="tab2" />
								</ui:include>
		                    </aon:panelTab>
							<aon:panelTab id="#{article.tabID3}" label="#{article.tabID3}">
								<ui:include src="/facelet/content/article_category/tab.xhtml">
									<ui:param name="dataTable" value="tab3" />
								</ui:include>
		                    </aon:panelTab>
						</aon:panelTabSet>
					</rich:panel>

					<rich:panel id="detail_edit_panel" rendered="#{article.new or article.to != null}">
        				<f:facet name="header">#{article.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>


						<aon:panelTabSet id="tabPanelTypesForm"> 
							<aon:panelTab id="content" label="#{appBundle.aon_content}">
							
								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<h:commandButton id="save_list_form"
												value="#{bundle.aon_save}" 
												rendered="#{article.to!=null or article.new}"
												reRender="detail_panel,tab0,tab1,tab2,tab3"
												actionListener="#{article.onAccept}"
												styleClass="aon-finding-toolbar-item aon-icon-accept"
												accesskey="#{bundle.aon_key_save}"/>
											<h:commandButton id="cancel_list_form"
												value="#{bundle.aon_cancel}" 
												rendered="#{article.to!=null or article.new}" immediate="#{true}"
												reRender="detail_panel,tab0,tab1,tab2,tab3"
												actionListener="#{article.onCancel}" 
												styleClass="aon-finding-toolbar-item aon-icon-cancel"
												accesskey="#{bundle.aon_key_cancel}"/>
											<aon:confirmButton id="remove_list_form"
												value="#{bundle.aon_remove}" rendered="#{!article.new}" 
												reRender="detail_panel,tab0,tab1,tab2,tab3"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{bundle.aon_remove_confirm}"
												confirmActionListener="#{article.onRemove}" 
												styleClass="aon-finding-toolbar-item aon-icon-delete"
												accesskey="#{bundle.aon_key_remove}"/>
											<h:commandButton id="generate_article"
												value="#{appBundle.aon_generate}" 
												rendered="#{article.to!=null}"
												reRender="detail_panel,tab0,tab1,tab2,tab3"
												actionListener="#{generator.onGenerateCurrentArticle}"
												styleClass="aon-finding-toolbar-item aon-icon-accept"
												accesskey="#{bundle.aon_key_save}"/>										
									    </aon:div>
									</aon:panelGrid>
								</aon:div>
					
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="detailOptionGrid" columns="2" dir="true">
		
										<aon:outputLabel for="Article_alias" style="width:100px"
											value="#{appBundle.article_alias}" />
										<aon:inputText id="Article_alias"
											required="true" size="32" maxlength="32"
											value="#{article.to.alias}" />
			
										<aon:outputLabel for="ArticleDetail_publishDate"
											value="#{appBundle.article_publishDate}" />
										<aon:selectInputDate id="ArticleDetail_publishDate"
											required="true"  
											 style="z-index:2001;margin:0;vertical-align:middle;"
											 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
											 value="#{article.to.publishDate}" renderAsPopup="true"
											 popupDateFormat="#{bundle.aon_date_pattern}">
											 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
										</aon:selectInputDate>	
										
										<aon:outputLabel for="ArticleDetail_expireDate"
											value="#{appBundle.article_expireDate}" />
										<aon:selectInputDate id="ArticleDetail_expireDate" 
											 style="z-index:2001;margin:0;vertical-align:middle;"
											 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
											 value="#{article.to.expireDate}" renderAsPopup="true"
											 popupDateFormat="#{bundle.aon_date_pattern}">
											 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
										</aon:selectInputDate>	
			
										<aon:outputLabel for="ArticleDetail_title"
											value="#{appBundle.article_title}" />
										<aon:inputText id="ArticleDetail_title"
											required="true" size="80" maxlength="255"
											value="#{article.toI18n.title}" />
			
										<aon:outputLabel for="ArticleDetail_subtitle"
											value="#{appBundle.article_subtitle}" />
										<aon:inputText id="ArticleDetail_subtitle"
											size="80" maxlength="255"
											value="#{article.toI18n.subtitle}" />

										<aon:outputLabel for="ArticleDetail_initDate"
											value="#{appBundle.article_initDate}" 
											rendered="#{article.eventType}" />
										<aon:selectInputDate id="ArticleDetail_initDate"
											rendered="#{article.eventType}"
											 style="z-index:2001;margin:0;vertical-align:middle;"
											 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
											 value="#{article.to.initDate}" renderAsPopup="true"
											 popupDateFormat="#{bundle.aon_date_pattern}">
											 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
										</aon:selectInputDate>	
										
										<aon:outputLabel for="ArticleDetail_endDate"
											value="#{appBundle.article_endDate}"
											rendered="#{article.eventType}" />
										<aon:selectInputDate id="ArticleDetail_endDate"
											rendered="#{article.eventType}" 
											 style="z-index:2001;margin:0;vertical-align:middle;"
											 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
											 value="#{article.to.endDate}" renderAsPopup="true"
											 popupDateFormat="#{bundle.aon_date_pattern}">
											 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
										</aon:selectInputDate>	
			
										<aon:outputLabel for="Article_richTextEnabled"
											value="#{appBundle.generic_page_richtext_enabled}" />
										<aon:selectBooleanCheckbox id="Article_richTextEnabled"
											value="#{article.richTextEnabled}">
											<a4j:support 
												ajaxSingle="true"
												event="onclick"  
												reRender="detailOptionGrid" />
										</aon:selectBooleanCheckbox>
							
										<aon:outputLabel for="ArticleDetail_content" style="width:100px"
											rendered="#{article.richTextEnabled}" 
											value="#{appBundle.article_content}" />
										<aon:div style="width:500px" rendered="#{article.richTextEnabled}">
											<aon:inputRichText style="width:100%" 
												id="ArticleDetail_content" 
												value="#{article.toI18n.content}" />
										</aon:div>
			
										<aon:outputLabel for="Article_content_TA"
											value="#{appBundle.article_content}" 
											rendered="#{!article.richTextEnabled}"/>
										<aon:inputTextarea id="Article_content_TA"
											rendered="#{!article.richTextEnabled}" 
											cols="80" rows="20" 
											value="#{article.toI18n.content}"/>


										<aon:outputLabel 
											value="#{appBundle.albumImage_image}" />
										<aon:panelGroup id="thumbnail_preview">
											<aon:graphicImage 
												url="#{article.to.image}.thumbnail" 
												alt="#{article.to.image}"/>
							                <aon:commandLink
							                	immediate="#{true}"
							                	reRender="thumbnail_preview"
							                    actionListener="#{article.onDelImage}">
												<aon:graphicImage url="/images/cms/inactive.png" />
							        		</aon:commandLink>
											<ui:include src="/facelet/content/utils/image_modal.xhtml">
												<ui:param name="modalPanelName" value="mp" />
												<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
												<ui:param name="galleryBean" value="#{gallery}" />
												<ui:param name="listenerBean" value="#{article}" />
												<ui:param name="reRender" value="thumbnail_preview" />
												<ui:param name="image" value="#{true}" />
												<ui:param name="thumbnail" value="#{false}" />
											</ui:include>
        
											<aon:outputLabel 
												value="#{appBundle.article_thumbnail}" />
											<aon:graphicImage
												url="#{article.to.thumbnail}.thumbnail" 
												alt="#{article.to.thumbnail}"/>
							                <aon:commandLink
							                	immediate="#{true}"
							                	reRender="thumbnail_preview"
							                    actionListener="#{article.onDelThumbnail}">
												<aon:graphicImage url="/images/cms/inactive.png" />
							        		</aon:commandLink>
											<ui:include src="/facelet/content/utils/image_modal.xhtml">
												<ui:param name="modalPanelName" value="mp_thumbnail" />
												<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
												<ui:param name="galleryBean" value="#{gallery}" />
												<ui:param name="listenerBean" value="#{article}" />
												<ui:param name="reRender" value="thumbnail_preview" />
												<ui:param name="image" value="#{false}" />
												<ui:param name="thumbnail" value="#{true}" />
											</ui:include>
										</aon:panelGroup>
											
										<aon:outputLabel for="ArticleDetail_image_info"
											value="#{appBundle.article_image_info}" />
										<aon:inputText id="ArticleDetail_image_info"
											size="90" maxlength="255"
											value="#{article.toI18n.image_info}" />
			
										<aon:outputLabel for="ArticleDetail_alt"
											value="#{appBundle.article_alt}" />
										<aon:inputText id="ArticleDetail_alt"
											size="64" maxlength="64"
											value="#{article.toI18n.alt}" />
			
										<aon:outputLabel for="ArticleDetail_alt_thumbnail"
											value="#{appBundle.article_alt_thumbnail}" />
										<aon:inputText id="ArticleDetail_alt_thumbnail"
											size="64" maxlength="64"
											value="#{article.toI18n.alt_thumbnail}" />
															
									</aon:panelGrid>
								</aon:div>

		                    </aon:panelTab>

							<aon:panelTab id="meta_tags" label="#{appBundle.article_related_list}"
								rendered="#{!article.new}">

								<h:dataTable id="articleRelatedData" 
									value="#{articleRelated.model}" var="to"
									rows="#{articleRelated.pageLimit}" styleClass="dr-table rich-table aon-editDataTable"
									headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
									footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
									rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
									cellpadding="0" cellspacing="0"
									columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
							
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="&#160;" />
										</f:facet>
										<aon:outputText value="&#160;" rendered="#{to==articleRelated.to}" />
										<h:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
											rendered="#{to!=articleRelated.to}"
											styleClass="aon-editDataTable-button aon-icon-delete"
											reRender="articleRelatedData" immediate="true"
											actionListener="#{articleRelated.onRemoveCurrent}" />
										<f:facet name="footer">
											<aon:div>
												<h:commandButton id="reset"
													title="[#{bundle.aon_reset}]"
													styleClass="aon-editDataTable-button aon-icon-reset" value=""
													immediate="true" reRender="articleRelatedData"
													rendered="#{!articleRelated.new}" 
													actionListener="#{articleRelated.onReset}"
													accesskey="#{bundle.aon_key_new_line}">
												</h:commandButton>
											</aon:div>
										</f:facet>
									</aon:column>
							
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="#{appBundle.article_related_name}" />
										</f:facet>
										<aon:outputText value="#{to.articleRelated.alias}" 
											rendered="#{to!=articleRelated.to}" />
										<f:facet name="footer">
											<aon:selectOneMenu styleClass="aon-form-selectOneMenu-field"
												rendered="#{articleRelated.new}" 
												value="#{articleRelated.to.articleRelated.id}">
												<f:selectItems value="#{collections.articleList}" />
											</aon:selectOneMenu>
										</f:facet>
									</aon:column>
							
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="&#160;" />
										</f:facet>
										<f:verbatim rendered="#{to!=articleRelated.to}">&#160;</f:verbatim>
										<f:facet name="footer">
											<aon:div rendered="#{articleRelated.new}">
												<f:verbatim rendered="#{!articleRelated.new}">&#160;</f:verbatim>
												<h:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
													styleClass="aon-editDataTable-button aon-icon-accept"
													reRender="articleRelatedData"
													actionListener="#{articleRelated.onAccept}" />
												<h:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
													styleClass="aon-editDataTable-button aon-icon-cancel"
													reRender="articleRelatedData" immediate="true"
													actionListener="#{articleRelated.onCancel}" />
											</aon:div>
										</f:facet>
									</aon:column>
								</h:dataTable>
		                    </aon:panelTab>

							<aon:panelTab id="files" label="#{appBundle.document_related_list}"
								rendered="#{!article.new}">
							
								<h:dataTable id="articleDocumentData" 
									value="#{articleDocument.model}" var="to"
									rows="#{articleDocument.pageLimit}" styleClass="dr-table rich-table aon-editDataTable"
									headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
									footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
									rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
									cellpadding="0" cellspacing="0"
									columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
												   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
							
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="&#160;" />
										</f:facet>
										<aon:outputText value="&#160;" rendered="#{to==articleDocument.to}" />
										<f:facet name="footer">
											<aon:div>
												<h:commandButton id="reset"
													title="[#{bundle.aon_reset}]"
													styleClass="aon-editDataTable-button aon-icon-reset" value=""
													immediate="true" reRender="articleDocumentData"
													rendered="#{!articleDocument.new}" 
													actionListener="#{articleDocument.onReset}"
													accesskey="#{bundle.aon_key_new_line}">
												</h:commandButton>
											</aon:div>
										</f:facet>
									</aon:column>
							
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="#{appBundle.document_related_name}" />
										</f:facet>
										<aon:div rendered="#{to!=articleDocument.to}" >
											<aon:outputText value="#{to.alias}" >
												<a4j:support 
													reRender="articleDocumentData"
													actionListener="#{articleDocument.onSelect}"
													event="onclick" />
											</aon:outputText>					
										</aon:div>
										<aon:div rendered="#{to==articleDocument.to}">
											<aon:panelGrid columns="2" dir="true">
												<aon:outputText value="#{appBundle.document_related_alias}" />
												<aon:inputText  
													id="Alias"
													size="60" maxlength="255"
													value="#{articleDocument.to.alias}" />
													
												<aon:outputText value="#{appBundle.document_related_title}" />
												<aon:inputText 
													id="Title"
													size="60" maxlength="255"
													value="#{articleDocument.toI18n.title}" />
													
												<aon:outputText value="#{appBundle.document_related}" />
												<aon:div rendered="#{articleDocument.toI18n.file!=null or articleDocument.inputFile!=null}">
													<aon:outputText 
														size="60" maxlength="255"
														value="#{articleDocument.toI18n.file}" />
												</aon:div>
												<aon:div rendered="#{articleDocument.toI18n.file==null and articleDocument.inputFile==null}">
													<t:inputFileUpload id="ArticleDocument_inputFile_edit"
														value="#{articleDocument.inputFile}"
														accept="*/*" size="45"
														storage="file"
														required="true" />
													<h:commandButton value="#{bundle.aon_fileupload_insert}"
														styleClass="aon-icon-attach aon-finding-toolbar-item"
														reRender="articleDocumentData"
														rendered="#{articleDocument.inputFile == null}"
														actionListener="#{articleDocument.fileUploaded}"/>
												</aon:div>
												
												<aon:outputText value="#{appBundle.document_related_description}" 
													for="Description" />
												<aon:inputTextarea
													id="Description"
													cols="60" rows="20" 
													value="#{articleDocument.toI18n.description}"/>
											</aon:panelGrid>
										</aon:div>
										<f:facet name="footer">
											<aon:div rendered="#{articleDocument.new}">
												<aon:panelGrid columns="2" dir="true">
													<aon:outputText value="#{appBundle.document_related_alias}" 
														for="Alias_" />
													<aon:inputText 
														id="Alias_"
														size="80" maxlength="255"
														value="#{articleDocument.to.alias}" />
														
													<aon:outputText value="#{appBundle.document_related_title}" 
														for ="Title_"/>
													<aon:inputText 
														id="Title_"
														size="80" maxlength="255"
														value="#{articleDocument.toI18n.title}" />
														
													<aon:outputText value="#{appBundle.document_related}" 
														for="Description" />
													<aon:div rendered="#{articleDocument.inputFile!=null}">
														<aon:outputText 
															size="90" maxlength="255"
															value="#{articleDocument.toI18n.file}" />
													</aon:div>
													<aon:div rendered="#{articleDocument.inputFile==null}">
														<t:inputFileUpload id="ArticleDocument_inputFile"
															value="#{articleDocument.inputFile}"
															accept="*/*" size="45"
															storage="file"
															required="true"/>
														<h:commandButton value="#{bundle.aon_fileupload_insert}"
															reRender="articleDocumentData"
															styleClass="aon-icon-attach aon-finding-toolbar-item"
															actionListener="#{articleDocument.fileUploaded}"/>
													</aon:div>
													
													<aon:outputText value="#{appBundle.document_related_description}" 
														for="Description_" />
													<aon:inputTextarea
														id="Description_"
														cols="80" rows="20" 
														value="#{articleDocument.toI18n.description}"/>
												</aon:panelGrid>
											</aon:div>
										</f:facet>
									</aon:column>
									
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="&#160;" />
										</f:facet>
										<f:verbatim rendered="#{to!=articleDocument.to}">&#160;</f:verbatim>
										<aon:div rendered="#{to==articleDocument.to}">
											<h:commandButton title="[#{bundle.aon_accept}]"
												styleClass="aon-editDataTable-button aon-icon-accept"
												reRender="articleDocumentData"
												actionListener="#{articleDocument.onAccept}" />
											<h:commandButton title="[#{bundle.aon_cancel}]"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												reRender="articleDocumentData" immediate="true"
												actionListener="#{articleDocument.onCancel}" />
											<h:commandButton title="[#{bundle.aon_remove}]"
												styleClass="aon-editDataTable-button aon-icon-delete"
												reRender="articleDocumentData" immediate="true"
												actionListener="#{articleDocument.onRemove}" />
										</aon:div>
										<f:facet name="footer">
											<aon:div rendered="#{articleDocument.new}">
												<f:verbatim rendered="#{!articleDocument.new}">&#160;</f:verbatim>
												<h:commandButton title="[#{bundle.aon_accept}]"
													styleClass="aon-editDataTable-button aon-icon-accept"
													reRender="articleDocumentData"
													rendered="#{articleDocument.inputFile != null}"
													actionListener="#{articleDocument.onAccept}" />
												<h:commandButton title="[#{bundle.aon_cancel}]"
													styleClass="aon-editDataTable-button aon-icon-cancel"
													reRender="articleDocumentData" immediate="true"
													actionListener="#{articleDocument.onCancel}" />
											</aon:div>
										</f:facet>
									</aon:column>
								</h:dataTable>

		                    </aon:panelTab>

						</aon:panelTabSet>


							
					</rich:panel>

				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
