<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.article}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" 
							rendered="#{cms.roleEditor}"
							value="#{bundle.aon_reset}"
							action="article_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{article.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							action="article_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{article.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="generate" reRender="aonStatus"
							value="#{appBundle.aon_generate}" 
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateArticles}" />
							<a4j:support 
								event="onclick" reRender="poll,grid" 
								actionListener="#{generator_status.onActivePoll}"  
								onclick="javascript:Richfaces.showModalPanel('gen_log');" />
						</aon:commandButton>	
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
						<aon:commandButton id="categories"
							value="#{appBundle.article_category}"
							action="article_category_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{article_category.onSearch}" />
						</aon:commandButton>
						<aon:commandButton id="diary"
							value="#{appBundle.diary}"
							action="diary_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{diary.onInit}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" rows="#{article.pageLimit}" var="to"
					value="#{article.model}" rendered="#{article.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-iconColumn">
			
					<aon:rowSelector
						action="article_form" actionListener="#{article.onSelect}" />
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.article_title}" />
						</f:facet>
						<aon:outputText value="#{article.i18nTitle}"
							styleClass="aon-editDataTable-button"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.article_category}" />
						</f:facet>
						<aon:outputText value="#{to.articleCategory.alias}" styleClass="aon-editDataTable-button" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.article_position}" />
						</f:facet>
						<aon:outputText value="#{to.position}" styleClass="aon-editDataTable-button" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.article_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >										
							<aon:commandLink title="#{appBundle.article_activate}" 
								action="article_list" ajaxSingle="true"
								actionListener="#{article.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="Article_active" alt="#{appBundle.article_activate}"
									url="/images/cms/inactive.png" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.article_deactivate}" 
								action="article_list" ajaxSingle="true"
								actionListener="#{article.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="Article_deactive" alt="#{appBundle.article_deactivate}"
									url="/images/cms/active.png" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>

		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
		
	</ui:define>

</ui:composition>

</body>
</html>
