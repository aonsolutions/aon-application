<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="articleDocumentData">
		<aon:dataTable id="articleDocumentDataTable" 
			value="#{articleDocument.model}" var="to"
			rows="#{articleDocument.pageLimit}"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
					aon-editDataTable-textColumn, aon-editDataTable-textColumn,
					aon-editDataTable-textColumn, aon-editDataTable-textColumn">
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" rendered="#{to==articleDocument.to}" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton id="reset"
							title="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset" value=""
							immediate="true" reRender="articleDocumentData"
							rendered="#{!articleDocument.new}" 
							accesskey="#{bundle.aon_key_new_line}">
							<aon:actionListener method="#{articleDocument.onReset}" />
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.document_related_name}" />
				</f:facet>
				<aon:div rendered="#{to!=articleDocument.to}" >
					<aon:outputText value="#{to.alias}" >
						<a4j:support 
							reRender="articleDocumentData"
							actionListener="#{articleDocument.onSelect}"
							event="onclick" />
					</aon:outputText>					
				</aon:div>
				<aon:div rendered="#{to==articleDocument.to}">
					<aon:panelGrid columns="2" dir="true">
						<aon:outputText value="#{appBundle.cms_alias}" />
						<aon:inputText  
							id="Alias"
							size="60" maxlength="255"
							value="#{articleDocument.to.alias}">
							<f:validator validatorId="AliasValidator" />
						</aon:inputText>
							
						<aon:outputText value="#{appBundle.document_related_title}" />
						<aon:inputText 
							id="Title"
							size="60" maxlength="255"
							value="#{articleDocument.toI18n.title}" />
							
						<aon:outputText value="#{appBundle.document_related}" />
						<aon:outputText 
							size="60" maxlength="255"
							value="#{articleDocument.toI18n.file}" />
						<aon:outputText value="#{bundle.aon_description}" 
							for="Description" />
						<aon:inputTextarea
							id="Description"
							cols="60" rows="20" 
							value="#{articleDocument.toI18n.description}"/>
					</aon:panelGrid>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{articleDocument.new}">
						<aon:panelGrid columns="2" dir="true">
							<aon:outputText value="#{appBundle.cms_alias}" 
								for="Alias_" />
							<aon:inputText 
								id="Alias_"
								size="80" maxlength="255"
								value="#{articleDocument.to.alias}" />
								
							<aon:outputText value="#{appBundle.document_related_title}" 
								for ="Title_"/>
							<aon:inputText 
								id="Title_"
								size="80" maxlength="255"
								value="#{articleDocument.toI18n.title}" />
								
							<aon:outputText value="#{appBundle.document_related}" 
								for="Description" />
							<aon:div>
								<aon:outputText 
									size="60" maxlength="255"
									value="#{articleDocument.toI18n.file}" />
								<aon:fileUpload id="attach_file" 
										width="100%" 
										addControlLabel="#{appBundle.aon_upload_add}" 
										stopControlLabel="#{appBundle.aon_upload_stop}" 
										stopEntryControlLabel="#{appBundle.aon_upload_stop}"
										uploadControlLabel="#{appBundle.aon_upload_upload}"
										cancelEntryControlLabel="#{appBundle.aon_upload_cancel}"
										clearAllControlLabel="#{appBundle.aon_upload_clear_all}" 
										clearControlLabel="#{appBundle.aon_upload_clear}"
										doneLabel="#{appBundle.aon_upload_done}" 
										progressLabel="#{appBundle.aon_upload_progress}" 
										sizeErrorLabel="#{appBundle.aon_upload_size_error}" 
										transferErrorLabel="#{appBundle.aon_upload_transfer_error}" 
										fileUploadListener="#{articleDocument.fileUploaded}"
										immediateUpload="true" autoclear="false" listHeight="70px" listWidth="100%">
									<a4j:support event="onuploadcomplete" reRender="articleDocumentData" />
								</aon:fileUpload>
							</aon:div>

							<aon:outputText value="#{bundle.aon_description}" 
								for="Description_" />
							<aon:inputTextarea
								id="Description_"
								cols="80" rows="20" 
								value="#{articleDocument.toI18n.description}"/>
						</aon:panelGrid>
					</aon:div>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<f:verbatim rendered="#{to!=articleDocument.to}">&#160;</f:verbatim>
				<aon:div rendered="#{to==articleDocument.to}">
					<aon:commandButton title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="articleDocumentData">
						<aon:actionListener method="#{articleDocument.accept}" />
					</aon:commandButton>
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="articleDocumentData" immediate="true">
						<aon:actionListener method="#{articleDocument.onCancel}" />
					</aon:commandButton>
					<aon:commandButton title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						reRender="articleDocumentData" immediate="true">
						<aon:actionListener method="#{articleDocument.onRemove}" />
					</aon:commandButton>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{articleDocument.new}">
						<f:verbatim rendered="#{!articleDocument.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]"
							styleClass="aon-editDataTable-button aon-icon-accept"
							reRender="articleDocumentData" >
							<aon:actionListener method="#{articleDocument.accept}" />
						</aon:commandButton>
						<aon:commandButton title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							reRender="articleDocumentData" immediate="true">
							<aon:actionListener method="#{articleDocument.onCancel}" />
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:dataTable>
									
		<aon:dataScroller2 for="articleDocumentDataTable" />					

	</aon:div>

</ui:composition>
