<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.article}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{bundle.aon_search}" />
				</aon:div>					
					

				<!--  toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="article_list"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionListener method="#{article.onSearch}" />
					</aon:commandButton>					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						rendered="#{cms.roleEditor}"
						action="article_form"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{article.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="cancel"
						value="#{bundle.aon_cancel}"
						action="article_list" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}">
						<aon:actionListener method="#{article.onCancel}" />
					</aon:commandButton>
				</aon:div>			
			<!-- end toolbar navigation -->
			</aon:panelGrid>	
		</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Article_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Article_alias" size="50"
						valueChangeListener="#{article.addExpression}" />

					<aon:outputLabel for="ArticleDetail_title"
						value="#{appBundle.article_title}" />
					<aon:inputText id="ArticleDetail_title" size="50"
						value="#{article.title}" />

					<aon:outputLabel for="ArticleDetail_subtitle"
						value="#{appBundle.article_subtitle}" />
					<aon:inputText id="ArticleDetail_subtitle" size="50"
						value="#{article.subtitle}" />

					<aon:outputLabel for="Article_articleCategory_id"
						value="#{appBundle.article_category}"/>
					<aon:selectOneMenu id="Article_articleCategory_id"  
						valueChangeListener="#{article.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.articleCategoryList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="Article_position"
						value="#{appBundle.article_position}" />
					<aon:inputText id="Article_position" size="10"
						valueChangeListener="#{article.addExpression}" />

					<aon:outputLabel for="Article_publishDate"
						value="#{appBundle.article_publishDate}" />
					<aon:div>
						<aon:outputLabel for="Article_publishDate-From"
							value="#{appBundle.aon_date_from}" />
						<aon:selectInputDate id="Article_publishDate-From"
							value="#{article.dateFromPublish}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>

						<aon:outputLabel for="Article_publishDate-To"
							value="#{appBundle.aon_date_to}" />
						<aon:selectInputDate id="Article_publishDate-To"
							value="#{article.dateToPublish}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>					
	
					<aon:outputLabel for="Article_expireDate"
						value="#{appBundle.article_expireDate}" />
					<aon:div>
						<aon:outputLabel for="Article_expireDate-From"
							value="#{appBundle.aon_date_from}" />
						<aon:selectInputDate id="Article_expireDate-From"
							value="#{article.dateFromExpire}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>

						<aon:outputLabel for="Article_expireDate-To"
							value="#{appBundle.aon_date_to}" />
						<aon:selectInputDate id="Article_expireDate-To"
							value="#{article.dateToExpire}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>					
	
				</aon:panelGrid>
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
