<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition>

		<aon:dataTable id="#{dataTable}" value="#{article.model}" var="to"
			rows="#{article.pageLimit}"
			styleClass="dr-table rich-table aon-editDataTable"
			headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
			footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
			rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
			cellpadding="0" cellspacing="0"
			columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					dr-table-cell rich-table-cell aon-editDataTable-textColumn">
					
			<aon:column>
				<f:facet name="header">
					<aon:div>
						&nbsp;
					</aon:div>	
				</f:facet>
				<aon:selectBooleanCheckbox 
						value="#{article.rowChecked}">
						<a4j:support 
							event="onclick"  
							reRender="#{dataTable},buttonsGridDetailList" />
				</aon:selectBooleanCheckbox>
			</aon:column>
	
			<aon:column>
				<a4j:support 
					immediate="#{true}"
					actionListener="#{article.onSelect}"
					event="onclick"
					reRender="detailEdit,buttonsGridDetailList,div_tab0,div_tab1,div_tab2,div_tab3" />
				<f:facet name="header">
					<aon:outputText value="#{appBundle.article_alias}"/>
				</f:facet>
				<aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button" />
			</aon:column>

			<aon:column>
				<a4j:support 
					immediate="#{true}"
					actionListener="#{article.onSelect}"
					event="onclick"
					reRender="detailEdit,buttonsGridDetailList,div_tab0,div_tab1,div_tab2,div_tab3" />
				<f:facet name="header">
					<aon:outputText value="#{appBundle.article_title}"/>
				</f:facet>
				<aon:outputText value="#{article.i18nTitle}" 
					styleClass="aon-editDataTable-button"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.article_active}" />
				</f:facet>
				<aon:commandLink title="#{appBundle.article_activate}" 
					actionListener="#{article.onActivate}"
					reRender="#{dataTable}"
					rendered="#{!to.active}">
					<aon:graphicImage alt="#{appBundle.article_activate}"
						url="/images/cms/inactive.png" />
				</aon:commandLink>
				<aon:commandLink title="#{appBundle.article_deactivate}" 
					actionListener="#{article.onDeactivate}" 
					reRender="#{dataTable}" 
					rendered="#{to.active}">
					<aon:graphicImage alt="#{appBundle.article_deactivate}"
						url="/images/cms/active.png" />
				</aon:commandLink>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText for="article_position" value="#{appBundle.article_position}" />
				</f:facet>
				<aon:graphicImage rendered="#{to.position == 0}"
					url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
				<aon:commandButton  
					reRender="#{dataTable}"
					actionListener="#{article.onMoveUp}" 
					rendered="#{to.position != 0 and article.to==null}"
					image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
				<aon:commandButton 
					reRender="#{dataTable}" 
					actionListener="#{article.onMoveDown}"
					rendered="#{to.position &lt; (article.model.rowCount - 1)  and article.to==null}"
					image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
			</aon:column>

		</aon:dataTable>

		<rich:datascroller align="left"  for="#{dataTable}" maxPages="#{article.pageLimit}" />

</ui:composition>

</body>
</html>
