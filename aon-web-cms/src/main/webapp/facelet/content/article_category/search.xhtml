<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.article_category}" />
				<ui:param name="controller" value="#{article_category}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{article_category}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="ArticleCategory_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="ArticleCategory_alias" size="50"
						valueChangeListener="#{article_category.addExpression}" />
	
					<aon:outputLabel for="ArticleCategory_position"
						value="#{appBundle.article_category_position}" />
					<aon:inputText id="ArticleCategory_position" size="10"
						valueChangeListener="#{article_category.addExpression}" />
						
					<aon:outputLabel for="ArticleCategory_active"
						value="#{appBundle.article_category_active}" />
					<aon:selectOneMenu id="ArticleCategory_active"
						valueChangeListener="#{article_category.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>						

				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
