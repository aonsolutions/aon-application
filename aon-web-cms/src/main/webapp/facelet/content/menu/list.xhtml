<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="menuList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.menu}" />
				<ui:param name="controller" value="#{menu}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>				
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="parentGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_editing}:" />
					</aon:div>					
						
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{menu.currentType.name}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="tab_0" 
							value="#{appBundle.menu_sidebar}"
							disabled="#{menu.currentType == 'SIDEBAR'}"
							styleClass="aon-finding-toolbar-item-no-icon"
							reRender="menuListDiv,parentGrid"
							actionListener="#{menu.onTab0}" />
						<aon:commandButton id="tab_1" 
							value="#{appBundle.menu_top}"
							disabled="#{menu.currentType == 'TOP'}"
							styleClass="aon-finding-toolbar-item-no-icon"
							reRender="menuListDiv,parentGrid"
							actionListener="#{menu.onTab1}" />
						<aon:commandButton id="tab_2" 
							value="#{appBundle.menu_foot}"
							disabled="#{menu.currentType == 'FOOT'}"
							styleClass="aon-finding-toolbar-item-no-icon"
							reRender="menuListDiv,parentGrid"
							actionListener="#{menu.onTab2}" />
						<aon:commandButton id="tab_3" 
							value="#{appBundle.menu_inner}"
							disabled="#{menu.currentType == 'INNER'}"
							styleClass="aon-finding-toolbar-item-no-icon"
							reRender="menuListDiv,parentGrid"
							actionListener="#{menu.onTab3}" />
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
		
		
			<!--  aon-region-body -->
			<aon:div id="menuListDiv" styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" value="#{menu.model}" var="to"
					rows="#{menu.pageLimit}" 
					columnClasses="aon-editDataTable-textColumn,
							aon-editDataTable-iconColumn">
			
					<aon:rowSelector
						action="menu_form" actionListener="#{menu.onSelect}" />							
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}"  
							styleClass="aon-editDataTable-button"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText for="Menu_defaultMenu" 
								value="#{appBundle.menu_defaultMenu}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																				
							<aon:selectBooleanCheckbox id="Menu_defaultMenu" 
									value="#{to.defaultMenu}" 
									rendered="#{!to.defaultMenu}">
									<a4j:support 
										actionListener="#{menu.defaultMenuChanged}"
										event="onclick"  
										reRender="dataTable,parentGrid" />
							</aon:selectBooleanCheckbox>
							<aon:graphicImage id="Menu_default_blocked" rendered="#{to.defaultMenu}"
								url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" alt="#{appBundle.menu_blocked}"/>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" />

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
