<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.menu}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="menu_form"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{menu.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="parentGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText
						value="#{appBundle.aon_editing}:" />
				</aon:div>					
					
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{menu.currentType.name}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="tab_0" 
						value="#{appBundle.menu_sidebar}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab0}" />
					<aon:commandButton id="tab_1" 
						value="#{appBundle.menu_top}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab1}" />
					<aon:commandButton id="tab_2" 
						value="#{appBundle.menu_foot}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab2}" />
					<aon:commandButton id="tab_3" 
						value="#{appBundle.menu_inner}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab3}" />
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		
		
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">
					
					<aon:dataTable id="dataTable" value="#{menu.model}" var="to"
						styleClass="dr-table rich-table aon-editDataTable"
						rows="#{menu.pageLimit}" 
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn">
				
						<aon:column>
							<a4j:support 
								action="menu_form"
								actionListener="#{menu.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}"  
								styleClass="aon-editDataTable-button"/>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Menu_defaultMenu" 
									value="#{appBundle.menu_defaultMenu}" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Menu_defaultMenu" 
									value="#{to.defaultMenu}" 
									rendered="#{!to.defaultMenu}">
									<a4j:support 
										actionListener="#{menu.defaultMenuChanged}"
										event="onclick"  
										reRender="dataTable,parentGrid" />
							</aon:selectBooleanCheckbox>
							<aon:graphicImage id="Menu_default_blocked" rendered="#{to.defaultMenu}"
								url="/images/cms/selected.gif" alt="#{appBundle.menu_blocked}"/>
						</aon:column>

					</aon:dataTable>
				
					<rich:datascroller align="left"  for="dataTable" maxPages="20" />


			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
