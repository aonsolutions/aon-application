<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="menu">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.menu}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{menu.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="menu_form"
							actionListener="#{menu.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{menu.to!=null or menu.new}"
							action="menu_form"
							actionListener="#{menu.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!menu.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{menu.onRemove}"
							confirmAction="menu_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="menu_list" 
							actionListener="#{menu.onSearch}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true">
	
					<aon:outputLabel for="Menu_alias" style="width:100px"
						value="#{appBundle.menu_alias}" />
					<aon:inputText id="Menu_alias"
						required="true" size="32" maxlength="32"
						value="#{menu.to.alias}" />
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!menu.new}">
				<f:facet name="header">#{appBundle.menu_option}</f:facet>
				
				<aon:panelGrid columns="2" styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
				
					<rich:panel id="detail_list_panel">
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										action="menu_form" actionListener="#{menu_option.onReset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}"/>
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!menu_option.checklistEmpty and menu_option.to==null}" 
										inmediate="true"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{menu_option.onRemoveSelected}" 
										confirmAction="menu_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
						
						<aon:dataTable id="dataTable" value="#{menu_option.model}" var="to"
							rows="#{menu_option.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<f:facet name="header">
									<aon:div>
										&nbsp;
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox id="Row_checked"
										value="#{menu_option.rowChecked}">
										<a4j:support 
											event="onclick"  
											reRender="dataTable,buttonsGrid_list" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									action="menu_form"
									actionListener="#{menu_option.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_option_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									style="font-weight:bold"
									styleClass="aon-editDataTable-button"
									rendered="#{to.separator}"/>
								<aon:outputText value="#{to.alias}"
									rendered="#{!to.separator}" 
									style="padding-left:20px"
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_option_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.menu_option_activate}" action="menu_form"
									actionListener="#{menu_option.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="MenuOption_active" alt="#{appBundle.menu_option_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.menu_option_deactivate}" action="menu_form"
									actionListener="#{menu_option.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="MenuOption_deactive" alt="#{appBundle.menu_option_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText for="MenuOption_position" value="#{appBundle.menu_option_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton id="moveUp" 
									reRender="dataTable"
									actionListener="#{menu_option.onMoveUp}" 
									rendered="#{to.position != 0 and menu_option.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<aon:commandButton id="moveDown"
									reRender="dataTable" 
									actionListener="#{menu_option.onMoveDown}"
									rendered="#{to.position &lt; (menu_option.model.rowCount - 1)  and menu_option.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>

						</aon:dataTable>
							
						<aon:dataScroller dataTable="dataTable"
							model="#{menu_option.model}" showNote="true" />					
					</rich:panel>
					<rich:panel id="detail_edit_panel" rendered="#{menu_option.new or menu_option.to != null}">
        				<f:facet name="header">#{menu_option.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="save_list_form"
										value="#{bundle.aon_save}" 
										rendered="#{menu_option.to!=null or menu_option.new}"
										action="menu_form"
										actionListener="#{menu_option.onAccept}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}"/>
									<aon:commandButton id="cancel_list_form"
										value="#{bundle.aon_cancel}" 
										rendered="#{menu_option.to!=null or menu_option.new}" immediate="#{true}"
										actionListener="#{menu_option.onCancel}" 
										action="menu_form"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}"/>
									<aon:confirmButton id="remove_list_form"
										value="#{bundle.aon_remove}" rendered="#{!menu_option.new}" 
										immediate="true"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{menu_option.onRemove}" 
										confirmAction="menu_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
			
						<aon:div styleClass="aon-scroll-area">
							<aon:panelGrid id="menuOptionGrid" columns="2" dir="true">
			
								<aon:outputLabel for="MenuOption_alias" style="width:100px"
									value="#{appBundle.menu_option_alias}" />
								<aon:inputText id="MenuOption_alias"
									required="true" size="32" maxlength="32"
									value="#{menu_option.to.alias}" />
			
								<aon:outputLabel for="MenuOptionDetail_label"
									value="#{appBundle.menu_option_label}" />
								<aon:inputText id="MenuOptionDetail_label"
									required="true" size="50" maxlength="64"
									value="#{menu_option.toI18n.label}" />
			
								<aon:outputText for="MenuOption_separator"
									value="#{appBundle.menu_option_separator}" />
								<aon:selectBooleanCheckbox id="MenuOption_separator"
										value="#{menu_option.to.separator}">
								</aon:selectBooleanCheckbox>
								
								<aon:outputLabel for="MenuOption_type"
									value="#{appBundle.menu_option_type}" />
								<aon:selectOneMenu id="MenuOption_type" 
									value="#{menu_option.to.type}" >
									<f:selectItems value="#{collections.pageTypes}">
									</f:selectItems>
										<a4j:support 
											ajaxSingle="true"
											event="onchange"  
											reRender="menuOptionGrid" />
								</aon:selectOneMenu> 
			
								<aon:outputLabel for="MenuOption_level"
									value="#{appBundle.menu_option_level}" rendered="#{menu_option.visibleLevel}"/>
								<aon:selectOneMenu id="MenuOption_level" rendered="#{menu_option.visibleLevel}" 
									value="#{menu_option.to.level}" required="true">
									<f:selectItems value="#{menu_option.levels}">
									</f:selectItems>
										<a4j:support 
											ajaxSingle="true"
											event="onchange"  
											reRender="menuOptionGrid" />
								</aon:selectOneMenu>
			
								<aon:outputLabel for="MenuOption_ident"
									value="#{appBundle.menu_option_ident}" rendered="#{menu_option.visibleIdent}"/>
								<aon:selectOneMenu id="MenuOption_ident" rendered="#{menu_option.visibleIdent}" 
									value="#{menu_option.to.ident}">
									<f:selectItems value="#{menu_option.idents}" />
								</aon:selectOneMenu> 
			
								<aon:outputLabel for="MenuOptionDetail_url"
									value="#{appBundle.menu_option_url}" rendered="#{menu_option.visibleUrl}"/>
								<aon:inputText id="MenuOptionDetail_url" rendered="#{menu_option.visibleUrl}"
									size="100" maxlength="255"
									value="#{menu_option.toI18n.url}" />
			
							</aon:panelGrid>
						</aon:div>
					</rich:panel>
				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
