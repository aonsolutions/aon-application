<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
	
		<aon:form id="menuForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.menu}" />
				<ui:param name="controller" value="#{menu}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true">
	
					<aon:outputLabel for="Menu_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Menu_alias"
						required="true" size="32" maxlength="32"
						value="#{menu.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>
				</aon:panelGrid>

				<aon:div id="detail_panel">
					<aon:div styleClass="aon-form-group" rendered="#{!menu.new}">
						<aon:div styleClass="aon-form-group-title">
							<aon:div styleClass="aon-form-group-title-internal">
								<aon:outputLabel for="dataTable" value="#{appBundle.menu_option}" />
							</aon:div>
						</aon:div>
					
						<aon:div rendered="#{menu_option.to == null}">

							<aon:div styleClass="aon-toolbar">
									
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										reRender="detail_panel" 
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{menu_option.onReset}" />
									</aon:commandButton>
							    </aon:div>
									
							</aon:div>
								
							<aon:dataTable id="dataTable" value="#{menu_option.model}" var="to"
								rows="#{menu_option.pageLimit}" rendered="#{menu_option.model.rowCount > 0}"
								columnClasses="aon-editDataTable-textColumn, 
										aon-editDataTable-textColumn, aon-editDataTable-textColumn,
										aon-editDataTable-iconColumn, aon-editDataTable-textColumn">
										
								<aon:rowSelector immediate="true"
									reRender="detail_panel" actionListener="#{menu_option.onSelect}" />							
										
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.cms_alias}"/>
									</f:facet>
									<aon:outputText value="#{to.alias}" 
										style="#{to.separator?'font-weight:bold':'padding-left:20px'}" />
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.cms_label}"/>
									</f:facet>
									<aon:outputText value="#{menu_option.i18nLabel}"  />
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.menu_option_type}"/>
									</f:facet>
									<aon:outputText value="#{to.type}"  />
								</aon:column>
		
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.cms_active}" />
									</f:facet>
									<aon:div onmouseover="disableRowSelector();"
										onmouseout="enableRowSelector();" >								
										<aon:commandLink title="#{appBundle.menu_option_activate}" 
											reRender="dataTable"
											actionListener="#{menu_option.onActivate}" 
											rendered="#{!to.active}">
											<aon:graphicImage id="MenuOption_active" alt="#{appBundle.menu_option_activate}"
												url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
										</aon:commandLink>
										<aon:commandLink title="#{appBundle.menu_option_deactivate}" 
											reRender="dataTable"
											actionListener="#{menu_option.onDeactivate}" 
											rendered="#{to.active}">
											<aon:graphicImage id="MenuOption_deactive" alt="#{appBundle.menu_option_deactivate}"
												url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
										</aon:commandLink>
									</aon:div>
								</aon:column>
		
								<aon:column styleClass="aon-width-80">
									<f:facet name="header">
										<aon:outputText value="#{appBundle.cms_position}" />
									</f:facet>
									<aon:div onmouseover="disableRowSelector();"
										onmouseout="enableRowSelector();" >			
										<aon:commandLink id="moveUp" reRender="dataTable"
											title="#{appBundle.cms_move_up}" immediate="true"
											actionListener="#{menu_option.onMoveUp}" 
											styleClass="aon-margin-right"
											rendered="#{to.position != 0 and menu_option.to==null}">
											<aon:graphicImage alt="#{appBundle.cms_move_up}"
												url="#{aonResource.resolveLocal['/images/cms/up.gif']}" />
										</aon:commandLink>
										<aon:commandLink id="moveDown" reRender="dataTable"
											title="#{appBundle.cms_move_down}" immediate="true"
											actionListener="#{menu_option.onMoveDown}" 
											rendered="#{to.position &lt; (menu_option.model.rowCount - 1) and menu_option.to==null}">
											<aon:graphicImage alt="#{appBundle.cms_move_down}"
												url="#{aonResource.resolveLocal['/images/cms/down.gif']}" />
										</aon:commandLink>
									</aon:div>
								</aon:column>
		
							</aon:dataTable>
								
							<aon:dataScroller2 for="dataTable" showNote="true" />
						</aon:div>					
						
						<c:if test="#{menu_option.new or menu_option.to != null}">
 
							<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
								<aon:valueParam name="toolbarID" default="menuOptionToolbar" />
								<ui:param name="controller" value="#{menu_option}" />
								<ui:param name="innerToolbar" value="#{true}" />
								<ui:param name="skipToolbarDescription" value="#{true}" />
								<ui:param name="skipSearchButton" value="#{true}" />
							</ui:include>
				
							<aon:div styleClass="aon-scroll-area">
								<aon:panelGrid id="menuOptionGrid" columns="2" dir="true">
				
									<aon:outputLabel for="MenuOption_alias" style="width:100px"
										value="#{appBundle.cms_alias}" />
									<aon:inputText id="MenuOption_alias"
										required="true" size="32" maxlength="32"
										value="#{menu_option.to.alias}">
										<f:validator validatorId="AliasValidator" />
									</aon:inputText>
				
									<aon:outputLabel for="MenuOptionDetail_label"
										value="#{appBundle.cms_label}" />
									<aon:inputText id="MenuOptionDetail_label"
										required="true" size="50" maxlength="64"
										value="#{menu_option.toI18n.label}" />
				
									<aon:outputText for="MenuOption_separator"
										value="#{appBundle.menu_option_separator}" />
									<aon:selectBooleanCheckbox id="MenuOption_separator"
										value="#{menu_option.to.separator}">
									</aon:selectBooleanCheckbox>
									
									<aon:outputLabel for="MenuOption_type"
										value="#{appBundle.menu_option_type}" />
									<aon:selectOneMenu id="MenuOption_type" required="true"
										valueChangeListener="#{menu_option.onTypeChange}"
										value="#{menu_option.to.type}" >
										<f:selectItems value="#{collections.pageTypes}" />
										<a4j:support ajaxSingle="true" process="MenuOption_alias,MenuOptionDetail_label,MenuOption_separator"
											event="onchange" reRender="menuOptionGrid" />
									</aon:selectOneMenu> 
				
									<aon:outputLabel for="MenuOption_level"
										value="#{appBundle.menu_option_level}" rendered="#{menu_option.visibleLevel}"/>
									<aon:selectOneMenu id="MenuOption_level" rendered="#{menu_option.visibleLevel}" 
										value="#{menu_option.to.level}" required="true">
										<f:selectItems value="#{menu_option.levels}" />
										<a4j:support ajaxSingle="true" process="MenuOption_alias,MenuOptionDetail_label,MenuOption_separator"
											event="onchange" reRender="menuOptionGrid" />
									</aon:selectOneMenu>
				
									<aon:outputLabel for="MenuOption_ident"
										value="#{appBundle.menu_option_ident}" rendered="#{menu_option.visibleIdent}"/>
									<aon:selectOneMenu id="MenuOption_ident" rendered="#{menu_option.visibleIdent}" 
										value="#{menu_option.to.ident}" required="true">
										<f:selectItems value="#{menu_option.idents}" />
									</aon:selectOneMenu>
				
									<aon:outputLabel for="MenuOptionDetail_url"
										value="#{appBundle.menu_option_url}" rendered="#{menu_option.visibleUrl}"/>
									<aon:inputText id="MenuOptionDetail_url" rendered="#{menu_option.visibleUrl}"
										size="100" maxlength="255"
										value="#{menu_option.toI18n.url}" />
				
								</aon:panelGrid>
							</aon:div>
						</c:if>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
