<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.menu}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="menu_grid"
						actionListener="#{menu.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}"/>
					<aon:confirmButton id="remove"
						value="#{bundle.aon_remove}" rendered="#{!menu.checklistEmpty}" 
						inmediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{menu.onRemoveSelected}"
						confirmAction="menu_grid"
						accesskey="#{bundle.aon_key_remove}"/>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="parentGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText
						value="#{appBundle.aon_editing}:" />
				</aon:div>					
					
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{menu.currentType.name}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="tab_0" title="[#{bundle.aon_accept}]"
						value="#{appBundle.menu_sidebar}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab0}" />
					<aon:commandButton id="tab_1" title="[#{bundle.aon_accept}]"
						value="#{appBundle.menu_top}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab1}" />
					<aon:commandButton id="tab_2" title="[#{bundle.aon_accept}]"
						value="#{appBundle.menu_foot}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab2}" />
					<aon:commandButton id="tab_3" title="[#{bundle.aon_accept}]"
						value="#{appBundle.menu_inner}"
						styleClass="aon-finding-toolbar-item"
						reRender="dataTable,parentGrid"
						actionListener="#{menu.onTab3}" />
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		
		
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">
					
					<aon:dataTable id="dataTable" value="#{menu.model}" var="to"
						rows="20" styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" rendered="#{to==menu.to}" />
							<aon:commandButton rendered="#{to!=menu.to}"
								styleClass="aon-editDataTable-button aon-icon-rowSelector"
								actionListener="#{menu.onSelect}" value="" immediate="true"
								reRender="dataTable">
							</aon:commandButton>
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton id="reset"
										title="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset" value=""
										immediate="true" reRender="dataTable"
										rendered="#{!menu.new}" actionListener="#{menu.onReset}"
										accesskey="#{bundle.aon_key_new_line}">
									</aon:commandButton>
								</aon:div>
							</f:facet>
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:div>
									<aon:outputText value="#{bundle.aon_check}" />
								</aon:div>	
							</f:facet>
							<aon:selectBooleanCheckbox id="Row_checked"
									value="#{menu.rowChecked}"  
									rendered="#{!to.defaultMenu}">
									<a4j:support 
										event="onclick"  
										reRender="dataTable,parentGrid,buttonsGrid" />
							</aon:selectBooleanCheckbox>
							<aon:graphicImage id="Menu_selected_blocked" rendered="#{to.defaultMenu}"
								url="/images/cms/blocked.gif" alt="#{appBundle.menu_blocked}"/>
							<f:facet name="footer">
								<aon:outputText value="&#160;" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<a4j:support 
								action="menu_option_list"
								actionListener="#{menu.onSelectOptions}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" rendered="#{to!=menu.to}" 
								styleClass="aon-editDataTable-button"/>
							<aon:inputText value="#{to.alias}"
								rendered="#{to==menu.to}" size="40" maxlength="64" />
							<f:facet name="footer">
								<aon:div>
									<aon:inputText value="#{menu.to.alias}"
										rendered="#{menu.new}" size="40" maxlength="64" />
								</aon:div>
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Menu_defaultMenu" value="#{appBundle.menu_defaultMenu}" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Menu_defaultMenu" 
									value="#{to.defaultMenu}" 
									rendered="#{!to.defaultMenu}">
									<a4j:support 
										actionListener="#{menu.defaultMenuChanged}"
										event="onclick"  
										reRender="dataTable,parentGrid" />
							</aon:selectBooleanCheckbox>
							<aon:graphicImage id="Menu_default_blocked" rendered="#{to.defaultMenu}"
								url="/images/cms/selected.gif" alt="#{appBundle.menu_blocked}"/>
							<f:facet name="footer">
								<aon:outputText value="&#160;" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<f:verbatim rendered="#{to!=menu.to}">&#160;</f:verbatim>
							<aon:div rendered="#{to==menu.to}">
								<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable,parentGrid"
									actionListener="#{menu.onAccept}" />
								<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable" immediate="true"
									actionListener="#{menu.onCancel}" />
								<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									reRender="dataTable,parentGrid" immediate="true"
									actionListener="#{menu.onRemove}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div rendered="#{menu.new}">
									<f:verbatim rendered="#{!menu.new}">&#160;</f:verbatim>
									<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										reRender="dataTable,parentGrid"
										actionListener="#{menu.onAccept}" />
									<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										reRender="dataTable,parentGrid" immediate="true"
										actionListener="#{menu.onCancel}" />
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:dataTable>
				
					<aon:dataScroller dataTable="dataTable" model="#{menu.model}" />


			</aon:div>
			
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
