<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.banner}" />
				<ui:param name="controller" value="#{banner}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="categories"
						value="#{appBundle.banner_category}"
						action="banner_category_list"
						actionListener="#{banner_category.onSearch}"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
					</aon:commandButton>				
				</ui:define>
			</ui:decorate>
		
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{banner}" />
					<ui:define name="columns">			
					
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_label}" />
							</f:facet>
							<aon:outputText value="#{banner.i18nLabel}" >
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>																					
						</aon:column>
	
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_category}" />
							</f:facet>
							<aon:outputText value="#{to.bannerCategory.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-width-70 aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_position}" />
							</f:facet>
							<aon:outputText value="#{to.position}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_active}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();" >																											
								<aon:commandLink title="#{appBundle.banner_activate}" 
									action="banner_list"
									actionListener="#{banner.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="Banner_active" alt="#{appBundle.banner_activate}"
										url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.banner_deactivate}" 
									action="banner_list"
									actionListener="#{banner.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="Banner_deactive" alt="#{appBundle.banner_deactivate}"
										url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
