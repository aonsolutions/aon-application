<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.banner}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" 
						value="#{bundle.aon_reset}"
						action="banner_form"
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{banner.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="search" 
						value="#{bundle.aon_search}"
						action="banner_search"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionListener method="#{banner.onEditSearch}" />
					</aon:commandButton>
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="categories"
						value="#{appBundle.banner_category}"
						action="banner_category_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item">
						<aon:actionListener method="#{banner_category.onSearch}" />
					</aon:commandButton>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">
					
					<aon:dataTable id="dataTable" value="#{banner.model}" var="to"
						rows="#{banner.pageLimit}" 
						styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn">
				
						<aon:column>
							<a4j:support 
								action="banner_form"
								actionListener="#{banner.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<a4j:support 
								action="banner_form"
								actionListener="#{banner.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_label}" />
							</f:facet>
							<aon:outputText value="#{banner.i18nLabel}"
								styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<a4j:support 
								action="banner_form"
								actionListener="#{banner.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_category}" />
							</f:facet>
							<aon:outputText value="#{to.bannerCategory.alias}" styleClass="aon-editDataTable-button" />
						</aon:column>

						<aon:column>
							<a4j:support 
								action="banner_form"
								actionListener="#{banner.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_position}" />
							</f:facet>
							<aon:outputText value="#{to.position}" styleClass="aon-editDataTable-button" />
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.banner_active}" />
							</f:facet>
							<aon:commandLink title="#{appBundle.banner_activate}" 
								action="banner_list"
								actionListener="#{banner.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="Banner_active" alt="#{appBundle.banner_activate}"
									url="/images/cms/inactive.png" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.banner_deactivate}" 
								action="banner_list"
								actionListener="#{banner.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="Banner_deactive" alt="#{appBundle.banner_deactivate}"
									url="/images/cms/active.png" />
							</aon:commandLink>
						</aon:column>

					</aon:dataTable>
				
					<aon:dataScroller for="dataTable"
						rowCount="#{banner.model.rowCount}"
						page="#{banner.page}"
						showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
