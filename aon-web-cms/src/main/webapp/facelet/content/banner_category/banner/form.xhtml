<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.banner}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{banner.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!banner.new and cms.roleEditor}"
							action="banner_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{banner.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{banner.to!=null or banner.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{banner.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!banner.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{banner.onRemove}"
							confirmAction="banner_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="banner_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{banner.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="banner_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{banner.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{banner.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="categories"
							value="#{appBundle.banner_category}"
							action="banner_category_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{banner_category.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Banner_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Banner_alias"
						required="true" size="32" maxlength="32"
						value="#{banner.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="Banner_category"
						value="#{appBundle.banner_category}"/>
					<aon:selectOneMenu id="Banner_category"  
						required="true"
						value="#{banner.to.bannerCategory.id}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.bannerGroupList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="BannerDetail_label"
						value="#{appBundle.banner_label}" />
					<aon:inputText id="BannerDetail_label"
						required="true" size="80" maxlength="255"
						value="#{banner.toI18n.label}" />

					<aon:outputLabel for="BannerDetail_url"
						value="#{appBundle.banner_url}" />
					<aon:inputText id="BannerDetail_url"
						size="80" maxlength="255"
						value="#{banner.toI18n.url}" />

					<aon:outputLabel for="BannerDetail_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="BannerDetail_description"
						size="80" maxlength="255"
						value="#{banner.toI18n.description}" />

					<aon:outputLabel 
						value="#{appBundle.banner_image}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{banner.toI18n.image}.thumbnail" 
							alt="#{banner.toI18n.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{banner.onDelImage}">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp2" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{banner}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="image" value="#{true}" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>
							        	
					<aon:outputLabel for="Banner_position"
						value="#{appBundle.banner_position}"/>
					<aon:inputText id="Banner_position"
						required="true" size="10" maxlength="8"
						value="#{banner.to.position}" />
					
					<aon:outputLabel for="Banner_active"
						value="#{appBundle.banner_active}"/>
					<aon:selectBooleanCheckbox id="Banner_active" 
						value="#{banner.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
