<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sport_coach_form">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.sport_coach}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!sport_coach.new and cms.roleEditor}"
							reRender="dataTableDiv,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{sport_coach.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{sport_coach.to!=null}"
							reRender="dataTableDiv, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{sport_coach.onAccept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{sport_coach.to!=null}"
							reRender="dataTableDiv, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							accesskey="#{bundle.aon_key_cancel}">
							<aon:actionListener method="#{sport_coach.onCancel}" />
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div id="dataTableDiv" styleClass="aon-scroll-area">

				<aon:dataTable id="dataTable"
					value="#{sport_coach.model}" var="to" 
					rows="#{sport_coach.pageLimit}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
							   aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							   aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

					<aon:rowSelector immediate="true" reRender="dataTableDiv,gridToolbar"
						toggleOnClick="#{sport_coach.to == null}"
						actionListener="#{sport_coach.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="&nbsp;" />
							</aon:div>	
						</f:facet>
						<aon:outputText value="&#160;"  />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="dataTableDiv,gridToolbar"
									rendered="#{!sport_coach.new and cms.roleEditor}"
									actionListener="#{sport_coach.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_coach_sportClub}" />
						</f:facet>
						<aon:outputText value="#{to.sportClub.description}"
							rendered="#{to!=sport_coach.to}" >
						</aon:outputText>	
						<aon:selectOneMenu rendered="#{to==sport_coach.to}"  
							value="#{sport_coach.to.sportClub.id}">
							<f:selectItems value="#{collections.sportClubList}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:div>
								<aon:selectOneMenu rendered="#{sport_coach.new}"  
									value="#{sport_coach.to.sportClub.id}">
									<f:selectItems value="#{collections.sportClubList}" />
								</aon:selectOneMenu>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_coach_job}" />
						</f:facet>
						<aon:outputText value="#{to.job}"
							rendered="#{to!=sport_coach.to}" >
						</aon:outputText>	
						<aon:inputText value="#{sport_coach.to.job}"
							rendered="#{to==sport_coach.to}"
							required="#{true}" size="40" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{sport_coach.to.job}"
									rendered="#{sport_coach.new}"
									required="#{true}" size="40" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_coach_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}"
							rendered="#{to!=sport_coach.to}" >
						</aon:outputText>	
						<aon:inputText value="#{sport_coach.to.name}"
							rendered="#{to==sport_coach.to}"
							required="#{true}" size="40" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{sport_coach.to.name}"
									rendered="#{sport_coach.new}"
									required="#{true}" size="40" />
							</aon:div>
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=sport_coach.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==sport_coach.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTableDiv,gridToolbar">
								<aon:actionListener method="#{sport_coach.onAccept}" />
							</aon:commandButton>
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTableDiv,gridToolbar" immediate="true">
								<aon:actionListener method="#{sport_coach.onCancel}" />
							</aon:commandButton>
							<aon:commandButton id="lineRemove"
								rendered="#{cms.roleEditor}"
								title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTableDiv,gridToolbar" immediate="true"
								actionListener="#{sport_coach.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{sport_coach.new}">
								<f:verbatim rendered="#{!sport_coach.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTableDiv,gridToolbar">
									<aon:actionListener method="#{sport_coach.onAccept}" />
								</aon:commandButton>
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTableDiv,gridToolbar" immediate="true">
									<aon:actionListener method="#{sport_coach.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="dataTable" />					
			
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
