<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.sport_player}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{sport_player.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="sport_player_form"
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{sport_player.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{sport_player.to!=null or sport_player.new}"
							action="sport_player_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{sport_player.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!sport_player.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{sport_player.onRemove}"
							confirmAction="sport_player_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="sport_player_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{sport_player.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="sport_player_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{sport_player.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="home"
							value="#{bundle.aon_home}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{sport_player.onCancel}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">

				<aon:panelTabSet id="menuTabSet">
					<aon:panelTab id="general" label="#{appBundle.aon_content}">
			
						<aon:panelGrid id="main_panel" columns="2" dir="true">
			
							<aon:outputLabel for="sport_player_name" style="width:100px"
								value="#{appBundle.sport_player_name}" />
							<aon:inputText id="sport_player_name"
								required="true" 
								size="50" maxlength="42"
								value="#{sport_player.to.name}" />
		
							<aon:outputLabel for="sport_player_active"
								value="#{appBundle.sport_player_active}"/>
							<aon:selectBooleanCheckbox id="sport_player_active" 
								value="#{sport_player.to.active}" />
		
							<aon:outputLabel for="sport_player_sport_club"
								value="#{appBundle.sport_player_sportClub}"/>
							<aon:selectOneMenu id="sport_player_sport_club"  
								value="#{sport_player.to.sportClub.id}">
								<f:selectItems value="#{collections.sportClubList}" />
							</aon:selectOneMenu>
		
							<aon:outputLabel for="sport_player_number" style="width:100px"
								value="#{appBundle.sport_player_number}" />
							<aon:inputText id="sport_player_number"
								required="true" 
								size="5" maxlength="3"
								value="#{sport_player.to.number}" />
		
							<aon:outputLabel for="sport_player_sport_position"
								value="#{appBundle.sport_player_sportPosition}"/>
							<aon:selectOneMenu id="sport_player_sport_position"  
								value="#{sport_player.to.sportPosition.id}">
								<f:selectItems value="#{collections.sportPositionList}" />
							</aon:selectOneMenu>
		
							<aon:outputLabel for="sport_player_born_date"
								value="#{appBundle.sport_player_bornDate}" />
							<aon:selectInputDate id="sport_player_born_date"
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{sport_player.to.bornDate}" renderAsPopup="true"
								 enableManualInput="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>	
		
							<aon:outputLabel for="sport_player_born_place" style="width:100px"
								value="#{appBundle.sport_player_bornPlace}" />
							<aon:inputText id="sport_player_born_place"
								size="30" maxlength="24"
								value="#{sport_player.to.bornPlace}" />
														
							<aon:outputLabel for="sport_player_weight" style="width:100px"
								value="#{appBundle.sport_player_weight}" />
							<aon:inputText id="sport_player_weight"
								size="6" maxlength="5"
								value="#{sport_player.to.weight}" />
														
							<aon:outputLabel for="sport_player_height" style="width:100px"
								value="#{appBundle.sport_player_lenght}" />
							<aon:inputText id="sport_player_height"
								size="6" maxlength="5"
								value="#{sport_player.to.lenght}" />
														
							<aon:outputLabel for="sport_player_sport_nationality"
								value="#{appBundle.sport_player_sportNationality}"/>
							<aon:selectOneMenu id="sport_player_sport_nationality"  
								value="#{sport_player.to.sportNationality.id}">
								<f:selectItems value="#{collections.sportNationalityList}" />
							</aon:selectOneMenu>
		
							<aon:outputLabel for="sport_player_sport_comunitary"
								value="#{appBundle.sport_player_comunitary}"/>
							<aon:div>
								<aon:selectBooleanCheckbox id="sport_player_sport_comunitary" 
									value="#{sport_player.to.comunitary}" />
							</aon:div>
		
							<aon:outputLabel for="sport_player_photo" style="width:100px"
								value="#{appBundle.sport_player_photo}" />
							<aon:panelGroup id="photo_preview">
								<aon:graphicImage 
									url="#{sport_player.to.photo}.thumbnail" 
									alt="#{sport_player.to.photo}"/>
				                <aon:commandLink
				                	immediate="#{true}"
				                	reRender="photo_preview"
				                    actionListener="#{sport_player.onDelImage}">
									<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
				        		</aon:commandLink>
								<ui:include src="/facelet/content/utils/image_modal.xhtml">
									<ui:param name="modalPanelName" value="mp" />
									<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
									<ui:param name="listenerBean" value="#{sport_player}" />
									<ui:param name="reRender" value="photo_preview" />
									<ui:param name="thumbnail" value="#{false}" />
								</ui:include>
				        	</aon:panelGroup>
				        	
						</aon:panelGrid>
					</aon:panelTab>
	
					<aon:panelTab id="career" label="#{appBundle.sport_career_path}"
						rendered="#{!sport_player.new}">

						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="gridToolbar" columns="3" dir="true"
								columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
			
								<aon:div styleClass="aon-finding-toolbar-item-group">
			
									<aon:commandButton id="reset_lines" value="#{bundle.aon_reset}"
										rendered="#{!sport_career_path.new and cms.roleEditor}"
										reRender="dataTable,gridToolbar"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{sport_career_path.onReset}" />
									</aon:commandButton>
									<aon:commandButton id="save_lines" value="#{bundle.aon_save}"
										rendered="#{sport_career_path.to!=null}"
										reRender="dataTable, gridToolbar"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}">
										<aon:actionListener method="#{sport_career_path.onAccept}" />
									</aon:commandButton>
									<aon:commandButton id="cancel_lines" value="#{bundle.aon_cancel}"
										rendered="#{sport_career_path.to!=null}"
										reRender="dataTable, gridToolbar"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										immediate="#{true}"
										accesskey="#{bundle.aon_key_cancel}">
										<aon:actionListener method="#{sport_career_path.onCancel}" />
									</aon:commandButton>
								</aon:div>
							</aon:panelGrid>
						</aon:div>
			
						<aon:div styleClass="aon-scroll-area">
			
							<aon:dataTable id="dataTable"
								value="#{sport_career_path.model}" var="to" 
								rows="#{sport_career_path.pageLimit}"
								columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
										   aon-editDataTable-textColumn, aon-editDataTable-textColumn,
										   aon-editDataTable-buttonsColumn">
			
								<aon:column>
									<f:facet name="header">
										<aon:div>
											<aon:outputText value="&nbsp;" />
										</aon:div>	
									</f:facet>
									<aon:outputText value="&#160;" />
									<f:facet name="footer">
										<aon:div>
											<aon:commandButton id="reset"
												title="[#{bundle.aon_reset}]"
												styleClass="aon-editDataTable-button aon-icon-reset"
												value="" immediate="true"
												reRender="dataTable,gridToolbar"
												rendered="#{!sport_career_path.new and cms.roleEditor}"
												actionListener="#{sport_career_path.onReset}"
												accesskey="#{bundle.aon_key_new_line}">
											</aon:commandButton>
										</aon:div>
									</f:facet>
								</aon:column>
			
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.sport_career_path_sportClub}" />
									</f:facet>
									<aon:outputText value="#{to.club}"
										rendered="#{to!=sport_career_path.to}" 
										styleClass="aon-editDataTable-button">
										<a4j:support 
											reRender="dataTable,gridToolbar"
											actionListener="#{sport_career_path.onSelect}"
											event="onclick" />
									</aon:outputText>	
									<aon:inputText value="#{sport_career_path.to.club}"
										rendered="#{to==sport_career_path.to}"
										required="#{true}" size="40" maxlength="64" />
									<f:facet name="footer">
										<aon:div>
											<aon:inputText value="#{sport_career_path.to.club}"
												rendered="#{sport_career_path.new}"
												required="#{true}" size="40" maxlength="64" />
										</aon:div>
									</f:facet>
								</aon:column>
			
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.sport_career_path_initDate}" />
									</f:facet>
									<aon:outputText value="#{to.initDate}"
										rendered="#{to!=sport_career_path.to}" 
										styleClass="aon-editDataTable-button">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
										<a4j:support 
											reRender="dataTable,gridToolbar"
											actionListener="#{sport_career_path.onSelect}"
											event="onclick" />
									</aon:outputText>	
									<aon:selectInputDate rendered="#{to==sport_career_path.to}"
										 style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 value="#{sport_career_path.to.initDate}" renderAsPopup="true"
										 enableManualInput="true"
										 popupDateFormat="#{bundle.aon_date_pattern}">
										 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
									</aon:selectInputDate>	
									<f:facet name="footer">
										<aon:div>
											<aon:selectInputDate rendered="#{sport_career_path.new}"
												 style="z-index:2001;margin:0;vertical-align:middle;"
												 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
												 value="#{sport_career_path.to.initDate}" renderAsPopup="true"
												 enableManualInput="true"
												 popupDateFormat="#{bundle.aon_date_pattern}">
												 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
											</aon:selectInputDate>	
										</aon:div>
									</f:facet>
								</aon:column>
			
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.sport_career_path_endDate}" />
									</f:facet>
									<aon:outputText value="#{to.endDate}"
										rendered="#{to!=sport_career_path.to}" 
										styleClass="aon-editDataTable-button">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
										<a4j:support 
											reRender="dataTable,gridToolbar"
											actionListener="#{sport_career_path.onSelect}"
											event="onclick" />
									</aon:outputText>	
									<aon:selectInputDate rendered="#{to==sport_career_path.to}"
										 style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 value="#{sport_career_path.to.endDate}" renderAsPopup="true"
										 enableManualInput="true"
										 popupDateFormat="#{bundle.aon_date_pattern}">
										 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
									</aon:selectInputDate>	
									<f:facet name="footer">
										<aon:div>
											<aon:selectInputDate rendered="#{sport_career_path.new}"
												 style="z-index:2001;margin:0;vertical-align:middle;"
												 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
												 value="#{sport_career_path.to.endDate}" renderAsPopup="true"
												 enableManualInput="true"
												 popupDateFormat="#{bundle.aon_date_pattern}">
												 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
											</aon:selectInputDate>	
										</aon:div>
									</f:facet>
								</aon:column>
			
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<f:verbatim rendered="#{to!=sport_career_path.to}">&#160;</f:verbatim>
									<aon:div rendered="#{to==sport_career_path.to}">
										<aon:commandButton id="lineAccept"
											title="[#{bundle.aon_accept}]"
											styleClass="aon-editDataTable-button aon-icon-accept"
											reRender="dataTable,gridToolbar"
											actionListener="#{sport_career_path.onAccept}">
										</aon:commandButton>
										<aon:commandButton id="lineCancel"
											title="[#{bundle.aon_cancel}]"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											reRender="dataTable,gridToolbar" immediate="true">
											<aon:actionListener method="#{sport_career_path.onCancel}" />
										</aon:commandButton>
										<aon:commandButton id="lineRemove"
											rendered="#{cms.roleEditor}"
											title="[#{bundle.aon_remove}]"
											styleClass="aon-editDataTable-button aon-icon-delete"
											reRender="dataTable,gridToolbar" immediate="true"
											actionListener="#{sport_career_path.onRemove}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div rendered="#{sport_career_path.new}">
											<f:verbatim rendered="#{!sport_career_path.new}">&#160;</f:verbatim>
											<aon:commandButton id="newAccept"
												title="[#{bundle.aon_accept}]"
												styleClass="aon-editDataTable-button aon-icon-accept"
												reRender="dataTable,gridToolbar">
												<aon:actionListener method="#{sport_career_path.onAccept}" />
											</aon:commandButton>
											<aon:commandButton id="newCancel"
												title="[#{bundle.aon_cancel}]"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												reRender="dataTable,gridToolbar" immediate="true">
												<aon:actionListener method="#{sport_career_path.onCancel}" />
											</aon:commandButton>
										</aon:div>
									</f:facet>
								</aon:column>
							</aon:dataTable>
			
							<aon:dataScroller2 for="dataTable" showNote="true" />					
						
						</aon:div>
						
					</aon:panelTab>
					
				</aon:panelTabSet>

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
