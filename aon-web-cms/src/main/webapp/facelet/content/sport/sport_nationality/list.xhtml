<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sport_nationality_form">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.sport_nationality}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!sport_nationality.new and cms.roleEditor}"
							reRender="dataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{sport_nationality.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{sport_nationality.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{sport_nationality.onAccept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{sport_nationality.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							accesskey="#{bundle.aon_key_cancel}">
							<aon:actionListener method="#{sport_nationality.onCancel}" />
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="dataTable"
					value="#{sport_nationality.model}" var="to" 
					rows="#{sport_nationality.pageLimit}"
					columnClasses="aon-editDataTable-iconColumn,  aon-editDataTable-textColumn,
							   aon-editDataTable-textColumn, aon-editDataTable-iconColumn,
							   aon-editDataTable-buttonsColumn">

					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="&nbsp;" />
							</aon:div>	
						</f:facet>
						<aon:outputText value="&#160;" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="dataTable,gridToolbar"
									rendered="#{!sport_nationality.new and cms.roleEditor}"
									actionListener="#{sport_nationality.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}"
							rendered="#{to!=sport_nationality.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{sport_nationality.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:inputText value="#{to.alias}"
							id="#{to.id}_alias"
							rendered="#{to==sport_nationality.to}"
							required="#{true}" size="35" maxlength="32">
							<f:validator validatorId="AliasValidator" />
						</aon:inputText>
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{sport_nationality.to.alias}"
									id="new_alias"
									rendered="#{sport_nationality.new}"
									required="#{true}" size="35" maxlength="32">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_nationality_desciption}" />
						</f:facet>
						<aon:outputText value="#{sport_nationality.i18nDescription}"
							rendered="#{to!=sport_nationality.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{sport_nationality.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:inputText value="#{sport_nationality.toI18n.description}"
							id="#{to.id}_description"
							rendered="#{to==sport_nationality.to}"
							required="#{true}" size="70" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{sport_nationality.toI18n.description}"
									id="new_description"
									rendered="#{sport_nationality.new}"
									required="#{true}" size="70" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_nationality_image}" />
						</f:facet>
							<aon:div rendered="#{to==sport_nationality.to}">
								<aon:panelGroup id="thumbnail_preview_1">
									<aon:graphicImage 
										url="#{sport_nationality.to.image}.thumbnail" 
										alt="#{sport_nationality.to.image}"/>
					                <aon:commandLink
					                	immediate="#{true}"
					                	reRender="thumbnail_preview_1"
					                    actionListener="#{sport_nationality.onDelImage}">
										<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
					        		</aon:commandLink>
									<ui:include src="/facelet/content/utils/image_modal.xhtml">
										<ui:param name="modalPanelName" value="mp" />
										<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
										<ui:param name="galleryBean" value="#{gallery}" />
										<ui:param name="listenerBean" value="#{sport_nationality}" />
										<ui:param name="reRender" value="thumbnail_preview_1" />
										<ui:param name="image" value="#{true}" />
										<ui:param name="thumbnail" value="#{false}" />
									</ui:include>
					        	</aon:panelGroup>
							</aon:div>
							<aon:graphicImage rendered="#{to!=sport_nationality.to}"
								url="#{to.image}.thumbnail" 
								alt="#{to.image}"/>
						<f:facet name="footer">
							<aon:div rendered="#{sport_nationality.new}">
								<aon:panelGroup id="thumbnail_preview_2">
									<aon:graphicImage 
										url="#{sport_nationality.to.image}.thumbnail" 
										alt="#{sport_nationality.to.image}"/>
					                <aon:commandLink
					                	immediate="#{true}"
					                	reRender="thumbnail_preview_2"
					                    actionListener="#{sport_nationality.onDelImage}">
										<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
					        		</aon:commandLink>
									<ui:include src="/facelet/content/utils/image_modal.xhtml">
										<ui:param name="modalPanelName" value="mp_new" />
										<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
										<ui:param name="galleryBean" value="#{gallery}" />
										<ui:param name="listenerBean" value="#{sport_nationality}" />
										<ui:param name="reRender" value="thumbnail_preview_2" />
										<ui:param name="image" value="#{true}" />
										<ui:param name="thumbnail" value="#{false}" />
									</ui:include>
					        	</aon:panelGroup>
					        </aon:div>
				        </f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=sport_nationality.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==sport_nationality.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable,gridToolbar">
								<aon:actionListener method="#{sport_nationality.onAccept}" />
							</aon:commandButton>
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable,gridToolbar" immediate="true">
								<aon:actionListener method="#{sport_nationality.onCancel}" />
							</aon:commandButton>
							<aon:commandButton id="lineRemove"
								title="[#{bundle.aon_remove}]"
								rendered="#{cms.roleEditor}"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable,gridToolbar" immediate="true"
								actionListener="#{sport_nationality.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{sport_nationality.new}">
								<f:verbatim rendered="#{!sport_nationality.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable,gridToolbar">
									<aon:actionListener method="#{sport_nationality.onAccept}" />
								</aon:commandButton>
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable,gridToolbar" immediate="true">
									<aon:actionListener method="#{sport_nationality.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="dataTable" showNote="true" />					
			
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
