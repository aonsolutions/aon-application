<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="generatorForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="HIRU"/>	  						
					</aon:div>					

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_editing}" />
					</aon:div>
					
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="generate"
							rendered="#{cms.roleEditor or cms.rolePublisher}"
							value="#{appBundle.aon_generate}" 
							reRender="generatorForm"
							actionListener="#{hiru_generator.onGenerateXmlFiles}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick"
								actionListener="#{hiru_generator.onActivePoll}"  
								reRender="poll,grid_messages" />
						</aon:commandButton>
						<aon:commandButton id="publish"
							value="#{appBundle.aon_publish}" 
							reRender="generatorForm"
							rendered="#{hiru_generator.generated and cms.rolePublisher}"
							actionListener="#{hiru_generator.onPublish}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick"
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid_messages" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

		</aon:form>
	    <a4j:region>
	        <h:form>
	            <a4j:poll id="poll" interval="2000" enabled="#{hiru_generator.activePoll}" reRender="poll,grid_messages"/>
	        </h:form>
	    </a4j:region>
		<h:form>
			<rich:panel bodyClass="inpanelBody" id="grid_messages">
	        	<f:facet name="header">
	                    Console Log
	            </f:facet>
		        <rich:dataList id="dataList_Messages" var="msg" value="#{hiru_generator.messages}" rows="20">
					<h:outputText style="color:red;" value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList_Messages" maxPages="20" />
			</rich:panel>
		</h:form>
	</ui:define>
</ui:composition>

</body>
</html>
