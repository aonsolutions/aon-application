<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="headerForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.footer}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{footer.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="footer_form"
							rendered="#{!footer.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{footer.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{footer.to!=null or footer.new}"
							action="footer_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{footer.onAccept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!footer.new and !footer.to.default_}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{footer.onRemove}" 
							confirmAction="footer_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="footer_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{footer.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>		
					
			<aon:panelTabSet id="tabPanelTypesForm"> 
				<aon:panelTab id="contentTab" label="#{appBundle.aon_content}">
		
					<aon:div styleClass="aon-scroll-area">
						<aon:div style="width:99%;">
			
							<aon:panelGrid columns="2" dir="true">
								<aon:outputText value="#{appBundle.cms_alias}" 
									for="alias"/>
								<aon:inputText id="alias" 
									value="#{footer.to.alias}" size="40" maxlength="64" />
								
								<aon:outputLabel for="menu"
									value="#{appBundle.footer_menu}"/>
								<aon:selectOneMenu id="menu"  
									value="#{footer.to.menu.id}">
									<f:selectItems value="#{collections.menuFootList}" />
								</aon:selectOneMenu> 
									
								<aon:outputLabel for="content"
									value="#{appBundle.footer_content}" />
								<aon:div style="width:600px">
									<aon:inputRichText style="width:100%" 
										id="content" 
										value="#{footer.toI18n.content}" />
								</aon:div>
							
							</aon:panelGrid>
						</aon:div>
		
					</aon:div>
			
				</aon:panelTab>

				<aon:panelTab id="meta_tags" label="#{appBundle.banner_category}"
					rendered="#{!footer.new}">

					<aon:dataTable id="footer_banner_category_Data" 
						value="#{footer_banner_category.model}" var="to"
						rows="#{footer_banner_category.pageLimit}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
								aon-editDataTable-buttonsColumn">
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" rendered="#{to==footer_banner_category.to}" />
							<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
								rendered="#{to!=footer_banner_category.to}"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="footer_banner_category_Data" immediate="true">
								<aon:actionListener method="#{footer_banner_category.onRemoveRow}" />
							</aon:commandButton>
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton id="reset"
										title="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset" value=""
										immediate="true" reRender="footer_banner_category_Data"
										rendered="#{!footer_banner_category.new}" 
										accesskey="#{bundle.aon_key_new_line}">
										<aon:actionListener method="#{footer_banner_category.onReset}" />
									</aon:commandButton>
								</aon:div>
							</f:facet>
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_alias}" />
							</f:facet>
							<aon:outputText value="#{to.bannerCategory.alias}" 
								rendered="#{to!=footer_banner_category.to}" />
							<f:facet name="footer">
								<aon:selectOneMenu styleClass="aon-form-selectOneMenu-field"
									rendered="#{footer_banner_category.new}" 
									value="#{footer_banner_category.to.bannerCategory.id}">
									<f:selectItems value="#{collections.bannerGroupList}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<f:verbatim rendered="#{to!=footer_banner_category.to}">&#160;</f:verbatim>
							<f:facet name="footer">
								<aon:div rendered="#{footer_banner_category.new}">
									<f:verbatim rendered="#{!footer_banner_category.new}">&#160;</f:verbatim>
									<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										reRender="footer_banner_category_Data">
										<aon:actionListener method="#{footer_banner_category.onAccept}" />
									</aon:commandButton>
									<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										reRender="footer_banner_category_Data" immediate="true">
										<aon:actionListener method="#{footer_banner_category.onCancel}" />
									</aon:commandButton>
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:dataTable>
					
					<aon:dataScroller2 for="footer_banner_category_Data" showNote="true" />					
					
				</aon:panelTab>			

			</aon:panelTabSet>
			
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
