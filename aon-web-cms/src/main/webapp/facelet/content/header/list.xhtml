<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="headerList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.header}" />
				<ui:param name="controller" value="#{cmsHeader}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{cmsHeader}" />
					<ui:define name="columns">			
							
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText for="Header_defaultMenu" 
									value="#{appBundle.menu_defaultMenu}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();" >																				
								<aon:selectBooleanCheckbox id="Header_defaultMenu" 
									value="#{to.default_}" rendered="#{!to.default_}">
									<a4j:support 
										actionListener="#{cmsHeader.defaultChanged}"
										event="onclick"  
										reRender="#{dataTableId}" />
								</aon:selectBooleanCheckbox>
							</aon:div>
							<aon:graphicImage id="Header_default_blocked" 
								rendered="#{to.default_}"
								url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" 
								alt="#{appBundle.menu_blocked}"/>
						</aon:column>
					</ui:define>
				</ui:decorate>					
					
			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
