<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="productForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.product}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{product.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="product_form"
							rendered="#{!product.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{product.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{product.to!=null or product.new}"
							action="product_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{product.onAccept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!product.new}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{product.onRemove}" 
							confirmAction="product_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="product_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{product.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>		
					
			<aon:div styleClass="aon-scroll-area" style="width:99%;">
	
					<aon:panelGrid columns="2" dir="true" style="width:750px;">
							
							<aon:outputLabel for="product_alias"
								value="#{appBundle.product_alias}" />
							<aon:inputText id="product_alias"
								required="true" size="32" maxlength="32"
								value="#{product.to.alias}" />

							<aon:outputLabel for="productDetail_shortLabel"
								value="#{appBundle.product_shorLabel}" />
							<aon:inputText id="productDetail_shortLabel"
								size="80" maxlength="64"
								value="#{product.toI18n.shortLabel}" />
								
							<aon:outputLabel for="productDetail_label"
								value="#{appBundle.product_label}" />
							<aon:inputRichText id="productDetail_label" 
								toolbarSet="Default" 
								value="#{product.toI18n.label}" />
								
							<aon:outputLabel for="product_brand"
								value="#{appBundle.product_brand}" />
							<aon:selectOneMenu id="product_brand"  
								value="#{product.to.brand.id}">
								<f:selectItems value="#{collections.brands}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="product_category"
								value="#{appBundle.product_category}" />
							<aon:selectOneMenu id="product_category"  
								value="#{product.to.productCategory.id}">
								<f:selectItems value="#{collections.categories}" />
							</aon:selectOneMenu> 
							
					</aon:panelGrid>

			</aon:div>
			
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
