<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.product_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{productCategory.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!product_category.new and cms.roleEditor}"
							action="product_category_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{productCategory.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{productCategory.to!=null or productCategory.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{productCategory.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!productCategory.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{productCategory.onRemove}"
							confirmAction="product_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="product_category_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{productCategory.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="product_category_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{productCategory.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{productCategory.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{productCategory.onCancel}" />
						</aon:commandButton>
						<!-- 
						<aon:commandButton id="partial_generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{productCategory.to!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateCurrentProductCategory}" />
							<a4j:support 
								event="onclick" 
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid" 
								onclick="javascript:Richfaces.showModalPanel('gen_log',{width:680, top:100});" />
						</aon:commandButton>
						 -->
				    </aon:div>
					
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="ProductCategory_alias" style="width:100px"
						value="#{appBundle.product_category_alias}" />
					<aon:inputText id="ProductCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{productCategory.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="ProductCategoryDetail_label"
						value="#{appBundle.product_category_label}" />
					<aon:inputText id="ProductCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{productCategory.toI18n.label}" />

					<aon:outputLabel for="ProductCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="ProductCategory_section"  
						value="#{productCategory.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ProductCategory_active"
						value="#{appBundle.product_category_active}"/>
					<aon:selectBooleanCheckbox id="ProductCategory_active" 
						value="#{productCategory.to.active}" />
						
				</aon:panelGrid>
			</aon:div>
		
			<aon:div id="detail_panel" rendered="#{!productCategory.new and productCategory.toI18n.id != null}">

					<rich:panel id="detail_list_panel" rendered="#{subCategory.to==null}">
						<f:facet name="header">#{appBundle.product_subcategory} - #{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!subCategory.new and cms.roleEditor}"
										reRender="detail_panel"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{subCategory.onReset}" />
									</aon:commandButton>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
						
						<aon:dataTable id="dataTable" value="#{subCategory.model}" var="to"
							rows="#{subCategory.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn">
									
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									reRender="detail_panel"
									actionListener="#{subCategory.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.product_category_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<a4j:support 
									immediate="#{true}"
									reRender="detail_panel"
									actionListener="#{subCategory.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.product_category_label}"/>
								</f:facet>
								<aon:outputText value="#{subCategory.i18nLabel}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.product_category_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.product_category_activate}" 
									actionListener="#{subCategory.onActivate}"
									reRender="dataTable"
									rendered="#{!to.active}">
									<aon:graphicImage id="subCategory_active" alt="#{appBundle.product_category_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.product_category_deactivate}" 
									reRender="dataTable"
									actionListener="#{subCategory.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="subCategory_deactive" alt="#{appBundle.link_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

						</aon:dataTable>

						<aon:dataScroller for="dataTable"
							rowCount="#{subCategory.model.rowCount}" 
							showNote="true" />					
							
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{subCategory.new or subCategory.to != null}">
        				<f:facet name="header">#{appBundle.product_subcategory} - #{subCategory.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list_form" value="#{bundle.aon_reset}"
										rendered="#{!subCategory.new and cms.roleEditor}"
										reRender="detail_panel"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{subCategory.onReset}" />
									</aon:commandButton>
									<aon:commandButton id="save_list_form"
										value="#{bundle.aon_save}" 
										rendered="#{subCategory.to!=null or subCategory.new}"
										reRender="detail_panel"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}">
										<aon:actionListener method="#{subCategory.accept}" />
									</aon:commandButton>
									<aon:commandButton id="cancel_list_form"
										value="#{bundle.aon_cancel}" 
										rendered="#{subCategory.to!=null or subCategory.new}" immediate="#{true}"
										reRender="detail_panel"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}">
										<aon:actionListener method="#{subCategory.onCancel}" />
									</aon:commandButton>
									<aon:confirmButton id="remove_list_form"
										value="#{bundle.aon_remove}" 
										rendered="#{!subCategory.new and cms.roleEditor}" 
										immediate="true"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{subCategory.onRemove}" 
										confirmAction="product_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>

							</aon:panelGrid>
						</aon:div>
			
						<aon:div styleClass="aon-scroll-area">
							<aon:panelGrid id="optionGrid" columns="2" dir="true">

								<aon:outputLabel for="ProductSubCategory_alias" style="width:100px"
									value="#{appBundle.product_category_alias}" />
								<aon:inputText id="ProductSubCategory_alias"
									required="true" size="32" maxlength="32"
									value="#{subCategory.to.alias}">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
			
								<aon:outputLabel for="ProductSubCategoryDetail_label"
									value="#{appBundle.product_category_label}" />
								<aon:inputText id="ProductSubCategoryDetail_label"
									required="true" size="50" maxlength="64"
									value="#{subCategory.toI18n.label}" />
			
								<aon:outputLabel for="ProductSubCategory_section"
									value="#{appBundle.section}"/>
								<aon:selectOneMenu id="ProductSubCategory_section"  
									value="#{subCategory.to.section.id}">
									<f:selectItem itemLabel="-" itemValue="-1" />
									<f:selectItems value="#{collections.sectionList}" />
								</aon:selectOneMenu>
																		
							</aon:panelGrid>
						</aon:div>
					</rich:panel>
					
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
