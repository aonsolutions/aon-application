<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="brand_form">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.brand}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!brand.new and cms.roleEditor}"
							reRender="dataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{brand.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{brand.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{brand.onAccept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{brand.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							accesskey="#{bundle.aon_key_cancel}">
							<aon:actionListener method="#{brand.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{productCategory.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{brand.onCancel}" />
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="dataTable"
					value="#{brand.model}" var="to" rows="#{brand.pageLimit}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
							   aon-editDataTable-textColumn, aon-editDataTable-iconColumn,
							   aon-editDataTable-buttonsColumn">

					<aon:rowSelector immediate="true" reRender="dataTable,gridToolbar"
						 actionListener="#{brand.onSelect}" />																		

					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="&#160;" />
							</aon:div>	
						</f:facet>
						<aon:outputText value="&#160;" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="dataTable,gridToolbar"
									rendered="#{!brand.new and cms.roleEditor}"
									actionListener="#{brand.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}"
							rendered="#{to!=brand.to}" 
							styleClass="aon-editDataTable-button">
						</aon:outputText>	
						<aon:inputText value="#{to.alias}"
							id="#{to.id}_alias"
							rendered="#{to==brand.to}"
							required="#{true}" size="35" maxlength="32">
							<f:validator validatorId="AliasValidator" />
						</aon:inputText>
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{brand.to.alias}"
									id="new_alias"
									rendered="#{brand.new}"
									required="#{true}" size="35" maxlength="32">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.brand_label}" />
						</f:facet>
						<aon:outputText value="#{brand.i18nLabel}"
							rendered="#{to!=brand.to}" 
							styleClass="aon-editDataTable-button">
						</aon:outputText>	
						<aon:inputText value="#{brand.toI18n.label}"
							id="#{to.id}_label"
							rendered="#{to==brand.to}"
							required="#{true}" size="70" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{brand.toI18n.label}"
									id="new_label"
									rendered="#{brand.new}"
									required="#{true}" size="70" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.brand_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																																					
							<aon:commandLink title="#{appBundle.brand_activate}" 
								reRender="dataTable"
								actionListener="#{brand.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="Brand_active" alt="#{appBundle.brand_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.brand_deactivate}" 
								reRender="dataTable"
								actionListener="#{brand.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="Brand_deactive" alt="#{appBundle.brand_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>
						
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=brand.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==brand.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable,gridToolbar">
								<aon:actionListener method="#{brand.onAccept}" />
							</aon:commandButton>
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable,gridToolbar" immediate="true">
								<aon:actionListener method="#{brand.onCancel}" />
							</aon:commandButton>
							<aon:commandButton id="lineRemove"
								rendered="#{cms.roleEditor}"
								title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable,gridToolbar" immediate="true"
								actionListener="#{brand.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<f:verbatim rendered="#{!brand.new}">&#160;</f:verbatim>
							<aon:div rendered="#{brand.new}">
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable,gridToolbar">
									<aon:actionListener method="#{brand.onAccept}" />
								</aon:commandButton>
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable,gridToolbar" immediate="true">
									<aon:actionListener method="#{brand.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="dataTable" showNote="true" />					
			
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
