<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<!--  aon-region-body -->
	<aon:div styleClass="aon-scroll-area">

		<aon:dataTable id="targetData" value="#{target.model}"
			var="to" rows="20" rendered="#{target.model.rowCount > 0}"
			columnClasses="aon-editDataTable-numberColumn aon-width-70, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

			<c:if test="#{!skipRowSelector}">
				<aon:rowSelector action="target_form" actionListener="#{target.onSelect}" />
			</c:if>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_id}" />
				</f:facet>
				<aon:outputText value="#{to.id}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_company_document}" />
				</f:facet>
				<aon:outputText value="#{to.registry.document}" />
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_company_name}" />
				</f:facet>
				<aon:outputText value="#{to.registry.fullName}" />
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_company_alias}" />
				</f:facet>
				<aon:outputText value="#{to.registry.alias}" />
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{commercialBundle.commercial_target_advertising}" />
				</f:facet>
				<aon:outputText value="#{to.advertising}"/>
			</aon:column>

		</aon:dataTable>

		<aon:dataScroller2 for="targetData" showNote="true" />

	</aon:div>

</ui:composition>
