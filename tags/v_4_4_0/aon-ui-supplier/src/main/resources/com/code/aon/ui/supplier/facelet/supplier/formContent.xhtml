<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include
		src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml">
		<ui:param name="controller" value="#{controller}" />
	</ui:include>

	<aon:outputLabel for="Supplier_scope_id" value="#{bundle.aon_scope}" />
	<aon:selectOneMenu id="Supplier_scope_id" value="#{controller.to.scope}">
		<f:selectItems value="#{configCollections.currentUserScopes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="Supplier_status" value="#{bundle.aon_status}" />
	<aon:selectOneRadio id="Supplier_status" value="#{controller.to.status}">
		<f:selectItems value="#{supplierCollections.supplierStatuses}" />
	</aon:selectOneRadio>

	<c:if test="#{aonConfiguration.bean.supplier.showTaxInfoData}">
		<aon:outputLabel for="Supplier_withholding" value="#{bundle.aon_retention}" />
		<aon:selectBooleanCheckbox id="Supplier_withholding" 
			value="#{controller.to.withholding}" />

		<aon:outputLabel for="Supplier_transaction" value="#{supplierBundle.supplier_transaction_type}" />
		<aon:selectOneRadio id="Supplier_transaction" value="#{controller.to.transaction}">
			<f:selectItems value="#{configCollections.invoiceTransactionTypes}" />
		</aon:selectOneRadio>
	</c:if>

</ui:composition>
