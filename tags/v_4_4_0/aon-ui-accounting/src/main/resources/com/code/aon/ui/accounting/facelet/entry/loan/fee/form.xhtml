<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_loan_fee_entry_module}" />
				<ui:param name="toolbarDescription"
					value="#{loanFeeEntry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save"
						value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{loanFeeEntry.onAccept}" action="#{loanFeeEntry.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false" />
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new})"
						actionListener="#{loanFeeEntry.onReset}"
						rendered="#{!loanFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}"
						title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove})"
						action="accountEntry_search"
						actionListener="#{loanFeeEntry.onRemove}"
						rendered="#{!loanFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_form" rendered="#{!loanFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" rendered="#{loanFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />

				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 70%;">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu id="AccountEntry_accountPeriod"
						value="#{loanFeeEntry.header.feePeriod}">
						<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
						<a4j:support event="onchange" ajaxSingle="true" reRender="AccountEntry_accountPeriod"/>
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Account_date" required="true"
						value="#{loanFeeEntry.header.feeDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Loan_Lookup_id"
						value="#{accountingBundle.accounting_loan}" />
					<aon:selectOneMenu id="Loan_Lookup_id" required="true"
						reRender="loanContainer" ajaxSingle="true"
						value="#{loanFeeEntry.header.loan}">
						<f:selectItem itemValue="" itemLabel="-" />
						<f:selectItems value="#{accountingCollections.loans}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_concept}" />
					<aon:inputText id="Account_description" required="true"
						value="#{loanFeeEntry.header.description}" size="60" />

					<aon:outputLabel for="Account_amortization"
						value="#{accountingBundle.accounting_amortization}" />
					<aon:inputText id="Account_amortization" required="true"
						focus="Account_interest" reRender="Account_fee,loanFeeAmount"
						value="#{loanFeeEntry.header.amortization}" size="10" />

					<aon:outputLabel for="Account_interest"
						value="#{accountingBundle.accounting_interest}" />
					<aon:div>
					<aon:inputText id="Account_interest" required="true"
						focus="Account_expenses" reRender="Account_fee,loanFeeAmount"
						value="#{loanFeeEntry.header.interest}" size="10" />
						<aon:selectOneMenu id="Account_interest_account" 
							value="#{loanFeeEntry.header.interestAccount}"
							style="width: 380px; margin-left: 10px;">
							<f:selectItems value="#{accountCollections.debtInterestAccounts}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Account_expenses"
						value="#{accountingBundle.accounting_expenses}"/>
					<aon:div>
						<aon:inputText id="Account_expenses" required="true"
							focus="save" reRender="Account_fee,loanFeeAmount"
							value="#{loanFeeEntry.header.expenses}" size="10" />
						<aon:selectOneMenu id="Account_expenses_account" 
							value="#{loanFeeEntry.header.expensesAccount}"
							style="width: 380px; margin-left: 10px;">
							<f:selectItems value="#{accountCollections.expensesAccounts}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Account_fee" value="#{bundle.aon_fee}" />
					<aon:inputText id="Account_fee" value="#{loanFeeEntry.header.fee}"
						disabled="true" size="10">
						<f:convertNumber pattern="#,##0.00" />
					</aon:inputText>
				</aon:panelGrid>

				<aon:div id="loanContainer" style="margin-top: 10px;width: 70%;">
					<aon:panelCollapsible label="#{accountingBundle.accounting_loan_data}" 
						rendered="#{loanFeeEntry.header.loan != null and loanFeeEntry.header.loan.id != null}">
						<aon:panelGrid columns="2" style="width: 100%; text-align: left;">
							<aon:outputText value="#{bundle.aon_date}" />
							<aon:outputText value="#{loanFeeEntry.header.loan.loanDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:outputText value="#{bundle.aon_description}" />
							<aon:outputText value="#{loanFeeEntry.header.loan.description}" />

							<aon:outputText value="#{accountBundle.account_account}" />
							<h:commandLink immediate="#{true}"
								styleClass="aon-dataTable-link"
								actionListener="#{loanFeeEntry.onAccountStatement}"
								title="#{accountingBundle.accounting_statement_module}"
								action="account_statement_list">
									<aon:outputText value="#{loanFeeEntry.relatedAccount.fullDescription}" />
							</h:commandLink>

							<aon:outputText value="#{accountingBundle.accounting_term}" />
							<aon:outputText
								value="#{loanFeeEntry.header.loan.term} #{accountingBundle.accounting_term_months}" />

							<aon:outputText value="#{accountingBundle.accounting_interest}" />
							<aon:outputText value="#{loanFeeEntry.header.loan.interest}" />

							<aon:outputText value="#{accountingBundle.accounting_review}" />
							<aon:outputText value="#{loanFeeEntry.header.loan.review}" />

							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText
								value="#{loanFeeEntry.header.loan.registryBank.fullName}" />

							<aon:outputText value="#{bundle.aon_amount}" />
							<aon:outputText
								value="#{loanFeeEntry.header.loan.amount}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>

							<aon:outputText value="#{accountingBundle.accounting_expenses}" />
							<aon:outputText value="#{loanFeeEntry.header.loan.expenses}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>

							<aon:outputText value="#{accountingBundle.accounting_fee_amount}" />
							<aon:outputText id="loanFeeAmount" value="#{loanFeeEntry.header.loan.feeAmount}"
								style="color:#{loanFeeEntry.header.sameAmount?'black;':'red;'}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>

							<aon:outputText value="#{accountingBundle.accounting_outstanding_balance}" />
							<aon:outputText value="#{loanFeeEntry.outstandingBalance}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>

							<aon:outputText value="#{bundle.aon_security_level}" />
							<aon:outputText value="#{loanFeeEntry.header.loan.securityLevel}" />

						</aon:panelGrid>
					</aon:panelCollapsible>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
