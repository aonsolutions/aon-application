<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_salary_entry_module}" />
				<ui:param name="toolbarDescription" value="#{salaryEntry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" 
						value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{salaryEntry.onAccept}"
						action="#{salaryEntry.accept}"
						disabled="#{salaryEntry.header.grossSalary == 0}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{accountingBundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new})"
						actionListener="#{salaryEntry.onReset}"
						rendered="#{!salaryEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" 
						title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove})"
						action="accountEntry_search" 
						actionListener="#{salaryEntry.onRemove}"
						rendered="#{!salaryEntry.new}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})" 
						action="accountEntry_form"
						rendered="#{!salaryEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"/>
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" rendered="#{salaryEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
						
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu id="AccountEntry_accountPeriod"
						value="#{salaryEntry.header.period}">
						<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
						<a4j:support event="onchange" ajaxSingle="true" reRender="AccountEntry_accountPeriod" focus="date"/>
					</aon:selectOneMenu>

					<aon:outputLabel for="date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="date" required="true"
						value="#{salaryEntry.header.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Account_registryBank"
						value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="Account_registryBank"
						value="#{salaryEntry.header.registryBank}">
						<f:selectItem itemLabel="#{accountingBundle.accounting_pending_salary}" value="#{null}" />
						<f:selectItems value="#{companyCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_concept"
						value="#{bundle.aon_concept}" />
					<aon:inputText id="Account_concept" required="true"
						value="#{salaryEntry.header.concept}" size="50" maxlength="32" />

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneRadio id="AccountEntry_securityLevel"
						value="#{salaryEntry.header.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Account_gross_salary"
						value="#{accountingBundle.accounting_gross_salary}" />
					<aon:inputText id="Account_gross_salary" required="true"
						value="#{salaryEntry.header.grossSalary}" size="15"
						ajaxSingle="true" reRender="save,Account_net_salary,Account_employee_social_insurance,Account_accrued_total"
						focus="Account_Allowance" />

					<aon:outputLabel for="Account_Allowance"
						value="#{accountingBundle.accounting_allowance}" />
					<aon:inputText id="Account_Allowance" required="true"
						value="#{salaryEntry.header.allowance}" size="15"
						ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance,Account_accrued_total"
						focus="Account_Compensation" />

					<aon:outputLabel for="Account_Compensation"
						value="#{accountingBundle.accounting_compensation}" />
					<aon:inputText id="Account_Compensation" required="true"
						value="#{salaryEntry.header.compensation}" size="15"
						ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance,Account_accrued_total"
						focus="Account_retention" />

					<aon:outputLabel for="Account_accrued_total"
						value="#{accountingBundle.accounting_accrued_total}" />
					<aon:inputText id="Account_accrued_total" disabled="true" styleClass="aon-bold"
						value="#{salaryEntry.header.accruedTotal}" size="15"/>

					<aon:outputLabel for="Account_retention"
						value="#{bundle.aon_retention}" />
					<aon:inputText id="Account_retention" required="true"
						value="#{salaryEntry.header.retention}" size="15"
						ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
						focus="Account_employee_social_insurance1"/>

					<aon:outputLabel for="Account_employee_social_insurance1"
						value="#{accountingBundle.accounting_employee_social_insurance}" />
					<aon:div>
						<aon:inputText id="Account_employee_social_insurance" disabled="true" styleClass="aon-bold"
							value="#{salaryEntry.header.employeeSocialInsurance1}" size="15"/>
						<aon:outputText value="=" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance1" required="true"
							value="#{salaryEntry.header.employeeSocialInsurance1}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_employee_social_insurance2"/>
						<aon:outputText value="+" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance2" required="true"
							value="#{salaryEntry.header.employeeSocialInsurance2}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_employee_social_insurance3"/>
						<aon:outputText value="+" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance3" required="true"
							value="#{salaryEntry.header.employeeSocialInsurance3}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_employee_social_insurance4"/>
						<aon:outputText value="+" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance4" required="true"
							value="#{salaryEntry.header.employeeSocialInsurance4}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_company_social_insurance"/>
					</aon:div>

					<aon:outputLabel for="Account_net_salary"
						value="#{accountingBundle.accounting_net_salary}" />
					<aon:inputText id="Account_net_salary" disabled="true" styleClass="aon-bold"
						value="#{salaryEntry.header.netSalary}" size="15"/>

					<aon:outputLabel for="Account_company_social_insurance"
						value="#{accountingBundle.accounting_company_social_insurance}" />
					<aon:inputText id="Account_company_social_insurance" required="true"
						value="#{salaryEntry.header.companySocialInsurance}" size="15" />

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
