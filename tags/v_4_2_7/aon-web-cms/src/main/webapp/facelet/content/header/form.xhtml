<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="headerForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.header}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{headers.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="header_form"
							rendered="#{!headers.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{headers.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{headers.to!=null or header.new}"
							action="header_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{headers.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!headers.new and !headers.to.default_}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{headers.onRemove}" 
							confirmAction="header_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="header_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{headers.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
	
					<aon:panelTabSet id="menuTabSet">
	
						<aon:panelTab id="general" label="#{appBundle.header}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="header_alias"
									value="#{appBundle.cms_alias}" />
								<aon:inputText id="header_alias"
									required="true" size="32" maxlength="32"
									value="#{headers.to.alias}">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
			
								<aon:outputLabel for="header_menu"
									value="#{appBundle.header_menu}"/>
								<aon:selectOneMenu id="header_menu"  
									value="#{headers.to.menu.id}">
									<f:selectItems value="#{collections.menuTopList}" />
								</aon:selectOneMenu> 
			
								<aon:outputLabel for="header_banners"
									value="#{appBundle.header_banners}"/>
								<aon:selectOneMenu id="header_banners"  
									value="#{headers.to.bannerCategory.id}">
									<f:selectItem itemLabel="-" itemValue="" />
									<f:selectItems value="#{collections.bannerGroupList}" />
								</aon:selectOneMenu> 
								
								<aon:outputLabel for="header_language_menu"
									value="#{appBundle.header_hasmenu}" />
								<aon:div>
									<aon:selectBooleanCheckbox id="header_language_menu" 
										value="#{headers.to.language_menu}" />
									<aon:outputLabel for="header_menutype"
										value="#{appBundle.header_menutype}" />
									<aon:selectOneMenu id="header_menutype" 
										value="#{headers.to.language_menu_type}">
										<f:selectItems value="#{collections.languageTypes}" />
									</aon:selectOneMenu> 
								</aon:div>
										
								<aon:outputLabel for="headerDetail_sitename"
									value="#{appBundle.header_sitename}" />
								<aon:inputText id="headerDetail_sitename"
									size="90" maxlength="255"
									value="#{headers.toI18n.sitename}" />
								
								<aon:outputLabel for="headerDetail_content"
									value="#{appBundle.header_content}" />
								<rich:editor id="headerDetail_content"
									value="#{headers.toI18n.content}" 
									height="250" width="620" configuration="tinyMCE" 
									language="#{facesContext.application.defaultLocale.language}" />								
								
								<aon:outputLabel 
									value="#{appBundle.cms_image}" />
								<aon:panelGroup id="thumbnail_preview">
									<aon:graphicImage styleClass="aon-padding aon-border"
										url="#{headers.toI18n.image}.thumbnail" 
										alt="#{headers.toI18n.image}"/>										
									<ui:include src="/facelet/content/utils/image_modal.xhtml">
										<ui:param name="modalPanelName" value="mp" />
										<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
										<ui:param name="listenerBean" value="#{headers}" />
										<ui:param name="reRender" value="thumbnail_preview" />
										<ui:param name="thumbnail" value="#{false}" />
									</ui:include>
					                <aon:commandLink style="padding:2px"
					                	immediate="#{true}"
					                	reRender="thumbnail_preview"
					                    actionListener="#{headers.onDelImage}">
										<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}"  alt="#{bundle.aon_remove}" />
					        		</aon:commandLink>
								</aon:panelGroup>
	
								<aon:outputLabel for="Header_imageAlt"
									value="#{appBundle.cms_image_alt}" />
								<aon:inputText id="Header_imageAlt"
									size="64" maxlength="64"
									value="#{headers.toI18n.alt}" />
								
							</aon:panelGrid>
						</aon:panelTab>
	
						<aon:panelTab id="css"
							label="#{appBundle.header_css}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="header_css" style="width:100px"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.header_css}" />
								<aon:inputTextarea id="headerDetail_css"
									cols="60" rows="20" 
									value="#{headers.to.css}"/>
							</aon:panelGrid>
						</aon:panelTab>
	
						<aon:panelTab id="js"
							label="#{appBundle.header_javascript}">
							<aon:panelGrid columns="2" dir="true">
								<aon:outputLabel for="header_javascript" style="width:100px"
									value="#{appBundle.header_javascript}" />
								<aon:inputTextarea id="headerDetail_javascript"
									cols="60" rows="20" 
									value="#{headers.to.javascript}"/>
							</aon:panelGrid>
						</aon:panelTab>
						
					</aon:panelTabSet>
				</aon:div>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
