<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_loan_entry_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{loanEntry.accept}" action="accountEntry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="accountEntry_search"
						title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove})"
						actionListener="#{loanEntry.onRemove}"
						rendered="#{!loanEntry.new}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new})"
						actionListener="#{loanEntry.onReset}"
						rendered="#{!loanEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-new" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})" 
						action="accountEntry_form"
						rendered="#{!loanEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"/>
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" rendered="#{loanEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Account_date"
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="Account_date" required="true"
							value="#{loanEntry.loan.loanDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange" reRender="dateMsg" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="dateMsg" ajaxSingle="true" />
						</aon:selectInputDate>
						<aon:outputText style="#{loanEntry.periodMessage==null?'color:red;':''}" id="dateMsg" 
							value="Ejercicio #{(loanEntry.periodMessage==null)?'no definido':loanEntry.periodMessage}" />
					</aon:div>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{loanEntry.loan.description}" size="60" />

					<aon:outputLabel for="Account_term"
						value="#{accountingBundle.accounting_term}" />
					<aon:div>
						<aon:inputText id="Account_term" value="#{loanEntry.loan.term}" size="8"/>
						<aon:outputText value="#{accountingBundle.accounting_term_months}"
							styleClass="aon-italic aon-margin-left" />						
					</aon:div>

					<aon:outputLabel for="Account_interest"
						value="#{accountingBundle.accounting_interest}" />
					<aon:inputText id="Account_interest"
						value="#{loanEntry.loan.interest}" size="60" />

					<aon:outputLabel for="Account_review"
						value="#{accountingBundle.accounting_review}" />
					<aon:inputText id="Account_review"
						value="#{loanEntry.loan.review}" size="60" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{loanEntry.loan.registryBank}"
						reRender="RegistryBank_bankAccount"
						focus="Account_amount">
						<f:selectItem itemValue="" itemLabel="-" />
						<f:selectItems value="#{companyCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{configBundle.config_bank_account}" />
					<aon:div id="RegistryBank_bankAccount">
						<aon:outputText value="#{loanEntry.loan.registryBank.bankAccount}"/>
						<aon:outputText value="&#160;" />
					</aon:div>

					<aon:outputLabel for="Account_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Account_amount"
						value="#{loanEntry.loan.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Account_expenses"
						value="#{accountingBundle.accounting_expenses}" />
					<aon:inputText id="Account_expenses"
						value="#{loanEntry.loan.expenses}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Leasing_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneRadio id="Leasing_securityLevel"
						value="#{loanEntry.loan.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneRadio>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
