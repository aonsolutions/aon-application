<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_loan_module}" />
				<ui:param name="controller" value="#{loan}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{loan}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="Loan_id" value="#{bundle.aon_id}" />
					<aon:inputText id="Loan_id" size="10"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel for="Loan_description" value="#{bundle.aon_description}" />
					<aon:inputText id="Loan_description" size="40"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Loan_loanDate-From"
							styleClass="aon-tip" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Loan_loanDate-From"
							valueChangeListener="#{loan.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="Loan_loanDate-To"
							styleClass="aon-tip" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Loan_loanDate-To"
							valueChangeListener="#{loan.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

					<aon:outputLabel for="Loan_term" value="#{accountingBundle.accounting_term}" />
					<aon:inputText id="Loan_term" size="5"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel for="Loan_interest" value="#{accountingBundle.accounting_interest}" />
					<aon:inputText id="Loan_interest" size="5"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel for="Loan_review" value="#{accountingBundle.accounting_review}" />
					<aon:inputText id="Loan_review" size="40"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel for="Loan_amount" value="#{bundle.aon_amount}" />
					<aon:inputText id="Loan_amount" size="15"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel for="Loan_expenses" value="#{accountingBundle.accounting_expenses}" />
					<aon:inputText id="Loan_expenses" size="15"
						valueChangeListener="#{loan.addExpression}" />

					<aon:outputLabel for="Loan_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="Loan_securityLevel"
						converter="aon.EnumConverter"
						valueChangeListener="#{loan.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
					
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
