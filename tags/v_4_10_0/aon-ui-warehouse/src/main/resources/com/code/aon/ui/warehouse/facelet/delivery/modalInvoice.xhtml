<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showInvoiceWindow">
		<c:if test="#{delivery.showInvoiceWindow}">
			<rich:modalPanel id="invoiceModalPanel" minHeight="240"
				minWidth="520" rendered="#{delivery.showInvoiceWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{warehouseBundle.warehouse_delivery_to_invoice}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showInvoiceWindow" immediate="true">
							<f:setPropertyActionListener
								target="#{delivery.showInvoiceWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="invoice-accept"
										value="#{warehouseBundle.warehouse_delivery_to_invoice}"
										actionListener="#{delivery.onInvoice}"
										action="saleInvoice_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
									</aon:commandButton>
									<aon:commandButton id="invoice-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showInvoiceWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{delivery.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="Delivery_invoiceSeries"
											value="#{bundle.aon_series}" />
										<aon:selectOneMenu id="Delivery_invoiceSeries"
											value="#{delivery.invoiceSeries}"
											valueChangeListener="#{delivery.onInvoiceSeriesChanged}" 
											reRender="Delivery_invoiceNumber">
											<f:selectItem itemLabel=" " itemValue="#{null}" />
											<f:selectItems value="#{configCollections.seriesIds}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="Delivery_invoiceNumber"
											value="#{bundle.aon_number}" />
										<aon:inputText id="Delivery_invoiceNumber"
											value="#{delivery.invoiceNumber}"
											required="true" size="7" />

										<aon:outputLabel for="Delivery_invoiceDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Delivery_invoiceDate" 
											value="#{delivery.invoiceDate}"	required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-60" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
