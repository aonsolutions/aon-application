<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_statement_module}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{trialBalance.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="account_statement_search" />
				</ui:define>
				
				<ui:define name="additionalToolbarContent">

					<aon:commandButton id="update" value="#{accountingBundle.accounting_refresh}"
						accesskey="Q" title="#{accountingBundle.accounting_refresh}"
						actionListener="#{trialBalance.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						immediate="true" />

					<aon:commandButton id="trialBalance-back"
						value="#{bundle.aon_back}"
						rendered="#{trialBalance.backAction != null}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="#{trialBalance.backAction}"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
				
			</ui:decorate>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="statementList" value="#{trialBalance.model}"
					rows="#{trialBalance.parameters.rowsPerPage}" var="to"
					rendered="#{trialBalance.model.rowCount > 0}">

					<aon:column styleClass="#{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_account}" />
						</f:facet>
						<h:commandLink immediate="true" 
							style="margin-left: #{(to.level-1)/2}em;" 
							styleClass="aon-dataTable-link"
							actionListener="#{trialBalance.onStatement}"
							title="#{accountingBundle.accounting_statement_module}"
							action="account_statement_list">
							<aon:outputText value="#{to.id}" />
							<f:setPropertyActionListener 
								value="account_statement_account_list" 
								target="#{statement.backAction}" />
						</h:commandLink>
					</aon:column>

					<aon:column styleClass="#{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.shortDescription}" />
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{bundle.aon_total}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}" rendered="#{to.debit != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.debit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}" rendered="#{to.credit != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.credit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_debit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.unpaidBalance}" rendered="#{to.unpaidBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.unpaidBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_credit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.creditBalance}" rendered="#{to.creditBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.creditBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="statementList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
