<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/toolbar.xhtml">
				<ui:define name="toolbarTitle">
					<aon:outputText value="#{appBundle.account_abstract}" />
				</ui:define>

				<ui:define name="toolbarDescription">
					<aon:outputText value="#{bundle.aon_listing}" />
				</ui:define>

				<ui:define name="toolbarContent">
					<h:commandButton id="search" value="#{bundle.aon_search}"
						accesskey="#{bundle.aon_key_search}" action="daybook_search"
						actionListener="#{accountEntryReport.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search">
					</h:commandButton>
					<h:commandLink value="#{bundle.aon_listing}" target="_new"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-printer"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="diary" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="accountEntryDataList"
					value="#{accountEntryReport.model}" rows="20" var="to"
					rendered="#{accountEntryReport.model.rowCount > 0}">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account_id}" />
						</f:facet>
						<aon:outputText value="#{to.accountEntry.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.accountEntry.entryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account}" />
						</f:facet>
						<aon:outputText value="#{to.account.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account_description}" />
						</f:facet>
						<aon:outputText value="#{to.account.description}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_concept}" />
						</f:facet>
						<aon:outputText value="#{to.concept}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_balancing_account}" />
						</f:facet>
						<aon:outputText value="#{to.balancingAccount.id}" />
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller for="accountEntryDataList"
					rowCount="#{accountEntryReport.model.rowCount}" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
