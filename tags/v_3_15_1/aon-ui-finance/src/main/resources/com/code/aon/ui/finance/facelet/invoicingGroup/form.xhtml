<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicingGroupForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoicing_group_module}" />
				<ui:param name="controller" value="#{invoicingGroup}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name" disabled="#{!invoicingGroup.new}"
							value="#{invoicingGroup.to.parent.id}" lookupProperty="registry"
							required="true" size="5" />
						<aon:lookupButton disabled="#{!invoicingGroup.new}"
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name" actionType="search"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							property="#{invoicingGroup.to.parent}" lookupProperty="registry">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(invoicingGroup.to.parent.name!=null)?(invoicingGroup.to.parent.fullName):('')}"
							size="80" disabled="true" />							
					</aon:div>					
				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{!invoicingGroup.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="invoicingGroupDetailData" value="#{financeBundle.finance_details}" />
						</aon:div>
					</aon:div>
					<aon:div styleClass="aon-scroll-area">

						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{invoicingGroupDetail}" />
							<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
							<ui:define name="columns">
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_name}" />
									</f:facet>
									<aon:outputText value="#{to.child.fullName}" rendered="#{formList}" />
									<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
										<aon:lookupInputText id="Customer_id-Edit"
											lookup="#{customerLookup}" required="true"
											reRender="Customer_name-Edit" size="5"
											value="#{invoicingGroupDetail.to.child.id}" lookupProperty="registry">
										</aon:lookupInputText>
										<aon:lookupButton actionType="search"
											windowTitle="#{customerBundle.customer_selection}"
											selectReRender="invoicingGroupDetailData"
											lookup="#{customerLookup}" minHeight="460" minWidth="650"
											property="#{controller.to.child}" lookupProperty="registry">
										</aon:lookupButton>
										<aon:inputText id="Customer_name-Edit"
											value="#{(controller.to.child.name!=null)?(controller.to.child.fullName):('')}"
											size="80" disabled="true" />
									</aon:div>
									<f:facet name="footer">
										<aon:div styleClass="aon-lookup" rendered="#{formNew}">
											<aon:lookupInputText id="Customer_id-New"
												lookup="#{customerLookup}" required="true"
												reRender="Customer_name-New" size="5"
												value="#{invoicingGroupDetail.to.child.id}" lookupProperty="registry">
											</aon:lookupInputText>
											<aon:lookupButton 
												windowTitle="#{appBundle.aon_lookup_target}" actionType="search"
												selectReRender="Customer_id-New,Customer_name-New"
												lookup="#{customerLookup}" minHeight="460" minWidth="650"
												property="#{controller.to.child}" lookupProperty="registry">
											</aon:lookupButton>
											<aon:inputText id="Customer_name-New"
												value="#{(controller.to.child.name!=null)?(controller.to.child.fullName):('')}"
												size="80" disabled="true" />
										</aon:div>
									</f:facet>
								</aon:column>								
								
							</ui:define>
						</ui:decorate>

					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
