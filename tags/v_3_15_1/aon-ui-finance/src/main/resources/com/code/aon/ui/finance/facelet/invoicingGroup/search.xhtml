<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicingGroupSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoicing_group_module}" />
				<ui:param name="controller" value="#{invoicingGroup}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{invoicingGroup}" />
				<ui:define name="searchContent">
						
					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name"
							value="#{invoicingGroupSearch.customer.id}" size="5" >
						</aon:lookupInputText>
						<aon:lookupButton 
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name" actionType="search"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							property="#{invoicingGroupSearch.customer}">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(invoicingGroupSearch.customer.registry.name!=null)?(invoicingGroupSearch.customer.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>					
					
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
