<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<aon:form id="purchaseDirectInvoicingForm">
			<aon:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				>
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							 actionListener="#{purchaseDirectInvoicing.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null || !purchaseDirectInvoicing.editable}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							 immediate="true"
							action="purchase_direct_invoicing_list"
							actionListener="#{purchaseDirectInvoicing.onCancel}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="remove" value="#{bundle.aon_remove}"
							 immediate="true"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							action="purchase_direct_invoicing_list"
							actionListener="#{purchaseDirectInvoicing.onRemove}"
							rendered="#{!purchaseDirectInvoicing.new}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null || !purchaseDirectInvoicing.editable}"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="purchase_direct_invoicing_form"
							actionListener="#{purchaseDirectInvoicing.onReset}" 
							immediate="true"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							 immediate="true"
							action="purchase_direct_invoicing_search"
							actionListener="#{purchaseDirectInvoicing.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="record" value="#{financeBundle.to_record}"
							actionListener="#{purchaseDirectInvoicing.onRecordInvoice}"
							rendered="#{purchaseDirectInvoicingDetail.model.rowCount > 0 and !purchaseDirectInvoicing.recorded}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}" />
						<aon:commandButton id="unrecord" value="#{financeBundle.to_unrecord}"
							actionListener="#{purchaseDirectInvoicing.onUnrecordInvoice}"
							rendered="#{purchaseDirectInvoicing.recorded}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}" />
						<aon:commandButton id="finances" value="#{financeBundle.finance_generate}"
							actionListener="#{purchaseDirectInvoicing.generateFinances}"
							rendered="#{purchaseDirectInvoicingDetail.model.rowCount > 0 and purchaseDirectFinance.allPending}"							
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							disabled="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}" />
						<aon:commandButton id="invoiceDisabled" value="#{bundle.aon_report}"
							 rendered="#{purchaseDirectInvoicingDetail.to != null || purchaseFinance.to != null}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							disabled="true" accesskey="#{bundle.aon_key_print}" />
					</aon:div>
				</aon:div>
			</aon:div>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				>
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{purchaseDirectInvoicing.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" >
				<aon:div styleClass="aon-scroll-area-internal">
					<aon:panelGrid columns="2">
						<aon:panelGrid columns="4" cellpadding="0" cellspacing="0"
							styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="Invoice_referenceCode"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.aon_invoice_number}" />
							<aon:inputText id="Invoice_referenceCode" value="#{purchaseDirectInvoicing.to.referenceCode}"
								disabled="#{!purchaseDirectInvoicing.new and !purchaseDirectInvoicing.editable}" styleClass="aon-form-input-text"
								 size="25" maxlength="32"
								onblur="toUpperCase(this);" required="true">
								<f:validateLength maximum="32" />
							</aon:inputText>

							<aon:outputLabel for="Invoice_issueDate"
								value="#{financeBundle.aon_date}"
								styleClass="aon-form-input-text-label " />
							<aon:div styleClass="aon-form-nowrap">
								<aon:inputCalendar id="Invoice_issueDate" size="10"
									required="true" 
									value="#{purchaseDirectInvoicing.to.issueDate}"
									disabled="#{!purchaseDirectInvoicing.editable}"
									monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
									currentDayCellClass="currentDayCell" renderAsPopup="true"
									styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
									popupTodayString="#{bundle.aon_popup_today}"
									popupWeekString="#{bundle.aon_popup_week}" />
							</aon:div>

							<aon:outputLabel for="Supplier_Lookup_id"
								styleClass="aon-form-input-text-label"
								value="#{supplierBundle.aon_supplier}" />
							<aon:div>
								<aon:inputText id="Supplier_Lookup_id" size="5" 
									styleClass="aon-form-input-text"
									disabled="#{!purchaseDirectInvoicing.editable}" required="true"
									onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','supplierLookup','Supplier_Lookup_id','Supplier_id|Supplier_Lookup_id,Supplier_full_name|Supplier_full_name,Supplier_registry_document|Supplier_Lookup_document');"
									value="#{purchaseDirectInvoicing.to.registry.id}"
									valueChangeListener="#{purchaseDirectInvoicing.supplierData}" />
								<aon:commandButton id="find_Supplier_Lookup_id"
									rendered="#{purchaseDirectInvoicing.editable}"
									styleClass="aon-form-lookup-button" value="" immediate="true"
									onclick="lookupSearchWindow(this, 'placeList', '#{supplierLookup.encodedSearchPagePath}','Supplier_id|Supplier_Lookup_id,Supplier_full_name|Supplier_full_name,Supplier_registry_document|Supplier_Lookup_document');return false;" />	
								<aon:inputText id="Supplier_full_name" 
									styleClass="aon-form-input-text"
									size="40" disabled="#{!purchaseDirectInvoicing.editable}"
									value="#{purchaseDirectInvoicing.to.registryName}" />
							</aon:div>

							<aon:outputLabel for="Supplier_Lookup_document"
								styleClass="aon-form-input-text-label"
								value="#{registryBundle.aon_nif}" />
							<aon:inputText id="Supplier_Lookup_document"
								value="#{purchaseDirectInvoicing.to.registryDocument}"
								disabled="#{!purchaseDirectInvoicing.editable}"
								styleClass="aon-form-input-text" 
								required="true" size="10" />

							<aon:outputLabel for="Invoice_registryAddress_id"
								styleClass="aon-form-input-text-label"
								value="#{registryBundle.aon_address}" />
							<aon:div>
								<aon:selectOneMenu id="Invoice_registryAddress_id" 
									rendered="#{purchaseDirectInvoicing.addressCount > 0}"
									styleClass="aon-form-selectOneMenu-field"
									disabled="#{purchaseDirectInvoicing.recorded}"
									value="#{purchaseDirectInvoicing.to.registryAddress.id}">
									<f:selectItems value="#{purchaseDirectInvoicing.addresses}" />
								</aon:selectOneMenu>	
								<aon:outputLabel value="#{financeBundle.invoice_no_available_address}"
									rendered="#{purchaseDirectInvoicing.addressCount == 0}" />
							</aon:div>

							<aon:outputLabel for="Invoice_securityLevel"
								styleClass="aon-form-selectOneMenu-label"
								value="#{financeBundle.aon_security_level}" />
							<aon:selectOneMenu id="Invoice_securityLevel"
								styleClass="aon-form-selectOneMenu-field"
								disabled="#{!purchaseDirectInvoicing.editable}"
								value="#{purchaseDirectInvoicing.to.securityLevel}">
								<f:selectItems value="#{financeCollections.securityLevels}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="Invoice_status"
								styleClass="aon-form-selectOneMenu-label"
								value="#{financeBundle.aon_status}" />
							<aon:div>
								<aon:selectOneMenu id="Invoice_status" disabled="true"
									styleClass="aon-form-selectOneMenu-field"
									value="#{purchaseDirectInvoicing.to.status}">
									<f:selectItems value="#{financeCollections.invoiceStatuses}" />
								</aon:selectOneMenu>
								<f:verbatim>&#160;</f:verbatim>
								<aon:outputText styleClass="aon-form-input-text-label"
									value="#{financeBundle.aon_account_entry}: #{purchaseDirectInvoicing.accountEntryId}"
									rendered="#{purchaseDirectInvoicing.recorded}" />
							</aon:div>
							
							<aon:outputLabel for="Invoice_total"
								styleClass="aon-form-selectOneMenu-label"
								value="#{financeBundle.aon_total}" />
							<aon:outputText id="Invoice_total"  size="15"
								styleClass="aon-form-input-text-label"
								value="#{purchaseDirectInvoicing.toInvoiceTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>

						</aon:panelGrid>
					</aon:panelGrid>

					<aon:div styleClass="aon-form-group" rendered="#{!purchaseDirectInvoicing.new}">
						<aon:div styleClass="aon-form-group-title">
							<aon:outputLabel for="purchaseDirectInvoicingLineData"
								value="#{financeBundle.aon_invoice_lines}" />
						</aon:div>

						<aon:div styleClass="aon-form-group-body">
							<aon:dataTable id="purchaseDirectInvoicingLineData" var="to"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" cellpadding="0"
								cellspacing="0" value="#{purchaseDirectInvoicingDetail.model}"
								rowOnMouseOver="selectRow( this )" rows="20"
								rowIndexVar="rowIndex" rowOnMouseOut="unselectRow( this )"
								rowOnClick="sendRow( this )" rendered="#{!purchaseDirectInvoicing.new}"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,aon-edit-table-body aon-edit-table-body-string,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-buttons">

								<aon:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<aon:commandLink immediate="true"
										styleClass="aon-table-row-selected"
										disabled="#{!purchaseDirectInvoicing.editable}"
										rendered="#{to!=purchaseDirectInvoicingDetail.to}"
										actionListener="#{purchaseDirectInvoicingDetail.onSelect}" />
									<f:facet name="footer">
										<aon:div>
											<aon:commandButton value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												title="purchaseBundle.aon_newLine"
												actionListener="#{purchaseDirectInvoicingDetail.onReset}"
												rendered="#{!purchaseDirectInvoicingDetail.new and purchaseDirectInvoicing.editable}"
												accesskey="#{bundle.aon_key_new_line}" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{productBundle.item_item}" />
									</f:facet>
									<aon:outputText value="#{to.description}"
										rendered="#{to!=purchaseDirectInvoicingDetail.to}" />
									<aon:panelGroup rendered="#{to==purchaseDirectInvoicingDetail.to}">
										<aon:inputHidden id="Item_id-Edit" 
											value="#{purchaseDirectInvoicingDetail.to.item.id}"
											valueChangeListener="#{purchaseDirectInvoicingDetail.itemData}" />
										<aon:inputText id="Item_product_code-Edit" size="5" 
											styleClass="aon-form-input-text"
											onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','itemLookup','Item_product_code-Edit[#{rowIndex}]','Item_product_code|Item_product_code-Edit[#{rowIndex}],Item_id|Item_id-Edit[#{rowIndex}],Item_purchasePrice|Item_purchase_price-Edit[#{rowIndex}],Item_full_name|Item_full_name-Edit[#{rowIndex}]');"
											value="#{purchaseDirectInvoicingDetail.to.item.product.code}"/>
										<aon:commandButton id="find_Item_Lookup_id-Edit"
											styleClass="aon-form-lookup-button" value="" immediate="true"
											onclick="lookupSearchWindow(this, 'placeList', '#{itemLookup.encodedSearchPagePath}','Item_product_code|Item_Lookup_product_code-Edit[#{rowIndex}],Item_id|Item_Lookup_id-Edit[#{rowIndex}],Item_purchasePrice|Item_purchase_price-Edit[#{rowIndex}],Item_full_name|Item_full_name-Edit[#{rowIndex}]');return false;" />										
										<aon:inputText id="Item_full_name-Edit" size="40"
											 required="true"
											styleClass="aon-form-input-text"
											value="#{purchaseDirectInvoicingDetail.to.description}" />
									</aon:panelGroup>

									<f:facet name="footer">
										<aon:div>
											<aon:panelGroup rendered="#{purchaseDirectInvoicingDetail.new}">
												<aon:inputHidden id="Item_id-New" 
													value="#{purchaseDirectInvoicingDetail.to.item.id}"
													valueChangeListener="#{purchaseDirectInvoicingDetail.itemData}" />
												<aon:inputText id="Item_product_code-New" size="5" 
													styleClass="aon-form-input-text"
													onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','itemLookup','Item_product_code-New','Item_product_code|Item_product_code-New,Item_id|Item_id-New,Item_purchasePrice|Item_purchase_price-New,Item_full_name|Item_full_name-New');"
													value="#{purchaseDirectInvoicingDetail.to.item.product.code}"/>
												<aon:commandButton id="find_Item_Lookup_id-New"
													styleClass="aon-form-lookup-button" value="" immediate="true"
													onclick="lookupSearchWindow(this, 'placeList', '#{itemLookup.encodedSearchPagePath}','Item_product_code|Item_product_code-New,Item_id|Item_id-New,Item_purchasePrice|Item_purchase_price-New,Item_full_name|Item_full_name-New');return false;" />										
												<aon:inputText id="Item_full_name-New" size="40"
													 required="true"
													styleClass="aon-form-input-text"
													value="#{purchaseDirectInvoicingDetail.to.description}" />
											</aon:panelGroup>
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column width="60">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.aon_quantity}" />
									</f:facet>
									<aon:outputText value="#{to.quantity}"
										rendered="#{to!=purchaseDirectInvoicingDetail.to}">
										<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
									</aon:outputText>
									<aon:inputText id="Item_quantity-Edit"
										rendered="#{to==purchaseDirectInvoicingDetail.to}" 
										value="#{purchaseDirectInvoicingDetail.to.quantity}" required="true"
										styleClass="aon-form-input-text" size="7"
										onchange="calcPrice( #{rowIndex} );" />
									<f:facet name="footer">
										<aon:div>
											<aon:inputText id="Item_quantity-New" 
												rendered="#{purchaseDirectInvoicingDetail.new}" size="7"
												styleClass="aon-form-input-text"
												value="#{purchaseDirectInvoicingDetail.to.quantity}" required="true"
												onchange="calcPrice( -1 );" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column width="60">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.aon_price}" />
									</f:facet>
									<aon:outputText value="#{to.price}"
										rendered="#{to!=purchaseDirectInvoicingDetail.to}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="Item_purchase_price-Edit"
										rendered="#{to==purchaseDirectInvoicingDetail.to}" 
										styleClass="aon-form-input-text" size="7"
										value="#{purchaseDirectInvoicingDetail.to.price}" required="true"
										onchange="calcPrice( #{rowIndex} );" />
									<f:facet name="footer">
										<aon:div>
											<aon:inputText id="Item_purchase_price-New"
												rendered="#{purchaseDirectInvoicingDetail.new}" size="7"
												styleClass="aon-form-input-text" 
												value="#{purchaseDirectInvoicingDetail.to.price}" required="true"
												onchange="calcPrice( -1 );" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column width="60">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.aon_discount}" />
									</f:facet>
									<aon:outputText id="Discount" 
										rendered="#{to!=purchaseDirectInvoicingDetail.to}"
										value="#{to.discountExpression.discountExpr}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="Discount-Edit"
										rendered="#{to==purchaseDirectInvoicingDetail.to}" 
										styleClass="aon-form-input-text" size="7"
										value="#{purchaseDirectInvoicingDetail.to.discountExpression.discountExpr}"
										required="true" onchange="calcPrice( #{rowIndex} );" />
									<f:facet name="footer">
										<aon:inputText id="Discount-New"
											rendered="#{purchaseDirectInvoicingDetail.new}" 
											styleClass="aon-form-input-text" size="7"
											value="#{purchaseDirectInvoicingDetail.to.discountExpression.discountExpr}"
											required="true" onchange="calcPrice( -1 );" />
									</f:facet>
								</aon:column>

								<aon:column width="60">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.aon_amount}" />
									</f:facet>
									<aon:outputText id="Item_price_new-Edit"
										value="#{to.taxableBase}" >
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div style="text-align:right;">
											<aon:outputText id="Item_price_new-New"
												rendered="#{purchaseDirectInvoicingDetail.new}" 
												value="#{purchaseDirectInvoicingDetail.to.taxableBase}" required="true" />
											<aon:outputText id="Item_details_total"
												rendered="#{!purchaseDirectInvoicingDetail.new}"
												value="#{purchaseDirectInvoicingDetail.to.taxableBase}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.aon_invoice_workplace}" />
									</f:facet>
									<aon:outputText id="InvoiceDetail_workPlace_id"
										rendered="#{to!=purchaseDirectInvoicingDetail.to}"
										value="#{to.workPlace.description}" />
									<aon:selectOneMenu value="#{purchaseDirectInvoicingDetail.to.workPlace.id}"
										styleClass="aon-form-selectOneMenu-field"
										rendered="#{to==purchaseDirectInvoicingDetail.to}">

		<script>
			function calcPrice(index){
				priceName = "Item_purchase_price";
				quantityName = "Item_quantity";
				priceNewName = "Item_price_new"
				discountName = "Discount";
				if(index != -1){
					priceName = priceName + "-Edit[" + index + "]";
					quantityName = quantityName + "-Edit[" + index + "]";
					priceNewName = priceNewName + "-Edit[" + index + "]";
					discountName = discountName + "-Edit[" + index + "]";
				}else{
					priceName = priceName + "-New";
					quantityName = quantityName + "-New";
					priceNewName = priceNewName + "-New";
					discountName = discountName + "-New";					
				}
				price = document.getElementById( priceName );
				quantity = document.getElementById( quantityName );
				discount = document.getElementById( discountName );
				amount = document.getElementById( priceNewName );
				temp = redondea( price.value * quantity.value , 2 );
				amount.innerText = "" + redondea( temp - ( temp * discount.value / 100 ), 2 );
			}
			function redondea(xparam , digits ){
			    retvalue = xparam;
			    if ( digits > 0 ) {
			    	value = Math.pow(10,digits);
			        retvalue = Math.round(parseFloat(xparam)*value)/value;
			    }
			    if ( digits == 0 ) {
			        retvalue = Math.round(parseFloat(xparam));
			    }
			    if ( isNaN(parseFloat(retvalue)) ) {
			        retvalue = 0;
			    }
			    return retvalue;
			}
		</script>
