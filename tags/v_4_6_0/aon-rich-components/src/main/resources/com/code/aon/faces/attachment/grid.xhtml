<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-300 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="#{controller.beanName}_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="#{controller.beanName}_description" required="true"
					value="#{controller.to.description}" maxlength="64"
					rendered="#{formEdit}" size="40" />
				<f:facet name="footer">
					<aon:inputText id="#{controller.beanName}_description-New" required="true"
						value="#{controller.to.description}" maxlength="64"
						rendered="#{formNew}" size="40" />
				</f:facet>
			</aon:column>
 
 			<ui:insert name="additionalColumns"/>
			 
			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_fileupload_element}" />
				</f:facet>
				<aon:div id="#{controller.beanName}_attachFile">													
					<h:commandLink id="download" target="_blank"
						onmouseover="disableRowSelector();" onmouseout="enableRowSelector();"
						rendered="#{formList and (to.data != null)}"
						actionListener="#{controller.downloadAttachment}"
						styleClass="aon-icon aon-icon-mail-save"
						style="line-height:16px;margin-right:0;"
						title="#{bundle.aon_fileupload_download}">
						<f:param name="index" value="#{to.id}" />
						<aon:outputText value="&#160;" />
					</h:commandLink>					
					<a4j:region>
						<aon:fileUpload rendered="#{formEdit}"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{controller.fileUploaded}"
							listHeight="0px" immediateUpload="true" autoclear="true">
							<f:facet name="label">
								<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>														
							<a4j:support event="onuploadcomplete"
								reRender="#{controller.beanName}_attachFile,#{controller.beanName}_description" />
						</aon:fileUpload>
					</a4j:region>	
				</aon:div>
				<f:facet name="footer">
					<aon:div id="#{controller.beanName}_attachFileNew">
						<a4j:region>
							<aon:fileUpload rendered="#{formNew}"
								addControlLabel="#{bundle.aon_fileUpload_add}"
								stopControlLabel="#{bundle.aon_fileUpload_stop}"
								stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
								uploadControlLabel="#{bundle.aon_fileUpload_upload}"
								fileUploadListener="#{controller.fileUploaded}"
								listHeight="0px" immediateUpload="true" autoclear="true">
								<f:facet name="label">
									<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>																										
								<a4j:support event="onuploadcomplete"
									reRender="#{controller.beanName}_attachFileNew,#{controller.beanName}_description-New" />
							</aon:fileUpload>
						</a4j:region>
					</aon:div>
				</f:facet>														
			</aon:column>
		
		</ui:define>
	</ui:decorate>
</ui:composition>
