<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_loan_fee_entry_module}" />
				<ui:param name="toolbarDescription"
					value="#{loanFeeEntry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{loanFeeEntry.accept}"
						action="accountEntry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false">
					</aon:commandButton>
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{loanFeeEntry.onReset}"
						rendered="#{!loanFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
					</aon:commandButton>
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="accountEntry_search"
						actionListener="#{loanFeeEntry.onRemove}"
						rendered="#{!loanFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Account_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Account_date" required="true"
						value="#{loanFeeEntry.header.feeDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Loan_Lookup_id"
						value="#{accountingBundle.accounting_loan}" />
					<aon:selectOneMenu id="Loan_Lookup_id" required="true"
						value="#{loanFeeEntry.header.loan}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{accountingCollections.loans}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{loanFeeEntry.header.description}" size="60" />

					<aon:outputLabel for="Account_amortization"
						value="#{accountingBundle.accounting_amortization}" />
					<aon:inputText id="Account_amortization"
						reRender="Account_fee" 
						value="#{loanFeeEntry.header.amortization}" size="7"/>

					<aon:outputLabel for="Account_interest"
						value="#{accountingBundle.accounting_interest}" />
					<aon:inputText id="Account_interest"
						reRender="Account_fee" 
						value="#{loanFeeEntry.header.interest}" size="7" />

					<aon:outputLabel for="Account_fee"
						value="#{bundle.aon_fee}" />
					<aon:inputText id="Account_fee"
						value="#{loanFeeEntry.header.fee}" disabled="true" size="7"/>

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{loanFeeEntry.header.registryBank}"
						reRender="RegistryBank_bankAccount">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{configBundle.config_bank_account}" />
					<aon:div id="RegistryBank_bankAccount">
						<aon:outputText value="#{loanFeeEntry.header.registryBank.bankAccount}" />
						<aon:outputText value="&#160;" />
					</aon:div>

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{bundle.aon_security_level}"/>
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{loanFeeEntry.header.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
