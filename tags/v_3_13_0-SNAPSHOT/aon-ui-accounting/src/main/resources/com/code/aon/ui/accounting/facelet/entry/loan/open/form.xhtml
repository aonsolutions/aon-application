<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_loan_entry_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{loanEntry.accept}" action="accountEntry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="accountEntry_search"
						actionListener="#{loanEntry.onRemove}"
						rendered="#{!loanEntry.new}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{loanEntry.onReset}"
						rendered="#{!loanEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-new" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Account_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Account_date" required="true"
						value="#{loanEntry.loan.loanDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{loanEntry.loan.description}" size="60" />

					<aon:outputLabel for="Account_term"
						value="#{accountingBundle.accounting_term}" />
					<aon:inputText id="Account_term" value="#{loanEntry.loan.term}"
						size="16"/>

					<aon:outputLabel for="Account_interest"
						value="#{accountingBundle.accounting_interest}" />
					<aon:inputText id="Account_interest"
						value="#{loanEntry.loan.interest}" size="60" />

					<aon:outputLabel for="Account_review"
						value="#{accountingBundle.accounting_review}" />
					<aon:inputText id="Account_review"
						value="#{loanEntry.loan.review}" size="60" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{loanEntry.loan.registryBank}"
						reRender="RegistryBank_bankAccount">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{configBundle.config_bank_account}" />
					<aon:div id="RegistryBank_bankAccount">
						<aon:outputText value="#{loanEntry.loan.registryBank.bankAccount}"/>
						<aon:outputText value="&#160;" />
					</aon:div>

					<aon:outputLabel for="Account_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Account_amount"
						value="#{loanEntry.loan.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Account_expenses"
						value="#{accountingBundle.accounting_expenses}" />
					<aon:inputText id="Account_expenses"
						value="#{loanEntry.loan.expenses}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Leasing_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="Leasing_securityLevel"
						value="#{loanEntry.loan.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
