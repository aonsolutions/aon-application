<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_entry_module}" />
				<ui:param name="controller" value="#{accountEntry}" />
			</ui:include>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="accountEntryDataList"
					value="#{accountEntry.model}" rows="20" var="to"
					rendered="#{accountEntry.model.rowCount > 0}">

					<aon:rowSelector action="#{accountEntry.onNavigate}" 
						actionListener="#{accountEntry.onSelectEntry}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_period}" />
						</f:facet>
						<aon:outputText value="#{to.accountPeriod}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.entryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.type}" />
					</aon:column>

				</aon:dataTable>
				<aon:dataScroller2 for="accountEntryDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
