<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountEntryReportList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_journal_module}" />
				<ui:param name="skipResetButton" value="true" />

				<aon:methodParam name="searchActionListener"
					default="#{journalReport.onEditSearch}" type="actionListener" />
				<aon:methodParam name="searchAction" default="journal_search"
					resolve="true" />
				<ui:define name="additionalToolbarContent">
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="journalBook" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div rendered="#{journalReport.model.rowCount > 0}">
					<aon:dataTable id="journalReportList" value="#{journalReport.model}" rows="20" var="to">
						<f:facet name="header">
							<rich:columnGroup>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountBundle.account_account}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{bundle.aon_description}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{bundle.aon_concept}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountingBundle.accounting_debit}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountingBundle.accounting_credit}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText
										value="#{accountingBundle.accounting_balancing_account}" />
								</aon:column>
							</rich:columnGroup>
						</f:facet>

						<aon:column colspan="6" rendered="#{journalReport.firstEntry}" 
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:div style="text-align:center; font-size: 1em;">
								<aon:outputText styleClass="aon-italic" value="#{accountingBundle.accounting_account_entry}: " />
								<aon:outputText styleClass="aon-bold" value="#{to.accountEntry.id}" />
								<aon:outputText styleClass="aon-italic" value=" #{bundle.aon_date}: " />
								<aon:outputText styleClass="aon-bold" value="#{to.accountEntry.entryDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:div>
						</aon:column>
						
						<aon:column breakBefore="#{journalReport.firstEntry}" styleClass="aon-editDataTable-textColumn aon-width-100"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.account.id}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.account.description}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.concept}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.debit}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column	styleClass="aon-editDataTable-numberColumn aon-width-50"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.credit}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.balancingAccount.id}" />
						</aon:column>
					</aon:dataTable>
				</aon:div>
				<aon:dataScroller2 for="journalReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
