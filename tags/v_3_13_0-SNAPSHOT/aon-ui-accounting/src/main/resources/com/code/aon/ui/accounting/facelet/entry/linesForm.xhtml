<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="linesContainer" style="width: 99%;">
		<aon:div rendered="#{!accountEntry.new}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="rows" value="100" />

				<ui:param name="controller" value="#{accountEntryDetail}" />
				<ui:param name="skipLineEdition" value="#{!accountEntry.manual}" />
				<ui:param name="skipResetButton" value="#{!accountEntry.manual}" />

				<ui:define name="columns">

					<f:facet name="footer">
						<rich:columnGroup rendered="#{accountEntryDetail.new}">
							<aon:column colspan="#{accountEntry.manual?'3':'2'}"
								style="background-color: white;">
								<aon:outputText value="&#160;" />
							</aon:column>
							<aon:column style="background-color: white;">
								<aon:div styleClass="aon-italic aon-bold aon-text-right">
									<aon:outputText value="#{accountEntry.totalDebit}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:div>
							</aon:column>
							<aon:column style="background-color: white;">
								<aon:div styleClass="aon-italic aon-bold aon-text-right">
									<aon:outputText value="#{accountEntry.totalCredit}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:div>
							</aon:column>
							<aon:column colspan="2" style="background-color: white;">
								<aon:outputText value="&#160;" />
							</aon:column>
						</rich:columnGroup>
					</f:facet>

					<aon:column
						styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_account}" />
						</f:facet>

						<!-- 						
						<aon:div style="width: 90%;" 
							rendered="#{to!=accountEntryDetail.to}" styleClass="aon-nowrap"> 
							<aon:panelGroup styleClass="aon-bold">
								<aon:outputText value="#{to.account.id}"/>
							</aon:panelGroup>
							<aon:panelGroup styleClass="aon-italic" style="width: auto; font-size: 0.9em;">
								<aon:outputText value="&#160;&#160;&#160;"/>
								<aon:outputText value="#{to.account.description}">
									<aon:abbreviateConverter maxWidth="50" />							
								</aon:outputText>
							</aon:panelGroup>
						</aon:div>
 -->

						<aon:div style="width: 90%;"
							rendered="#{to!=accountEntryDetail.to}" styleClass="aon-nowrap">

							<aon:div style="width: 100px;float: left;">
								<aon:outputText value="#{to.account.id}" />
							</aon:div>

							<aon:outputText value="#{to.account.description}"
								styleClass="aon-italic" style="font-size: 0.9em">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>

						</aon:div>

						<ui:include
							src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
							<ui:param name="wizard" value="#{accountWizard}" />
							<ui:param name="id" value="accountId" />
							<ui:param name="required" value="#{true}" />
							<ui:param name="size" value="12" />
							<ui:param name="maxlength" value="12" />
							<ui:param name="renderDescription" value="#{true}" />
							<ui:param name="renderedAttr"
								value="#{to==accountEntryDetail.to}" />
							<ui:param name="disabled" value="#{false}" />
							<ui:param name="reRenderAttr" value="none" />
							<ui:param name="entity" value="#{accountEntryDetail.to.account}" />
							<ui:param name="ELExpression"
								value="accountEntryDetail.to.account" />
						</ui:include>
						<f:facet name="footer">
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="accountId-NEW" />
								<ui:param name="required" value="#{true}" />
								<ui:param name="size" value="12" />
								<ui:param name="maxlength" value="12" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{accountEntryDetail.new}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity" value="#{accountEntryDetail.to.account}" />
								<ui:param name="ELExpression"
									value="accountEntryDetail.to.account" />
							</ui:include>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_concept}" />
						</f:facet>
						<aon:outputText value="#{to.concept}" styleClass="aon-nowrap"
							rendered="#{to!=accountEntryDetail.to}" />
						<aon:inputText id="AccountEntryDetail_concept-Edit"
							value="#{accountEntryDetail.to.concept}"
							rendered="#{to==accountEntryDetail.to}" required="true" size="20" />
						<f:facet name="footer">
							<aon:inputText id="AccountEntryDetail_concept-New"
								value="#{accountEntryDetail.to.concept}"
								rendered="#{accountEntryDetail.new}" required="true" size="20" />
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}"
							rendered="#{to!=accountEntryDetail.to}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:inputText value="#{accountEntryDetail.to.debit}"
							rendered="#{to==accountEntryDetail.to}" required="true" size="10">
							<f:validateDoubleRange />
						</aon:inputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-italic"
								style="text-align:right; font-weight:bold;">
								<aon:inputText value="#{accountEntryDetail.to.debit}"
									rendered="#{accountEntryDetail.new}" required="true" size="10">
									<f:validateDoubleRange />
									<a4j:support event="onkeyup"
										onsubmit="if(event.keyCode != 120) return false;"
										eventsQueue="debitKeyUp" ignoreDupResponses="true"
										requestDelay="100"
										actionListener="#{accountEntryDetail.onBalanceAmount}">
									</a4j:support>
								</aon:inputText>
								<aon:outputText value="#{accountEntry.totalDebit}"
									rendered="#{!accountEntryDetail.new}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}"
							rendered="#{to!=accountEntryDetail.to}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:inputText value="#{accountEntryDetail.to.credit}"
							rendered="#{to==accountEntryDetail.to}" required="true" size="10">
							<f:validateDoubleRange />
						</aon:inputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-italic"
								style="text-align:right; font-weight:bold;">
								<aon:inputText value="#{accountEntryDetail.to.credit}"
									rendered="#{accountEntryDetail.new}" required="true" size="10">
									<f:validateDoubleRange />
								</aon:inputText>
								<aon:outputText value="#{accountEntry.totalCredit}"
									rendered="#{!accountEntryDetail.new}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_balancing_account}" />
						</f:facet>
						<aon:outputText value="#{to.balancingAccount.id}"
							rendered="#{to!=accountEntryDetail.to}" />
						<ui:include
							src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
							<ui:param name="wizard" value="#{accountWizard}" />
							<ui:param name="id" value="balancingAccountId" />
							<ui:param name="required" value="#{false}" />
							<ui:param name="size" value="12" />
							<ui:param name="maxlength" value="12" />
							<ui:param name="renderDescription" value="#{false}" />
							<ui:param name="renderedAttr"
								value="#{to==accountEntryDetail.to}" />
							<ui:param name="disabled" value="#{false}" />
							<ui:param name="reRenderAttr" value="none" />
							<ui:param name="entity"
								value="#{accountEntryDetail.to.balancingAccount}" />
							<ui:param name="ELExpression"
								value="accountEntryDetail.to.balancingAccount" />
						</ui:include>
						<f:facet name="footer">
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="balancingAccountId-NEW" />
								<ui:param name="required" value="#{false}" />
								<ui:param name="size" value="12" />
								<ui:param name="maxlength" value="12" />
								<ui:param name="renderDescription" value="#{false}" />
								<ui:param name="renderedAttr" value="#{accountEntryDetail.new}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity"
									value="#{accountEntryDetail.to.balancingAccount}" />
								<ui:param name="ELExpression"
									value="accountEntryDetail.to.balancingAccount" />
							</ui:include>
						</f:facet>
					</aon:column>

				</ui:define>
			</ui:decorate>
		</aon:div>
	</aon:div>
</ui:composition>
