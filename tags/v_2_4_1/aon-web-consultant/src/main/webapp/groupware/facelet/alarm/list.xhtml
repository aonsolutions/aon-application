<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
	
		<h:form id="alarmList">

			<!--  aon-region-body -->
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="alarmDataList" value="#{alarm.model}" rows="20"
							var="to" rowOnMouseOver="selectRow( this )"
							rendered="#{alarm.model.rowCount > 0}"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="
								aon-table-body aon-table-body-icon,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string">
 
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<f:verbatim>&#160;</f:verbatim>
									</h:panelGroup>
								</f:facet>
								<t:commandLink immediate="#{true}" 
									styleClass="aon-table-row-selected"
									action="alarm_form" 
									actionListener="#{alarm.onSelect}" />
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{groupwareBundle.alarm_description}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.description}" />
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{customerBundle.customer_customer}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{alarm.currentAlarmCustomer}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{groupwareBundle.aon_date}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.alarmDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{groupwareBundle.alarm_status}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.status}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{groupwareBundle.alarm_source}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.source}" />
							</h:column>
							
						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="alarmDataList" />
						<ui:param name="model" value="#{alarm.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
