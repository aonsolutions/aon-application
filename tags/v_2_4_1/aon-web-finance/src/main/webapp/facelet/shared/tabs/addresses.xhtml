<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:dataTable id="#{dataTable}"
		value="#{controllerAlias.model}" var="to"
		rowOnMouseOver="selectRow( this )"
		rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
		styleClass="aon-edit-table" headerClass="aon-edit-table-header"
		footerClass="aon-edit-table-footer" rows="20"
		rowIndexVar="rowIndex"
		rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
		columnClasses="aon-edit-table-body aon-edit-table-body-icon,
						aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-buttons">
						
		<h:column>
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<f:verbatim>&#160;</f:verbatim>
			<t:commandLink immediate="#{true}"
				rendered="#{to!=controllerAlias.to}"
				styleClass="aon-table-row-selected"
				actionListener="#{controllerAlias.onSelect}">
			</t:commandLink>
			<f:facet name="footer">
				<t:div>
					<t:commandButton id="reset"
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
						value="" immediate="#{true}"
						rendered="#{!controllerAlias.new}"
						actionListener="#{controllerAlias.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</t:commandButton>
				</t:div>
			</f:facet>
		</h:column>
		
		<h:column>
			<f:facet name="header">
				<h:outputText value="#{registryBundle.aon_type}" />
			</f:facet>
			<t:outputText value="#{to.addressType}"
				rendered="#{to!=controllerAlias.to}" />
			<h:selectOneMenu value="#{controllerAlias.to.addressType}"
				styleClass="aon-form-selectOneMenu-field"
				rendered="#{to==controllerAlias.to}">
				<f:selectItems value="#{registryCollections.addressTypes}" />
			</h:selectOneMenu>
			<f:facet name="footer">
				<t:div>
					<h:selectOneMenu value="#{controllerAlias.to.addressType}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{controllerAlias.new}">
						<f:selectItems value="#{registryCollections.addressTypes}" />
					</h:selectOneMenu>
				</t:div>
			</f:facet>
		</h:column>

		<t:column width="300">
			<f:facet name="header">
				<t:outputText value="#{registryBundle.aon_address}" />
			</f:facet>
			<t:outputText value="#{to.address} #{to.address2} #{to.address3}"
				rendered="#{to!=controllerAlias.to}" />
			<t:inputText value="#{controllerAlias.to.address}"
				styleClass="aon-form-input-text"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="40" />
			<t:inputText value="#{controllerAlias.to.address2}"
				styleClass="aon-form-input-text"
				rendered="#{to==controllerAlias.to}" size="40" />
			<t:inputText value="#{controllerAlias.to.address3}"
				styleClass="aon-form-input-text"
				rendered="#{to==controllerAlias.to}" size="40" />
			<f:facet name="footer">
				<t:div>
					<t:inputText value="#{controllerAlias.to.address}"
						styleClass="aon-form-input-text"
						rendered="#{controllerAlias.new}" required="#{true}" size="40" />
					<t:inputText value="#{controllerAlias.to.address2}"
						styleClass="aon-form-input-text"
						rendered="#{controllerAlias.new}" size="40" />
					<t:inputText value="#{controllerAlias.to.address3}"
						styleClass="aon-form-input-text"
						rendered="#{controllerAlias.new}" size="40" />
				</t:div>
			</f:facet>
		</t:column>

		<t:column width="50">
			<f:facet name="header">
				<t:outputText value="#{registryBundle.aon_zip}" />
			</f:facet>
			<t:outputText value="#{to.zip}"
				rendered="#{to!=controllerAlias.to}" />
			<t:inputText value="#{controllerAlias.to.zip}"
				styleClass="aon-form-input-text"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="8" />
			<f:facet name="footer">
				<t:div>
					<t:inputText value="#{controllerAlias.to.zip}"
						styleClass="aon-form-input-text"
						rendered="#{controllerAlias.new}" required="#{true}" size="8" />
				</t:div>
			</f:facet>
		</t:column>

		<t:column width="150">
			<f:facet name="header">
				<t:outputText value="#{registryBundle.aon_city}" />
			</f:facet>
			<t:outputText value="#{to.city}"
				rendered="#{to!=controllerAlias.to}" />
			<t:inputText value="#{controllerAlias.to.city}"
				styleClass="aon-form-input-text"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="20" />
			<f:facet name="footer">
				<t:div>
					<t:inputText value="#{controllerAlias.to.city}"
						styleClass="aon-form-input-text"
						rendered="#{controllerAlias.new}" required="#{true}" size="20" />
				</t:div>
			</f:facet>
		</t:column>

		<t:column width="130">
			<f:facet name="header">
				<t:outputText value="#{registryBundle.aon_geozone}" />
			</f:facet>
			<t:outputText value="#{to.geozone.name}"
				rendered="#{to!=controllerAlias.to}" />
			<h:selectOneMenu value="#{controllerAlias.to.geozone.id}"
				styleClass="aon-form-selectOneMenu-field"
				rendered="#{to==controllerAlias.to}"
				valueChangeListener="#{controllerAlias.onChangeGeoZone}">
				<f:selectItems value="#{geozoneCollections.geoTrees}" />
			</h:selectOneMenu>
			<f:facet name="footer">
				<t:div>
					<h:selectOneMenu value="#{controllerAlias.to.geozone.id}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{controllerAlias.new}"
						valueChangeListener="#{controllerAlias.onChangeGeoZone}">
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</h:selectOneMenu>
				</t:div>
			</f:facet>
		</t:column>

		<h:column>
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<t:div>
				<f:verbatim rendered="#{to!=controllerAlias.to}">&#160;</f:verbatim>

				<t:commandButton title="#{bundle.aon_save}"
					actionListener="#{controllerAlias.onAccept}"
					rendered="#{to==controllerAlias.to}" value=""
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
					accesskey="#{bundle.aon_key_save_line}" />
				<t:commandButton title="#{bundle.aon_cancel}"
					actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
					onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
					value="" rendered="#{to==controllerAlias.to}"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<t:commandButton title="#{bundle.aon_remove}"
					actionListener="#{controllerAlias.onRemove}"
					onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
					rendered="#{to==controllerAlias.to}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
					value="" accesskey="#{bundle.aon_key_remove_line}" />
			</t:div>
			<f:facet name="footer">
				<t:div>
					<f:verbatim rendered="#{!controllerAlias.new}">&#160;</f:verbatim>
					<t:commandButton title="#{bundle.aon_save}"
						actionListener="#{controllerAlias.onAccept}"
						rendered="#{controllerAlias.new}" value=""
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
						accesskey="#{bundle.aon_key_save_line}" />
					<t:commandButton title="#{bundle.aon_cancel}"
						actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
						rendered="#{controllerAlias.new}"
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
						value="" accesskey="#{bundle.aon_key_cancel_line}" />
				</t:div>
			</f:facet>
		</h:column>
	</t:dataTable>
	
	<ui:include src="/facelet/shared/dataScroller.xhtml">
		<ui:param name="dataTable" value="#{dataTable}" />
		<ui:param name="model" value="#{controllerAlias.model}" />
		<ui:param name="showNote" value="#{false}" />
	</ui:include>

</ui:composition>
</body>
</html>
