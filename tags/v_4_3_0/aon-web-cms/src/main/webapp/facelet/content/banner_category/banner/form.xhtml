<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
		
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.banner}" />
				<ui:param name="controller" value="#{banner}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home"
						actionListener="#{banner.onCancel}" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="categories"
						value="#{appBundle.banner_category}"
						action="banner_category_list"
						actionListener="#{banner_category.onSearch}"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Banner_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Banner_alias"
						required="true" size="32" maxlength="32"
						value="#{banner.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="Banner_category"
						value="#{appBundle.banner_category}"/>
					<aon:selectOneMenu id="Banner_category"  
						required="true"
						value="#{banner.to.bannerCategory.id}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.bannerGroupList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="BannerDetail_label"
						value="#{appBundle.banner_label}" />
					<aon:inputText id="BannerDetail_label"
						required="true" size="80" maxlength="255"
						value="#{banner.toI18n.label}" />

					<aon:outputLabel for="BannerDetail_url"
						value="#{appBundle.banner_url}" />
					<aon:inputText id="BannerDetail_url"
						size="80" maxlength="255"
						value="#{banner.toI18n.url}" />

					<aon:outputLabel for="BannerDetail_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="BannerDetail_description"
						size="80" maxlength="255"
						value="#{banner.toI18n.description}" />

					<aon:outputLabel 
						value="#{appBundle.banner_image}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{banner.toI18n.image}.thumbnail" 
							alt="#{banner.toI18n.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{banner.onDelImage}">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp2" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="listenerBean" value="#{banner}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>
							        	
					<aon:outputLabel for="Banner_position"
						value="#{appBundle.banner_position}"/>
					<aon:inputText id="Banner_position"
						required="true" size="10" maxlength="8"
						value="#{banner.to.position}" />
					
					<aon:outputLabel for="Banner_active"
						value="#{appBundle.cms_active}"/>
					<aon:selectBooleanCheckbox id="Banner_active" 
						value="#{banner.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
