<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_default_params_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">

					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accAppParams.onAccept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>


			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="ACC_default_period"
						value="#{accountingBundle.accounting_def_period}" />
					<aon:selectOneMenu id="ACC_default_period"
						value="#{accAppParams.parameters['ACC_DEFAULT_PERIOD'].value}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{accountingCollections.accountPeriodKeys}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_sales_account"
						value="#{accountingBundle.accounting_def_sales_acc}" />
					<aon:selectOneMenu id="ACC_default_sales_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_SALES_ACC'].value}">
						<f:selectItems value="#{accountCollections.salesAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_purchase_account"
						value="#{accountingBundle.accounting_def_purchase_acc}" />
					<aon:selectOneMenu id="ACC_default_purchase_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_PURCHASE_ACC'].value}">
						<f:selectItems value="#{accountCollections.purchaseAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_cash_account"
						value="#{accountingBundle.accounting_def_cash_acc}" />
					<aon:selectOneMenu id="ACC_default_cash_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_CASH_ACC'].value}">
						<f:selectItems value="#{accountCollections.cashAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_charged_vat_account"
						value="#{accountingBundle.accounting_def_charged_vat_acc}" />
					<aon:selectOneMenu id="ACC_default_charged_vat_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_CHARGED_VAT_ACC'].value}">
						<f:selectItems value="#{accountCollections.chargedVatAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_paid_vat_account"
						value="#{accountingBundle.accounting_def_paid_vat_acc}" />
					<aon:selectOneMenu id="ACC_default_paid_vat_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_PAID_VAT_ACC'].value}">
						<f:selectItems value="#{accountCollections.paidVatAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_paid_retention_account"
						value="#{accountingBundle.accounting_def_paid_ret_acc}" />
					<aon:selectOneMenu id="ACC_default_paid_retention_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_PAID_RET_ACC'].value}">
						<f:selectItems value="#{accountCollections.paidRetentionAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_charged_retention_account"
						value="#{accountingBundle.accounting_def_charged_ret_acc}" />
					<aon:selectOneMenu id="ACC_default_charged_retention_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_CHARGED_RET_ACC'].value}">
						<f:selectItems
							value="#{accountCollections.chargedRetentionAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_salary_charged_retention_account"
						value="#{accountingBundle.accounting_sal_charged_ret_acc}" />
					<aon:selectOneMenu id="ACC_salary_charged_retention_account"
						value="#{accAppParams.parameters['ACC_SALARY_CHARGED_RET_ACC'].value}">
						<f:selectItems
							value="#{accountCollections.chargedRetentionAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_salary_account"
						value="#{accountingBundle.accounting_def_salary_acc}" />
					<aon:selectOneMenu id="ACC_default_salary_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_SALARY_ACC'].value}">
						<f:selectItems value="#{accountCollections.salaryAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_pending_salary_account"
						value="#{accountingBundle.accounting_def_pending_salary_acc}" />
					<aon:selectOneMenu id="ACC_default_pending_salary_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_PENDING_SALARY_ACC'].value}">
						<f:selectItems value="#{accountCollections.pendingSalaryAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ACC_default_social_insurance_account"
						value="#{accountingBundle.accounting_def_social_insurance_acc}" />
					<aon:selectOneMenu id="ACC_default_social_insurance_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_SOCIAL_INSURANCE_ACC'].value}">
						<f:selectItems 
							value="#{accountCollections.socialInsuranceAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel
						for="ACC_default_enterprise_social_insurance_account"
						value="#{accountingBundle.accounting_def_enterprise_social_insurance_acc}" />
					<aon:selectOneMenu
						id="ACC_default_enterprise_social_insurance_account"
						value="#{accAppParams.parameters['ACC_DEFAULT_COMPANY_SOC_INS_ACC'].value}">
						<f:selectItems
							value="#{accountCollections.enterpriseSocialInsuranceAccountsIds}" />
					</aon:selectOneMenu>

					<aon:outputLabel
						for="ACC_accounting_def_vat_percent"
						value="#{accountingBundle.accounting_def_vat_percent}" />
					<aon:selectOneMenu
						id="ACC_accounting_def_vat_percent"
						value="#{accAppParams.parameters['ACC_DEFAULT_VAT_PERCENT'].value}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{configCollections.vatTaxesIds}" />						
					</aon:selectOneMenu>
					
					<aon:outputLabel
						for="ACC_accounting_def_retention_percent"
						value="#{accountingBundle.accounting_def_retention_percent}" />
					<aon:selectOneMenu
						id="ACC_accounting_def_retention_percent"
						value="#{accAppParams.parameters['ACC_DEFAULT_RETENTION_PERCENT'].value}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{configCollections.retentionTaxesIds}" />						
					</aon:selectOneMenu>

					<aon:outputLabel
						for="ACC_accounting_def_invoice_series"
						value="#{accountingBundle.accounting_def_invoice_series}" />
					<aon:selectOneMenu
						id="ACC_accounting_def_invoice_series"
						value="#{accAppParams.parameters['ACC_DEFAULT_INVOICE_SERIES'].value}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{configCollections.seriesIds}" />						
					</aon:selectOneMenu>

					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
