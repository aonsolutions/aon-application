<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{commercialBundle.commercial_offer_module}" />
					<ui:param name="controller" value="#{offer}" />
					<ui:param name="skipSaveButton" value="#{!offer.pending}" />
					<ui:param name="skipRemoveButton" value="#{!offer.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<c:if test="#{aonConfiguration.bean.commercial.showInvoicing}">
							<aon:commandButton id="invoice"
								value="#{commercialBundle.commercial_offer_to_invoice}"
								immediate="#{true}" rendered="#{(offer.pending or offer.approved) and offerDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-favorite"
								actionListener="#{offer.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{offer.showInvoiceWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<c:if test="#{!aonConfiguration.bean.commercial.showInvoicing}">
							<aon:commandButton id="sales"
								value="#{commercialBundle.commercial_offer_to_sales}"
								immediate="#{true}" rendered="#{offer.pending and offerDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-settle" 
								actionListener="#{offer.onSalesShow}"
								reRender="showSalesWindow">
								<f:setPropertyActionListener target="#{offer.showSalesWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<h:commandLink id="offer" value="#{bundle.aon_report}"
							target="_new" rendered="#{!offer.new}"
							action="#{report.onExecute}"
							disabled="#{offerDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-printer">
							<f:param name="reportKey" value="offer" />
							<f:param name="outputFormat" value="PDF" />
						</h:commandLink>
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Offer_series-New"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="Offer_series-New" 
							value="#{offer.to.series}" rendered="#{offer.new}"
							valueChangeListener="#{offer.onSeriesChanged}" 
							reRender="Offer_number,Offer_securityLevel">
							<f:selectItem itemLabel=" " itemValue="#{null}" />
							<f:selectItems value="#{configCollections.seriesIds}" />
						</aon:selectOneMenu>
						<aon:inputText id="Offer_series-Edit" 
							value="#{offer.to.series}" rendered="#{!offer.new}"
							disabled="true" size="4" />
						<aon:inputText id="Offer_number" styleClass="aon-margin-left"
							value="#{offer.to.number}" disabled="#{!offer.new}"
							required="true" size="7" />

						<aon:selectOneMenu id="Offer_securityLevel" styleClass="aon-margin-left" 
							value="#{offer.to.securityLevel}" disabled="#{!offer.pending}">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{offer.to.status}" />
						<aon:outputText styleClass="aon-italic aon-margin-left"
							value="(#{financeBundle.finance_invoice}:"
							rendered="#{offer.invoiced}" />
						<aon:outputText styleClass="aon-bold"
							value="#{offer.invoiceCode}"
							rendered="#{offer.invoiced}" />
						<aon:outputText styleClass="aon-italic" value=")"
							rendered="#{offer.invoiced}" />
 					</aon:div>

					<aon:outputLabel for="Offer_issueDate" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Offer_issueDate"
						value="#{offer.to.issueDate}" 
						required="true" disabled="#{!offer.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Target_id" 
						value="#{target.bundle.commercial_target}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Target_id" 
								value="#{offer.to.target.registry.id}"
								disabled="#{!offer.pending}" size="5" 
								lookupProperty="registry" lookup="#{targetLookup}"
								lookupChangeListener="#{offer.targetData}" 
								reRender="Target_full_name,Target_registry_document,OfferAddress,Offer_defaultPayMethod,payMethodDiv"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{commercialBundle.commercial_target_selection}"
								disabled="#{!offer.pending}" minHeight="460" minWidth="650"
								property="#{offer.to.target.registry}" lookupProperty="registry" lookup="#{targetLookup}"
								lookupChangeListener="#{offer.targetData}"
								selectReRender="Target_id,Target_full_name,Target_registry_document,OfferAddress,Offer_defaultPayMethod,payMethodDiv"
								actionType="search">
							</aon:lookupButton>
							<aon:inputText id="Target_full_name" 
								value="#{(offer.to.target.registry.fullName!=null)?(offer.to.target.registry.fullName):('')}"
								disabled="true" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Target_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Target_registry_document" 
						value="#{offer.to.target.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Offer_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="OfferAddress">
						<aon:selectOneMenu id="Offer_address" 
							value="#{offer.to.address}"	rendered="#{offer.addressCount > 0}"
							disabled="#{!offer.pending}">
							<f:selectItems value="#{offer.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{offer.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Offer_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Offer_scope" 
						value="#{offer.to.scope}"
						disabled="#{!offer.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Seller_id" 
						value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Seller_id" 
								value="#{offer.to.seller.registry.id}"
								disabled="#{!offer.pending}" size="5"
								lookupProperty="registry" lookup="#{sellerLookup}" 
								lookupChangeListener="#{offer.sellerData}" 
								reRender="Seller_full_name"
								ajaxSingle="true" />
							<aon:lookupButton
								windowTitle="#{salesBundle.sales_seller_selection}"
								disabled="#{!offer.pending}" minHeight="460" minWidth="650"
								property="#{offer.to.seller.registry}" lookupProperty="registry" lookup="#{sellerLookup}"
								lookupChangeListener="#{offer.sellerData}"
								selectReRender="Seller_id,Seller_full_name"
								actionType="search">
							</aon:lookupButton>
							<aon:inputText id="Seller_full_name" 
								value="#{(offer.to.seller.registry.fullName!=null)?(offer.to.seller.registry.fullName):('')}"
								disabled="true" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Offer_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Offer_workPlace" 
						value="#{offer.to.workPlace}"
						disabled="#{!offer.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_tariff" 
						value="#{productBundle.product_tariff}" />
					<aon:selectOneMenu id="Offer_tariff" 
						value="#{offer.to.tariff}"
						disabled="#{!offer.pending}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{configCollections.tariffs}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_type" 
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Offer_type" 
						value="#{offer.to.type}"
						disabled="#{!offer.pending}">
						<f:selectItems value="#{commercialCollections.offerTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Offer_defaultPayMethod" 
						value="#{offer.defaultPayMethod}"
						disabled="#{!offer.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{commercialBundle.commercial_offer_customer_pay_method}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{commercialBundle.commercial_offer_define_another_one}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Offer_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Offer_total" styleClass="aon-bold" 
						value="#{offer.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{offer.defaultPayMethod != null and !offer.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Offer_payMethod" 
								value="#{offer.to.payMethod}"
								disabled="#{!offer.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Offer_numberOfPayments"
								value="#{offer.to.numberOfPayments}"
								disabled="#{!offer.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Offer_daysToFirstPayment"
								value="#{offer.to.daysToFirstPayment}"
								disabled="#{!offer.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Offer_daysBetweenPayments"
								value="#{offer.to.daysBetweenPayments}"
								disabled="#{!offer.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Offer_paymentDays"
								value="#{offer.to.paymentDays}" 
								disabled="#{!offer.pending}" size="5" />
							<aon:div styleClass="aon-lookup">
								<a4j:region>
									<aon:lookupInputText id="Offer_bank_code"
										value="#{offer.to.bank.code}"
										disabled="#{!offer.pending}" size="5"
										property="#{offer.to.bank}" lookup="#{bankLookup}"
										reRender="Offer_bank_name">
										<aon:joinProperty alias="Bank_code" value="#{offer.to.bank.code}" />
									</aon:lookupInputText>
									<aon:lookupButton 
										windowTitle="#{configBundle.config_bank_selection}"
										disabled="#{!offer.pending}" minHeight="460" minWidth="650"
										property="#{offer.to.bank}" lookup="#{bankLookup}"
										selectReRender="Offer_bank_code,Offer_bank_name"
										actionType="search">
									</aon:lookupButton>
									<aon:inputText id="Offer_bank_name"
										value="#{offer.to.bank.name}"
										disabled="true" size="40" />							
								</a4j:region>
							</aon:div>
							<aon:div>
								<aon:inputText id="Offer_bank_office"
									value="#{offer.to.bankAccount.office}"
									disabled="#{!offer.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Offer_bank_control"
									value="#{offer.to.bankAccount.control}"
									disabled="#{!offer.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Offer_bank_account"
									value="#{offer.to.bankAccount.account}"
									disabled="#{!offer.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!offer.new}">
						<f:facet name="header">
							<aon:outputText value="#{commercialBundle.commercial_offer_detail}" />
						</f:facet>
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="dataTableId" value="offerDetails" />
							<ui:param name="controller" value="#{offerDetail}" />
							<ui:param name="rows" value="0" />
							<ui:param name="showNote" value="false" />
							<ui:param name="showDataScroller" value="false" />
							<ui:param name="skipResetButton" value="#{!offer.pending}" />
							<ui:param name="skipLineEdition" value="#{!offer.pending}" />
							<ui:param name="rowSelectorReRender" value="menuExt" />
							<ui:param name="resetButtonReRender" value="menuExt" />
							<ui:param name="newCancelButtonReRender" value="menuExt" />
							<ui:param name="cancelButtonReRender" value="menuExt" />
							<ui:param name="newSaveButtonReRender" value="menuExt,Offer_total" />
							<ui:param name="saveButtonReRender" value="menuExt,Offer_total" />
							<ui:param name="removeButtonReRender" value="menuExt,Offer_total" />
							<ui:param name="focusOnAdd" value="OfferDetail_item_product_code-New" />
							<ui:param name="focusOnSelect" value="OfferDetail_item_product_code" />
		
							<ui:define name="columns">
		
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
									<f:facet name="header">
										<aon:outputLabel value="#{commercialBundle.commercial_offer_detail_line}" />
									</f:facet>
									<aon:outputText value="#{to.line}"
										rendered="#{formList}" />
									<aon:inputText id="OfferDetail_line" 
										value="#{controller.to.line}" rendered="#{formEdit}"
										required="true" size="2" maxlength="3" />
									<f:facet name="footer">
										<aon:inputText id="OfferDetail_line-New" 
											value="#{controller.to.line}" rendered="#{formNew}"
											required="true" size="2" maxlength="3" />
									</f:facet>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
									<f:facet name="header">
										<aon:outputLabel value="#{productBundle.product_item}" />
									</f:facet>
									<aon:outputText value="#{to.description}" 
										rendered="#{formList}"
										style="#{to.item == null or to.item.id == null?'font-weight:bold;':'padding-left:10px;'}">
										<aon:abbreviateConverter maxWidth="64" />
									</aon:outputText>
									<aon:div id="offerDetailItemEdit" styleClass="aon-lookup" rendered="#{formEdit}">
										<a4j:region>
											<aon:lookupInputText id="OfferDetail_item_product_code" 
												value="#{offerDetail.to.item.product.code}"
												lookup="#{itemLookup}"   
												lookupChangeListener="#{offerDetail.onItemChanged}"
												reRender="offerDetailItemEdit,OfferDetail_price,OfferDetail_discount,OfferDetail_amount"
												ajaxSingle="false" size="10" 
												onblur="toUpperCase(this);" focus="OfferDetail_item_product_name">
												<aon:joinProperty alias="Item_product_code"	value="#{offerDetail.to.item.product.code}" />
											</aon:lookupInputText>
											<aon:lookupButton
												windowTitle="#{productBundle.product_item_selection}"
												minHeight="460" minWidth="650"
												property="#{offerDetail.to.item}" lookup="#{itemLookup}"
												lookupChangeListener="#{offerDetail.onItemChanged}" 
												selectReRender="offerDetailItemEdit,OfferDetail_price,OfferDetail_discount,OfferDetail_amount"
												actionType="search">
											</aon:lookupButton>
											<aon:inputTextarea id="OfferDetail_item_product_name"
												value="#{offerDetail.to.description}"
												cols="64" rows="#{!offerDetail.longDescription?1:5}"
												style="#{!offerDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
												<f:validateLength maximum="1024" />
											</aon:inputTextarea>
										</a4j:region>
										<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
											actionListener="#{offerDetail.onShortDescription}" reRender="OfferDetail_item_product_name"
											rendered="#{offerDetail.longDescription and offerDetail.to.item.product.code != null}" />
										<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
											actionListener="#{offerDetail.onLongDescription}" reRender="OfferDetail_item_product_name"
											rendered="#{!offerDetail.longDescription and offerDetail.to.item.product.code != null}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div id="offerDetailItemNew" styleClass="aon-lookup" rendered="#{formNew}">
											<a4j:region>
												<aon:lookupInputText id="OfferDetail_item_product_code-New" 
													value="#{offerDetail.to.item.product.code}"
													lookup="#{itemLookup}"   
													lookupChangeListener="#{offerDetail.onItemChanged}"
													reRender="offerDetailItemNew,OfferDetail_price-New,OfferDetail_discount-New,OfferDetail_amount-New"
													ajaxSingle="false" size="10" 
													onblur="toUpperCase(this);" focus="OfferDetail_item_product_name-New">
													<aon:joinProperty alias="Item_product_code"	value="#{offerDetail.to.item.product.code}" />
												</aon:lookupInputText>
												<aon:lookupButton
													windowTitle="#{productBundle.product_item_selection}"
													minHeight="460" minWidth="650" 
													property="#{offerDetail.to.item}" lookup="#{itemLookup}"
													lookupChangeListener="#{offerDetail.onItemChanged}" 
													selectReRender="offerDetailItemNew,OfferDetail_price-New,OfferDetail_discount-New,OfferDetail_amount-New"
													actionType="search">
												</aon:lookupButton>
												<aon:inputTextarea id="OfferDetail_item_product_name-New"
													value="#{offerDetail.to.description}"
													cols="64" rows="#{!offerDetail.longDescription?1:5}"
													style="#{!offerDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
													<f:validateLength maximum="1024" />
												</aon:inputTextarea>
											</a4j:region>
											<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
												actionListener="#{offerDetail.onShortDescription}" reRender="OfferDetail_item_product_name-New"
												rendered="#{offerDetail.longDescription and offerDetail.to.item.product.code != null}" />
											<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
												actionListener="#{offerDetail.onLongDescription}" reRender="OfferDetail_item_product_name-New"
												rendered="#{!offerDetail.longDescription and offerDetail.to.item.product.code != null}" />
										</aon:div>
									</f:facet>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_quantity}" />
									</f:facet>
									<aon:outputText value="#{to.quantity}"
										rendered="#{formList and to.item != null and to.item.id != null}">
										<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
									</aon:outputText>
									<aon:inputText id="OfferDetail_quantity" 
										value="#{controller.to.quantity}" rendered="#{formEdit}"
										valueChangeListener="#{controller.onQuantityChanged}" 
										reRender="OfferDetail_price,OfferDetail_discount,OfferDetail_amount" 
										required="true" size="7" focus="OfferDetail_price" />
									<f:facet name="footer">
										<aon:inputText id="OfferDetail_quantity-New" 
											value="#{controller.to.quantity}" rendered="#{formNew}"
											valueChangeListener="#{controller.onQuantityChanged}" 
											reRender="OfferDetail_price-New,OfferDetail_discount-New,OfferDetail_amount-New" 
											required="true" size="7" focus="OfferDetail_price-New" />
									</f:facet>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_price}" />
									</f:facet>
									<aon:outputText value="#{to.price}"
										rendered="#{formList and to.item != null and to.item.id != null}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="OfferDetail_price" 
										value="#{controller.to.price}" rendered="#{formEdit}"
										reRender="OfferDetail_amount" 
										required="true" size="7" />
									<f:facet name="footer">
										<aon:inputText id="OfferDetail_price-New" 
											value="#{controller.to.price}" rendered="#{formNew}"
