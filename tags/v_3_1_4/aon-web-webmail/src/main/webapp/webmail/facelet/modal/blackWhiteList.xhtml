<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

<aon:form id="addBlackWhiteListForm">
	<aon:panelGroup id="addBlackWhiteListWindow">
		<rich:modalPanel id="addBlackWhiteListModalPanel"
			rendered="#{spam.showNewSpamAddressWindow}"
			showWhenRendered="true" height="100" width="350" zindex="2000">
			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{appBundle.aon_webmail_add_white_list}"
						rendered="#{!spam.blackList}" />
					<aon:outputText value="#{appBundle.aon_webmail_add_black_list}"
						rendered="#{spam.blackList}" />
				</aon:div>
			</f:facet>
			<f:facet name="controls">
				<aon:commandButton type="button" styleClass="aon-popupWindow-close"
					immediate="true">
					<f:setPropertyActionListener
						target="#{spam.showNewSpamAddressWindow}" value="#{false}" />
					<rich:componentControl for="addBlackWhiteListModalPanel"
						operation="hide" event="onclick" />
				</aon:commandButton>
			</f:facet>
			<h:panelGrid width="100%" cellpadding="2" cellspacing="0" columns="2"
				styleClass="aon-panelGrid-formatting">
				<aon:inputText size="35" value="#{spam.newEmail}" />
				<aon:commandButton styleClass="aon-commandButton"
					reRender="emailList" actionListener="#{spam.createNew}"
					value="#{bundle.aon_accept}">
					<f:setPropertyActionListener
						target="#{spam.showNewSpamAddressWindow}" value="#{false}" />
					<rich:componentControl for="addBlackWhiteListModalPanel"
						operation="hide" event="onclick" />
				</aon:commandButton>
			</h:panelGrid>
		</rich:modalPanel>
	</aon:panelGroup>
	</aon:form>

</ui:composition>

</body>
</html>
