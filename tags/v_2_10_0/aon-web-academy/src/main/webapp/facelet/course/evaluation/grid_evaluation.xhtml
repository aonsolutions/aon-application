<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>
		
	<t:div styleClass="aon-form-group" rendered="#{!course.new}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="courseEvaluationDataTable" 
				value="#{appBundle.course_evaluations}" />
		</t:div>

		<t:div styleClass="aon-form-group-body">
			<t:dataTable id="courseEvaluationDataTable"
				value="#{courseEvaluation.model}" var="to"
				rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				styleClass="aon-edit-table" headerClass="aon-edit-table-header"
				footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-edit-table-body aon-edit-table-body-icon,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-buttons">

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<f:verbatim>&#160;</f:verbatim>
					<t:commandLink immediate="#{true}"
						rendered="#{to!=courseEvaluation.to}"
						styleClass="aon-table-row-selected"
						actionListener="#{courseEvaluation.onSelect}">
					</t:commandLink>
					<f:facet name="footer">
						<t:div>
							<t:commandButton id="reset"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
								value="" immediate="#{true}" rendered="#{!courseEvaluation.new}"
								actionListener="#{courseEvaluation.onReset}"
								accesskey="#{bundle.aon_key_new_line}">
							</t:commandButton>
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.course_evaluation_qualitySkill}" />
					</f:facet>
					<t:outputText value="#{to.qualitySkill.code} #{to.qualitySkill.description}"
						rendered="#{to!=courseEvaluation.to}" />
					<h:selectOneMenu value="#{courseEvaluation.to.qualitySkill.id}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{to==courseEvaluation.to}">
						<f:selectItems value="#{academyCollections.qualitySkills}" />
					</h:selectOneMenu>
					<f:facet name="footer">
						<t:div>
							<h:selectOneMenu value="#{courseEvaluation.to.qualitySkill.id}"
								styleClass="aon-form-selectOneMenu-field"
								rendered="#{courseEvaluation.new}">
								<f:selectItems value="#{academyCollections.qualitySkills}" />
							</h:selectOneMenu>
						</t:div>
					</f:facet>
				</h:column>
			
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.course_evaluation_evaluation}" />
					</f:facet>
					<t:outputText value="#{to.evaluation}"
						rendered="#{to!=courseEvaluation.to}" />
					<t:inputText rendered="#{to==courseEvaluation.to}" 
						styleClass="aon-form-input-text" size="10" 
						value="#{courseEvaluation.to.evaluation}" required="#{true}" />
					<f:facet name="footer">
						<t:div>
							<t:inputText rendered="#{courseEvaluation.new}"
								styleClass="aon-form-input-text" size="10"
								value="#{courseEvaluation.to.evaluation}" required="#{true}" />
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.course_evaluation_quantity}" />
					</f:facet>
					<t:outputText value="#{to.quantity}"
						rendered="#{to!=courseEvaluation.to}" />
					<t:inputText rendered="#{to==courseEvaluation.to}" 
						styleClass="aon-form-input-text" size="10" 
						value="#{courseEvaluation.to.quantity}" required="#{true}" />
					<f:facet name="footer">
						<t:div>
							<t:inputText rendered="#{courseEvaluation.new}"
								styleClass="aon-form-input-text" size="10" 
								value="#{courseEvaluation.to.quantity}" required="#{true}" />
						</t:div>
					</f:facet>
				</h:column>
				
				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:div>
						<f:verbatim rendered="#{to!=courseEvaluation.to}">&#160;</f:verbatim>

						<t:commandButton title="#{bundle.aon_save}"
							actionListener="#{courseEvaluation.onAccept}"
							rendered="#{to==courseEvaluation.to}" value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
							accesskey="#{bundle.aon_key_save_line}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{courseEvaluation.onCancel}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
							value="" rendered="#{to==courseEvaluation.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<t:commandButton title="#{bundle.aon_remove}"
							actionListener="#{courseEvaluation.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
							rendered="#{to==courseEvaluation.to}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
							value="" accesskey="#{bundle.aon_key_remove_line}" />
					</t:div>
					<f:facet name="footer">
						<t:div>
							<f:verbatim rendered="#{!courseEvaluation.new}">&#160;</f:verbatim>
							<t:commandButton title="#{bundle.aon_save}"
								actionListener="#{courseEvaluation.onAccept}"
								rendered="#{courseEvaluation.new}" value=""
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
								accesskey="#{bundle.aon_key_save_line}" />
							<t:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{courseEvaluation.onCancel}"
								immediate="#{true}"
								onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
								rendered="#{courseEvaluation.new}"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
						</t:div>
					</f:facet>
				</h:column>
			</t:dataTable>
		</t:div>

		<ui:include src="/facelet/shared/dataScroller.xhtml">
			<ui:param name="dataTable" value="courseEvaluationDataTable" />
			<ui:param name="model" value="#{courseEvaluation.model}" />
			<ui:param name="showNote" value="#{false}" />
		</ui:include>

	</t:div>

</ui:composition>

</body>
</html>
