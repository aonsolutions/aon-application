<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div styleClass="aon-scroll-area">
		<aon:div styleClass="aon-scroll-area-internal">
			<aon:div styleClass="aon-panelGrid-search">
				<aon:div styleClass="aon-panelGrid-search-info">
					<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
				</aon:div>			
				
				<aon:panelGrid columns="2">
					<ui:insert name="searchContent" />
					
					<aon:outputText value="" />
					<aon:div styleClass="aon-search-commandButton-left">
						<aon:div styleClass="aon-search-commandButton-right">
							<aon:commandButton id="search"
								value="#{bundle.aon_search}" 
								action="#{searchAction}" actionListener="#{searchActionListener}"
								reRender="#{searchReRender}"
								accesskey="#{bundle.aon_key_search}" />
							</aon:div>
					</aon:div>					
				</aon:panelGrid>
			</aon:div>
		</aon:div>
	</aon:div>
	
</ui:composition>
