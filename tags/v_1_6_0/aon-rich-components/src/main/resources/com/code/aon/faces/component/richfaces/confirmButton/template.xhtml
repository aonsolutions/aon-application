<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGroup id="#{confirmId}ReRender" styleClass="aon-popupWindow">
		<c:if test="#{confirmShowWindow}">
			<aon:subForm>
				<rich:modalPanel 
					id="#{confirmId}"
					rendered="#{confirmShowWindow}" showWhenRendered="true"
					minWidth="260" height="130">
	
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="#{confirmTitle}"/>
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" styleClass="aon-popupWindow-close" 
							 immediate="true">
							<f:setPropertyActionListener target="#{confirmShowWindow}" value="false" />						
							<rich:componentControl for="#{confirmId}" event="onclick"
								disableDefault="true" operation="hide"/>
						</aon:commandButton>	
					</f:facet>
	
					<aon:div  styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
						
							<aon:div styleClass="aon-message-big aon-icon-big-info">								
								<aon:outputText value="#{confirmMessage}" />						
							</aon:div>					
						
							<aon:div styleClass="aon-text-center">
								<aon:commandButton value="#{bundle.aon_yes}"
									action="#{confirmAction}" reRender="#{confirmReRender}"
									styleClass="aon-commandButton"
									immediate="#{immediate}">
									<c:if test="#{confirmActionListener != null}">									
										<aon:actionListener method="#{confirmActionListener}" />
									</c:if>
									<f:setPropertyActionListener target="#{confirmShowWindow}" value="false" />								
									<rich:componentControl for="#{confirmId}" event="onclick"
										disableDefault="true" operation="hide"/>
								</aon:commandButton>
								<aon:commandButton value="#{bundle.aon_no}"
									styleClass="aon-commandButton" immediate="true">
									<f:setPropertyActionListener target="#{confirmShowWindow}" value="false" />								
									<rich:componentControl for="#{confirmId}" event="onclick"
										disableDefault="true" operation="hide"/>
								</aon:commandButton>
							</aon:div>					
						</aon:div>		
					</aon:div>		
				</rich:modalPanel>	
			</aon:subForm>
		</c:if>
	</aon:panelGroup>

</ui:composition>
