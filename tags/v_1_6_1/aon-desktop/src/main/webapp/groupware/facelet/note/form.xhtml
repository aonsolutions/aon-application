<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="noteForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{groupwareBundle.aon_note}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{note.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{note.to!=null or note.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{note.accept}"
							action="note_form"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{note.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{note.onCancel}"
							confirmAction="note_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!note.new}" immediate="true"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{note.onRemove}"
							confirmAction="note_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!note.new}" immediate="true"
							action="note_search" actionListener="#{note.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!note.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{note.onCancel}" action="note_list"
							accesskey="#{bundle.aon_key_cancel}" />	
							
						<aon:spin controller="#{note}" action="note_form" rendered="#{!note.new}" />
													
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Note_date"
						rendered="#{!note.new}" value="#{groupwareBundle.aon_date}" />
					<aon:outputText id="Note_date" value="#{note.to.date}"
						rendered="#{!note.new}" styleClass="aon-inputText-disabled"
						style="padding-left:1em;padding-right:1em;">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputLabel for="Note_subject"
						value="#{groupwareBundle.note_subject}" />
					<aon:inputText id="Note_subject"
						maxlength="64" size="98" required="true"
						value="#{note.to.subject}" />

					<aon:outputLabel for="Note_note" value="#{groupwareBundle.note_note}" />
					<aon:inputTextarea id="Note_note"
						value="#{note.to.note}" cols="100" rows="7" />

				</aon:panelGrid>
					
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
