<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="noticeForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{groupwareBundle.aon_notice}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{notice.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{notice.to!=null or notice.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{notice.accept}"
							action="notice_form"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{notice.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{notice.onCancel}"
							confirmAction="notice_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!notice.new}" immediate="true"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{notice.onRemove}"
							confirmAction="notice_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!notice.new}" immediate="true"
							action="notice_search" actionListener="#{notice.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!notice.new}" immediate="true"
							action="notice_list" actionListener="#{notice.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:spin controller="#{notice}" action="notice_form" rendered="#{!notice.new}" />							
							
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

						<aon:outputLabel for="Notice_date"
							value="#{groupwareBundle.aon_date}" />

						<aon:selectInputDate id="Notice_date" 
							renderAsPopup="true" value="#{notice.to.date}"
							popupDateFormat="#{appBundle.aon_date_pattern}">
						</aon:selectInputDate>

						<aon:outputLabel for="Notice_workGroup_id"
							value="#{groupwareBundle.notice_work_group}" />
						<aon:selectOneMenu id="Notice_workGroup_id" required="true"
							value="#{notice.to.workGroup.id}" reRender="Notice_recipient_id"
							valueChangeListener="#{notice.workGroupChange}">
							<f:selectItem value="#{desktop.nullValue}" />
							<f:selectItems value="#{configCollections.workgroups}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="Notice_recipient_id" 
							value="#{groupwareBundle.notice_recipient}" />
						<aon:selectOneMenu id="Notice_recipient_id"
							value="#{notice.to.recipient.id}">
							<f:selectItems value="#{notice.users}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="Notice_source"
							value="#{groupwareBundle.notice_source}" />
						<aon:inputText id="Notice_source"
							maxlength="64" size="100"
							value="#{notice.to.source}" />

						<aon:outputLabel for="Notice_company"
							value="#{groupwareBundle.notice_company}" />
						<aon:inputText id="Notice_company"
							maxlength="64" size="100"
							value="#{notice.to.company}" />

						<aon:outputLabel for="Notice_phone"
							value="#{groupwareBundle.notice_phone}" />
						<aon:inputText id="Notice_phone"
							maxlength="16" size="20"
							value="#{notice.to.phone}" />
							
						<aon:outputLabel for="Notice_status" 
							value="#{groupwareBundle.notice_status}" />
						<aon:selectOneMenu id="Notice_status"
							value="#{notice.to.status}">
							<f:selectItems value="#{groupWareCollections.noticeStatuses}" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="Notice_type" 
							value="#{groupwareBundle.notice_type}" />
						<aon:selectOneMenu id="Notice_type"
							value="#{notice.to.type}">
							<f:selectItems value="#{groupWareCollections.noticeTypes}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="Notice_priority" 
							value="#{groupwareBundle.notice_priority}" />
						<aon:selectOneMenu id="Notice_priority"
							value="#{notice.to.priority}">
							<f:selectItems value="#{groupWareCollections.priorities}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="Notice_subject"
							value="#{groupwareBundle.notice_subject}" />
						<aon:inputTextarea id="Notice_subject"
							value="#{notice.to.subject}" cols="100" rows="7" />	

					</aon:panelGrid>
					
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
