<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="userList">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_users}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="user_search" actionListener="#{user.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="user_form" actionListener="#{user.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							rendered="#{domain.userManagement}"
							accesskey="#{bundle.aon_key_new}" />							
						<aon:commandButton id="groups" value="#{appBundle.aon_workgroups}"
							action="work_group" actionListener="#{workGroup.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-group"/>
						<aon:commandButton id="scopes" value="#{appBundle.aon_scopes}"
							action="scope" actionListener="#{scope.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-ambito"/>
<!--  
						<aon:commandButton id="profiles" value="#{appBundle.aon_profiles}"
							action="application_list" actionListener="#{domain.onLoadCurrentDomain}"
							styleClass="aon-finding-toolbar-item aon-icon-category"/>
-->
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="userDataList" value="#{user.model}"
					var="to" rows="20" rendered="#{user.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="user_form" actionListener="#{user.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{configBundle.user_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{configBundle.user_login}" />
						</f:facet>
						<aon:outputText value="#{to.login}"/>
					</aon:column>
 
				</aon:dataTable>

				<aon:dataScroller for="userDataList" rowCount="#{user.model.rowCount}" showNote="true" />

			</aon:div>
 
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
