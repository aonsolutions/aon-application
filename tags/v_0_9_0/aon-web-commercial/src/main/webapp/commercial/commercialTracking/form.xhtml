<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialTrackingForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_commercial_tracking}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{commercialTracking.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="commercialTracking_form"
							actionListener="#{commercialTracking.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{commercialTracking.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{commercialTracking.onCancel}"
							confirmAction="commercialTracking_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!commercialTracking.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{commercialTracking.onRemove}"
							confirmAction="commercialTracking_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!commercialTracking.new}" immediate="true"
							action="commercialTracking_search" actionListener="#{commercialTracking.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />							
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!commercialTracking.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{commercialTracking.onCancel}"
							action="commercialTracking_list"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:spin controller="#{commercialTracking}" action="commercialTracking_form" rendered="#{!commercialTracking.new}" />
													
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even">

					<aon:outputLabel for="CommercialTracking_date"
						value="#{appBundle.aon_commercial_tracking_date}" />
					<aon:selectInputDate id="CommercialTracking_date" 
						value="#{commercialTracking.to.date}" required="#{true}"
						timeZone="#{timeZoneController.timeZone}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="CommercialTracking_seller_id" 
						value="#{appBundle.aon_commercial_tracking_seller}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CommercialTracking_seller_id"
							lookup="#{sellerLookup}"
							reRender="CommercialTracking_seller_name"
							value="#{commercialTracking.to.seller.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="CommercialTracking_seller_lookup"
							windowTitle="#{appBundle.aon_lookup_seller}"
							selectReRender="CommercialTracking_seller_id,CommercialTracking_seller_name"
							lookup="#{sellerLookup}"
							property="#{commercialTracking.to.seller}">
						</aon:lookupButton>
						<aon:inputText id="CommercialTracking_seller_name"
							value="#{(commercialTracking.to.seller.registry.name!=null)?(commercialTracking.to.seller.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>

					<aon:outputLabel for="CommercialTracking_target_id"
						value="#{appBundle.aon_commercial_tracking_target}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CommercialTracking_target_id"
							lookup="#{targetLookup}"
							reRender="CommercialTracking_target_name"
							value="#{commercialTracking.to.target.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="CommercialTracking_target_lookup"
							windowTitle="#{appBundle.aon_lookup_target}"
							selectReRender="CommercialTracking_target_id,CommercialTracking_target_name"
							lookup="#{targetLookup}"
							property="#{commercialTracking.to.target}">
						</aon:lookupButton>
						<aon:lookupButton id="CommercialTracking_target_add"
							windowTitle="#{appBundle.aon_lookup_new_target}"
							selectReRender="CommercialTracking_target_id,CommercialTracking_target_name"
							lookup="#{targetLookup}" actionType="new"
							property="#{commercialTracking.to.target}">
						</aon:lookupButton>
						<aon:inputText id="CommercialTracking_target_name"
							value="#{(commercialTracking.to.target.registry.name!=null)?(commercialTracking.to.target.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>

					<aon:outputLabel for="CommercialTracking_activity_id"
						value="#{appBundle.aon_commercial_tracking_activity}" />
					<aon:selectOneMenu id="CommercialTracking_activity_id"
						required="true" value="#{commercialTracking.to.activity}">
						<f:converter converterId="toConverter" />
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{commercialTracking.activities}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="CommercialTracking_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="CommercialTracking_status"
						value="#{commercialTracking.to.status}">
						<f:selectItems
							value="#{commecialCollections.commercialTrackingStatuses}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="CommercialTracking_comments"
						value="#{appBundle.aon_commercial_tracking_comments}" />
					<aon:inputTextarea id="CommercialTracking_comments"
						value="#{commercialTracking.to.comments}" cols="51" rows="4" />

					<aon:outputLabel for="CommercialTracking_next_id"
						value="#{appBundle.aon_commercial_tracking_next_action}" />
					<aon:div>
						<aon:div>
							<aon:selectBooleanCheckbox id="CommercialTracking_next_id"
								reRender="next_action" disabled="#{!commercialTracking.new}"
								valueChangeListener="#{commercialTracking.nextActionChanged}"
								value="#{commercialTracking.nextAction}">
							</aon:selectBooleanCheckbox>
						</aon:div>
						<aon:div id="next_action">

							<aon:panelGrid rendered="#{commercialTracking.nextAction}" columns="2" dir="true" width="100%">

								<aon:outputLabel for="CommercialTracking_next_date"
									value="#{appBundle.aon_commercial_tracking_date}" />
								<aon:selectInputDate id="CommercialTracking_next_date"
									value="#{commercialTracking.to.next.date}" required="#{true}"
									renderAsPopup="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>

								<aon:outputLabel for="CommercialTracking_next_activity_id"
									value="#{appBundle.aon_commercial_tracking_activity}" />
								<aon:selectOneMenu id="CommercialTracking_next_activity_id"
									required="true" value="#{commercialTracking.to.next.activity}">
									<f:converter converterId="toConverter" />
									<f:selectItem value="#{null}" itemLabel="    " />
									<f:selectItems value="#{commercialTracking.activities}" />
								</aon:selectOneMenu>

								<aon:outputLabel for="CommercialTracking_next_comments"
									value="#{appBundle.aon_commercial_tracking_comments}" />
								<aon:inputTextarea id="CommercialTracking_next_comments"
									value="#{commercialTracking.to.next.comments}" cols="51"
									rows="4" />

							</aon:panelGrid>

						</aon:div>
					</aon:div>
				</aon:panelGrid>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
