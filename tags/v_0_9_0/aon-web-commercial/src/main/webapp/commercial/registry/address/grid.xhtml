<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="registryAddressData" var="to"
			value="#{controller.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top, 
				aon-editDataTable-buttonsColumn aon-vertical-align-top">

			<aon:rowSelector toggleOnClick="#{controller.to == null}"
				actionListener="#{controller.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{controller.onReset}" value=""
							rendered="#{!controller.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="80">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.addressType}"
					rendered="#{to!=controller.to}" />
				<aon:selectOneMenu rendered="#{to==controller.to}"
					value="#{controller.to.addressType}">
					<f:selectItems value="#{registryCollections.addressTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{controller.new}"
						value="#{controller.to.addressType}">
						<f:selectItems value="#{registryCollections.addressTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column width="300">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
					rendered="#{to!=controller.to}" />
				<aon:div>
					<aon:inputText value="#{controller.to.address}"
						rendered="#{to==controller.to}"
						required="true" size="40" maxlength="128" />
				</aon:div>
				<aon:div>
					<aon:inputText value="#{controller.to.address2}"
						rendered="#{to==controller.to}"
						size="40" maxlength="128" />
				</aon:div>
				<aon:div>
					<aon:inputText value="#{controller.to.address3}"
						rendered="#{to==controller.to}"
						size="40" maxlength="128" />
				</aon:div>						
				<f:facet name="footer">
					<aon:div>
						<aon:div>
							<aon:inputText id="Address" value="#{controller.to.address}"
								rendered="#{controller.new}"
								required="#{true}" size="40"  maxlength="128" />
						</aon:div>
						<aon:div>						
							<aon:inputText value="#{controller.to.address2}"
								rendered="#{controller.new}"
								size="40"  maxlength="128" />
						</aon:div>
						<aon:div>						
							<aon:inputText value="#{controller.to.address3}"
								rendered="#{controller.new}"
								size="40"  maxlength="128" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="50">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_zip}" />
				</f:facet>
				<aon:outputText value="#{to.zip}" rendered="#{to!=controller.to}" />
				<aon:inputText value="#{controller.to.zip}"
					rendered="#{to==controller.to}"
					required="true" size="8" maxlength="16" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText id="Zip" value="#{controller.to.zip}"
							rendered="#{controller.new}"
							required="#{true}" size="8" maxlength="16" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="150">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_city}" />
				</f:facet>
				<aon:outputText value="#{to.city}" rendered="#{to!=controller.to}" />
				<aon:inputText value="#{controller.to.city}"
					rendered="#{to==controller.to}"
					required="true" size="20" maxlength="64" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText id="City" value="#{controller.to.city}"
							rendered="#{controller.new}"
							required="true" size="20" maxlength="64" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="130">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_geozone}" />
				</f:facet>
				<aon:outputText value="#{to.geozone.name}"
					rendered="#{to!=controller.to}" />
				<aon:selectOneMenu value="#{controller.to.geozone.id}"
					rendered="#{to==controller.to}"
					valueChangeListener="#{controller.onChangeGeoZone}">
					<f:selectItems value="#{geozoneCollections.geoTrees}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:div>
						<aon:selectOneMenu value="#{controller.to.geozone.id}"
							rendered="#{controller.new}">
							<f:selectItems value="#{geozoneCollections.geoTrees}" />
						</aon:selectOneMenu>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=controller.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						actionListener="#{controller.onAccept}"
						rendered="#{to==controller.to}" value=""
						reRender="registryAddressDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton 
						title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==controller.to}"
						actionListener="#{controller.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-registryAddress"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==controller.to}" reRender="registryAddressDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{controller.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!controller.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{controller.onAccept}"
							rendered="#{controller.new}" value=""
							reRender="registryAddressDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-registryAddress"
							title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{controller.new}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{controller.onCancel}"
							immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
		
		<aon:div id="registryAddressDataScroller" layout="none" rendered="#{showDataScroller}">
			<aon:dataScroller2 for="registryAddressData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
