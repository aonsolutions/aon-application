<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="balanceForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_loan_module}" />
				<ui:param name="controller" value="#{loan}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
				
					<aon:outputLabel for="Loan_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Loan_id"
						disabled="true"
						value="#{loan.to.id}" size="5" />

					<aon:outputLabel for="Loan_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Loan_description"
						value="#{loan.to.description}" size="60" />

					<aon:outputLabel for="Loan_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Loan_date" required="true"
						value="#{loan.to.loanDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Loan_term"
						value="#{accountingBundle.accounting_term}" />
					<aon:div>
						<aon:inputText id="Loan_term" value="#{loan.to.term}" size="8"/>
						<aon:outputText value="#{accountingBundle.accounting_term_months}"
							styleClass="aon-italic aon-margin-left" />						
					</aon:div>

					<aon:outputLabel for="Loan_recurrence"
						value="#{accountingBundle.accounting_recurrence}" />
					<aon:inputText id="Loan_recurrence"
						value="#{loan.to.recurrence}" size="5">
						<f:validateLongRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_pay_day"
						value="#{accountingBundle.accounting_pay_day}" />
					<aon:inputText id="Loan_pay_day"
						value="#{loan.to.payDay}" size="5">
						<f:validateLongRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_interest"
						value="#{accountingBundle.accounting_interest}" />
					<aon:inputText id="Loan_interest"
						value="#{loan.to.interest}" size="60" />

					<aon:outputLabel for="Loan_review"
						value="#{accountingBundle.accounting_review}" />
					<aon:inputText id="Loan_review"
						value="#{loan.to.review}" size="60" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{loan.to.registryBank}">
						<f:selectItem value="#{null}" itemLabel="-" />
						<f:selectItems value="#{companyCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Loan_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Loan_amount"
						value="#{loan.to.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_expenses"
						value="#{accountingBundle.accounting_expenses}" />
					<aon:inputText id="Loan_expenses"
						value="#{loan.to.expenses}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_fee_amount"
						value="#{accountingBundle.accounting_fee_amount}" />
					<aon:inputText id="Loan_fee_amount"
						value="#{loan.to.feeAmount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneRadio id="Loan_securityLevel"
						value="#{loan.to.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneRadio>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
