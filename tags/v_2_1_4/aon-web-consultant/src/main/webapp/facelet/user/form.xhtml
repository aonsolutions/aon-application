<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/login/js/Login.js">
			// nothing
		</script>
	</ui:define>

	<ui:define name="content">

		<h:form id="userForm">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{user.accept}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							forceId="#{true}" immediate="#{true}" action="user_list"
							actionListener="#{user.onCancel}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
							accesskey="#{bundle.aon_key_cancel}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!user.new}" forceId="#{true}" immediate="true"
							action="user_list" actionListener="#{user.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							accesskey="#{bundle.aon_key_remove}" />
						<t:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!user.new}" action="user_form"
							actionListener="#{user.onReset}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'"
							accesskey="#{bundle.aon_key_new}" />
						<t:commandButton id="search" value="#{bundle.aon_search}"
							immediate="#{true}" action="user_search"
							actionListener="#{user.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{user.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">

					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="User_name"
							styleClass="aon-form-input-text-label"
							value="#{configBundle.user_name}" />
						<t:inputText id="User_name"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{user.to.name}" size="80" maxlength="64"/>

						<t:outputLabel for="User_login"
							styleClass="aon-form-input-text-label"
							value="#{configBundle.user_login}" />
						<t:inputText id="User_login" required="true"
							styleClass="aon-form-input-text" forceId="#{true}" disabled="#{!user.new}"
							value="#{user.to.login}" size="20" maxlength="16"/>

						<f:verbatim>&nbsp;</f:verbatim>
						<t:div id="Employee_security_data" forceId="#{true}">
							<h:panelGrid columns="6" cellpadding="0" cellspacing="0"
								styleClass="aon-form-table" width="100%"
								rendered="#{user.new}"
								columnClasses="aon-form-table-column-odd,aon-form-table-column-even
													,aon-form-table-column-odd,aon-form-table-column-even
													,aon-form-table-column-odd,aon-form-table-column-even">

								<h:outputLabel for="User_password"
									styleClass="aon-form-input-text-label"
									value="#{securityBundle.aon_security_new_password}" />
								<t:inputSecret id="User_password" size="16" maxlength="16"
									styleClass="aon-form-input-text" required="true"
									value="#{user.userManager.password}" />
								<h:outputLabel for="User_confirm_password"
									styleClass="aon-form-input-text-label"
									value="#{securityBundle.aon_security_confirm_password}" />
								<t:inputSecret id="User_confirm_password" size="16"
									required="true"
									maxlength="16" styleClass="aon-form-input-text"
									value="#{user.userManager.confirmPassword}" />
							</h:panelGrid>
							<h:panelGrid cellpadding="0" cellspacing="0"
								styleClass="aon-form-table" width="100%">
								<h:outputLabel for="userData"
									value="#{securityBundle.aon_security_profiles}"
									styleClass="aon-form-input-text-label" />
								<t:selectManyCheckbox id="userData"
									value="#{user.userManager.relations}" layout="pageDirection"
									layoutWidth="5" styleClass="selectManyCheckbox">
									<f:selectItems value="#{user.userManager.profiles}" />
								</t:selectManyCheckbox>
							</h:panelGrid>
						</t:div>
					</h:panelGrid>

					<t:div styleClass="aon-form-group" rendered="#{!user.new}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="UserWorkGroupDataList"
								rendered="#{!user.new}" value="#{configBundle.workgroup_workgroups}" />
						</t:div>
						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="UserWorkGroupDataList" var="to"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" cellpadding="0"
								cellspacing="0" value="#{userWorkGroup.model}"
								rowOnMouseOver="selectRow( this )" rendered="#{!user.new}"
								rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
								rowIndexVar="rowIndex" rows="20"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-buttons">

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:commandLink styleClass="aon-table-row-selected"
										rendered="#{to!=userWorkGroup.to}"
										actionListener="#{userWorkGroup.onSelect}" />
									<f:verbatim>&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<t:commandButton value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												actionListener="#{userWorkGroup.onReset}"
												rendered="#{!userWorkGroup.new}"
												accesskey="#{bundle.aon_key_new_line}" />
											<f:verbatim rendered="#{userWorkGroup.new}">&#160;</f:verbatim>
										</t:div>
									</f:facet>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{configBundle.workgroup_workgroups}" />
									</f:facet>
									<t:outputText value="#{to.workGroup.description}"
										rendered="#{to!=userWorkGroup.to}" />
									<h:selectOneMenu value="#{userWorkGroup.to.workGroup.id}"
										styleClass="aon-form-selectOneMenu-field"
										valueChangeListener="#{userWorkGroup.onWorkGroupChanged}"
										rendered="#{to==userWorkGroup.to}">
										<f:selectItems value="#{configCollections.workgroups}" />
									</h:selectOneMenu>
									<f:facet name="footer">
										<t:div>
											<h:selectOneMenu value="#{userWorkGroup.to.workGroup.id}"
												styleClass="aon-form-selectOneMenu-field"
												valueChangeListener="#{userWorkGroup.onWorkGroupChanged}"
												rendered="#{userWorkGroup.new}">
												<f:selectItems value="#{configCollections.workgroups}" />
											</h:selectOneMenu>
										</t:div>
									</f:facet>
								</h:column>

								<t:column width="60">
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:div rendered="#{to==userWorkGroup.to}">
										<t:commandButton title="#{bundle.aon_save}"
											actionListener="#{userWorkGroup.onAccept}"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
											value="" accesskey="#{bundle.aon_key_save_line}" />
										<t:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{userWorkGroup.onCancel}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
											value="" accesskey="#{bundle.aon_key_cancel_line}" />
										<t:commandButton title="#{bundle.aon_remove}"
											actionListener="#{userWorkGroup.onRemove}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
											value="" accesskey="#{bundle.aon_key_remove_line}" />
									</t:div>
									<f:verbatim rendered="#{to!=userWorkGroup.to}">&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<t:div rendered="#{userWorkGroup.new}">
												<t:commandButton title="#{bundle.aon_save}"
													actionListener="#{userWorkGroup.onAccept}"
													onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
													value="" accesskey="#{bundle.aon_key_save_line}" />
												<t:commandButton title="#{bundle.aon_cancel}"
													actionListener="#{userWorkGroup.onCancel}"
													immediate="#{true}"
													onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
													value="" accesskey="#{bundle.aon_key_cancel_line}" />
											</t:div>
											<f:verbatim rendered="#{!userWorkGroup.new}">&#160;</f:verbatim>
										</t:div>
									</f:facet>
								</t:column>
							</t:dataTable>

							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="UserWorkGroupDataList" />
								<ui:param name="model" value="#{userWorkGroup.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>

						</t:div>
					</t:div>

					<ui:include src="/facelet/config/userScope/grid.xhtml" />

				</t:div>
			</t:div>
		</h:form>

		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
