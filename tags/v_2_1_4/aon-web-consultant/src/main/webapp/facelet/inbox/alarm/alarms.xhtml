<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-table-hack">
		<t:dataTable id="inboxAlarmDataList" cellpadding="0" cellspacing="0"
			var="to" value="#{alarm.model}" rows="20"
			rowOnMouseOver="selectRow( this )" rowOnMouseOut="unselectRow( this )"
			rowOnClick="sendRow( this )"
			styleClass="aon-table" headerClass="aon-table-header"
			rowClasses="aon-table-row-odd,aon-table-row-even"
			columnClasses="aon-table-body aon-table-body-string,
				aon-table-body aon-table-body-string,
				aon-table-body aon-table-body-string,
				aon-table-body aon-table-body-string">

			<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{projectBundle.aon_description}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{to.description}" />
				<t:commandLink immediate="#{true}" 
					styleClass="aon-table-row-selected"
					action="alarm_form" 
					actionListener="#{alarm.onSelect}" />
			</h:column>
			
			<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{customerBundle.customer_customer}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{alarm.currentAlarmCustomer}" />
			</h:column>
			
			<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{projectBundle.aon_date}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{to.alarmDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</h:outputText>		
			</h:column>
			
			<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{projectBundle.aon_source}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{to.source}"/>
			</h:column>

		</t:dataTable>
	</t:div>
		
</ui:composition>
</body>
</html>
