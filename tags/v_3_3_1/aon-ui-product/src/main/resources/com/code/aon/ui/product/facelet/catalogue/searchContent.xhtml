<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="Catalogue_name"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Catalogue_name" size="32"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel value="#{bundle.aon_start_date}" />
	<aon:div>
		<aon:outputLabel for="Catalogue_startDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Catalogue_startDate-From"
			value="#{catalogueSearch.startDateFrom}" 
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Catalogue_startDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Catalogue_startDate-To"
			value="#{catalogueSearch.startDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
	<aon:outputLabel value="#{bundle.aon_end_date}" />
	<aon:div>
		<aon:outputLabel for="Catalogue_endDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Catalogue_endDate-From"
			value="#{catalogueSearch.endDateFrom}" 
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Catalogue_endDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Catalogue_endDate-To"
			value="#{catalogueSearch.endDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
</ui:composition>
