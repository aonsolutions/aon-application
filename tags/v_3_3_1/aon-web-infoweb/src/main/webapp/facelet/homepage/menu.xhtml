<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
			
	<c:if test="#{!aonConfiguration.properties.hideMenuBar}">			
		<aon:form>
			<aon:div id="treeButtonsGrid" styleClass="aon-top-menu">
				
				<aon:commandLink id="company" 
					title="#{companyBundle.company_data_module}" action="company" 
					value="#{companyBundle.company_data_module}"
					actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
					<f:setPropertyActionListener value="#{false}" target="#{company.showRegistryBank}" />
					<f:setPropertyActionListener value="#{false}" target="#{company.showCompanyOtherData}" />
				</aon:commandLink>
	
				<aon:commandLink id="otherdata" 
					title="#{appBundle.infoweb_data}" action="otherdata" 
					value="#{appBundle.infoweb_data}"
					actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
				</aon:commandLink>
	
				<aon:commandLink id="images" 
					title="#{appBundle.infoweb_images}" action="images" 
					value="#{appBundle.infoweb_images}"
					actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
				</aon:commandLink>
	
				<aon:commandLink id="pages" 
					title="#{appBundle.infoweb_pages}" action="pages" 
					value="#{appBundle.infoweb_pages}"
					actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
				</aon:commandLink>
	
				<aon:commandLink id="templates" 
					title="#{appBundle.infoweb_template}" action="templates" 
					value="#{appBundle.infoweb_template}"
					styleClass="aon-top-menu-item">
					<aon:actionListener method="#{company.onLoad}" />
					<aon:actionListener method="#{webPageStyle.onLoad}" />
				</aon:commandLink>
	
				<aon:commandLink id="generate" 
					title="#{appBundle.infoweb_generate}" action="generate" 
					value="#{appBundle.infoweb_generate}"
					actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
				</aon:commandLink>
				
			</aon:div>
		</aon:form>
	</c:if>
</ui:composition>
