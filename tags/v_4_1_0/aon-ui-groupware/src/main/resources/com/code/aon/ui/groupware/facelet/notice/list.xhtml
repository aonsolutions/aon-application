<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="noticeList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{groupwareBundle.aon_notice}" />
				<ui:param name="controller" value="#{notice}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<aon:dataTable id="noticeDataList" value="#{notice.model}"
					var="to" rows="20" rendered="#{notice.model.rowCount > 0}"
					columnsWidth="150,150,150,auto,auto,150">

					<aon:rowSelector action="notice_form" actionListener="#{notice.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.notice_recipient}" />
						</f:facet>
						<aon:outputText rendered="#{to.recipient != null}" value="#{to.recipient.name}" />
						<aon:outputText rendered="#{to.recipient == null}" value="#{groupwareBundle.groupware_all}" />
					</aon:column>

					<aon:column styleClass="aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.notice_work_group}" />
						</f:facet>
						<aon:outputText rendered="#{to.workGroup != null}" value="#{to.workGroup.description}" />
						<aon:outputText rendered="#{to.workGroup == null}" value="#{groupwareBundle.groupware_all}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.notice_source}" />
						</f:facet>
						<aon:outputText value="#{to.source}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.notice_company}" />
						</f:facet>
						<aon:outputText value="#{to.company}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.notice_subject}" />
						</f:facet>
						<aon:outputText value="#{to.subject}">
							<aon:abbreviateConverter maxWidth="50" />
						</aon:outputText>
					</aon:column>						
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.date}">
							<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>				
				</aon:dataTable>

				<aon:dataScroller2 for="noticeDataList" showNote="true" />

			</aon:div>

		</aon:form>
	</ui:define>

</ui:composition>
