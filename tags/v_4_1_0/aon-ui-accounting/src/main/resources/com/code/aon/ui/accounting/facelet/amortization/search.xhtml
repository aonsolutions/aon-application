<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="amortizationForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_amortization_form_module}" />
				<ui:param name="controller" value="#{amortization}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{amortization.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="amortization_list" />				
				
					<aon:outputLabel for="Amortization_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Amortization_id" size="50"
						valueChangeListener="#{amortization.addExpression}" />

					<aon:outputLabel for="Amortization_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Amortization_description" size="50"
						valueChangeListener="#{amortization.addExpression}" />

					<aon:outputLabel for="Amortization_comment"
						value="#{bundle.aon_comment}" />
					<aon:inputText id="Amortization_comments" size="80"
						valueChangeListener="#{amortization.addExpression}" />
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
