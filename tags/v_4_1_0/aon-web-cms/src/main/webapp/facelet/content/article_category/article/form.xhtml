<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

			<aon:div styleClass="aon-scroll-area">

				<aon:panelTabSet id="tabPanelTypesForm"> 
					<aon:panelTab id="content" label="#{appBundle.aon_content}">


		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.article}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{article.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!article.new and cms.roleEditor}"
							action="article_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{article.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{article.to!=null or article.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{article.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!article.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{article.onRemove}"
							confirmAction="article_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="article_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{article.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="article_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{article.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="generate_article"
							value="#{appBundle.aon_generate}" 
							rendered="#{article.to!=null and cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateCurrentArticle}" />
							<a4j:support 
								event="onclick" 
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid" 
								onclick="javascript:Richfaces.showModalPanel('gen_log',{width:680, top:100});" />
						</aon:commandButton>	
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{article.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="categories"
							value="#{appBundle.article_category}"
							action="article_category_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item">
							<aon:actionListener method="#{article_category.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
								
						<aon:panelGrid id="main_panel" columns="2" dir="true" style="width:100%">
	
							<aon:outputLabel for="Article_alias" style="width:100px"
								value="#{appBundle.article_alias}" />
							<aon:inputText id="Article_alias"
								required="true" size="32" maxlength="32"
								value="#{article.to.alias}">
								<f:validator validatorId="AliasValidator" />
							</aon:inputText>
		
							<aon:outputLabel for="Article_category"
								value="#{appBundle.article_category}"/>
							<aon:selectOneMenu id="Article_category"  
								required="true"
								value="#{article.to.articleCategory.id}">
								<f:selectItem itemLabel="-" itemValue="" />
								<f:selectItems value="#{collections.articleCategoryList}" />
							</aon:selectOneMenu>
		
							<aon:outputLabel for="Article_type"
								value="#{appBundle.article_type_}"/>
							<aon:selectOneMenu id="Article_type"  
								required="true"
								value="#{article.to.articleType}">
								<f:selectItem itemLabel="-" itemValue="" />
								<f:selectItems value="#{collections.articleTypes}" />
								<a4j:support 
									event="onchange" 
									ajaxSingle="true" 
									reRender="dates_initDate,dates_endDate" />
							</aon:selectOneMenu>
		
							<aon:outputLabel for="ArticleDetail_publishDate"
								value="#{appBundle.article_publishDate}" />
							<aon:selectInputDate id="ArticleDetail_publishDate"
								required="true"  
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{article.to.publishDate}" renderAsPopup="true"
								 enableManualInput="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>	
							
							<aon:outputLabel for="ArticleDetail_expireDate"
								value="#{appBundle.article_expireDate}" />
							<aon:selectInputDate id="ArticleDetail_expireDate" 
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{article.to.expireDate}" renderAsPopup="true"
								 enableManualInput="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>	
		
							<aon:outputLabel for="ArticleDetail_title"
								value="#{appBundle.article_title}" />
							<aon:inputText id="ArticleDetail_title"
								required="true" size="80" maxlength="255"
								value="#{article.toI18n.title}" />
		
							<aon:outputLabel for="ArticleDetail_subtitle"
								value="#{appBundle.article_subtitle}" />
							<aon:inputText id="ArticleDetail_subtitle"
								size="80" maxlength="255"
								value="#{article.toI18n.subtitle}" />

							<aon:outputLabel for="ArticleDetail_initDate"
								value="#{appBundle.article_initDate}" />
							<aon:div id="dates_initDate">		
								<aon:selectInputDate id="ArticleDetail_initDate"
									 style="z-index:2001;margin:0;vertical-align:middle;"
									 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
									 value="#{article.to.initDate}" renderAsPopup="true"
									 enableManualInput="true"
									 popupDateFormat="#{bundle.aon_date_pattern}"
									 rendered="#{article.diary}">
									 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
								</aon:selectInputDate>
								<aon:outputText rendered="#{!article.diary}" value="Not allowed" />
							</aon:div>
								
							<aon:outputLabel for="ArticleDetail_endDate"
								value="#{appBundle.article_endDate}" />
							<aon:div id="dates_endDate">		
								<aon:selectInputDate id="ArticleDetail_endDate"
									 style="z-index:2001;margin:0;vertical-align:middle;"
									 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
									 value="#{article.to.endDate}" renderAsPopup="true"
									 popupDateFormat="#{bundle.aon_date_pattern}"
									 enableManualInput="true"
									 rendered="#{article.diary}">
									 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
								</aon:selectInputDate>	
								<aon:outputText rendered="#{!article.diary}" value="Not allowed" />
							</aon:div>
		
							<aon:outputLabel for="Article_richTextEnabled"
								value="#{appBundle.generic_page_richtext_enabled}" />
							<aon:selectBooleanCheckbox id="Article_richTextEnabled"
								value="#{article.richTextEnabled}">
								<a4j:support 
									ajaxSingle="true"
									event="onclick"  
									reRender="article_richtext" />
							</aon:selectBooleanCheckbox>
				
							<aon:outputLabel for="ArticleDetail_content" 
								style="width:100px"
								value="#{appBundle.article_content}" />
							<aon:div id="article_richtext">		
								<aon:div sytle="width:100%" rendered="#{article.richTextEnabled}">
									<aon:inputRichText style="width:800px" 
										id="ArticleDetail_content" 
										value="#{article.toI18n.content}" />
								</aon:div>
								<aon:inputTextarea id="Article_content_TA"
									rendered="#{!article.richTextEnabled}" 
									rows="20" style="width:98%" 
									value="#{article.toI18n.content}"/>
							</aon:div>
		
							<aon:outputLabel 
								value="#{appBundle.albumImage_image}" />
							<aon:panelGroup id="thumbnail_preview">
								<aon:graphicImage 
									url="#{article.to.image}.thumbnail" 
									alt="#{article.to.image}"/>
				                <aon:commandLink
				                	immediate="#{true}"
				                	reRender="thumbnail_preview"
				                    actionListener="#{article.onDelImage}">
									<aon:graphicImage url="/images/cms/inactive.png" />
				        		</aon:commandLink>
								<ui:include src="/facelet/content/utils/image_modal.xhtml">
									<ui:param name="modalPanelName" value="mp" />
									<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
									<ui:param name="galleryBean" value="#{gallery}" />
									<ui:param name="listenerBean" value="#{article}" />
									<ui:param name="reRender" value="thumbnail_preview" />
									<ui:param name="image" value="#{true}" />
									<ui:param name="thumbnail" value="#{false}" />
								</ui:include>
		   
								<aon:outputLabel 
									value="#{appBundle.article_thumbnail}" />
								<aon:graphicImage
									url="#{article.to.thumbnail}.thumbnail" 
									alt="#{article.to.thumbnail}"/>
				                <aon:commandLink
				                	immediate="#{true}"
				                	reRender="thumbnail_preview"
				                    actionListener="#{article.onDelThumbnail}">
									<aon:graphicImage url="/images/cms/inactive.png" />
				        		</aon:commandLink>
								<ui:include src="/facelet/content/utils/image_modal.xhtml">
									<ui:param name="modalPanelName" value="mp_thumbnail" />
									<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
									<ui:param name="galleryBean" value="#{gallery}" />
									<ui:param name="listenerBean" value="#{article}" />
									<ui:param name="reRender" value="thumbnail_preview" />
									<ui:param name="image" value="#{false}" />
									<ui:param name="thumbnail" value="#{true}" />
								</ui:include>
							</aon:panelGroup>
								
							<aon:outputLabel for="ArticleDetail_image_info"
								value="#{appBundle.article_image_info}" />
							<aon:inputText id="ArticleDetail_image_info"
								size="90" maxlength="255"
								value="#{article.toI18n.image_info}" />
		
							<aon:outputLabel for="ArticleDetail_alt"
								value="#{appBundle.article_alt}" />
							<aon:inputText id="ArticleDetail_alt"
								size="64" maxlength="64"
								value="#{article.toI18n.alt}" />
		
							<aon:outputLabel for="ArticleDetail_alt_thumbnail"
								value="#{appBundle.article_alt_thumbnail}" />
							<aon:inputText id="ArticleDetail_alt_thumbnail"
								size="64" maxlength="64"
								value="#{article.toI18n.alt_thumbnail}" />	
																					        	
							<aon:outputLabel for="Article_position"
								value="#{appBundle.article_position}"/>
							<aon:inputText id="Article_position"
								required="true" size="10" maxlength="8"
								value="#{article.to.position}" />
							
							<aon:outputLabel for="Article_active"
								value="#{appBundle.article_active}"/>
							<aon:selectBooleanCheckbox id="Article_active" 
								value="#{article.to.active}" />

						</aon:panelGrid>

		</aon:form>
						
					</aon:panelTab>

					<aon:panelTab id="meta_tags" label="#{appBundle.article_related_list}"
						rendered="#{!article.new}">
						
		<aon:form id="main_form_1">
						<aon:div id="articleRelatedData">
						
							<aon:dataTable id="articleRelatedDataTable" 
								value="#{articleRelated.model}" var="to"
								rows="#{articleRelated.pageLimit}"
								styleClass="dr-table rich-table aon-editDataTable"
								headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
								footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
								rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
								cellpadding="0" cellspacing="0"
								columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn">
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:outputText value="&#160;" />
									<f:facet name="footer">
										<aon:div>
											<aon:commandButton id="reset"
												title="[#{bundle.aon_reset}]"
												styleClass="aon-editDataTable-button aon-icon-reset" 
												value=""
												immediate="true" 
												reRender="articleRelatedData"
												rendered="#{!articleRelated.new}" 
												accesskey="#{bundle.aon_key_new_line}">
												<aon:actionListener method="#{articleRelated.onReset}" />
											</aon:commandButton>
										</aon:div>
									</f:facet>
								</aon:column>
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.article_related_name}" />
									</f:facet>
									<aon:outputText value="#{to.articleRelated.alias}">
										<a4j:support 
											reRender="articleRelatedData"
											actionListener="#{articleRelated.onSelect}"
											event="onclick" />
									</aon:outputText>					
									<f:facet name="footer">
										<aon:selectOneMenu styleClass="aon-form-selectOneMenu-field"
											rendered="#{articleRelated.new}" 
											value="#{articleRelated.to.articleRelated.id}">
											<f:selectItems value="#{collections.articleList}" />
										</aon:selectOneMenu>
									</f:facet>
								</aon:column>
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<f:verbatim rendered="#{to!=articleRelated.to}">&#160;</f:verbatim>
									<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
										rendered="#{to==articleRelated.to}"
										styleClass="aon-editDataTable-button aon-icon-delete"
										reRender="articleRelatedData" 
										immediate="true">
										<aon:actionListener method="#{articleRelated.onRemove}" />
									</aon:commandButton>
									<f:facet name="footer">
										<aon:div rendered="#{articleRelated.new}">
											<f:verbatim rendered="#{!articleRelated.new}">&#160;</f:verbatim>
											<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
												styleClass="aon-editDataTable-button aon-icon-accept"
												reRender="articleRelatedData">
												<aon:actionListener method="#{articleRelated.accept}" />
											</aon:commandButton>
											<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												reRender="articleRelatedData" 
												immediate="true">
												<aon:actionListener method="#{articleRelated.onCancel}" />
											</aon:commandButton>
										</aon:div>
									</f:facet>
								</aon:column>
							</aon:dataTable>
							
							<aon:dataScroller
								for="articleRelatedDataTable"
								rowCount="#{articleRelated.model.rowCount}" 
								showNote="true" />					
								
						</aon:div>
		</aon:form>
							
                    </aon:panelTab>

					<aon:panelTab id="files" label="#{appBundle.document_related_list}"
						rendered="#{!article.new}">

		<aon:form id="main_form_2">
						<aon:div id="articleDocumentData">
							<aon:dataTable id="articleDocumentDataTable" 
								value="#{articleDocument.model}" var="to"
								rows="#{articleDocument.pageLimit}"
								styleClass="dr-table rich-table aon-editDataTable"
								headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
								footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
								rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
								cellpadding="0" cellspacing="0"
								columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn,
										dr-table-cell rich-table-cell aon-editDataTable-textColumn">
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:outputText value="&#160;" rendered="#{to==articleDocument.to}" />
									<f:facet name="footer">
										<aon:div>
											<aon:commandButton id="reset"
												title="[#{bundle.aon_reset}]"
												styleClass="aon-editDataTable-button aon-icon-reset" value=""
												immediate="true" reRender="articleDocumentData"
												rendered="#{!articleDocument.new}" 
												accesskey="#{bundle.aon_key_new_line}">
												<aon:actionListener method="#{articleDocument.onReset}" />
											</aon:commandButton>
										</aon:div>
									</f:facet>
								</aon:column>
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.document_related_name}" />
									</f:facet>
									<aon:div rendered="#{to!=articleDocument.to}" >
										<aon:outputText value="#{to.alias}" >
											<a4j:support 
												reRender="articleDocumentData"
												actionListener="#{articleDocument.onSelect}"
												event="onclick" />
										</aon:outputText>					
									</aon:div>
									<aon:div rendered="#{to==articleDocument.to}">
										<aon:panelGrid columns="2" dir="true">
											<aon:outputText value="#{appBundle.document_related_alias}" />
											<aon:inputText  
												id="Alias"
												size="60" maxlength="255"
												value="#{articleDocument.to.alias}">
												<f:validator validatorId="AliasValidator" />
											</aon:inputText>
												
											<aon:outputText value="#{appBundle.document_related_title}" />
											<aon:inputText 
												id="Title"
												size="60" maxlength="255"
												value="#{articleDocument.toI18n.title}" />
												
											<aon:outputText value="#{appBundle.document_related}" />
											<aon:outputText 
												size="60" maxlength="255"
												value="#{articleDocument.toI18n.file}" />
											<aon:outputText value="#{appBundle.document_related_description}" 
												for="Description" />
											<aon:inputTextarea
												id="Description"
												cols="60" rows="20" 
												value="#{articleDocument.toI18n.description}"/>
										</aon:panelGrid>
									</aon:div>
									<f:facet name="footer">
										<aon:div rendered="#{articleDocument.new}">
											<aon:panelGrid columns="2" dir="true">
												<aon:outputText value="#{appBundle.document_related_alias}" 
													for="Alias_" />
												<aon:inputText 
													id="Alias_"
													size="80" maxlength="255"
													value="#{articleDocument.to.alias}" />
													
												<aon:outputText value="#{appBundle.document_related_title}" 
													for ="Title_"/>
												<aon:inputText 
													id="Title_"
													size="80" maxlength="255"
													value="#{articleDocument.toI18n.title}" />
													
												<aon:outputText value="#{appBundle.document_related}" 
													for="Description" />
												<aon:div>
													<aon:outputText 
														size="60" maxlength="255"
														value="#{articleDocument.toI18n.file}" />
													<aon:fileUpload id="attach_file" 
															width="100%" 
															addControlLabel="#{appBundle.aon_upload_add}" 
															stopControlLabel="#{appBundle.aon_upload_stop}" 
															stopEntryControlLabel="#{appBundle.aon_upload_stop}"
															uploadControlLabel="#{appBundle.aon_upload_upload}"
															cancelEntryControlLabel="#{appBundle.aon_upload_cancel}"
															clearAllControlLabel="#{appBundle.aon_upload_clear_all}" 
															clearControlLabel="#{appBundle.aon_upload_clear}"
															doneLabel="#{appBundle.aon_upload_done}" 
															progressLabel="#{appBundle.aon_upload_progress}" 
															sizeErrorLabel="#{appBundle.aon_upload_size_error}" 
															transferErrorLabel="#{appBundle.aon_upload_transfer_error}" 
															fileUploadListener="#{articleDocument.fileUploaded}"
															immediateUpload="true" autoclear="false" listHeight="70px" listWidth="100%">
														<a4j:support event="onuploadcomplete" reRender="articleDocumentData" />
													</aon:fileUpload>
												</aon:div>
