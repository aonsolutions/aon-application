<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

<style>
.bodyPanel {
	width:920px;
    height:178px;
    overflow:auto;
}
</style>

    <a4j:region>
        <h:form>
            <a4j:poll id="poll" interval="2000" enabled="#{generator_status.activePoll}" reRender="poll,grid"/>
        </h:form>
    </a4j:region>
	<h:form>
        <rich:modalPanel id="#{modalPanelName}" minHeight="550" height="550"  minWidth="1000" width="1000">
            <f:facet name="header">
                <h:outputText value="Generator" />
            </f:facet>
            <f:facet name="controls">
                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('#{modalPanelName}')" />
            </f:facet>
			<rich:panel bodyClass="inpanelBody" id="grid">
         		<aon:div styleClass="aon-header">
					<aon:panelGrid columns="1" width="100%" columnClasses="aon-header-name">
						<aon:div>
							<aon:outputLabel value="Logs" styleClass="aon-applicationName"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
				<rich:panel bodyClass="bodyPanel">
			        <rich:dataList id="dataList" var="msg" value="#{generator_status.status}">
						<h:outputText value="#{msg}"/>
					</rich:dataList>
				</rich:panel>
				<br/><rich:separator height="2" lineType="dashed"/><br/>
         		<aon:div styleClass="aon-header">
					<aon:panelGrid columns="1" width="100%" columnClasses="aon-header-name">
						<aon:div>
							<aon:outputLabel value="Errores" styleClass="aon-applicationName"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
				<rich:panel bodyClass="bodyPanel">
			        <rich:dataList id="dataList_Error" var="msg" value="#{generator_status.errors}">
						<h:outputText style="color:red;" value="#{msg}"/>
					</rich:dataList>
				</rich:panel>
			</rich:panel>
        </rich:modalPanel>
	</h:form>
</ui:composition>
