<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<aon:outputLabel for="Target_id"
		value="#{target.bundle.commercial_target}" />
	<aon:div styleClass="aon-lookup">
		<aon:lookupInputText id="Target_id" lookup="#{targetLookup}"
 			reRender="Offer_target_full_name"
			value="#{offerSearch.target.id}"
			size="5" />
		<aon:lookupButton 
			windowTitle="#{commercialBundle.commercial_target_selection}" actionType="search"
			property="#{offerSearch.target}" selectReRender="Offer_target_id,Offer_target_full_name" 
			lookup="#{targetLookup}" minHeight="460" minWidth="650">
		</aon:lookupButton>
		<aon:inputText id="Offer_target_full_name"
			value="#{(offerSearch.target.registry.name!=null)?(offerSearch.target.registry.fullName):('')}"
			size="50" disabled="true" />							
	</aon:div>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Offer_issueDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Offer_issueDate-From"
			value="#{offerSearch.issueDateFrom}" 
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Offer_issueDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Offer_issueDate-To"
			value="#{offerSearch.issueDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
	<aon:outputLabel for="Offer_securityLevel"
		value="#{bundle.aon_security_level}" />
	<aon:selectOneMenu id="Offer_securityLevel"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{commonCollections.securityLevels}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="Offer_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="Offer_status"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{commercialCollections.offerStatuses}" />
	</aon:selectOneMenu>

</ui:composition>
