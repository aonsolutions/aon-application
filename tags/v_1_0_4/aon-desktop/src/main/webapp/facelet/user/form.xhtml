<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		
		<aon:form id="userForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_users}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{user.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{user.accept}"	action="user_form"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="user_search"
							actionListener="#{user.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true"
							actionListener="#{user.onCancel}" action="user"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="groups" value="#{appBundle.aon_workgroups}"
							action="work_group" actionListener="#{workGroup.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-group" />
						<aon:commandButton id="scopes" value="#{appBundle.aon_scopes}"
							action="scope" actionListener="#{scope.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-ambito" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="User_name"
						value="#{configBundle.user_name}" />
					<aon:inputText id="User_name"
						required="true" size="80"
						maxlength="64" value="#{user.to.name}" />

					<aon:outputLabel for="User_login"
						value="#{configBundle.user_login}" />
					<aon:inputText id="User_login" disabled="true"
						required="true" size="20"
						maxlength="16" value="#{user.to.login}" />

					<!--aon:outputLabel for="userData"
						value="#{securityBundle.aon_security_profiles}"
						styleClass="aon-form-input-text-label" />
					<aon:selectManyCheckbox id="userData"
						value="#{user.userManager.relations}" layout="pageDirection"
						layoutWidth="5" styleClass="selectManyCheckbox">
						<f:selectItems value="#{user.userManager.profiles}" />
					</aon:selectManyCheckbox -->

				</aon:panelGrid>
					
				<ui:include src="/facelet/user/userWorkGroup/grid.xhtml" />
							
				<ui:include src="/facelet/user/userScope/grid.xhtml" />

			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
