<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:form id="mainForm">

		<aon:div styleClass="aon-scroll-area">		

				<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column1,aon-portlets-column2,aon-portlets-column3">

					<aon:div>
						<aon:div styleClass="aon-portlet" rendered="#{desktop.mailActive}">
							<aon:div styleClass="aon-portlet-title">
							
								<aon:outputLink value="/aon-desktop/aon-webmail.auth" target="_blank">
									<aon:outputText value="#{appBundle.aon_desktop_mails}" styleClass="aon-portlet-title-text aon-icon aon-icon-webmail"/>
								</aon:outputLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="mailSummaryList"
									cellpadding="0" cellspacing="0"
									value="#{desktop.mailSummaryModel}" var="to"
									style="width:165px;" columnClasses="aon-text-left,aon-text-right"
									styleClass="aon-table-portlet">

									<aon:column>
										<aon:outputText value="#{to.name}"/>
									</aon:column>

									<aon:column>
										<aon:outputText value="#{to.folder.unreadMessageCount}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet" rendered="#{!desktop.mailActive}">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputText value="#{appBundle.aon_desktop_mails}" styleClass="aon-portlet-title-text aon-icon aon-icon-webmail"/>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:outputText value="#{appBundle.aon_desktop_mail_error}"/>
							</aon:div>
						</aon:div>
						
						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">								
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink actionListener="#{notice.onReset}" action="notice_form">
 										<aon:outputText value="&#160;" styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink actionListener="#{notice.onSearch}" action="notice">
									<aon:outputText value="#{appBundle.aon_desktop_notices}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</aon:commandLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="noticeSummaryList" columns="3" align="center"
									value="#{desktop.noticeSummaryModel}" var="to"
									style="width:165px;" columnClasses="aon-text-left,aon-text-left,aon-text-right"
									styleClass="aon-table-portlet" cellpadding="0" cellspacing="0">

									<aon:column>
										<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
										<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
										<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
										<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>
									</aon:column>
									<aon:column>
										<aon:outputText value="#{to.noticeType}"/>
									</aon:column>
									<aon:column>
										<aon:outputText value="#{to.count}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink actionListener="#{note.onReset}" action="note_form">
 										<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink actionListener="#{note.onSearch}" action="note">
									<aon:outputText value="#{appBundle.aon_desktop_notes}" styleClass="aon-portlet-title-text aon-icon aon-icon-notes"/>
								</aon:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
								<aon:dataTable id="recentNoteList" style="width:85%"  align="center"
									value="#{desktop.recentNoteModel}" var="to" rows="5"
									 styleClass="aon-table-portlet">

									<aon:rowSelector action="note_form" actionListener="#{desktop.onSelectNote}"/>
									
									<aon:column>
										<aon:outputText value="#{to.subject}"/>
									</aon:column>			

								</aon:dataTable>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div>
						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<aon:commandLink actionListener="#{notice.onSearch}" action="notice">
									<aon:outputText value="#{appBundle.aon_desktop_notices_list}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</aon:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:panelCollapsible expanded="true" label="#{appBundle.aon_desktop_today}">
								<aon:div>
									<aon:dataTable id="todayAlarmList" columns="3" border="0" 
										value="#{desktop.todayAlarmModel}" var="to" 
										styleClass="aon-table-portlet" columnClasses="aon-width-30,aon-width-60 aon-text-nowrap, aon-width-auto"
										scrollable="yes" style="width:100%">

										<aon:rowSelector action="alarm_form" actionListener="#{desktop.onSelectTodayAlarm}"/>								
										<aon:column>
											<aon:div styleClass="aon-text-nowrap">
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-high-prty.png" rendered="#{to.highPrty}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-medium-prty.png" rendered="#{to.mediumPrty}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-low-prty.png" rendered="#{to.lowPrty}"/>
											</aon:div>	
										</aon:column>
										
										<aon:column>
											<aon:outputText value="#{to.alarmDate}" styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_time_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column>
											<aon:outputText value="#{to.descriptionHead}"/>
										</aon:column>

									</aon:dataTable>
									</aon:div>
								</aon:panelCollapsible>
					
								<aon:panelCollapsible expanded="true" label="#{appBundle.aon_desktop_recent}">
									<aon:div>
									<aon:dataTable id="recentAlarmList" columns="3" border="0"
										value="#{desktop.recentAlarmModel}" var="to" 
										styleClass="aon-table-portlet" columnClasses="aon-width-30,aon-width-80 aon-text-nowrap, aon-width-auto"
										 scrollable="yes" style="width:100%">
										
										<aon:rowSelector action="alarm_form" actionListener="#{desktop.onSelectRecentAlarm}"/>
										<aon:column>
											<aon:div styleClass="aon-text-nowrap">
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-high-prty.png" rendered="#{to.highPrty}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-medium-prty.png" rendered="#{to.mediumPrty}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-low-prty.png" rendered="#{to.lowPrty}"/>
											</aon:div>
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.alarmDate}" styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.descriptionHead}"/>
										</aon:column>

									</aon:dataTable>
									</aon:div>
								</aon:panelCollapsible>
	
								<aon:panelCollapsible expanded="true" label="#{appBundle.aon_desktop_ancient}">
									<aon:div>
									<aon:dataTable id="ancientAlarmList" columns="3" border="0"
										value="#{desktop.ancientAlarmModel}" var="to" 
										styleClass="aon-table-portlet" columnClasses="aon-width-30,aon-width-80 aon-text-nowrap, aon-width-auto"
										 scrollable="yes" style="width:100%">

										<aon:rowSelector action="alarm_form" actionListener="#{desktop.onSelectAncientAlarm}"/>
										<aon:column>
											<aon:div styleClass="aon-text-nowrap">
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>
										
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-high-prty.png" rendered="#{to.highPrty}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-medium-prty.png" rendered="#{to.mediumPrty}"/>
												<h:graphicImage url="/aonResource/images/aon-icon/aon-icon-low-prty.png" rendered="#{to.lowPrty}"/>
											</aon:div>
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.alarmDate}" styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column>
											<aon:outputText value="#{to.descriptionHead}"/>
										</aon:column>

									</aon:dataTable>
									</aon:div>
								</aon:panelCollapsible>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div>
						<aon:div styleClass="aon-company-logo">
							<aon:graphicImage id="Logo_preview" 
								rendered="#{desktop.logoAttached}"
								url="desktop.logo"/>	
						</aon:div>
						
						<aon:outputLink target="_blank" value="http://www.esferalia.com/es/contact.html">
							<h:graphicImage url="/images/aon-soporte.png"/>
						</aon:outputLink>
					</aon:div>

				</aon:panelGrid>

		</aon:div>

	</aon:form>

</ui:composition>

</body>
</html>
