<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="categoryList">

			<aon:div ajaxRendered="true" layout="none">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{registryBundle.category_module}" />
					<ui:param name="controller" value="#{category}" />
					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="#{toolbarID}-back"
							value="#{bundle.aon_back}"
							rendered="#{!formNew}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="{controller.onCancel}"
							action="corporateIdentityAttach_list"
							accesskey="#{bundle.aon_key_cancel}" />					
					</ui:define>
				</ui:decorate>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:include src="/com/code/aon/ui/registry/facelet/category/grid.xhtml" />

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
