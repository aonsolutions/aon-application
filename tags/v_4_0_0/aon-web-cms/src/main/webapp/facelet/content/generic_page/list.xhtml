<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.generic_page}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="generic_page_form"
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{generic_page.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="generic_page_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{generic_page.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateGenericPages}" />
							<a4j:support 
								event="onclick" 
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid" 
								onclick="javascript:Richfaces.showModalPanel('gen_log',{width:680, top:100});" />
						</aon:commandButton>	
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					<aon:dataTable id="dataTable" value="#{generic_page.model}" var="to"
						styleClass="dr-table rich-table aon-editDataTable"
						rows="#{generic_page.pageLimit}" 
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn">
								
							<aon:column>
								<a4j:support 
									action="generic_page_form"
									actionListener="#{generic_page.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}"
									styleClass="aon-editDataTable-button" />
							</aon:column>

							<aon:column>
								<a4j:support 
									action="generic_page_form"
									actionListener="#{generic_page.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_title}" />
								</f:facet>
								<aon:outputText value="#{generic_page.i18nTitle}"
									styleClass="aon-editDataTable-button" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.generic_page_activate}" 
									action="generic_page_list"
									actionListener="#{generic_page.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="GenericPage_active" alt="#{appBundle.generic_page_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.generic_page_deactivate}" 
									action="generic_page_list"
									actionListener="#{generic_page.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="GenericPage_deactive" alt="#{appBundle.generic_page_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_create_date}" />
								</f:facet>
								<aon:outputText value="#{to.create_date}">
									 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.section}" />
								</f:facet>
								<aon:outputText value="#{to.section.alias}" />
							</aon:column>
							
						</aon:dataTable>
						
						<aon:dataScroller for="dataTable"
							rowCount="#{generic_page.model.rowCount}" 
							page="#{generic_page.page}"
							showNote="true" />					
					
				</aon:div>
		</aon:form>

		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml">
			<ui:param name="modalPanelName" value="gen_log" />
		</ui:include>
		
	</ui:define>

</ui:composition>

</body>
</html>
