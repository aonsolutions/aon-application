<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="bulletinList">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.bulletin}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="sender"
							value="#{appBundle.aon_generate}" 
							rendered="#{bulletin.to!=null and ( cms.roleEditor or cms.rolePublisher )}" 
							actionListener="#{bulletin.onGenerate}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick"
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid,grid_errors" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					<aon:dataTable id="dataTable" value="#{bulletin.model}" var="to"
						rows="#{bulletin.pageLimit}" 
						styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							    dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
								
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.bulletin_alias}"/>
								</f:facet>
								<aon:outputText value="->" styleClass="aon-editDataTable-button"
									rendered="#{to==bulletin.to}" />
								<aon:outputText value="#{to.alias}"
									styleClass="aon-editDataTable-button">
									<a4j:support 
										actionListener="#{bulletin.onSelect}"
										event="onclick" 
										reRender="dataTable,buttonsGrid" />
								</aon:outputText>									
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.bulletin_publishDate}"/>
								</f:facet>
								<aon:outputText value="#{to.publish_date}"
									styleClass="aon-editDataTable-button">
									<a4j:support 
										actionListener="#{bulletin.onSelect}"
										event="onclick" 
										reRender="dataTable,buttonsGrid" />
								</aon:outputText>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<f:verbatim rendered="#{to!=bulletin.to}">&#160;</f:verbatim>
								<aon:div rendered="#{to==bulletin.to}">
									<aon:commandButton id="lineAccept"
										title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										reRender="dataTable,gridToolbar"
										rendered="#{cms.roleEditor or cms.rolePublisher}" 
										actionListener="#{bulletin.onGenerate}">
										<a4j:support 
											event="onclick"
											actionListener="#{generator_status.onActivePoll}"  
											reRender="poll,grid,grid_errors" />
									</aon:commandButton>
								</aon:div>
							</aon:column>

						</aon:dataTable>
						
						<aon:dataScroller for="dataTable"
							rowCount="#{bulletin.model.rowCount}" 
							page="#{bulletin.page}"
							showNote="true" />					
					
				</aon:div>
		</aon:form>
	    <a4j:region>
	        <h:form>
	            <a4j:poll id="poll" interval="2000" enabled="#{generator_status.activePoll}" reRender="poll,grid,grid_errors"/>
	        </h:form>
	    </a4j:region>
		<h:form>
			<rich:panel bodyClass="inpanelBody" id="grid_errors">
	        	<f:facet name="header">
	                    Error Console Log
	            </f:facet>
		        <rich:dataList id="dataList_Error" var="msg" value="#{generator_status.errors}" rows="5">
					<h:outputText style="color:red;" value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList_Error" maxPages="20" />
			</rich:panel>
		</h:form>
		<h:form>
			<br/>
			<rich:separator height="2" lineType="dashed"/><br/>
			<rich:panel bodyClass="inpanelBody" id="grid">
	        	<f:facet name="header">
	                    Console Log
	            </f:facet>
		        <rich:dataList id="dataList" var="msg" value="#{generator_status.status}" rows="15">
					<h:outputText value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList" maxPages="20" />
			</rich:panel>
	    </h:form>    		
	</ui:define>

</ui:composition>

</body>
</html>
