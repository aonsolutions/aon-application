<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="productForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.product}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{product.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!product.new and cms.roleEditor}"
							action="product_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{product.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{product.to!=null or product.new}"
							action="product_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{product.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!product.new and cms.roleEditor}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{product.onRemove}" 
							confirmAction="product_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="product_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{product.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="product_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{product.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{product.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="product_categories"
							value="#{appBundle.product_category}"
							action="product_category_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item">
							<aon:actionListener method="#{productCategory.onSearch}" />
						</aon:commandButton>
						<aon:commandButton id="brands"
							value="#{appBundle.brand}"
							action="brand_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item">
							<aon:actionListener method="#{brand.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>		
					
			<aon:div styleClass="aon-scroll-area" style="width:99%;">
	
					<aon:panelGrid columns="2" dir="true" style="width:750px;">
							
							<aon:outputLabel for="product_alias"
								value="#{appBundle.product_alias}" />
							<aon:inputText id="product_alias"
								required="true" size="32" maxlength="32"
								value="#{product.to.alias}">
								<f:validator validatorId="AliasValidator" />
							</aon:inputText>

							<aon:outputLabel for="productDetail_shortLabel"
								value="#{appBundle.product_shorLabel}" />
							<aon:inputText id="productDetail_shortLabel"
								size="80" maxlength="64"
								value="#{product.toI18n.shortLabel}" />
								
							<aon:outputLabel for="productDetail_label"
								value="#{appBundle.product_label}" />
							<aon:inputRichText id="productDetail_label" 
								toolbarSet="Default" 
								value="#{product.toI18n.label}" />
								
							<aon:outputLabel for="product_brand"
								value="#{appBundle.product_brand}" />
							<aon:selectOneMenu id="product_brand"  
								value="#{product.to.brand.id}">
								<f:selectItems value="#{collections.brands}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="product_category"
								value="#{appBundle.product_category}" />
							<aon:selectOneMenu id="product_category"  
								value="#{product.to.productCategory.id}">
								<f:selectItems value="#{collections.categories}" />
							</aon:selectOneMenu> 
							
							<aon:outputLabel for="productDetail_price"
								value="#{appBundle.product_price}" />
							<aon:inputText id="productDetail_price"
								size="20" maxlength="15"
								value="#{product.to.price}" />

							<aon:outputLabel for="productDetail_price2"
								value="#{appBundle.product_offer_price}" />
							<aon:inputText id="productDetail_price2"
								size="20" maxlength="15"
								value="#{product.to.offerPrice}" />

							<aon:outputLabel 
								value="#{appBundle.albumImage_image}" />
							<aon:panelGroup id="thumbnail_preview">
								<aon:graphicImage styleClass="aon-padding aon-border"
									url="#{product.to.image}.thumbnail" 
									alt="#{product.to.image}"/>
								<ui:include src="/facelet/content/utils/image_modal.xhtml">
									<ui:param name="modalPanelName" value="mp" />
									<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
									<ui:param name="galleryBean" value="#{gallery}" />
									<ui:param name="listenerBean" value="#{product}" />
									<ui:param name="reRender" value="thumbnail_preview" />
									<ui:param name="image" value="#{true}" />
									<ui:param name="thumbnail" value="#{false}" />
								</ui:include>
				                <aon:commandLink style="padding:2px"
				                	immediate="#{true}"
				                	reRender="thumbnail_preview"
				                    actionListener="#{product.onDelImage}">
									<aon:graphicImage url="/images/cms/inactive.png"  alt="#{bundle.aon_remove}" />
				        		</aon:commandLink>
							</aon:panelGroup>

							<aon:outputLabel for="ProductDetail_alt"
								value="#{appBundle.product_alt}" />
							<aon:inputText id="ProductDetail_alt"
								size="64" maxlength="64"
								value="#{product.toI18n.alt}" />
															
							<aon:outputLabel for="Product_active"
								value="#{appBundle.product_active}"/>
							<aon:selectBooleanCheckbox id="Product_active" 
								value="#{product.to.active}" />
						
					</aon:panelGrid>

			</aon:div>
			
		</aon:form>

	</ui:define>
</ui:composition>
