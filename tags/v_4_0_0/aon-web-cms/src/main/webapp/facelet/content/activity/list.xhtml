<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="activity_form">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.activity}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!activity.new and cms.roleEditor}"
							reRender="dataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{activity.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{activity.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{activity.onAccept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{activity.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							accesskey="#{bundle.aon_key_cancel}">
							<aon:actionListener method="#{activity.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{activity.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="dataTable"
					value="#{activity.model}" var="to" rows="20"
					styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="&nbsp;" />
							</aon:div>	
						</f:facet>
						<aon:outputText value="&#160;" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="dataTable,gridToolbar"
									rendered="#{!activity.new and cms.roleEditor}"
									actionListener="#{activity.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.activity_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}"
							rendered="#{to!=activity.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{activity.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:inputText value="#{to.alias}"
							id="#{to.id}_alias"
							rendered="#{to==activity.to}"
							required="#{true}" size="35" maxlength="32">
							<f:validator validatorId="AliasValidator" />
						</aon:inputText>
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{activity.to.alias}"
									id="new_alias"
									rendered="#{activity.new}"
									required="#{true}" size="35" maxlength="32">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.activity_description}" />
						</f:facet>
						<aon:outputText value="#{activity.i18nDescription}"
							rendered="#{to!=activity.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{activity.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:inputText value="#{activity.toI18n.description}"
							id="#{to.id}_description"
							rendered="#{to==activity.to}"
							required="#{true}" size="70" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{activity.toI18n.description}"
									id="new_description"
									rendered="#{activity.new}"
									required="#{true}" size="70" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=activity.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==activity.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable,gridToolbar">
								<aon:actionListener method="#{activity.onAccept}" />
							</aon:commandButton>
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable,gridToolbar" immediate="true">
								<aon:actionListener method="#{activity.onCancel}" />
							</aon:commandButton>
							<aon:commandButton id="lineRemove"
								title="[#{bundle.aon_remove}]"
								rendered="#{cms.roleEditor}"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable,gridToolbar" immediate="true"
								actionListener="#{activity.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{activity.new}">
								<f:verbatim rendered="#{!activity.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable,gridToolbar">
									<aon:actionListener method="#{activity.onAccept}" />
								</aon:commandButton>
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable,gridToolbar" immediate="true">
									<aon:actionListener method="#{activity.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller for="dataTable"
					rowCount="#{activity.model.rowCount}" 
					page="#{activity.page}"
					showNote="true" />					
			
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
