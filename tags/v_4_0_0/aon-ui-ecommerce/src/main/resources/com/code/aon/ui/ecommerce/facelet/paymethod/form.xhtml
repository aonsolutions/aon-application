<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="paymethodForm">
			<aon:div styleClass="menu">
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:div>
					<aon:commandButton id="aonToolbar-back" value="#{bundle.aon_back}"
						action="shop_form"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" accesskey="#{bundle.aon_key_cancel}" />
				</aon:div>

				<aon:div>
					<!--  
					<aon:outputLabel value="Estimado " />
					<aon:outputText id="Offer_target_full_name"
						value="#{(cartOffer.offer.target.registry.name!=null)?(cartOffer.offer.target.registry.fullName):('')}"
						size="50" />
					<aon:outputText id="name" value="#{shoppingCart.total}">
					-->
					<aon:outputLabel value="Su importe asciende a " />
					<aon:outputText id="cart_total" value="#{shoppingCart.total}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:div>

				<aon:panelGrid columns="2" style="width:100%"
					columnClasses="aon-width-300, none">
					<aon:panel id="offer-detail-list" styleClass="aon-padding-right">

						<aon:outputLabel for="Offer_paymethod"
							value="#{ecommerceBundle.aon_ecommerce_paymethod}" />
						<aon:selectOneRadio id="Offer_paymethod"
							value="#{cartOffer.offer.payMethod}" layout="pageDirection"
							required="true">
							<f:selectItems value="#{ecConfig.payMethodList}" />
						</aon:selectOneRadio>

						<aon:commandButton id="paymethod-accept-buttom"
							value="#{bundle.aon_accept}" action="cartOffer_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<aon:actionListener method="#{cartOffer.onAccept}" />
						</aon:commandButton>
					</aon:panel>

					<aon:panel>
						<aon:outputLabel value=" " />
					</aon:panel>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
