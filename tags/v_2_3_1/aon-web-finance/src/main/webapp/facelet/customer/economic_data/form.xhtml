<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="dossierForm">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux" forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{customer.to.registry.name} #{customer.to.registry.surname}, #{customerBundle.customer_document}: #{customer.to.registry.document}" />
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal" style="padding-top:0">

					<t:div styleClass="aon-content-menu" rendered="#{!customer.new}"
						id="aon-content-menu" forceId="#{true}">
						<t:panelGrid columns="2" cellpadding="0" cellspacing="0"
							border="0">
							<t:panelGroup>
								<t:commandLink id="customer_data" forceId="#{true}"
									value="#{customerBundle.aon_customer_data}" action="customer_form"
									styleClass="aon-content-menu-item"/>
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="economic_data"
									value="#{customerBundle.aon_economic_data}" forceId="#{true}"
									styleClass="aon-content-menu-item-active"/>
							</t:panelGroup>
						</t:panelGrid>
					</t:div>
					
					<t:panelTabbedPane styleClass="aon-tabpanel" id="economicTab"
						activeTabStyleClass="aon-tabpanel-active"
						inactiveTabStyleClass="aon-tabpanel-inactive"
						serverSideTabSwitch="true">

						<t:panelTab id="customer_fee" label="#{customerBundle.aon_customer_fees}">
							<t:div rendered="#{!customerFee.new and customerFee.to == null}" >
								<ui:include src="/facelet/customer/customer_fee/list.xhtml" />
							</t:div>
							<t:div rendered="#{customerFee.new or customerFee.to != null}" >
								<ui:include src="/facelet/customer/customer_fee/form.xhtml" />
							</t:div>
						</t:panelTab>

						<t:panelTab id="finance_data"
							label="#{financeBundle.aon_finance_data}">
							<ui:include src="/facelet/shared/tabs/banks.xhtml">
								<ui:param name="controllerAlias" value="#{customerRbank}" />
								<ui:param name="dataTable" value="bankDataList" />
							</ui:include>
							<ui:include src="/facelet/shared/tabs/payMethods.xhtml">
								<ui:param name="controllerAlias" value="#{customerRpayMethod}" />
								<ui:param name="dataTable" value="payMethodDataList" />
							</ui:include>
						</t:panelTab>
					</t:panelTabbedPane>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
