<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.product_category}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="product_category_form"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{productCategory.onReset}" />
					</aon:commandButton>
					<aon:confirmButton id="remove"
						value="#{bundle.aon_remove}" rendered="#{!productCategory.checklistEmpty}" 
						inmediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{productCategory.onRemoveSelected}"
						confirmAction="product_category_list"
						accesskey="#{bundle.aon_key_remove}"/>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">

					<aon:outputLabel for="ProductCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="ProductCategory_section"  
						value="#{generator_config.sectionId}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:commandButton id="save"
						value="#{bundle.aon_save}"
						reRender="list" 
						styleClass="aon-content-toolbar-item aon-icon-accept">
						<aon:actionListener method="#{generator_config.onSaveProductCategoryConfig}" />
					</aon:commandButton>

					
					<aon:dataTable id="dataTable" value="#{productCategory.model}" var="to"
						rows="#{productCategory.pageLimit}" 
						styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn">
				
						<aon:column>
							<f:facet name="header">
								<aon:div>
									<aon:outputText value="#{bundle.aon_check}" />
								</aon:div>	
							</f:facet>
							<aon:selectBooleanCheckbox id="Row_checked"
									value="#{productCategory.rowChecked}">
									<a4j:support 
										event="onclick"  
										reRender="dataTable,buttonsGrid" />
							</aon:selectBooleanCheckbox>
						</aon:column>
						
						<aon:column>
							<a4j:support 
								action="product_category_form"
								actionListener="#{productCategory.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.product_category_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<a4j:support 
								action="product_category_form"
								actionListener="#{productCategory.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.product_category_label}" />
							</f:facet>
							<aon:outputText value="#{productCategory.i18nLabel}"
								styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.product_category_active}" />
							</f:facet>
							<aon:commandLink title="#{appBundle.product_category_activate}" 
								reRender="dataTable"
								actionListener="#{productCategory.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="ProductCategory_active" alt="#{appBundle.product_category_activate}"
									url="/images/cms/inactive.png" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.product_category_deactivate}" 
								reRender="dataTable"
								actionListener="#{product_category.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="ProductCategory_deactive" 
									alt="#{appBundle.product_category_deactivate}"
									url="/images/cms/active.png" />
							</aon:commandLink>
						</aon:column>

					</aon:dataTable>
				
					<aon:dataScroller for="dataTable"
						rowCount="#{productCategory.model.rowCount}" 
						showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
