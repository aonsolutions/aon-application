<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:div id="aon-header">	
		<aon:panelGrid cellpadding="0" cellspacing="0" border="0" columns="3" style="width:100%"
		columnClasses="aon-header-name,aon-header-slogan,aon-header-info">
			<aon:div>
				<aon:outputConnectionStatus	styleClass="aon-outputConnectionStatus"		
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyleClass="aon-outputConnectionStatus-stop"/>
				<aon:outputText value="#{appBundle.aon_application_title}" 
					styleClass="aon-applicationName" style="margin-left:0.5em;"/>
			</aon:div>
	
			<aon:div>
				<aon:div rendered="#{aonConfiguration.properties.middleHeader == null}">
					<aon:outputText value="&#160;"/>
				</aon:div>
				<aon:div rendered="#{aonConfiguration.properties.middleHeader != null}">
					<aon:outputText escape="false" value="#{aonConfiguration.properties.middleHeader}" />
				</aon:div>
			</aon:div>
			<aon:div>
				<aon:outputText value="#{appBundle.aon_application_title}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{config.currentConfig.domain}" />
			</aon:div>		
		</aon:panelGrid>
		<aon:div styleClass="aon-header-additionalInfo">
			<aon:div styleClass="aon-float-right">
				<aon:div styleClass="aon-header-menu-item">
					<h:outputLink styleClass="aon-header-menu-item-link"
						target="_top" 
						value="${facesContext.externalContext.requestContextPath}">
						<h:outputText value="#{bundle.aon_home}" />
					</h:outputLink>
					<aon:commandLink styleClass="aon-header-menu-item-link" style="border-right:0;margin-left:0.5em;"
							onclick="parent.window.close();"
							target="_top" >
							<aon:outputText value="#{securityBundle.aon_login_user_logout}" />
					</aon:commandLink>
					<aon:div >
						<aon:form id="languaje_form">
							<a4j:outputPanel ajaxRendered="true">
								<aon:panelGrid id="aon_languake_panelGrid">
									<a4j:repeat id="languageSelection" 
										value="#{i18n.languageList}" 
										var="column">
										<aon:commandButton id="changeLanguage"
											reRender="aon-content-refresh" 
											actionListener="#{i18n.onChangeLanguage}" 
											rendered="#{i18n.currentLanguage.id != column.id}"
											image="/images/flags/#{column.language.locale.language}_off.gif"
											/>
										<aon:graphicImage id="changeLanguage_on" 
											rendered="#{i18n.currentLanguage.id == column.id}"
											url="/images/flags/#{column.language.locale.language}_on.gif">
										</aon:graphicImage> 
									</a4j:repeat>
								</aon:panelGrid>
							</a4j:outputPanel>
						</aon:form>
					</aon:div>
				</aon:div>	
			</aon:div>
		</aon:div>
	</aon:div>
</ui:composition>
</body>
</html>
