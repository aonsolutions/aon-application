<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="identityForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_corporate_identity}" />
				<ui:param name="toolbarDescription" value="#{corporateIdentity.identityReport.company.fullName}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="cancel" value="#{bundle.aon_back}"
						action="home"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column1,aon-portlets-column1,aon-portlets-column1">
	
					<aon:div styleClass="aon-portlet aon-width-150">
						<aon:div styleClass="aon-portlet-title">
							<aon:outputText value="#{appBundle.aon_corporate_identity_fax}" styleClass="aon-portlet-title-text"/>
						</aon:div>
						<aon:div styleClass="aon-portlet-body">
							<aon:commandLink action="corporate_identity_fax"
								actionListener="#{corporateIdentity.onInit}">
								<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-fax.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
		
					<aon:div styleClass="aon-portlet aon-width-150">
						<aon:div styleClass="aon-portlet-title">
							<aon:outputText value="#{appBundle.aon_corporate_identity_letter}" styleClass="aon-portlet-title-text"/>
						</aon:div>
						<aon:div styleClass="aon-portlet-body">
							<aon:commandLink action="corporate_identity_letter"
								actionListener="#{corporateIdentity.onInit}">
								<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-carta.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
					
					<aon:div styleClass="aon-portlet aon-width-150">
						<aon:div styleClass="aon-portlet-title">
							<aon:outputText value="#{appBundle.aon_corporate_identity_label}" styleClass="aon-portlet-title-text"/>
						</aon:div>
						<aon:div styleClass="aon-portlet-body">
							<aon:commandLink action="corporate_identity_label"
								actionListener="#{corporateIdentity.onInit}">
								<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-etiquetas.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
		
					<aon:div styleClass="aon-portlet aon-width-150">
						<aon:div styleClass="aon-portlet-title">
							<aon:outputText value="#{appBundle.aon_corporate_identity_recibi}" styleClass="aon-portlet-title-text"/>
						</aon:div>
						<aon:div styleClass="aon-portlet-body">
							<aon:commandLink action="corporate_identity_recibi"
								actionListener="#{corporateIdentity.onInit}">
								<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-recibi.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
		
				</aon:panelGrid>
			
				<aon:div styleClass="aon-form-group">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel value="#{appBundle.aon_corporate_identity_other_documents}" />
						</aon:div>
					</aon:div>
					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{corporateIdentityAttach}" />
						<ui:param name="rows" value="10" />
						<ui:param name="skipLineEdition" value="#{!desktop.roleManager}" />
						<ui:param name="skipResetButton" value="#{!desktop.roleManager}" />
						<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-width-150 aon-editDataTable-textColumn" />
						<ui:define name="columns">
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="RegistryAttach_description" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}" rendered="#{formList}" />
								<aon:inputText id="RegistryAttach_description" required="true"
									value="#{corporateIdentityAttach.to.description}"
									rendered="#{formEdit}" size="40" />
								<f:facet name="footer">
									<aon:inputText id="RegistryAttach_description-New" required="true"
										value="#{corporateIdentityAttach.to.description}"
										rendered="#{formNew}" size="40" />
								</f:facet>
							</aon:column>
 
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_fileupload_element}" />
								</f:facet>
								<aon:div id="attachFile">
									<aon:commandLink rendered="#{formList and (to.data != null)}"
										onmouseover="disableRowSelector();" oncomplete="enableRowSelector();" onmouseout="enableRowSelector();"
										onclick="window.open('#{to.id}.cidocument','','width=20px,height=50px,resizable=false');">
										<aon:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon/aon-icon-file-download.png']}"
											style="border:0px;margin:2px;" alt="Download"/>
									</aon:commandLink>
									<a4j:region>
										<aon:fileUpload rendered="#{formEdit}"
											addControlLabel="#{bundle.aon_fileUpload_add}"
											stopControlLabel="#{bundle.aon_fileUpload_stop}"
											stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
											uploadControlLabel="#{bundle.aon_fileUpload_upload}"
											fileUploadListener="#{corporateIdentityAttach.fileUploaded}"
											listHeight="0px" immediateUpload="true" autoclear="true">
											<f:facet name="label">
												<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
											</f:facet>														
											<a4j:support event="onuploadcomplete"
												reRender="attachFile,RegistryAttach_description" />
										</aon:fileUpload>
									</a4j:region>	
								</aon:div>
								<f:facet name="footer">
									<aon:div id="attachFileNew">
										<a4j:region>
											<aon:fileUpload rendered="#{formNew}"
												addControlLabel="#{bundle.aon_fileUpload_add}"
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{corporateIdentityAttach.fileUploaded}"
												listHeight="0px" immediateUpload="true" autoclear="true">
												<f:facet name="label">
													<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
												</f:facet>																										
												<a4j:support event="onuploadcomplete"
													reRender="attachFileNew,RegistryAttach_description-New" />
											</aon:fileUpload>
										</a4j:region>
									</aon:div>
								</f:facet>														
							</aon:column>
							
						</ui:define>
					</ui:decorate>
				</aon:div>
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
