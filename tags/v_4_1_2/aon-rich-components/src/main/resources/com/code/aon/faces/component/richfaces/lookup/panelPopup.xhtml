<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:panelGroup id="#{lookupId}ReRender" styleClass="aon-popupWindow">
		<c:if test="#{lookup.showWindow}">
			<rich:modalPanel id="#{lookupId}" rendered="#{lookup.showWindow}" onshow="#{onLookupShow}"
				showWhenRendered="true" minWidth="#{lookup.minWidth}" minHeight="#{lookup.minHeight}">
	
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{lookup.windowTitle}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton id="#{lookupId}-close" type="button"
							reRender="#{lookupId}ReRender" styleClass="aon-popupWindow-close"
							actionListener="#{lookup.onCloseWindow}" immediate="true">
							<aon:actionHotKey key="esc" />
							<rich:componentControl for="#{lookupId}" event="onclick"
								disableDefault="true" operation="hide" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
	
				<aon:div id="#{lookupId}LookupContent" styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:form id="#{lookup.beanName}Form">
								
									<c:if
										test="#{(lookup.listPagePath != null) and (lookup.selectedPanel == 'list')}">
										<a4j:include viewId="listContent.xhtml" />
									</c:if>
	
									<c:if
										test="#{(lookup.searchPagePath != null) and (lookup.selectedPanel == 'search')}">
										<a4j:include viewId="searchContent.xhtml" />
									</c:if>
	
									<c:if
										test="#{(lookup.newPagePath != null) and (lookup.selectedPanel == 'new')}">
										<a4j:include viewId="formContent.xhtml" />
									</c:if>
								</aon:form>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
			</rich:modalPanel> 
			<a4j:loadScript src="/aonResource/com/code/aon/faces/component/richfaces/lookup/extendedInput.js" />			
		</c:if>
	</aon:panelGroup>

</ui:composition>

</body>
</html>
