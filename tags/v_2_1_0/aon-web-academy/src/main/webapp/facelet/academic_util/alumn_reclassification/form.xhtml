<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="alumnReclassificationForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="accept" value="#{bundle.aon_accept}"
							forceId="#{true}" actionListener="#{alumnReclassification.onAssign}"
							action="customer_list" onclick="if(confirm('#{bundle.aon_accept_confirm}')){viewDialog.show();}else{ return false; }"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							rendered="#{alumnReclassification.model.rowCount >0}"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"/>
						<h:commandButton id="search" value="#{bundle.aon_search}"
							immediate="#{true}" action="alumn_reclassification_search"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{alumnReclassification.onEditSearch}"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="Customer_segment_id"
							styleClass="aon-form-input-text-label"
							value="#{bundle.aon_reset} #{appBundle.aon_alumn_segment}" />
						<h:selectOneMenu id="Customer_segment_id"
							value="#{alumnReclassification.customerSegmentId}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{customerCollections.customerSegments}" />
						</h:selectOneMenu>	

						<h:outputLabel for="Customer_status"
							styleClass="aon-form-input-text-label"
							value="#{bundle.aon_reset} #{registryBundle.aon_status}" />
						<h:selectOneMenu id="Customer_status"
							value="#{alumnReclassification.customerStatus}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{customerCollections.customerStatuses}" />
						</h:selectOneMenu>	

					</h:panelGrid>

					<t:div styleClass="aon-form-group">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="alumnReclassificationDataList"
								value="#{appBundle.aon_alumns}" />
						</t:div>
						<t:div styleClass="aon-form-group-body" rendered="#{alumnReclassification.model.rowCount >0}">
							<t:div>
								<t:commandButton title="#{financeBundle.aon_select_all}"
									styleClass="aon-form-button-plus" onclick="viewDialog.show();"
									value="#{financeBundle.aon_select_all}"
									actionListener="#{alumnReclassification.checkAll}" />
								<t:commandButton title="#{financeBundle.aon_select_none}"
									styleClass="aon-form-button-minus" onclick="viewDialog.show();"
									value="#{financeBundle.aon_select_none}"
									actionListener="#{alumnReclassification.checkNone}" />
							</t:div>

							<t:dataTable id="alumnReclassificationDataList" cellpadding="0" cellspacing="0"
								var="to" value="#{alumnReclassification.model}" rows="20"
								rendered="#{alumnReclassification.model.rowCount > 0}" styleClass="aon-table"
								headerClass="aon-table-header"
								rowClasses="aon-table-row-odd,aon-table-row-even"
								columnClasses="aon-table-body aon-table-body-icon,
											   aon-table-body aon-table-body-number,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string">

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:selectBooleanCheckbox id="Included_Row_checked"
										value="#{alumnReclassification.rowChecked}"
										valueChangeListener="#{alumnReclassification.rowSelected}"
										styleClass="aon-form-selectBooleanCheckbox-field" />	
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{customerBundle.customer_code}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.id}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{customerBundle.customer_name}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.registry.name}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{customerBundle.customer_surname}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.registry.surname}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{customerBundle.customer_status}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.status}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.aon_alumn_segment}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.customerSegment.description}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>
							</t:dataTable>

						</t:div>

						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="alumnReclassificationDataList" />
							<ui:param name="model" value="#{alumnReclassification.model}" />
							<ui:param name="showNote" value="#{true}" />
						</ui:include>

					</t:div>

				</t:div>
			</t:div>

			<s:modalDialog dialogId="viewDialog" dialogVar="viewDialog"
				closeButton="false">
				<t:div styleClass="aon-timer">
					<h:graphicImage value="/css/images/content/aon-timer.gif" />
					<t:div styleClass="aon-timer-title">
						<t:outputText value="#{appBundle.aon_in_progress}" />
					</t:div>
				</t:div>
			</s:modalDialog>

		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
