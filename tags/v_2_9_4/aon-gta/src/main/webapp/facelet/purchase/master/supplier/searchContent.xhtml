<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
		forceId="#{true}">
		<t:div styleClass="aon-content-subtitle-internal">
		<h:outputText value="#{bundle.aon_search_header}" />
		</t:div>
	</t:div>
	
	<t:div forceId="#{true}" id="aon-scroll-area">
		<t:div styleClass="aon-scroll-area-internal">
			<h:panelGrid columns="2" styleClass="aon-form-table"
				columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

				<t:outputLabel for="Supplier_registry_document"
					value="#{supplierBundle.supplier_document}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<t:inputText id="Supplier_registry_document" size="20"
					valueChangeListener="#{supplierAlias.addExpression}"
					styleClass="aon-form-input-text" onblur="toUpperCase(this);"/>

				<t:outputLabel for="Supplier_registry_name"
					value="#{supplierBundle.supplier_name}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<t:inputText id="Supplier_registry_name" size="40"
					valueChangeListener="#{supplierAlias.addExpression}"
					styleClass="aon-form-input-text" />

				<t:outputLabel for="Supplier_registry_surname"
					value="#{supplierBundle.supplier_surname}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<t:inputText id="Supplier_registry_surname" size="40"
					valueChangeListener="#{supplierAlias.addExpression}"
					styleClass="aon-form-input-text" />

				<t:outputLabel for="Supplier_registry_alias"
					value="#{supplierBundle.supplier_alias}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<t:inputText id="Supplier_registry_alias" size="40"
					valueChangeListener="#{supplierAlias.addExpression}"
					styleClass="aon-form-input-text"  onblur="toUpperCase(this);"/>

				<t:outputLabel for="Supplier_supplierSegment_id"
					value="#{supplierBundle.aon_supplier_segment}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<h:selectOneMenu id="Supplier_supplierSegment_id"
					styleClass="aon-form-selectOneMenu-field"
					converter="IntegerEmptyConverter" forceId="#{true}"
					valueChangeListener="#{supplierAlias.addExpression}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{supplierCollections.supplierSegments}" />
				</h:selectOneMenu>

				<t:outputLabel for="Supplier_status"
					value="#{registryBundle.aon_status}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<h:selectOneMenu id="Supplier_status"
					styleClass="aon-form-selectOneMenu-field"
					converter="aonSupplierStatusConverter" forceId="#{true}"
					valueChangeListener="#{supplierAlias.addExpression}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{supplierCollections.supplierStatuses}" />
				</h:selectOneMenu>
			</h:panelGrid>
		</t:div>
	</t:div>

</ui:composition>

</body>
</html>
