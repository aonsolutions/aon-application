<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{groupwareBundle.aon_favorite}" />
				<ui:param name="controller" value="#{favorite}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Favorite_description"
						value="#{groupwareBundle.favorite_description}" />
					<aon:inputText id="Favorite_description"
						maxlength="128" size="100"
						value="#{favorite.to.description}" />

					<aon:outputLabel for="Favorite_url"
						value="#{groupwareBundle.favorite_url}" />
					<aon:inputText id="Favorite_url"
						maxlength="128" size="100"
						value="#{favorite.to.url}" />

					<aon:outputLabel for="Favorite_favoriteCategory_id"
						value="#{groupwareBundle.favorite_favorite_category}" />
					<aon:selectOneMenu id="Favorite_favoriteCategory_id"
						value="#{favorite.to.favoriteCategory.id}" required="#{true}">
						<f:selectItems value="#{groupWareCollections.favoriteCategories}" />
					</aon:selectOneMenu>
							
				</aon:panelGrid>
					
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
