<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="amortizationTypeForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_amortization_type_module}" />
				<ui:param name="controller" value="#{amortizationType}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="AmortizationType_id" value="#{bundle.aon_id}" />
					<aon:inputText id="AmortizationType_id"
						value="#{amortizationType.to.id}" size="5" disabled="true" />

					<aon:outputLabel for="AmortizationType_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="AmortizationType_description"
						value="#{amortizationType.to.description}" required="true"
						size="70">
						<f:validateLength maximum="64" />
					</aon:inputText>

					<aon:outputLabel for="fixedAccountId"
						value="#{accountingBundle.accounting_fixed_asset_account}" />
					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountLookup.xhtml">
						<ui:param name="id" value="fixedAccountId" />
						<ui:param name="required" value="#{true}" />
						<ui:param name="entity" value="#{amortizationType.to.fixedAssetAccount}" />
						<ui:param name="ELExpression" value="amortizationType.to.fixedAssetAccount" />
					</ui:include>

					<aon:outputLabel for="accumulatedAccountId"
						value="#{accountingBundle.accounting_accumulated_account}" />
					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountLookup.xhtml">
						<ui:param name="id" value="accumulatedAccountId" />
						<ui:param name="required" value="#{true}" />
						<ui:param name="entity" value="#{amortizationType.to.accumulatedAccount}" />
						<ui:param name="ELExpression" value="amortizationType.to.accumulatedAccount" />
					</ui:include>

					<aon:outputLabel for="allocationAccountId"
						value="#{accountingBundle.accounting_allocation_account}" />
					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountLookup.xhtml">
						<ui:param name="id" value="allocationAccountId" />
						<ui:param name="required" value="#{true}" />
						<ui:param name="entity" value="#{amortizationType.to.allocationAccount}" />
						<ui:param name="ELExpression" value="amortizationType.to.allocationAccount" />
					</ui:include>

					<aon:outputLabel for="AmortizationType_percentage"
						value="#{bundle.aon_percentage}" />
					<aon:div id="percentageBox">
						<aon:inputText id="AmortizationType_percentage"
							rendered="#{!amortizationType.yearsEnabled}"
							ajaxSingle="true"
							reRender="yearsBox"
							value="#{amortizationType.to.percentage}" size="5"/>
						<aon:outputText 
							rendered="#{amortizationType.yearsEnabled}" 
							value="#{amortizationType.to.percentage}" >
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText value="%" />
					</aon:div>

					<aon:outputText value="#{accountingBundle.accounting_years}" />
					<aon:div id="yearsBox">
						<aon:selectBooleanCheckbox 
							value="#{amortizationType.yearsEnabled}">
							<a4j:support
								event="onclick"
								ajaxSingle="true" 
								reRender="percentageBox,yearsBox"/>
						</aon:selectBooleanCheckbox>
						<aon:inputText id="AmortizationType_years"
							rendered="#{amortizationType.yearsEnabled}"
							ajaxSingle="true"
							reRender="percentageBox"
							value="#{amortizationType.to.years}" size="5"/>
						<aon:outputText 
							rendered="#{!amortizationType.yearsEnabled}" 
							value="#{amortizationType.to.years}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
