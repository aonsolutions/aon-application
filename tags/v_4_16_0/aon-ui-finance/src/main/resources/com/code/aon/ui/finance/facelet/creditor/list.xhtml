<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_creditor_module}" />
				<ui:param name="controller" value="#{creditor}" />
				<ui:define name="additionalToolbarContent">
					<h:commandLink id="creditorReportExcel" value="&#160;" 
						target="_new" rendered="#{!creditor.new}"
						action="#{report.onExecute}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="creditorReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="creditorReportPdf" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!creditor.new}"
						action="#{report.onExecute}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="creditorReport" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
					<h:commandLink id="creditorDetailReportExcel" value="&#160;" 
						target="_new" rendered="#{!creditor.new}"
						action="#{report.onExecute}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="creditorDetailReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="creditorDetailReportPdf" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!creditor.new}"
						action="#{report.onExecute}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="creditorDetailReport" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

		<aon:div styleClass="aon-scroll-area">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{creditor}" />
				<ui:param name="columnClasses" value="
					aon-editDataTable-numberColumn, aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
				<ui:define name="columns">
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<h:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.registry.fullName}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_alias}" />
						</f:facet>
						<aon:outputText value="#{to.registry.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>
				</ui:define>
			</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
