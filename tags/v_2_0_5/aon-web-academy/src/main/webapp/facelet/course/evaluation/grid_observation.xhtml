<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>
		
	<t:div styleClass="aon-form-group" rendered="#{!course.new}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="courseObservationDataTable" 
				value="#{appBundle.course_observations}" />
		</t:div>

		<t:div styleClass="aon-form-group-body">
			<t:dataTable id="courseObservationDataTable"
				value="#{courseObservation.model}" var="to"
				rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				styleClass="aon-edit-table" headerClass="aon-edit-table-header"
				footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-edit-table-body aon-edit-table-body-icon,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-buttons">

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<f:verbatim>&#160;</f:verbatim>
					<t:commandLink immediate="#{true}"
						rendered="#{to!=courseObservation.to}"
						styleClass="aon-table-row-selected"
						actionListener="#{courseObservation.onSelect}">
					</t:commandLink>
					<f:facet name="footer">
						<t:div>
							<t:commandButton id="reset"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
								value="" immediate="#{true}" rendered="#{!courseObservation.new}"
								actionListener="#{courseObservation.onReset}"
								accesskey="#{bundle.aon_key_new_line}">
							</t:commandButton>
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.course_observation_observation}" />
					</f:facet>
					<t:outputText value="#{to.observation}"
						rendered="#{to!=courseObservation.to}" />
					<t:inputText rendered="#{to==courseObservation.to}" 
						styleClass="aon-form-input-text" size="70" maxlength="60"
						value="#{courseObservation.to.observation}" required="#{true}" />
					<f:facet name="footer">
						<t:div>
							<t:inputText rendered="#{courseObservation.new}"
								styleClass="aon-form-input-text" size="85" maxlength="60"
								value="#{courseObservation.to.observation}" required="#{true}" />
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:div>
						<f:verbatim rendered="#{to!=courseObservation.to}">&#160;</f:verbatim>

						<t:commandButton title="#{bundle.aon_save}"
							actionListener="#{courseObservation.onAccept}"
							rendered="#{to==courseObservation.to}" value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
							accesskey="#{bundle.aon_key_save_line}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{courseObservation.onCancel}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
							value="" rendered="#{to==courseObservation.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<t:commandButton title="#{bundle.aon_remove}"
							actionListener="#{courseObservation.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
							rendered="#{to==courseObservation.to}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
							value="" accesskey="#{bundle.aon_key_remove_line}" />
					</t:div>
					<f:facet name="footer">
						<t:div>
							<f:verbatim rendered="#{!courseObservation.new}">&#160;</f:verbatim>
							<t:commandButton title="#{bundle.aon_save}"
								actionListener="#{courseObservation.onAccept}"
								rendered="#{courseObservation.new}" value=""
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
								accesskey="#{bundle.aon_key_save_line}" />
							<t:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{courseObservation.onCancel}"
								immediate="#{true}"
								onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
								rendered="#{courseObservation.new}"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
						</t:div>
					</f:facet>
				</h:column>
			</t:dataTable>
		</t:div>

		<ui:include src="/facelet/shared/dataScroller.xhtml">
			<ui:param name="dataTable" value="courseObservationDataTable" />
			<ui:param name="model" value="#{courseObservation.model}" />
			<ui:param name="showNote" value="#{false}" />
		</ui:include>

	</t:div>

</ui:composition>

</body>
</html>
