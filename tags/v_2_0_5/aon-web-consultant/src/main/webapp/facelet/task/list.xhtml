<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
	
		<h:form id="taskList">
			<!--  toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						action="task_form"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
						actionListener="#{task.onReset}"
						accesskey="#{bundle.aon_key_new}" />
					<h:commandButton id="search" value="#{bundle.aon_search}"
						action="task_search" 
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{task.onEditSearch}" 
						accesskey="#{bundle.aon_key_search}" />
					<h:commandButton id="assumeSelected" value="#{projectBundle.task_assume_selected}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{task.onAssumeSelected}" />
					<h:commandButton id="releaseSelected" value="#{projectBundle.task_release_selected}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{task.onReleaseSelected}" />
					<h:commandButton id="finishSelected" value="#{projectBundle.task_finish_selected}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{task.onFinishSelected}" />
				</t:div>
				</t:div>
			</t:div>

			<!--  aon-region-body -->
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="taskDataList" value="#{task.model}" rows="20"
							var="to" rowOnMouseOver="selectRow( this )"
							rendered="#{task.model.rowCount > 0}"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="
								aon-table-body aon-table-body-icon,
								aon-table-body aon-table-body-icon,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number,
								aon-table-body aon-table-body-string">
 
							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:selectBooleanCheckbox id="Row_checked" forceId="#{true}"
									value="#{task.rowChecked}"
									valueChangeListener="#{task.rowSelected}"
									onmouseover="enableRowSubmit(false)"
									onmouseout="enableRowSubmit(true)"
									styleClass="aon-form-selectBooleanCheckbox-field"
									disabled="#{!task.listPending and !task.listInProgress}" />
								<t:commandLink immediate="#{true}" 
									styleClass="aon-table-row-selected"
									action="task_form" 
									actionListener="#{task.onSelect}" />
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:div style="width:14px; height:14px;" rendered="#{task.myListTask}">
									<h:graphicImage
										url="/css/images/icons/aon-user-icon.gif"
										alt="#{projectBundle.task_user_task} #{to.user.name}"/>
								</t:div>
								<t:div style="width:14px; height:14px;" rendered="#{!task.myListTask}">
									<h:graphicImage
										url="/css/images/icons/aon-group-icon.gif"
										alt="#{projectBundle.task_group_task} #{to.workGroup.description}"/>
								</t:div>
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_description}" />
								</f:facet>
								<h:outputText value="#{to.description}" />
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{customerBundle.customer_customer}" />
								</f:facet>
								<h:outputText value="#{to.dossier.customer.registry.name} #{to.dossier.customer.registry.surname}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{projectBundle.dossier_dossier}" />
								</f:facet>
								<h:outputText value="#{to.dossier.number}"/>
							</h:column>							

							<t:column width="80">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_initial_date}" />
								</f:facet>
								<h:outputText value="#{to.startDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</t:column>

							<t:column width="75">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_final_date}" />
								</f:facet>
								<h:outputText value="#{to.dueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</t:column>

							<t:column width="75">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.task_priority}" />
								</f:facet>
								<h:outputText value="#{to.priority}" />
							</t:column>

							<t:column width="50">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.task_percent_abv}" />
								</f:facet>
								<h:outputText value="#{to.percent}" />
							</t:column>

							<t:column width="75">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_status}" />
								</f:facet>
								<h:outputText value="#{to.status}" />
							</t:column>

						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="taskDataList" />
						<ui:param name="model" value="#{task.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
