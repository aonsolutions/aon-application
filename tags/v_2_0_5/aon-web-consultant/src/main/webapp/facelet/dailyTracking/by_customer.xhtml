<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body id="aon-body">

<ui:composition template="/facelet/templates/aon.ui.formWindow.xhtml">

	<ui:define name="content">

		<h:form id="byCustomer">
		
			<t:commandButton id="by_customer" forceId="#{true}" style="display:none"
				action="#{dailyTracking.onReportByCustomer}"/>
			<t:div styleClass="aon-form-note">
				<t:div styleClass="aon-form-note-internal">
					<h:panelGroup>
						<h:outputText value="#{projectBundle.aon_generating_report}" />
					</h:panelGroup>
				</t:div>
			</t:div>	
		</h:form>
		<script>
			document.getElementById("by_customer").click();
		</script>
	</ui:define>
</ui:composition>

</body>
</html>
