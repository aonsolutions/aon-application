<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{groupwareBundle.aon_favorite}" />
				<ui:param name="controller" value="#{favorite}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{favorite.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="favorite_list" />		

					<aon:outputLabel for="Favorite_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Favorite_description"
						maxlength="128" size="100"
						valueChangeListener="#{favorite.addExpression}" />

					<aon:outputLabel for="Favorite_url"
						value="#{groupwareBundle.favorite_url}" />
					<aon:inputText id="Favorite_url"
						maxlength="128" size="100"
						valueChangeListener="#{favorite.addExpression}" />
						
					<aon:outputLabel for="Favorite_favoriteCategory_id"
						value="#{groupwareBundle.favorite_favorite_category}" />
					<aon:selectOneMenu id="Favorite_favoriteCategory_id"
						value="#{groupWareCollections.favoriteCategory}"
						valueChangeListener="#{favorite.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{groupWareCollections.favoriteCategories}" />
					</aon:selectOneMenu>
											
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
</ui:composition>
