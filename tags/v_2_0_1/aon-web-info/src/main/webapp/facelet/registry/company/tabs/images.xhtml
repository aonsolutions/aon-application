<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div ajaxRendered="true">
		<aon:panelGrid cellpadding="5" cellspacing="0" border="0" columns="2" style="width:100%"
			styleClass="aon-noborder"
			columnClasses="aon-midle-width  aon-vertical-align-top,aon-midle-width" id="imagesPanel">	
			<aon:div>
				<aon:editDataTable id="companyImages" value="#{companyImages.model}"
					var="to" rows="20" style="width:300px"
					columnClasses="aon-editDataTable-iconColumn,
						aon-editDataTable-textColumn">
	
					<aon:rowSelector toggleOnClick="#{true}" actionListener="#{companyImages.onSelect}"/>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;"/>
						</f:facet>
						<aon:outputText value="&#160;"/>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset" reRender="imagesPanel"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" rendered="#{!companyImages.new}"
									actionListener="#{companyImages.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.aon_registry_attach_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}"/>
						<f:facet name="footer">
							<aon:outputText value="&#160;"/>
						</f:facet>
					</aon:column>
			
				</aon:editDataTable>
			
				<aon:dataScroller dataTable="companyImages" style="width:300px"
					model="#{companyImages.model}" showNote="true" />
			</aon:div>	
			
			<aon:div styleClass="aon-group" rendered="#{(companyImages.to != null) or (companyImages.new)}">	
				<aon:div styleClass="aon-group-title">		
					<aon:outputLabel for="RegistryAttachment_preview" value="#{registryBundle.aon_company_logo_preview}" />
				</aon:div>
				<aon:div styleClass="aon-group-body">
					<aon:div styleClass="aon-toolbar" >
						<aon:commandButton id="save_image" value="#{bundle.aon_save}"					
							styleClass="aon-icon-accept aon-finding-toolbar-item"
							actionListener="#{companyImages.onAccept}"/>
						<aon:commandButton id="remove_image" value="#{bundle.aon_remove}"
							styleClass="aon-icon-delete aon-finding-toolbar-item"
							rendered="#{!companyImages.new}"
							actionListener="#{companyImages.onRemove}"/>
						<aon:commandButton id="remove_file" value="#{bundle.aon_fileupload_remove}"
							styleClass="aon-icon-delete aon-finding-toolbar-item"
							rendered="#{companyImages.fileData != null}"
							actionListener="#{companyImages.fileRemove}"/>
						<h:commandButton id="upload_image" value="#{bundle.aon_fileupload_insert}"
							styleClass="aon-icon-attach aon-finding-toolbar-item"
							rendered="#{companyImages.fileData == null}"
							actionListener="#{companyImages.fileUploaded}"/>
						<aon:commandButton id="cancel_image" value="#{bundle.aon_cancel}"
							styleClass="aon-icon-cancel aon-finding-toolbar-item"
							actionListener="#{companyImages.onCancel}"/>	
					</aon:div>		
					<aon:panelGrid columns="2" style="margin-left:10px;" 
						cellpadding="0" cellspacing="0"
						rendered="#{companyImages.to != null}">	
						<aon:outputLabel for="RegistryAttachment_description" value="#{registryBundle.aon_registry_attach_description}" />
						<aon:inputText id="RegistryAttachment_description" size="45"
							maxlength="50" value="#{companyImages.to.description}" />		

						<aon:outputLabel for="RegistryAttachment_inputFile" value="#{registryBundle.aon_registry_attach_file}" />
						<t:inputFileUpload id="RegistryAttachment_inputFile"
							value="#{companyImages.inputFile}"
							rendered="#{companyImages.fileData == null}"
							accept="image/*" size="45"
							storage="file" required="true"/>

						<aon:panelGroup styleClass="aon-text-center" rendered="#{companyImages.fileData != null}">
							<aon:mediaOutput id="RegistryAttachment_preview" 
								element="img" cacheable="false"
								createContent="#{companyImages.paint}" 
								mimeType="#{companyImages.mimeType}" />
						</aon:panelGroup>
					</aon:panelGrid>
				</aon:div>			
			</aon:div>	
	
		</aon:panelGrid>
	</aon:div>
	
</ui:composition>
</body>
</html>
