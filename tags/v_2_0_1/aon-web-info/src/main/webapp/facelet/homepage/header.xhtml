<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:div id="aon-header">	
		<aon:panelGrid cellpadding="0" cellspacing="0" border="0" columns="3" style="width:100%"
			columnClasses="aon-header-name,aon-header-slogan,aon-header-info">
			<aon:div>
				<aon:outputConnectionStatus	styleClass="aon-outputConnectionStatus"		
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyleClass="aon-outputConnectionStatus-stop"/>
				<h:graphicImage styleClass="aon-logo"
				url="#{aonConfiguration.applicationLogoContextRelativePath}"
				alt="#{appBundle.aon_application_title}" />			
				<aon:outputText value="#{appBundle.aon_application_title}" styleClass="aon-applicationName"/>
			</aon:div>
	
			<aon:div>
				<aon:div rendered="#{aonConfiguration.properties.middleHeader == null}">
					<aon:outputText value="&#160;"/>
				</aon:div>
				<aon:div rendered="#{aonConfiguration.properties.middleHeader != null}">
					<aon:outputText escape="false" value="#{aonConfiguration.properties.middleHeader}" />
				</aon:div>
			</aon:div>
			<aon:div style="display:inline;white-space:nowrap;">
				<aon:outputText value="#{company.companyName}" />
				<aon:outputText value=" / " />
				<aon:outputText value="#{company.loggedUserName}" />
			</aon:div>
		</aon:panelGrid>
		<aon:div styleClass="aon-header-additionalInfo">		
			<aon:div styleClass="aon-float-left"><aon:outputText value="#{company.currentDate}" /></aon:div>
			<aon:div styleClass="aon-float-right">
				<h:outputLink style="text-align:right;padding-right:1em;font-size:0.9em;font-weight:bold;" 
					onclick="parent.window.close();" target="_top">
					<aon:outputText value="#{appBundle.aon_application_close}" style="color:#fff;"/>
				</h:outputLink>
			</aon:div>
		</aon:div>
	</aon:div>
</ui:composition>

</body>
</html>
