<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>
	
	<ui:define name="content">
	
		<h:form id="financeReturnForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<h:commandButton id="search" value="#{bundle.aon_search}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{financeReturn.onEditSearch}" action="finance_return_search"
							accesskey="#{bundle.aon_key_search}" />
						<h:commandButton id="return" value="#{financeBundle.finance_to_return}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{financeReturn.onReturn}" action="finance_return_search"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{bundle.aon_editing}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<!-- start of bag panel -->
					<!-- start of flow layout -->
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<h:outputLabel for="Finance_payment"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.aon_payment} / #{financeBundle.aon_charge}" />
							<t:selectOneRadio id="Finance_payment" value="#{financeReturn.payment}" disabled="true">
								<f:selectItem itemLabel="#{financeBundle.aon_payment}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{financeBundle.aon_charge}" itemValue="#{false}" />
							</t:selectOneRadio>
							
							<t:outputLabel for="Customer_Lookup_id"
								rendered="#{!financeReturn.payment}"
								styleClass="aon-form-input-text-label"
								value="#{customerBundle.customer_customer}" />
							<t:inputText id="Customer_full_name" forceId="#{true}"
								rendered="#{!financeReturn.payment}"
								styleClass="aon-form-input-text-disabled" disabled="true"
								value="#{financeReturn.to.registry.name} #{financeReturn.to.registry.surname}" size="40" />
							
							<t:outputLabel for="Supplier_Lookup_id"
								rendered="#{financeReturn.payment}"
								value="#{financeBundle.aon_supplier}"
								styleClass="aon-form-lookup-label" />
							<t:inputText id="Supplier_full_name" forceId="#{true}"
								rendered="#{financeReturn.payment}"
								styleClass="aon-form-input-text-disabled" disabled="true"
								value="#{financeReturn.to.registry.name} #{financeReturn.to.registry.surname}" size="40" />

							<h:outputLabel for="Finance_invoice_series"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.aon_series_number}" />
							<h:panelGrid columns="2">
								<t:inputText id="Finance_invoice_series"
									value="#{financeReturn.to.invoice.series}"
									styleClass="aon-form-input-text-disabled" forceId="#{true}" size="3"
									maxlength="3" disabled="true" />
								<t:inputText id="Finance_invoice_number"
									value="#{financeReturn.to.invoice.number}"
									styleClass="aon-form-input-text-disabled" forceId="#{true}"
									size="7" disabled="true"/>
							</h:panelGrid>
							
							<h:outputLabel for="Finance_date"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.aon_finance_date}" />
							<t:inputCalendar size="8" id="Finance_date"
								value="#{financeReturn.returnDate}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								popupButtonStyleClass="aon-form-calendar-button"
								styleClass="aon-form-input-text"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />

							<t:outputLabel for="Finance_amount"
								value="#{financeBundle.finance_amount}"
								styleClass="aon-form-lookup-label" />
							<t:inputText id="Finance_amount" size="8" forceId="#{true}"
								styleClass="aon-form-input-text-disabled" disabled="true"
								value="#{financeReturn.to.amount}" />

							<t:outputLabel for="Finance_expenses"
								value="#{financeBundle.finance_expenses}"
								styleClass="aon-form-lookup-label" />
							<t:inputText id="Finance_expenses" size="8" forceId="#{true}"
								styleClass="aon-form-input-text"
								value="#{financeReturn.to.expenses}"/>
						
					</h:panelGrid>
					<!-- end of flow layout -->
					<!-- end of bag panel -->
					
				</t:div>
			</t:div>

		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
