<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="balanceForm">
		
		
			<ui:decorate  template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_balance_menu}" />
				<ui:param name="controller" value="#{balance}"/>
				
				
						<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="balanceDetailList" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="balanceDetailList" />
						<f:param name="outputFormat" value="MS Excel" />
					
					</h:commandLink>
					
				</ui:define>
				
			</ui:decorate>	
							
			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid  columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel value="#{accountingBundle.accounting_balance_cdg}" />
					<aon:inputText value="#{balance.to.id}"  disabled="true"
						 size="10" maxlength="8" />
				
					<aon:outputLabel  value="#{accountingBundle.accounting_balance_name}" />
					<aon:inputText value="#{balance.to.name}" 
						required="true" size="60" maxlength="50" >
					</aon:inputText>
				
				</aon:panelGrid>

		 		<ui:include src="grid.xhtml" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
