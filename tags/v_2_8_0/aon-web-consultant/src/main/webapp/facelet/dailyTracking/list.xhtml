<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
	
		<h:form id="dailyTrackingList">
			<!--  toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
						actionListener="#{dailyTracking.onReset}" action="daily_tracking_form" 
						accesskey="#{bundle.aon_key_new}"/>
					<h:commandButton id="search" value="#{bundle.aon_search}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{dailyTracking.onEditSearch}" action="daily_tracking_search" 
						accesskey="#{bundle.aon_key_search}"/>
				</t:div>
				</t:div>
			</t:div>

			<!--  aon-region-body -->
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="dailyTrackingDataList" value="#{dailyTracking.model}" rows="20"
							var="to" rowOnMouseOver="selectRow( this )"
							rendered="#{dailyTracking.model.rowCount > 0}"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number">
 
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_date}" />
									</h:panelGroup>
								</f:facet>
								<t:commandLink immediate="#{true}" 
									styleClass="aon-table-row-selected"
									action="daily_tracking_form" 
									actionListener="#{dailyTracking.onSelect}" />
								<h:outputText value="#{to.trackingDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{customerBundle.customer_customer}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.customer.registry.name} #{to.customer.registry.surname}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_daily_tracking_dossier}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.dossier.number}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_daily_tracking_activity}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.activity.activityType.description}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_daily_tracking_job_type}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.jobType.description}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_daily_tracking_duration}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.trackingDuration}" />
							</h:column>

						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="dailyTrackingDataList" />
						<ui:param name="model" value="#{dailyTracking.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
