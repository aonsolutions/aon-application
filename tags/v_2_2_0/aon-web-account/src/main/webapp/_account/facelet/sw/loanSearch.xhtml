<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.formWindow.xhtml">

	<ui:define name="content">

		<h:form id="loanForm" styleClass="aon-form">

			<h:inputHidden value="#{loanLookup.parameters}" />

			<t:div styleClass="aon-content-title" forceId="#{true}"
				id="aon-window-popup-title">
				<t:div styleClass="aon-content-title-internal">
					<h:outputText value="#{accountBundle.aon_loan}" />
				</t:div>
			</t:div>

			<!-- start toolbar navigation -->
			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">

						<h:commandButton id="search" value="#{bundle.aon_search}"
							accesskey="#{bundle.aon_key_search}" action="loan_sw"
							actionListener="#{loanLookup.onSearch}"
							styleClass="aon-content-toolbar-item"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							onclick="window.close();return false;"
							accesskey="#{bundle.aon_key_cancel}"
							styleClass="aon-content-toolbar-item"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
						<h:commandButton type="reset" id="clear"
							value="#{bundle.aon_clear}" styleClass="aon-content-toolbar-item"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>

					</t:div>
				</t:div>
			</t:div>
			<!-- end toolbar navigation -->

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Loan_description"
							value="#{accountBundle.aon_description}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Loan_description" size="20"
							valueChangeListener="#{loanLookup.addExpression}"
							styleClass="aon-form-input-text" />

					</h:panelGrid>
				</t:div>
			</t:div>

		</h:form>
	</ui:define>
</ui:composition>

</body>
</html>
