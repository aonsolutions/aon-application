<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>		

	<ui:define name="content">

		<h:form id="purchaseDirectInvoicingForm" styleClass="aon-form">

			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="search" value="#{bundle.aon_search}"
						actionListener="#{purchaseDirectInvoicing.onSearch}" action="purchase_direct_invoicing_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-accept"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-accept'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-accept'" 
						accesskey="#{bundle.aon_key_search}"/>
					<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
						actionListener="#{purchaseDirectInvoicing.onCancel}" action="purchase_direct_invoicing_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
						accesskey="#{bundle.aon_key_cancel}"/>
					<h:commandButton id="clear" value="#{bundle.aon_clear}"
						type="reset"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'" />
					<t:commandButton id="reset" value="#{bundle.aon_reset}"
						actionListener="#{purchaseDirectInvoicing.onReset}" action="purchase_direct_invoicing_form"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" 
						accesskey="#{bundle.aon_key_new}"/>
				</t:div>
				</t:div>
			</t:div>
			
			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
				<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>
			
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<h:outputLabel for="Invoice_series"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.aon_series_number}" />
							<h:panelGrid columns="2">
								<t:inputText id="Invoice_series"
									onblur="toUpperCase(this);"
									valueChangeListener="#{purchaseDirectInvoicing.addExpression}"
									styleClass="aon-form-input-text" forceId="#{true}" size="4"
									maxlength="5">
									<f:validateLength maximum="5" />
								</t:inputText>
								<t:inputText id="Invoice_number"
									valueChangeListener="#{purchaseDirectInvoicing.addExpression}"
									styleClass="aon-form-input-text" forceId="#{true}"
									size="7" />
							</h:panelGrid>
							
							<t:outputLabel for="Supplier_Lookup_id"
								styleClass="aon-form-input-text-label"
								value="#{supplierBundle.aon_supplier}" />
							<t:div>
								<t:inputText id="Supplier_Lookup_id" size="5" forceId="#{true}"
									styleClass="aon-form-input-text"
									onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','supplierLookup','Supplier_Lookup_id','Supplier_id|Supplier_Lookup_id,Supplier_full_name|Supplier_full_name');"
									valueChangeListener="#{purchaseDirectInvoicing.addSupplierEqualExpression}"/>
								<h:commandButton id="find_Supplier_Lookup_id"
									styleClass="aon-form-lookup-button" value="" immediate="true"
									onclick="lookupSearchWindow(this, 'placeList', '#{supplierLookup.encodedSearchPagePath}','Supplier_id|Supplier_Lookup_id,Supplier_full_name|Supplier_full_name');return false;" />	
								<t:inputText id="Supplier_full_name" forceId="#{true}"
									styleClass="aon-form-input-text-disabled"
									disabled="true" size="40"/>	 		
							</t:div>

							<h:outputLabel
								styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
								for="Invoice_fromDate" value="#{financeBundle.aon_date}" />
							<t:div>
								<t:div styleClass="aon-form-nowrap aon-form-layout-unit aon-form-layout-unit-inline-label-block">
									<h:outputText value="#{financeBundle.finance_date_from}" 
										styleClass="aon-form-input-text-label aon-form-layout-label-block"/>
									<t:inputCalendar id="Invoice_fromDate" size="10"
										valueChangeListener="#{purchaseDirectInvoicing.addIssuedateFromExpression}"
										monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
										currentDayCellClass="currentDayCell" renderAsPopup="true"
										styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
										popupTodayString="#{bundle.aon_popup_today}"
										popupWeekString="#{bundle.aon_popup_week}" />
								</t:div>
								<t:div styleClass="aon-form-nowrap aon-form-layout-unit aon-form-layout-unit-inline-label-block">
									<h:outputText value="#{financeBundle.finance_date_to}" 
										styleClass="aon-form-input-text-label aon-form-layout-label-block"/>
									<t:inputCalendar id="Invoice_toDate" size="10"
										valueChangeListener="#{purchaseDirectInvoicing.addIssuedateToExpression}"
										monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
										currentDayCellClass="currentDayCell" renderAsPopup="true"
										styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
										popupTodayString="#{bundle.aon_popup_today}"
										popupWeekString="#{bundle.aon_popup_week}" />
								</t:div>
							</t:div>

					</h:panelGrid>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
