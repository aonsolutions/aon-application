<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{targetProfile}" />
			<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
			
			<ui:define name="columns">

				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="TargetProfile_lastUpdate" value="#{marketingBundle.marketing_target_profile_lastUpdate}" />
					</f:facet>
					<aon:outputText value="#{to.lastUpdate}" rendered="#{formList}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>				
					<aon:selectInputDate id="TargetProfile_lastUpdate" value="#{controller.to.lastUpdate}"
						timeZone="#{timeZoneController.timeZone}" rendered="#{formEdit}" required="true"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
					<f:facet name="footer">
						<aon:selectInputDate id="TargetProfile_lastUpdate-New" value="#{controller.to.lastUpdate}" 
							timeZone="#{timeZoneController.timeZone}" rendered="#{formNew}" required="true"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="TargetProfile_question_id" value="#{marketingBundle.marketing_question}" />
					</f:facet>
					<aon:outputText value="#{to.question.text}" />
					<f:facet name="footer">
						<aon:div styleClass="aon-lookup" rendered="#{formNew}">
							<aon:lookupInputText id="TargetProfile_question_id"
								lookup="#{questionLookup}" required="true"
								reRender="TargetProfile_question_detail-New,TargetProfile_response-New"
								value="#{targetProfile.to.question.id}" size="5">
							</aon:lookupInputText>
							<aon:lookupButton windowTitle="#{marketingBundle.marketing_question_selection}" 
								selectReRender="TargetProfile_question_id,TargetProfile_question_detail-New,TargetProfile_response-New"
								lookup="#{questionLookup}" minHeight="460" minWidth="650"
								property="#{targetProfile.to.question}">
							</aon:lookupButton>
							<aon:inputText id="TargetProfile_question_detail-New"
								value="#{controller.to.question.text}"
								size="60" disabled="true" />
						</aon:div>
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="TargetProfile_value"
							value="#{marketingBundle.marketing_response}" />
					</f:facet>
					<aon:div layout="none" rendered="#{formList}">
						<ui:include src="/com/code/aon/ui/marketing/facelet/util/outputValue.xhtml" >
							<ui:param name="valueHolder" value="#{to}" />
						</ui:include>
					</aon:div>
					<aon:div layout="none" rendered="#{formEdit}">
						<ui:include src="/com/code/aon/ui/marketing/facelet/util/inputValue.xhtml" >
							<ui:param name="inputId" value="TargetProfile_value" />
							<ui:param name="valueHolder" value="#{controller.to}" />
						</ui:include>
					</aon:div>			
					<f:facet name="footer">
						<aon:div id="TargetProfile_response-New">
							<aon:div layout="none" rendered="#{formNew}">
								<ui:include src="/com/code/aon/ui/marketing/facelet/util/inputValue.xhtml" >
									<ui:param name="inputId" value="TargetProfile_value-New" />
									<ui:param name="valueHolder" value="#{controller.to}" />
								</ui:include>
							</aon:div>
						</aon:div>
					</f:facet>
				</aon:column>			
				
			</ui:define>
		</ui:decorate>
	</aon:div>
</ui:composition>
