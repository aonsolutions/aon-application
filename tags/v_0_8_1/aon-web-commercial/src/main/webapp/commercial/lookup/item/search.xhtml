<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<aon:div styleClass="aon-scroll-area">
		<aon:div styleClass="aon-scroll-area-internal">

			<aon:panelGrid columns="2">

				<aon:outputLabel
					for="Item_product_code" value="#{productBundle.item_code}" />
				<aon:inputText id="Item_product_code" size="10"
					onblur="toUpperCase(this);"
					valueChangeListener="#{itemSearch.addExpression}"
					value="#{itemSearch.values['Item_product_code']}" />
				<aon:outputLabel
					for="Item_product_name" value="#{productBundle.item_name}" />
				<aon:inputText id="Item_product_name" size="50"
					valueChangeListener="#{itemSearch.addExpression}"
					value="#{itemSearch.values['Item_product_name']}" />
				<aon:outputLabel
					for="Item_status" value="#{productBundle.item_status}" />
				<aon:selectOneMenu styleClass="aon-form-selectOneMenu-field"
					id="Item_status" valueChangeListener="#{itemSearch.addEqualExpression}"
					value="#{itemSearch.values['Item_status']}"
					converter="aonProductStatusConverter">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{productCollections.productStatuses}" />
				</aon:selectOneMenu>
						
			</aon:panelGrid>
	
		</aon:div>
	</aon:div>
	
</ui:composition>

</body>
</html>
