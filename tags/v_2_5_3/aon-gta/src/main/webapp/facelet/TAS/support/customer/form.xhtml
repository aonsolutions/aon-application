<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="supportOrderTargetForm">
		
			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{SupportOrder.to.series} / #{SupportOrder.to.number}: #{SupportOrder.to.tasItem.publicCode} / #{SupportOrder.to.tasItem.model.make.name} #{SupportOrder.to.tasItem.model.name}" />
			</t:div>

			<t:div styleClass="aon-content-menu" rendered="#{!SupportOrder.new}" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="7" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
						<t:commandLink id="support_order_data" value="#{tasBundle.supportOrder_data}"
							action="SupportOrder_form" actionListener="#{SupportOrder.reloadMedias}"
							forceId="#{true}" styleClass="aon-content-menu-item" />					
					</t:panelGroup>	
					<t:panelGroup>						
						<t:commandLink id="support_order_customer_data" forceId="#{true}" 
							value="#{tasBundle.supportOrder_customer_data}"
							styleClass="aon-content-menu-item-active"/>						
					</t:panelGroup>	
					<t:panelGroup>						
						<t:commandLink id="support_order_insurance_data" forceId="#{true}" value="#{tasBundle.supportOrder_insurance_data}"
							actionListener="#{supportOrderInsurance.onInsurance}" action="supportOrder_insurance_data" 
							styleClass="aon-content-menu-item" />						
					</t:panelGroup>
				</t:panelGrid>
			</t:div>

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{supportOrderTarget.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							disabled="#{supportOrderTargetAddress.to!=null || supportOrderTargetMedia.to!=null || !SupportOrder.pending}"
							accesskey="#{bundle.aon_key_save}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">

					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Target_document"
							styleClass="aon-form-input-text-label"
							value="#{registryBundle.aon_nif}" />
						<t:inputText id="Target_document"
							styleClass="aon-form-input-text" forceId="#{true}"
							disabled="#{!SupportOrder.pending}"
							value="#{supportOrderTarget.to.registry.document}" size="16" onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="16" />
						</t:inputText>

						<t:outputLabel for="Target_name"
							styleClass="aon-form-input-text-label"
							value="#{registryBundle.aon_name}" />
						<t:inputText id="Target_name"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{supportOrderTarget.to.registry.name}" size="64">
							<f:validateLength minimum="1" maximum="64" />
						</t:inputText>

						<t:outputLabel for="Target_surname"
							styleClass="aon-form-input-text-label"
							value="#{registryBundle.aon_surname}" />
						<t:inputText id="Target_surname"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{supportOrderTarget.to.registry.surname}" size="64">
							<f:validateLength minimum="1" maximum="64" />
						</t:inputText>

						<t:outputLabel for="Target_alias"
							styleClass="aon-form-input-text-label"
							value="#{registryBundle.aon_alias}" />
						<t:inputText id="Target_alias"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{supportOrderTarget.to.registry.alias}" size="32" onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="32" />
						</t:inputText>

					</h:panelGrid>

					<t:panelTabbedPane styleClass="aon-tabpanel" style="width:100%;"
						activeTabStyleClass="aon-tabpanel-active"
						inactiveTabStyleClass="aon-tabpanel-inactive"
						serverSideTabSwitch="true">

						<t:panelTab id="address" label="#{registryBundle.aon_addresses}">
							<ui:include src="/facelet/shared/tabs/addresses.xhtml">
								<ui:param name="controllerAlias" value="#{supportOrderTargetAddress}" />
								<ui:param name="dataTable" value="supportOrderTargetAddressDataList" />
							</ui:include>
						</t:panelTab>

						<t:panelTab id="medias" label="#{registryBundle.aon_media}">
							<ui:include src="/facelet/shared/tabs/medias.xhtml">
								<ui:param name="controllerAlias" value="#{supportOrderTargetMedia}" />
								<ui:param name="dataTable" value="supportOrderTargetMediaDataList" />
							</ui:include>
						</t:panelTab>

						<t:panelTab id="finance_data"
							label="#{financeBundle.aon_finance_data}">
							<ui:include src="/facelet/shared/tabs/banks.xhtml">
								<ui:param name="controllerAlias" value="#{supportOrderTargetRbank}" />
								<ui:param name="dataTable" value="bankDataList" />
							</ui:include>
							<ui:include src="/facelet/shared/tabs/payMethods.xhtml">
								<ui:param name="controllerAlias" value="#{supportOrderTargetRpayMethod}" />
								<ui:param name="dataTable" value="payMethodDataList" />
							</ui:include>
						</t:panelTab>

					</t:panelTabbedPane>
				</t:div>
			</t:div>

		</h:form>

		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
