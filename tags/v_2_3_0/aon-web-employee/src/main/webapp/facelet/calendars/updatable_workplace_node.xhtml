<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

<ui:define name="content">
	
	<h:form id="treeForm">

		<t:div styleClass="aon-content-menu" id="aon-content-menu" forceId="#{true}" >
			<t:panelGrid columns="2" cellpadding="0" cellspacing="0" border="0">
				<t:panelGroup>
					<t:commandLink id="calendars_form" forceId="#{true}" 
						value="Arbol" 
						styleClass="aon-content-menu-item-active" />
				</t:panelGroup>	
				<t:panelGroup>
					<t:commandLink id="calendars_data" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
						actionListener="#{calendars.onSchedule}" action="calendars_calendar" 
						styleClass="aon-content-menu-item" />
				</t:panelGroup>
			</t:panelGrid>
		</t:div>

		<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar">
			<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="save" forceId="#{true}" value="#{bundle.aon_save}"
						action="calendars_form"
						actionListener="#{calendars.onUpdateWorkPlace}"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
						accesskey="#{bundle.aon_key_save}"/>
					<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
						forceId="#{true}" immediate="#{true}" 
						action="calendars_form"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
						accesskey="#{bundle.aon_key_cancel}"/>
				</t:div>
			</t:div>
		</t:div>

		<t:div id="aon-scroll-area" forceId="#{true}">
			<t:div styleClass="aon-scroll-area-internal" style="padding-top:0;" >

				<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle" forceId="#{true}">
					<t:div styleClass="aon-content-subtitle-internal">
						<h:outputText value="#{bundle.aon_editing} #{appBundle.aon_workplace}" />
					</t:div>
				</t:div>

				<t:div styleClass="aon-form-group-body">
					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
							styleClass="aon-form-table" style="width:100%;"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						<t:outputLabel 
							for="Company_address" 
							styleClass="aon-form-input-text-label"
							value="#{rBundle.aon_address}" />
						<h:panelGrid columns="1">
							<h:inputText id="Company_address"
								styleClass="aon-form-input-text"
								value="#{workplace.to.address.address}"
								size="45"/>
							<h:inputText id="Company_address2"
								styleClass="aon-form-input-text"
								value="#{workplace.to.address.address2}"
								size="45"/>
							<h:inputText id="Company_address3"
								styleClass="aon-form-input-text"
								value="#{workplace.to.address.address3}"
								size="45"/>		
						</h:panelGrid>
					</h:panelGrid>
				</t:div>

			</t:div>
		</t:div>

	</h:form>

	<h:form id="placeList" target="list" />
</ui:define>
</ui:composition>

</body>
</html>
