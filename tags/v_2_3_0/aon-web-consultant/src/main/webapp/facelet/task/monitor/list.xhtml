<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
	
		<h:form id="taskMonitorList">
			<!--  toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<h:commandButton id="search" 
						value="#{bundle.aon_search}" action="task_monitor_search" 
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{taskMonitor.onEditSearch}" 
						accesskey="#{bundle.aon_key_search}" />
					<t:commandButton id="taskMonitor"
						forceId="#{true}" value="#{bundle.aon_listing}"
						onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
						accesskey="#{bundle.aon_key_print}" />
				</t:div>
				</t:div>
			</t:div>

			<!--  aon-region-body -->
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="taskMonitorDataList" value="#{taskMonitor.model}" rows="20"
							var="to" rendered="#{taskMonitor.model.rowCount > 0}"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string">
 
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_description}" />
								</f:facet>
								<h:outputText value="#{to.description}" />
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{customerBundle.customer_customer}" />
								</f:facet>
								<h:outputText value="#{to.dossier.customer.registry.name} #{to.dossier.customer.registry.surname}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{projectBundle.dossier_dossier}" />
								</f:facet>
								<h:outputText value="#{to.dossier.number}"/>
							</h:column>							

							<t:column width="80">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_initial_date}" />
								</f:facet>
								<h:outputText value="#{to.startDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</t:column>

							<t:column width="75">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_final_date}" />
								</f:facet>
								<h:outputText value="#{to.dueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</t:column>

							<t:column width="75">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.task_priority}" />
								</f:facet>
								<h:outputText value="#{to.priority}" />
							</t:column>

							<t:column width="50">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.task_percent_abv}" />
								</f:facet>
								<h:outputText value="#{to.percent}" />
							</t:column>

							<t:column width="75">
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_status}" />
								</f:facet>
								<h:outputText value="#{to.status}" />
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{projectBundle.aon_work_group}" />
								</f:facet>
								<h:outputText value="#{to.workGroup.description}" />
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{projectBundle.task_user}" />
								</f:facet>
								<h:outputText value="#{to.user.name}" />
							</t:column>

						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="taskMonitorDataList" />
						<ui:param name="model" value="#{taskMonitor.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
