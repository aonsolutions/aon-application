<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

	<aon:div styleClass="aon-section-toolbar">
			<aon:confirmButton id="saveg" value="#{bundle.aon_save}"
				styleClass="aon-content-toolbar-item aon-icon-accept"
				confirmTitle="Confirmation Dialog"
				confirmMessage="#{bundle.aon_save_confirm}"
				confirmActionListener="#{company.onAccept}"
				onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
				onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
				accesskey="#{bundle.aon_key_save}" />
	</aon:div>

		<aon:div style="float:left;margin-right:20px;">
			<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-formTable-column-odd,aon-formTable-column-even">
	
				<aon:outputLabel for="Company_name"
					value="#{registryBundle.aon_name}" />
				<aon:inputText id="Company_name"
					styleClass="aon-inputText" required="true" size="45"
					maxlength="50" value="#{company.to.name}" />
	
				<aon:outputLabel for="Company_document"
					value="#{registryBundle.aon_cif}" />
				<aon:inputText id="Company_document"
					styleClass="aon-inputText" required="true" size="15"
					maxlength="9" value="#{company.to.document}" />
	
				<aon:outputLabel for="Company_alias"
					value="#{appBundle.aon_web_info_company_alias}" />
				<aon:inputText id="Company_alias"
					styleClass="aon-inputText" required="true" size="45"
					maxlength="50" value="#{company.to.alias}" />
				
				<aon:outputLabel for="Company_telephone"
					value="#{registryBundle.aon_phone}" />
				<aon:inputText id="Company_telephone"
					styleClass="aon-inputText" size="20" maxlength="15" 
					value="#{company.phone.value}" 
					valueChangeListener="#{company.phoneChanged}"/>
	
				<aon:outputLabel for="Company_fax"
					value="#{registryBundle.aon_fax}" />
				<aon:inputText id="Company_fax"
					styleClass="aon-inputText" size="20" maxlength="15" 
					value="#{company.fax.value}" 
					valueChangeListener="#{company.faxChanged}"/>
	
				<aon:outputLabel for="Company_email"
					value="#{registryBundle.aon_email}" />
				<aon:inputText id="Company_email"
					styleClass="aon-inputText" size="45" 
					value="#{company.email.value}" 
					valueChangeListener="#{company.emailChanged}"/>
	
				<aon:outputLabel for="Company_web"
					value="#{registryBundle.aon_web}" />
				<aon:inputText id="Company_web"
					styleClass="aon-inputText" size="45" 
					value="#{company.web.value}" 
					valueChangeListener="#{company.webChanged}"/>
			</aon:panelGrid>
	</aon:div>		
	<aon:div style="float:left;">	
		<aon:div styleClass="aon-group" >		
			<aon:div styleClass="aon-group-title">							
			<aon:outputLabel for="Company_logo"
				rendered="#{!company.new}"
				value="#{registryBundle.aon_company_logo}" />
			</aon:div>
			<aon:div styleClass="aon-group-body">
				<aon:inputFile id="Company_logo" 
					rendered="#{!company.new}"
					uploadDirectory="/tmp"
					uniqueFolder="false" 
					progressListener="#{company.progress}"
					actionListener="#{company.fileUploaded}"
					inputTextSize="45"
					 label="Actualizar" height="24">
					<aon:outputProgress id="logo_progress" value="#{company.percent}" 
					style="margin-left:0;font-size:9px;"/>
				</aon:inputFile>	
			
				<aon:div>
					<aon:graphicImage id="Logo_preview"
						rendered="#{company.imageAttached}"
						url="company.logo"/>	
				</aon:div>
			</aon:div>
		</aon:div>
		
	</aon:div>
		
		
	<aon:div style="clear:both;padding-top:1em;">
		<aon:panelGrid  columns="4" styleClass="aon-box aon-box-outstanding"
				cellpadding="0" cellspacing="0" 
				style="width:100%">
			
		  		<aon:div styleClass="aon-text-bold">	  
					<aon:outputLabel for="Company_address"
					value="#{registryBundle.aon_address}" />
				</aon:div>		
				<aon:outputLabel for="Company_zip" styleClass="aon-text-bold"
					value="#{registryBundle.aon_zip}" />
				<aon:outputLabel for="Company_city" styleClass="aon-text-bold"
					value="#{registryBundle.aon_city}" />
				<aon:outputLabel for="Company_address_geozone" styleClass="aon-text-bold"
					value="#{registryBundle.aon_geozone}" />
					
				<aon:div>
					<aon:div>
						<aon:inputText id="Company_address"
							styleClass="aon-inputText" required="true" size="50"
							maxlength="50" value="#{company.mainAddress.address}"
							valueChangeListener="#{company.addressChanged}" />
					</aon:div>
					<aon:div>
						<aon:inputText id="Company_address2"
							styleClass="aon-inputText" size="50"
							maxlength="50" value="#{company.mainAddress.address2}"
							valueChangeListener="#{company.addressChanged}" />
					</aon:div>
					<aon:div>
						<aon:inputText id="Company_address3"
							styleClass="aon-inputText" size="50"
							maxlength="50" value="#{company.mainAddress.address3}"
							valueChangeListener="#{company.addressChanged}" />	
					</aon:div>	
				</aon:div>		
				
				<aon:div>
					<aon:inputText id="Company_zip"
						styleClass="aon-inputText" size="6"
						maxlength="50" value="#{company.mainAddress.zip}"
						valueChangeListener="#{company.addressChanged}" />			
		
				</aon:div>

				<aon:div>
						<aon:inputText id="Company_city"
						styleClass="aon-inputText" size="45"
						maxlength="50" value="#{company.mainAddress.city}"
						valueChangeListener="#{company.addressChanged}" />			
				</aon:div>

				<aon:div>		
					<aon:selectOneMenu id="Company_address_geozone"
						value="#{company.mainAddress.geozone.id}"
						valueChangeListener="#{company.addressChanged}">
						<f:selectItems value="#{registryCollections.geoZones}" />
					</aon:selectOneMenu>
			</aon:div>
		</aon:panelGrid>
		<aon:div style="clear:both"		>
			<ui:include src="/facelet/shared/tabs/addresses.xhtml">
				<ui:param name="controllerAlias" value="#{companyAddress}" />
				<ui:param name="dataTable" value="companyAddressDataList" />
			</ui:include>
		</aon:div>
	</aon:div>
</ui:composition>
</body>
</html>
