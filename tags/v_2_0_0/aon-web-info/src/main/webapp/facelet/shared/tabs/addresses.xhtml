<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

	<aon:editDataTable id="#{dataTable}" value="#{controllerAlias.model}"
		var="to" rows="20" 
		styleClass="aon-editTable"
		columnClasses="aon-editTable-icon,
			aon-editTable-cell,
			aon-editTable-cell,
			aon-editTable-cell,
			aon-editTable-cell,
			aon-editTable-buttons">

		<aon:column>
			<aon:rowSelector multiple="false"
				toggleOnClick="#{controllerAlias.to == null}"
				selectionListener="#{controllerAlias.onSelect}" />
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			
			<f:verbatim>&#160;</f:verbatim>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						styleClass="aon-editTable-button aon-icon-reset"
						value="" rendered="#{!controllerAlias.new}"
						actionListener="#{controllerAlias.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_address}" />
			</f:facet>
			<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.address}"
				styleClass="aon-inputText"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="50" />
			<aon:inputText value="#{controllerAlias.to.address2}"
				styleClass="aon-inputText"
				rendered="#{to==controllerAlias.to}" size="50" />
			<aon:inputText value="#{controllerAlias.to.address3}"
				styleClass="aon-inputText"
				rendered="#{to==controllerAlias.to}" size="50" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{controllerAlias.to.address}"
						styleClass="aon-inputText"
						rendered="#{controllerAlias.new}" required="#{true}" size="50" />
					<aon:inputText value="#{controllerAlias.to.address2}"
						styleClass="aon-inputText"
						rendered="#{controllerAlias.new}" size="50" />
					<aon:inputText value="#{controllerAlias.to.address3}"
						styleClass="aon-inputText"
						rendered="#{controllerAlias.new}" size="50" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_zip}" />
			</f:facet>
			<aon:outputText value="#{to.zip}" rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.zip}" styleClass="aon-inputText"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="8" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{controllerAlias.to.zip}" styleClass="aon-inputText"
						rendered="#{controllerAlias.new}" required="#{true}" size="8" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_city}" />
			</f:facet>
			<aon:outputText value="#{to.city}" rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.city}" styleClass="aon-inputText"
				rendered="#{to==controllerAlias.to}" size="40" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{controllerAlias.to.city}" styleClass="aon-inputText" 
						rendered="#{controllerAlias.new}" size="40" />
				</aon:div>
			</f:facet>
		</aon:column>
		
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_geozone}" />
			</f:facet>
			<aon:outputText value="#{to.geozone.name}" rendered="#{to!=controllerAlias.to}" />
			<aon:selectOneMenu value="#{controllerAlias.to.geozone.id}"
				rendered="#{to==controllerAlias.to}"
				valueChangeListener="#{company.onChangeGeoZone}">
				<f:selectItems value="#{registryCollections.geoZones}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:selectOneMenu value="#{controllerAlias.to.geozone.id}"
					rendered="#{controllerAlias.new}"
					valueChangeListener="#{company.onChangeGeoZone}">
					<f:selectItems value="#{registryCollections.geoZones}" />
				</aon:selectOneMenu>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<aon:div>
				<f:verbatim rendered="#{to!=controllerAlias.to}">&#160;</f:verbatim>

				<aon:commandButton title="#{bundle.aon_save}"
					actionListener="#{controllerAlias.onAccept}"
					rendered="#{to==controllerAlias.to}" value=""
					styleClass="aon-editTable-button aon-icon-accept"
					accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton title="#{bundle.aon_cancel}"
					actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
					styleClass="aon-editTable-button aon-icon-cancel"
					value="" rendered="#{to==controllerAlias.to}"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:commandButton title="#{bundle.aon_remove}"
					actionListener="#{controllerAlias.onRemove}"
					rendered="#{to==controllerAlias.to}"
					styleClass="aon-editTable-button aon-icon-delete"
					value="" accesskey="#{bundle.aon_key_remove_line}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div>
					<f:verbatim rendered="#{!controllerAlias.new}">&#160;</f:verbatim>
					<aon:commandButton title="#{bundle.aon_save}"
						actionListener="#{controllerAlias.onAccept}"
						rendered="#{controllerAlias.new}" value=""
						styleClass="aon-editTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
						rendered="#{controllerAlias.new}"
						styleClass="aon-editTable-button aon-icon-cancel"
						value="" accesskey="#{bundle.aon_key_cancel_line}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</aon:editDataTable>
	
	<ui:include src="/facelet/shared/dataScroller.xhtml">
		<ui:param name="dataTable" value="#{dataTable}" />
		<ui:param name="model" value="#{controllerAlias.model}" />
		<ui:param name="showNote" value="#{false}" />
	</ui:include>

</ui:composition>
</body>
</html>
