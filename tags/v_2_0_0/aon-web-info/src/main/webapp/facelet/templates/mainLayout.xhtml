<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-components">
<f:view>
<c:forEach items="#{aonConfiguration.applicationBundleList}" var="appBundle">
	<f:loadBundle basename="#{appBundle.value}" var="#{appBundle.key}" />
</c:forEach>
<head>
	<title><ui:insert name="title">Title</ui:insert></title>
	<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
	<meta http-equiv="Expires" content="0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<link rel="stylesheet" type="text/css"
		href='#{facesContext.externalContext.requestContextPath}/xmlhttp/css/xp/xp.css' />

	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<link href="#{facesContext.externalContext.requestContextPath}#{styleSheet}" rel="stylesheet" type="text/css"></link>
	</c:forEach>
	<link rel="shortcut icon" type="image/x-icon" href="#{facesContext.externalContext.requestContextPath}/favicon.ico" />
	
	<script type='text/javascript'
		src="#{facesContext.externalContext.requestContextPath}/js/Utils.js">
		// nothing
	</script>
	<script type='text/javascript'
		src="#{facesContext.externalContext.requestContextPath}/js/Window.js">
		// nothing
	</script>
	<script type='text/javascript'
		src="#{facesContext.externalContext.requestContextPath}/js/Form.js">
		// nothing
	</script>
	<script type='text/javascript'
		src="#{facesContext.externalContext.requestContextPath}/fckfaces/FCKeditor/fckeditor.js">
		// nothing
	</script>
	<ui:insert name="head" />
</head>
<body class="aon-body" >
	<aon:div id="aon-content">		
		<ui:insert name="mainHeader" />
		<ui:include src="/facelet/homepage/messages.xhtml" />
		<ui:insert name="content" />	
	</aon:div>
</body>
</f:view>
</html>
