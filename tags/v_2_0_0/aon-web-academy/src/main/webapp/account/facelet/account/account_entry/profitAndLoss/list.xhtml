<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">

		<h:form id="profitAndLossList">
			<!-- start toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<h:commandButton id="search" value="#{bundle.aon_search}"
							accesskey="#{bundle.aon_key_search}" action="profit_and_loss_search"
							actionListener="#{accountSummaryReport.onEditSearch}"
							styleClass="aon-content-toolbar-item"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
						<t:commandButton id="profitAndLoss" value="#{accountBundle.aon_yearly_report}"
							forceId="#{true}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" />
						<t:commandButton id="profitAndLossMonthly" value="#{accountBundle.aon_monthly_report}"
							forceId="#{true}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" />
					</t:div>
				</t:div>
			</t:div>
			<!-- end toolbar navigation -->

			<!--  aon-region-body -->
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div>
						<t:dataTable forceId="#{true}"
							id="profitAndLossData1" value="#{accountSummaryReport.grossMarginSummaryCollection}" var="to"
							styleClass="aon-edit-table" headerClass="aon-edit-table-header"
							rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
							footerClass="aon-edit-table-footer"
							columnClasses="aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number,
								aon-table-body aon-table-body-number">

							<t:column width="100">
								<f:facet name="header">
									<h:outputText value="#{accountBundle.aon_account}" />
								</f:facet>
								<h:outputText value="#{to.account}" />
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{accountBundle.aon_description}" />
								</f:facet>
								<h:outputText value="#{to.description}" />
								<f:facet name="footer">
									<t:div style="text-align:right; font-weight:bold;">
										<h:outputText value="#{accountBundle.aon_gross_margin}" />
									</t:div>
								</f:facet>
							</t:column>

							<t:column width="90">
								<f:facet name="header">
									<h:outputText value="#{accountBundle.aon_debit_balance}" />
								</f:facet>
								<t:outputText value="#{to.difference}" rendered="#{to.account lt '7'}">
									<f:convertNumber pattern="#,##0.00" />
								</t:outputText>
								<f:facet name="footer">
									<t:div style="text-align:right; font-weight:bold; padding:2px 0.5em;">
										<t:outputText value="#{accountSummaryReport.grossMargin * (-1)}" 
											rendered="#{accountSummaryReport.grossMargin lt 0}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
									</t:div>
								</f:facet>
							</t:column>

							<t:column width="90">
								<f:facet name="header">
									<h:outputText value="#{accountBundle.aon_credit_balance}" />
								</f:facet>
								<t:outputText value="#{to.difference}" rendered="#{to.account ge '7'}">
									<f:convertNumber pattern="#,##0.00" />
								</t:outputText>
								<f:facet name="footer">
									<t:div style="text-align:right; font-weight:bold; padding:2px 0.5em;">
										<t:outputText value="#{accountSummaryReport.grossMargin}" 
											rendered="#{accountSummaryReport.grossMargin gt 0}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
									</t:div>
								</f:facet>
							</t:column>
						</t:dataTable>

						<t:dataTable forceId="#{true}"
							id="profitAndLossData2" value="#{accountSummaryReport.totalExpensesSummaryCollection}" var="to"
							styleClass="aon-edit-table" headerClass="aon-edit-table-header"
							rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
							footerClass="aon-edit-table-footer"
							columnClasses="aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number,
								aon-table-body aon-table-body-number">

							<t:column width="100">
								<h:outputText value="#{to.account}" />
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</t:column>

							<t:column>
								<h:outputText value="#{to.description}" />
								<f:facet name="footer">
									<h:panelGrid columns="1" width="100%">
										<t:div style="text-align:right; font-weight:bold;">
											<h:outputText value="#{accountBundle.aon_total_expenses}" />
										</t:div>
										<t:div style="text-align:right; font-weight:bold;">
											<h:outputText value="#{accountBundle.aon_total_result}" />
											<h:outputText value=" ( #{accountBundle.aon_total_result_profit} )" 
												rendered="#{accountSummaryReport.totalResult gt 0}"/>
											<h:outputText value=" ( #{accountBundle.aon_total_result_loss} )" 
												rendered="#{accountSummaryReport.totalResult lt 0}"/>
											<h:outputText value=" ( #{accountBundle.aon_total_result_null} )" 
												rendered="#{accountSummaryReport.totalResult == 0}"/>
										</t:div>
									</h:panelGrid>
								</f:facet>
							</t:column>

							<t:column width="90">
								<t:outputText value="#{to.difference}" rendered="#{to.account lt '7'}">
									<f:convertNumber pattern="#,##0.00" />
								</t:outputText>
								<f:facet name="footer">
									<h:panelGrid columns="1" width="100%">
										<t:div style="text-align:right; font-weight:bold; padding:2px 0.5em;">
											<t:outputText value="#{accountSummaryReport.totalExpenses}" 
												rendered="#{accountSummaryReport.totalExpenses gt 0}">
												<f:convertNumber pattern="#,##0.00" />
											</t:outputText>
											<f:verbatim rendered="#{accountSummaryReport.totalExpenses le 0}">&#160;</f:verbatim>
										</t:div>
										<t:div style="text-align:right; font-weight:bold; padding:2px 0.5em;">
											<t:outputText value="#{accountSummaryReport.totalResult * (-1)}" 
												rendered="#{accountSummaryReport.totalResult lt 0}">
												<f:convertNumber pattern="#,##0.00" />
											</t:outputText>
										</t:div>
									</h:panelGrid>
								</f:facet>
							</t:column>

							<t:column width="90">
								<t:outputText value="#{to.difference}" rendered="#{to.account ge '7'}">
									<f:convertNumber pattern="#,##0.00" />
								</t:outputText>
								<f:facet name="footer">
									<h:panelGrid columns="1" width="100%">
										<t:div style="text-align:right; font-weight:bold; padding:2px 0.5em;">
											<t:outputText value="#{accountSummaryReport.totalExpenses * (-1)}" 
												rendered="#{accountSummaryReport.totalExpenses lt 0}">
												<f:convertNumber pattern="#,##0.00" />
											</t:outputText>
											<f:verbatim rendered="#{accountSummaryReport.totalExpenses ge 0}">&#160;</f:verbatim>
										</t:div>
										<t:div style="text-align:right; font-weight:bold; padding:2px 0.5em;">
											<t:outputText value="#{accountSummaryReport.totalResult}" 
												rendered="#{accountSummaryReport.totalResult gt 0}">
												<f:convertNumber pattern="#,##0.00" />
											</t:outputText>
										</t:div>
									</h:panelGrid>
								</f:facet>
							</t:column>
						</t:dataTable>
					</t:div>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
