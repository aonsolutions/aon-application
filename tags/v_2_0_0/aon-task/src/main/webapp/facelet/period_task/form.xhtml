<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="periodTaskForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{menuBundle.aon_master}" />
					<aon:outputText value="#{menuBundle.aon_period_task}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:confirmButton id="save" value="#{bundle.aon_save}"
							rendered="#{periodTask.to!=null or periodTask.new}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{periodTask.accept}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{periodTask.to!=null or periodTask.new}"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{periodTask.onCancel}"
							confirmAction="period_task_list"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!periodTask.new}"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{periodTask.onRemove}"
							confirmAction="period_task_list"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="period_task_search"
							actionListener="#{periodTask.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{periodTask.onReset}"
							rendered="#{!periodTask.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">


					<aon:div styleClass="aon-content-subtitle"
						id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{periodTask.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>
					
					<aon:panelGrid columns="1" dir="true" cellpadding="0" cellspacing="0" >
					
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title">
								<aon:outputText value="#{projectBundle.period_task_recurrence}" />
							</aon:div>
						
								<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
									cellpadding="0" cellspacing="0" border="0" style="width:95%;"
									columnClasses="aon-formTable-column-odd aon-text-nowrap aon-vertical-align-middle,aon-formTable-column-even aon-text-nowrap aon-vertical-align-middle">
	
									<aon:outputLabel for="PeriodicalTask_startDate"
										value="#{projectBundle.period_task_initial_date}" />
									<aon:selectInputDate id="PeriodicalTask_startDate" 
										 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 value="#{periodTask.to.startDate}" renderAsPopup="true"
										 popupDateFormat="#{bundle.aon_date_pattern}"
										 rendered="#{periodTask.new}">
									</aon:selectInputDate>
									<aon:outputText value="#{periodTask.to.startDate}" rendered="#{!periodTask.new}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}"/>
									</aon:outputText>		
									
									<aon:outputLabel for="PeriodicalTask_endDate"
										value="#{projectBundle.period_task_end_date}" />
									<aon:selectInputDate id="PeriodicalTask_endDate" 
										 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 popupDateFormat="#{bundle.aon_date_pattern}"
										 value="#{periodTask.to.endDate}" renderAsPopup="true">
									</aon:selectInputDate>
									
									<aon:outputLabel for="PeriodicalTask_nextDate" rendered="#{!periodTask.new}"
										value="#{projectBundle.period_task_next_date}" />
									<aon:selectInputDate id="PeriodicalTask_nextDate" 
										 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 value="#{periodTask.to.nextDate}" renderAsPopup="true"
										 popupDateFormat="#{bundle.aon_date_pattern}"
										 rendered="#{!periodTask.new}">
									</aon:selectInputDate>
	
									<aon:outputLabel for="PeriodicalTask_quantity"
										value="#{projectBundle.period_task_frequency}" />
									<aon:div>	
										<aon:inputText id="PeriodicalTask_quantity"
											styleClass="aon-inputText" required="true" size="5"
											maxlength="2" value="#{periodTask.to.quantity}" />
										<aon:selectOneMenu id="PeriodicalTask_priority"
											value="#{periodTask.to.period}">
											<f:selectItems value="#{projectCollections.taskPeriods}" />
										</aon:selectOneMenu>								
									</aon:div>
								
								</aon:panelGrid>
							
						</aon:div>

						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title">
								<aon:outputText value="#{projectBundle.task_task}" />
							</aon:div>
	
							<aon:panelGrid columns="2">
								<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
									cellpadding="0" cellspacing="0"
									columnClasses="aon-formTable-column-odd aon-text-nowrap ,aon-formTable-column-even aon-text-nowrap ">
	
									<aon:outputLabel for="Task_descripcion"
										value="#{projectBundle.aon_description}" />
									<aon:inputText id="Task_descripcion"
										styleClass="aon-inputText" required="true" size="60"
										maxlength="50" value="#{periodTask.to.task.description}" />
	
									<aon:outputLabel for="Task_startDate"
										value="#{projectBundle.aon_initial_date}" />
									<aon:selectInputDate id="Task_startDate" styleClass="aon-calendar-"
										 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 value="#{periodTask.to.task.startDate}" renderAsPopup="true"
										 popupDateFormat="#{bundle.aon_date_pattern}"
										 disabled="#{!periodTask.new}">
									</aon:selectInputDate>
									
									<aon:outputLabel for="Task_dueDate"
										value="#{projectBundle.aon_due_date}" />
									<aon:selectInputDate id="Task_dueDate" styleClass="aon-calendar-"
										 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
										 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
										 value="#{periodTask.to.task.dueDate}" renderAsPopup="true"
										 popupDateFormat="#{bundle.aon_date_pattern}"
										 disabled="#{!periodTask.new}">
									</aon:selectInputDate>
	
									<aon:outputLabel for="Task_priority"
										value="#{projectBundle.task_priority}" />
									<aon:selectOneMenu id="Task_priority"
										value="#{periodTask.to.task.priority}"
										disabled="#{!periodTask.new}">
										<f:selectItems value="#{projectCollections.taskPriorities}" />
									</aon:selectOneMenu>
	
									<aon:outputLabel for="Task_workgroup"
										value="#{projectBundle.aon_work_group}" />
									<aon:selectOneMenu id="Task_workgroup"
										value="#{periodTask.to.task.workGroup.id}" required="#{true}">
										<f:selectItems value="#{configCollections.workgroups}" />
									</aon:selectOneMenu>
	 
									<aon:outputLabel for="Task_customer_id"
										styleClass="aon-form-input-text-label"
										value="#{projectBundle.aon_customer}" />
									<aon:div styleClass="aon-nowrap" rendered="#{periodTask.new}">
										<aon:lookupInputText id="Task_customer_id"
											lookup="#{customerLookup}"
											valueChangeListener="#{periodTask.customerChange}"
											value="#{periodTask.to.task.dossier.customer.id}" size="5">
										</aon:lookupInputText>
										<aon:lookupButton lookup="#{customerLookup}"
											property="#{periodTask.to.task.dossier.customer}"
											windowTitle="#{projectBundle.aon_customer}"
											styleClass="aon-lookup-button aon-icon-lookup" />
										<aon:inputText id="Task_customer_name"
											styleClass="aon-inputText-disabled"
											value="#{periodTask.to.task.dossier.customer.registry.name}"
											size="45" disabled="true" />
									</aon:div>
									<aon:inputText id="Task_customer"
										value="#{periodTask.to.task.dossier.customer.registry.name} #{periodTask.to.task.dossier.customer.registry.surname}"
										styleClass="aon-inputText" size="60" disabled="#{true}"
										rendered="#{!periodTask.new and periodTask.to.task.dossier.id != null}" />
	
									<aon:outputLabel for="Task_dossier_id"
										value="#{projectBundle.dossier_dossier}"/>
									<aon:selectOneMenu id="Task_dossier_id" rendered="#{periodTask.new}"
										value="#{periodTask.to.task.dossier.id}" partialSubmit="true"
										valueChangeListener="#{periodTask.dossierChange}">
										<f:selectItems value="#{periodTask.dossiers}" />
									</aon:selectOneMenu>
									<aon:inputText id="Task_dossier"
										value="#{periodTask.to.task.dossier.number}"
										styleClass="aon-inputText" size="60" disabled="#{true}"
										rendered="#{!periodTask.new and periodTask.to.task.dossier.id != null}" />
	
									<aon:outputLabel for="Task_activity_id"
										value="#{projectBundle.activity_activity}" />
									<aon:selectOneMenu id="Task_activity_id" rendered="#{periodTask.new}"
										value="#{periodTask.to.task.activity.id}">
										<f:selectItems value="#{periodTask.activities}" />
									</aon:selectOneMenu>
									<aon:inputText id="Task_activity"
										value="#{periodTask.to.task.activity.activityType.description}"
										styleClass="aon-inputText" size="60" disabled="#{true}"
										rendered="#{!periodTask.new and periodTask.to.task.activity.id != null}" />
									
									<aon:outputLabel for="Task_comments"
										value="#{projectBundle.aon_comments}"/>
									<aon:inputTextarea id="Task_comments"
										value="#{periodTask.to.task.comments}" cols="60" rows="5" />		
	 
								</aon:panelGrid>
							</aon:panelGrid>
						</aon:div>
					</aon:panelGrid>
				
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
