<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="taskForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{menuBundle.aon_master}" />
					<aon:outputText value="#{menuBundle.aon_task}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:confirmButton id="save" value="#{bundle.aon_save}"
							rendered="#{task.to!=null or task.new}"
							disabled="#{task.finished or task.deleted}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{task.accept}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{task.to!=null or task.new}"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{task.onCancel}"
							confirmAction="task_list"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!task.new}"
							disabled="#{task.sourceCampaign or task.finished or task.deleted}"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{task.onRemove}"
							confirmAction="task_list"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="task_search"
							actionListener="#{task.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{task.onReset}" rendered="#{!task.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="assumeTask" value="#{projectBundle.task_assume}"
							actionListener="#{task.onAssumeTask}"
							styleClass="aon-content-toolbar-item"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'"
							onmouseout="this.className='aon-content-toolbar-item'"
							rendered="#{!task.new and task.to.user.id == null}" />
						<aon:commandButton id="startTask" value="#{projectBundle.task_start}"
							actionListener="#{task.onStartTask}"
							styleClass="aon-content-toolbar-item"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'"
							onmouseout="this.className='aon-content-toolbar-item'"
							rendered="#{task.myTask and task.pending}" />
						<aon:commandButton id="stopTask" value="#{projectBundle.task_stop}"
							actionListener="#{task.onStopTask}"
							styleClass="aon-content-toolbar-item"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'"
							onmouseout="this.className='aon-content-toolbar-item'"
							rendered="#{task.myTask and task.inProgress}" />
						<aon:commandButton id="releaseTask" value="#{projectBundle.task_release}"
							actionListener="#{task.onReleaseTask}"
							styleClass="aon-content-toolbar-item"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'"
							onmouseout="this.className='aon-content-toolbar-item'"
							rendered="#{task.myTask and !task.finished and !task.deleted}" />
						<aon:commandButton id="finishTask" value="#{projectBundle.task_finish}"
							actionListener="#{task.onFinishTask}"
							styleClass="aon-content-toolbar-item"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'"
							onmouseout="this.className='aon-content-toolbar-item'"
							rendered="#{!task.new and !task.finished and !task.deleted}" />
						<aon:commandButton id="reopenTask" value="#{projectBundle.task_reopen}"
							actionListener="#{task.onReopenTask}"
							styleClass="aon-content-toolbar-item"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'"
							onmouseout="this.className='aon-content-toolbar-item'"
							rendered="#{task.myTask and !task.sourceCampaign and task.finished}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">


					<aon:div styleClass="aon-content-subTitle">
							<aon:outputText
								value="#{task.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

			
						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							cellpadding="0" cellspacing="0"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

							<aon:outputLabel for="Task_descripcion"
								value="#{projectBundle.aon_description}" />
							<aon:inputText id="Task_descripcion"
								styleClass="aon-inputText" required="true" size="60"
								maxlength="50" value="#{task.to.description}" 
								disabled="#{!task.new}"/>

							<aon:outputLabel for="Task_startDate"
								value="#{projectBundle.aon_initial_date}" />
							<aon:selectInputDate id="Task_startDate" styleClass="aon-calendar-"
								 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{task.to.startDate}" renderAsPopup="true"
								 popupDateFormat="#{bundle.aon_date_pattern}"
								 disabled="#{!task.new}">
							</aon:selectInputDate>
							
							<aon:outputLabel for="Task_endDate"
								value="#{projectBundle.aon_final_date}" 
								rendered="#{task.finished or task.deleted}"/>
							<aon:selectInputDate id="Task_endDate" styleClass="aon-calendar-"
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{task.to.endDate}" renderAsPopup="true"
								 popupDateFormat="#{bundle.aon_date_pattern}"
								 disabled="#{true}" rendered="#{task.finished or task.deleted}">
							</aon:selectInputDate>

							<aon:outputLabel for="Task_dueDate"
								value="#{projectBundle.aon_due_date}" />
							<aon:selectInputDate id="Task_dueDate" styleClass="aon-calendar-"
								 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{task.to.dueDate}" renderAsPopup="true"
								 popupDateFormat="#{bundle.aon_date_pattern}"
								 disabled="#{!task.new}">
							</aon:selectInputDate>

							<aon:outputLabel for="Task_priority"
								value="#{projectBundle.task_priority}" />
							<aon:selectOneMenu id="Task_priority" value="#{task.to.priority}" 
								disabled="#{!task.new}">
								<f:selectItems value="#{projectCollections.taskPriorities}" />
							</aon:selectOneMenu>
							
							<aon:outputLabel for="Task_percent"
								value="#{projectBundle.task_percent}" 
								rendered="#{!task.new}"/>
							<aon:inputText id="Task_percent"
								styleClass="aon-inputText" required="true" size="5"
								maxlength="3" value="#{task.to.percent}" 
								disabled="#{task.finished or task.deleted}" rendered="#{!task.new}" />

							<aon:outputLabel for="Task_status"
								value="#{projectBundle.aon_status}" 
								rendered="#{!task.new}"/>
							<aon:selectOneMenu id="Task_status" value="#{task.to.status}" 
								disabled="#{true}" rendered="#{!task.new}">
								<f:selectItems value="#{projectCollections.taskStatus}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="Task_workgroup"
								value="#{projectBundle.aon_work_group}" 
								rendered="#{task.new}"/>
							<aon:selectOneMenu id="Task_workgroup" value="#{task.to.workGroup.id}"
								rendered="#{task.new}" 
								partialSubmit="true"
								valueChangeListener="#{task.workGroupChange}">
								<f:selectItems value="#{configCollections.workgroups}" />
							</aon:selectOneMenu>
							
							<aon:outputLabel for="Task_user"
								value="#{projectBundle.task_assigned}" 
								rendered="#{task.new}"/>
							<aon:selectOneMenu id="Task_user" value="#{task.to.user.id}"
								rendered="#{task.new}" >
								<f:selectItems value="#{task.users}" />
							</aon:selectOneMenu>
							
							<aon:outputLabel for="Task_customer_id"
								styleClass="aon-form-input-text-label"
								value="#{projectBundle.aon_customer}" />
							<aon:div styleClass="aon-nowrap" rendered="#{task.new}">	
								<aon:lookupInputText id="Task_customer_id" lookup="#{customerLookup}"
									valueChangeListener="#{task.customerChange}"
									value="#{task.to.dossier.customer.id}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton lookup="#{customerLookup}" 
									property="#{task.to.dossier.customer}"
									windowTitle="#{projectBundle.aon_customer}" 
									styleClass="aon-lookup-button aon-icon-lookup" />
								<aon:inputText id="Task_customer_name"
									styleClass="aon-inputText-disabled"
									value="#{task.to.dossier.customer.registry.name} #{task.to.dossier.customer.registry.surname}" size="45"
									disabled="true" />
							</aon:div>							
							<aon:inputText id="Task_customer"
								value="#{task.to.dossier.customer.registry.name} #{task.to.dossier.customer.registry.surname}"
								styleClass="aon-inputText" size="60"
								disabled="#{true}" rendered="#{!task.new and task.to.dossier.id != null}" />
							
							<aon:outputLabel for="Task_dossier_id"
								value="#{projectBundle.dossier_dossier}" 
								rendered="#{task.new or task.to.dossier.id != null}"/>
							<aon:selectOneMenu id="Task_dossier_id" value="#{task.to.dossier.id}"
								partialSubmit="true" rendered="#{task.new}" 
								valueChangeListener="#{task.dossierChange}">
								<f:selectItems value="#{task.dossiers}" />
							</aon:selectOneMenu>
							<aon:inputText id="Task_dossier"
								value="#{task.to.dossier.number}"
								styleClass="aon-inputText" size="60"
								disabled="#{true}" rendered="#{!task.new and task.to.dossier.id != null}" />
							
							<aon:outputLabel for="Task_activity_id"
								value="#{projectBundle.activity_activity}" 
								rendered="#{task.new or task.to.activity.id != null}"/>
							<aon:selectOneMenu id="Task_activity_id" value="#{task.to.activity.id}"
								rendered="#{task.new}">
								<f:selectItems value="#{task.activities}" />
							</aon:selectOneMenu>
							<aon:inputText id="Task_activity"
								value="#{task.to.activity.activityType.description}"
								styleClass="aon-inputText" size="60"
								disabled="#{true}" rendered="#{!task.new and task.to.activity.id != null}" />

							<aon:outputLabel for="Task_sender"
								value="#{projectBundle.task_sender}" 
								rendered="#{task.sourceAssigned}"/>
							<aon:inputText id="Task_sender"
								styleClass="aon-inputText" size="60"
								value="#{task.to.sender.name}"
								rendered="#{task.sourceAssigned}"
								maxlength="50" disabled="#{true}"/>
								
							<aon:outputLabel for="Task_comments"
								value="#{projectBundle.aon_comments}"/>
							<aon:inputTextarea id="Task_comments"
								value="#{task.to.comments}" cols="60" rows="5"
								disabled="#{task.finished or task.deleted}" />		

						</aon:panelGrid>
				
				
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
