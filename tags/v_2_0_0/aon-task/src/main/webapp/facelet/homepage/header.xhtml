<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition>

	<aon:div id="aon-header" styleClass="aon-desktop-header">
		<aon:div styleClass="aon-connection-status"><aon:outputConnectionStatus styleClass="aon-connection-control"/></aon:div>
		<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%"
			dir="true">
			<aon:panelGroup>
				<aon:div styleClass="aon-logo">
					<h:graphicImage
						url="#{aonConfiguration.applicationLogoContextRelativePath}"
						alt="#{appBundle.aon_application_title}" />
				</aon:div>
				<aon:div styleClass="aon-applicationName">
					<aon:outputText value="#{appBundle.aon_application_title}" />
				</aon:div>
			</aon:panelGroup>

			<aon:panelGroup>
				<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%"
					>

					<aon:panelGroup 
						rendered="#{aonConfiguration.properties.middleHeader == null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<aon:outputText value="&#160;"/>
						</aon:div>
					</aon:panelGroup>

					<aon:panelGroup
						rendered="#{aonConfiguration.properties.middleHeader != null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<aon:outputText escape="false"
								value="#{aonConfiguration.properties.middleHeader}" />
						</aon:div>
					</aon:panelGroup>
					
					<aon:div style="text-align:right;">
						<aon:div styleClass="aon-desktop-header-tab" style="height:30px;">								
							<aon:outputText value="&#160;" />
						</aon:div>
					</aon:div>
					
				</aon:panelGrid>
			</aon:panelGroup>
		</aon:panelGrid>

	</aon:div>

</ui:composition>

</body>
</html>
