<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition>
	<aon:div id="aon-main-menu">
		<aon:panelGroup>
			<!-- main menu declaration  -->
			<aon:form>
				<aon:menuBar id="menu"
					imageDir="#{facesContext.externalContext.requestContextPath}/xmlhttp/css/xp/css-images/">
					<aon:menuItem id="auxiliary" value="#{menuBundle.aon_auxiliary}" >
						<aon:menuItem id="dossier_type" styleClass="aon-main-menu-leaf"
							action="dossier_type_list" value="#{menuBundle.aon_dossier_type}"/>
					</aon:menuItem>	
					<aon:menuItem id="master" value="#{menuBundle.aon_master}" >
						<aon:menuItem id="customer" styleClass="aon-main-menu-leaf"
							actionListener="#{customer.onReset}"
							action="customer" value="#{menuBundle.aon_customer}"/>
						<aon:menuItem id="task" styleClass="aon-main-menu-leaf"
							actionListener="#{task.onTaskInbox}"
							action="task" value="#{menuBundle.aon_task}"/>
						<aon:menuItem id="task_monitor" styleClass="aon-main-menu-leaf"
							actionListener="#{taskMonitor.onEditSearch}"
							action="task_monitor" value="#{menuBundle.aon_task_monitor}"/>
						<aon:menuItem id="period_task" styleClass="aon-main-menu-leaf"
							actionListener="#{periodTask.onReset}"
							action="period_task" value="#{menuBundle.aon_period_task}"/>
					</aon:menuItem>
				</aon:menuBar>
			</aon:form>
		</aon:panelGroup>
	</aon:div>
</ui:composition>

</body>
</html>
