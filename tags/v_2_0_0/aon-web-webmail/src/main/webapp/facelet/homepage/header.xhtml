<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>
	
	<aon:div id="aon-header" styleClass="aon-desktop-header">
		<aon:div styleClass="aon-connection-status"><aon:outputConnectionStatus styleClass="aon-connection-control"/></aon:div>
		<aon:panelGrid columns="3" cellpadding="0" cellspacing="0" width="100%" dir="true">
			
			<aon:panelGroup>
				<aon:div styleClass="aon-logo">
					<aon:graphicImage url="#{aonConfiguration.applicationLogoContextRelativePath}"/>
				</aon:div>
				<aon:div styleClass="aon-applicationName">
					<aon:outputText value="#{appBundle.aon_application_title}" />
				</aon:div>
			</aon:panelGroup>

			<aon:panelGroup>
				
				<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%">
					<aon:panelGroup rendered="#{aonConfiguration.properties.middleHeader == null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<aon:outputText value="&#160;"/>
						</aon:div>
					</aon:panelGroup>

					<aon:panelGroup
						rendered="#{aonConfiguration.properties.middleHeader != null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<aon:outputText escape="false" value="#{aonConfiguration.properties.middleHeader}" />
						</aon:div>
					</aon:panelGroup>
					<aon:div style="text-align:right;">
						<aon:div styleClass="aon-desktop-header-tab">
								
								<aon:panelGrid columns="4" cellpadding="5" cellspacing="0">
									<aon:div style="white-space:nowrap;"><aon:outputText value="#{webmail.companyName}" /></aon:div>
									<aon:div style="white-space:nowrap;" rendered="#{login.logged}"><aon:outputText value="/" /></aon:div>
									<aon:div style="white-space:nowrap;" rendered="#{login.logged}"><aon:outputText value="#{webmail.loggedUserName}" /></aon:div>
								</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:panelGrid>
			</aon:panelGroup>
		</aon:panelGrid>

		<aon:div styleClass="aon-header-bar">
			<aon:panelGrid columns="2" cellpadding="2" cellspacing="0" width="100%">
				<aon:div style="padding-left:1em;">
					<aon:outputText value="#{webmail.currentDate}" />
				</aon:div>
				<aon:div style="text-align:right">
					<ice:outputLink style="padding-right:1em;font-weight:bold;" 
						onclick="parent.window.close();" target="_top">
						<aon:outputText value="#{appBundle.aon_webmail_close}"/>
					</ice:outputLink>
				</aon:div>
			</aon:panelGrid>
		</aon:div>
	</aon:div>
	
</ui:composition>

</body>
</html>
