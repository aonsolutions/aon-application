<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="signatureList">

			<aon:div >
				<aon:div >

					<ui:include src="/webmail/facelet/webmailButtons.xhtml" />	

					<aon:panelGrid columns="2" cellpadding="0" cellspacing="0"
					columnClasses="aon-menu-sidebar,aon-content-area" style="width:100%;">
					
						<ui:include src="/webmail/facelet/webmailTree.xhtml" />	

				        <aon:panelGroup>
							<aon:div styleClass="aon-section-title">
								<aon:outputText value="#{appBundle.aon_webmail_signature}" />
							</aon:div>
							
							<aon:div styleClass="aon-section-toolbar">
								<aon:commandButton id="reset" value="#{bundle.aon_reset}"
									action="signature_form" actionListener="#{signature.onReset}"
									styleClass="aon-content-toolbar-item aon-icon-newSignature"

									accesskey="#{bundle.aon_key_new}"/>
							</aon:div>


			<!-- end toolbar navigation -->

			<!--  aon-region-body -->
		<aon:div>
			<aon:div>

					
					<aon:dataTable id="signatureDataList" 
						value="#{signature.model}" var="to" rows="20"
						styleClass="aon-dataTable">
					
							<aon:column>
								<aon:rowSelector selectionListener="#{signature.onSelect}" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_webmail_signature_name}" />
								</f:facet>
								<aon:outputText value="#{to.name}"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_webmail_signature_active}" />
								</f:facet>
								<aon:outputText value="#{to.active} " />
							</aon:column>

						</aon:dataTable>
						
						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="signatureDataList" />
							<ui:param name="model" value="#{signature.model}" />
							<ui:param name="showNote" value="#{false}" />
						</ui:include>
						
					
				</aon:div>
			</aon:div>
							
				        </aon:panelGroup>

					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
