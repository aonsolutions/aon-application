<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="accAppParamsForm" styleClass="aon-form">

			<!-- start toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">

						<h:commandButton id="save" value="#{bundle.aon_save}"
							accesskey="#{bundle.aon_key_save}"
							actionListener="#{accAppParams.onAccept}"
							styleClass="aon-content-toolbar-item"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
					</t:div>
				</t:div>
			</t:div>
			<!-- end toolbar navigation -->

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<!-- start of bag panel -->
					<!-- start of grid layout -->
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						
						<h:outputLabel for="ACC_default_sales_account"
							value="#{accountBundle.default_sales_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_sales_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_SALES_ACC'].value}">
							<f:selectItems value="#{accountCollections.salesAccounts}" />
						</h:selectOneMenu>
						
						<h:outputLabel for="ACC_default_purchase_account"
							value="#{accountBundle.default_purchase_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_purchase_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_PURCHASE_ACC'].value}">
							<f:selectItems value="#{accountCollections.purchaseAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_charged_vat_account"
							value="#{accountBundle.default_charged_vat_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_charged_vat_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_CHARGED_VAT_ACC'].value}">
							<f:selectItems value="#{accountCollections.chargedVatAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_paid_vat_account"
							value="#{accountBundle.default_paid_vat_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_paid_vat_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_PAID_VAT_ACC'].value}">
							<f:selectItems value="#{accountCollections.paidVatAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_paid_retention_account"
							value="#{accountBundle.default_paid_retention_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_paid_retention_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_PAID_RET_ACC'].value}">
							<f:selectItems value="#{accountCollections.paidRetentionAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_charged_retention_account"
							value="#{accountBundle.default_charged_retention_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_charged_retention_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_CHARGED_RET_ACC'].value}">
							<f:selectItems value="#{accountCollections.chargedRetentionAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_salary_account"
							value="#{accountBundle.default_salary_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_salary_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_SALARY_ACC'].value}">
							<f:selectItems value="#{accountCollections.salaryAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_pending_salary_account"
							value="#{accountBundle.default_pending_salary_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_pending_salary_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_PENDING_SALARY_ACC'].value}">
							<f:selectItems value="#{accountCollections.pendingSalaryAccounts}" />
						</h:selectOneMenu>

						<h:outputLabel for="ACC_default_social_insurance_account"
							value="#{accountBundle.default_social_insurance_account}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="ACC_default_social_insurance_account"
							styleClass="aon-form-selectOneMenu-field"
							value="#{accAppParams.parameters['ACC_DEFAULT_SOCIAL_INSURANCE_ACC'].value}">
							<f:selectItems value="#{accountCollections.socialInsuranceAccounts}" />
						</h:selectOneMenu>

					</h:panelGrid>
					<!-- end of grid layout -->
					<!-- end of bag panel -->
					
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
