<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<script type="text/javascript">
			window.onload = function()
			{
				document.getElementById("Task_description").focus();
			}
		</script>	
	</ui:define>

	<ui:define name="content">
		<h:form id="taskMonitorForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<h:commandButton id="search" value="#{bundle.aon_search}"
						actionListener="#{taskMonitor.onSearch}" action="task_monitor_list" 
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-accept"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-accept'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-accept'" 
						accesskey="#{bundle.aon_key_search}"/>
				</t:div>
				</t:div>
			</t:div>
			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal" >
					<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="Task_description" value="#{projectBundle.aon_description}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Task_description" size="60"
							valueChangeListener="#{taskMonitor.addExpression}"
							styleClass="aon-form-input-text" />

						<h:outputLabel value="#{projectBundle.aon_initial_date}"
							styleClass="aon-form-input-text-label" />
						<h:panelGrid columns="4">
							<h:outputLabel for="Task_startDate-From" value="#{projectBundle.aon_date_from}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Task_startDate-From" size="10"
								valueChangeListener="#{taskMonitor.addStartDateFromExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />

							<h:outputLabel for="Task_startDate-To" value="#{projectBundle.aon_date_to}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Task_startDate-To" size="10"
								valueChangeListener="#{taskMonitor.addStartDateToExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
						</h:panelGrid>

						<h:outputLabel value="#{projectBundle.aon_final_date}"
							styleClass="aon-form-input-text-label" />
						<h:panelGrid columns="4">
							<h:outputLabel for="Task_endDate-From" value="#{projectBundle.aon_date_from}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Task_endDate-From" size="10"
								valueChangeListener="#{taskMonitor.addEndDateFromExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />

							<h:outputLabel for="Task_endDate-To" value="#{projectBundle.aon_date_to}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Task_endDate-To" size="10"
								valueChangeListener="#{taskMonitor.addEndDateToExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
						</h:panelGrid>

						<h:outputLabel value="#{projectBundle.aon_due_date}"
							styleClass="aon-form-input-text-label" />
						<h:panelGrid columns="4">
							<h:outputLabel for="Task_dueDate-From" value="#{projectBundle.aon_date_from}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Task_dueDate-From" size="10"
								valueChangeListener="#{taskMonitor.addDueDateFromExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />

							<h:outputLabel for="Task_dueDate-To" value="#{projectBundle.aon_date_to}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Task_dueDate-To" size="10"
								valueChangeListener="#{taskMonitor.addDueDateToExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
						</h:panelGrid>

						<t:outputLabel for="Customer_Lookup_id" value="#{customerBundle.customer_customer}" 
							styleClass="aon-form-input-text-label" />
						<t:div>
							<t:inputText id="Customer_Lookup_id" forceId="#{true}"
								styleClass="aon-form-input-text" size="5" 
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"
								valueChangeListener="#{taskMonitor.addCustomerExpression}" />
							<h:commandButton id="find_Customer_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />	
							<t:inputText id="Customer_full_name"
								disabled="true" forceId="#{true}"
								styleClass="aon-form-input-text-disabled" size="40" />
						</t:div>

						<t:outputLabel for="Task_user_id" value="#{registryBundle.aon_user}" 
							styleClass="aon-form-input-text-label" />
						<h:selectOneMenu id="Task_user_id" forceId="#{true}"
							valueChangeListener="#{taskMonitor.addExpression}"
							converter="IntegerEmptyConverter"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{registryCollections.users}" />
						</h:selectOneMenu>
						
						<h:outputLabel for="Task_activity_activityType_id" value="#{projectBundle.aon_status}"
							styleClass="aon-form-input-text-label" />
						<h:selectOneMenu id="Task_activity_activityType_id" forceId="#{true}"
							valueChangeListener="#{taskMonitor.addDirectExpression}"
							styleClass="aon-form-selectOneMenu-field"
							converter="IntegerEmptyConverter">
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{projectCollections.activityTypes}" />
						</h:selectOneMenu>						
						
						<h:outputLabel for="Task_status" value="#{projectBundle.aon_status}"
							styleClass="aon-form-input-text-label" />
						<h:selectOneMenu id="Task_status" forceId="#{true}"
							valueChangeListener="#{taskMonitor.addStatusExpression}"
							styleClass="aon-form-selectOneMenu-field"
							converter="aonTaskStatusConverter">
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{projectCollections.taskStatus}" />
						</h:selectOneMenu>
						

					</h:panelGrid>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
