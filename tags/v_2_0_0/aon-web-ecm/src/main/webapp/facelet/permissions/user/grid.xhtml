<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">
		<aon:div styleClass="aon-scroll-area" style="padding-top:0;">		
			<aon:div styleClass="aon-section-title" style="padding-top:0;">
				<h:outputText value="#{menuBundle.aon_users}" />
			</aon:div>	
			
			<aon:form id="adminForm">
	
				<aon:editDataTable id="userData" var="to" rows="20" 
						value="#{manager.users.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
			
					<aon:rowSelector toggleOnClick="#{manager.users.selected == null}"
						actionListener="#{manager.users.onSelect}" />
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" />
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_login_user}" />
						</f:facet>
						<aon:outputText value="#{to.login}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_cdr_roles}" />
						</f:facet>
						<aon:outputText value="#{to.roles}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_permission_accesslevel}" />
						</f:facet>
						<aon:selectOneMenu value="#{to.level}" disabled="#{to!=manager.users.selected}">
							<f:selectItems value="#{manager.users.accessLevels}"/>
						</aon:selectOneMenu>						
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div>
							<f:verbatim rendered="#{to!=manager.users.selected}">&#160;</f:verbatim>
							<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
								rendered="#{to==manager.users.selected}"
								styleClass="aon-editDataTable-button aon-icon-accept"
								actionListener="#{manager.users.onAccept}"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								rendered="#{to==manager.users.selected}"
								actionListener="#{manager.users.onCancel}" immediate="true"
								accesskey="#{bundle.aon_key_cancel_line}" />
							<aon:confirmButton id="remove-Scope" title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								rendered="#{to==manager.users.selected}"
								confirmTitle="#{bundle.aon_confirm_title}" 
								confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{manager.users.onRemove}" immediate="true"
								accesskey="#{bundle.aon_key_remove_line}" />								
						</aon:div>
					</aon:column>
				</aon:editDataTable>
			</aon:form>
		</aon:div>
	</ui:define>

</ui:composition>
</body>
</html>
