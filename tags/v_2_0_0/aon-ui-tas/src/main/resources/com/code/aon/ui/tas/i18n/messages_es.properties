aon_footer_text_1=El vehículo queda en depósito en
aon_footer_text_2=, quien no se hace responsable de los objetos depositados en el vehículo. 
aon_footer_text_3=Acepto la realización del presupuesto y el desmontaje de los elementos y conjuntos necesarios para ello.
aon_footer_text_4=Acepto la realización de la reparación sin confección de presupuesto y autorizo a sus empleados a conducir el vehículo de mi propiedad arriba consignado, por las calles o carreteras para efectuar las pruebas que estimen necesarias. Los trabajos se abonarán al contado (a la entrega del vehículo). Esta reparación tiene tres meses de garantía o 2.000 Kms., a partir de la fecha de entrega. Las averías o defectos ocultos que eventualmente puedan aparecer durante la reparación del vehículo, me serán expuestas para que otorgue mi conformidad. En las reparaciones dentro del periodo de garantía, el cliente pagará las piezas, como se especifica en el libro de garantía.
aon_legal_text_1=Mediante la cumplimentación voluntaria de este formulario, los datos de carácter personal que usted nos proporciona pasarán a formar parte de un fichero propiedad de
aon_legal_text_2=, previamente notificado a la Agencia de Protección de Datos y que cuenta con las medidas de seguridad necesarias para garantizar la seguridad de los datos así como para evitar la alteración, pérdida, tratamiento o acceso no autorizado a los mismos. El usuario podrá ejercer los derechos de acceso, cancelación, rectificación y oposición que expresamente reconoce la L.O.P.D. Para el ejercicio de estos derechos, el usuario deberá dirigir una solicitud escrita a
aon_legal_text_3=con los siguientes datos: nombre y apellidos, domicilio a efectos de notificaciones, fotocopia del DNI o pasaporte, petición en que se concreta la solicitud, fecha y firma del interesado.
