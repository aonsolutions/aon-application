<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="purchaseDirectInvoicingList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_purchase_invoice_management_module}" />
				<ui:param name="controller" value="#{purchaseDirectInvoicing}" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="invoiceList" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="invoiceList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
				</ui:define>				
				
			</ui:decorate>


			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="purchaseDirectInvoicingData" value="#{purchaseDirectInvoicing.model}"
					var="to" rows="20" rendered="#{purchaseDirectInvoicing.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn">

					<aon:rowSelector action="purchaseDirectInvoicing_form" actionListener="#{purchaseDirectInvoicing.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_invoice_number}" />
						</f:facet>
						<aon:outputText value="#{to.referenceCode}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
								<aon:outputText value="#{financeBundle.aon_supplier}" />
						</f:facet>
						<aon:outputText value="#{to.registryName}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{purchaseDirectInvoicing.invoiceTotalPrice}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="purchaseDirectInvoicingData" showNote="true" />
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
