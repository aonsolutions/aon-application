<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.link}" />
				<ui:param name="controller" value="#{link}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="exit"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>				
					<aon:commandButton id="generate" reRender="aonStatus"
						value="#{appBundle.aon_generate}" 
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<aon:actionListener method="#{generator.onGenerateLinks}" />
						<a4j:support 
							event="onclick" reRender="poll,grid" 
							actionListener="#{generator_status.onActivePoll}"  
							onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
					</aon:commandButton>	
					<aon:commandButton id="categories"
						value="#{appBundle.link_category}"
						action="link_category_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{link_category.onInit}" />
						<aon:actionListener method="#{link_category.onSearch}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
				
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" value="#{link.model}"
					rows="#{link.pageLimit}" var="to" rendered="#{link.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-iconColumn">
				
					<aon:rowSelector
						action="link_form" actionListener="#{link.onSelect}" />
				
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>
	
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.link_label}" />
						</f:facet>
						<aon:outputText value="#{link.i18nLabel}" >
							<aon:abbreviateConverter maxWidth="60" />
						</aon:outputText>
					</aon:column>
	
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.link_category}" />
						</f:facet>
						<aon:outputText value="#{to.linkCategory.alias}" />
					</aon:column>
	
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.link_position}" />
						</f:facet>
						<aon:outputText value="#{to.position}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.link_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >
							<aon:commandLink title="#{appBundle.link_activate}" 
								action="link_list"
								actionListener="#{link.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="Link_active" alt="#{appBundle.link_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.link_deactivate}" 
								action="link_list"
								actionListener="#{link.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="Link_deactive" alt="#{appBundle.link_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>
		
	<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
		
</ui:define>

</ui:composition>

</body>
</html>
