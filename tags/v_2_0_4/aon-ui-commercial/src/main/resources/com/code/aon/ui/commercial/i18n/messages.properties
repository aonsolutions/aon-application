aon_footer_text_2=, quien no se hace responsable de los objetos depositados en el vehículo. Acepto la realización de la reparación y autorizo a sus empleados a conducir el vehículo de mi propiedad arriba consignado, por las calles o carreteras para efectuar las pruebas que estimen necesarias. Los trabajos se abonarán al contado (a la entrega del vehículo). Esta reparación tiene tres meses de garantía o 2.000 Kms., a partir de la fecha de entrega. Las averías o defectos ocultos que eventualmente puedan aparecer durante la reparación del vehículo, me serán expuestas para que otorgue mi conformidad. En las reparaciones dentro del periodo de garantía, el cliente pagará las piezas, como se especifica en el libro de garantía. 
