<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="headerList">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.header}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="header_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{headers.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="dataTable" value="#{headers.model}" var="to"
					rows="#{headers.pageLimit}" rendered="#{headers.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn,
							aon-editDataTable-iconColumn">
							
					<aon:rowSelector
						action="header_form" actionListener="#{headers.onSelect}" />							
							
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText for="Header_defaultMenu" 
								value="#{appBundle.menu_defaultMenu}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																				
							<aon:selectBooleanCheckbox id="Header_defaultMenu" 
								value="#{to.default_}" rendered="#{!to.default_}">
								<a4j:support 
									actionListener="#{headers.defaultChanged}"
									event="onclick"  
									reRender="dataTable" />
							</aon:selectBooleanCheckbox>
						</aon:div>
						<aon:graphicImage id="Header_default_blocked" 
							rendered="#{to.default_}"
							url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" 
							alt="#{appBundle.menu_blocked}"/>
					</aon:column>
					
				</aon:dataTable>
					
				<aon:dataScroller2 for="dataTable" />
					
			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
