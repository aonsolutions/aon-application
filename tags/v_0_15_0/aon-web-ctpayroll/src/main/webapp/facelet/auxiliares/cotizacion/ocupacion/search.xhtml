<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="ocupacionMaestroSearch">

		
			 <ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_cotizacion__ocupacion}" />
				<ui:param name="controller" value="#{ocupacionMaestro}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{ocupacionMaestro.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="ocupacionMaestro_list" />				
				
					<aon:outputLabel for="OcupacionMaestro_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="OcupacionMaestro_cdg" size="10" maxlength="10"
						valueChangeListener="#{ocupacionMaestro.addExpression}" />

					<aon:outputLabel for="OcupacionMaestro_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="OcupacionMaestro_description" size="60" maxlength="60"
						valueChangeListener="#{ocupacionMaestro.addExpression}" />
						
					<aon:outputLabel for="OcupacionMaestro_exclusivo"
						value="#{appBundle.aon_payroll_cotizacion_exclusivo}" />
					<aon:selectBooleanCheckbox id="OcupacionMaestro_exclusivo" 
						value="#{ocupacionMaestro.searchExclusivo}"/>
						
					<aon:outputLabel for="OcupacionMaestro_id_fecini"
						value="#{appBundle.aon_payroll_cotizacion_fecini}" />
					<aon:selectInputDate id="OcupacionMaestro_id_fecini" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{ocupacionMaestro.searchFecini}">
					</aon:selectInputDate>	
					
					<aon:outputLabel for="OcupacionMaestro_fecfin"
						value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
					<aon:selectInputDate id="OcupacionMaestro_fecfin" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{ocupacionMaestro.searchFecfin}">
					</aon:selectInputDate>			
						
					<aon:outputLabel for="OcupacionMaestro_ocupaciones_pctit"
						value="#{appBundle.aon_payroll_cotizacion_pctit}" />
					<aon:inputText id="OcupacionMaestro_ocupaciones_pctit" size="20" maxlength="20"
						valueChangeListener="#{ocupacionMaestro.addDirectExpression}" />
						
					  <aon:outputLabel for="OcupacionMaestro_ocupaciones_pctims"
						value="#{appBundle.aon_payroll_cotizacion_pctims}" />
					<aon:inputText id="OcupacionMaestro_ocupaciones_pctims" size="20" maxlength="20"
						valueChangeListener="#{ocupacionMaestro.addDirectExpression}" />
						
					<aon:outputLabel for="OcupacionMaestro_ocupaciones_pcttotal"
						value="#{appBundle.aon_payroll_cotizacion_pcttotal}" />
					<aon:inputText id="OcupacionMaestro_ocupaciones_pcttotal" size="20" maxlength="20"
						valueChangeListener="#{ocupacionMaestro.addDirectExpression}" />
						
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
