<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sport_career_path_form">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.sport_career_path}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!sport_career_path.new}"
							reRender="dataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{sport_career_path.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{sport_career_path.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{sport_career_path.onAccept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{sport_career_path.to!=null}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							accesskey="#{bundle.aon_key_cancel}">
							<aon:actionListener method="#{sport_career_path.onCancel}" />
						</aon:commandButton>
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!sport_career_path.checklistEmpty}"
							reRender="dataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{sport_career_path.onRemoveSelected}"
							accesskey="#{bundle.aon_key_remove}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="dataTable"
					value="#{sport_career_path.model}" var="to" 
					rows="#{sport_career_path.pageLimit}"
					styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="#{bundle.aon_check}" />
							</aon:div>	
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to==sport_career_path.to}" />
						<aon:selectBooleanCheckbox id="Row_checked"
								value="#{sport_career_path.rowChecked}">
								<a4j:support 
									event="onclick"  
									reRender="dataTable,gridToolbar" />
						</aon:selectBooleanCheckbox>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="dataTable,gridToolbar"
									rendered="#{!sport_career_path.new}"
									actionListener="#{sport_career_path.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_career_path_sportPlayer}" />
						</f:facet>
						<aon:outputText value="#{to.sportPlayer.name}"
							rendered="#{to!=sport_career_path.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{sport_career_path.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:selectOneMenu rendered="#{to==sport_career_path.to}"  
							value="#{sport_career_path.to.sportPlayer.id}">
							<f:selectItems value="#{collections.sportPlayerList}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:div>
								<aon:selectOneMenu rendered="#{sport_career_path.new}"  
									value="#{sport_career_path.to.sportPlayer.id}">
									<f:selectItems value="#{collections.sportPlayerList}" />
								</aon:selectOneMenu>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_career_path_sportClub}" />
						</f:facet>
						<aon:outputText value="#{to.club}"
							rendered="#{to!=sport_career_path.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{sport_career_path.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:inputText value="#{sport_career_path.to.club}"
							rendered="#{to==sport_career_path.to}"
							required="#{true}" size="40" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{sport_career_path.to.club}"
									rendered="#{sport_career_path.new}"
									required="#{true}" size="40" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_career_path_initDate}" />
						</f:facet>
						<aon:outputText value="#{to.initDate}"
							rendered="#{to!=sport_career_path.to}" 
							styleClass="aon-editDataTable-button">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{sport_career_path.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:selectInputDate rendered="#{to==sport_career_path.to}"
							 style="z-index:2001;margin:0;vertical-align:middle;"
							 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
							 value="#{sport_career_path.to.initDate}" renderAsPopup="true"
							 popupDateFormat="#{bundle.aon_date_pattern}">
							 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
						</aon:selectInputDate>	
						<f:facet name="footer">
							<aon:div>
								<aon:selectInputDate rendered="#{sport_career_path.new}"
									 style="z-index:2001;margin:0;vertical-align:middle;"
									 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
									 value="#{sport_career_path.to.initDate}" renderAsPopup="true"
									 popupDateFormat="#{bundle.aon_date_pattern}">
									 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
								</aon:selectInputDate>	
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_career_path_endDate}" />
						</f:facet>
						<aon:outputText value="#{to.endDate}"
							rendered="#{to!=sport_career_path.to}" 
							styleClass="aon-editDataTable-button">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
							<a4j:support 
								reRender="dataTable,gridToolbar"
								actionListener="#{sport_career_path.onSelect}"
								event="onclick" />
						</aon:outputText>	
						<aon:selectInputDate rendered="#{to==sport_career_path.to}"
							 style="z-index:2001;margin:0;vertical-align:middle;"
							 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
							 value="#{sport_career_path.to.endDate}" renderAsPopup="true"
							 popupDateFormat="#{bundle.aon_date_pattern}">
							 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
						</aon:selectInputDate>	
						<f:facet name="footer">
							<aon:div>
								<aon:selectInputDate rendered="#{sport_career_path.new}"
									 style="z-index:2001;margin:0;vertical-align:middle;"
									 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
									 value="#{sport_career_path.to.endDate}" renderAsPopup="true"
									 popupDateFormat="#{bundle.aon_date_pattern}">
									 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
								</aon:selectInputDate>	
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=sport_career_path.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==sport_career_path.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable,gridToolbar">
								<aon:actionListener method="#{sport_career_path.onAccept}" />
							</aon:commandButton>
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable,gridToolbar" immediate="true">
								<aon:actionListener method="#{sport_career_path.onCancel}" />
							</aon:commandButton>
							<aon:commandButton id="lineRemove"
								title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable,gridToolbar" immediate="true"
								actionListener="#{sport_career_path.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{sport_career_path.new}">
								<f:verbatim rendered="#{!sport_career_path.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable,gridToolbar">
									<aon:actionListener method="#{sport_career_path.onAccept}" />
								</aon:commandButton>
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable,gridToolbar" immediate="true">
									<aon:actionListener method="#{sport_career_path.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller for="dataTable"
					rowCount="#{sport_career_path.model.rowCount}" 
					showNote="true" />					
			
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
