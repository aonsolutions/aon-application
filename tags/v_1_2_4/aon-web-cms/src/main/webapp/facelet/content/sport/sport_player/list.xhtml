<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.sport_player}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="sport_player_form"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{sport_player.onReset}" />
					</aon:commandButton>
					<aon:confirmButton id="remove"
						value="#{bundle.aon_remove}" rendered="#{!sport_player.checklistEmpty}" 
						inmediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{sport_player.onRemoveSelected}"
						confirmAction="sport_player_list"
						accesskey="#{bundle.aon_key_remove}"/>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">

					<aon:dataTable id="dataTable" value="#{sport_player.model}" var="to"
						rows="#{sport_player.pageLimit}" 
						styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn">
				
						<aon:column>
							<f:facet name="header">
								<aon:div>
									<aon:outputText value="#{bundle.aon_check}" />
								</aon:div>	
							</f:facet>
							<aon:selectBooleanCheckbox id="Row_checked"
									value="#{sport_player.rowChecked}">
									<a4j:support 
										event="onclick"  
										reRender="dataTable,buttonsGrid" />
							</aon:selectBooleanCheckbox>
						</aon:column>
						
						<aon:column>
							<a4j:support 
								action="sport_player_form"
								actionListener="#{sport_player.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.sport_player_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<a4j:support 
								action="sport_player_form"
								actionListener="#{sport_player.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.sport_player_sportClub}" />
							</f:facet>
							<aon:outputText value="#{to.sportClub.description}" styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.sport_player_active}" />
							</f:facet>
							<aon:commandLink title="#{appBundle.sport_player_activate}" 
								action="sport_player_list"
								actionListener="#{sport_player.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="SP_active" alt="#{appBundle.sport_player_activate}"
									url="/images/cms/inactive.png" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.sport_player_deactivate}" 
								action="sport_player_list"
								actionListener="#{sport_player.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="SP_deactive" alt="#{appBundle.sport_player_deactivate}"
									url="/images/cms/active.png" />
							</aon:commandLink>
						</aon:column>

					</aon:dataTable>
				
					<aon:dataScroller for="dataTable"
						rowCount="#{sport_player.model.rowCount}" 
						showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
