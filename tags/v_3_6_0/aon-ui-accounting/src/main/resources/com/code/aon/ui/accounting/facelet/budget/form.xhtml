<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_account_budget_module}" />
				<ui:param name="controller" value="#{accountBudget}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" style="width: 100%;">

					<aon:outputLabel for="accountId"
						value="#{accountBundle.account_account}" />
					<ui:decorate
						template="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="accountId" />
						<ui:param name="size" value="12" />
						<ui:param name="maxlength" value="12" />
						<ui:param name="renderDescription" value="true" />
						<ui:param name="renderedAttr" value="true" />
						<ui:param name="disabled" value="false" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="required" value="true" />
						<ui:param name="entity" value="#{accountBudget.to.account}" />
						<ui:param name="ELExpression" value="accountBudget.to.account" />
					</ui:decorate>

					<aon:outputLabel for="AccountBudget_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu id="AccountBudget_accountPeriod"
						value="#{accountBudget.to.period}">
						<f:selectItems value="#{accountingCollections.accountPeriodKeys}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="AccountBudget_date" value="#{bundle.aon_date}" />
					<aon:selectInputDate size="8" id="AccountBudget_date"
						value="#{accountBudget.to.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="AccountBudget_debit" value="#{accountingBundle.accounting_debit}" />
					<aon:inputText id="AccountBudget_debit" value="#{accountBudget.to.debit}"
						required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="AccountBudget_credit" value="#{accountingBundle.accounting_credit}" />
					<aon:inputText id="AccountBudget_credit" value="#{accountBudget.to.credit}"
						required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>

				</aon:panelGrid>
			</aon:div>
			<!-- 			
			<ui:include
				src="/com/code/aon/ui/account/facelet/budget/grid.xhtml" />
 -->
		</aon:form>
	</ui:define>
</ui:composition>
