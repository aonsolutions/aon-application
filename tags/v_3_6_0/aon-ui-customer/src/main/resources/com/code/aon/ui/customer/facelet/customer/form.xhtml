<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{customerBundle.customer_module}" />
				<ui:param name="controller" value="#{customer}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<ui:include
						src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml">
						<ui:param name="controller" value="#{customer}" />
					</ui:include>

					<aon:outputLabel for="Customer_tariff_id"
						value="#{productBundle.product_tariff}" />
					<aon:selectOneMenu id="Customer_tariff_id"
						value="#{customer.to.tariff}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{productCollections.tariffs}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_customerSegment_id"
						value="#{bundle.aon_segment}" />
					<aon:selectOneMenu id="Customer_customerSegment_id"
						value="#{customer.to.customerSegment}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{customerCollections.customerSegments}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Customer_scope_id"
						value="#{customer.to.scope}">
						<f:selectItems value="#{configCollections.scopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_status" value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Customer_status"
						value="#{customer.to.status}">
						<f:selectItems value="#{customerCollections.customerStatuses}" />
					</aon:selectOneMenu>

					
						<aon:outputLabel for="Customer_surcharge"
							value="#{customerBundle.customer_surcharge}" />
						<aon:selectBooleanCheckbox id="Customer_surcharge"
							value="#{customer.to.surcharge}" />
					
					<c:if test="#{customer.showAccount}">
						<aon:outputLabel for="Customer_account"
							value="#{accountingBundle.accounting_account}" />
						<aon:inputText id="Customer_account" 
							rendered="#{customerAccount.account != null}"
							value="#{customerAccount.account.id} - #{customerAccount.account.description}"
							disabled="true" size="60" />
						<aon:inputText rendered="#{customerAccount.account == null}"
							value="" disabled="true" size="60" />
					</c:if>

						<aon:outputLabel for="Customer_withholding"
							value="#{bundle.aon_retention}" />
						<aon:selectBooleanCheckbox id="Customer_withholding"
							value="#{customer.to.withholding}" />
						
						<aon:outputText  value="&#160;"/>
						<aon:outputText  value="&#160;"/>

						<aon:outputLabel for="Customer_taxFree"
							value="#{customerBundle.customer_taxFree}" />
						<aon:selectBooleanCheckbox id="Customer_taxFree"
							value="#{customer.to.taxFree}" />

				</aon:panelGrid>

				<aon:panelGrid id="observationDataTable" styleClass="aon-margin-top"
					columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Observation"
						value="#{customerBundle.customer_observation}" />
					<aon:inputTextarea id="Observation" cols="120" rows="3"
						value="#{customerObservation.observation.comments}" />
				</aon:panelGrid>

				<c:if test="#{!customer.new}">
					<aon:panelTabSet selectedTab="#{customer.selectedTab}">
						<aon:panelTab id="adddress"
							label="#{registryBundle.registry_address_module}">
							<ui:include
								src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerAddress}" />
							</ui:include>
						</aon:panelTab>
						<aon:panelTab id="media"
							label="#{registryBundle.registry_media_module}">
							<ui:include
								src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerMedia}" />
							</ui:include>
						</aon:panelTab>
						<c:if test="#{customer.showFinanceData}">
							<aon:panelTab id="finance"
								label="#{registryBundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText
											value="#{registryBundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{configBundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
							<aon:panelTab id="fee"
								label="#{financeBundle.finance_fees_module}">
								<ui:include
									src="/com/code/aon/ui/finance/facelet/fee/tab_grid.xhtml">
								</ui:include>
							</aon:panelTab>
						</c:if>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<c:if test="#{customer.showFinanceData}">
			<aon:lookupButtonPopup lookup="#{bankLookup}" />
			<aon:lookupButtonPopup lookup="#{itemLookup}" />
		</c:if>
	</ui:define>
</ui:composition>
