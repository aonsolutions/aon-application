<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="downloadSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.download}" />
				<ui:param name="controller" value="#{download}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{download}" />
				<ui:define name="searchContent">
	
					<aon:outputLabel for="Download_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Download_alias" size="50"
						valueChangeListener="#{download.addExpression}" />

					<aon:outputLabel for="Download_title"
						value="#{appBundle.download_title}" />
					<aon:inputText id="Download_title" size="50"
						value="#{download.title}" />

					<aon:outputLabel for="Download_downloadCategory_id"
						value="#{appBundle.download_category}"/>
					<aon:selectOneMenu id="Download_downloadCategory_id"  
						valueChangeListener="#{download.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.downloadCategoryList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="Download_position"
						value="#{appBundle.download_position}" />
					<aon:inputText id="Download_position" size="10"
						valueChangeListener="#{download.addExpression}" />
	
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
