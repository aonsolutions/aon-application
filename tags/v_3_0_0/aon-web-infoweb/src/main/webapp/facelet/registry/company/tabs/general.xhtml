<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>
	<aon:form id="generalForm">

	<aon:div styleClass="aon-toolbar">
		<aon:confirmButton id="save" value="#{bundle.aon_save}"
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			confirmTitle="Confirmation Dialog"
			confirmMessage="#{bundle.aon_save_confirm}"
			confirmActionListener="#{company.onAccept}"
			accesskey="#{bundle.aon_key_save}" />
	</aon:div>

	<aon:div style="float:left;margin-right:20px;">
		<aon:panelGrid columns="2" dir="true">
	
			<aon:outputLabel for="Company_name" value="#{registryBundle.aon_name}" />
			<aon:inputText id="Company_name" required="true" size="45"
				maxlength="50" value="#{company.to.name}" />
	
			<aon:outputLabel for="Company_document" value="#{registryBundle.aon_cif}" />
			<aon:inputText id="Company_document" required="true" size="15"
				maxlength="9" value="#{company.to.document}" />

			<aon:outputLabel for="Company_alias" value="#{appBundle.aon_web_info_company_alias}" />
			<aon:inputText id="Company_alias" required="true" size="45"
				maxlength="50" value="#{company.to.alias}" />
			
			<aon:outputLabel for="Company_telephone" value="#{registryBundle.aon_phone}" />
			<aon:inputText id="Company_telephone" size="20" maxlength="15" 
				value="#{company.phone.value}" 
				valueChangeListener="#{company.phoneChanged}"/>

			<aon:outputLabel for="Company_fax" value="#{registryBundle.aon_fax}" />
			<aon:inputText id="Company_fax" size="20" maxlength="15" 
				value="#{company.fax.value}" 
				valueChangeListener="#{company.faxChanged}"/>

			<aon:outputLabel for="Company_email" value="#{registryBundle.aon_email}" />
			<aon:inputText id="Company_email" size="45" 
				value="#{company.email.value}" 
				valueChangeListener="#{company.emailChanged}"/>

			<aon:outputLabel for="Company_web" value="#{registryBundle.aon_web}" />
			<aon:inputText id="Company_web" size="45" 
				value="#{company.web.value}" 
				valueChangeListener="#{company.webChanged}"/>
		</aon:panelGrid>
	</aon:div>		
	<aon:div id="logoDiv" style="float:left;" ajaxRendered="true">	
		<aon:div styleClass="aon-group" >		
			<aon:div styleClass="aon-group-title">							
			<aon:outputLabel for="Company_logo" rendered="#{!company.new}"
				value="#{registryBundle.aon_company_logo}" />
			</aon:div>
			<aon:div styleClass="aon-group-body">
				<aon:div styleClass="aon-toolbar" rendered="#{company.fileData != null}" >
					<aon:commandButton id="Company_logo_remove" value="#{bundle.aon_fileupload_remove}"
						styleClass="aon-icon-delete aon-finding-toolbar-item"
						reRender="logoDiv"
						actionListener="#{company.fileRemove}"/>
				</aon:div>		
				
				<aon:panelGrid id="upload_logo" columns="2" style="width:400px;margin-left:10px;margin-right:10px;">
						
					<aon:outputLabel value="#{registryBundle.aon_registry_attach_file}" style="width:100px"/>
					<aon:div>
						<aon:fileUpload id="Company_logo" width="100%" rendered="#{company.fileData == null}"
								addControlLabel="#{appBundle.aon_web_info_add}" 
								stopControlLabel="#{appBundle.aon_web_info_stop}" 
								stopEntryControlLabel="#{appBundle.aon_web_info_stop}"
								uploadControlLabel="#{appBundle.aon_web_info_uploading}"
								cancelEntryControlLabel="#{appBundle.aon_web_info_cancel}"
								clearAllControlLabel="#{appBundle.aon_web_info_clear_all}" 
								clearControlLabel="#{appBundle.aon_web_info_clear}"
								doneLabel="#{appBundle.aon_web_info_done}" 
								progressLabel="#{appBundle.aon_web_info_progress}" 
								sizeErrorLabel="#{appBundle.aon_web_info_size_error}" 
								transferErrorLabel="#{appBundle.aon_web_info_transfer_error}" 
								fileUploadListener="#{company.uploadListener}"
								immediateUpload="true" autoclear="true" listHeight="70px" listWidth="100%">
							<a4j:support event="onuploadcomplete" reRender="logoDiv" />
						</aon:fileUpload>

						<aon:panelGroup id="logo_preview" styleClass="aon-text-center" rendered="#{company.fileData != null}">
							<aon:mediaOutput 
								element="img" cacheable="false"
								createContent="#{company.paint}" 
								mimeType="#{company.mimeType}"/>
						</aon:panelGroup>
					</aon:div>
					<!--aon:div>
						<t:inputFileUpload id="Company_logo"
							value="#{company.inputFile}" rendered="#{company.fileData == null}"
							accept="image/*" storage="file" size="45"/>
						<aon:panelGroup styleClass="aon-text-center" rendered="#{company.fileData != null}">
							<aon:mediaOutput id="Logo_preview"
								element="img" cacheable="false"
								createContent="#{company.paint}" 
								mimeType="#{company.mimeType}"/>
						</aon:panelGroup>
					</aon:div-->
				</aon:panelGrid>				
			</aon:div>
		</aon:div>
	</aon:div>

	<aon:div style="clear:both;padding-top:1em;">
		<aon:panelGrid columns="4" styleClass="aon-editDataTable"
			cellpadding="0" cellspacing="0"
			columnClasses="aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn">

	  		<aon:div styleClass="aon-editDataTable-header">	  
				<aon:outputLabel for="Company_address" value="#{registryBundle.aon_address}" />
			</aon:div>		
	  		<aon:div styleClass="aon-editDataTable-header">	  
				<aon:outputLabel for="Company_zip" value="#{registryBundle.aon_zip}" />
			</aon:div>		
	  		<aon:div styleClass="aon-editDataTable-header">	  
				<aon:outputLabel for="Company_city" value="#{registryBundle.aon_city}" />
			</aon:div>		
	  		<aon:div styleClass="aon-editDataTable-header">	  
				<aon:outputLabel for="Company_address_geozone" value="#{registryBundle.aon_geozone}" />
			</aon:div>		

			<aon:div>
				<aon:div>
					<aon:inputText id="Company_address" required="true" size="50"
						maxlength="50" value="#{company.mainAddress.address}"
						valueChangeListener="#{company.addressChanged}" />
				</aon:div>
				<aon:div>
					<aon:inputText id="Company_address2" size="50"
						maxlength="50" value="#{company.mainAddress.address2}"
						valueChangeListener="#{company.addressChanged}" />
				</aon:div>
				<aon:div>
					<aon:inputText id="Company_address3" size="50"
						maxlength="50" value="#{company.mainAddress.address3}"
						valueChangeListener="#{company.addressChanged}" />	
				</aon:div>	
			</aon:div>		

			<aon:div>
				<aon:inputText id="Company_zip" size="6"
					maxlength="50" value="#{company.mainAddress.zip}"
					valueChangeListener="#{company.addressChanged}" />			
			</aon:div>

				<aon:div>
						<aon:inputText id="Company_city" size="45"
						maxlength="50" value="#{company.mainAddress.city}"
						valueChangeListener="#{company.addressChanged}" />			
				</aon:div>

				<aon:div>		
					<aon:selectOneMenu id="Company_address_geozone"
						value="#{company.mainAddress.geozone.id}"
						valueChangeListener="#{company.addressChanged}">
						<f:selectItems value="#{geozoneCollections.geoZones}" />
					</aon:selectOneMenu>
			</aon:div>
		</aon:panelGrid>
		
		<aon:div style="clear:both;margin-top:1em">
			<ui:include src="/facelet/shared/tabs/addresses.xhtml">
				<ui:param name="controllerAlias" value="#{companyAddress}" />
				<ui:param name="dataTable" value="companyAddressDataList" />
			</ui:include>
		</aon:div>
	</aon:div>
	
	</aon:form>
</ui:composition>
</body>
</html>
