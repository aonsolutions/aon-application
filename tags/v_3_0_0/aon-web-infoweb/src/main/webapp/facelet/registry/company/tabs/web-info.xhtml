<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="webinfoForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_web_info_data}" />
				<ui:param name="controller" value="#{companyWebInfo}" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
	
			<rich:panel styleClass="aon-content-home">
				<aon:panelGrid columns="2" dir="true" style="width:100%">
			
					<aon:outputLabel for="WebInfo_slogan" value="#{appBundle.aon_web_info_data_slogan}" />
					<aon:inputText id="WebInfo_slogan" 
						size="64" maxlength="64" value="#{companyWebInfo.to.slogan}" />
			
					<aon:outputLabel for="WebInfo_schedule" value="#{appBundle.aon_web_info_data_schedule}" />
					<aon:inputTextarea id="WebInfo_schedule" styleClass="aon-inputText"
						cols="90" rows="3" value="#{companyWebInfo.to.schedule}" />
			
					<aon:outputLabel for="WebInfo_commercialDescription" value="#{appBundle.aon_web_info_data_short_description}" />
					<aon:inputTextarea id="WebInfo_commercialDescription"
						value="#{companyWebInfo.to.commercialDescription}" cols="90" rows="15"/>
				</aon:panelGrid>
			</rich:panel>
		
		</aon:form>
	</ui:define>
	
</ui:composition>
