<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="scopeList">

			<aon:div ajaxRendered="true" layout="none">

				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{appBundle.aon_users}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{appBundle.aon_scopes}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{scope.onReset}" rendered="#{!scope.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}" rendered="#{scope.to!=null or scope.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{scope.onAccept}" 
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{scope.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{scope.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{scope.to!=null and (!scope.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								actionListener="#{scope.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{scope.to!=null and !scope.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{scope.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<aon:commandButton id="users" value="#{bundle.aon_back}"  rendered="#{scope.to==null}"
								action="user" actionListener="#{user.onSearch}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>

				<!--  aon-region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="scopeData" var="to" rows="0"
						rendered="#{(scope.model.rowCount > 0) or (scope.new)}" value="#{scope.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{scope.to == null}"
							actionListener="#{scope.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{scope.onReset}" value=""
										rendered="#{!scope.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{configBundle.scope_scope}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=scope.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==scope.to}" size="60"
								value="#{scope.to.description}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{scope.new}" size="60"
									value="#{scope.to.description}" maxlength="45" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=scope.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==scope.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{scope.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==scope.to}"
									actionListener="#{scope.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==scope.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{scope.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!scope.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{scope.new}"
										actionListener="#{scope.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{scope.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{scope.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller for="scopeData" rowCount="#{scope.model.rowCount}" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
