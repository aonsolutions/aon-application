<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="workGroupList">

			<aon:div ajaxRendered="true" layout="none">

				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{appBundle.aon_users}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{appBundle.aon_workgroups}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{workGroup.onReset}" rendered="#{!workGroup.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}"
								actionListener="#{workGroup.onAccept}" 
								rendered="#{workGroup.to!=null or workGroup.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{workGroup.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{workGroup.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{workGroup.to!=null and (!workGroup.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								actionListener="#{workGroup.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{workGroup.to!=null and !workGroup.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{workGroup.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<aon:commandButton id="users"
								value="#{bundle.aon_back}" rendered="#{workGroup.to==null}"
								action="user" actionListener="#{user.onSearch}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
				<!-- end toolbar navigation -->

				<!--  aon-region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="workGroupData" var="to" rows="0"
						rendered="#{(workGroup.model.rowCount > 0) or (workGroup.new)}" value="#{workGroup.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{workGroup.to == null}"
							actionListener="#{workGroup.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{workGroup.onReset}" value=""
										rendered="#{!workGroup.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.aon_workgroup_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=workGroup.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==workGroup.to}" size="60"
								value="#{workGroup.to.description}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{workGroup.new}" size="60"
									value="#{workGroup.to.description}" maxlength="45" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.aon_workgroup_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" rendered="#{to!=workGroup.to}" />
							<aon:selectOneMenu rendered="#{to==workGroup.to}" value="#{workGroup.to.status}">
								<f:selectItems value="#{configCollections.workGroupStatuses}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="workGroupStatuses" rendered="#{workGroup.new}" value="#{workGroup.to.status}">
									<f:selectItems value="#{configCollections.workGroupStatuses}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=workGroup.to}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]" 
									actionListener="#{workGroup.onAccept}" 
									rendered="#{to==workGroup.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==workGroup.to}"
									actionListener="#{workGroup.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==workGroup.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{workGroup.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!workGroup.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										actionListener="#{workGroup.onAccept}" 
										rendered="#{workGroup.new}"
										styleClass="aon-editDataTable-button aon-icon-accept"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{workGroup.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{workGroup.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:editDataTable>
 
					<aon:dataScroller for="workGroupData" rowCount="#{workGroup.model.rowCount}" showNote="true" />
					 
				</aon:div>				
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
