<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		
			<aon:div styleClass="menu" />
			<aon:div styleClass="back-button" >
			
				<h:commandButton style="border-right:0;" 
					value="Aceptar pedido"
					action="#"
					rendered="#{paypal.payment}"
					styleClass="aon-finding-toolbar-item aon-icon-accept">
					<aon:actionListener method="#{cartOffer.onAccept}" />
				</h:commandButton>
				
				<h:commandButton style="border-right:0;" 
					value="#{bundle.aon_back}"
					action="shop_from" immediate="true"
					rendered="#{paypal.payment}"
					accesskey="#{bundle.aon_key_cancel}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel">
					<aon:actionListener method="#{shop.refreshView}" />
				</h:commandButton>

				<h:commandButton style="border-right:0;" 
					value="#{securityBundle.aon_login_user_logout}"
					action="shop_from"
					rendered="true"
					styleClass="aon-finding-toolbar-item aon-icon-cancel">
					<aon:actionListener method="#{shop.refreshView}" />
					<aon:actionListener method="#{userLogin.onLogout}" />
					<aon:actionListener method="#{cartOffer.onCloseSession}" />
				</h:commandButton>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="border:000 2px solid;">

					<aon:outputLabel for="Offer_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:outputText id="Offer_series"
							value="#{cartOffer.offer.series}">
						</aon:outputText>
						<aon:outputText id="Offer_series-Edit"
							value="#{cartOffer.offer.series}" size="4" />
						<aon:outputText id="Offer_number" value="#{cartOffer.offer.number}"
							size="7"
							styleClass="aon-margin-left" />

						<aon:outputText id="Offer_securityLevel"
							value="#{cartOffer.offer.securityLevel}" 
							styleClass="aon-margin-left">
						</aon:outputText>

						<aon:outputText styleClass="aon-margin-left"
							value="#{cartOffer.offer.status}" />
					</aon:div>

					<aon:outputLabel for="Offer_issueDate" value="#{bundle.aon_date}" />
					<aon:outputText id="Offer_issueDate"
						value="#{cartOffer.offer.issueDate}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>

					<aon:outputLabel for="Offer_target_id"
						value="#{target.bundle.commercial_target}" />
					<aon:div styleClass="aon-lookup">
						<aon:outputText id="Offer_target_id"
							value="#{cartOffer.offer.target.registry.id} " size="5" />
						<aon:outputText id="Offer_target_full_name"
							value="#{(cartOffer.offer.target.registry.name!=null)?(cartOffer.offer.target.registry.fullName):('')}"
							size="50" />
					</aon:div>

					<aon:outputLabel for="Offer_target_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:outputText id="Offer_target_registry_document"
						value="#{cartOffer.offer.target.registry.document}"
						size="10" />

					<aon:outputLabel for="Offer_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="OfferAddress">
						<aon:outputText id="Offer_address"
							value="#{cartOffer.offer.address.address}, " />
						<aon:outputText id="Offer_address2"
							value="#{cartOffer.offer.address.address2}, " />
						<aon:outputText id="Offer_address3"
							value="#{cartOffer.offer.address.address3}" />
					</aon:div>


					<aon:outputLabel for="Offer_seller_id"
						value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<!--  
						<aon:lookupInputText id="Offer_seller_id" value="#{cartOffer.to.seller.registry.id}"
							lookup="#{sellerLookup}" reRender="Offer_seller_full_name"
							lookupChangeListener="#{cartOffer.sellerData}" lookupProperty="registry"
							disabled="#{cartOffer.processed}" size="5" />
						<aon:lookupButton
							windowTitle="#{salesBundle.sales_seller_selection}" actionType="search"
							property="#{cartOffer.to.seller.registry}" selectReRender="Offer_seller_id,Offer_seller_full_name"
							lookup="#{sellerLookup}" minHeight="460" minWidth="650"
							lookupChangeListener="#{cartOffer.sellerData}" lookupProperty="registry"
							disabled="#{cartOffer.processed}">
						</aon:lookupButton>
						<aon:inputText id="Offer_seller_full_name" 
							value="#{(cartOffer.to.seller.registry.name!=null)?(cartOffer.to.seller.registry.fullName):('')}"
							disabled="true" size="50" />
						-->
					</aon:div>

					<aon:outputLabel for="Offer_payMethod"
						value="#{configBundle.config_pay_method}" />
					<aon:outputText id="Offer_payMethod"
						value="#{cartOffer.offer.payMethod.name}">
					</aon:outputText>

<!--  
					<aon:outputLabel for="Offer_tariff"
						value="#{productBundle.product_tariff}" />
					<aon:outputText id="Offer_tariff" value="#{cartOffer.offer.tariff}"/>
-->

<!--  
					<aon:outputLabel for="Offer_total" value="#{bundle.aon_total}" />
					<aon:outputText id="Offer_total" value="#{cartOffer.totalPrice}"
						styleClass="aon-bold">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
-->

				</aon:panelGrid>
			</aon:div>

			
			<aon:panel id="offer-detail-list"
				styleClass="aon-padding-left aon-padding-right">
				<f:facet name="header">
					<aon:outputText value="#{commercialBundle.commercial_offer_detail}" />
				</f:facet>
				<ui:include src="list.xhtml" />
<!--  
				<ui:include src="/com/code/aon/ui/ecommerce/facelet/shop/cart/list.xhtml" />
-->
			</aon:panel>

		
	</ui:define>
</ui:composition>
