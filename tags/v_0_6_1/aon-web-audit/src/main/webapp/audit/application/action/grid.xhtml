<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="applicationActionData" var="to"
			value="#{applicationAction.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{applicationAction.to == null}"
				actionListener="#{applicationAction.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{applicationAction.onReset}" value=""
							rendered="#{!applicationAction.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}"
					rendered="#{to!=applicationAction.to}" />
				<aon:inputText value="#{applicationAction.to.name}"
					rendered="#{to==applicationAction.to}"
					required="true" size="40" maxlength="64" />					
				<f:facet name="footer">
					<aon:inputText value="#{applicationAction.to.name}"
						rendered="#{applicationAction.new}"
						required="true" size="40" maxlength="64" />					
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=applicationAction.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{applicationAction.onAccept}" 
						rendered="#{to==applicationAction.to}" value=""
						reRender="applicationActionDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-applicationAction" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==applicationAction.to}"
						actionListener="#{applicationAction.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-applicationAction" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==applicationAction.to}" reRender="applicationActionDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{applicationAction.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!applicationAction.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{applicationAction.onAccept}"
							rendered="#{applicationAction.new}" value=""
							reRender="applicationActionDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-applicationAction" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{applicationAction.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{applicationAction.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="applicationActionDataScroller" layout="none">
			<aon:dataScroller2 for="applicationActionData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
