<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="itemStockForm">
		<aon:div id="itemStockContainer">
			<rich:modalPanel id="itemStockPanel" top="100" left="100"
				rendered="#{itemStock.panelVisible}" showWhenRendered="true"
				minHeight="100" minWidth="100" height="300" width="600"
				zindex="1000">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<h:outputText value="#{warehouseBundle.warehouse_stock_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close"
						actionListener="#{itemStock.onHidePanel}"
						reRender="itemStockContainer" immediate="true">
					</aon:commandButton>
				</f:facet>
				<aon:div styleClass="aon-scroll-area" style="width: 90%;">

					<aon:outputText value="#{bundle.aon_search_no_results}"
						style="aon-bold aon-margin-top"
						rendered="#{empty itemStock.list}" />
					
					<aon:dataTable id="itemStockList" value="#{itemStock.list}"
						var="to" rows="20" rendered="#{!empty itemStock.list}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn aon-width-100,
						aon-editDataTable-textColumn, aon-editDataTable-numberColumn">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_warehouse}" />
							</f:facet>
							<aon:outputText value="#{to.warehouse.name}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.item.product.code}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_item}" />
							</f:facet>
							<aon:outputText value="#{to.item.product.name} #{to.item.detail}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:panelGroup>
									<aon:outputText value="#{bundle.aon_quantity}" />
								</aon:panelGroup>
							</f:facet>
							<aon:outputText value="#{to.quantity}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>

					</aon:dataTable>
				</aon:div>
			</rich:modalPanel>
		</aon:div>
	</aon:form>
</ui:composition>
