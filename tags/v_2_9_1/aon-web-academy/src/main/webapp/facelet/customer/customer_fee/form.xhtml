<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar" forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{customerFee.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							forceId="#{true}" immediate="#{customerFee.new?(true):(false)}"
							actionListener="#{customerFee.onCancel}" action="economic_data"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
							accesskey="#{bundle.aon_key_cancel}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" immediate="true"
							rendered="#{!customerFee.new}"
							actionListener="#{customerFee.onRemove}" action="economic_data"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							accesskey="#{bundle.aon_key_remove}" />
						<t:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!customerFee.new}"
							actionListener="#{customerFee.onReset}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'"
							accesskey="#{bundle.aon_key_new}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Item_Lookup_product_code"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.fee_item}" />
						<t:div>
							<t:inputText id="Item_Lookup_product_code" size="15" forceId="#{true}"
								styleClass="aon-form-input-text" maxlength="15"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','itemLookup','Item_Lookup_product_code','Item_product_code|Item_Lookup_product_code,Item_id|Item_Lookup_id,Item_price|Item_Lookup_price,Item_full_name|Item_full_name');"
								value="#{customerFee.to.item.product.code}" />
							<h:commandButton id="find_Item_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{itemLookup.encodedSearchPagePath}','Item_product_code|Item_Lookup_product_code,Item_id|Item_Lookup_id,Item_price|Item_Lookup_price,Item_full_name|Item_full_name');return false;" />
							<t:inputHidden id="Item_Lookup_id" forceId="#{true}"
								value="#{customerFee.to.item.id}" required="true" />
							<t:inputText id="Item_full_name" forceId="#{true}"
								styleClass="aon-form-input-text"
								size="64" value="#{customerFee.to.description}" />
						</t:div>
		
						<t:outputLabel for="CustomerFee_quantity"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.fee_quantity}" />
						<t:inputText id="CustomerFee_quantity" 
							styleClass="aon-form-input-text"
							value="#{customerFee.to.quantity}" 
							required="#{true}" forceId="#{true}" size="10" >
							<f:validateDoubleRange />
						</t:inputText>

						<t:outputLabel for="Item_Lookup_price"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.aon_customer_fee_price}" />
						<t:inputText id="Item_Lookup_price" 
							styleClass="aon-form-input-text"
							value="#{customerFee.to.price}" 
							required="#{true}" forceId="#{true}" size="10" >
							<f:validateDoubleRange />
						</t:inputText>

						<t:outputLabel for="CustomerFee_discountExpression"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.fee_discount_expr}" />
						<h:inputText id="CustomerFee_discountExpression" 
							styleClass="aon-form-input-text" size="10"
							value="#{customerFee.to.discountExpression.discountExpr}" />

						<t:outputLabel for="CustomerFee_initialDate"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.aon_initial_date_abrv}" />
						<t:inputCalendar id="CustomerFee_initialDate"
							size="8" required="true"
							value="#{customerFee.to.initialDate}"
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell" renderAsPopup="true"
							styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}" />

						<t:outputLabel for="CustomerFee_finalDate"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.aon_final_date_abrv}" />
						<t:inputCalendar id="CustomerFee_finalDate"
							size="8" value="#{customerFee.to.finalDate}"
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell" renderAsPopup="true"
							styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}" />
							
						<t:outputLabel for="CustomerFee_billingDate"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.aon_billing_date_abrv}" />
						<t:div>
							<h:selectOneMenu id="CustomerFee_billingDate" 
								value="#{customerFee.to.billingDateMonth}"
								styleClass="aon-form-selectOneMenu-field">
								<f:selectItems value="#{salesCollections.months}" />
							</h:selectOneMenu>
							<h:outputLabel for="BillingDate_Year"
								value="#{customerBundle.aon_year}:" />
							<h:inputText id="BillingDate_Year" required="true"
								styleClass="aon-form-input-text" size="5"
								value="#{customerFee.to.billingDateYear}" />
						</t:div>
						
						<t:outputLabel for="CustomerFee_period"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.fee_period}" />
						<h:selectOneMenu id="CustomerFee_period" 
							value="#{customerFee.to.period}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{salesCollections.billingPeriods}" />
						</h:selectOneMenu>	

						<t:outputLabel for="CustomerFee_securityLevel"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.security_level}" />
						<h:selectOneMenu id="CustomerFee_securityLevel" 
							value="#{customerFee.to.securityLevel}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{financeCollections.securityLevels}" />
						</h:selectOneMenu>	

						<t:outputLabel for="CustomerFee_workPlace_id"
							styleClass="aon-form-input-text-label"
							value="#{customerBundle.aon_customer_fee_workplace_abrv}" />
						<h:selectOneMenu id="CustomerFee_workPlace_id"
							value="#{customerFee.to.workPlace.id}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{companyCollections.workPlacesDetailed}" />
						</h:selectOneMenu>	

					</h:panelGrid>

				</t:div>
			</t:div>

</ui:composition>

</body>
</html>
