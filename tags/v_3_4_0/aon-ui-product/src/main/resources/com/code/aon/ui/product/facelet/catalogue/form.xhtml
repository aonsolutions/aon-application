<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="catalogueForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{productBundle.product_catalogue_module}" />
				<ui:param name="controller" value="#{catalogue}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Catalogue_name" value="#{bundle.aon_description}" />
					<aon:inputText id="Catalogue_name" value="#{catalogue.to.name}"
						required="true" size="32" maxLength="32" />

					<aon:outputLabel for="Catalogue_startDate" value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="Catalogue_startDate"
						value="#{catalogue.to.startDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Catalogue_endDate" value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="Catalogue_endDate"
						value="#{catalogue.to.endDate}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

				</aon:panelGrid>

				<c:if test="#{!catalogue.new}">
					<aon:panelTabSet id="catalogueTab">

						<aon:panelTab id="catalogue_items" label="#{productBundle.product_module}">
							<ui:include src="/com/code/aon/ui/product/facelet/catalogue/formItem.xhtml">
								<ui:param name="dataTableId" value="catalogueItemDataList" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="catalogue_categories" label="#{productBundle.product_category_module}">
							<ui:include src="/com/code/aon/ui/product/facelet/catalogue/formCategory.xhtml">
								<ui:param name="dataTableId" value="catalogueCategoryDataList" />
							</ui:include>
						</aon:panelTab>

					</aon:panelTabSet>
				</c:if>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
