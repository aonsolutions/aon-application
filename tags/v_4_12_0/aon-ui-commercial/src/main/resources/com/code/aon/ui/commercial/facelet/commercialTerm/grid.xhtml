<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialTermList">

			<aon:div ajaxRendered="true" layout="none">
			
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_term_module}" />
					<ui:param name="controller" value="#{commercialTerm}" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{commercialTerm}" />
						<ui:param name="columnClasses" value="aon-width-60,aon-width-200 aon-editDataTable-textColumn,
							aon-editDataTable-textColumn,aon-width-60 aon-editDataTable-iconColumn" />
						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.id}" />
								<f:facet name="footer">
									<aon:outputText value="&#160;" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="CommercialTerm_name"
										value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText value="#{to.name}" rendered="#{formList}" />
								<aon:inputText id="CommercialTerm_name" required="true"
									rendered="#{formEdit}" size="24"
									value="#{commercialTerm.to.name}" maxlength="64" />
								<f:facet name="footer">
									<aon:inputText id="CommercialTerm_name-New" required="true"
										rendered="#{formNew}" size="24"
										value="#{commercialTerm.to.name}" maxlength="64" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="CommercialTerm_description"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}" rendered="#{formList}" >
									<aon:abbreviateConverter maxWidth="80" />
								</aon:outputText>
								<aon:inputTextarea id="CommercialTerm_description" required="true"
									rendered="#{formEdit}" rows="4" cols="40"
									value="#{commercialTerm.to.description}"  />
								<f:facet name="footer">
									<aon:inputTextarea id="CommercialTerm_description-New" required="true"
										rendered="#{formNew}" rows="4" cols="40"
										value="#{commercialTerm.to.description}"  />
								</f:facet>
							</aon:column>
							
		 					<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="CommercialTerm_general"
										value="#{commercialBundle.commercial_offer_general}" />
								</f:facet>
								<aon:outputText rendered="#{formList}" value="&#160;"
									styleClass="#{(to.general)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}" />
								<aon:selectBooleanCheckbox id="CommercialTerm_general" 
									rendered="#{formEdit}" value="#{commercialTerm.to.general}" />									
								<f:facet name="footer">
									<aon:selectBooleanCheckbox id="CommercialTerm_particular-New" 
										rendered="#{formNew}" value="#{commercialTerm.to.general}" />									
								</f:facet>
							</aon:column>							
							
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
