<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{productBundle.product_module}" />
				<ui:param name="controller" value="#{item}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<ui:include
					src="/com/code/aon/ui/product/facelet/item/formContent.xhtml">
					<ui:param name="controller" value="#{item}" />
				</ui:include>

				<c:if test="#{aonConfiguration.bean.product.showAccount}">
					<aon:panelGrid styleClass="aon-margin-top" columns="2"
						style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-150,
							aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="Item_product_sales_account"
							value="#{productBundle.product_sales_account}" />
						<aon:div>
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="Item_product_sales_account" />
								<ui:param name="required" value="#{false}" />
								<ui:param name="size" value="9" />
								<ui:param name="maxlength" value="9" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{true}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity" value="#{item.to.product.salesAccount}" />
								<ui:param name="ELExpression"
									value="item.to.product.salesAccount" />
							</ui:include>
						</aon:div>

						<aon:outputLabel for="Item_product_purchase_account"
							value="#{productBundle.product_purchase_account}" />
						<aon:div>
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="Item_product_purchase_account" />
								<ui:param name="required" value="#{false}" />
								<ui:param name="size" value="9" />
								<ui:param name="maxlength" value="9" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{true}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity"
									value="#{item.to.product.purchaseAccount}" />
								<ui:param name="ELExpression"
									value="item.to.product.purchaseAccount" />
							</ui:include>
						</aon:div>
					</aon:panelGrid>
				</c:if>

				<c:if test="#{!item.new}">
					<c:if test="#{aonConfiguration.bean.product.showAttachment or 
									aonConfiguration.bean.product.showSuppliers or
									(aonConfiguration.bean.product.showStock and item.to.product.inventoriable)}">
						<aon:panelTabSet id="itemTab" selectedTab="#{item.selectedTab}">
							<c:if test="#{aonConfiguration.bean.product.showAttachment}">
								<aon:panelTab id="itemAttachPanelTab"
									label="#{productBundle.product_attachment}">
									<ui:include
										src="/com/code/aon/ui/product/facelet/item/attach/tab_grid.xhtml">
										<ui:param name="controller" value="#{itemAttach}" />
										<ui:param name="skipCategoryColumn" value="true" />
									</ui:include>
								</aon:panelTab>
							</c:if>

							<c:if test="#{aonConfiguration.bean.product.showStock and item.to.product.inventoriable}">
								<aon:panelTab id="itemWarehousePanelTab"
									label="#{warehouseBundle.warehouse_item_warehouse_module}">
									<ui:include
										src="/com/code/aon/ui/warehouse/facelet/itemwarehouse/tab_grid.xhtml">
									</ui:include>
								</aon:panelTab>

								<aon:panelTab id="itemAlternativePanelTab"
									label="#{productBundle.product_alternative_items}">
									<ui:include
										src="/com/code/aon/ui/product/facelet/item/alternative/tab_grid.xhtml">
									</ui:include>
								</aon:panelTab>
							</c:if>

							<c:if test="#{aonConfiguration.bean.product.showSuppliers}">
								<aon:panelTab id="itemSupplierPanelTab"
									label="#{supplierBundle.supplier_item_supplier_module}">
									<ui:include
										src="/com/code/aon/ui/supplier/facelet/item/tab_grid.xhtml">
									</ui:include>
								</aon:panelTab>
							</c:if>
						</aon:panelTabSet>
					</c:if>
				</c:if>

			</aon:div>
		</aon:form>

		<c:if test="#{aonConfiguration.bean.product.showStock}">
			<c:if test="#{!item.new and item.to.product.inventoriable}">
				<ui:include
					src="/com/code/aon/ui/warehouse/facelet/item/modalStock.xhtml" />
			</c:if>
			<aon:lookupButtonPopup lookup="#{itemLookup}" />
		</c:if>

		<c:if test="#{!item.new and aonConfiguration.bean.product.showSuppliers}">
			<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		</c:if>
		
	</ui:define>
</ui:composition>
