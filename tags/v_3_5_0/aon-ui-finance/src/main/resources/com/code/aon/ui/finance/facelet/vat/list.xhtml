<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_vat_report_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{vatReport.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="vat_report_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatBook" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatBook" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>

					<!-- 
					<h:commandLink value="#{financeBundle.finance_summary}" target="_blank"
						action="#{report.onExecute}"
						title="#{financeBundle.finance_vat_report_summary}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatSummaryBook" />
					</h:commandLink>

					<h:commandLink value="#{financeBundle.finance_summary}" target="_blank"
						action="#{report.onExecute}"
						title="#{financeBundle.finance_vat_report_summary}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatBook" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					 -->
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="vatReportList" value="#{vatReport.model}"
					rows="" var="to" rendered="#{vatReport.model.rowCount > 0}">

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.vatType}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_year}" />
						</f:facet>
						<aon:outputText value="#{to.year}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_quarter}" />
						</f:facet>
						<aon:outputText value="#{vatReport.quarterArray[to.quarter-1]}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_month}" />
						</f:facet>
						<aon:outputText value="#{vatReport.monthsArray[to.month-1]}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_taxable_base}" />
						</f:facet>
						<aon:outputText value="#{to.base}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="%" />
						</f:facet>
						<aon:outputText value="#{to.percent}">
							<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_surcharge}" />
						</f:facet>
						<aon:outputText value="#{to.surcharge}">
							<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_vat_quota}" />
						</f:facet>
						<aon:outputText value="#{to.vatQuota}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_surcharge_quota}" />
						</f:facet>
						<aon:outputText value="#{to.surchargeQuota}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{to.total}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
