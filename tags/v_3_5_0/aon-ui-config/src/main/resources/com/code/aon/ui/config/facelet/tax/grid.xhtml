<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="taxList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{configBundle.config_tax_module}" />
					<ui:param name="controller" value="#{tax}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{tax}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text" />

						<ui:define name="columns">

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Tax_name" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.name}"
									rendered="#{formList}" />
								<aon:inputText id="Tax_name" rendered="#{formEdit}"
									value="#{tax.to.name}" required="true" />
								<f:facet name="footer">
									<aon:inputText id="Tax_name-New" rendered="#{formNew}"
										value="#{tax.to.name}" required="true" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Tax_type" value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.type}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="Tax_type" rendered="#{formEdit}"
									required="true" value="#{tax.to.type}">
									<f:selectItems value="#{configCollections.taxTypes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Tax_type-New" rendered="#{formNew}"
										required="true" value="#{tax.to.type}">
										<f:selectItems value="#{configCollections.taxTypes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Tax_startDate" value="#{bundle.aon_date_from}" />
								</f:facet>
								<aon:outputText value="#{to.startDate}"
									rendered="#{formList}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:selectInputDate id="Tax_startDate"
									value="#{tax.to.startDate}" rendered="#{formEdit}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}"/>
								<f:facet name="footer">
									<aon:selectInputDate id="Tax_startDate-New"
										rendered="#{formNew}" value="#{tax.to.startDate}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}"/>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Tax_percentage" value="#{bundle.aon_percentage}" />
								</f:facet>
								<aon:outputText value="#{to.percentage}"
									rendered="#{formList}" />
								<aon:inputText id="Tax_percentage" rendered="#{formEdit}" size="6"
									value="#{tax.to.percentage}" required="true" />
								<f:facet name="footer">
									<aon:inputText id="Tax_percentage-New" rendered="#{formNew}" size="6"
										value="#{tax.to.percentage}" required="true" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Tax_surcharge" value="#{bundle.aon_surcharge}" />
								</f:facet>
								<aon:outputText value="#{to.surcharge}"
									rendered="#{formList}" />
								<aon:inputText id="Tax_surcharge" rendered="#{formEdit}"
									value="#{tax.to.surcharge}" required="true" />
								<f:facet name="footer">
									<aon:inputText id="Tax_surcharge-New" rendered="#{formNew}"
										value="#{tax.to.surcharge}" required="true" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
