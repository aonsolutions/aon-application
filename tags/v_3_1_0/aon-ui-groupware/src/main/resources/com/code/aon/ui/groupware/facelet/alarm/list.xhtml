<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="alarmList">
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{groupwareBundle.aon_alarm}" />
				</aon:div>

				<!-- end toolbar navigation -->
			</aon:panelGrid>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:dataTable id="alarmDataList"
						value="#{alarm.model}" var="to" rows="20"
						rendered="#{alarm.model.rowCount > 0}"
						styleClass="aon-dataTable">

						<aon:rowSelector selectionListener="#{alarm.onSelect}"/>
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.alarmDate}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.alarm_description}" />
							</f:facet>
							<aon:outputText value="#{to.descriptionHead}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.alarm_priority}" />
							</f:facet>
							<aon:outputText value="#{to.priority}" />
						</aon:column>

					</aon:dataTable>

					<aon:dataScroller for="alarmDataList" rowCount="#{alarm.model.rowCount}" showNote="true" />

				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>

</ui:composition>
