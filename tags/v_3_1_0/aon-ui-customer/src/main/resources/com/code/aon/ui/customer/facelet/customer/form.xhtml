<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{customerBundle.customer_module}" />
				<ui:param name="controller" value="#{customer}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Customer_id" value="#{bundle.aon_id}" />
					<aon:inputText id="Customer_id" value="#{customer.to.id}"
						required="#{true}" size="15" disabled="#{true}" />

					<aon:outputLabel for="Customer_document"
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_document"
						value="#{customer.to.registry.document}" size="16">
						<f:validateLength minimum="1" maximum="16" />
					</aon:inputText>

					<aon:outputLabel for="Customer_name" value="#{bundle.aon_name}" />
					<aon:inputText id="Customer_name"
						value="#{customer.to.registry.name}" size="64">
						<f:validateLength minimum="1" maximum="64" />
					</aon:inputText>

					<aon:outputLabel for="Customer_surname"
						value="#{registryBundle.registry_surname}" />
					<aon:inputText id="Customer_surname"
						value="#{customer.to.registry.surname}" size="64">
						<f:validateLength minimum="1" maximum="64" />
					</aon:inputText>

					<aon:outputLabel for="Customer_alias"
						value="#{bundle.aon_company_alias}" />
					<aon:inputText id="Customer_alias"
						value="#{customer.to.registry.alias}" size="32">
						<f:validateLength minimum="1" maximum="32" />
					</aon:inputText>

					<h:outputLabel for="Customer_scope_id"
						value="#{bundle.aon_scope}" />
					<h:selectOneMenu id="Customer_scope_id"
						value="#{customer.to.scope}">
						<f:selectItems value="#{configCollections.scopes}" />
					</h:selectOneMenu>

					<h:outputLabel for="Customer_status" value="#{bundle.aon_company_name}" />
					<h:selectOneMenu id="Customer_status" value="#{customer.to.status}">
						<f:selectItems value="#{customerCollections.customerStatuses}" />
					</h:selectOneMenu>

					<aon:outputLabel for="Customer_surcharge"
						value="#{customerBundle.customer_surcharge}" />
					<aon:selectBooleanCheckbox id="Customer_surcharge"
						value="#{customer.to.surcharge}" />

					<aon:outputLabel for="Observation"
						value="#{customerBundle.customer_observation}" />
					<aon:inputTextarea id="Observation" cols="51" rows="5"
						value="#{customerObservation.observation.comments}" />
				</aon:panelGrid>

				<c:if test="#{!customer.new}">
					<aon:panelTabSet id="customerTab">

						<aon:panelTab id="customer_address"
							label="#{registryBundle.registry_address_module}">
							<ui:include
								src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controllerAlias" value="#{customerAddress}" />
								<ui:param name="dataTableId" value="customerAddressDataList" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="medias" label="#{registryBundle.registry_media_module}">
							<ui:include
								src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controllerAlias" value="#{customerMedia}" />
								<ui:param name="dataTableId" value="customerMediaDataList" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="customer_finance"
							label="#{financeBundle.finance_data_module}">
							<ui:include
								src="/com/code/aon/ui/finance/facelet/rbank/tab_grid.xhtml">
								<ui:param name="controllerAlias" value="#{customerRbank}" />
								<ui:param name="dataTableId" value="customerRbankData" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
