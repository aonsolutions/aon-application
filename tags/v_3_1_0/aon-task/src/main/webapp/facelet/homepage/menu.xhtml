<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:panelGroup>
		<!-- main menu declaration  -->
		<aon:form>
			<aon:menuBar id="menu">
				<aon:dropDownMenu id="auxiliary" value="#{menuBundle.aon_auxiliary}"
					event="onclick" rendered="#{role.monitorRole}">
					<aon:menuItem id="dossier_type"
						value="#{menuBundle.aon_dossier_type}" action="dossier_type_list" />
					<aon:menuItem id="activity_type" value="#{menuBundle.aon_activity_type}"
						action="activity_type_standalone" />
					<aon:menuItem id="job_type" value="#{menuBundle.aon_job_type}"
						action="job_type" />
				</aon:dropDownMenu>
				<aon:dropDownMenu id="master" value="#{menuBundle.aon_master}"
					event="onclick" rendered="#{role.monitorRole}">
					<aon:menuItem id="customer" value="#{menuBundle.aon_customer}"
						action="customer"/>
					<aon:menuItem id="task" value="#{menuBundle.aon_task}"
						action="task"/>
					<aon:menuItem id="period_task"
						value="#{menuBundle.aon_period_task}" action="period_task"
						actionListener="#{periodTask.onReset}" />
<!-- 						
					<aon:menuItem id="task_monitor"
						value="#{menuBundle.aon_task_monitor}" action="task_monitor"
						actionListener="#{taskMonitor.onEditSearch}" />
 -->
				</aon:dropDownMenu>
				<aon:dropDownMenu id="timeManagement" rendered="#{role.monitorRole}"
					value="#{menuBundle.aon_time_management}" event="onclick">
					<aon:menuItem id="daily_tracking"
						value="#{menuBundle.aon_daily_tracking}" action="daily_tracking"
						actionListener="#{dailyTracking.onReset}" />
					<aon:menuItem id="daily_tracking_report"
						value="#{menuBundle.aon_daily_tracking_report}"
						actionListener="#{dailyTrackingReport.onResetReportSearch}"
						action="daily_tracking_report" />
				</aon:dropDownMenu>
				<aon:outputText value="&#160;" />
			</aon:menuBar>
		</aon:form>
	</aon:panelGroup>
</ui:composition>

</body>
</html>
