<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="customerList">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_customer}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="customer_form" actionListener="#{customer.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<h:commandButton id="search" value="#{bundle.aon_search}"
							action="customer_search"
							actionListener="#{customer.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:editDataTable id="customerDataList" value="#{customer.model}"
					var="to" rows="20"
					columnClasses="aon-editDataTable-iconColumn,
								aon-editDataTable-iconColumn,
									aon-editDataTable-text,
									aon-editDataTable-text,
									aon-editDataTable-text">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<h:commandButton
							styleClass="aon-icon-commandButton aon-icon-rowSelector"
							actionListener="#{customer.onSelect}" action="customer_form"
							value="">
						</h:commandButton>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.registry.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.aon_alias}" />
						</f:facet>
						<aon:outputText value="#{to.registry.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.registry.fullName}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.aon_cif}" />
						</f:facet>
						<aon:outputText value="#{to.registry.document}" />
					</aon:column>

				</aon:editDataTable>

				<aon:dataScroller for="customerDataList"
					rowCount="#{customer.model.rowCount}" showNote="true" />

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
