<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicePrintSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoice_print_module}" />
				<ui:param name="controller" value="#{invoicePrint}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{invoicePrint}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="Invoice_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:inputText id="Invoice_series"
							onblur="toUpperCase(this);"
							valueChangeListener="#{invoicePrint.addExpression}"
							size="4" maxlength="5">
						</aon:inputText>
						<aon:outputLabel for="Invoice_number_from"
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_from}:" />
						<aon:inputText id="Invoice_number_from"
							value="#{invoicePrintSearch.fromNumber}" size="7" />
						<aon:outputLabel for="Invoice_number_to"
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />							
						<aon:inputText id="Invoice_number_to"
							value="#{invoicePrintSearch.toNumber}" size="7" />
					</aon:div>
					
					<aon:outputLabel for="Customer_id"
						rendered="#{invoicePrintSearch.sales}"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup" rendered="#{invoicePrintSearch.sales}">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name" lookupProperty="registry"
							value="#{invoicePrintSearch.registry.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name" actionType="search"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							property="#{invoicePrintSearch.registry}" lookupProperty="registry">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(invoicePrintSearch.registry.name!=null)?(invoicePrintSearch.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputLabel for="Supplier_id"
						rendered="#{!invoicePrintSearch.sales}"
						value="#{supplierBundle.supplier_supplier}" />
					<aon:div styleClass="aon-lookup" rendered="#{!invoicePrintSearch.sales}">
						<aon:lookupInputText id="Supplier_id" lookup="#{supplierLookup}"
							reRender="Supplier_full_name" lookupProperty="registry"
							value="#{invoicePrintSearch.registry.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{supplierBundle.supplier_selection}"
							selectReRender="Supplier_id,Supplier_full_name" actionType="search"
							lookup="#{supplierLookup}" minHeight="460" minWidth="650"
							property="#{invoicePrintSearch.registry}" lookupProperty="registry">
						</aon:lookupButton>
						<aon:inputText id="Supplier_full_name"
							value="#{(invoicePrintSearch.registry.name!=null)?(invoicePrintSearch.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Invoice_fromDate" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Invoice_fromDate"
							value="#{invoicePrintSearch.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Invoice_toDate" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Invoice_toDate"
							value="#{invoicePrintSearch.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
				
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />		
	</ui:define>
	
</ui:composition>
