<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financePaymentSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_finance_payment_module}" />
				<ui:param name="controller" value="#{financePayment}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{financePayment}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="Finance_payment"
						value="#{financeBundle.finance_payment} / #{financeBundle.finance_charge}" />
					<aon:selectOneRadio id="Finance_payment" value="#{financePaymentSearch.payment}"
						reRender="aonSearchContent">
						<f:selectItem itemLabel="#{financeBundle.finance_payment}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{financeBundle.finance_charge}" itemValue="#{false}" />
					</aon:selectOneRadio>						

					<aon:outputLabel for="Customer_id"
						rendered="#{!financePaymentSearch.payment}"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup" rendered="#{!financePaymentSearch.payment}">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name"
							value="#{financePaymentSearch.customer.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name" actionType="search"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							property="#{financePaymentSearch.customer}">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(financePaymentSearch.customer.registry.name!=null)?(financePaymentSearch.customer.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>
					
					<aon:outputLabel for="Supplier_id"
						rendered="#{financePaymentSearch.payment}"
						value="#{supplierBundle.supplier_supplier}" />
					<aon:div styleClass="aon-lookup" rendered="#{financePaymentSearch.payment}">
						<aon:lookupInputText id="Supplier_id" lookup="#{supplierLookup}"
							reRender="Supplier_full_name"
							value="#{financePaymentSearch.supplier.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{supplierBundle.supplier_selection}"
							selectReRender="Supplier_id,Supplier_full_name" actionType="search"
							lookup="#{supplierLookup}" minHeight="460" minWidth="650"
							property="#{financePaymentSearch.supplier}">
						</aon:lookupButton>
						<aon:inputText id="Supplier_full_name"
							value="#{(financePaymentSearch.supplier.registry.name!=null)?(financePaymentSearch.supplier.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputLabel for="Finance_invoice_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:inputText id="Finance_invoice_series"
							valueChangeListener="#{financePayment.addExpression}" size="4" />
						<aon:div layout="inline" styleClass="aon-padding-left">								
							<aon:inputText id="Finance_invoice_number"
								valueChangeListener="#{financePayment.addExpression}" size="7" />
						</aon:div>
					</aon:div>
					
					<aon:outputLabel 
						value="#{financeBundle.finance_finance_date}" />
					<aon:div>
						<aon:outputLabel for="Finance_dueDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Finance_dueDate-From"
							value="#{financePaymentSearch.dueDateFrom}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Finance_dueDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Finance_dueDate-To"
							value="#{financePaymentSearch.dueDateTo}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

				</ui:define>

			</ui:decorate>
			
		</aon:form>
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
