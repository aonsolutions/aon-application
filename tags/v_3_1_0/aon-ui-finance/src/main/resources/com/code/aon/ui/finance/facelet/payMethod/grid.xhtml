<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="bankList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{financeBundle.finance_pay_methods}" />
					<ui:param name="controller" value="#{payMethod}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{payMethod}" />
						<ui:param name="columnClasses" value="aon-editDataTable-text,aon-editDataTable-text" />

						<ui:define name="columns">

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText value="#{to.name}" rendered="#{to.id!=payMethod.to.id}" />
								<aon:inputText rendered="#{to.id==payMethod.to.id}"
									size="40" maxlength="32"
									value="#{payMethod.to.name}" required="true" />
								<f:facet name="footer">
									<aon:inputText rendered="#{payMethod.new}"										 
										size="40" maxlength="32"
										value="#{payMethod.to.name}" required="true" />
								</f:facet>
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.type}" rendered="#{to.id!=payMethod.to.id}" />
								<aon:selectOneMenu rendered="#{to.id==payMethod.to.id}"
									value="#{payMethod.to.type}">
									<f:selectItems value="#{configCollections.payMethodTypes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu rendered="#{payMethod.new}"
										value="#{payMethod.to.type}" >
										<f:selectItems value="#{configCollections.payMethodTypes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
