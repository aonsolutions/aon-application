<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<c:if
		test="#{saleInvoiceDetail.model.rowCount > 0 or saleInvoiceFinance.model.rowCount>0}">
		<aon:panel
			styleClass="aon-margin-top aon-margin-left aon-margin-right">
			<f:facet name="header">
				<aon:outputText value="#{financeBundle.finance_finances}" />
			</f:facet>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="dataTableId" value="invoiceFinances" />
				<ui:param name="controller" value="#{saleInvoiceFinance}" />
				<ui:param name="rows" value="0" />
				<ui:param name="showNote" value="false" />
				<ui:param name="showDataScroller" value="false" />
				<ui:param name="skipResetButton" value="#{saleInvoice.recorded}" />
<!-- 				
				<ui:param name="skipLineEdition"
					value="#{saleInvoiceFinance.modelToEditable}" />
 -->
				<ui:param name="saveButtonReRender" value="Invoice_total" />
				<ui:param name="columnClasses"
					value="aon-editDataTable-textColumn aon-width-150
					aon-editDataTable-textColumn aon-width-150
					aon-editDataTable-textColumn aon-width-150
					aon-editDataTable-textColumn aon-width-150
					aon-editDataTable-textColumn aon-width-150
					aon-editDataTable-numberColumn aon-width-80" />

				<ui:define name="columns">


					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:outputText value="#{to.payMethod.name}"
							rendered="#{to.id!=saleInvoiceFinance.to.id}" />
						<aon:selectOneMenu value="#{saleInvoiceFinance.to.payMethod}"
							rendered="#{to==saleInvoiceFinance.to}">
							<f:selectItems value="#{configCollections.payMethods}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu value="#{saleInvoiceFinance.to.payMethod}"
								rendered="#{saleInvoiceFinance.new}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_bank}" />
						</f:facet>
						<aon:outputText value="#{to.bank.name}"
							rendered="#{to.id!=saleInvoiceFinance.to.id}" />
						<aon:selectOneMenu id="RegistryBank-Edit"
							value="#{saleInvoiceFinance.registryBank}"
							rendered="#{to==saleInvoiceFinance.to}"
							valueChangeListener="#{saleInvoiceFinance.onBankChanged}"
							reRender="BankAccount-Edit">
							<f:selectItem value="#{nullItem.value}" />
							<f:selectItems value="#{saleInvoiceFinance.registryBanks}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="RegistryBank-New"
								value="#{saleInvoiceFinance.registryBank}"
								rendered="#{saleInvoiceFinance.new}"
								valueChangeListener="#{saleInvoiceFinance.onBankChanged}"
								reRender="BankAccount-New">
								<f:selectItem value="#{nullItem.value}" />
								<f:selectItems value="#{saleInvoiceFinance.registryBanks}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<h:outputText value="#{financeBundle.finance_bank_account}" />
						</f:facet>
						<aon:outputText value="#{to.bankAccount}"
							rendered="#{to.id!=saleInvoiceFinance.to.id}" />


						<aon:div id="BankAccount-Edit"
							rendered="#{to==saleInvoiceFinance.to}">
							<aon:inputText
								value="#{saleInvoiceFinance.to.bankAccount.entity}" size="4"
								maxlength="4">
								<f:validateLength minimum="4" maximum="4" />
							</aon:inputText>
							<aon:inputText
								value="#{saleInvoiceFinance.to.bankAccount.office}" size="4"
								maxlength="4">
								<f:validateLength minimum="4" maximum="4" />
							</aon:inputText>
							<aon:inputText
								value="#{saleInvoiceFinance.to.bankAccount.control}" size="2"
								maxlength="2">
								<f:validateLength minimum="2" maximum="2" />
							</aon:inputText>
							<aon:inputText
								value="#{saleInvoiceFinance.to.bankAccount.account}" size="10"
								maxlength="10">
								<f:validateLength minimum="10" maximum="10" />
							</aon:inputText>
						</aon:div>

						<f:facet name="footer">
							<aon:div id="BankAccount-New"
								rendered="#{saleInvoiceFinance.new}">
								<aon:inputText
									value="#{saleInvoiceFinance.to.bankAccount.entity}" size="4"
									maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText
									value="#{saleInvoiceFinance.to.bankAccount.office}" size="4"
									maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText
									value="#{saleInvoiceFinance.to.bankAccount.control}" size="2"
									maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText
									value="#{saleInvoiceFinance.to.bankAccount.account}" size="10"
									maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<h:outputText value="#{financeBundle.finance_finance_date}" />
						</f:facet>
						<aon:outputText value="#{to.dueDate}"
							rendered="#{to.id!=saleInvoiceFinance.to.id}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:selectInputDate id="Finance_dueDate-Edit"
							value="#{saleInvoiceFinance.to.dueDate}"
							rendered="#{to.id==saleInvoiceFinance.to.id}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<f:facet name="footer">
							<aon:selectInputDate id="Finance_dueDate-New"
								value="#{saleInvoiceFinance.to.dueDate}"
								rendered="#{saleInvoiceFinance.new}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.financeStatus}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.amount}"
							rendered="#{to.id!=saleInvoiceFinance.to.id}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="Finance_amount-Edit"
							rendered="#{to.id==saleInvoiceFinance.to.id}" size="10"
							value="#{saleInvoiceFinance.to.amount}" />
						<f:facet name="footer">
							<aon:inputText id="Finance_amount-New"
								rendered="#{saleInvoiceFinance.new}" size="10"
								value="#{saleInvoiceFinance.to.amount}" />
						</f:facet>
					</aon:column>

				</ui:define>
			</ui:decorate>
		</aon:panel>
	</c:if>
</ui:composition>
