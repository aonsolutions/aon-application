<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">


	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{controllerAlias}" />
		<ui:param name="columnClasses"
			value="aon-editDataTable-textColumn aon-vertical-align-top aon-width-40 aon-nowrap,
			aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap,
			aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap" />
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.registry_media_type}" />
				</f:facet>
				<aon:outputText value="#{to.mediaType}"
					rendered="#{to!=controllerAlias.to}" />
				<aon:selectOneMenu value="#{controllerAlias.to.mediaType}"
					rendered="#{to==controllerAlias.to}">
					<f:selectItems value="#{registryCollections.mediaTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu value="#{controllerAlias.to.mediaType}"
						rendered="#{controllerAlias.new}">
						<f:selectItems value="#{registryCollections.mediaTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_value}" />
				</f:facet>
				<aon:outputText value="#{to.value}"
					rendered="#{to!=controllerAlias.to}" />
				<aon:inputText value="#{to.value}"
					rendered="#{to==controllerAlias.to}" required="true" size="40"
					onblur="toLowerCase(this);" />
				<f:facet name="footer">
					<aon:inputText id="Media" value="#{controllerAlias.to.value}"
						rendered="#{controllerAlias.new}" required="true" size="40"
						onblur="toLowerCase(this);" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_comment}" />
				</f:facet>
				<aon:outputText value="#{to.comment}"
					rendered="#{to!=controllerAlias.to}" />
				<aon:inputText value="#{to.comment}"
					rendered="#{to==controllerAlias.to}" size="40" />
				<f:facet name="footer">
					<aon:inputText value="#{controllerAlias.to.comment}"
						rendered="#{controllerAlias.new}" size="40" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>
</ui:composition>
