<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="geotreeParentForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{geozoneBundle.geozone_module}" />
				<ui:param name="controller" value="#{geotreeParent}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">
					<aon:outputLabel for="GeoTree_parent_child_name" 
						value="#{geozoneBundle.geozone_country}" />
					<aon:inputText id="GeoTree_parent_child_name" 
						value="#{geotreeParent.to.child.name}"
						required="#{true}" size="40" />
				</aon:panelGrid>

				<c:if test="#{!geotreeParent.new}">
					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{geozoneBundle.geozone_provinces}"/>
						</aon:div>
						<aon:div styleClass="aon-group-body"> 
							<aon:div styleClass="aon-group-body-internal">
								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
									<ui:param name="controller" value="#{geotreeChild}" />
									<ui:param name="columnClasses"
										value="aon-editDataTable-textColumn aon-width-200" />
									<ui:define name="columns">

										<aon:column>
											<f:facet name="header">
												<aon:outputText value="#{geozoneBundle.geozone_province}" />
											</f:facet>
											<aon:outputText rendered="#{to!=geotreeChild.to}"
												value="#{to.child.name}" />
											<aon:inputText rendered="#{to==geotreeChild.to}" size="40" maxlength="32" 
												value="#{geotreeChild.to.child.name}" required="#{true}" />
											<f:facet name="footer">
												<aon:inputText rendered="#{geotreeChild.new}" size="40" maxlength="32" 
													value="#{geotreeChild.to.child.name}" required="#{true}" />
											</f:facet>
										</aon:column>

									</ui:define>
								</ui:decorate>
							</aon:div>
						</aon:div>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
