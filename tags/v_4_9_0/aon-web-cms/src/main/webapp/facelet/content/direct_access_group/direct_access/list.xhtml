<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="directAccessList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.direct_access}" />
				<ui:param name="controller" value="#{direct_access}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="generate" reRender="aonStatus"
						value="#{appBundle.aon_generate}" immediate="true"
						rendered="#{cms.roleEditor}"
						actionListener="#{generator.onGenerateDirectAccess}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<a4j:support 
							event="onclick" reRender="poll,grid" ajaxSingle="true"
							actionListener="#{generator_status.onActivePoll}"  
							onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
					</aon:commandButton>	
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="categories"
						value="#{appBundle.direct_access_group}"
						action="direct_access_group_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{direct_access_group.onSearch}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{direct_access}" />
					<ui:define name="columns">
					
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.direct_access_label}" />
							</f:facet>
							<aon:outputText value="#{direct_access.i18nLabel}" >
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.direct_access_group}" />
							</f:facet>
							<aon:outputText value="#{to.directAccessGroup.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-width-70 aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.direct_access_position}" />
							</f:facet>
							<aon:outputText value="#{to.position}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.direct_access_active}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();" >																				
								<aon:commandLink title="#{appBundle.direct_access_activate}" 
									action="direct_access_list"
									actionListener="#{direct_access.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="DirectAccess_active" alt="#{appBundle.direct_access_activate}"
										url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.direct_access_deactivate}" 
									action="direct_access_list"
									actionListener="#{direct_access.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="DirectAccess_deactive" alt="#{appBundle.direct_access_deactivate}"
										url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>

		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
		
	</ui:define>

</ui:composition>

</body>
</html>
