<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{articleRelated}" />
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
		<ui:param name="skipSaveButton" value="#{!articleRelated.new}" />
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="ArticleRelated_Name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.articleRelated.alias}" />
				<f:facet name="footer">
					<aon:selectOneMenu id="ArticleRelated_Name" 
						rendered="#{formNew}" value="#{articleRelated.to.articleRelated.id}">
						<f:selectItems value="#{collections.articleList}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
