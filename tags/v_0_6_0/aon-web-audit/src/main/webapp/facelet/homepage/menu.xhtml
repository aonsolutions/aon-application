<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:form id="menuForm">
	
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid dir="true"
				columnClasses="aon-finding-toolbar">

				<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">
					<aon:commandButton id="domain" value="#{menuBundle.aon_domains}"
						immediate="true" action="domain" actionListener="#{domain.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-domains" />
					<aon:commandButton id="application" value="#{menuBundle.aon_applications}"
						immediate="true" action="application" actionListener="#{auditApplication.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-applications" />
					<aon:commandButton id="session" value="#{menuBundle.aon_sessions}"
						immediate="true" action="session" actionListener="#{auditSession.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-sessions" />
				</aon:div>

			</aon:panelGrid>
		</aon:div>

	</aon:form>

</ui:composition>

</body>
</html>
