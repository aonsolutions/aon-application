<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-table-hack">
		<t:dataTable id="inboxDailyTrackingDataList" cellpadding="0" cellspacing="0"
			var="to" value="#{inboxDailyTracking.model}" rows="20"
			styleClass="aon-table" headerClass="aon-table-header"
			rowClasses="aon-table-row-odd,aon-table-row-even"
			columnClasses="aon-table-body aon-table-body-string,
				aon-table-body aon-table-body-number,
				aon-table-body aon-table-body-string">
 
	 		<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{customerBundle.customer_customer}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{to.dossier.customer.registry.name} #{to.dossier.customer.registry.surname}"/>
			</h:column>
			
			<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{projectBundle.aon_daily_tracking_duration}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{to.trackingDuration}"/>
			</h:column>
			
			<h:column>
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="#{projectBundle.aon_daily_tracking_job_type}" />
					</h:panelGroup>
				</f:facet>
				<h:outputText value="#{to.jobType.description}"/>
			</h:column>
			
		</t:dataTable>
	</t:div>
		
</ui:composition>
</body>
</html>
