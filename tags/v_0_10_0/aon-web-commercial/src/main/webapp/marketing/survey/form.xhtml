<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="surveyForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{marketingBundle.aon_marketing_surveis}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{survey.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="survey_form"
							actionListener="#{survey.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{survey.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{survey.onCancel}"
							confirmAction="survey_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!survey.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{survey.onRemove}"
							confirmAction="survey_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!survey.new}" immediate="true"
							action="survey_search" actionListener="#{survey.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!survey.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{survey.onCancel}"
							action="survey_list"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:spin controller="#{survey}" action="survey_form" rendered="#{!survey.new}" />
							
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<aon:outputLabel for="Survey_id"
						rendered="#{!survey.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Survey_id" value="#{survey.to.id}"
						rendered="#{!survey.new}" size="15" disabled="true" />

					<aon:outputLabel for="Survey_creationDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Survey_creationDate" required="true"
						value="#{survey.to.creationDate}" timeZone="#{timeZoneController.timeZone}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>		
						
					<aon:outputLabel for="Survey_text"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="Survey_text" required="true"
						value="#{survey.to.description}" cols="60" rows="4" >
						<f:validateLength  maximum="64"/>
					</aon:inputTextarea>
					
					<aon:outputLabel for="Survey_active"
						value="#{marketingBundle.aon_active}" />
					<aon:selectBooleanCheckbox id="Survey_active" 
						value="#{survey.to.active}" />

				</aon:panelGrid>

				<aon:panelTabSet rendered="#{!survey.new}">

					<aon:panelTab name="surveyQuestion" label="#{marketingBundle.aon_marketing_questions}">
						<ui:include src="/marketing/survey/question/grid.xhtml" />
                    </aon:panelTab>

				</aon:panelTabSet>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{questionLookup}" />		
	</ui:define>
</ui:composition>

</body>
</html>
