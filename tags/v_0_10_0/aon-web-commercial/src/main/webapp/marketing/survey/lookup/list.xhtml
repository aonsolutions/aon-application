<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
					
	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}"/>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.creationDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>					
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}"/>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{marketingBundle.aon_active}" />
		</f:facet>
		<aon:outputText
			styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}" 
			value="&#160;" />
	</aon:column>
					
</ui:composition>
