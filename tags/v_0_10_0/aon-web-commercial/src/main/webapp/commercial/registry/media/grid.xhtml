<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="registryMediaData" var="to"
			value="#{controller.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{controller.to == null}"
				actionListener="#{controller.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{controller.onReset}" value=""
							rendered="#{!controller.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_media}" />
				</f:facet>
				<aon:outputText value="#{to.mediaType}"
					rendered="#{to!=controller.to}" />
				<aon:selectOneMenu rendered="#{to==controller.to}"
					value="#{controller.to.mediaType}">
					<f:selectItems value="#{registryCollections.mediaTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{controller.new}"
						value="#{controller.to.mediaType}">
						<f:selectItems value="#{registryCollections.mediaTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column width="200">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_value}" />
				</f:facet>
				<aon:outputText value="#{to.value}" rendered="#{to!=controller.to}" />
				<aon:inputText value="#{to.value}"
					rendered="#{to==controller.to}" required="true"
					maxlength="64" size="40" onblur="toLowerCase(this);" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText value="#{controller.to.value}" 
							rendered="#{controller.new}" required="true"
							maxlength="64" size="40" onblur="toLowerCase(this);" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="330">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_comment}" />
				</f:facet>
				<aon:outputText value="#{to.comment}" rendered="#{to!=controller.to}" />
				<aon:inputText value="#{to.comment}" size="40" maxlength="64"
					rendered="#{to==controller.to}" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText value="#{controller.to.comment}"
							rendered="#{controller.new}"
							size="40" maxlength="64" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=controller.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{controller.onAccept}" 
						rendered="#{to==controller.to}" value=""
						reRender="registryMediaDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==controller.to}"
						actionListener="#{controller.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-registryMedia" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==controller.to}" reRender="registryMediaDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{controller.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!controller.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{controller.onAccept}"
							rendered="#{controller.new}" value=""
							reRender="registryMediaDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-registryMedia" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{controller.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{controller.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="registryMediaDataScroller" layout="none" rendered="#{showDataScroller}">
			<aon:dataScroller2 for="registryMediaData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
