<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="targetSegmentData" var="to"
			value="#{targetSegment.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{targetSegment.to == null}"
				actionListener="#{targetSegment.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{targetSegment.onReset}" value=""
							rendered="#{!targetSegment.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.segment.name}"
					rendered="#{to!=targetSegment.to}" />
				<aon:selectOneMenu rendered="#{to==targetSegment.to}"
					required="true" value="#{to.segment.id}">
					<f:selectItem value="#{null}" itemLabel="    " />
					<f:selectItems value="#{target.segments}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{targetSegment.new}"
						required="true" value="#{targetSegment.to.segment.id}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{target.segments}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=targetSegment.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{targetSegment.onAccept}" 
						rendered="#{to==targetSegment.to}" value=""
						reRender="targetSegmentDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-targetSegment" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==targetSegment.to}"
						actionListener="#{targetSegment.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-targetSegment" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==targetSegment.to}" reRender="targetSegmentDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{targetSegment.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!targetSegment.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{targetSegment.onAccept}"
							rendered="#{targetSegment.new}" value=""
							reRender="targetSegmentDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-targetSegment" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{targetSegment.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{targetSegment.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="targetSegmentDataScroller" layout="none">
			<aon:dataScroller2 for="targetSegmentData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
