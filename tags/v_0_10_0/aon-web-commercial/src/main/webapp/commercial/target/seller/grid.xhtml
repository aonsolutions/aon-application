<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="targetSellerData" var="to"
			value="#{targetSeller.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{targetSeller.to == null}"
				actionListener="#{targetSeller.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{targetSeller.onReset}" value=""
							rendered="#{!targetSeller.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_commercial_tracking_seller}" />
				</f:facet>
				<aon:outputText value="#{to.seller.registry.fullName}"
					rendered="#{to!=targetSeller.to}" />
				<aon:div styleClass="aon-lookup" rendered="#{to==targetSeller.to}">
					<aon:lookupInputText id="TargetSeller_seller_id"
						lookup="#{sellerLookup}" required="true"
						reRender="TargetSeller_seller_detail"
						value="#{to.seller.id}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton
						windowTitle="#{appBundle.aon_lookup_item}"
						selectReRender="TargetSeller_seller_id,TargetSeller_seller_detail"
						lookup="#{sellerLookup}"
						property="#{to.seller}">
					</aon:lookupButton>
					<aon:inputText id="TargetSeller_seller_detail"
						value="#{(to.seller.registry.name!=null)?(to.seller.registry.fullName):('')}"
						size="80" disabled="true" />
				</aon:div>
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{targetSeller.new}">
						<aon:lookupInputText id="TargetSeller_seller_id-New"
							lookup="#{sellerLookup}" required="true"
							reRender="TargetSeller_seller_detail-New"
							value="#{targetSeller.to.seller.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{appBundle.aon_lookup_item}"
							selectReRender="TargetSeller_seller_id-New,TargetSeller_seller_detail-New"
							lookup="#{sellerLookup}"
							property="#{targetSeller.to.seller}">
						</aon:lookupButton>
						<aon:inputText id="TargetSeller_seller_detail-New"
							value="#{(targetSeller.to.seller.registry.name!=null)?(targetSeller.to.seller.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_target_seller_start_date}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}"	rendered="#{to!=targetSeller.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate rendered="#{to==targetSeller.to}"
					value="#{to.startDate}" required="true"
					timeZone="#{timeZoneController.timeZone}"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate rendered="#{targetSeller.new}"
						value="#{targetSeller.to.startDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_target_seller_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}" rendered="#{to!=targetSeller.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate rendered="#{to==targetSeller.to}"
					value="#{to.endDate}" timeZone="#{timeZoneController.timeZone}"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate rendered="#{targetSeller.new}"
						value="#{targetSeller.to.endDate}" timeZone="#{timeZoneController.timeZone}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
					
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}"
					rendered="#{to!=targetSeller.to}" />
				<aon:selectOneMenu rendered="#{to==targetSeller.to}"
					required="true" value="#{to.status}">
					<f:selectItem value="#{null}" itemLabel="    " />
					<f:selectItems value="#{commecialCollections.targetSellerStatuses}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{targetSeller.new}"
						required="true" value="#{targetSeller.to.status}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{commecialCollections.targetSellerStatuses}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=targetSeller.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{targetSeller.onAccept}" 
						rendered="#{to==targetSeller.to}" value=""
						reRender="targetSellerDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-targetSeller" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==targetSeller.to}"
						actionListener="#{targetSeller.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-targetSeller" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==targetSeller.to}" reRender="targetSellerDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{targetSeller.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!targetSeller.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{targetSeller.onAccept}"
							rendered="#{targetSeller.new}" value=""
							reRender="targetSellerDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-targetSeller" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{targetSeller.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{targetSeller.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="targetSellerDataScroller" layout="none">
			<aon:dataScroller2 for="targetSellerData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
