<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="sellerSearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_sellers}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_toolbar_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="seller_form" actionListener="#{seller.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							action="seller_list" actionListener="#{seller.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{seller.onSearch}" type="actionListener"/>
					<aon:methodParam name="searchAction" value="seller_list" />
					
					<aon:outputLabel for="Seller_id"
						value="#{registryBundle.aon_id}" />
					<aon:inputText id="Seller_id" size="60"
						valueChangeListener="#{seller.addExpression}" />

					<aon:outputLabel for="Seller_registry_document"
						value="#{registryBundle.aon_nif}" />
					<aon:inputText id="Seller_registry_document" size="60"
						valueChangeListener="#{seller.addExpression}" onblur="toUpperCase(this);" />

					<aon:outputLabel for="Seller_registry_name"
						value="#{registryBundle.aon_name}" />
					<aon:inputText id="Seller_registry_name" size="60"
						valueChangeListener="#{seller.addExpression}" />

					<aon:outputLabel for="Seller_registry_surname"
						value="#{registryBundle.aon_surname}" />
					<aon:inputText id="Seller_registry_surname" size="60"
						valueChangeListener="#{seller.addExpression}" />

					<aon:outputLabel for="Seller_registry_alias"
						value="#{registryBundle.aon_alias}" />
					<aon:inputText id="Seller_registry_alias" size="60"
						valueChangeListener="#{seller.addExpression}" onblur="toUpperCase(this);" />

					<aon:outputLabel for="Seller_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Seller_description" size="60"
						valueChangeListener="#{seller.addExpression}" />
				</ui:define>
			
			</ui:decorate>

		</aon:form>
	</ui:define>
</ui:composition>
