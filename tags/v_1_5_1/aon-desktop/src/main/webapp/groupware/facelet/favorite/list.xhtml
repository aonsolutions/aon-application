<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteList">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{groupwareBundle.aon_favorite}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="favorite_search" actionListener="#{favorite.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="favorite_form" actionListener="#{favorite.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="favorite_category" value="#{groupwareBundle.aon_favorite_category}"
							immediate="true" action="favorite_category"
							styleClass="aon-finding-toolbar-item aon-icon-category"/>
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="favoriteDataList" value="#{favorite.model}"
					var="to" rows="20" rendered="#{favorite.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn
									aon-editDataTable-textColumn, aon-editDataTable-iconColumn">

					<aon:rowSelector action="favorite_form" actionListener="#{favorite.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.favorite_favorite_category}" />
						</f:facet>
						<aon:outputText value="#{to.favoriteCategory.description}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.favorite_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.favorite_url}" />
						</f:facet>
						<aon:outputText value="#{to.url}"/>
					</aon:column>

					<aon:column style="text-align:center">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink actionListener="#{favorite.onSelectUrl}" onclick="window.open('#{to.url}');">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon/aon-icon-file-entrance.png']}" style="border:0px;margin:2px;" alt="Abrir URL"/>
						</aon:commandLink>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller for="favoriteDataList" rowCount="#{favorite.model.rowCount}" showNote="true" />

			</aon:div>

		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
