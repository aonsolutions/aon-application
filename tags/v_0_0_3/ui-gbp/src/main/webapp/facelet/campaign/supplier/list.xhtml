<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<h:dataTable id="campaignSupplierDataTable" value="#{campaignSupplier.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{to==campaignSupplier.to}" />
			<aon:commandButton rendered="#{to!=campaignSupplier.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				actionListener="#{campaignSupplier.onSelect}" value="" immediate="true"
				reRender="campaignSupplierDataTable">
			</aon:commandButton>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						title="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset" value=""
						immediate="true" reRender="campaignSupplierDataTable"
						rendered="#{!campaignSupplier.new}" actionListener="#{campaignSupplier.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_campaign_supplier}" />
			</f:facet>
			<aon:outputText value="#{to.supplier.name}" rendered="#{to!=campaignSupplier.to}" />
			<aon:div layout="none">
				<aon:div styleClass="aon-lookup" rendered="#{to==campaignSupplier.to}">
					<aon:lookupInputText id="Supplier_id-Edit"
						lookup="#{supplierLookup}"
						value="#{campaignSupplier.to.supplier.id}" size="5"
						reRender="campaignSupplierDataTable">
					</aon:lookupInputText>
					<aon:lookupButton id="Supplier_Lookup-Edit"
						windowTitle="#{appBundle.gbp_campaign_supplier}"
						selectReRender="campaignSupplierDataTable"
						lookup="#{supplierLookup}" actionType="search"
						property="#{campaignSupplier.to.supplier}">
					</aon:lookupButton>
					<aon:inputText id="Supplier_name-Edit"
						value="#{campaignSupplier.to.supplier.name}"
						size="64" disabled="true" />
				</aon:div>
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{campaignSupplier.new}">
					<aon:lookupInputText id="Supplier_id-New"
						lookup="#{supplierLookup}"
						value="#{campaignSupplier.to.supplier.id}" size="5"
						reRender="Supplier_name-New">
					</aon:lookupInputText>
					<aon:lookupButton id="Supplier_Lookup-New" 
						windowTitle="#{appBundle.gbp_campaign_supplier}"
						selectReRender="Supplier_id-New, Supplier_name-New"
						lookup="#{supplierLookup}" actionType="search"
						property="#{campaignSupplier.to.supplier}">
					</aon:lookupButton>
					<aon:inputText id="Supplier_name-New"
						value="#{campaignSupplier.to.supplier.name}"
						size="64" disabled="true" />
				</aon:div>
			</f:facet>
		</aon:column>
		
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<f:verbatim rendered="#{to!=campaignSupplier.to}">&#160;</f:verbatim>
			<aon:div rendered="#{to==campaignSupplier.to}">
				<h:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
					styleClass="aon-editDataTable-button aon-icon-accept"
					reRender="campaignSupplierDataTable"
					actionListener="#{campaignSupplier.onAccept}" />
				<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					reRender="campaignSupplierDataTable" immediate="true"
					actionListener="#{campaignSupplier.onCancel}" />
				<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					reRender="campaignSupplierDataTable" immediate="true"
					actionListener="#{campaignSupplier.onRemove}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{campaignSupplier.new}">
					<f:verbatim rendered="#{!campaignSupplier.new}">&#160;</f:verbatim>
					<h:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="campaignSupplierDataTable"
						actionListener="#{campaignSupplier.onAccept}" />
					<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="campaignSupplierDataTable" immediate="true"
						actionListener="#{campaignSupplier.onCancel}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</h:dataTable>
	
	<aon:dataScroller dataTable="campaignSupplierDataTable" model="#{campaignSupplier.model}" />

</ui:composition>

</body>
</html>
