<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<h:dataTable id="supplierContactDataTable" value="#{supplierContact.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{to==supplierContact.to}" />
			<aon:commandButton rendered="#{to!=supplierContact.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				actionListener="#{supplierContact.onSelect}" value="" immediate="true"
				reRender="supplierContactDataTable">
			</aon:commandButton>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						title="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset" value=""
						immediate="true" reRender="supplierContactDataTable"
						rendered="#{!supplierContact.new}" actionListener="#{supplierContact.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_contact_type}" />
			</f:facet>
			<aon:outputText value="#{to.type}" rendered="#{to!=supplierContact.to}" />
			<aon:selectOneMenu value="#{supplierContact.to.type}"
				rendered="#{to==supplierContact.to}">
				<f:selectItems value="#{GBPCollections.contactTypes}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:div>
					<aon:selectOneMenu value="#{supplierContact.to.type}"
						rendered="#{supplierContact.new}">
						<f:selectItems value="#{GBPCollections.contactTypes}" />
					</aon:selectOneMenu>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_contact_value}" />
			</f:facet>
			<aon:outputText value="#{to.value}" rendered="#{to!=supplierContact.to}" />
			<aon:inputText value="#{to.value}"
				rendered="#{to==supplierContact.to}" size="64" maxlength="64" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{supplierContact.to.value}"
						rendered="#{supplierContact.new}" size="64" maxlength="64" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_contact_comment}" />
			</f:facet>
			<aon:outputText value="#{to.comment}" rendered="#{to!=supplierContact.to}" />
			<aon:inputText value="#{to.comment}"
				rendered="#{to==supplierContact.to}" size="64" maxlength="64" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{supplierContact.to.comment}"
						rendered="#{supplierContact.new}" size="64" maxlength="64" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<f:verbatim rendered="#{to!=supplierContact.to}">&#160;</f:verbatim>
			<aon:div rendered="#{to==supplierContact.to}">
				<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
					styleClass="aon-editDataTable-button aon-icon-accept"
					reRender="supplierContactDataTable"
					actionListener="#{supplierContact.onAccept}" />
				<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					reRender="supplierContactDataTable" immediate="true"
					actionListener="#{supplierContact.onCancel}" />
				<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					reRender="supplierContactDataTable" immediate="true"
					actionListener="#{supplierContact.onRemove}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{supplierContact.new}">
					<f:verbatim rendered="#{!supplierContact.new}">&#160;</f:verbatim>
					<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="supplierContactDataTable"
						actionListener="#{supplierContact.onAccept}" />
					<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="supplierContactDataTable" immediate="true"
						actionListener="#{supplierContact.onCancel}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</h:dataTable>

	<aon:dataScroller dataTable="supplierContactDataTable" model="#{supplierContact.model}" />

</ui:composition>

</body>
</html>
