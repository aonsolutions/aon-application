<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="customerSegmentList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{customerBundle.customer_segment_module}" />
					<ui:param name="controller" value="#{customerSegment}" />
				</ui:include>	

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{customerSegment}" />
						<ui:param name="columnClasses" value="aon-width-60,aon-editDataTable-textColumn aon-width-auto" />
						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.id}" />
								<f:facet name="footer">
									<aon:outputText value="&#160;" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="CustomerSegment_description"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{formList}" />
								<aon:inputText id="CustomerSegment_description" required="true"
									rendered="#{formEdit}" size="32"
									value="#{customerSegment.to.description}" maxlength="32" />
								<f:facet name="footer">
									<aon:inputText id="CustomerSegment_description-New" required="true"
										rendered="#{formNew}" size="32"
										value="#{customerSegment.to.description}" maxlength="32" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
