<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="productMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">

					<aon:panelGroup>
						<aon:panel headerClass="aon-panel-title">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_product}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="item" 
										action="item_search" actionListener="#{item.onEditSearch}"
										value="#{productBundle.product_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="productCategory" 
										action="productCategory" 
										value="#{productBundle.product_category_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="brand" 
										action="brand"
										value="#{productBundle.product_brand_module}" />
								</aon:div>
							</aon:div>
						</aon:panel>
	
								<aon:panel headerClass="aon-panel-title">
									<f:facet name="header">
										<aon:outputText value="#{productBundle.product_price_module}"/>
									</f:facet>					
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="tariff" 
												action="tariff_list" actionListener="#{tariff.onSearch}"
												value="#{productBundle.product_tariff_module}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="catalogue" 
												action="catalogue_search" actionListener="#{catalogue.onEditSearch}"
												value="#{productBundle.product_catalogue_module}" />
										</aon:div>
									</aon:div>
								</aon:panel>

					</aon:panelGroup>

					
				</aon:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
