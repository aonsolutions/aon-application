<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:s="http://myfaces.apache.org/sandbox"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">
		<h:form id="invoiceRecordingForm" styleClass="aon-form">

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<h:commandButton id="search" value="#{bundle.aon_search}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{invoiceRecording.onSearch}" action="invoice_recording_list"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>
			
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						
						<h:outputLabel for="Invoice_type"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_type}" />
						<t:selectOneMenu id="Invoice_type"
							value="#{invoiceRecording.recordingParams.invoiceType}"
							styleClass="aon-form-selectOneMenu-field" onchange="submit();">
							<f:selectItems value="#{invoiceRecording.invoiceTypes}" />
						</t:selectOneMenu>
						
						<h:outputLabel for="Invoice_series"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_series_number}" />
						<h:panelGrid columns="5">
							<t:inputText id="Invoice_series"
								value="#{invoiceRecording.recordingParams.series}"
								styleClass="aon-form-input-text" forceId="#{true}"
								size="5" maxlength="5" />
							<h:outputLabel for="Invoice_fromNumber"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_date_from}" />
							<t:inputText id="Invoice_fromNumber"
								value="#{invoiceRecording.recordingParams.fromNumber}"
								styleClass="aon-form-input-text" forceId="#{true}"
								size="7" maxlength="10" />
							<h:outputLabel for="Invoice_toNumber"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_date_to}" />
							<t:inputText id="Invoice_toNumber"
								value="#{invoiceRecording.recordingParams.toNumber}"
								styleClass="aon-form-input-text" forceId="#{true}"
								size="7" maxlength="10" />
						</h:panelGrid>
						
 						<t:outputLabel for="Customer_Lookup_id" 
							styleClass="aon-form-input-text-label"
							rendered="#{invoiceRecording.sales}"
 							value="#{customerBundle.customer_customer}" /> 
						<t:div rendered="#{invoiceRecording.sales}">
							<t:inputText id="Customer_Lookup_id" forceId="#{true}"
								value="#{invoiceRecording.recordingParams.registryId}"
								styleClass="aon-form-input-text" size="5" 
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"/>
							<h:commandButton id="find_Customer_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />	
							<t:inputText id="Customer_full_name"
								disabled="true" forceId="#{true}"
								styleClass="aon-form-input-text-disabled" size="40" />
						</t:div>

						<t:outputLabel for="Supplier_Lookup_id"
							styleClass="aon-form-input-text-label"
							rendered="#{!invoiceRecording.sales}"
							value="#{supplierBundle.aon_supplier}" />
						<t:div rendered="#{!invoiceRecording.sales}">
							<t:inputText id="Supplier_Lookup_id" size="5" forceId="#{true}"
								styleClass="aon-form-input-text"
								value="#{invoiceRecording.recordingParams.registryId}"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','supplierLookup','Supplier_Lookup_id','Supplier_id|Supplier_Lookup_id,Supplier_full_name|Supplier_full_name');"/>
							<h:commandButton id="find_Supplier_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{supplierLookup.encodedSearchPagePath}','Supplier_id|Supplier_Lookup_id,Supplier_full_name|Supplier_full_name');return false;" />	
							<t:inputText id="Supplier_full_name" forceId="#{true}"
								styleClass="aon-form-input-text-disabled"
								disabled="true" size="40"/>	 		
						</t:div>

						<h:outputLabel for="Invoicing_invoiceDate" 
							value="#{financeBundle.aon_invoice_date}"
							styleClass="aon-form-input-text-label" />
						<h:panelGrid columns="4">
							<h:outputLabel for="Invoicing_invoiceDateFrom" 
								value="#{financeBundle.finance_date_from}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Invoicing_invoiceDateFrom" size="10"
								value="#{invoiceRecording.recordingParams.fromDate}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />

							<h:outputLabel for="Invoicing_invoiceDateTo" 
								value="#{financeBundle.finance_date_to}"
								styleClass="aon-form-input-text-label" />
							<t:inputCalendar id="Invoicing_invoiceDateTo" size="10"
								value="#{invoiceRecording.recordingParams.toDate}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
						</h:panelGrid>
						
						<t:outputLabel for="Invoicing_securityLevel"
							styleClass="aon-form-selectOneMenu-label"
							value="#{financeBundle.aon_security_level}" />
						<h:selectOneMenu id="Invoicing_securityLevel"
							styleClass="aon-form-selectOneMenu-field"
							value="#{invoiceRecording.recordingParams.securityLevel}">
							<f:selectItems value="#{financeCollections.securityLevels}" />
						</h:selectOneMenu>

					</h:panelGrid>
				</t:div>
			</t:div>
			
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
