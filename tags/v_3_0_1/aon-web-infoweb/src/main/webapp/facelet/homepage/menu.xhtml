<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:h="http://java.sun.com/jsf/html"	
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	>
	
<body>

<ui:composition>
			
	<aon:form>
		<aon:div id="treeButtonsGrid" styleClass="aon-top-menu">
			
			<aon:commandLink id="company" 
				title="#{companyBundle.company_data_module}" action="company" 
				value="#{companyBundle.company_data_module}"
				actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
				<f:setPropertyActionListener value="#{false}" target="#{company.showFinanceRegistryBank}" />
				<f:setPropertyActionListener value="#{false}" target="#{company.showCompanyOtherData}" />
			</aon:commandLink>

			<aon:commandLink id="otherdata" 
				title="#{appBundle.aon_web_info_data}" action="otherdata" 
				value="#{appBundle.aon_web_info_data}"
				actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
			</aon:commandLink>

			<aon:commandLink id="images" 
				title="#{appBundle.aon_web_info_images}" action="images" 
				value="#{appBundle.aon_web_info_images}"
				actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
			</aon:commandLink>

			<aon:commandLink id="pages" 
				title="#{appBundle.aon_web_info_pages}" action="pages" 
				value="#{appBundle.aon_web_info_pages}"
				actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
			</aon:commandLink>

			<aon:commandLink id="templates" 
				title="#{appBundle.aon_web_info_template}" action="templates" 
				value="#{appBundle.aon_web_info_template}"
				styleClass="aon-top-menu-item">
				<aon:actionListener method="#{company.onLoad}" />
				<aon:actionListener method="#{webPageStyle.onLoad}" />
			</aon:commandLink>

			<aon:commandLink id="generate" 
				title="#{appBundle.aon_web_info_generate}" action="generate" 
				value="#{appBundle.aon_web_info_generate}"
				actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
			</aon:commandLink>
			
		</aon:div>
	</aon:form>
</ui:composition>

</body>
</html>
