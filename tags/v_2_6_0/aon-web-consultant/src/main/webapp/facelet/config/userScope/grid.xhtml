<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-form-group" rendered="#{!user.new}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="userScopeDataTable"
				rendered="#{!user.new}" value="#{configBundle.scope_scopes}" />
		</t:div>
		<t:div styleClass="aon-form-group-body">

			<t:dataTable id="userScopeDataTable" value="#{userScope.model}"
				var="to" rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				styleClass="aon-edit-table" headerClass="aon-edit-table-header"
				footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-edit-table-body aon-edit-table-body-icon,
						aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-buttons">

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<f:verbatim>&#160;</f:verbatim>
					<t:commandLink immediate="#{true}" rendered="#{to!=userScope.to}"
						styleClass="aon-table-row-selected"
						actionListener="#{userScope.onSelect}">
					</t:commandLink>
					<f:facet name="footer">
						<t:div>
							<t:commandButton id="reset"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
								value="" immediate="#{true}" rendered="#{!userScope.new}"
								actionListener="#{userScope.onReset}"
								accesskey="#{bundle.aon_key_new_line}">
							</t:commandButton>
						</t:div>
					</f:facet>
				</h:column>

				<t:column width="130">
					<f:facet name="header">
						<t:outputText value="#{configBundle.scope_scope}" />
					</f:facet>
					<t:outputText value="#{to.scope.description}"
						rendered="#{to!=userScope.to}" />
					<h:selectOneMenu value="#{userScope.to.scope.id}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{to==userScope.to}"
						valueChangeListener="#{userScope.onScopeChanged}">
						<f:selectItems value="#{configCollections.scopes}" />
					</h:selectOneMenu>
					<f:facet name="footer">
						<t:div>
							<h:selectOneMenu value="#{userScope.to.scope.id}"
								styleClass="aon-form-selectOneMenu-field"
								rendered="#{userScope.new}"
								valueChangeListener="#{userScope.onScopeChanged}">
								<f:selectItems value="#{configCollections.scopes}" />
							</h:selectOneMenu>
						</t:div>
					</f:facet>
				</t:column>

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:div>
						<f:verbatim rendered="#{to!=userScope.to}">&#160;</f:verbatim>

						<t:commandButton title="#{bundle.aon_save}"
							actionListener="#{userScope.onAccept}"
							rendered="#{to==userScope.to}" value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
							accesskey="#{bundle.aon_key_save_line}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{userScope.onCancel}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
							value="" rendered="#{to==userScope.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<t:commandButton title="#{bundle.aon_remove}"
							actionListener="#{userScope.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
							rendered="#{to==userScope.to}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
							value="" accesskey="#{bundle.aon_key_remove_line}" />
					</t:div>
					<f:facet name="footer">
						<t:div>
							<f:verbatim rendered="#{!userScope.new}">&#160;</f:verbatim>
							<t:commandButton title="#{bundle.aon_save}"
								actionListener="#{userScope.onAccept}"
								rendered="#{userScope.new}" value=""
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
								accesskey="#{bundle.aon_key_save_line}" />
							<t:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{userScope.onCancel}" immediate="#{true}"
								onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
								rendered="#{userScope.new}"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
						</t:div>
					</f:facet>
				</h:column>
			</t:dataTable>

			<ui:include src="/facelet/shared/dataScroller.xhtml">
				<ui:param name="dataTable" value="userScopeDataTable" />
				<ui:param name="model" value="#{userScope.model}" />
				<ui:param name="showNote" value="#{false}" />
			</ui:include>
		</t:div>
	</t:div>
</ui:composition>
</body>
</html>
