<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="modulaPageList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.modular_page}" />
				<ui:param name="controller" value="#{modular_page}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="generate" reRender="aonStatus"
						value="#{appBundle.aon_generate}" 
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<aon:actionListener method="#{generator.onGenerateModular}" />
						<a4j:support 
							event="onclick" reRender="poll,grid" 
							actionListener="#{generator_status.onActivePoll}"  
							onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
					</aon:commandButton>	
				</ui:define>
			</ui:decorate>		
		
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" rows="#{modular_page.pageLimit}" var="to"
					value="#{modular_page.model}" rendered="#{modular_page.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-iconColumn,
							aon-editDataTable-iconColumn">
			
					<aon:rowSelector
						action="modular_page_form" actionListener="#{modular_page.onSelect}" />
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.modular_page_label}" />
						</f:facet>
						<aon:outputText value="#{modular_page.i18nLabel}" >
							<aon:abbreviateConverter maxWidth="60" />
						</aon:outputText>												
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.section}" />
						</f:facet>
						<aon:outputText value="#{to.section.alias}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText for="Modular_page_homepage" 
								value="#{appBundle.modular_page_homepage}" />
						</f:facet>
						<aon:selectBooleanCheckbox id="Modular_page_homepage" 
							onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();"																									
							value="#{to.homepage}" rendered="#{!to.homepage}">
							<a4j:support 
								actionListener="#{modular_page.defaultHomepageChanged}"
								event="onclick" reRender="dataTable" />
						</aon:selectBooleanCheckbox>
						<aon:graphicImage id="default_blocked" rendered="#{to.homepage}"
							url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.modular_page_active}" />
						</f:facet>
						<aon:div rendered="#{!to.homepage}"
							onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																									
							<aon:commandLink title="#{appBundle.modular_page_activate}"
								action="modular_page_list" 
								actionListener="#{modular_page.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="modular_page_active" 
									alt="#{appBundle.modular_page_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.modular_page_deactivate}" 
								action="modular_page_list" 
								actionListener="#{modular_page.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="modular_page_deactive" 
									alt="#{appBundle.modular_page_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
						<aon:div rendered="#{to.homepage}">
							<aon:graphicImage rendered="#{to.homepage}"
								url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" 
								alt="#{appBundle.modular_page_homepage_blocked}"/>
						</aon:div>
					</aon:column>
					
				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>
		
		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
		
	</ui:define>

</ui:composition>

</body>
</html>
