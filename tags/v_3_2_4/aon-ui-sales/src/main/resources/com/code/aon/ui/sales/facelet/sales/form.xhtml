<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{salesBundle.sales_module}" />
				<ui:param name="controller" value="#{sales}" />
				<ui:param name="skipSaveButton" value="#{!sales.pending}" />
				<ui:param name="skipRemoveButton" value="#{!sales.pending}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="delivery"
						value="Hacer Albaran"
						actionListener="#{sales.createDelivery}" action="delivery_list"
						rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-sincronize" />
					<h:commandLink id="sales" value="#{bundle.aon_report}"
						target="_new" rendered="#{!sales.new}"
						action="#{report.onExecute}"
						disabled="#{salesDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-printer">
						<f:param name="reportKey" value="sales" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Sales_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="Sales_series" value="#{sales.to.series}"
							rendered="#{sales.new}"
							valueChangeListener="#{sales.onSeriesChanged}" reRender="Sales_number,Sales_securityLevel,Sales_workPlace">
							<f:selectItem itemValue="" itemLabel=" " />
							<f:selectItems value="#{configCollections.series}" />
						</aon:selectOneMenu>
						<aon:inputText id="Sales_series-Edit" value="#{sales.to.series}"
							rendered="#{!sales.new}" disabled="true" size="4" />
						<aon:inputText id="Sales_number" value="#{sales.to.number}"
							required="true" disabled="#{!sales.new}" size="7"
							styleClass="aon-margin-left" />

						<aon:selectOneMenu id="Sales_securityLevel" value="#{sales.to.securityLevel}"
							required="true" disabled="#{!sales.pending}"
							styleClass="aon-margin-left">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{sales.to.status}" />
 					</aon:div>

					<aon:outputLabel for="Sales_issueDate" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Sales_issueDate"
						value="#{sales.to.issueDate}" 
						required="true" disabled="#{!sales.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Sales_customer_id" value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Sales_customer_id" value="#{sales.to.customer.registry.id}"
							lookup="#{customerLookup}" ajaxSingle="true" reRender="Sales_customer_full_name,Sales_customer_registry_document,SalesAddress"
							lookupChangeListener="#{sales.customerData}" lookupProperty="registry"
							required="true" disabled="#{!sales.pending}" size="5" />
						<aon:lookupButton
							windowTitle="#{customerBundle.customer_selection}" actionType="search"
							property="#{sales.to.customer.registry}" selectReRender="Sales_customer_id,Sales_customer_full_name,Sales_customer_registry_document,SalesAddress"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							lookupChangeListener="#{sales.customerData}" lookupProperty="registry"
							disabled="#{!sales.pending}">
						</aon:lookupButton>
						<aon:inputText id="Sales_customer_full_name" 
							value="#{(sales.to.customer.registry.name!=null)?(sales.to.customer.registry.fullName):('')}"
							disabled="true" size="50" />
						<!-- FARSA BOTON -->
						<aon:commandButton
							value="Enviar"
							style="margin-left: 0.7em;"
							rendered="#{!sales.new and sales.to.customer.registry.email != null}"
							title="Enviar Mail a #{sales.to.customer.registry.email.value}"
							actionListener="#{sales.sendFarsaMail}"
							styleClass="aon-icon-commandButton aon-icon-mailForward"/>
						<aon:commandButton
							value="Sin Email"
							style="margin-left: 0.7em;"
							rendered="#{!sales.new and sales.to.customer.registry.email == null}"
							title="#{sales.to.customer.registry.fullName} no tiene eMail definido."
							styleClass="aon-icon-commandButton aon-icon-mailDelete"/>
						<!-- END FARSA BOTON -->
					</aon:div>

					<aon:outputLabel for="Sales_customer_registry_document" value="#{bundle.aon_company_document}" />
					<aon:inputText id="Sales_customer_registry_document" value="#{sales.to.customer.registry.document}"
						disabled="#{!sales.pending}" size="10" />

					<aon:outputLabel for="Sales_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="SalesAddress">
						<aon:selectOneMenu id="Sales_address" value="#{sales.to.shippingAddress}"
							rendered="#{sales.addressCount > 0}"
							disabled="#{!sales.pending}">
							<f:selectItems value="#{sales.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{sales.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Sales_workPlace" value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Sales_workPlace" value="#{sales.to.workPlace}"
						disabled="#{!sales.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_seller_id" value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Sales_seller_id" value="#{sales.to.seller.registry.id}"
							lookup="#{sellerLookup}" reRender="Sales_seller_full_name"
							lookupChangeListener="#{sales.sellerData}" lookupProperty="registry"
							disabled="#{!sales.pending}" size="5" />
						<aon:lookupButton
							windowTitle="#{salesBundle.sales_seller_selection}" actionType="search"
							property="#{sales.to.seller.registry}" selectReRender="Sales_seller_id,Sales_seller_full_name"
							lookup="#{sellerLookup}" minHeight="460" minWidth="650"
							lookupChangeListener="#{sales.sellerData}" lookupProperty="registry"
							disabled="#{!sales.pending}">
						</aon:lookupButton>
						<aon:inputText id="Sales_seller_full_name" 
							value="#{(sales.to.seller.registry.name!=null)?(sales.to.seller.registry.fullName):('')}"
							disabled="true" size="50" />
					</aon:div>

					<aon:outputLabel for="Sales_payMethod" value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="Sales_payMethod" value="#{sales.to.payMethod}"
						disabled="#{!sales.pending}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_type" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Sales_type" value="#{sales.to.documentType}"
						disabled="#{!sales.pending}">
						<f:selectItems value="#{salesCollections.documentTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_total" value="#{bundle.aon_total}" />
					<aon:outputText id="Sales_total" value="#{sales.totalPrice}" 
						styleClass="aon-bold">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>
			</aon:div>

			<aon:panel rendered="#{!sales.new}"
				styleClass="aon-padding-left aon-padding-right">
				<f:facet name="header">
					<aon:outputText value="#{salesBundle.sales_detail}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{salesDetail}" />
					<ui:param name="rows" value="0" />
					<ui:param name="showNote" value="false" />
					<ui:param name="skipResetButton" value="#{!sales.pending}" />
					<ui:param name="skipLineEdition" value="#{!sales.pending}" />
					<ui:param name="newSaveButtonReRender" value="Sales_total" />
					<ui:param name="saveButtonReRender" value="Sales_total" />
					<ui:param name="removeButtonReRender" value="Sales_total" />
					<ui:param name="focusOnAdd" value="SalesDetail_item_product_code-New" />
					<ui:param name="focusOnSelect" value="SalesDetail_item_product_code-Edit" />
					<ui:param name="columnClasses"
						value="aon-editDataTable-textColumn,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80" />

					<ui:define name="columns">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_item}" />
							</f:facet>
							<aon:outputText value="#{to.description}"
								rendered="#{to!=controller.to}" />
							<aon:div styleClass="aon-lookup" rendered="#{to==salesDetail.to}">
								<aon:lookupInputText id="SalesDetail_item_product_code-Edit" value="#{salesDetail.to.item.product.code}"
									lookup="#{itemLookup}" reRender="SalesDetail_item_product_name-Edit,SalesDetail_price-Edit,SalesDetail_discount-Edit,SalesDetail_amount-Edit"  
									lookupChangeListener="#{salesDetail.onItemChanged}" onblur="toUpperCase(this);"
									required="true" size="10">
									<aon:joinProperty alias="Item_product_code"	value="#{salesDetail.to.item.product.code}" />
								</aon:lookupInputText>
								<aon:lookupButton
									windowTitle="#{productBundle.product_item_selection}" actionType="search"
									property="#{salesDetail.to.item}" selectReRender="SalesDetail_item_product_code-Edit,SalesDetail_item_product_name-Edit,SalesDetail_price-Edit,SalesDetail_discount-Edit,SalesDetail_amount-Edit"
									lookup="#{itemLookup}" minHeight="460" minWidth="650"
									lookupChangeListener="#{salesDetail.onItemChanged}">
								</aon:lookupButton>
								<aon:inputText id="SalesDetail_item_product_name-Edit" 
									value="#{(salesDetail.to.item.product.name!=null)?(salesDetail.to.item.product.name):('')}"
									disabled="true" size="60" />
							</aon:div>
							<f:facet name="footer">
								<aon:div styleClass="aon-lookup" rendered="#{salesDetail.new}">
									<aon:lookupInputText id="SalesDetail_item_product_code-New" value="#{salesDetail.to.item.product.code}"
										lookup="#{itemLookup}" reRender="SalesDetail_item_product_name-New,SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New"  
										lookupChangeListener="#{salesDetail.onItemChanged}" onblur="toUpperCase(this);"
										required="true" size="10">
										<aon:joinProperty alias="Item_product_code"	value="#{salesDetail.to.item.product.code}" />
									</aon:lookupInputText>
									<aon:lookupButton
										windowTitle="#{productBundle.product_item_selection}" actionType="search"
										property="#{salesDetail.to.item}" selectReRender="SalesDetail_item_product_code-New,SalesDetail_item_product_name-New,SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New"
										lookup="#{itemLookup}" minHeight="460" minWidth="650"
										lookupChangeListener="#{salesDetail.onItemChanged}">
									</aon:lookupButton>
									<aon:inputText id="SalesDetail_item_product_name-New" 
										value="#{(salesDetail.to.item.product.name!=null)?(salesDetail.to.item.product.name):('')}"
										disabled="true" size="60" />
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:inputText id="SalesDetail_quantity-Edit" value="#{controller.to.quantity}"
								valueChangeListener="#{controller.onQuantityChanged}" reRender="SalesDetail_price-Edit,SalesDetail_discount-Edit,SalesDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="SalesDetail_quantity-New" value="#{controller.to.quantity}"
									valueChangeListener="#{controller.onQuantityChanged}" reRender="SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="SalesDetail_price-Edit" value="#{controller.to.price}"
								reRender="SalesDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="SalesDetail_price-New" value="#{controller.to.price}"
									reRender="SalesDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="SalesDetail_discount-Edit" value="#{controller.to.discountExpression.discountExpr}"
								reRender="SalesDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="SalesDetail_discount-New" value="#{controller.to.discountExpression.discountExpr}"
									reRender="SalesDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{controller.modelAmount}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText id="SalesDetail_amount-Edit" value="#{controller.amount}"
								rendered="#{to==controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:outputText id="SalesDetail_amount-New" value="#{controller.amount}"
										rendered="#{controller.new}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText id="Sales_taxableBase" value="#{sales.taxableBase}"
										rendered="#{!controller.new}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
