<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
			
	<c:if test="#{!aonConfiguration.properties.hideMenuBar}">			
		<aon:form>
			<aon:div id="treeButtonsGrid" styleClass="aon-top-menu">
				
				<aon:commandLink id="company" 
					title="#{companyBundle.company_data_module}" action="company" 
					value="#{companyBundle.company_data_module}"
					actionListener="#{company.onLoad}" styleClass="aon-top-menu-item">
				</aon:commandLink>
	
				<aon:commandLink id="companyWebInfo" 
					title="#{infowebBundle.infoweb_data}" action="companyWebInfo" 
					value="#{infowebBundle.infoweb_data}"
					actionListener="#{companyWebInfo.onInit}" styleClass="aon-top-menu-item">
				</aon:commandLink>
	
				<aon:commandLink id="images" 
					title="#{companyBundle.company_images_module}" action="companyImages" 
					value="#{companyBundle.company_images_module}"
					actionListener="#{companyWebInfo.onInit}" styleClass="aon-top-menu-item">					
					<aon:actionListener method="#{companyImages.onCancel}" />
				</aon:commandLink>
	
				<aon:commandLink id="webPage" 
					title="#{infowebBundle.infoweb_pages}" action="webPage" 
					value="#{infowebBundle.infoweb_pages}"
					actionListener="#{companyWebInfo.onInit}" styleClass="aon-top-menu-item">
					<aon:actionListener method="#{webPage.onInit}" />
				</aon:commandLink>
	
				<aon:commandLink id="webPageStyle" 
					title="#{infowebBundle.infoweb_template}" action="webPageStyle" 
					value="#{infowebBundle.infoweb_template}"
					styleClass="aon-top-menu-item">
					<aon:actionListener method="#{companyWebInfo.onInit}" />
					<aon:actionListener method="#{webPageStyle.onLoad}" />
				</aon:commandLink>
	
				<aon:commandLink id="generator" 
					title="#{infowebBundle.infoweb_generate}" action="generator" 
					value="#{infowebBundle.infoweb_generate}"
					actionListener="#{companyWebInfo.onInit}" styleClass="aon-top-menu-item">
					<aon:actionListener method="#{generator.onInit}" />
				</aon:commandLink>
				
			</aon:div>
		</aon:form>
	</c:if>
</ui:composition>
