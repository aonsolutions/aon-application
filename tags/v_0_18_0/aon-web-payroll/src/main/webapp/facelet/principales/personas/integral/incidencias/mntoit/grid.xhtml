<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="parteitDataDiv">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{parteit}" />
			<ui:param name="columnClasses" value="
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn,
			aon-editDataTable-textColumn, 
			aon-editDataTable-iconColumn, aon-editDataTable-dateColumn,
			aon-editDataTable-textColumn, aon-editDataTable-iconColumn" />
			
			<!--  
			<ui:param name="showDataScroller" value="#{(!comunidad.new) and (comunidad.to != null)}" />			
			-->
			
			<ui:param name="skipSaveButton" value="#{true}" />
			<ui:param name="skipRemoveButton" value="#{true}" />
			<!-- <aon:methodParam name="resetAction" value="trabajo_form" /> -->
			<ui:param name="skipResetButton" value="#{true}" />
			
			
			
			
			
			<ui:define name="columns">
				<aon:column  
					styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<h:commandButton alt="[#{bundle.aon_reset}]" title="[Ir a mnto IT]"
						styleClass="aon-editDataTable-button aon-icon-rowSelector"
						reRender="integralPresonasData"
						rendered="#{parteit.to==to}"
						action="parteit_form" accesskey="#{bundle.aon_key_new_line}"/>
							
					<f:facet name="footer">
						<aon:div>
							<h:commandButton
								id="parteit-reset" title="#{bundle.aon_reset}"
								action="parteit_form" actionListener="#{parteit.onReset}"
								rendered="#{trabajador.to!=null}" 
								styleClass="aon-editDataTable-button aon-icon-reset"
								accesskey="#{bundle.aon_key_new_line}" />
	
						</aon:div>
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_alta}" />
					</f:facet>
					<aon:outputText value="#{to.id.fecini}"  >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_baja}" />
					</f:facet>
					<aon:outputText value="#{to.fecfin}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				 
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_tipo_it}" />
					</f:facet>
					<aon:outputText value="#{to.tipoit}" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_recaida_ant_it}" />
					</f:facet>
					<aon:selectBooleanCheckbox value="#{to.recaida}" disabled="#{true}"/>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecini_recaida}" />
					</f:facet>
					<aon:outputText value="#{to.feciniori}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_pror_cot}" />
					</f:facet>
					<aon:outputText value="#{to.proret}" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_procesado}" />
					</f:facet>
					<aon:selectBooleanCheckbox value="#{to.procesado}" disabled="#{true}"/>
					
				</aon:column>
				
								
			</ui:define>
		</ui:decorate>
					
	</aon:div>

</ui:composition>
