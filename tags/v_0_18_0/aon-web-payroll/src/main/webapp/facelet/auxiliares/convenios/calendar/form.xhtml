<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="calendarForm">

			<aon:div styleClass="aon-scroll-area">
				<aon:div id="tabla">
					<rich:dataTable styleClass="aon-calendar-button" id="Calendar"
						value="#{calendar.yearModel}" var="m">
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="#{m.desc}" />
						</aon:column>
						<rich:columns value="#{calendar.dias}" var="day" index="idx">
							<f:facet name="header">
								<aon:outputText value="#{day.diasem}" />
							</f:facet>
							<aon:div>
								<aon:outputText id="pic#{m.desc}#{idx}"
									value="#{m.days[idx].cdg}"
									style="text-align:center;background-color:#{m.days[idx].color};color:#{day.weekend};font-size: larger;display:block;">
									<a4j:support ajaxSingle="true" event="onclick"
										actionListener="#{calendar.onChangeDay}"
										reRender="calendarForm" />
								</aon:outputText>
							</aon:div>
						</rich:columns>
					</rich:dataTable>
				</aon:div>
				<h:panelGrid id="filter" columns="3" dir="true" width="70%">

					<aon:div styleClass="aon-lookup">
						<aon:panelGrid columns="2" dir="true" width="50%"
							style="margin-bottom=2px;">

							<aon:outputLabel
								value="#{appBundle.aon_payroll_convenios_calendario}" />

							<rich:inputNumberSpinner inputSize="4" value="#{calendar.actual}"
								maxValue="3000">
								<a4j:support event="onchange" ajaxSingle="true"
									reRender="tabla,filter">
									<aon:actionListener method="#{calendar.load}" />
									<aon:actionListener method="#{calendar.clearFilter}" />
								</a4j:support>
							</rich:inputNumberSpinner>

						<aon:outputLabel for="empresas"
								value="#{appBundle.aon_payroll_principales_clientes_empresa}" />

							<aon:selectOneMenu id="empresas" value="#{calendar.codempresa}"
								reRender="actividades,domicilios,tabla" 
								valueChangeListener="#{calendar.refreshListaAct}">

								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems  value="#{calendar.listaemp}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="actividades"
								value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />

							<aon:selectOneMenu id="actividades" 
								value="#{calendar.codactividad}" reRender="domicilios,tabla"
								valueChangeListener="#{calendar.refreshListaDom}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{calendar.actividades}" />
							</aon:selectOneMenu>


							<aon:outputLabel for="domicilios" value="Centros de trabajo" />

							<aon:selectOneMenu id="domicilios"  	style="weight=30px" valueChangeListener="#{calendar.refreshDomicilios}" 
							value="#{calendar.codcentro}" reRender="colores">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{calendar.domicilios}" />
							</aon:selectOneMenu>

						</aon:panelGrid>
					</aon:div>


					<aon:div id="colores">
						<h:panelGrid columns="2" dir="true" width="100%">
							<aon:outputText value="Festivo"
								style="width: 100%;text-align:center;background-color:#FF8247;display:block;" />
							<aon:outputText value="        #{calendar.numFestivos}"
								style="float:right;" />

							<aon:outputText value="No Laborable"
								style="width: 100%;text-align:center;background-color:#EEC900;display:block;" />
							<aon:outputText value="        #{calendar.numNolabo}"
								style="float:right;" />

							<aon:outputText value="Otros Dias"
								style="width: 100%;text-align:center;background-color:#5CACEE;display:block;" />
							<aon:outputText value="       #{calendar.numOtros}"
								style="float:right;" />
							<!--  
							<aon:outputText value="Laborables"
								style="width: 100%;text-align:center;background-color:white;display:block;border:1px #CCCCCC solid" />
								<aon:outputText value="     #{calendar.numLaborables}"	 style="float:right;" />
								-->
						</h:panelGrid>
					</aon:div>


				</h:panelGrid>

				<aon:commandButton value="VER CALENDARIO">
					<a4j:support event="onclick" ajaxSingle="true"
						actionListener="#{calendar.loadDays}" reRender="calendarForm" />
				</aon:commandButton>
				<aon:commandButton value="GUARDAR CAMBIOS">
					<a4j:support event="onclick" ajaxSingle="true"
						actionListener="#{calendar.saveModelDays}" reRender="calendarForm" />
				</aon:commandButton>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{empresaLookup}" />
		<aon:lookupButtonPopup lookup="#{actividadLookup}" />
		<aon:lookupButtonPopup lookup="#{domicilioLookup}" />

	</ui:define>
</ui:composition>
