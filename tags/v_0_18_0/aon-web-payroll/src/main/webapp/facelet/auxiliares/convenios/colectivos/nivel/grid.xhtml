<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

<aon:div id="nivelDataDiv">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{nivel}" />
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
		<ui:param name="showDataScroller" value="#{(!convenio.new) and (convenio.to != null)}" />			
		<ui:param name="skipResetButton" value="#{convenio.new or (convenio.to == null)}" />
		<ui:param name="rowSelectorReRender" value="categoriaDataDiv,percnivDataDiv" />
		<ui:param name="saveButtonReRender" value="categoriaDataDiv,percnivDataDiv" />
		<ui:param name="cancelButtonReRender" value="categoriaDataDiv,percnivDataDiv" />
		<ui:param name="removeButtonReRender" value="categoriaDataDiv,percnivDataDiv" />
		
		<ui:define name="columns">
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
				</f:facet>
				<aon:outputText value="#{to.id.cdg}" rendered="#{to!=nivel.to}" />
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==nivel.to}" size="2"
					value="#{nivel.to.id.cdg}" maxlength="2" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{nivel.new}" size="2"
						value="#{nivel.to.id.cdg}" maxlength="2" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>					
	
</aon:div>

</ui:composition>
