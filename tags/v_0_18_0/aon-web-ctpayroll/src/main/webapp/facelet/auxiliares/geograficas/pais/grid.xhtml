<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<rich:spacer />

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{pais}" />
			<ui:param name="columnClasses" value="aon-width-150, aon-editDataTable-textColumn" />
			<ui:param name="rowSelectorReRender" value="comunidadDataDiv,provinciaDataDiv" />
			<ui:param name="saveButtonReRender" value="comunidadDataDiv,provinciaDataDiv" />
			<ui:param name="cancelButtonReRender" value="comunidadDataDiv,provinciaDataDiv" />
			<ui:param name="removeButtonReRender" value="comunidadDataDiv,provinciaDataDiv" />
			<ui:define name="columns">

	     	    <aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_cdg} #{appBundle.aon_payroll_auxiliares_geograficas__pais}" />
					</f:facet>
					<aon:outputText id="codigo" value="#{to.cdg}" />
					
					<f:facet name="footer">
						<aon:inputText id="codigo_nuevo" styleClass="aon-form-input-text" required="true"
							rendered="#{pais.new}" size="5"
							value="#{pais.to.cdg}" maxlength="3" />
					</f:facet>
				</aon:column>
			
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_description} #{appBundle.aon_payroll_auxiliares_geograficas__pais}" />
					</f:facet>
					<aon:outputText id="descripcion" value="#{to.descripcion}" rendered="#{to!=pais.to}" />
					
					<aon:inputText id="modificar_descripcion" styleClass="aon-form-input-text " required="true"
						rendered="#{to==pais.to}" size="30"
						value="#{pais.to.descripcion}" maxlength="30" />
					<f:facet name="footer">
						<aon:inputText id="descripcion_nueva" styleClass="aon-form-input-text" required="true"
							rendered="#{pais.new}" size="30"
							value="#{pais.to.descripcion}" maxlength="30" />
					</f:facet>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
