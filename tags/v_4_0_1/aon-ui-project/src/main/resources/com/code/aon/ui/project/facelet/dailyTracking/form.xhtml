<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="dailyTrackingForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{projectBundle.aon_daily_tracking}" />
				<ui:param name="controller" value="#{dailyTracking}" />
			</ui:include>				

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="DailyTracking_trackingDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="DailyTracking_trackingDate"
						value="#{dailyTracking.to.trackingDate}" required="#{true}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="user" rendered="#{!dailyTracking.new and dailyTracking.monitor}"
						value="#{projectBundle.aon_daily_tracking_user}" />
					<aon:selectOneMenu id="user"
						rendered="#{!dailyTracking.new and dailyTracking.monitor}"
						value="#{dailyTracking.to.user}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{dailyTracking.users}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_dossier"
						value="#{projectBundle.aon_daily_tracking_dossier}"/>
					<aon:selectOneMenu id="DailyTracking_dossier"
						value="#{dailyTracking.to.dossier}"
						reRender="customerIdContainer,DailyTracking_activity,DailyTracking_dossier"
						valueChangeListener="#{dailyTracking.dossierChange}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{dailyTracking.availableDossiers}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}"/>
					<aon:div id="customerIdContainer" styleClass="aon-lookup">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name,DailyTracking_dossier, DailyTracking_activity"
							lookupChangeListener="#{dailyTracking.customerPojoChange}" 
							value="#{dailyTracking.to.customer.id}" size="5" />
						<aon:lookupButton windowTitle="#{customerBundle.customer_selection}"
							property="#{dailyTracking.to.customer}"
							selectReRender="Customer_id,Customer_full_name,DailyTracking_dossier, DailyTracking_activity" 
							actionType="search"
							lookupChangeListener="#{dailyTracking.customerPojoChange}"
							lookup="#{customerLookup}" minHeight="460" minWidth="650">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(dailyTracking.to.customer.registry.name!=null)?(dailyTracking.to.customer.registry.fullName):('')}"
							size="50" disabled="true" />
					</aon:div>
						

					<aon:outputLabel for="DailyTracking_activity"
						value="#{projectBundle.aon_daily_tracking_activity}"/>
					<aon:selectOneMenu id="DailyTracking_activity"
						value="#{dailyTracking.to.activity}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{dailyTracking.activities}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_jobType"
						value="#{projectBundle.aon_daily_tracking_job_type}"/>
					<aon:selectOneMenu id="DailyTracking_jobType"
						value="#{dailyTracking.to.jobType}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{projectCollections.jobTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_duration"
						value="#{projectBundle.aon_daily_tracking_duration}"/>
					<aon:inputText id="DailyTracking_duration"
						value="#{dailyTracking.to.trackingDuration}" required="#{true}" size="5" />

					<aon:outputLabel for="DailyTracking_comments"
						value="#{projectBundle.aon_daily_tracking_comments}"/>
					<aon:inputTextarea id="DailyTracking_comments"
						value="#{dailyTracking.to.comments}" cols="51" rows="5" />
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
