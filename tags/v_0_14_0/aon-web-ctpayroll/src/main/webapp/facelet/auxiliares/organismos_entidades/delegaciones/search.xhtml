<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="delegacionSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_organismos_entidades__delegacion}" />
				<ui:param name="controller" value="#{delegacion}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{delegacion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="delegacion_list" />				
				
					<aon:outputLabel for="Delegacion_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Delegacion_cdg" size="1" maxlength="3"
						valueChangeListener="#{delegacion.addExpression}" />

					<aon:outputLabel for="Delegacion_descripcion"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Delegacion_descripcion" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
						
						
					 <aon:outputLabel for="Tipovia_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_tipovia}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Tipovia_cdg"
							lookup="#{tipoviaLookup}"
							reRender="Tipovia_description"
							value="#{delegacion.to.tipovia.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Tipovia_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__tipovia}"
							selectReRender="Tipovia_cdg,Tipovia_description"
							lookup="#{tipoviaLookup}" minHeight="440"
							property="#{delegacion.to.tipovia}">
						</aon:lookupButton>
						<aon:inputText id="Tipovia_description"
							value="#{(delegacion.to.tipovia.description!=null)?(delegacion.to.tipovia.description):('')}"
							size="34" disabled="true" />
							</aon:div>
							
							
						<aon:outputLabel for="Delegacion_nomvia"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_nomvia}" />
					<aon:inputText id="Delegacion_nomvia" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />		
							
				
						<aon:outputLabel for="Delegacion_numero"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_numero}" />
					<aon:inputText id="Delegacion_numero" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
					
						<aon:outputLabel for="Delegacion_otrdir"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_otradir}" />
					<aon:inputText id="Delegacion_otrdir" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
						
							<aon:outputLabel for="Delegacion_telefono"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_telefono}" />
					<aon:inputText id="Delegacion_telefono" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
						
							<aon:outputLabel for="Delegacion_localidad"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_localidad}" />
					<aon:inputText id="Delegacion_localidad" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
						
							<aon:outputLabel for="Delegacion_codpos"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_codpostal}" />
					<aon:inputText id="Delegacion_codpos" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
						
						 <aon:outputLabel for="Provincia_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_provincia}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Provincia_cdg"
							lookup="#{provinciaLookup}"
							reRender="Provincia_descripcion"
							value="#{delegacion.to.provincia.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Provincia_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__provincia}"
							selectReRender="Provincia_cdg,Provincia_descripcion"
							lookup="#{provinciaLookup}" minHeight="440"
							property="#{delegacion.to.provincia}">
						</aon:lookupButton>
						<aon:inputText id="Provincia_descripcion"
							value="#{(delegacion.to.provincia.descripcion!=null)?(delegacion.to.provincia.descripcion):('')}"
							size="34" disabled="true" />
					</aon:div>			
				
				</ui:define>
			</ui:decorate>

		</aon:form>
		
		
		
		<aon:lookupButtonPopup lookup="#{tipoviaLookup}" />	
		<aon:lookupButtonPopup lookup="#{provinciaLookup}" />	
	
	</ui:define>
		
</ui:composition>
