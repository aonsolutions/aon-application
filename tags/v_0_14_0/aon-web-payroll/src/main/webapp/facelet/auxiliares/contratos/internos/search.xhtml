<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="contratosInternosSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_contratos__tipocont}" />
				<ui:param name="controller" value="#{contratosInternos}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{contratosInternos.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="contratosInternos_list" />				
				
					<aon:outputLabel for="ContratosInternos_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="ContratosInternos_cdg" size="10" maxlength="10"
						valueChangeListener="#{contratosInternos.addExpression}" />

					<aon:outputLabel for="ContratosInternos_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="ContratosInternos_description" size="60" maxlength="60"
						valueChangeListener="#{contratosInternos.addExpression}" />
						
					<aon:outputLabel for="ContratosInternos_porcentajeMaestro_cdg" 
						value="#{appBundle.aon_payroll_asimiladoa}" />
					<aon:selectOneMenu id="ContratosInternos_porcentajeMaestro_cdg" 
						valueChangeListener="#{contratosInternos.addExpression}" >
						<f:selectItems value="#{contratosInternos.asimilados}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ContratosInternos_desemple" 
						value="#{appBundle.aon_payroll_desempleado}" />
					<aon:selectOneMenu id="ContratosInternos_desemple" 
						 valueChangeListener="#{contratosInternos.addDirectEqualExpression}" >	
					    <aon:enumConverter enum="com.code.aon.payroll.enumeration.Desempleado" />
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{contratosInternos.desempleados}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ContratosInternos_gradomin" 
						value="#{appBundle.aon_payroll_minusvalia}" />
					<aon:inputText id="ContratosInternos_gradomin" size="10" maxlength="10" 
						valueChangeListener="#{contratosInternos.addExpression}" >
					</aon:inputText>
					
					<aon:outputLabel value="" />
					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="ContratosInternos_searchMujersub"
									value="#{contratosInternos.searchMujersub}" />
								<aon:outputLabel for="ContratosInternos_searchMujersub"
									value="#{appBundle.aon_payroll_mujersub}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="ContratosInternos_incaread"
									value="#{contratosInternos.searchIncaread}" />
								<aon:outputLabel for="ContratosInternos_incaread"
									value="#{appBundle.aon_payroll_incaread}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="ContratosInternos_primertra"
									value="#{contratosInternos.searchPrimertra}" />
								<aon:outputLabel for="ContratosInternos_primertra"
									value="#{appBundle.aon_payroll_primertra}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="ContratosInternos_excsocial"
									value="#{contratosInternos.searchExcsocial}" />
								<aon:outputLabel for="ContratosInternos_excsocial"
									value="#{appBundle.aon_payroll_excsocial}" />
							</aon:div>
						</aon:div>
					</aon:panelGroup>
					
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
