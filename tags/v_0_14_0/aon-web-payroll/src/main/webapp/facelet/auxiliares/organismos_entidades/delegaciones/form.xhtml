<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="delegacionForm">
			
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_organismos_entidades__delegacion}" />
				<ui:param name="controller" value="#{delegacion}"/>
				<ui:param name="reportKey" value="DelegacionList"/>
			</ui:include>	

			<aon:div id="delegacion" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_cdg}" />
					<aon:inputText value="#{delegacion.to.cdg}" 
						required="true" size="2" maxlength="2" />
				
					<aon:outputLabel for="Delegacion_description" value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_descripcion}" />
					<aon:inputText id="Delegacion_description" value="#{delegacion.to.descripcion}" 
						required="true" size="50" maxlength="60" >
					</aon:inputText>
									
					  <aon:outputLabel for="Tipovia_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_tipovia}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Tipovia_cdg"
							lookup="#{tipoviaLookup}"
							reRender="Tipovia_description"
							value="#{delegacion.to.tipovia.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Tipovia_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__tipovia}"
							selectReRender="Tipovia_cdg,Tipovia_description"
							lookup="#{tipoviaLookup}" minHeight="440"
							property="#{delegacion.to.tipovia}">
						</aon:lookupButton>
						<aon:inputText id="Tipovia_description"
							value="#{(delegacion.to.tipovia.description!=null)?(delegacion.to.tipovia.description):('')}"
							size="34" disabled="true" />
					</aon:div>
					
						<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_nomvia}" />
					<aon:inputText value="#{delegacion.to.nomvia}" 
						required="true" size="50" maxlength="20" />
				
					<aon:outputLabel  value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_numero}" />
					<aon:inputText value="#{delegacion.to.numero}" 
						required="true" size="5" maxlength="30" >
					</aon:inputText>
							<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_otradir}" />
					<aon:inputText value="#{delegacion.to.otrdir}"  
						required="true" size="50" maxlength="40" />
				
				  	<aon:outputLabel  value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_codpostal}" />
					<aon:inputText value="#{delegacion.to.codpos}" 
						required="true" size="20" maxlength="5" >
					</aon:inputText>
					
				 	<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_localidad}" />
					<aon:inputText value="#{delegacion.to.localidad}"  
						required="true" size="50" maxlength="20" />
						
			
						
				    <aon:outputLabel for="Provincia_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_provincia}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Provincia_cdg"
							lookup="#{provinciaLookup}"
							reRender="Provincia_descripcion"
							value="#{delegacion.to.provincia.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Provincia_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__provincia}"
							selectReRender="Provincia_cdg,Provincia_descripcion"
							lookup="#{provinciaLookup}" minHeight="440"
							property="#{delegacion.to.provincia}">
						</aon:lookupButton>
						<aon:inputText id="Provincia_descripcion"
							value="#{(delegacion.to.provincia.descripcion!=null)?(delegacion.to.provincia.descripcion):('')}"
							size="34" disabled="true" />
					</aon:div>	
					
					<aon:outputLabel for="Delegacion_telefono" value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_telefono}" />
					<aon:inputText id="Delegacion_telefono" value="#{delegacion.to.telefono}" 
						required="true" size="20" maxlength="12" >
					</aon:inputText>
					
					
	          
				</aon:panelGrid>

			</aon:div>
		</aon:form>
		
	   
		<aon:lookupButtonPopup lookup="#{tipoviaLookup}" />	
		<aon:lookupButtonPopup lookup="#{provinciaLookup}" />	
	
	</ui:define>
</ui:composition>

</body>
</html>
