<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="paisSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_geograficas__paicopro}" />
				<ui:param name="controller" value="#{pais}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{pais.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="pais_form" />
				
					<aon:outputLabel for="Pais_cdg" 
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Pais_cdg" size="10" maxlength="8"
						valueChangeListener="#{pais.addExpression}" />

					<aon:outputLabel for="Pais_descripcion"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Pais_descripcion" size="60" maxlength="50"
						valueChangeListener="#{pais.addExpression}" />
					
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
