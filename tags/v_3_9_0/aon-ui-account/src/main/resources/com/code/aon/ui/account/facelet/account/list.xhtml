<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{accountBundle.account_module}" />
				<ui:param name="controller" value="#{account}" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="accountModule" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="accountModule" />
						<f:param name="outputFormat" value="MS Excel" />
					
					</h:commandLink>
				</ui:define>
					
				</ui:decorate>
			
 
			<aon:div id="accountData" styleClass="aon-scroll-area">
				<aon:dataTable id="accountDataList" value="#{account.model}"
					rows="20" var="to" rendered="#{account.model.rowCount > 0}">

					<aon:rowSelector action="account_form" 
						actionListener="#{account.onSelect}" />
 
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_entryEnabled}" />
						</f:facet>
						<aon:div styleClass="#{to.entryEnabled?'aon-icon-checked':'aon-icon-check'}">
							<f:verbatim>&#160;</f:verbatim>
						</aon:div>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="accountDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
