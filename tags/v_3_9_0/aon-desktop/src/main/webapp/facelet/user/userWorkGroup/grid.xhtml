<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-form-group" rendered="#{!user.new}">
		<aon:div styleClass="aon-form-group-title">
			<aon:div styleClass="aon-form-group-title-internal">
				<aon:outputLabel for="userWorkGroupDataList" value="#{configBundle.config_workgroups}" />
			</aon:div>
		</aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{userWorkGroup}" />
			<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
			<ui:param name="rows" value="0" />
			<ui:param name="showDataScroller" value="false" />		
			<ui:define name="columns">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.workGroup.description}"
						rendered="#{to!=userWorkGroup.to}" />
					<aon:selectOneMenu rendered="#{to==userWorkGroup.to}"
						value="#{userWorkGroup.to.workGroup}">
						<f:selectItems value="#{configCollections.workgroups}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{userWorkGroup.new}"
							value="#{userWorkGroup.to.workGroup}">
							<f:selectItems value="#{configCollections.workgroups}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
				
			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
