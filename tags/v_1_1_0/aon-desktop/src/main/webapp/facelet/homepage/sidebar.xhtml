<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:form >
		<aon:div styleClass="aon-sidebarIcons-bottom">

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink action="home">
					<h:graphicImage url="/images/aon-icon-big-home.png" />
					<aon:div><aon:outputText value="#{appBundle.aon_home}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:outputLink value="/aon-desktop/aon-webmail.auth?aonDesktop=true" target="aonWebMail"
					rendered="#{email.sidebarEnabled}">
					<h:graphicImage url="/images/aon-icon-big-correo.png" />
					<aon:div><aon:outputText value="#{appBundle.aon_webmail}" /></aon:div>
				</aon:outputLink>
			</aon:div>
			
			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{notice.onSearch}" action="notice">
					<h:graphicImage url="/images/aon-icon-big-avisos.png" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_alarms}" /></aon:div>
				</aon:commandLink>
			</aon:div>
			
			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{note.onSearch}" action="note">
					<h:graphicImage url="/images/aon-icon-big-notas.png" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_notes}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{contact.onSearch}" action="contact">
					<h:graphicImage url="/images/aon-icon-big-contactos.png" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_contacts}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{favorite.onSearch}" action="favorite">
					<h:graphicImage url="/images/aon-icon-big-favoritos.png" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_favorites}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{sms.reset}" action="sms" rendered="#{sms.sidebarEnabled}">
					<h:graphicImage url="/images/aon-icon-big-sms.png" />
					<aon:div><aon:outputText value="#{appBundle.aon_desktop_sms}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{fax.createNewMessage}" action="fax" rendered="#{fax.sidebarEnabled}">
					<h:graphicImage url="/images/aon-icon-sendFax-big.png" />
					<aon:div><aon:outputText value="#{appBundle.aon_desktop_fax}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{user.onSearch}" action="user"
					rendered="#{desktop.roleManager}">
					<h:graphicImage url="/images/aon-icon-big-users.png" />
					<aon:div><aon:outputText value="#{appBundle.aon_users}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink 
					actionListener="#{domain.onLoadCurrentDomain}" action="application_list"
					rendered="#{desktop.roleManager}">
					<h:graphicImage url="/images/aon-icon-big-ambito.png" />
					<aon:div><aon:outputText value="#{appBundle.aon_profiles}" /></aon:div>
				</aon:commandLink>
			</aon:div>
			
		</aon:div>
	</aon:form>
</ui:composition>

</body>
</html>
