<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{groupwareBundle.aon_favorite}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{favorite.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{favorite.to!=null or favorite.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{favorite.accept}"
							action="favorite_form"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{favorite.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{favorite.onCancel}"
							confirmAction="favorite_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!favorite.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{favorite.onRemove}"
							confirmAction="favorite_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!favorite.new}" immediate="true"
							action="favorite_search" actionListener="#{favorite.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!favorite.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{favorite.onCancel}"
							action="favorite_list"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Favorite_description"
						value="#{groupwareBundle.favorite_description}" />
					<aon:inputText id="Favorite_description"
						maxlength="128" size="100"
						value="#{favorite.to.description}" />

					<aon:outputLabel for="Favorite_url"
						value="#{groupwareBundle.favorite_url}" />
					<aon:inputText id="Favorite_url"
						maxlength="128" size="100"
						value="#{favorite.to.url}" />

					<aon:outputLabel for="Favorite_favoriteCategory_id"
						value="#{groupwareBundle.favorite_favorite_category}" />
					<aon:selectOneMenu id="Favorite_favoriteCategory_id"
						value="#{favorite.to.favoriteCategory.id}" required="#{true}">
						<f:selectItems value="#{groupWareCollections.favoriteCategories}" />
					</aon:selectOneMenu>
							
				</aon:panelGrid>
					
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
