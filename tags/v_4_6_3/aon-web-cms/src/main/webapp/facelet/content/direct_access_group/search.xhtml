<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="directAccessGroupSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.direct_access_group}" />
				<ui:param name="controller" value="#{direct_access_group}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{direct_access_group}" />
				<ui:define name="searchContent">
	
					<aon:outputLabel for="DirectAccessGroup_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="DirectAccessGroup_alias" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="DirectAccessGroup_details_label"
						value="#{appBundle.direct_access_group_label}" />
					<aon:inputText id="DirectAccessGroup_details_label" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="DirectAccessGroup_section_id"
						value="#{appBundle.cms_section}"/>
					<aon:selectOneMenu id="DirectAccessGroup_section_id"  
						valueChangeListener="#{controller.addIdEqualExpression}"
						value="#{collections.section}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>

				</ui:define>
			</ui:decorate>	
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
