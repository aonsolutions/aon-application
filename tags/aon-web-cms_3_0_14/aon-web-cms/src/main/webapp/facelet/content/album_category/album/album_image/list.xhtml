<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.album_image}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="album_image_form"
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{albumImage.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="album_image_search"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionListener method="#{albumImage.onEditSearch}" />
					</aon:commandButton>
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="categories"
						value="#{appBundle.album}"
						action="album_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item">
						<aon:actionListener method="#{album.onSearch}" />
					</aon:commandButton>
					<aon:commandButton id="create_album"
						value="#{appBundle.aon_create_album}"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<a4j:support 
							event="onclick" 
							onclick="javascript:Richfaces.showModalPanel('album_modal',{width:680, top:100});" />
					</aon:commandButton>	
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">
					
					<aon:dataTable id="dataTable" value="#{albumImage.model}" var="to"
						rows="#{albumImage.pageLimit}" 
						styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn">
				
						<aon:column>
							<a4j:support 
								action="album_image_form"
								actionListener="#{albumImage.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.albumImage_thumbnail}" />
							</f:facet>
							<aon:graphicImage url="#{to.thumbnail}.thumbnail" 
								styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<a4j:support 
								action="album_image_form"
								actionListener="#{albumImage.onSelect}"
								event="onclick" />
							<f:facet name="header">
								<aon:outputText value="#{appBundle.albumImage_title}"/>
							</f:facet>
							<aon:outputText value="#{albumImage.i18nTitle}" 
								styleClass="aon-editDataTable-button"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.albumImage_active}" />
							</f:facet>
							<aon:commandLink title="#{appBundle.albumImage_activate}" 
								action="album_image_list"
								actionListener="#{albumImage.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="AlbumImage_active" alt="#{appBundle.album_image_activate}"
									url="/images/cms/inactive.png" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.albumImage_deactivate}" 
								action="album_image_list"
								actionListener="#{albumImage.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="AlbumImage_deactive" alt="#{appBundle.album_image_deactivate}"
									url="/images/cms/active.png" />
							</aon:commandLink>
						</aon:column>

					</aon:dataTable>
				
					<aon:dataScroller for="dataTable"
						rowCount="#{albumImage.model.rowCount}" 
						page="#{albumImage.page}"
						showNote="true" />					

			</aon:div>
			<ui:include src="/facelet/content/utils/album_modal.xhtml">
				<ui:param name="modalPanelName" value="album_modal" />
				<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
				<ui:param name="galleryBean" value="#{gallery}" />
				<ui:param name="reRender" value="list" />
			</ui:include>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
