<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">
		<h:form id="campaignForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="save" value="#{bundle.aon_save}"
						forceId="#{true}" actionListener="#{campaign.accept}"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
						accesskey="#{bundle.aon_key_save}"/>
					<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
						actionListener="#{campaign.onCancel}" action="campaign_list"
						immediate="#{true}"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
						accesskey="#{bundle.aon_key_cancel}"/>
					<t:commandButton id="remove" value="#{bundle.aon_remove}"
						forceId="#{true}" actionListener="#{campaign.onRemoveCampaign}"
						action="campaign_list" rendered="#{!campaign.new}"
						onclick="if(confirm('#{bundle.aon_remove_confirm}')){viewDialog.show();}else{ return false; }"
						disabled="#{campaign.deleted or campaign.finished}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'" 
						accesskey="#{bundle.aon_key_remove}"/>
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
						actionListener="#{campaign.onReset}" rendered="#{!campaign.new}"
						action="campaign_form" 
						accesskey="#{bundle.aon_key_new}"/>
					<h:commandButton id="search" value="#{bundle.aon_search}"
						immediate="#{true}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{campaign.onEditSearch}" action="campaign_search" 
						accesskey="#{bundle.aon_key_search}"/>
					<h:commandButton id="startCampaign" value="#{campaignBundle.campaign_start}"
						onclick="if(confirm('#{campaignBundle.campaign_start_confirm}')){viewDialog.show();}else{ return false; }"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{campaign.onStartCampaign}" action="campaign_form" 
						rendered="#{!campaign.new and campaign.pending}" />
					<h:commandButton id="finishCampaign" value="#{campaignBundle.campaign_finish}"
						onclick="if(confirm('#{campaignBundle.campaign_finish_confirm}')){viewDialog.show();}else{ return false; }"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{campaign.onFinishCampaign}" action="campaign_form" 
						rendered="#{!campaign.new and campaign.inProgress}" />
				</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{campaign.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="Campaign_description" value="#{campaignBundle.aon_description}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Campaign_description" forceId="#{true}"
							value="#{campaign.to.description}" required="#{true}"
							styleClass="aon-form-input-text" size="60"
							disabled="#{!campaign.pending and !campaign.inProgress}" />

						<h:outputLabel for="Campaign_startDate" value="#{campaignBundle.aon_initial_date}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputCalendar id="Campaign_startDate" forceId="#{true}"
							value="#{campaign.to.startDate}" size="12" required="#{true}"
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell" renderAsPopup="true"
							styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}"
							disabled="#{!campaign.pending}" />

						<h:outputLabel for="Campaign_endDate" value="#{campaignBundle.aon_final_date}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputCalendar id="Campaign_endDate" forceId="#{true}"
							value="#{campaign.to.endDate}" size="12" required="#{true}"
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell" renderAsPopup="true"
							styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}"
							disabled="#{!campaign.pending and !campaign.inProgress}" />

						<h:outputLabel for="Campaign_process" value="#{campaignBundle.process_process}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="Campaign_process" forceId="#{true}"
							value="#{campaign.to.process.id}"
							styleClass="aon-form-selectOneMenu-field"
							disabled="#{!campaign.pending}">
							<f:selectItems value="#{campaignCollections.processes}" />
						</h:selectOneMenu>

						<h:outputLabel for="Campaign_activityType" value="#{projectBundle.activity_activity_type}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="Campaign_activityType" forceId="#{true}"
							value="#{campaign.to.activityType.id}"
							styleClass="aon-form-selectOneMenu-field"
							disabled="#{!campaign.pending}">
							<f:selectItems value="#{projectCollections.activityTypes}" />
						</h:selectOneMenu>

						<h:outputLabel for="Campaign_workGroup" value="#{campaignBundle.campaign_supervisor}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="Campaign_workGroup" forceId="#{true}"
							value="#{campaign.to.workGroup.id}"
							styleClass="aon-form-selectOneMenu-field"
							disabled="#{!campaign.pending and !campaign.inProgress}">
							<f:selectItems value="#{configCollections.workgroups}" />
						</h:selectOneMenu>

						<h:outputLabel for="Campaign_type" value="#{campaignBundle.aon_type}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="Campaign_type" forceId="#{true}"
							value="#{campaign.to.type}"
							styleClass="aon-form-selectOneMenu-field"
							disabled="#{!campaign.pending}">
							<f:selectItems value="#{campaignCollections.campaignTypes}" />
						</h:selectOneMenu>

						<h:outputLabel for="Campaign_status" value="#{campaignBundle.aon_status}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="Campaign_status" forceId="#{true}"
							value="#{campaign.to.status}"
							styleClass="aon-form-selectOneMenu-field"
							disabled="#{true}">
							<f:selectItems value="#{campaignCollections.campaignStatus}" />
						</h:selectOneMenu>

					</h:panelGrid>

					<t:div styleClass="aon-form-group" rendered="#{!campaign.pending}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="CampaignDossierDataList" rendered="#{!campaign.pending}"
								value="#{campaignBundle.campaign_dossiers}" />
						</t:div>
						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="CampaignDossierDataList" var="to"
								styleClass="aon-table" headerClass="aon-table-header"
								footerClass="aon-table-footer" cellpadding="0"
								cellspacing="0" value="#{campaignDossier.model}"
								rowOnMouseOver="selectRow( this )" rowOnClick="sendRow( this )"
								rowOnMouseOut="unselectRow( this )" rowIndexVar="rowIndex" rows="20"
								rendered="#{!campaign.pending}"
								rowClasses="aon-table-row-odd,aon-table-row-even"
								columnClasses="aon-table-body aon-table-body-icon,
									aon-table-body aon-table-body-string,
									aon-table-body aon-table-body-string,
									aon-table-body aon-table-body-string,
									aon-table-body aon-table-body-string,
									aon-table-body aon-table-body-string">

								<t:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:selectBooleanCheckbox id="Row_checked" forceId="#{true}"
										value="#{campaignDossier.rowChecked}"
										valueChangeListener="#{campaignDossier.rowSelected}"
										onmouseover="enableRowSubmit(false)"
										onmouseout="enableRowSubmit(true)"
										styleClass="aon-form-selectBooleanCheckbox-field"
										rendered="#{campaignDossier.processDetail != null}" />
									<t:div style="width:14px; height:20px;" rendered="#{campaignDossier.processDetail == null}">
										<h:graphicImage
											url="/css/images/icons/aon-lock.gif"
											alt="#{campaignBundle.campaign_process_finished}"/>
									</t:div>
									<t:commandLink immediate="#{true}" 
										styleClass="aon-table-row-selected"
										action="campaign_view_task"
										actionListener="#{activityProcess.onSearchTasks}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:commandSortHeader columnName="CampaignDossier_customer_name" arrow="#{true}"
											actionListener="#{campaignDossier.sort}" 
											styleClass="aon-table-header-link">
											<t:outputText value="#{customerBundle.customer_name}" />
										</t:commandSortHeader>
									</f:facet>
									<t:outputText value="#{to.dossier.customer.registry.name}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:commandSortHeader columnName="CampaignDossier_customer_surname" arrow="#{true}"
											actionListener="#{campaignDossier.sort}" 
											styleClass="aon-table-header-link">
											<t:outputText value="#{customerBundle.customer_surname}" />
										</t:commandSortHeader>
									</f:facet>
									<t:outputText value="#{to.dossier.customer.registry.surname}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:commandSortHeader columnName="CampaignDossier_customer_document" arrow="#{true}"
											actionListener="#{campaignDossier.sort}" 
											styleClass="aon-table-header-link">
											<t:outputText value="#{customerBundle.customer_document}" />
										</t:commandSortHeader>
									</f:facet>
									<t:outputText value="#{to.dossier.customer.registry.document}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:commandSortHeader columnName="CampaignDossier_dossier_number" arrow="#{true}"
											actionListener="#{campaignDossier.sort}" 
											styleClass="aon-table-header-link">
											<t:outputText value="#{projectBundle.aon_daily_tracking_dossier}" />
										</t:commandSortHeader>
									</f:facet>
									<t:outputText value="#{to.dossier.number}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:outputText value="#{campaignBundle.campaign_current_action}" />
									</f:facet>
									<t:outputText value="#{campaignDossier.processDetail}" 
										rendered="#{campaignDossier.processDetail != null}" />
									<t:outputText value="#{campaignBundle.campaign_process_finished}" 
										rendered="#{campaignDossier.processDetail == null}" />
								</t:column>

							</t:dataTable>

							<t:div rendered="#{campaign.inProgress}">
								<t:commandButton title="#{campaignBundle.campaign_add_dossier}"
									styleClass="aon-form-button-plus"
									value="#{campaignBundle.campaign_add_dossier}"
									actionListener="#{addCampaignDossier.onSearchDossiers}"
									action="campaign_add_dossier"
									onclick="viewDialog.show();" />
								<t:commandButton title="#{campaignBundle.campaign_exclude_dossier}"
									styleClass="aon-form-button-minus"
									value="#{campaignBundle.campaign_exclude_dossier}"
									actionListener="#{campaignDossier.onRemoveCampaignDossier}"
									onclick="viewDialog.show();" />
							</t:div>

							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="CampaignDossierDataList" />
								<ui:param name="model" value="#{campaignDossier.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>
						</t:div>
					</t:div>
				</t:div>
			</t:div>

			<s:modalDialog
		       dialogId="viewDialog"
		       dialogVar="viewDialog"
		       closeButton="false">
		       <t:div styleClass="aon-timer">		       		
		       		<h:graphicImage value="/css/images/content/aon-timer.gif" />
		       		<t:div styleClass="aon-timer-title" >
		       			<t:outputText value="#{appBundle.aon_in_progress}" /> 
		       		</t:div>
  			   </t:div>
			</s:modalDialog>

		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
