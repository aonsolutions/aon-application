<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">
		<h:form id="dailyTrackingForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="save" value="#{bundle.aon_save}"
						forceId="#{true}" actionListener="#{dailyTracking.accept}"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
						accesskey="#{bundle.aon_key_save}"/>
					<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
						actionListener="#{dailyTracking.onCancel}" action="daily_tracking_list"
						immediate="#{true}"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
						accesskey="#{bundle.aon_key_cancel}"/>
					<t:commandButton id="remove" value="#{bundle.aon_remove}"
						forceId="#{true}" actionListener="#{dailyTracking.onRemove}"
						action="daily_tracking_list" rendered="#{!dailyTracking.new}"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'" 
						accesskey="#{bundle.aon_key_remove}"/>
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
						actionListener="#{dailyTracking.onReset}" rendered="#{!dailyTracking.new}"
						action="daily_tracking_form" 
						accesskey="#{bundle.aon_key_new}"/>
					<h:commandButton id="search" value="#{bundle.aon_search}"
						immediate="#{true}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
						actionListener="#{dailyTracking.onEditSearch}" action="daily_tracking_search" 
						accesskey="#{bundle.aon_key_search}"/>
				</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{dailyTracking.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="DailyTracking_trackingDate" value="#{projectBundle.aon_date}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputCalendar id="DailyTracking_trackingDate" forceId="#{true}"
							value="#{dailyTracking.to.trackingDate}" size="12" required="#{true}"
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell" renderAsPopup="true"
							styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}" />

						<t:outputLabel for="Customer_Lookup_id" value="#{customerBundle.customer_customer}" 
							styleClass="aon-form-input-text-label" />
						<t:div>
							<t:inputText id="Customer_Lookup_id" forceId="#{true}"
								value="#{dailyTracking.to.customer.id}"
								styleClass="aon-form-input-text" size="5" 
								onchange="return findBeanLookupAndSubmitExt(this.form, event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"
								valueChangeListener="#{dailyTracking.customerChange}" />
							<h:commandButton id="find_Customer_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />	
							<t:inputText id="Customer_full_name"
								value="#{dailyTracking.to.customer.registry.name} #{dailyTracking.to.customer.registry.surname}"
								disabled="true" forceId="#{true}"
								styleClass="aon-form-input-text-disabled" size="40" />
						</t:div>

						<h:outputLabel for="DailyTracking_dossier" value="#{projectBundle.aon_daily_tracking_dossier}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="DailyTracking_dossier" forceId="#{true}"
							value="#{dailyTracking.to.dossier.id}"
							styleClass="aon-form-selectOneMenu-field"
							onchange="submit();"
							valueChangeListener="#{dailyTracking.dossierChange}">
							<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
							<f:selectItems value="#{dailyTracking.dossiers}" />
						</h:selectOneMenu>

						<h:outputLabel for="DailyTracking_activity" value="#{projectBundle.aon_daily_tracking_activity}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="DailyTracking_activity" forceId="#{true}"
							value="#{dailyTracking.to.activity.id}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
							<f:selectItems value="#{dailyTracking.activities}" />
						</h:selectOneMenu>

						<h:outputLabel for="DailyTracking_jobType" value="#{projectBundle.aon_daily_tracking_job_type}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="DailyTracking_jobType" forceId="#{true}"
							value="#{dailyTracking.to.jobType.id}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{projectCollections.jobTypes}" />
						</h:selectOneMenu>

						<h:outputLabel for="DailyTracking_duration" value="#{projectBundle.aon_daily_tracking_duration}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="DailyTracking_duration" forceId="#{true}"
							value="#{dailyTracking.to.trackingDuration}" required="#{true}"
							styleClass="aon-form-input-text" size="5" />

						<h:outputLabel for="DailyTracking_comments" value="#{projectBundle.aon_daily_tracking_comments}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputTextarea id="DailyTracking_comments" forceId="#{true}"
							value="#{dailyTracking.to.comments}" cols="51" rows="5"
							styleClass="aon-form-input-text" />
					</h:panelGrid>
					
					<t:div rendered="#{dailyTracking.new}">
						<t:commandButton title="#{projectBundle.load_tasks}"
							styleClass="aon-form-button-plus"
							value="#{projectBundle.load_tasks}"
							actionListener="#{dailyTracking.onLoadFinishedTasks}" />
					</t:div>
					
					<t:div styleClass="aon-form-group" rendered="#{dailyTracking.new and dailyTracking.finishedTaskModel.rowCount > 0}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="FinishedTaskDataList" rendered="#{dailyTracking.finishedTaskModel.rowCount > 0}"
								value="#{projectBundle.aon_tasks}" />
						</t:div>
						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="FinishedTaskDataList" var="to"
								styleClass="aon-table" headerClass="aon-table-header"
								footerClass="aon-table-footer" cellpadding="0"
								cellspacing="0" value="#{dailyTracking.finishedTaskModel}"
								rowOnMouseOver="selectRow( this )" rowOnClick="sendRow( this )"
								rowOnMouseOut="unselectRow( this )" rowIndexVar="rowIndex" rows="20"
								rendered="#{dailyTracking.finishedTaskModel.rowCount > 0}"
								rowClasses="aon-table-row-odd,aon-table-row-even"
								columnClasses="aon-table-body aon-table-body-icon,
									aon-table-body aon-table-body-string,
									aon-table-body aon-table-body-string,
									aon-table-body aon-table-body-string">

								<t:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:commandLink styleClass="aon-table-row-selected"
										actionListener="#{dailyTracking.onImportTask}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:outputText value="#{projectBundle.aon_description}" />
									</f:facet>
									<t:outputText value="#{to.description}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:outputText value="#{customerBundle.customer_customer}" />
									</f:facet>
									<t:outputText value="#{to.dossier.customer.registry.name} #{to.dossier.customer.registry.surname}" 
										rendered="#{to.dossier != null}"/>
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:outputText value="#{projectBundle.dossier_dossier}" />
									</f:facet>
									<t:outputText value="#{to.dossier.number}" 
										rendered="#{to.dossier != null}"/>
								</t:column>

							</t:dataTable>

							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="FinishedTaskDataList" />
								<ui:param name="model" value="#{dailyTracking.finishedTaskModel}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>
						</t:div>
					</t:div>
					
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
