<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/resources/facelet/shared/gridEx.xhtml" >
		<aon:valueParam name="dataTableId" default="#{controller.beanName}Data" />
		<aon:valueParam name="dataModel" default="#{controller.model}" />
		<aon:valueParam name="rows" default="#{controller.pageLimit}" />
