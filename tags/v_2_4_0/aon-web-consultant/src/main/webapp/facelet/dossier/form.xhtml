<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">

		<h:form id="dossierForm">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{customer.to.registry.name} #{customer.to.registry.surname}, #{customerBundle.customer_document}: #{customer.to.registry.document}" />
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal" style="padding-top:0">

					<t:div styleClass="aon-content-menu" rendered="#{!customer.new}"
						id="aon-content-menu" forceId="#{true}">
						<t:panelGrid columns="7" cellpadding="0" cellspacing="0"
							border="0">
							<t:panelGroup>
								<t:commandLink id="customer_data" forceId="#{true}"
									value="#{appBundle.aon_personal_data}" action="customer_form"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="economic_data" forceId="#{true}"
									visibleOnUserRole="ClientesDatosEconomicos"
									value="#{appBundle.aon_economic_data}"
									actionListener="#{customerFee.onCustomerFee}"
									action="economic_data" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_dossier"
									value="#{projectBundle.dossier_dossiers}" forceId="#{true}"
									styleClass="aon-content-menu-item-active" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_business_data" forceId="#{true}" 
									value="#{appBundle.aon_business_data}"
									action="customer_rdir_staff" 
									styleClass="aon-content-menu-item" />						
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_rnote" forceId="#{true}"
									value="#{appBundle.aon_monitoring}"
									actionListener="#{rnote.onSearch}" action="rnote"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_relationship" forceId="#{true}"
									value="#{appBundle.aon_rRelationship}"
									actionListener="#{rRelationship.onSearch}"
									action="rrelationship" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="record_data" forceId="#{true}" 
									value="#{appBundle.aon_record_data}"
									action="customer_record_data_list" 
									styleClass="aon-content-menu-item" />						
							</t:panelGroup>
						</t:panelGrid>
					</t:div>

					<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
						forceId="#{true}">
						<t:div styleClass="aon-content-toolbar-internal">
							<t:div styleClass="aon-content-toolbar-item-group">
								<t:commandButton id="save" value="#{bundle.aon_save}"
									actionListener="#{dossier.accept}"
									onclick="return (confirm('#{bundle.aon_save_confirm}'))"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
									disabled="#{activity.to != null}"
									accesskey="#{bundle.aon_key_save}" />
								<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
									forceId="#{true}" immediate="#{true}" action="dossier_list"
									actionListener="#{dossier.onCancel}"
									onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
									disabled="#{activity.to != null}"
									accesskey="#{bundle.aon_key_cancel}" />
								<t:commandButton id="remove" value="#{bundle.aon_remove}"
									rendered="#{!dossier.new}" forceId="#{true}"
									immediate="#{true}" action="dossier_list"
									actionListener="#{dossier.onRemove}"
									onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
									disabled="#{activity.to != null}"
									accesskey="#{bundle.aon_key_remove}" />
								<t:commandButton id="reset" value="#{bundle.aon_reset}"
									rendered="#{!dossier.new}" action="dossier_form"
									actionListener="#{dossier.onReset}" forceId="#{true}"
									immediate="#{true}"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
									disabled="#{activity.to != null}"
									accesskey="#{bundle.aon_key_new}" />
							</t:div>
						</t:div>
					</t:div>

					<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
						forceId="#{true}">
						<t:div styleClass="aon-content-subtitle-internal">
							<h:outputText
								value="#{dossier.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</t:div>
					</t:div>

					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Dossier_dossierType_id"
							styleClass="aon-form-selectOneMenu-label"
							value="#{projectBundle.aon_type}" />
						<h:selectOneMenu id="Dossier_dossierType_id"
							styleClass="aon-form-selectOneMenu-field"
							value="#{dossier.to.dossierType.id}"
							disabled="#{!dossier.new}">
							<f:selectItems value="#{projectCollections.dossierTypes}" />
						</h:selectOneMenu>

						<h:outputLabel for="Dossier_number"
							styleClass="aon-form-selectOneMenu-label"
							value="#{projectBundle.dossier_number}" />
						<h:panelGrid columns="2">
							<t:inputText id="Dossier_number" value="#{dossier.to.number}"
								styleClass="aon-form-input-text" forceId="#{true}" size="18"
								maxlength="15">
								<f:validateLength maximum="15" />
							</t:inputText>
						</h:panelGrid>

						<h:outputLabel for="Dossier_location"
							styleClass="aon-form-selectOneMenu-label"
							value="#{projectBundle.dossier_location}" />
						<h:panelGrid columns="2">
							<t:inputText id="Dossier_location" value="#{dossier.to.location}"
								styleClass="aon-form-input-text" forceId="#{true}" size="25"
								maxlength="20">
								<f:validateLength maximum="20" />
							</t:inputText>
						</h:panelGrid>

						<t:outputLabel for="Dossier_status"
							styleClass="aon-form-selectOneMenu-label"
							value="#{projectBundle.aon_status}" />
						<h:selectOneMenu id="Dossier_status"
							styleClass="aon-form-selectOneMenu-field"
							value="#{dossier.to.status}">
							<f:selectItems value="#{projectCollections.dossierStatus}" />
						</h:selectOneMenu>

					</h:panelGrid>

					<t:div styleClass="aon-form-group" rendered="#{!dossier.new}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="ActivityDataList" rendered="#{!dossier.new}"
								value="#{projectBundle.activity_activities}" />
						</t:div>
						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="ActivityDataList" var="to"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" cellpadding="0"
								cellspacing="0" value="#{activity.model}"
								rowOnMouseOver="selectRow( this )" rendered="#{!dossier.new}"
								rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
								rowIndexVar="rowIndex" rows="20"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-buttons">

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:commandLink styleClass="aon-table-row-selected"
										rendered="#{to!=activity.to}"
										actionListener="#{activity.onSelect}" />
									<f:verbatim>&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<t:commandButton value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												actionListener="#{activity.onReset}"
												rendered="#{!activity.new}"
												accesskey="#{bundle.aon_key_new_line}" />
											<f:verbatim rendered="#{activity.new}">&#160;</f:verbatim>
										</t:div>
									</f:facet>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{projectBundle.aon_type}" />
									</f:facet>
									<t:outputText value="#{to.activityType.description}"
										rendered="#{to!=activity.to}" />
									<h:selectOneMenu value="#{activity.to.activityType.id}"
										styleClass="aon-form-selectOneMenu-field"
										valueChangeListener="#{activity.onActivityTypeChanged}"
										rendered="#{to==activity.to}">
										<f:selectItems value="#{dossier.activityTypes}" />
									</h:selectOneMenu>
									<f:facet name="footer">
										<t:div>
											<h:selectOneMenu value="#{activity.to.activityType.id}"
												styleClass="aon-form-selectOneMenu-field"
												valueChangeListener="#{activity.onActivityTypeChanged}"
												rendered="#{activity.new}">
												<f:selectItems
													value="#{dossier.activityTypes}" />
											</h:selectOneMenu>
										</t:div>
									</f:facet>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{projectBundle.activity_assigned}" />
									</f:facet>
									<t:outputText value="#{to.workgroup.description}"
										rendered="#{to!=activity.to}" />
									<h:selectOneMenu value="#{activity.to.workgroup.id}"
										styleClass="aon-form-selectOneMenu-field"
										valueChangeListener="#{activity.onWorkGroupChanged}"
										rendered="#{to==activity.to}">
										<f:selectItems value="#{configCollections.workgroups}" />
									</h:selectOneMenu>
									<f:facet name="footer">
										<t:div>
											<h:selectOneMenu value="#{activity.to.workgroup.id}"
												styleClass="aon-form-selectOneMenu-field"
												valueChangeListener="#{activity.onWorkGroupChanged}"
												rendered="#{activity.new}">
												<f:selectItems value="#{configCollections.workgroups}" />
											</h:selectOneMenu>
										</t:div>
									</f:facet>
								</h:column>

								<t:column width="60">
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:div rendered="#{to==activity.to}">
										<t:commandButton title="#{bundle.aon_save}"
											actionListener="#{activity.onAccept}"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
											value="" accesskey="#{bundle.aon_key_save_line}" />
										<t:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{activity.onCancel}" immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
											value="" accesskey="#{bundle.aon_key_cancel_line}" />
										<t:commandButton title="#{bundle.aon_remove}"
											actionListener="#{activity.onRemove}" immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
											value="" accesskey="#{bundle.aon_key_remove_line}" />
									</t:div>
									<f:verbatim rendered="#{to!=activity.to}">&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<t:div rendered="#{activity.new}">
												<t:commandButton title="#{bundle.aon_save}"
													actionListener="#{activity.onAccept}"
													onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
													value="" accesskey="#{bundle.aon_key_save_line}" />
												<t:commandButton title="#{bundle.aon_cancel}"
													actionListener="#{activity.onCancel}" immediate="#{true}"
													onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
													value="" accesskey="#{bundle.aon_key_cancel_line}" />
											</t:div>
											<f:verbatim rendered="#{!activity.new}">&#160;</f:verbatim>
										</t:div>
									</f:facet>
								</t:column>
							</t:dataTable>

							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="ActivityDataList" />
								<ui:param name="model" value="#{activity.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>

						</t:div>
					</t:div>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
