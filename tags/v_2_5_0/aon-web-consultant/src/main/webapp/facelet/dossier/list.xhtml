<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
		<h:form id="dossierList">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{customer.to.registry.name} #{customer.to.registry.surname}, #{customerBundle.customer_document}: #{customer.to.registry.document}" />
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal" style="padding-top:0">

					<t:div styleClass="aon-content-menu" rendered="#{!customer.new}"
						id="aon-content-menu" forceId="#{true}">
						<t:panelGrid columns="7" cellpadding="0" cellspacing="0"
							border="0">
							<t:panelGroup>
								<t:commandLink id="customer_data" forceId="#{true}"
									value="#{appBundle.aon_personal_data}" action="customer_form"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="economic_data" forceId="#{true}"
									visibleOnUserRole="ClientesDatosEconomicos"
									value="#{appBundle.aon_economic_data}"
									actionListener="#{customerFee.onCustomerFee}"
									action="economic_data" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_dossier"
									value="#{projectBundle.dossier_dossiers}" forceId="#{true}"
									styleClass="aon-content-menu-item-active" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_business_data" forceId="#{true}" 
									value="#{appBundle.aon_business_data}"
									action="customer_rdir_staff" 
									styleClass="aon-content-menu-item" />						
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_rnote" forceId="#{true}"
									value="#{appBundle.aon_monitoring}"
									actionListener="#{rnote.onSearch}" action="rnote"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_relationship" forceId="#{true}"
									value="#{appBundle.aon_rRelationship}"
									actionListener="#{rRelationship.onSearch}"
									action="rrelationship" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="record_data" forceId="#{true}" 
									value="#{appBundle.aon_record_data}"
									action="customer_record_data_list" 
									styleClass="aon-content-menu-item" />						
							</t:panelGroup>
						</t:panelGrid>
					</t:div>

					<t:div styleClass="aon-content-toolbar" forceId="#{true}"
						id="aon-content-toolbar">
						<t:div styleClass="aon-content-toolbar-internal">
							<t:div styleClass="aon-content-toolbar-item-group">
								<t:commandButton id="reset" value="#{bundle.aon_reset}"
									action="dossier_form" actionListener="#{dossier.onReset}"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
									accesskey="#{bundle.aon_key_new}" />
							</t:div>
						</t:div>
					</t:div>
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="dossierDataList" cellpadding="0" cellspacing="0"
							var="to" value="#{dossier.model}" rows="20"
							rendered="#{dossier.model.rowCount > 0}" styleClass="aon-table"
							headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="aon-table-body aon-table-body-icon,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string"
							rowOnMouseOver="selectRow( this )"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )">

							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:commandLink immediate="#{true}"
									styleClass="aon-table-row-selected" action="dossier_form"
									actionListener="#{dossier.onSelect}" />
								<f:verbatim>&#160;</f:verbatim>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_type}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.dossierType.description}" />
								<f:verbatim>&#160;</f:verbatim>
							</h:column>
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.dossier_number}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.number}" />
								<f:verbatim>&#160;</f:verbatim>
							</h:column>
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.dossier_location}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.location}" />
								<f:verbatim>&#160;</f:verbatim>
							</h:column>
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{projectBundle.aon_status}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.status}" />
								<f:verbatim>&#160;</f:verbatim>
							</h:column>
						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="dossierDataList" />
						<ui:param name="model" value="#{dossier.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
	</ui:define>

</ui:composition>

</body>
</html>
