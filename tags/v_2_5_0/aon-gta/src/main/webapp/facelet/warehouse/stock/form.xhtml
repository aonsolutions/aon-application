<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="stockForm">

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="cancel" value="#{bundle.aon_back}"
							actionListener="#{stock.onEditSearch}"
							forceId="#{true}" immediate="#{true}" action="stock_search"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"/>
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<t:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
								
						<h:outputLabel for="Item_product_code"
							styleClass="aon-form-input-text-label"
							value="#{productBundle.item_code}" />
						<t:inputText id="Item_product_code" forceId="#{true}"
							disabled="true" size="5" styleClass="aon-form-input-text"
							value="#{stock.movingStock.item.product.code}" />

						<h:outputLabel for="Item_full_name"
							styleClass="aon-form-input-text-label"
							value="#{warehouseBundle.stock_item}" />
						<t:inputText id="Item_full_name" forceId="#{true}" disabled="true"
							size="64" styleClass="aon-form-input-text"
							value="#{stock.movingStock.item.product.name} #{stock.movingStock.item.detail}" />
					</t:panelGrid>

					<t:panelGrid columns="4" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even,
									   aon-form-table-column-odd,aon-form-table-column-even">
								
						<h:outputLabel for="Source_warehouse"
							styleClass="aon-form-input-text-label"
							value="#{warehouseBundle.stock_source}" />
						<h:selectOneMenu id="Source_warehouse" required="true"
							styleClass="aon-form-selectOneMenu-field"
							forceId="#{true}" value="#{stock.sourceWarehouseId}">
							<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
							<f:selectItems value="#{stock.availableSourceWarehouses}" />
						</h:selectOneMenu>

						<h:outputLabel for="Target_warehouse"
							styleClass="aon-form-input-text-label"
							value="#{warehouseBundle.stock_target}" />
						<h:selectOneMenu id="Target_warehouse" required="true"
							styleClass="aon-form-selectOneMenu-field"
							forceId="#{true}" value="#{stock.targetWarehouseId}">
							<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
							<f:selectItems value="#{warehouseCollections.warehouses}" />
						</h:selectOneMenu>

						<h:outputLabel for="Moving_Quantity"
							styleClass="aon-form-input-text-label"
							value="#{warehouseBundle.stock_quantity}" />
						<t:inputText id="Moving_Quantity" forceId="#{true}"
							size="5" styleClass="aon-form-input-text"
							value="#{stock.movingQuantity}" >
							<f:validateDoubleRange minimum="0" />
						</t:inputText>	

						<t:div/>
						<t:commandButton styleClass="aon-form-button" 
							value="#{warehouseBundle.stock_move}"
							actionListener="#{stock.move}" />
							
					</t:panelGrid>

					<t:div styleClass="aon-form-group">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="stockLineData"
								value="#{warehouseBundle.stock_warehouses}" />
						</t:div>
						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="stockDataList" cellpadding="0" cellspacing="0"
								var="to" value="#{stock.model}" rows="20"
								rendered="#{stock.model.rowCount > 0}" styleClass="aon-table"
								headerClass="aon-table-header"
								rowClasses="aon-table-row-odd,aon-table-row-even"
								columnClasses="aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-number">

								<t:column groupBy="true">
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.stock_warehouse}" />
									</f:facet>
									<h:outputText value="#{to.warehouse.name}" />
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected" action="stock_form"
										actionListener="#{stock.onSelect}" />
								</t:column>

								<t:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{warehouseBundle.stock_quantity}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.quantity}">
										<f:convertNumber pattern="#,##0.00" />
									</h:outputText>
								</t:column>
							</t:dataTable>
						</t:div>

						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="stockDataList" />
							<ui:param name="model" value="#{stock.model}" />
							<ui:param name="showNote" value="#{false}" />
						</ui:include>

					</t:div>
				</t:div>
			</t:div>

		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
