<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contratosTc2Form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_contratos__tipcotc2}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{contratosTc2.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="contratos_tc2"
							actionListener="#{contratosTc2.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{contratosTc2.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{contratosTc2.onCancel}"
							confirmAction="contratos_tc2_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!contratosTc2.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{contratosTc2.onRemove}"
							confirmAction="contratos_tc2_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!contratosTc2.new}"
							action="contratos_tc2" 
							actionListener="#{contratosTc2.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!contratosTc2.new}"
							action="contratos_tc2_search" actionListener="#{contratosTc2.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />				

						<aon:spin controller="#{contratosTc2}" action="contratos_tc2" rendered="#{!contratosTc2.new}" />
						
						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{contratosTc2}"/>
							<ui:param name="reportKey" value="contratosTc2List"/>
						</ui:include>

					</aon:div>
					<!-- end tool bar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div id="contratosTc2" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{contratosTc2.to.cdg}" disabled="#{!contratosTc2.new}" 
						required="true" size="2" maxlength="3" />
				
					<aon:outputLabel for="Description" value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Description" value="#{contratosTc2.to.description}" 
						required="true" size="100" maxlength="150" >
					</aon:inputText>
					
					<aon:outputLabel for="DescriptionAbr" value="#{appBundle.aon_payroll_auxiliares_contratos__tipcotc2_desabr}" />
					<aon:inputText id="DescriptionAbr" value="#{contratosTc2.to.desabr}" 
						size="25" maxlength="30" >
					</aon:inputText>
					
					<aon:outputLabel for="CodigoAnt" value="#{appBundle.aon_payroll_auxiliares_contratos__tipcotc2_cdgant}" />
					<aon:inputText id="CodigoAnt" value="#{contratosTc2.to.cdgant}" 
						size="80" maxlength="125" >
					</aon:inputText>

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
