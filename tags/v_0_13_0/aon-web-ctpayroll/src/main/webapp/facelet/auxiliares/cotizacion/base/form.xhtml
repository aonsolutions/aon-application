<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="porcentajeForm">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_cotizacion_bases}" />
				<ui:param name="controller" value="#{baseMaestro}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
						<ui:param name="manager" value="#{baseMaestro}"/>
						<ui:param name="reportKey" value="BasesList"/>
						<ui:param name="reportKeyXls" value="BasesList2"/>
					</ui:include>	
				</ui:define>
			</ui:decorate>

			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="baseMaestro" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{baseMaestro.to.cdg}" disabled="#{!baseMaestro.new}" 
						required="true" size="20" maxlength="3" />
				
					<aon:outputLabel  value="#{appBundle.aon_payroll_description}" />
					<aon:inputText value="#{baseMaestro.to.description}" 
						required="true" size="30" maxlength="30" >
					</aon:inputText>
						
						<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_cotizacion__pro}" />
					<aon:selectOneRadio id="Prorateo" value="#{baseMaestro.to.prorateo}" >	
						<f:selectItems value="#{baseMaestro.listaProrateos}"/>											
					</aon:selectOneRadio>
				 
				</aon:panelGrid>

			 	<ui:include src="grid.xhtml" rendered="#{!baseMaestro.new}" />		 		
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
