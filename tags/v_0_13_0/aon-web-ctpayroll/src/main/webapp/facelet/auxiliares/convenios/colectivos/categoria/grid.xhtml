<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="categoriaData" value="#{categoria.model}" 
			var="to" rows="10"
			rendered="#{(categoria.model.rowCount > 0) or (categoria.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-textColumn, aon-editDataTable-textColumn
				, aon-editDataTable-buttonsColumn">
			
			<aon:rowSelector toggleOnClick="#{categoria.to == null}" actionListener="#{categoria.onSelect}" />
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{categoria.onReset}" value=""
							rendered="#{!categoria.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
				</f:facet>
				<aon:outputText value="#{to.id.cdg}" rendered="#{to!=categoria.to}" />
				<aon:inputText id="cdg_edit" styleClass="aon-form-input-text"
					rendered="#{to==categoria.to}"  required="true"
					value="#{categoria.to.id.cdg}" maxlength="8" size="10" />
				<f:facet name="footer">
					<aon:inputText id="cdg_new" styleClass="aon-form-input-text"  
						rendered="#{categoria.new}" required="true"
						value="#{categoria.to.id.cdg}" maxlength="8" size="10"  />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{to!=categoria.to}" />
				<aon:inputText id="description_edit" styleClass="aon-form-input-text"
					rendered="#{to==categoria.to}"  required="true"
					value="#{categoria.to.description}" maxlength="8" size="10" />
				<f:facet name="footer">
					<aon:inputText id="description_new" styleClass="aon-form-input-text"  
						rendered="#{categoria.new}" required="true"
						value="#{categoria.to.description}" maxlength="8" size="10"  />
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=categoria.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==categoria.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{categoria.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==categoria.to}"
						actionListener="#{categoria.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-categoria" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==categoria.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{categoria.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!categoria.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{categoria.new}"
							actionListener="#{categoria.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-categoria" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{categoria.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{categoria.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
		<aon:dataScroller2 for="categoriaData" showNote="true" />
	</aon:div>

</ui:composition>
