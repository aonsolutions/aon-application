<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
	 
	 <aon:div styleClass="aon-finding-toolbar-item-group">
		 <aon:commandButton id="resetProvincia" value="#{bundle.aon_reset}"
				rendered="#{(provincia.model.rowCount == 0) and (!provincia.new) and (comunidad.model.rowCount > 0)}"
				action="pais"
				actionListener="#{provincia.onReset}"
				styleClass="aon-finding-toolbar-item aon-icon-reset"
				accesskey="#{bundle.aon_key_new}" />
	 </aon:div>
	 <rich:spacer />
			
		<aon:editDataTable id="provinciaData" value="#{provincia.model}" 
			var="to" rows="5"
			rendered="#{(provincia.model.rowCount > 0) or (provincia.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				,aon-editDataTable-textColumn, aon-editDataTable-textColumn
				, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{provincia.to == null}" actionListener="#{provincia.onSelect}" />
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{provincia.onReset}" value=""
							rendered="#{!provincia.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>

     	    <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg} #{appBundle.aon_payroll_auxiliares_geograficas__provincia}" />
				</f:facet>
				<aon:outputText value="#{to.cdg}" rendered="#{to!=provincia.to}" />
				
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==provincia.to}" size="5"
					value="#{provincia.to.cdg}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{provincia.new}" size="5"
						value="#{provincia.to.cdg}" maxlength="10" />
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_description} #{appBundle.aon_payroll_auxiliares_geograficas__provincia}" />
				</f:facet>
				<aon:outputText value="#{to.descripcion}" rendered="#{to!=provincia.to}" />
				
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==provincia.to}" size="5"
					value="#{provincia.to.descripcion}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{provincia.new}" size="5"
						value="#{provincia.to.descripcion}" maxlength="10" />
				</f:facet>
			</aon:column>
					
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=provincia.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==provincia.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{provincia.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==provincia.to}"
						actionListener="#{provincia.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==provincia.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{provincia.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!provincia.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{provincia.new}"
							actionListener="#{provincia.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{provincia.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{provincia.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
		<aon:dataScroller2 for="provinciaData" showNote="true" />
		
	</aon:div>

</ui:composition>
