<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="noticeSearch">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true" 				
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
								
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{groupwareBundle.aon_notice}" />
					</aon:div>						
		
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_toolbar_search}" />					
					</aon:div>				
		
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="notice_form" actionListener="#{notice.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							action="notice_list" actionListener="#{notice.cancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true" accesskey="#{bundle.aon_key_cancel}" />	
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{notice.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="notice_list" />		
						
					<aon:outputLabel for="Notice_date-From"
						value="#{groupwareBundle.aon_date_from}" />
					<aon:selectInputDate id="Notice_date-From" value="#{notice.fromDate}"
						popupDateFormat="#{bundle.aon_date_pattern}"
						renderAsPopup="true">
					</aon:selectInputDate>

					<aon:outputLabel for="Notice_date-To"
						value="#{groupwareBundle.aon_date_to}" />
					<aon:selectInputDate id="Notice_date-To" value="#{notice.toDate}"
						popupDateFormat="#{bundle.aon_date_pattern}"
						renderAsPopup="true">
					</aon:selectInputDate>
				
					<aon:outputLabel for="Notice_source"
						value="#{groupwareBundle.notice_source}" />
					<aon:inputText id="Notice_source" size="60"
						valueChangeListener="#{notice.addExpression}" />

					<aon:outputLabel for="Notice_company"
						value="#{groupwareBundle.notice_company}" />
					<aon:inputText id="Notice_company" size="60"
						valueChangeListener="#{notice.addExpression}" />

					<aon:outputLabel for="Notice_phone"
						value="#{groupwareBundle.notice_phone}" />
					<aon:inputText id="Notice_phone" size="20"
						valueChangeListener="#{notice.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
