<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate 
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="RegistrySegment_name" value="#{bundle.aon_segment}" />
				</f:facet>
				<aon:outputText value="#{to.segment.name}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="RegistrySegment_name" rendered="#{formEdit}"
					required="true" value="#{controller.to.segment.id}" 
					valueChangeListener="#{controller.segmentData}">
					<f:selectItems value="#{registryCollections.segments}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu id="RegistrySegment_name-New" rendered="#{formNew}"
						required="true" value="#{controller.to.segment.id}">
						<f:selectItems value="#{registryCollections.segments}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
