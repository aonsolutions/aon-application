<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="columnClasses" value="aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top, aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top, aon-editDataTable-textColumn aon-vertical-align-top" />

			<ui:define name="columns">

				<aon:column width="80">
					<f:facet name="header">
						<aon:outputText value="#{registryBundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.addressType}"
						rendered="#{to!=controller.to}" />
					<aon:selectOneMenu rendered="#{to==controller.to}"
						value="#{controller.to.addressType}">
						<f:selectItems value="#{registryCollections.addressTypes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{controller.new}"
							value="#{controller.to.addressType}">
							<f:selectItems value="#{registryCollections.addressTypes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
	
				<aon:column width="300">
					<f:facet name="header">
						<aon:outputText value="#{registryBundle.aon_address}" />
					</f:facet>
					<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
						rendered="#{to!=controller.to}" />
					<aon:div>
						<aon:inputText value="#{controller.to.address}"
							rendered="#{to==controller.to}"
							required="true" size="40" maxlength="128" />
					</aon:div>
					<aon:div>
						<aon:inputText value="#{controller.to.address2}"
							rendered="#{to==controller.to}"
							size="40" maxlength="128" />
					</aon:div>
					<aon:div>
						<aon:inputText value="#{controller.to.address3}"
							rendered="#{to==controller.to}"
							size="40" maxlength="128" />
					</aon:div>						
					<f:facet name="footer">
						<aon:div>
							<aon:div>
								<aon:inputText id="Address" value="#{controller.to.address}"
									rendered="#{controller.new}"
									required="true" size="40"  maxlength="128" />
							</aon:div>
							<aon:div>						
								<aon:inputText value="#{controller.to.address2}"
									rendered="#{controller.new}"
									size="40"  maxlength="128" />
							</aon:div>
							<aon:div>						
								<aon:inputText value="#{controller.to.address3}"
									rendered="#{controller.new}"
									size="40"  maxlength="128" />
							</aon:div>
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column width="50">
					<f:facet name="header">
						<aon:outputText value="#{registryBundle.aon_zip}" />
					</f:facet>
					<aon:outputText value="#{to.zip}" rendered="#{to!=controller.to}" />
					<aon:inputText value="#{controller.to.zip}"
						rendered="#{to==controller.to}"
						size="8" maxlength="16" />
					<f:facet name="footer">
						<aon:div>
							<aon:inputText id="Zip" value="#{controller.to.zip}"
								rendered="#{controller.new}"
								size="8" maxlength="16" />
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column width="150">
					<f:facet name="header">
						<aon:outputText value="#{registryBundle.aon_city}" />
					</f:facet>
					<aon:outputText value="#{to.city}" rendered="#{to!=controller.to}" />
					<aon:inputText value="#{controller.to.city}"
						rendered="#{to==controller.to}"
						required="true" size="20" maxlength="64" />
					<f:facet name="footer">
						<aon:div>
							<aon:inputText id="City" value="#{controller.to.city}"
								rendered="#{controller.new}"
								required="true" size="20" maxlength="64" />
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column width="130">
					<f:facet name="header">
						<aon:outputText value="#{registryBundle.aon_geozone}" />
					</f:facet>
					<aon:outputText value="#{to.geozone.name}"
						rendered="#{to!=controller.to}" />
					<aon:selectOneMenu value="#{controller.to.geozone.id}"
						rendered="#{to==controller.to}"
						valueChangeListener="#{controller.onChangeGeoZone}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:div>
							<aon:selectOneMenu value="#{controller.to.geozone.id}"
								rendered="#{controller.new}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{geozoneCollections.geoTrees}" />
							</aon:selectOneMenu>
						</aon:div>
					</f:facet>
				</aon:column>

			</ui:define>

		</ui:decorate>

	</aon:div>
</ui:composition>
