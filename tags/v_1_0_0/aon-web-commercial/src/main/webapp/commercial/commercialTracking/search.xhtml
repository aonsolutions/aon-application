<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="commercialTrackingSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.aon_commercial_tracking}" />
				<ui:param name="controller" value="#{commercialTracking}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{commercialTracking.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="commercialTracking_list" />				
				
					<aon:outputText value="#{appBundle.aon_commercial_tracking_date}" />
					<aon:div>
						<aon:outputLabel for="CommercialTracking_date-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="CommercialTracking_date-From"
							value="#{commercialTracking.dateFrom}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
			
						<aon:outputLabel for="CommercialTracking_date-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="CommercialTracking_date-To"
							value="#{commercialTracking.dateTo}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>
			
					<aon:outputLabel for="CommercialTracking_seller_id"
						value="#{appBundle.aon_commercial_tracking_seller}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CommercialTracking_seller_id"
							lookup="#{sellerLookup}"
							reRender="CommercialTracking_seller_name"
							value="#{commercialTracking.seller.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="CommercialTracking_seller_lookup"
							windowTitle="#{appBundle.aon_lookup_seller}"
							selectReRender="CommercialTracking_seller_id,CommercialTracking_seller_name"
							lookup="#{sellerLookup}" minHeight="440"
							property="#{commercialTracking.seller}">
						</aon:lookupButton>
						<aon:inputText id="CommercialTracking_seller_name"
							value="#{(commercialTracking.seller.registry.name!=null)?(commercialTracking.seller.registry.fullName):('')}"
							size="60" disabled="true" />
					</aon:div>
			
					<aon:outputLabel for="CommercialTracking_target_id"
						value="#{appBundle.aon_commercial_tracking_target}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CommercialTracking_target_id"
							lookup="#{targetLookup}"
							reRender="CommercialTracking_target_name"
							value="#{commercialTracking.target.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="CommercialTracking_target_lookup"
							windowTitle="#{appBundle.aon_lookup_target}" actionType="search"
							selectReRender="CommercialTracking_target_id,CommercialTracking_target_name"
							lookup="#{targetLookup}" minHeight="460" minWidth="650"
							property="#{commercialTracking.target}">
						</aon:lookupButton>
						<aon:inputText id="CommercialTracking_target_name"
							value="#{(commercialTracking.target.registry.name!=null)?(commercialTracking.target.registry.fullName):('')}"
							size="60" disabled="true" />
					</aon:div>
			
					<aon:outputLabel for="CommercialTracking_next_activity_id"
						value="#{appBundle.aon_commercial_tracking_activity}" />
					<aon:selectOneMenu id="CommercialTracking_next_activity_id" 
						value="#{commercialTracking.activity}">
						<f:converter converterId="toConverter" />
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{commercialTracking.activities}" />
					</aon:selectOneMenu>
				
					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="st0" value="#{commercialTracking.statusPending}" />
						<aon:outputLabel for="st0"
							value="#{commercialBundle.aon_enum_commercial_tracking_status_PENDING}" />
						<aon:selectBooleanCheckbox id="st1" value="#{commercialTracking.statusClosed}" />
						<aon:outputLabel for="st1"
							value="#{commercialBundle.aon_enum_commercial_tracking_status_CLOSED}" />
					</aon:div>
					<aon:outputLabel for="CommercialTracking_comments"
						value="#{appBundle.aon_commercial_tracking_comments}" />
					<aon:inputText id="CommercialTracking_comments" size="75"
						valueChangeListener="#{commercialTracking.addExpression}" />

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />		
	</ui:define>
		
</ui:composition>
