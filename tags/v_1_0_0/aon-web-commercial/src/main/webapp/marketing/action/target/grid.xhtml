<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{campaignActionTarget}" />
			<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-text-center" />
			<ui:define name="columns">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_commercial_tracking_target}" />
					</f:facet>
					<aon:outputText value="#{to.target.registry.fullName}"
						rendered="#{to!=controller.to}" />
					<aon:div styleClass="aon-lookup" rendered="#{to==controller.to}">
						<aon:lookupInputText id="ActionTarget_target_id"
							lookup="#{targetLookup}" required="true"
							reRender="ActionTarget_target_name"
							value="#{campaignActionTarget.to.target.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton 
							windowTitle="#{appBundle.aon_lookup_target}" actionType="search"
							selectReRender="campaignActionTargetData"
							lookup="#{targetLookup}" minHeight="460" minWidth="650"
							property="#{controller.to.target}">
						</aon:lookupButton>
						<aon:inputText id="ActionTarget_target_name"
							value="#{(controller.to.target.registry.name!=null)?(controller.to.target.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>
					<f:facet name="footer">
						<aon:div styleClass="aon-lookup" rendered="#{controller.new}">
							<aon:lookupInputText id="ActionTarget_target_id-New"
								lookup="#{targetLookup}" required="true"
								reRender="ActionTarget_target_name-New"
								value="#{campaignActionTarget.to.target.id}" size="5">
							</aon:lookupInputText>
							<aon:lookupButton 
								windowTitle="#{appBundle.aon_lookup_target}" actionType="search"
								selectReRender="ActionTarget_target_id-New,ActionTarget_target_name-New"
								lookup="#{targetLookup}" minHeight="460" minWidth="650"
								property="#{controller.to.target}">
							</aon:lookupButton>
							<aon:inputText id="ActionTarget_target_name-New"
								value="#{(controller.to.target.registry.name!=null)?(controller.to.target.registry.fullName):('')}"
								size="80" disabled="true" />
						</aon:div>
					</f:facet>
				</aon:column>
				
				<aon:column width="80">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_status}" />
					</f:facet>
					<aon:outputText value="#{to.status}"
						rendered="#{to!=controller.to}" />
					<aon:selectOneMenu rendered="#{to==controller.to}"
						value="#{controller.to.status}">
						<f:selectItems value="#{marketingCollections.actionTargetStatuses}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{controller.new}"
							value="#{controller.to.status}">
							<f:selectItems value="#{marketingCollections.actionTargetStatuses}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>		
				
				<aon:column width="80">
					<f:facet name="header">
						<aon:outputText value="#{marketingBundle.aon_marketing_survey_response}" />
					</f:facet>
					<aon:outputText value="#{to.surveyResponse.survey.description}" rendered="#{to!=controller.to}">
						<aon:abbreviateConverter maxWidth="40" />
					</aon:outputText>					
					<aon:commandLink style="padding:1px 5px 1px 16px; margin:0 0 0 5px; border:0; width:auto;overflow:visible;"
						styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
						action="surveyResponse_action_form" actionListener="#{surveyResponse.onSelectSurveyResponse}"
						rendered="#{(to==controller.to) and (controller.to.surveyResponse.id != null)}">
						<aon:outputText value="&#160;" />
					</aon:commandLink>
				</aon:column>		

			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
