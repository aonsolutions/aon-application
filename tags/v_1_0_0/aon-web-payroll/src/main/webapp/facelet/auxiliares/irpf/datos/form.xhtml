<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="irpfMaestroForm">

	
           <ui:include src="/facelet/templates/formPrintToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_irpf__datosirpf}" />				
			<ui:param name="controller" value="#{irpfMaestro}" />
			<ui:param name="reportKey" value="DatosList" />
			<ui:param name="reportKeyXls" value="DatosListXLS" />
			</ui:include>
					
			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="irpfMaestro" columns="2" dir="true" width="100%"
					style="margin-bottom=2px;">


					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{irpfMaestro.to.cdg}"
						disabled="#{!irpfMaestro.new}" required="true" size="20"
						maxlength="3" />

					<aon:outputLabel value="#{appBundle.aon_payroll_description}" />
					<aon:inputText value="#{irpfMaestro.to.description}"
						required="true" size="70" maxlength="30">
					</aon:inputText>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_auxiliares_irpf__datos_porcen}" />
					<aon:selectBooleanCheckbox value="#{irpfMaestro.to.porcentajebol}" />

				</aon:panelGrid>

				<ui:include src="grid.xhtml" rendered="#{!irpfMaestro.new}" />
			</aon:div>


		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
