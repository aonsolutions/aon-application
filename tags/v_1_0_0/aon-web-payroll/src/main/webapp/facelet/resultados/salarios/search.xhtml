<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="nominaexSearch">

					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{menuBundle.resultados_recibos_salarios__nominaex}" />
						<ui:param name="controller" value="#{nominaex}" />
						<ui:param name="skipResetButton" value="true" />
					</ui:include>

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
						<ui:define name="searchContent">
							<aon:methodParam name="searchActionListener"
								value="#{nominaex.onSearch}" type="actionListener" />
							<aon:methodParam name="searchAction"
								value="nominaex_list" />

							<!-- *********************************** -->
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_numero_paga}" />
							<aon:inputText id="Nominaex_id_numero"
								size="5" maxlength="5"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_trabajador}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Trabajador_cdg"
									lookup="#{trabajadorLookup}" reRender="Trabajador_codnsz"
									value="#{nominaex.emprper.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Trabajador_lookup"
									windowTitle="#{appBundle.aon_payroll_resultados_salarios_nominaex_trabajador}"
									selectReRender="Trabajador_cdg,Trabajador_codnsz"
									lookup="#{trabajadorLookup}" minHeight="440"
									property="#{nominaex.emprper}">
								</aon:lookupButton>
							</aon:div>

							<!-- *********************************** -->

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_emision}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.fecemi}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_empresa}" />
							<aon:inputText id="Nominaex_nomemp"
								size="60" maxlength="60"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_nombre_trabajador}" />
							<aon:inputText id="Nominaex_nomper"
								size="60" maxlength="60"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_dir_empresa}" />
							<aon:inputText id="Nominaex_direccion"
								size="60" maxlength="60"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_categoria}" />
							<aon:inputText id="Nominaex_descat"
								size="30" maxlength="35"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_localidad}" />
							<aon:inputText id="Nominaex_localidad"
								size="60" maxlength="60"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_profesion}" />
							<aon:inputText id="Nominaex_profesion"
								size="60" maxlength="25"
								valueChangeListener="#{nominaex.addExpression}" />

							<!-- *********************************** -->

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_antiguedad}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.fecant}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_matricula}" />
							<aon:inputText id="Nominaex_nummat" size="5"
								maxlength="5" valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_inicio_paga}" />
							<aon:selectInputDate renderAsPopup="true"
								id="FechaInicioPaga"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.fecini}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_mes}" />
							<aon:inputText id="Nominaex_mes" size="5"
								maxlength="5" valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_cobro}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.feccob}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_fin_paga}" />
							<aon:selectInputDate renderAsPopup="true"
								id="FechaFinPaga"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.fecfin}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_anio}" />
							<aon:inputText id="Nominaex_anio" size="5"
								maxlength="5" valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_cobro_real}" />
							<aon:selectInputDate renderAsPopup="true"
								id="FechaCobreReal"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.feccobreal}" enableManualInput="true" />

							<!-- *********************************** -->

							<aon:outputLabel value="" />
							<aon:panel>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_devengos}" />
								</f:facet>

								<aon:panelGrid columns="3" dir="true"
									width="100%" style="text-align=top;">
									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_dev}" />
									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_concepto}" />
									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_importe}" />

									<aon:inputText
										id="Nominaex_complemento_cdg" size="2" maxlength="2"
										valueChangeListener="#{nominaex.addExpression}" />
									<aon:inputText id="Nominaex_descom"
										size="40" maxlength="50"
										valueChangeListener="#{nominaex.addExpression}" />
									<aon:inputText id="Nominaex_importe"
										size="15" maxlength="11"
										valueChangeListener="#{nominaex.addExpression}" />

									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fijoVar}" />
									<aon:selectOneRadio layout="pagedirection"
										id="Nominaex_fijovar"
										valueChangeListener="#{nominaex.addExpression}">
										<aon:enumConverter
											enum="com.code.aon.payroll.enumeration.FijoVariable" />
										<f:selectItems
											value="#{nominaex.listaFijovar}" />
									</aon:selectOneRadio>

								</aon:panelGrid>
							</aon:panel>

							<aon:outputLabel value="" />
							<aon:panel>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_deducciones}" />
								</f:facet>
								<aon:panelGrid columns="3" dir="true"
									width="100%" style="text-align=top;">

									<aon:outputLabel value=" " />
									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_irpf}" />
									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_importe_irpf}" />

									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_retencion_cuenta}" />
									<aon:div>
										<aon:inputText
											id="Nominaex_irpf" size="6" maxlength="6"
											valueChangeListener="#{nominaex.addExpression}" />
										<aon:outputLabel
											value="#{appBundle.aon_payroll_resultados_salarios_nominaex_s}" />
									</aon:div>
									<aon:inputText id="Nominaex_impirpf"
										size="15" maxlength="11"
										valueChangeListener="#{nominaex.addExpression}" />

								</aon:panelGrid>

								<aon:panelGrid columns="2" dir="true"
									width="100%" style="text-align=top;">	
									 
									<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_minoracion}" />
									<aon:inputText id="Nominaex_nomdtoex_id_linea"  
										size="5" maxlength="5"
										valueChangeListener="#{nominaex.addExpression}" />
									<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_concepto}" />
									<aon:inputText id="Nominaex_nomdtoex_concepto" size="30" maxlength="30"
										valueChangeListener="#{nominaex.addExpression}" />
									<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_importe}" />
									<aon:inputText id="Nominaex_nomdtoex_importe" size="30" maxlength="30"
										valueChangeListener="#{nominaex.addExpression}" />
								</aon:panelGrid>

							</aon:panel>

							<!-- *********************************** -->

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_total_deducir}" />
							<aon:inputText id="Nominaex_totalDeducir"
								size="15" maxlength="15"
								valueChangeListener="#{nominaex.addExpression}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_liquido_percibir}" />
							<aon:inputText id="Nominaex_liquido"
								size="15" maxlength="15"
								valueChangeListener="#{nominaex.addExpression}" />

							<!-- *********************************** -->

						</ui:define>
					</ui:decorate>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />
			</ui:define>
		</ui:composition>

	</body>
</html>
