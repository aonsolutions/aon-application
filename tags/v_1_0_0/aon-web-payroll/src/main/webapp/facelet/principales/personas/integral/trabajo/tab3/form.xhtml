<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">


	<aon:div id="tab3Data" styleClass="aon-scroll-area">
		
		<aon:panelGrid columns="2" dir="true" style="float:left;">
			<aon:outputLabel for="fec_alta"
				value="#{appBundle.aon_payroll_principales_trabajo_tomar_fec_alta}" />
			<aon:selectBooleanCheckbox id="fec_alta" value="#{trabajo.to.indalt}" />
			
			<aon:outputLabel for="desc_dias_it"
				value="#{appBundle.aon_payroll_principales_trabajo_desc_dias_it}" />
			<aon:selectBooleanCheckbox id="desc_dias_it" value="#{trabajo.to.inddtoit}" />
			
			<aon:outputLabel for="desc_dias_inci"
				value="#{appBundle.aon_payroll_principales_trabajo_desc_dias_inci}" />
			<aon:selectBooleanCheckbox id="desc_dias_inci" value="#{trabajo.to.inddtootr}" />
			
			<aon:outputLabel for="percent_conv"
				value="#{appBundle.aon_payroll_principales_trabajo_act_percent_conv}" />
			<aon:selectBooleanCheckbox id="percent_conv" value="#{trabajo.to.indactcon}" />
		</aon:panelGrid>
		
		<aon:panelGrid columns="2" dir="true" style="float:left;margin-left:10px;">
			<aon:outputLabel for="tiempo_contr"
				value="#{appBundle.aon_payroll_principales_trabajo_tiempo_contr}" />
			<aon:selectOneRadio value="#{trabajo.to.indtp}" layout="pageDirection" id="tiempo_contr">	
				<f:selectItems value="#{httrabajador.listatimecont}"/>											
			</aon:selectOneRadio>
		</aon:panelGrid>
		
		<aon:panelGrid columns="2" dir="true" style="float:left;margin-left:10px;">
			<aon:outputLabel for="ind_irpf"
				value="#{appBundle.aon_payroll_principales_trabajo_ind_irpf}" />
			<aon:selectOneRadio value="#{trabajo.to.indirpf}" layout="pageDirection" id="ind_irpf">	
				<f:selectItems value="#{httrabajador.listatipirpf}"/>											
			</aon:selectOneRadio>
		</aon:panelGrid>
			
		<aon:panelGrid columns="4" dir="true" style="clear:both;margin:5px 0;">
			<aon:outputLabel for="per_ceu_mel"
				value="#{appBundle.aon_payroll_principales_trabajo_res_per_ceu_mel}" />
			<aon:selectBooleanCheckbox id="per_ceu_mel" value="#{trabajo.to.indceutamelilla}" />
	
			<aon:outputLabel for="asim_coti"
				value="#{appBundle.aon_payroll_principales_trabajo_asim_coti}" />
			<aon:inputText id="asim_coti" value="#{trabajo.to.porcoti.cdg}" />
		</aon:panelGrid>
		
		<aon:panel>
			<f:facet name="header">
				<aon:outputLabel value="#{appBundle.aon_payroll_principales_trabajo_desc_percent}" />
			</f:facet>
			<aon:panelGrid columns="4" dir="true" >
				<aon:outputLabel for="cod_conv_tc2"
					value="#{appBundle.aon_payroll_principales_trabajo_cod_conv_tc2}" />
				<aon:inputText id="cod_conv_tc2" value="#{trabajo.to.concol}" />
				
				<aon:outputLabel for="trab_espec"
					value="#{appBundle.aon_payroll_principales_trabajo_trab_espec}" />
				<aon:inputText id="trab_espec" value="#{trabajo.to.especial}" />
			</aon:panelGrid>
		</aon:panel>
	
		<aon:panelGrid columns="2" dir="true" >			
			<aon:outputLabel for="histor_modif"
				value="#{appBundle.aon_payroll_principales_trabajo_histor_modif}" />
			<aon:inputTextarea id="histor_modif" value="#{trabajo.to.historico}" />

		</aon:panelGrid>

	</aon:div>

</ui:composition>
