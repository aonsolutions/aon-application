<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.template}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.aon_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="template_upload"
						actionListener="#{template.onNewTemplate}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}"/>
					<aon:confirmButton id="remove"
						value="#{bundle.aon_remove}" 
						rendered="#{!template.checklistEmpty}" 
						inmediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{template.onRemoveSelected}"
						confirmAction="template_list"
						accesskey="#{bundle.aon_key_remove}"/>
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">

			<aon:dataTable id="dataTable" value="#{template.templates}" var="to"
				rows="#{template.pageLimit}" 
				columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
						aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn aon-width-70,
						aon-editDataTable-textColumn aon-width-70">
		
				<aon:column>
					<f:facet name="header">
						<aon:div>
							<aon:outputText value="#{bundle.aon_check}" />
						</aon:div>	
					</f:facet>
					<aon:selectBooleanCheckbox id="Row_checked"
							rendered="#{!to.defaultTemplate}"
							value="#{template.rowChecked}">
							<a4j:support 
								event="onclick"  
								reRender="dataTable,buttonsGrid" />
					</aon:selectBooleanCheckbox>
					<aon:graphicImage id="Template_selected_blocked" 
						rendered="#{to.defaultTemplate}"
						url="#{aonResource.resolveLocal['/images/cms/blocked.gif']}" 
						alt="#{appBundle.template_blocked}"/>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText for="Template_name" value="#{appBundle.template_name}" />
					</f:facet>
					<aon:outputText id="Template_name" value="#{to.name}"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText for="Template_defaultMenu" value="#{appBundle.template_defaultTemplate}" />
					</f:facet>
					<aon:selectBooleanCheckbox 
							value="#{to.defaultTemplate}"
							rendered="#{!to.defaultTemplate}">
						<a4j:support 
							actionListener="#{template.defaultTemplateChanged}"
							event="onclick"  
							reRender="dataTable" />
					</aon:selectBooleanCheckbox>
					<aon:graphicImage id="Template_default_blocked" rendered="#{to.defaultTemplate}"
						url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" alt="#{appBundle.template_blocked}"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText for="Template_author" value="#{appBundle.template_author}" />
					</f:facet>
					<aon:outputText id="Template_author" value="#{to.author}"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText for="Template_version" value="#{appBundle.template_version}" />
					</f:facet>
					<aon:outputText id="Template_version" value="#{to.version}"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText for="Template_creationDate" value="#{appBundle.template_creationDate}" />
					</f:facet>
					<aon:outputText id="Template_creationDate" value="#{to.creationDate}"/>
				</aon:column>

			</aon:dataTable>
		
			<aon:dataScroller2 for="dataTable" />

		</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
