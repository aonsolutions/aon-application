<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="principalesMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">
	
					<aon:panelGroup>
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{menuBundle.principales_clientes}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div>
									<aon:commandLink action="cliente_form"
										value="#{menuBundle.principales_clientes__cliente}"
										>
										<aon:actionListener method="#{cliente.onEditSearch}" />
										<aon:actionListener method="#{cliente.onSearch}" />
										<aon:actionListener method="#{cliente.onSelectFirst}" />
									</aon:commandLink>
								</aon:div>
								<aon:div>
									<aon:commandLink value="#{menuBundle.principales_clientes__integral_emp}" disabled="true" />
								</aon:div>
							</aon:div>
						</aon:panel>
				
						<aon:div styleClass="aon-padding-top">
							<aon:panel>
								<f:facet name="header">
									<aon:outputText value="#{menuBundle.principales_autonomos}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div>
										<aon:commandLink value="#{menuBundle.principales_autonomos__autonomos}" disabled="true" />
									</aon:div>
								</aon:div>
							</aon:panel>
						</aon:div>
		
						<aon:div styleClass="aon-padding-top">		
							<aon:panel>
								<f:facet name="header">
									<aon:outputText value="#{menuBundle.principales_registro_documentos}" styleClass="aon-portlet-title-text"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div>
										<aon:commandLink value="#{menuBundle.principales_registro_documentos__regiempr}" disabled="true" />
									</aon:div>
									<aon:div>
										<aon:commandLink value="#{menuBundle.principales_registro_documentos__regitrab}" disabled="true" />
									</aon:div>
								</aon:div>
							</aon:panel>
						</aon:div>
					</aon:panelGroup>
	
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{menuBundle.principales_personas}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__personas}" disabled="true" />
							</aon:div>
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__integral_per}" disabled="true" />
							</aon:div>
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__percep}" disabled="true" />
							</aon:div>
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__otrperc}" disabled="true" />
							</aon:div>
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__embargo}" disabled="true" />
							</aon:div>
						</aon:div>
					</aon:panel>
	
					
				</aon:panelGrid>		

			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
