<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"	
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="entidadMaestroSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_cotizacion_entidades}" />
				<ui:param name="controller" value="#{entidadMaestro}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{entidadMaestro.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="entidadMaestro_list" />				
				
					<aon:outputLabel for="Entidad_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Entidad_cdg" size="10" maxlength="8"
						valueChangeListener="#{entidadMaestro.addExpression}" />

					<aon:outputLabel for="Entidad_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Entidad_description" size="60" maxlength="50"
						valueChangeListener="#{entidadMaestro.addExpression}" />
			
					<aon:outputLabel for="EntidadMaestro_sucursales_id_cdg"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_cod}" />
					<aon:inputText id="Entidad_sucursales_id_cdg" size="60" maxlength="60"
						valueChangeListener="#{entidadMaestro.addDirectExpression}" />
						
				  		<aon:outputLabel for="EntidadMaestro_sucursales_domsuc"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_dom}" />
					<aon:inputText id="Entidad_sucursales_domsuc" size="60" maxlength="60"
						valueChangeListener="#{entidadMaestro.addDirectExpression}" />	
						
						<aon:outputLabel for="EntidadMaestro_sucursales_munsuc"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_mun}" />
					<aon:inputText id="Entidad_sucursales_munsuc" size="60" maxlength="60"
						valueChangeListener="#{entidadMaestro.addDirectExpression}" />
						
						<aon:outputLabel for="EntidadMaestro_sucursales_cpsuc"
						value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_codpos}" />
					<aon:inputText id="Entidad_sucursales_cpsuc" size="60" maxlength="60"
						valueChangeListener="#{entidadMaestro.addDirectExpression}" />
					
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
