<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="nacionGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/facelet/templates/gridPrintToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{menuBundle.auxiliares_geograficas__nacion}" />
					<ui:param name="controller" value="#{nacion}" />
					<ui:param name="reportKey" value="tiposNacion" />
					<aon:valueParam name="skipSearchButton" default="false" />
				</ui:include>

				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">

					<aon:editDataTable id="nacionData" var="to" rows="20"
						rendered="#{(nacion.model.rowCount > 0) or (nacion.new)}"
						value="#{nacion.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

						<aon:rowSelector toggleOnClick="#{nacion.to == null}"
							actionListener="#{nacion.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{nacion.onReset}" value=""
										rendered="#{!nacion.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}" rendered="#{to!=nacion.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==nacion.to}" size="4" value="#{nacion.to.cdg}"
								maxlength="4" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{nacion.new}" size="4" value="#{nacion.to.cdg}"
									maxlength="4" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}"
								rendered="#{to!=nacion.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==nacion.to}" size="60"
								value="#{nacion.to.description}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{nacion.new}" size="60"
									value="#{nacion.to.description}" maxlength="45" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=nacion.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope"
									title="[#{bundle.aon_accept}]" rendered="#{to==nacion.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{nacion.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==nacion.to}" actionListener="#{nacion.onCancel}"
									immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==nacion.to}"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{nacion.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!nacion.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{nacion.new}" actionListener="#{nacion.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{nacion.new}"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{nacion.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>

					</aon:editDataTable>
					<aon:dataScroller2 for="nacionData" showNote="true"/>
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
