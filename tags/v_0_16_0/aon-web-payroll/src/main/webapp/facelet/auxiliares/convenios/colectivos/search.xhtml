<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="convenioSearch">
			 
			 <ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_convenios__convenio}" />
				<ui:param name="controller" value="#{convenio}" />
			</ui:include>
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{convenio.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="convenio_list" />				
				
					<aon:outputLabel for="Convenio_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Convenio_cdg" size="10" maxlength="8"
						valueChangeListener="#{convenio.addExpression}" />

					<aon:outputLabel for="Convenio_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Convenio_description" size="60" maxlength="50"
						valueChangeListener="#{convenio.addExpression}" />
						
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
