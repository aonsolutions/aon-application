<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
	 <rich:spacer />
		<aon:editDataTable id="linbaseData" value="#{linbase.model}" 
			var="to" rows="0"
			rendered="#{(linbase.model.rowCount > 0) or (linbase.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{linbase.to == null}" actionListener="#{linbase.onSelect}" />
			
                <f:facet name="header">
                        
	                        
	                        <rich:columnGroup >
	                        
	                             <rich:column colspan="3" >
                               
                                 </rich:column>
                                 
                                 <rich:column colspan="4">
                                  <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_rg}" />
                                 </rich:column>
                                 
                                 
                                 <rich:column colspan="1" rowspan="2">
                               <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_ra}" />
                                </rich:column>
                                 <rich:column colspan="4">
                               <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_rag}" />
                                </rich:column>
                                
	                            <rich:column breakBefore="true" colspan="1">
	                                <rich:spacer />
	                            </rich:column>
	                            <rich:column colspan="2">
	                                <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_peri}" />
	                            </rich:column>
	                             <rich:column colspan="2" >
	                                <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_cc}" />
	                            </rich:column>
	                            <rich:column colspan="2">
	                                <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_ccp}" />
	                            </rich:column>
	                            
	                             <rich:column colspan="2">
	                                <aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion_min}" />
	                            </rich:column>
	                           <rich:column colspan="2">
	                       
	                            </rich:column>
	                            
	                       
	                            
	                          </rich:columnGroup>
	                    </f:facet>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{linbase.onReset}" value=""
							rendered="#{!linbase.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=linbase.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{linbase.to.id.fecini}" inputSize="10"
					rendered="#{to==linbase.to}" disabled="#{to==linbase.to}"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{linbase.to.id.fecini}"
						rendered="#{linbase.new}" inputSize="10"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=linbase.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{linbase.to.fecfin}"
					rendered="#{to==linbase.to}" inputSize="10"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{linbase.to.fecfin}"
						rendered="#{linbase.new}" inputSize="10"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
		     	</aon:column>
			
			     	    <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__mincot}" />
							</f:facet>
							<aon:outputText value="#{to.mincot}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number" minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.mincot}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.mincot}" maxlength="10" />
							</f:facet>
						</aon:column>
					
		  				      <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__maxcot}" />
							</f:facet>
							<aon:outputText value="#{to.maxcot}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number"  minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.maxcot}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.maxcot}" maxlength="10" />
							</f:facet>
						</aon:column>
						
						
						      <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__minhor}" />
							</f:facet>
							<aon:outputText value="#{to.minhor}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number" minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.minhor}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.minhor}" maxlength="10" />
							</f:facet>
						</aon:column>
									
						      <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__mindia}" />
							</f:facet>
							<aon:outputText value="#{to.mindia}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number"  minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.mindia}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.mindia}" maxlength="10" />
							</f:facet>
						</aon:column>
						
							
									
						      <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__jordiaagr}" />
							</f:facet>
							<aon:outputText value="#{to.jordiaagr}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number" minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.jordiaagr}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.jordiaagr}" maxlength="10" />
							</f:facet>
						</aon:column>
								
						      <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__mindiaart1}" />
							</f:facet>
							<aon:outputText value="#{to.mindiaart1}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number" minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.mindiaart1}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.mindiaart1}" maxlength="10" />
							</f:facet>
						</aon:column>
						
 	                       <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__mindiaart2}" />
							</f:facet>
							<aon:outputText value="#{to.mindiaart2}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number"  minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.mindiaart2}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.mindiaart2}" maxlength="10" />
							</f:facet>
						</aon:column>
 
						 <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_cotizacion__acdiaart}" />
							</f:facet>
							<aon:outputText value="#{to.acdiaart}" rendered="#{to!=linbase.to}" >
								<f:convertNumber type="number"  minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==linbase.to}" size="5"
								value="#{linbase.to.acdiaart}" maxlength="10" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{linbase.new}" size="5"
									value="#{linbase.to.acdiaart}" maxlength="10" />
							</f:facet>
						</aon:column>
 
 


			

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=linbase.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==linbase.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{linbase.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==linbase.to}"
						actionListener="#{linbase.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==linbase.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{linbase.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!linbase.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{linbase.new}"
							actionListener="#{linbase.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{linbase.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{linbase.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
