<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="ocupacionForm">
			
				<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_cotizacion__ocupacion}" />
				<ui:param name="controller" value="#{ocupacionMaestro}" />
				<ui:param name="reportKey" value="OcupacionList"/>	
				<ui:param name="reportKeyXls" value="OcupacionListXLS"/>					
			</ui:include>
		
			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="ocupacionMaestro" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel for="OcupacionMaestro_cdg" value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="OcupacionMaestro_cdg" value="#{ocupacionMaestro.to.cdg}" disabled="#{!ocupacionMaestro.new}" 
						required="true" size="15" maxlength="10" />
				
					<aon:outputLabel for="OcupacionMaestro_description" value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="OcupacionMaestro_description" value="#{ocupacionMaestro.to.description}" 
						size="70" maxlength="50" >
					</aon:inputText>
					
					<aon:outputLabel for="OcupacionMaestro_exclusivo" value="#{appBundle.aon_payroll_cotizacion_exclusivo}" />
					<aon:selectBooleanCheckbox id="OcupacionMaestro_exclusivo" 
						value="#{ocupacionMaestro.to.exclusivobol}" />
			
				</aon:panelGrid>

				<ui:include src="grid.xhtml" rendered="#{!ocupacionMaestro.new}" />				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
