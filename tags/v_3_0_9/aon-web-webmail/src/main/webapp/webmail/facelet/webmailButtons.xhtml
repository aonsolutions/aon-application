<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

	<aon:div id="treeButtonsGrid" styleClass="aon-toolbar">

		<aon:commandButton id="refreshAccounts" action="folder"
			actionListener="#{folder.refresh}"
			title="#{appBundle.aon_webmail_refresh}"
			value="#{appBundle.aon_webmail_refresh}"
			styleClass="aon-finding-toolbar-item aon-icon-refresh">
		</aon:commandButton>

		<aon:commandButton id="contacts"
			title="#{appBundle.aon_webmail_email}" action="contact_list"
			value="#{appBundle.aon_webmail_email}"
			styleClass="aon-finding-toolbar-item aon-icon-agenda">
		</aon:commandButton>


		<aon:commandButton id="signature"
			title="#{appBundle.aon_webmail_signature}" action="signature_list"
			value="#{appBundle.aon_webmail_signature}"
			styleClass="aon-finding-toolbar-item aon-icon-signature">
		</aon:commandButton>

		<aon:commandButton id="mailAccountCahnge"
			title="#{appBundle.aon_webmail_mailAccount}"
			action="mailAccount_list" value="#{appBundle.aon_webmail_mailAccount}"
			styleClass="aon-finding-toolbar-item aon-icon-mailAccountChange">
		</aon:commandButton>

		<aon:commandButton id="blackListCB"
			rendered="#{blacklist.blackListConfigured}"
			title="#{appBundle.aon_webmail_black_white_list}" action="bwlist"
			actionListener="#{blacklist.onLoad}"
			value="#{appBundle.aon_webmail_black_white_list}"
			styleClass="aon-finding-toolbar-item aon-icon-mail-spam">
		</aon:commandButton>

	</aon:div>

</ui:composition>

</body>
</html>
