<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="pagesForm">

		<aon:div layout="none">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.infoweb_pages}" />
				<ui:param name="controller" value="#{companyImages}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
			
			<rich:panel styleClass="aon-content-home">
				<aon:editDataTable id="WebInfoPage_datatable" value="#{webPage.model}"
					var="to" rows="10" 
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn aon-width-auto, aon-editDataTable-textColumn, 
						aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
			
					<aon:rowSelector toggleOnClick="false"/>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;"/>
						</f:facet>
						<a4j:support actionListener="#{webPage.onSelect}" event="onclick"  reRender="pagesForm"/>
						<aon:outputText value="&#160;"/>
						<f:facet name="footer">
							<aon:div rendered="#{webPage.model.rowCount &lt; 11}">
								<aon:commandButton id="reset"
									styleClass="aon-icon-reset aon-icon-commandButton"
									value="" rendered="#{!webPage.new}" actionListener="#{webPage.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:div rendered="#{to!=webPage.to}">
							<a4j:support actionListener="#{webPage.onSelect}" event="onclick" reRender="pagesForm"/>
							<aon:outputText value="#{to.name}" />
						</aon:div>
						<aon:div rendered="#{to==webPage.to}" >
							<aon:inputText value="#{webPage.to.name}"
								required="#{true}" size="20" />
						</aon:div>
						<f:facet name="footer">
							<aon:div>
								<aon:div>				
									<aon:inputText value="#{webPage.to.name}"
										rendered="#{webPage.new}" required="#{true}" size="20" />
								</aon:div>
							</aon:div>
						</f:facet>
					</aon:column>
			
					<aon:column style="width:200px;">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:div rendered="#{to!=webPage.to}">
							<a4j:support actionListener="#{webPage.onSelect}" event="onclick" reRender="pagesForm"/>
							<aon:outputText value="#{to.type}" />
						</aon:div>
						<aon:div rendered="#{to==webPage.to}">
							<aon:selectOneMenu value="#{webPage.to.type}">
								<f:selectItems value="#{webinfoCollections.pageTypes}" />
							</aon:selectOneMenu>
						</aon:div>
						<f:facet name="footer">
							<aon:selectOneMenu value="#{webPage.to.type}"
								rendered="#{webPage.new}">
								<f:selectItems value="#{webinfoCollections.pageTypes}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>
		
					<aon:column style="width:40px;text-align:center">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.infoweb_page_active}" />
						</f:facet>
						<aon:commandLink title="#{appBundle.infoweb_page_activate}" 
							actionListener="#{webPage.onActivate}" 
							rendered="#{!to.active}">
							<aon:graphicImage id="WebInfoPage_active" alt="#{appBundle.infoweb_page_activate}"
								url="/images/inactive.png" />
						</aon:commandLink>
						<aon:commandLink title="#{appBundle.infoweb_page_deactivate}" 
							actionListener="#{webPage.onDeactivate}"
							rendered="#{to.active}">
							<aon:graphicImage id="MenuOption_deactive" alt="#{appBundle.infoweb_page_deactivate}"
								url="/images/active.png" />
						</aon:commandLink>
					</aon:column>
		
					<aon:column style="width:60px;text-align:left">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.infoweb_page_position}" />
						</f:facet>
						<aon:graphicImage rendered="#{to.position == 0}"
							url="/images/spacer16.gif" style="margin-left: 0px;"/>
						<aon:commandLink title="#{appBundle.infoweb_page_up}" 
							actionListener="#{webPage.onMoveUp}"
							rendered="#{to.position != 0}">
							<aon:graphicImage id="webPage_up" alt="#{appBundle.infoweb_page_up}"
								url="/images/up.gif" />
						</aon:commandLink>
						<aon:commandLink title="#{appBundle.infoweb_page_down}" 
							actionListener="#{webPage.onMoveDown}"
							rendered="#{to.position &lt; (webPage.model.rowCount - 1)}">
							<aon:graphicImage id="webPage_down" alt="#{appBundle.infoweb_page_down}"
								url="/images/down.gif" style="margin-left: 5px;"/>
						</aon:commandLink>
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;"/>
						</f:facet>
						<aon:div rendered="#{to!=webPage.to}">
							<aon:commandButton title="#{appBundle.infoweb_page_detail}"
								actionListener="#{webPage.onSelectDetail}" rendered="#{to.detailed}"
								value="" styleClass="aon-editDataTable-button aon-icon-file-entrance"
								reRender="showGenericModalPanel, showLocationModalPanel, showResourceModalPanel"/>
							<aon:outputText value="&#160;"/>
						</aon:div>
						<aon:div rendered="#{to==webPage.to}" >
							<aon:commandButton title="#{bundle.aon_save}"
								actionListener="#{webPage.onAccept}"
								value="" styleClass="aon-editDataTable-button aon-icon-accept"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{webPage.onCancel}" immediate="#{true}"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
							<aon:commandButton title="#{bundle.aon_remove}"
								actionListener="#{webPage.onRemove}"
								styleClass="aon-editDataTable-button aon-icon-delete"
								value="" accesskey="#{bundle.aon_key_remove_line}" />
						</aon:div>
						<f:facet name="footer">		
							<aon:div>
								<aon:outputText rendered="#{!webPage.new}" value="&#160;"/>
								<aon:commandButton title="#{bundle.aon_save}"
									actionListener="#{webPage.onAccept}"
									rendered="#{webPage.new}" value=""
									styleClass="aon-editDataTable-button aon-icon-accept"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="#{bundle.aon_cancel}"
									actionListener="#{webPage.onCancel}" immediate="#{true}"
									rendered="#{webPage.new}"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									value="" accesskey="#{bundle.aon_key_cancel_line}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:editDataTable>
				
				<aon:dataScroller dataTable="WebInfoPage_datatable" for="WebInfoPage_datatable"
					model="#{webPage.model}" rowCount="10" showNote="true"  />
			</rich:panel>
		</aon:div>
		</aon:form>
	
		<ui:include src="/facelet/registry/company/tabs/action/genericModalPanel.xhtml" />	
		<ui:include src="/facelet/registry/company/tabs/action/locationModalPanel.xhtml" />	
		<ui:include src="/facelet/registry/company/tabs/action/resourcesModalPanel.xhtml"/>	

	</ui:define>
</ui:composition>
