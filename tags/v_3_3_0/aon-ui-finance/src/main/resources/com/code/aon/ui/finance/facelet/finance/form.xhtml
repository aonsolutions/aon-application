<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_finance_module}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="skipSaveButton" value="#{!finance.pending and !finance.returned}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="fraction" value="#{financeBundle.finance_to_fraction}"
						immediate="#{true}" rendered="#{finance.pending or finance.returned}"
						styleClass="aon-finding-toolbar-item-no-icon"
						actionListener="#{financeFraction.onFractionFinance}" action="finance_fraction"/>				
				</ui:define>				
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Finance_registry_id"
						value="#{finance.to.payment?(financeBundle.finance_creditor):(financeBundle.finance_debtor)}" />
					<aon:inputText id="Finance_registry_id"
						size="40" disabled="true"
						value="#{finance.to.registry.name} #{finance.to.registry.surname==null?' ':(finance.to.registry.surname)}" />	
												
					<aon:outputLabel for="Finance_invoice_series"
						value="#{financeBundle.finance_invoice}" />
					<aon:div> 
						<aon:inputText id="Finance_invoice_series"
							value="#{finance.to.invoice.series}"
							disabled="true" size="4" maxlength="5" />
						<aon:div layout="inline" styleClass="aon-padding-left">							
							<aon:inputText id="Finance_invoice_number"
								value="#{finance.to.invoice.number}"
								disabled="true" size="7" />
						</aon:div>
					</aon:div>
					
					<aon:outputLabel for="Finance_invoice_issueDate"
						value="#{financeBundle.finance_invoice_date}" />
					<aon:inputText id="Finance_invoice_issueDate"
						size="10" disabled="true"
						value="#{finance.to.invoice.issueDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>
					
					<aon:outputLabel for="Finance_dueDate"
						value="#{financeBundle.finance_finance_date}" />
					<aon:selectInputDate id="Finance_dueDate" 
						value="#{finance.to.dueDate}"
						disabled="#{!finance.pending and !finance.returned}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
						
					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{configBundle.config_bank}" />
					<aon:div >
						<aon:selectOneMenu id="RegistryBank_Lookup_id"
							value="#{finance.registryBank}" reRender="RegistryBank_Lookup_bankAccount"
							valueChangeListener="#{finance.onRegistryBankChanged}"
							disabled="#{!finance.pending and !finance.returned}">
							<f:selectItem itemLabel ="-" value="#{null}" />
							<f:selectItems value="#{finance.registryBanks}" />
						</aon:selectOneMenu>
					</aon:div>
					
					<aon:outputLabel for="RegistryBank_Lookup_bankAccount"
						value="#{configBundle.config_bank_account}" />
					<aon:div id="RegistryBank_Lookup_bankAccount">
						<aon:inputText disabled="#{!finance.pending and !finance.returned}"
							value="#{finance.to.bankAccount.entity}" size="4" maxlength="4">
							<f:validateLength minimum="4" maximum="4" />
						</aon:inputText>
						<aon:inputText disabled="#{!finance.pending and !finance.returned}"
							value="#{finance.to.bankAccount.office}" size="4" maxlength="4">
							<f:validateLength minimum="4" maximum="4" />
						</aon:inputText>
						<aon:inputText disabled="#{!finance.pending and !finance.returned}"
							value="#{finance.to.bankAccount.control}" size="2" maxlength="2">
							<f:validateLength minimum="2" maximum="2" />
						</aon:inputText>
						<aon:inputText disabled="#{!finance.pending and !finance.returned}"
							value="#{finance.to.bankAccount.account}" size="10"	maxlength="10">
							<f:validateLength minimum="10" maximum="10" />
						</aon:inputText>
					</aon:div>						
						
					<aon:outputLabel for="Finance_payMethod_id"
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="Finance_payMethod_id"
						disabled="#{!finance.pending and !finance.returned}"
						value="#{finance.to.payMethod}">
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Finance_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Finance_amount"
						value="#{finance.to.amount}" size="10" disabled="true">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:inputText>	

					<aon:outputLabel for="Finance_expenses"
						value="#{financeBundle.finance_expenses}" />
					<aon:inputText id="Finance_expenses"
						value="#{finance.to.expenses}" size="10" disabled="#{!finance.pending and !finance.returned}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:inputText>
					
					<aon:outputLabel for="Finance_total"
						value="#{bundle.aon_total}" />
					<aon:inputText id="Finance_total"
						value="#{finance.to.totalAmount}" size="10" disabled="true">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:inputText>	
					
					<aon:outputLabel for="Finance_financeStatus"
						value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Finance_financeStatus"
						disabled="true" value="#{finance.to.financeStatus}">
						<f:selectItems value="#{financeCollections.financeStatuses}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Finance_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="Finance_securityLevel"
						disabled="true" value="#{finance.to.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
						
				</aon:panelGrid>
					
				<aon:div styleClass="aon-form-group" rendered="#{!finance.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="financeTrackingData" value="#{financeBundle.finance_tracking}" />
						</aon:div>
					</aon:div>
					<aon:div styleClass="aon-scroll-area">
					
						<aon:dataTable id="financeTrackingData" value="#{financeTracking.model}"
							var="to" rows="20" rendered="#{financeTracking.model.rowCount > 0}"
							columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
								aon-editDataTable-numberColumn, aon-editDataTable-iconColumn aon-vertical-align-top">

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_date}" />
									</f:facet>
									<aon:outputText value="#{to.trackingDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>	
								</aon:column>
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_tracking_action}" />
									</f:facet>
									<aon:outputText value="#{to.type}" />
								</aon:column>
						
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{to.description}" />
								</aon:column>
						
								<aon:column width="100">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_amount}" />
									</f:facet>
									<aon:outputText value="#{to.amount}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>	
								</aon:column>
								
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:confirmButton id="cancel"
										title="#{financeBundle.finance_tracking_undo}"
										immediate="true" rendered="#{financeTracking.unrecordable}" 
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{financeTracking.undoTracking}"
										styleClass="aon-editDataTable-button aon-icon-delete"
										accesskey="#{bundle.aon_key_remove_line}" />										
								</aon:column>

						</aon:dataTable>
						
						<aon:dataScroller2 for="financeTrackingData" showNote="true" />
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
