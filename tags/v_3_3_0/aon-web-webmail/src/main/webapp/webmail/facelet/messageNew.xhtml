<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="webmailForm">
		
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-section-title">
					<aon:outputText value="#{appBundle.aon_webmail_newmail}" />
				</aon:div>
				
				<aon:div styleClass="aon-toolbar">
						
					<aon:commandButton id="send"
						value="#{appBundle.aon_webmail_send}"
						styleClass="aon-icon-accept aon-finding-toolbar-item"
						action="#{message.getReturnAction}"
						actionListener="#{message.send}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
		     			oncomplete="Richfaces.hideModalPanel('waitProccess')" />						
					<aon:commandButton id="save_draft"
						value="#{appBundle.aon_webmail_save_draft}"
						styleClass="aon-icon aon-icon-mail-save aon-finding-toolbar-item"
						action="messageNew"
						actionListener="#{message.saveDraft}" />
		     		<aon:confirmButton id="back" immediate="true"
						title="#{bundle.aon_back}" value="#{bundle.aon_back}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{appBundle.aon_webmail_back_confirm}"
						confirmAction="#{message.getReturnAction}"
						accesskey="#{bundle.aon_key_cancel}"
						styleClass="aon-icon-cancel aon-finding-toolbar-item" />						
				</aon:div>
			
				<aon:div>
					<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%;"
					>

						<aon:div rendered="#{mailAccount.model.rowCount>1}">
							<aon:outputLabel for="NewMail_From" 
								value="#{appBundle.aon_webmail_from}: " />
						</aon:div>							
						<aon:selectOneMenu id="NewMail_From" reRender="messageContent"
							rendered="#{mailAccount.model.rowCount>1}"
							valueChangeListener="#{message.onMailAccountChanged}"
							value="#{message.senderMailAccountId}">
							<f:selectItems value="#{mailAccount.mailAccounts}" />
						</aon:selectOneMenu>
						
						<aon:commandButton id="addToEmail" reRender="showEmailWindow"
							actionListener="#{message.openEmailsToPanelPopup}"
							styleClass="aon-commandButton aon-icon-search" 
							value="#{appBundle.aon_webmail_to}" style="background-position:4px 2px;width:60px;padding:2px 1em 2px 22px !important;text-align:left;"/>
						<aon:div>
							<aon:inputText id="NewMail_to"
								size="120"
								value="#{message.recipientsTo}"/>
							
						</aon:div>
	
						<aon:commandButton id="addCcEmail" reRender="showEmailWindow"
							actionListener="#{message.openEmailsCcPanelPopup}" 
							styleClass="aon-commandButton aon-icon-search" 
							value="#{appBundle.aon_webmail_cc}" style="background-position:4px 2px;width:60px;padding:2px 1em 2px 22px !important;text-align:left;"/>
						<aon:div>
							<aon:inputText id="NewMail_cc"
								size="120"
								value="#{message.recipientsCc}"/>								
						</aon:div>
	
						<aon:commandButton id="addBccEmail" reRender="showEmailWindow"
							actionListener="#{message.openEmailsBccPanelPopup}" 
							styleClass="aon-commandButton aon-icon-search" 
							value="#{appBundle.aon_webmail_bcc}" style="background-position:4px 2px;width:60px;padding:2px 1em 2px 22px !important;text-align:left;"/>
						<aon:div>
							<aon:inputText id="NewMail_Bcc"
								size="120"
								value="#{message.recipientsBcc}"/>											
						</aon:div>
						
						<aon:div>
							<aon:outputLabel for="NewMail_Subject" 
							value="#{appBundle.aon_webmail_subject}: " />
						</aon:div>										
						<aon:inputText id="NewMail_Subject"
							size="130"
							value="#{message.subject}"/>			

						<aon:outputLabel for="attach_file" 
							value="#{appBundle.aon_webmail_attach_file}: " />
						<aon:div>
							<rich:fileUpload id="attach_file"
								addControlLabel="#{appBundle.aon_fileUpload_add}" 
								stopControlLabel="#{appBundle.aon_fileUpload_stop}" 
								stopEntryControlLabel="#{appBundle.aon_fileUpload_stop}"
								uploadControlLabel="#{appBundle.aon_fileUpload_upload}"
								fileUploadListener="#{message.fileUploaded}"
								maxFilesQuantity="20" listHeight="0px"
								immediateUpload="true" autoclear="true"
								onupload="startUpload();" onuploadcanceled="endUpload();" onerror="endUpload();">
								<f:facet name="label">
									<h:outputText value="#{appBundle.aon_fileUpload_upload_label}" />
								</f:facet>								
								<a4j:support event="onuploadcomplete" oncomplete="endUpload();" reRender="attachDataTable" />
							</rich:fileUpload>								
							<aon:div id="attachDataTable">					
								<aon:dataTable value="#{message.files}" 
									var="attachment" styleClass="aon-panelGrid-formatting">
									<aon:column>
										<aon:outputText value="#{attachment.fileName}" styleClass="aon-bold" />
										<aon:commandLink
											reRender="attachDataTable" style="font-size:0.9em;margin-left:20px;"
											value="#{appBundle.aon_webmail_deletemail}"
											styleClass="aon-icon-commandButton aon-icon-delete"
											actionListener="#{attachment.fileDeleted}">
										</aon:commandLink>
									</aon:column>
								</aon:dataTable>									
							</aon:div>		
						</aon:div>

					</aon:panelGrid>
				</aon:div>
				
				
				<!-- Message Body -->
				<aon:div id="messageContent" styleClass="padding-top">
					<aon:panelGroup scrollWidth="90%">
						<aon:inputRichText id="messageEditor" height="400" toolbarSet="AonWebMail" value="#{message.content}" />
					</aon:panelGroup>
				</aon:div>
			</aon:div>

		</aon:form>

		<ui:include src="/webmail/facelet/modal/waitProcess.xhtml" />	

		<ui:include src="/webmail/facelet/modal/showEmails.xhtml" />
		
	</ui:define>
</ui:composition>

</body>
</html>
