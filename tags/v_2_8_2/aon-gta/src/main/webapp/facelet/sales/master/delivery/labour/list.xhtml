<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">

		<h:form id="labourReportList">
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton value="#{bundle.aon_search}"
							actionListener="#{labourReport.onEditSearch}" action="productivity_search"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'" 
							accesskey="#{bundle.aon_key_search}"/>
						<t:commandButton id="labourReportList" value="#{bundle.aon_listing}"
							forceId="#{true}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="labourReportDataList" cellpadding="0" cellspacing="0"
							var="to" value="#{labourReport.model}" rows="20"
							rendered="#{labourReport.model.rowCount > 0}"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number,
								aon-table-body aon-table-body-number,
								aon-table-body aon-table-body-number">

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{warehouseBundle.aon_delivery_detail_labour_employee}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText
									value="#{to.employee.registry.name}, #{to.employee.registry.surname}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{warehouseBundle.aon_delivery_detail_labour_estimated_hours}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.estimatedHours}" >
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{warehouseBundle.aon_delivery_detail_labour_real_hours}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.realHours}" >
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{warehouseBundle.aon_delivery_detail_labour_difference}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.difference}" >
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</h:column>
						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="labourReportDataList" />
						<ui:param name="model" value="#{labourReport.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
