<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		
		<aon:form id="userForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{securityBundle.aon_security_change_password}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save"
						title="#{bundle.aon_key_save_accelerator}"
						value="#{bundle.aon_save}"
						actionListener="#{password.acceptPassword}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" >
						<aon:actionHotKey key="return" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="User_name" style="width:200px"
						value="#{bundle.aon_name}" />
					<aon:inputText id="User_name" disabled="true"
						required="true" size="64"
						maxlength="64" value="#{manager.loggedUser.name}" />

					<aon:outputLabel for="User_login"
						value="#{bundle.aon_login}" />
					<aon:inputText id="User_login" disabled="true"
						required="true" size="32" maxlength="16"
						value="#{manager.loggedUser.login}" />

					<aon:outputLabel for="User_Password" 
						value="#{securityBundle.aon_security_current_password}" />
					<aon:inputSecret id="User_Password"
						required="true" size="32" maxlength="128"
						value="#{password.password}" />

					<aon:outputLabel for="User_NewPassword"
						value="#{securityBundle.aon_security_new_password}" />
					<aon:inputSecret id="User_NewPassword"
						required="true" size="32" maxlength="128"
						value="#{password.newPassword}">
						<f:validateLength minimum="4" />
					</aon:inputSecret>

					<aon:outputLabel for="User_ConfirmPassword"
						value="#{securityBundle.aon_security_confirm_password}" />
					<aon:inputSecret id="User_ConfirmPassword"
						required="true" size="32" maxlength="128"
						value="#{password.confirmPassword}" >
						<f:validateLength minimum="4" />
					</aon:inputSecret>

				</aon:panelGrid>

			</aon:div>
			
			<rich:jQuery timing="onload" selector="#User_Password" query="focus()" />

		</aon:form>

	</ui:define>
	
</ui:composition>
