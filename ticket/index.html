            $(document).ready(function(){

                // Metemos los valores de los tickets aleatoriamente

                        comments_quantity   : Math.floor((Math.random() * 10) + 1), // cantidad de comentarios

                        priority            : 'Baja',                               // prioridad del ticket Baja, Media, Alta
                        assignaed_to        : 'Carmen',                             // asigando a
                        answer              : Math.floor((Math.random() * 2)),      // tienes que responder = 0 : respondido | 1 : responder     
                    };
                };
                    
                // Json de lo que llega
                var datos = {
                    total       : 100,                  // total de paginas
                    total_page  : '1 - 10',             // cantidad mostrada por paginas
                    page        : 1,                    // pagina en la que estamos
