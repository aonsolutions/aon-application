        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script>
            $(document).ready(function(){
                // Cogemos el listado de datos para mostrar
                var list = getList();

                createTable(list);

                //
                // Creamos la tabla con los datos a listar
                //
                function createTable(data){
                    // recorremos los datos a mostrar
                    var tbody = '';
                    $.each(data.list, function(i, item) {
                        // Abrimos el <tr> // Si tenemos que responder lo ponemos como negrita
                        tbody+= item.answer == 1 ? '<tr class="font-weight-bold">' : '<tr>';
                            // Recorremos los <td>    
                            $.each(item, function(key, val) {
                                switch (key) {
                                    case 'subject':
                                        tbody+= 
                                        '<td>'+
                                            '<div class="row">'+
                                                '<div class="col-md-8">'+
                                                    val+
                                                '</div>'+
                                                '<div class="col-md-4 text-right">'+
                                                    'com: '+item.comments_quantity+
                                                '</div>'+
                                            '</div>'+
                                        '</td>';
                                        break;
                                    case 'comments_quantity':
                                        // No metemos nada por que este valor lo metemos en el subject
                                        break;
                                    case 'answer':
                                        // No metemos el valor si tiene que responder o no
                                        break;
                                            
                                    default:
                                        tbody+= '<td>'+val+'</td>';
                                        break;
                                }
                            });
                        // Cerramos el <tr>
                        tbody+= '</tr>';
                    });

                    // Agregamos el cuerpo de la tabla
                    $('.table tbody').html(tbody);
                    
                    // Agregamos el paginado en el footer de la tabla
                    var tfoot = 
                    '<tr>'+
                        '<td colspan="7">'+
                            '<div class="row">'+
                                '<div class="col-md-6">'+
                                    'Mostrando '+data.shown_page+' entradas de '+data.total_date+
                                '</div>'+
                                '<div class="col-md-6 text-right">'+
                                    createPaginate(data.page, data.total_page)+
                                '</div>'+
                            '</div>'+
                        '</td>'
                    '</tr>';
                    
                    // Agregamos el cuerpo de la tabla
                    //$('.table tfoot').html(tfoot);
                    
                    // console.log(tbody);
                }

                // 
                // Crear el paginado
                //
                function createPaginate(page, page_total){
                    var paginate = '<ul class="pagination margin-top-10 display-block">';

                    // Si tenemos paginas
                    if (page > 1){ 
                        paginate+= 
                            '<li class="pointer">'+
                                '<a class="paginado-principio">'+
                                    '<i class="fa fa-backward" aria-hidden="true" title="Principio" ></i>'+
                                '</a>'+
                            '</li>'+
        
                            '<li class="pointer">'+
                                '<a class="paginado-volver">'+
                                    '<i class="fa fa-caret-left fa-2" aria-hidden="true" title="Volver"></i>'+
                                '</a>'+
                            '</li>';
                    }

                    if(page_total > 0){
                        var sig_pag   = page + 1;
                        var pag_total = page_total + 1;
                        paginate+= '<li class="margin-left-10 margin-right-10">'+sig_pag / pag_total+'</li>';
                    }

                    if (page < page_total) {
                        paginate+= 
                            '<li class="pointer">'+
                                '<a class="paginado-siguiente">'+
                                    '<i class="fa fa-caret-right fa-2" aria-hidden="true" title="Siguiente" ></i>'+
                                '</a>'+
                            '</li>'+
    
                            '<li class="pointer">'+
                                '<a class="paginado-final">'+
                                    '<i class="fa fa-forward" aria-hidden="true" title="Final" ></i>'+
                                '</a>'+
                            '</li>';
                    }

                    paginate+= '</ul>';

                    return paginate;
                }

                //
                // Listado para probar
                //
                function getList(page_this = 1){
                    // prioridades
                    var priority_array = ['Baja', 'Media', 'alta']
                    // Donde meteremos los valores de los tickets
                    var tickets_list = {};
                    // Crear cantidades aletorias dependiendo de la pagina en la que estemos
                    page_this  = page_this == 1 ? page_this : ((page_this - 1) * 10) + 1;
                    page_total = page_this + 10;
                    // Metemos los valores de los tickets aleatoriamente
                    for (var i = page_this; i < page_total; i++) {
                        tickets_list[i] = {
                            id                  : i,                                                // campo ticket
                            last_update         : '15-8-2020 15:30',                                // ultima modificacion
                            subject             : 'titulo del ticket',                              // titulo del ticket
                            comments_quantity   : Math.floor((Math.random() * 10) + 1),             // cantidad de comentarios
                            from                : 'Manolo',                                         // creador del ticket
                            priority            : priority_array[Math.floor((Math.random() * 3))],  // prioridad del ticket Baja, Media, Alta
                            assignaed_to        : 'Carmen',                                         // asigando a
                            answer              : Math.floor((Math.random() * 2)),                  // tienes que responder = 0 : respondido | 1 : responder     
                        };
                    };
                        
                    // Json de lo que nos llegaria
                    var date = {
                        total_date  : 100,                              // cantidad total de elementos
                        total_page  : 10,                               // total de paginas
                        page        : page_this,                        // pagina en la que estamos
                        shown_page  : page_this+' - '+(page_total-1),   // cantidad mostrada por paginas 1 - 10
                        list        : tickets_list,                     // listado de tickets
                    };
                    
                    // Devolver los datos
                    return date;
                }
            });
        </script>
