        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script>
            let theEditor;
            // Inicializamos CKEditor
            ClassicEditor.create( document.querySelector('#editor'),{
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );
            
            // Array de estados del ticket
            var status_array = ['Cerrado', 'Abierto', 'Resuelto'];
                
            $(document).ready(function(){
                // Datos del ticket en JSON
                var ticket = {
                    id : "526849",                      // ID del ticket
                    subject : "Asunto de prueba",       // Asunto del ticket
                    status : 2,                         // ID estado del ticket
                    priority : "Alta",                  // Prioridad
                    department : "Bidoq",               // Departamento al que se envía
                    created_at : "23-09-2020 08:47",    // Fecha y hora de cuándo se creó
                    user_name : "Juanito",              // Nombre del usuario que crea el ticket
                    user_id_login : "425",              // ID del usuario logueado                    
                    email : "juanito@prueba.com",       // Email del usuario que crea el ticket
                    organization : "Bidoq despacho",    // Organización de quien crea el ticket
                    font : "Web",                       // Desde dónde se ha creado el ticket
                    messages : {
                        0 : {
                            user_name : "Juanito",                                      // Nombre del usuario del mensaje
                            user_id : "425",                                            // ID del usuario que crea el ticket
                            user_avatar: "http://placehold.it/50/55C1E7/fff&text=U",    // URL del avatar del usuario
                            message_date : "23-09-2020 08:52",                          // Hora y fecha de la creación del mensaje
                            message : "Mensaje de prueba"                               // Mensaje
                        },
                        1 : {
                            user_name : "Pepito",                                       // Nombre del usuario del mensaje
                            user_id : "352",                                            // ID del usuario que crea el ticket
                            user_avatar: "http://placehold.it/50/55C1E7/fff&text=U",    // URL del avatar del usuario
                            message_date : "23-09-2020 09:12",                          // Hora y fecha de la creación del mensaje
                            message : "Respuesta de prueba"                             // Mensaje
                        }
                    }
                };
                
                // Leemos los datos del ticket y montamos la estructura
                $('#ticket-id').html(ticket.id);
                $('#ticket-subject').html(ticket.subject);
                $('#ticket-status').html(status_array[ticket.status]);
                $('#ticket-priority').html(ticket.priority);
                $('#ticket-department').html(ticket.department);
                $('#ticket-created_at').html(ticket.created_at);
                $('#ticket-user_name').html(ticket.user_name);
                $('#ticket-user_email').html(ticket.email);
                $('#ticket-organization').html(ticket.organization);
                $('#ticket-font').html(ticket.font);
                $("#select-status option[value='"+ticket.status+"']").prop('selected', true);
                
                // Añadimos al boton el data del id del usuario logueado y el id del ticket
                $('#btn-send').attr('data-user', ticket.user_id_login);
                $('#btn-send').attr('data-ticket', ticket.id);
                
                // Formateamos los mensajes
                var msg = messages(ticket.messages, ticket.user_id_login);
                
                // Mostramos los mensajes
                $('#ticket-messages').html(msg);
            });
            
            // Enviar mensage nuevo
            $('#btn-send').click(function(){
                var msg_user = theEditor.getData();
                var ticket_id = $(this).data('ticket');
                var user_id_login = $(this).data('user');
                var new_status = $('#select-status').val();
                
                // Datos a enviar
                var send = {
                    ticket_id : ticket_id,  // ID del ticket al que corresponde
                    user : user_id_login,   // ID usuario logueado (crea el mensaje)
                    message : msg_user,     // Mensaje
                    status : new_status     // Nuevo estado del ticket
                };
                
                // Mandamos los datos necesarios y nos devolverán el mensaje con los datos necesarios
                var message = {
                    0 : {
                        user_name : "Juanito",                                      // Nombre del usuario del mensaje
                        user_id : "425",                                            // ID del usuario que crea el ticket
                        user_avatar: "http://placehold.it/50/55C1E7/fff&text=U",    // URL del avatar del usuario
                        message_date : "23-09-2020 14:36",                          // Hora y fecha de la creación del mensaje
                        message : msg_user,                                         // Mensaje
                        ticket_status : new_status                                  // Nuevo estado del ticket
                    }
                };
                
                // Formateamos el mesaje
                var msg = messages(message, user_id_login);
                
                // Cambiamos el estado del ticket
                $('#ticket-status').html(status_array[message[0].ticket_status]);
                
                // Limpiamos el editor
                theEditor.setData('');
                
                // Mostramos el mensaje al final
                $('#ticket-messages').append(msg);
            });
            
            // Formatea el json de mensajes para mostrarlos
            function messages(messages, user_login){
                var msg = "";
                
                for (const prop in messages) {
                    var message = messages[prop];
                    
                    if(message.user_id == user_login){ // El mensaje es del usuario logueado
                        msg += "<li class='right clearfix'>";
                            msg += "<div class='col-12 pt-2 pb-2 pl-5'>";
                                msg += "<div class='row clearfix'>";
                                    msg += "<div class='col-11 border-from'>";
                                        msg += "<div class='header'>";
                                            msg += "<strong class='primary-font'>"+message.user_name+"</strong>";
                                            msg += "<small class='ml-2 text-muted'>"+message.message_date+"</small>";
                                        msg += "</div>";
                                        msg += "<p>"+message.message+"</p>";
                                    msg += "</div>";
                                    msg += "<div class='col-1'>";
                                        msg += "<span class='ticket-img float-right'><img src='"+message.user_avatar+"' alt='User Avatar'/></span>";
                                    msg += "</div>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</li>";
                    } else { // El mensaje es respuesta al usuario que está leyendo
                        msg += "<li class='left clearfix'>";
                            msg += "<div class='col-12 pt-2 pb-2 pr-5'>";
                                msg += "<div class='row clearfix'>";
                                    msg += "<div class='col-1'>";
                                        msg += "<span class='ticket-img float-left'><img src='"+message.user_avatar+"' alt='User Avatar'/></span>";
                                    msg += "</div>";
                                    msg += "<div class='col-11 border-to'>";
                                        msg += "<div class='header'>";
                                            msg += "<strong class='primary-font'>"+message.user_name+"</strong>";
                                            msg += "<small class='ml-2 text-muted'>"+message.message_date+"</small>";
                                        msg += "</div>";
                                        msg += "<p>"+message.message+"</p>";
                                    msg += "</div>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</li>";
                    }
                }
                
                return msg;
            }
        </script>
