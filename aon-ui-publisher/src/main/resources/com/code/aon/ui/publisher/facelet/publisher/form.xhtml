<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="generatorForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{publisherBundle.publisher_production_module}" />
				<ui:param name="toolbarDescription" value="&#160;" />
				<ui:define name="toolbarContent">
					<h:outputLink id="preview" value="#{publisher.previewPage}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-file-entrance" > 
						<aon:outputText value="#{publisherBundle.publisher_preview}"/>
					</h:outputLink>				     									
					<aon:commandButton id="publish"
						value="#{publisherBundle.publisher_publish}"
						styleClass="aon-finding-toolbar-item aon-icon-file-upload"
						actionListener="#{publisher.onPublish}" immediate="true"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />								
					<h:outputLink id="web" value="#{publisher.webPage}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-file-entrance">
						<aon:outputText value="#{publisherBundle.publisher_view}"/>
					</h:outputLink>
				</ui:define>
			</ui:decorate>

		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />		
	</ui:define>
</ui:composition>
