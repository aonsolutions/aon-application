<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
	
	<aon:panel styleClass="aon-width-all">

		<f:facet name="header">
			<aon:outputText value="#{bundle.sepe_contrata_contract_other_data}" />
		</f:facet>

		<aon:panelGrid columns="2" id="otherDataPanel"
			styleClass="aon-width-all"
			columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even aon-width-auto">
			
			<aon:outputLabel for="nivelFormativo"
				rendered="#{controller.handler.showNivelFormativo}" 
				value="#{bundle.sepe_contrata_contract_nivel_formativo}" />
			<aon:selectOneMenu id="nivelFormativo"
				rendered="#{controller.handler.showNivelFormativo}"
				required="true" 
				disabled="#{controller.readOnly}" 
				value="#{controller.params.nivelFormativo}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contrataCollections.TBONVFORCodeList}" />
				<a4j:support event="onchange" reRender="otherDataPanel" ajaxSingle="true" />
			</aon:selectOneMenu>

			<aon:outputLabel for="titulacionAcademica"
				rendered="#{controller.handler.showTitulacionAcademica}" 
				value="#{bundle.sepe_contrata_contract_titulacion_academica}" />
			<aon:selectOneMenu id="titulacionAcademica"
				rendered="#{controller.handler.showTitulacionAcademica}" 
				required="#{controller.handler.titulacionAcademicaRequired}" 
				disabled="#{controller.readOnly}" 
				value="#{controller.params.titulacionAcademica}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{controller.handler.qualificationsNames}" />
			</aon:selectOneMenu>
		
			<aon:outputLabel for="certificadoProfesionalidad" 
				rendered="#{controller.handler.showCertificadoProfesionalidad}"
				value="#{bundle.sepe_contrata_contract_certificado_profesionalidad}" />
			<aon:selectBooleanCheckbox id="certificadoProfesionalidad" 
				required="#{controller.handler.certificadoProfesionalidadRequired}"
				disabled="#{controller.readOnly}"  
				rendered="#{controller.handler.showCertificadoProfesionalidad}"
				value="#{controller.params.indCertifProfesionalidad}" />
					
			<aon:outputLabel for="basicCopySignatureType" 
				value="#{bundle.sepe_contrata_contract_basicCopySignatureType}" />
			<aon:selectOneMenu id="basicCopySignatureType"
				required="true"
				disabled="#{controller.readOnly}"
				value="#{controller.params.tipoFirmaCopiaBasica}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contrataCollections.TERFIRCBCodeList}" />
			</aon:selectOneMenu>
		
			<aon:outputLabel for="basicCopyComments" 
				value="#{bundle.sepe_contrata_contract_basicCopyComments}" />
			<aon:inputTextarea id="basicCopyComments"
				disabled="#{controller.readOnly}"
				value="#{controller.params.textoCopiaBasica}"
				cols="120" rows="5"/>
						
			<aon:outputLabel for="enterpriseFreeUse" 
				value="#{bundle.sepe_contrata_usoLibreEmpresa}" />
			<aon:inputText id="enterpriseFreeUse"
				disabled="#{controller.readOnly}"
				value="#{controller.params.usoLibreEmpresa}" maxlength="30" size="55" >
				<f:validateLength maximum="30" />
			</aon:inputText>
			
			<aon:if test="#{contract.trainingContract}" >
				<aon:outputLabel for="workingDayType" 
					rendered="#{controller.handler.showTipoJornada}"
					value="#{bundle.sepe_contrata_contract_working_day_type}" />
				<aon:selectOneMenu id="workingDayType"
					required="true"
					disabled="#{!controller.handler.availableTipoJornada or controller.readOnly}"
					rendered="#{controller.handler.showTipoJornada}"
					value="#{controller.params.tipoJornada}" >
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{contrataCollections.TEQPTIEMCodeList}" />
				</aon:selectOneMenu>
				
				<aon:outputLabel 
					rendered="#{controller.handler.showHorasMinutosJornada}"
					value="#{bundle.sepe_contrata_contract_working_day_duration}" />
				<aon:div rendered="#{controller.handler.showHorasMinutosJornada}">
					<aon:outputLabel for="workingDayHours" styleClass="aon-italic aon-margin-right"
						value="#{bundle.sepe_hours}:" />
					<aon:inputText id="workingDayHours" size="4" maxlength="4"
						disabled="#{controller.readOnly}"
						value="#{controller.params.horasJornada}"/>
					<aon:outputLabel for="workingDayMinutes" styleClass="aon-italic aon-margin-left aon-margin-right"
						value="#{bundle.sepe_minutes}:" />
					<aon:inputText id="workingDayMinutes" size="2" maxlength="2"
						disabled="#{controller.readOnly}"
						value="#{controller.params.minutosJornada}"/>
				</aon:div>
			</aon:if>

			<aon:outputLabel 
				rendered="#{controller.handler.showHorasMinutosConvenio}"
				value="#{bundle.sepe_contrata_contract_agreement_hours}" />
			<aon:div rendered="#{controller.handler.showHorasMinutosConvenio}">
				<aon:outputLabel for="agreementHours" styleClass="aon-italic aon-margin-right"
					value="#{bundle.sepe_hours}:" />
				<aon:inputText id="agreementHours" size="4" maxlength="4"
					disabled="#{controller.readOnly}"
					value="#{controller.params.horasConvenio}"/>
				<aon:outputLabel for="agreementMinutes" styleClass="aon-italic aon-margin-left aon-margin-right"
					value="#{bundle.sepe_minutes}:" />
				<aon:inputText id="agreementMinutes" size="2" maxlength="2"
					disabled="#{controller.readOnly}"
					value="#{controller.params.minutosConvenio}"/>
			</aon:div>
		</aon:panelGrid>
			
		<aon:panelGrid columns="2" id="otherDataPanel2"
			styleClass="aon-width-all aon-margin-top"
			columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even aon-width-auto">
			
			<aon:outputLabel for="formationReceived" 
				rendered="#{controller.handler.showIndicFormacionTeorica}"
				value="#{bundle.sepe_contrata_contract_formation_received}" />
			<aon:selectOneRadio id="formationReceived"
				rendered="#{controller.handler.showIndicFormacionTeorica}"
				disabled="#{controller.readOnly}"
				value="#{controller.params.indicFormacionTeorica}" >
				<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="S" />
				<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="N" />
				<a4j:support event="onclick" reRender="otherDataPanel2" ajaxSingle="true" />
			</aon:selectOneRadio>

			<aon:outputLabel for="formationDuration" 
				rendered="#{controller.handler.showHorasMinutosFormacion}"
				value="#{bundle.sepe_contrata_contract_formation_hours}" />
			<aon:div id="formationDuration"
				rendered="#{controller.handler.showHorasMinutosFormacion}" >
				<aon:outputLabel for="formationHours" styleClass="aon-italic aon-margin-right"
					value="#{bundle.sepe_hours}:" />
				<aon:inputText id="formationHours" size="4" maxlength="4"
					disabled="#{controller.params.indicFormacionTeorica=='S' or controller.readOnly}" 
					value="#{controller.params.horasFormacion}">
					<a4j:support event="onblur" reRender="formationWorkingDaysPercent, otherDataPanel2" />
				</aon:inputText>
				<aon:outputLabel for="formationMinutes" styleClass="aon-italic aon-margin-left aon-margin-right"
					value="#{bundle.sepe_minutes}:" />
				<aon:inputText id="formationMinutes" size="2" maxlength="2"
					disabled="#{controller.params.indicFormacionTeorica=='S' or controller.readOnly}" 
					value="#{controller.params.minutosFormacion}">
					<a4j:support event="onblur" reRender="formationWorkingDaysPercent, otherDataPanel2" />
				</aon:inputText>
				<aon:div id="formationWorkingDaysPercent" style="display:inline;"
					rendered="#{not empty controller.params.horasFormacion and not empty controller.params.horasJornada}">
					<aon:outputText styleClass="aon-italic aon-margin-left"
						value="#{controller.params.horasFormacion*100/controller.params.horasJornada}" />
					<aon:outputText styleClass="aon-italic aon-margin-left"
						value="% de la jornada" />
				</aon:div>
			</aon:div>
			
			<aon:outputLabel for="ageCollective" 
				rendered="#{controller.handler.showColectivoEdad}"
				value="#{bundle.sepe_contrata_contract_age_collective}" />
			<aon:selectOneMenu id="ageCollective"
				rendered="#{controller.handler.showColectivoEdad}"
				disabled="#{controller.readOnly}"
				value="#{controller.params.colectivoEdad}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contrataCollections.THPCOLFOCodeList}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="retirementPercent"
				rendered="#{controller.handler.showPorcentajeJubilacionParcial}"
				value="#{bundle.sepe_contrata_contract_retirement_percent}" />
			<aon:inputText id="retirementPercent" size="6" maxLenght="5"
				rendered="#{controller.handler.showPorcentajeJubilacionParcial}"
				disabled="#{controller.readOnly}"
				value="#{controller.params.porcentajeJubilacionParcial}">
				<f:validateDoubleRange minimum="25.00" maximum="85.00" />
			</aon:inputText>
			
			<aon:outputText 
				rendered="#{controller.handler.showFijoDiscontinuoPeriodico}"
				value="&#160;" />
			<aon:div rendered="#{controller.handler.showFijoDiscontinuoPeriodico}">
				<aon:selectBooleanCheckbox id="periodicallyDiscontinuous"
					disabled="#{controller.readOnly}" 
					value="#{controller.params.fijoDiscontinuoPeriodico}" />
				<aon:outputLabel for="periodicallyDiscontinuous"
					value="#{bundle.sepe_contrata_contract_periodically_discontinuous}" />
			</aon:div>

		</aon:panelGrid>
		
	</aon:panel>
		
</ui:composition>
