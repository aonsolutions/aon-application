<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
	
	<aon:panel styleClass="aon-width-all">

		<f:facet name="header">
			<aon:outputText value="#{bundle.sepe_contrata_contract_other_data}" />
		</f:facet>

		<aon:panelGrid columns="2"
			styleClass="aon-width-all"
			columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even aon-width-auto">
			
			<aon:outputLabel for="basicCopySignatureType-transform" 
				value="#{bundle.sepe_contrata_contract_basicCopySignatureType}" />
			<aon:selectOneMenu id="basicCopySignatureType-transform"
				required="true"
				disabled="#{extensionContrata.readOnly}"
				value="#{transformContrata.params.tipoFirmaCopiaBasica}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contrataCollections.TERFIRCBCodeList}" />
			</aon:selectOneMenu>
		
			<aon:outputLabel for="basicCopyComments-transform" 
				value="#{bundle.sepe_contrata_contract_basicCopyComments}" />
			<aon:inputTextarea id="basicCopyComments-transform"
				disabled="#{extensionContrata.readOnly}"
				value="#{transformContrata.params.textoCopiaBasica}"
				cols="120" rows="5"/>
	
			<aon:outputLabel for="enterpriseFreeUse-transform" 
				value="#{bundle.sepe_contrata_usoLibreEmpresa}" />
			<aon:inputText id="enterpriseFreeUse-transform"
				disabled="#{extensionContrata.readOnly}"
				value="#{transformContrata.params.usoLibreEmpresa}" maxlength="30" size="55" >
				<f:validateLength maximum="30" />
			</aon:inputText>
			
		</aon:panelGrid>
		
	</aon:panel>
		
</ui:composition>
