<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">
						
	<aon:panelTab id="certificados" label="Certific@2">
							
		<aon:dataTable id="certificadosCodelList" value="#{controller.certificadosTablesModel}" var="to">

			<aon:rowSelector id="certificadosCodelList-select" 
				action="#{listAction}"
				actionListener="#{controller.onSelectCertificados}" />
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.code}"  />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel 
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}"/>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel 
						value="#{bundle.sepe_sepeTables_lastUpdate_date}" />
				</f:facet>
				<aon:outputText value="#{to.lastUpdateDate}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
		</aon:dataTable>
		
	</aon:panelTab>

</ui:composition>
