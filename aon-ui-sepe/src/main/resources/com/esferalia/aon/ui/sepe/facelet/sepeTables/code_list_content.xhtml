<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:div ajaxRendered="true" layout="none">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:define name="toolbarContent">
				<aon:commandButton id="back" immediate="true"
					value="#{bundle.aon_back}"
					action="#{listAction}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel" />
			</ui:define>
		</ui:decorate>			

		<aon:div styleClass="aon-scroll-area" id="codesPanel">
		
			<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
				<aon:div styleClass="aon-panelGrid-search-info">
					<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
				</aon:div>
				<aon:panelGrid columns="3">
					<aon:inputText id="tablesFilter" size="100" value="#{controller.codesFilter}">
						<a4j:support 
							event="onkeyup"
							actionListener="#{controller.onInitCodesModels}"
							reRender="codeList"
							eventsQueue="codeListKeyUp"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>
					</aon:inputText>
					<aon:outputText value="#{bundle.payroll_current}" styleClass="aon-margin-left"/>
					<aon:selectBooleanCheckbox value="#{controller.activeCodes}" >
						<a4j:support 
							event="onclick"
							actionListener="#{controller.onInitCodesModels}"
							reRender="codeList, codesPanel"
							eventsQueue="codeListKeyUp"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>
					</aon:selectBooleanCheckbox>
				</aon:panelGrid>	
			</aon:div>
		
			<aon:dataTable id="codeList" value="#{controller.codesModel}" var="to">

				<aon:rowSelector id="codelList-select" toggleOnClick="#{false}" />
				
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.code}"  />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputLabel 
							value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}"/>
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputLabel 
							value="#{bundle.aon_start_date}" />
					</f:facet>
					<aon:outputText value="#{to.startDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputLabel 
							value="#{bundle.aon_end_date}" />
					</f:facet>
					<aon:outputText value="#{to.endDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>	
				</aon:column>
				
			</aon:dataTable>

		</aon:div>
	</aon:div>

</ui:composition>
