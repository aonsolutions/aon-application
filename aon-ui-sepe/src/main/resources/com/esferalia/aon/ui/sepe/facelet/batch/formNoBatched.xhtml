<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="listDataDiv">
		<aon:div id="listToolBarDiv" styleClass="aon-toolbar" style="width:98%;display:inline-block;">
			<aon:commandButton title="#{bundle.aon_check_all}"
				styleClass="aon-finding-toolbar-item aon-icon-checkAll"
				value="#{bundle.aon_check_all}"
				rendered="#{controllerList.model.rowCount > 0}"
				actionListener="#{controllerList.checkHandler.checkAll}" reRender="listDataDiv"
				onclick="Richfaces.showModalPanel('waitProccess')" 
	     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
			<aon:commandButton title="#{bundle.aon_uncheck_all}"
				styleClass="aon-finding-toolbar-item aon-icon-checkNone"
				value="#{bundle.aon_uncheck_all}"
				rendered="#{controllerList.model.rowCount > 0}"
				actionListener="#{controllerList.checkHandler.checkNone}" reRender="listDataDiv"
				onclick="Richfaces.showModalPanel('waitProccess')" 
	     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
			<!--  
			<aon:commandButton title="#{bundle.payroll_refine_search}"
				styleClass="aon-finding-toolbar-item aon-icon-search"
				value="#{bundle.payroll_refine_search}"
				actionListener="#{controller.onEditSearchList}" 
				reRender="showListSearchWindow">
				<f:setPropertyActionListener target="#{controllerList.checkHandler.showListSearchWindow}"
					value="#{true}" />
			</aon:commandButton>
			-->
			<aon:commandButton title="#{bundle.payroll_add_batch}"
				styleClass="aon-finding-toolbar-item aon-icon-newFolder"
				value="#{bundle.payroll_add_batch}"
				rendered="#{controllerList.checkHandler.checkedCount > 0}"
				actionListener="#{controller.onBatchSelected}" reRender="batchForm, batchPanelTabSet"
				onclick="Richfaces.showModalPanel('waitProccess')" 
	     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
	     		
	     	<ui:insert name="afterToolbarContent" />
	     	
		</aon:div>
		
		<a4j:region id="searchPanel">
			<aon:panelCollapsible 
				label="#{bundle.payroll_data_filter}"
				headerClass="aon-panelGrid-search-info" 
				bodyClass="aon-panelGrid-search"
				value="#{controllerList.searchPanelExpanded}" >
				<aon:panelGrid columns="2">
				
					<c:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controllerList.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
						</ui:include>
					</c:if>
				
				 	<ui:insert name="searchContent" />
				
				</aon:panelGrid>
			</aon:panelCollapsible>
		</a4j:region>

		<aon:dataTable id="listData" value="#{controllerList.model}"
			var="to" rows="20" rendered="#{controllerList.model.rowCount > 0}" >	
			
			<aon:rowSelector id="noBatched-select" toggleOnClick="#{false}"/>
			
			<ui:param name="showEnterpriseColumn" value="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}" />		

			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:selectBooleanCheckbox id="Included_Row_checked"
					value="#{controllerList.checkHandler.rowChecked}"
					ajaxSingle="#{true}"
					valueChangeListener="#{controllerList.checkHandler.rowSelected}" >
					<a4j:support event="onclick" reRender="listDataDiv, #{checkReRender}" />
				</aon:selectBooleanCheckbox>
			</aon:column>
			
			<ui:insert name="listDataColumns" />

		</aon:dataTable>
		
		<aon:dataScroller2 for="listData" showNote="true" />
	</aon:div>
	
</ui:composition>
