<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:div id="detailDataDiv">
		<c:if test="#{!controller.recorded}" >
			<aon:div id="detailToolBarDiv" styleClass="aon-toolbar" >
				<aon:commandButton title="#{bundle.aon_check_all}"
					styleClass="aon-finding-toolbar-item aon-icon-checkAll"
					value="#{bundle.aon_check_all}"
					actionListener="#{controllerDetail.checkHandler.checkAll}" reRender="detailDataDiv"
					onclick="Richfaces.showModalPanel('waitProccess')" 
		     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
				<aon:commandButton title="#{bundle.aon_uncheck_all}"
					styleClass="aon-finding-toolbar-item aon-icon-checkNone"
					value="#{bundle.aon_uncheck_all}"
					actionListener="#{controllerDetail.checkHandler.checkNone}" reRender="detailDataDiv"
					onclick="Richfaces.showModalPanel('waitProccess')" 
		     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
				<aon:commandButton title="#{bundle.payroll_remove_batch}"
					styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
					value="#{bundle.payroll_remove_batch}"
					rendered="#{controllerDetail.checkHandler.checkedCount > 0}"
					actionListener="#{controller.onRemoveSelected}" reRender="batchForm, batchPanelTabSet"
					onclick="Richfaces.showModalPanel('waitProccess')" 
		     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
			</aon:div>
		</c:if>
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="isRecorded" value="#{controller.recorded}" />
			<ui:param name="controller" value="#{controllerDetail}" />
			<ui:param name="skipSelectButton" value="true" />
			<ui:param name="rowSelectorToggleOnClick" value="false" />
	
			<ui:define name="columns">
			
				<ui:param name="showEnterpriseColumn" value="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}" />
				
				<c:if test="#{!isRecorded}" >
					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:selectBooleanCheckbox id="Included_Row_checked"
							value="#{controllerDetail.checkHandler.rowChecked}"
							valueChangeListener="#{controllerDetail.checkHandler.rowSelected}" >
							<a4j:support event="onclick" reRender="detailDataDiv, #{checkReRender}" />
						</aon:selectBooleanCheckbox>	
					</aon:column>
				</c:if>
				
				<ui:insert name="detailDataColumns" />
				
			</ui:define>
		</ui:decorate>			

	</aon:div>

</ui:composition>
