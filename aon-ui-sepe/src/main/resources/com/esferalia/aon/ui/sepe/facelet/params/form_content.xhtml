<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-group">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.sepe_contrata_loginData}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
			
				<aon:panel style="width: 300px;">
					<aon:selectBooleanCheckbox id="test_enviroment"
						value="#{sepeAppParams.contrataTestEnviroment}" />
					<aon:outputLabel for="test_enviroment"
						style="#{(sepeAppParams.contrataTestEnviroment)?('color: red; font-weight:bold;'):('text-decoration: line-through;')}"
						value="#{bundle.sepe_test_environment_active}" />
				</aon:panel>
				
				<aon:panelGrid columns="2" columnClasses="aon-vertical-align-top,aon-vertical-align-top">

					<aon:panelGrid columns="2" style="width: 300px;">
						<aon:outputLabel for="contrata_user" 
							value="#{bundle.aon_login_user}" />
						<aon:inputText id="contrata_user" style="width: 100%;"
							value="#{sepeAppParams.contrataUser}" />

						<aon:outputLabel for="contrata_passwd"  
							value="#{bundle.aon_login_passwd}" />
						<aon:inputSecret id="contrata_passwd" redisplay="#{true}" style="width: 100%;"
							value="#{sepeAppParams.contrataPassword}" />

					</aon:panelGrid>
			
					<aon:div id="contrata-login-confirm-result" style="width: 300px; text-align: center;">
						<c:if test="#{not empty sepeAppParams.contrataUser and not empty sepeAppParams.contrataPassword}" >
							<aon:outputLabel for="contrata_login_confirm" value="&#160;" />
							<aon:commandButton id="contrata_login_confirm"
								value="Validar el acceso al entorno de S.E.P.E."
								reRender="contrata-login-confirm-result"
								actionListener="#{sepeAppParams.validateContrataLogin}"
								styleClass="aon-commandButton aon-icon-sincronize aon-margin-bottom" />
						</c:if>
						<aon:div styleClass="aon-margin-top"
							rendered="#{sepeAppParams.contrataLoginChecked}">
							<aon:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;"
								rendered="#{sepeAppParams.validContrataLogin}"
								styleClass="aon-icon-predetermine" />
							<aon:outputText value="Acceso autorizado"
								rendered="#{sepeAppParams.validContrataLogin}"
								style="color:blue;"
								styleClass="aon-bold" />
							
							<aon:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;"
								rendered="#{!sepeAppParams.validContrataLogin}"
								styleClass="aon-icon-wrong " />
							<aon:outputText value="Acceso rechazado"
								rendered="#{!sepeAppParams.validContrataLogin}"
								style="color:red;"
								styleClass="aon-bold" />
						</aon:div>
					</aon:div>
						
				</aon:panelGrid>	
			</aon:div>
		</aon:div>
	</aon:div>
	
	<aon:div styleClass="aon-group">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.sepe_certifica2_loginData}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
			
				<aon:panel style="width: 300px;">
					<aon:selectBooleanCheckbox id="test_enviroment-certifica2"
						value="#{sepeAppParams.certifica2TestEnviroment}" />
					<aon:outputLabel for="test_enviroment-certifica2"
						style="#{(sepeAppParams.certifica2TestEnviroment)?('color: red; font-weight:bold;'):('text-decoration: line-through;')}"
						value="#{bundle.sepe_test_environment_active}" />
				</aon:panel>
				
				<aon:panelGrid columns="2" columnClasses="aon-vertical-align-top,aon-vertical-align-top">

					<aon:panelGrid columns="2" style="width: 300px;">
						<aon:outputLabel for="certifica2_user" 
							value="#{bundle.aon_login_user}" />
						<aon:inputText id="certifica2_user" style="width: 100%;"
							value="#{sepeAppParams.certifica2User}" />

						<aon:outputLabel for="certifica2_passwd"  
							value="#{bundle.aon_login_passwd}" />
						<aon:inputSecret id="certifica2_passwd" redisplay="#{true}" style="width: 100%;"
							value="#{sepeAppParams.certifica2Password}" />

					</aon:panelGrid>
			
					<aon:div id="certificados-login-confirm-result" style="width: 300px; text-align: center;">
						<c:if test="#{not empty sepeAppParams.certifica2User and not empty sepeAppParams.certifica2Password}" >
							<aon:outputLabel for="certifica2_login_confirm" value="&#160;" />
							<aon:commandButton id="certifica2_login_confirm"
								value="Validar el acceso al entorno de S.E.P.E."
								reRender="certificados-login-confirm-result"
								actionListener="#{sepeAppParams.validateCertifica2Login}"
								styleClass="aon-commandButton aon-icon-sincronize aon-margin-bottom" />
						</c:if>
						<aon:div styleClass="aon-margin-top"
							rendered="#{sepeAppParams.certifica2LoginChecked}">
							<aon:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;"
								rendered="#{sepeAppParams.validCertifica2Login}"
								styleClass="aon-icon-predetermine" />
							<aon:outputText value="Acceso autorizado"
								rendered="#{sepeAppParams.validCertifica2Login}"
								style="color:blue;"
								styleClass="aon-bold" />
							
							<aon:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;"
								rendered="#{!sepeAppParams.validCertifica2Login}"
								styleClass="aon-icon-wrong " />
							<aon:outputText value="Acceso rechazado"
								rendered="#{!sepeAppParams.validCertifica2Login}"
								style="color:red;"
								styleClass="aon-bold" />
						</aon:div>
					</aon:div>
						
				</aon:panelGrid>	
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
