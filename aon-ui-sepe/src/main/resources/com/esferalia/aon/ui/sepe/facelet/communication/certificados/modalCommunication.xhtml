<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showCertificadosCommunicationWindow">
		<aon:if test="#{controller.showCommunicationWindow}">
			<rich:modalPanel id="certificadosCommunicationLogModalPanel" minHeight="500"
				minWidth="800" rendered="#{controller.showCommunicationWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.sepe_certificados}:&#160;" />
						<aon:outputText value="#{bundle.sepe_communication_status}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showCertificadosCommunicationWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showCommunicationWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="certificadosCommunicationForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">

								<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/certificados/modalToolbar.xhtml" />

								<aon:panel rendered="#{contractCertificados.readOnly}">
									<aon:outputText style="padding-left:18px;"
										styleClass="aon-icon-warning aon-bold"
										value="VISTA DE SOLO LECTURA" />
									<br/>
									<aon:outputText style="padding-left:18px;"
										styleClass="aon-bold"
										value="El contrato esta remesado" />
									<br/>
									<aon:outputText style="padding-left:18px;"
										styleClass="aon-bold"
										value="Fecha Notificacion: " />
									<aon:outputText styleClass="aon-bold"
										rendered="#{contractCertificados.readOnly}"
										value="#{contractCertificados.batch.date}" />
								</aon:panel>

								<aon:div style="width:99%">
									<aon:div rendered="#{contractCertificados.communicationIdReceived or contractCertificados.communicationResponseReceived}">
										<aon:outputText escape="#{false}" 
											value="#{contractCertificados.communicationLogContent}" />
									</aon:div>
								</aon:div>
								
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalLogin.xhtml" >
					<ui:param name="controller" value="#{contractCertificados}" />
					<ui:param name="suffix" value="certificados" />
					<ui:param name="reRender" value="showCertificadosCommunicationWindow" />
				</ui:include>
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/certificados/modalGeneration.xhtml" >
					<ui:param name="controller" value="#{contractCertificados}" />
				</ui:include>
				
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
