<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContrataLoginWindow">
		<c:if test="#{controller.showLoginWindow}">
			<rich:modalPanel id="contrataLoginModalPanel" minHeight="180"
				minWidth="450" rendered="#{controller.showLoginWindow}"
				showWhenRendered="true" zindex="91">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_login}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContrataLoginWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showLoginWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="contrataLoginForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="contrataCommunicationLogin-accept"
										value="#{bundle.aon_accept}"
										reRender="showContrataCommunicationWindow-#{controller.contrataModelName},#{(controller.batch.id!=null)?(''):('contractForm')}"
										rendered="#{controller.communicator.dataCommunication}"
										actionListener="#{controller.onSendSepeFile}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
		     							oncomplete="Richfaces.hideModalPanel('waitProccess')">
		     							<aon:actionHotKey key="return" />
										<rich:componentControl for="contrataLoginModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showLoginWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="contrataQueryLogin-accept"
										value="#{bundle.aon_accept}"
										reRender="showContrataCommunicationWindow-#{controller.contrataModelName},#{(controller.batch.id!=null)?(''):('contractForm')}"
										rendered="#{controller.communicator.dataQuery}"
										actionListener="#{controller.onSepeDataQuery}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
		     							oncomplete="Richfaces.hideModalPanel('waitProccess')">
		     							<aon:actionHotKey key="return" />
										<rich:componentControl for="contrataLoginModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showLoginWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="contrataLogin-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showContrataLoginWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showLoginWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
							
								<c:if test="#{controller.communicator.testEnv}">
									<aon:div style="color: red; font-weight:bold; width: 100%; text-align: center; margin-bottom: -1em;">
										<aon:outputText value="#{bundle.sepe_test_environment_active}" />
									</aon:div>
								</c:if>
								
								<aon:div style="margin-top: 2em;">
								
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
										
										<aon:panelGroup>
											<aon:outputLabel for="contrata_user" 
												value="#{bundle.sepe_login_user}" />
											<br />
											<aon:outputText value="#{bundle.sepe_login_user2}" />
										</aon:panelGroup>	
										<aon:inputText id="contrata_user" 
											required="#{true}" style="width: 100%;" 
											value="#{controller.communicator.user}" />
										
										<aon:outputLabel for="contrata_passwd" 
											value="#{bundle.sepe_login_passwd}" />
										<aon:div id="passwd-div">
											<aon:inputSecret id="contrata_passwd" 
												required="#{true}" style="width: 100%;"
												rendered="#{!controller.communicator.passwdVisible}"
												value="#{controller.communicator.passwd}" />	
											<aon:inputText id="contrata_passwd-visible" 
												required="#{true}" style="width: 100%;"
												rendered="#{controller.communicator.passwdVisible}"
												value="#{controller.communicator.passwd}" />
										</aon:div>

									</aon:panelGrid>

									<aon:div style="padding-top: 5px;">
										<aon:selectBooleanCheckbox id="contrataLogin_remember"
											value="#{controller.communicator.loginRemember}" />
										<aon:outputLabel for="contrataLogin_remember"
											styleClass="aon-italic" 
											value="#{bundle.sepe_login_contrataLoginRemember}" />
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
