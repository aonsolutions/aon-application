<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showExtensionContrataWindow">
		<aon:if test="#{extensionContrata.showExtensionContrataWindow}">
			<rich:modalPanel id="extensionContrataModalPanel" minHeight="350"
				minWidth="650" showWhenRendered="true" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Prorroga" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showExtensionContrataWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{extensionContrata.showExtensionContrataWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="extensionContrataModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="extensionContrataSave"
											value="#{bundle.aon_accept}"
											reRender="showExtensionContrataWindow, #{reRender}"
											actionListener="#{contract.onExtendContract}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<f:setPropertyActionListener
												target="#{extensionContrata.showExtensionContrataWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="extensionContrataCancel"
											value="#{bundle.aon_cancel}" immediate="true"
											reRender="showExtensionContrataWindow"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{extensionContrata.showExtensionContrataWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									
										<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/extension/form_content.xhtml" />

									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>
</ui:composition>
