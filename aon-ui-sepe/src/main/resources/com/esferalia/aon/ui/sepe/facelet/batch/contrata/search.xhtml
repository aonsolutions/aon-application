<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contrataBatchSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.sepe_contrataBatch_module}" />
				<ui:param name="controller" value="#{contrataBatch}" />
			</ui:include>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{contrataBatch}" />
				<ui:define name="searchContent">
				
					<aon:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{contrataBatchSearch.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
						</ui:include>
					</aon:if>
				
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="ContrataBatch_date-From" styleClass="aon-form-date-label aon-margin-right"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="ContrataBatch_date-From"
							value="#{contrataBatchSearch.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					
						<aon:outputLabel for="ContrataBatch_date-To" styleClass="aon-form-date-label aon-margin-right"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="ContrataBatch_date-To"
							value="#{contrataBatchSearch.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
					
					<aon:outputLabel for="ContrataBatch_type" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="ContrataBatch_type" converter="aon.EnumConverter"
						valueChangeListener="#{controller.addEqualExpression}" >
						<f:selectItem itemLabel=" - " value="#{null}" />
						<f:selectItems value="#{sepeCollections.contrataFileTypeList}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ContrataBatch_status" value="#{bundle.aon_status}" />
					<aon:selectManyCheckbox id="ContrataBatch_status" 
						value="#{contrataBatchSearch.fileStatus}" >
						<f:selectItems value="#{payrollCollections.fileStatus}" />
					</aon:selectManyCheckbox>
					
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		
	</ui:define>
	
</ui:composition>
