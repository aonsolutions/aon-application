<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		
		<ui:param name="innerToolbar" value="true" />
		<ui:param name="showTitle" value="false" />
		<ui:param name="showDescription" value="false" />
		
		<ui:define name="toolbarContent">

			<!--  
			<aon:if test="#{!skipBatchButton and empty controller.generatedFile}">
				<aon:commandButton id="batch-file"
					value="#{bundle.sepe_contrata_batch}"
					rendered="#{!controller.communicationIdReceived}"
					styleClass="aon-finding-toolbar-item aon-icon-newFolder" >
					<f:setPropertyActionListener
						target="#{controller.showBatchWindow}" value="#{true}" />
				</aon:commandButton>
			</aon:if>
			-->
			
			<aon:if test="#{empty contractCertificados.generatedFile}">
				<aon:commandButton id="generate-certificados"
					value="#{bundle.sepe_certificados_generate_certificate}"
					reRender="showGenerationWindow"
					styleClass="aon-finding-toolbar-item aon-icon-file-entrance" >
					<f:setPropertyActionListener
						target="#{contractCertificados.showGenerationWindow}" value="#{true}" />
				</aon:commandButton>
			</aon:if>	
			
			<aon:if test="#{not empty contractCertificados.generatedFile}">
				<aon:commandButton id="sepe-communication"
					value="#{bundle.sepe_communicate}"
					disabled="#{contractCertificados.communicationIdReceived or contractCertificados.readOnly}"
					reRender="showCertificadosCommunicationWindow,#{(contractCertificados.batch.id!=null)?(''):('contractForm')}"
					actionListener="#{contractCertificados.onSendSepeFile}"
					onclick="Richfaces.showModalPanel('waitProccess')" 
	 				oncomplete="Richfaces.hideModalPanel('waitProccess')"
					styleClass="aon-finding-toolbar-item aon-icon-commit" />
				
				<aon:commandButton id="sepe-dataQuery"
					value="#{bundle.sepe_status_check}"
					disabled="#{!contractCertificados.communicationIdReceived or contractCertificados.readOnly}"
					reRender="showCertificadosCommunicationWindow,#{(contractCertificados.batch.id!=null)?(''):('contractForm')}"
					actionListener="#{contractCertificados.onSepeDataQuery}"
					onclick="Richfaces.showModalPanel('waitProccess')" 
	 				oncomplete="Richfaces.hideModalPanel('waitProccess')"
					styleClass="aon-finding-toolbar-item aon-icon-update" />
					
				<aon:if test="#{!contractCertificados.readOnly}">
					<aon:dropDownMenu value="#{bundle.aon_more2}"
					 	style="display:inline-block;font-size:0.8em;margin-right:4px;" >
			            <f:facet name="label">
							<aon:panelGroup>
								<aon:outputText value="#{bundle.aon_more2}" /> 
								<aon:graphicImage style="vertical-align:middle;"
			                     	value="#{aonResource.resolve['/images/aon-icon/aon-icon-dropDown.gif']}" />
							</aon:panelGroup>
			            </f:facet>
			            
			            <aon:menuItem id="sepe-process-restart"
							value="Reiniciar proceso"
							rendered="#{(contractCertificados.contract != null) and 
								((not contractCertificados.communicationAccepted)
								or (not contractCertificados.communicationFinished)) }"
							actionListener="#{contractCertificados.onRemoveSepeFiles}"
							reRender="showCertificadosCommunicationWindow,#{(contractCertificados.batch.id!=null)?(''):('contractForm')}"
							iconClass="aon-icon-refresh" 
							/>
			            			
						<aon:menuItem iconClass="aon-icon-pdf"
						rendered="#{contractCertificados.contract != null}"
						>
							<aon:htmlCommandLink id="sepePdfdownload" 
								value="#{bundle.aon_fileupload_download} PDF." target="_blank"
								actionListener="#{contractCertificados.onDownloadSepePdf}" 
								/>
			     		</aon:menuItem>
						<aon:menuItem iconClass="aon-icon-file-download">
							<aon:htmlCommandLink id="sepeXmldownload" 
								value="#{bundle.aon_fileupload_download} XML." target="_blank"
								actionListener="#{contractCertificados.onDownloadSepeXml}" />
			     		</aon:menuItem>
						<aon:if test="#{!skipDownloadButton}">
						</aon:if>
						<!--  aon:menuItem iconClass="aon-icon-file-upload">
							<aon:htmlCommandLink id="sepeXmlupload" 
								value="#{bundle.aon_file_upload} XML." target="_blank"
								actionListener="#{contractCertificados.onDownloadSepeXml}" />
			     		</aon:menuItem-->
					</aon:dropDownMenu>			
				</aon:if>
				
			</aon:if>
			
		</ui:define>
		
	</ui:decorate>	
								
</ui:composition>
