<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<c:if test="#{showEnterpriseColumn}">
		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_company}" />
			</f:facet>
			<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}" />
		</aon:column>
	</c:if>

	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document}" />
		</f:facet>
		<aon:outputText value="#{to.person.registry.document}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_salary_employee}" />
		</f:facet>
		<aon:outputText value="#{to.person.fullName}" />		
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-dateColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_start_date}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-dateColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_end_date}" />
		</f:facet>
		<aon:outputText value="#{to.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.certifica2Batch_suspension_cause}" />
		</f:facet>
	    <aon:outputText rendered="#{!controllerList.checkHandler.rowChecked}" value="#{controllerList.rowSuspensionCause}" />
	    <rich:inplaceSelect rendered="#{controllerList.checkHandler.rowChecked}" 
		 	id="contract-suspensionCause"
		 	value="#{controllerList.rowSuspensionCause}"
		 	listHeight="300px" listWidth="300px"
		 	viewClass="aon-highlight" 
		 	viewHoverClass="aon-underline"
		 	style="width:150px; overflow:hidden; white-space:normal; border-bottom-style:none; cursor: pointer;"
	        defaultLabel="#{bundle.certifica2Batch_suspension_cause_select}" >
			<f:selectItems value="#{sepeCollections.suspensionCauses}" />
		</rich:inplaceSelect>
	</aon:column>
	
</ui:composition>
