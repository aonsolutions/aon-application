<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGrid id="dataTable#{suffix}" columns="2" style="width: 100%;">

		<aon:outputLabel for="extensionContrata_fechaInicio#{suffix}" 
			value="#{bundle.aon_start_date}" />
		<aon:selectInputDate id="extensionContrata_fechaInicio#{suffix}"
			required="#{true}" 
			value="#{extensionContrata.params.fechaInicio}" 
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="extensionContrata_fechaFin#{suffix}" 
			value="#{bundle.aon_end_date}" />
		<aon:selectInputDate id="extensionContrata_fechaFin#{suffix}" 
			required="#{true}" 
			value="#{extensionContrata.params.fechaFin}" 
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
			
		<aon:outputLabel for="extensionContrata_indicadorConvCol#{suffix}" 
			rendered="#{extensionContrata.handler.indicadorConvCol}" 
			value="#{bundle.sepe_contrata_extension_indicadorConvCol}" />
		<aon:selectBooleanCheckbox id="extensionContrata_indicadorConvCol#{suffix}" 
			rendered="#{extensionContrata.handler.indicadorConvCol}" 
			value="#{extensionContrata.params.indicadorConvCol}" />

		<aon:outputLabel for="extensionContrata_indicadorDiscontinuidad#{suffix}" 
			value="#{bundle.sepe_contrata_extension_indicadorDiscontinuidad}" />
		<aon:selectBooleanCheckbox id="extensionContrata_indicadorDiscontinuidad#{suffix}" 
			value="#{extensionContrata.params.indicadorDiscontinuidad}" />

		<aon:outputLabel for="extensionContrata_indEmpresaAappUniversidad#{suffix}" 
			rendered="#{extensionContrata.handler.indEmpresaAappUniversidad}" 
			value="#{bundle.sepe_contrata_extension_indEmpresaAappUniversidad}" />
		<aon:selectBooleanCheckbox id="extensionContrata_indEmpresaAappUniversidad#{suffix}" 
			rendered="#{extensionContrata.handler.indEmpresaAappUniversidad}" 
			value="#{extensionContrata.params.indEmpresaAappUniversidad}" />

		<aon:outputLabel for="extensionContrata_indPeriodoAutorizaDuracion#{suffix}" 
			rendered="#{extensionContrata.handler.indPeriodoAutorizaDuracion}" 
			value="#{bundle.sepe_contrata_extension_indPeriodoAutorizaDuracion}" />
		<aon:selectBooleanCheckbox id="extensionContrata_indPeriodoAutorizaDuracion#{suffix}" 
			rendered="#{extensionContrata.handler.indPeriodoAutorizaDuracion}" 
			value="#{extensionContrata.params.indPeriodoAutorizaDuracion}" />
			
		<aon:outputLabel for="extensionContrata_formationDuration#{suffix}" 
			rendered="#{extensionContrata.handler.horasFormacion}" 
			value="#{bundle.sepe_contrata_extension_formation_hours}" />
		<aon:div id="extensionContrata_formationDuration#{suffix}"
			rendered="#{extensionContrata.handler.horasFormacion}">
			<aon:outputLabel for="extensionContrata_formationHours#{suffix}" styleClass="aon-italic aon-margin-right"
				value="#{bundle.sepe_hours}:" />
			<aon:inputText id="extensionContrata_formationHours#{suffix}" size="4" maxlength="4"
				value="#{extensionContrata.params.horasFormacion}" />
			<aon:outputLabel for="extensionContrata_formationMinutes#{suffix}" styleClass="aon-italic aon-margin-left aon-margin-right"
				value="#{bundle.sepe_minutes}:" />
			<aon:inputText id="extensionContrata_formationMinutes#{suffix}" size="2" maxlength="2"
				value="#{extensionContrata.params.minutosFormacion}" />
		</aon:div>
	
		<aon:outputLabel for="extensionContrata_indDuracInferior#{suffix}" 
			rendered="#{extensionContrata.handler.indDuracInferior}" 
			value="#{bundle.sepe_contrata_extension_indDuracInferior}" />
		<aon:selectBooleanCheckbox id="extensionContrata_indDuracInferior#{suffix}" 
			rendered="#{extensionContrata.handler.indDuracInferior}" 
			value="#{extensionContrata.params.indDuracInferior}" />
		
		<aon:outputLabel for="extensionContrata_usoLibreEmpresa#{suffix}" 
			value="#{bundle.sepe_contrata_usoLibreEmpresa}" />
		<aon:inputText id="extensionContrata_usoLibreEmpresa#{suffix}" size="30" maxlength="30"
			value="#{extensionContrata.params.usoLibreEmpresa}" />
			
	</aon:panelGrid>

</ui:composition>
