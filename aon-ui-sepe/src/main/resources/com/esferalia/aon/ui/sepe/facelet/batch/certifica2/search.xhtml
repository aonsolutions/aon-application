<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fanBatchSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.sepe_certifica2Batch_module}" />
				<ui:param name="controller" value="#{certifica2Batch}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{certifica2Batch}" />
				<ui:define name="searchContent">
								
					<aon:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{certifica2BatchSearch.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
						</ui:include>
					</aon:if>
					
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Certifica2Batch_date-From" styleClass="aon-form-date-label aon-margin-right"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Certifica2Batch_date-From"
							value="#{certifica2BatchSearch.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					
						<aon:outputLabel for="Certifica2Batch_date-To" styleClass="aon-form-date-label aon-margin-right"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Certifica2Batch_date-To"
							value="#{certifica2BatchSearch.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
					
					<aon:outputLabel for="Certifica2Batch_status" value="#{bundle.aon_status}" />
					<aon:selectManyCheckbox id="Certifica2Batch_status" 
						value="#{certifica2BatchSearch.fileStatus}" >
						<f:selectItems value="#{payrollCollections.fileStatus}" />
					</aon:selectManyCheckbox>
										
				</ui:define>
			</ui:decorate>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		
	</ui:define>
	
</ui:composition>
