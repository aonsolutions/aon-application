<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="batchForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{toolbarTitle}" />
				<ui:param name="controller" value="#{controller}" />
				<ui:define name="beforeSpinToolbarContent">
					<!--  
					<aon:commandButton id="create-button" value="#{bundle.payroll_create_disk}"
						rendered="#{!controller.nevv and !controller.recorded and controllerDetail.model.rowCount > 0}"
						reRender="batchForm, #{createButtonReRender}"
						styleClass="aon-finding-toolbar-item aon-icon-xml"
						actionListener="#{controller.onCreateDisk}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					-->
					<ui:insert name="moreToolbarContent" />
				</ui:define>		
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:insert name="batchContent" />
				
				<aon:panelTabSet id="batchPanelTabSet" rendered="#{!controller.nevv}">
					<aon:if test="#{controllerDetail.model.rowCount > 0}" >
						<aon:panelTab id="batchedTab" label="#{bundle.payroll_batch_included}">
							<ui:insert name="batchedTabContent" />
						</aon:panelTab>
					</aon:if>
					<aon:if test="#{!controller.recorded}" >
						<aon:panelTab id="noBatchedTab" label="#{bundle.payroll_not_batched}">
							<ui:insert name="noBatchedTabContent" />
						</aon:panelTab>
					</aon:if>
					<aon:if test="#{sepeAppParams.developmentMode or aonRole.sysAdmin}">
						<aon:panelTab id="documentTab" label="#{bundle.aon_tracking}">
							<ui:insert name="documentTabContent" />
						</aon:panelTab>
					</aon:if>
					<ui:insert name="moreTabContent" />
				</aon:panelTabSet>
				
			</aon:div>

		</aon:form>

		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
		<ui:insert name="afterFormContent" />
		
	</ui:define>
</ui:composition>
