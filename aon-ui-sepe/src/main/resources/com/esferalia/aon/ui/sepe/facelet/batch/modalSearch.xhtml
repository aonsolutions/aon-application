<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showListSearchWindow">
		<aon:if test="#{controller.checkHandler.showListSearchWindow}">
			<rich:modalPanel id="listSearchModalPanel" minHeight="370"
				minWidth="650" rendered="#{controller.checkHandler.showListSearchWindow}"
				showWhenRendered="true" zindex="100">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.payroll_refine_search}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showListSearchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.checkHandler.showListSearchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="listSearchForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="listSearch-search"
										value="#{bundle.aon_search}"
										reRender="showListSearchWindow,#{searchReRender}"
										actionListener="#{controller.onSearch}"
										styleClass="aon-finding-toolbar-item aon-icon-search">
										<rich:componentControl for="listSearchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.checkHandler.showListSearchWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="listSearch-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showListSearchWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.checkHandler.showListSearchWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" >
								
									<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" >
										
											<aon:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
												<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
													<ui:param name="lookupTo" value="#{controller.enterprise}" />
													<ui:param name="skipNewButton" value="#{true}" />
													<ui:param name="skipGoToButton" value="#{true}" />
												</ui:include>
											</aon:if>
	
											<ui:insert name="modalContent" />
	
										</aon:panelGrid>
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
				<ui:insert name="afterFormContent" />
				
				<aon:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
					<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
				</aon:if>
				
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
