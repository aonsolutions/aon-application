<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<c:if test="#{showEnterpriseColumn}">		
		<aon:column alias="Contract.workPlace.enterprise.registry.surname,Contract.workPlace.enterprise.registry.name"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{companyBundle.company_enterprise}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.contract.workPlace.enterprise.registry.fullName}"/>
			</aon:div>
		</aon:column>
	</c:if>
	
	<aon:column alias="Contract.person.registry.surname,Contract.person.registry.name"
		styleClass="aon-editDataTable-textColumn aon-width-width">
		<f:facet name="header">
			<aon:outputText value="#{registryBundle.registry_person}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.contract.person.registry.fullName}"/>
		</aon:div>
	</aon:column>
			
	<aon:column alias="Contract.ccc.activity.description"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{companyBundle.company_activity}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.contract.enterpriseCCC.activity.description}"/>
		</aon:div>
	</aon:column>
	
	<aon:column alias="Contract.startDate"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_start_date}" />
		</f:facet>
		<aon:outputText value="#{to.contract.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>
	
	<aon:column alias="Contract.sepeStatus"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.contract.sepeStatus}"  />
	</aon:column>
	
</ui:composition>
