						disabled="#{contractContrata.readOnly}"
						value="#{contractContrata.params.codigoColectivoReduccion}" >

		<aon:div id="medidasFomentoPanel" rendered="#{contractContrata.params.medidasFomentoData}">

				</f:facet>
				<aon:panelGrid columns="2" style="width: 100%;">
			
					<aon:outputLabel for="indCosteDespido"
						value="#{bundle.sepe_contrata_contract_indCosteDespido}" />

						disabled="#{contractContrata.readOnly}"
						value="#{contractContrata.params.indCosteDespido}"/>

				</aon:panelGrid>
			</aon:panel>

	</aon:div>
