<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:if test="#{showEnterpriseColumn}">		
		<aon:column alias="Contract.workPlace.enterprise.registry.name"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_company}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}"/>
			</aon:div>
		</aon:column>
	</aon:if>

	<aon:column alias="Contract.person.firstSurname, Contract.person.secondSurname, Contract.person.name"
		styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.registry_person}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.person.fullName}"/>
		</aon:div>
	</aon:column>

	<aon:column 
		styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_contract_contract_code}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{controllerList.rowContractCode}"/>
		</aon:div>
	</aon:column>

	<aon:column alias="Contract.ccc.activity.description"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_activity}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.enterpriseCCC.activity.description}"/>
		</aon:div>
	</aon:column>
	
	<aon:column alias="Contract.startDate"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_start_date}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>

</ui:composition>
