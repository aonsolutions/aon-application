<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
		
	<aon:panelGroup id="suspensionCauseWindow">
		<aon:if test="#{controller.showSuspensionCauseWindow}">
			<rich:modalPanel id="suspensionCauseModalPanel" minHeight="370"
				minWidth="650" rendered="#{controller.showSuspensionCauseWindow}"
				showWhenRendered="true" zindex="100" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_check}" />
						<aon:outputText value="&#160;" />
						<aon:outputText value="#{bundle.certifica2Batch_suspension_cause}: " />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="suspensionCauseWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showSuspensionCauseWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="suspensionCauseForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
																
								<aon:div styleClass="aon-scroll-area" >
									<aon:dataTable id="suspensionCauseList" rows="100" var="to" 
										value="#{controller.suspensionCauseModel}">
										
										<aon:if test="#{!controller.rowSuspensionCauseSelected}">
											<aon:rowSelector id="suspensionCauselList-select" 
												actionListener="#{controller.onSelectSuspensionCauseForAll}" />
										</aon:if>
										<aon:if test="#{controller.rowSuspensionCauseSelected}">
											<aon:rowSelector id="suspensionCauselList-select" 
												actionListener="#{controller.onSelectRowSuspensionCause}" />
										</aon:if>
				
										<aon:column>
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_id}" />
											</f:facet>
											<aon:outputText value="#{to.value.value}" />
										</aon:column>
										
										<aon:column>
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_description}" />
											</f:facet>
											<aon:outputText value="#{to.label}" />
										</aon:column>
					
									</aon:dataTable>
									<aon:dataScroller for="suspensionCauseList" showNote="true" />
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
