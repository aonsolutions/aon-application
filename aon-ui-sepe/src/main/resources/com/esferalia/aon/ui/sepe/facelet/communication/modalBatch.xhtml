<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContrataBatchWindow">
		<c:if test="#{controller.showBatchWindow}">
			<rich:modalPanel id="batchModalPanel" minHeight="350"
				minWidth="350" rendered="#{controller.showBatchWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.sepe_batch_selection}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContrataBatchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showBatchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="contrataBatchForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">

								<aon:div style="width:99%">
	
									<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
										<ui:param name="innerToolbar" value="true" />
										<ui:param name="showTitle" value="false" />
										<ui:param name="showDescription" value="false" />
										<ui:define name="toolbarContent">
											<aon:commandButton id="batch-accept"
												value="#{controller.newBatch?bundle.aon_accept:bundle.aon_save}"
												actionListener="#{controller.onBatchAccept}"
												reRender="showContrataBatchWindow"
												styleClass="aon-finding-toolbar-item aon-icon-accept" >
												<f:setPropertyActionListener
													target="#{controller.showBatchWindow}"
													value="#{false}" />
											</aon:commandButton>
											<aon:commandButton id="batch-new"
												value="#{bundle.aon_reset}"
												rendered="#{!controller.newBatch}"
												actionListener="#{controller.onResetBatch}"
												reRender="showContrataBatchWindow"
												styleClass="aon-finding-toolbar-item aon-icon-reset" />
										</ui:define>
									</ui:decorate>
								
									<aon:panelGrid columns="2" style="width: 100%;" >
										
										<aon:outputLabel for="ContrataBatch_selection" 
											rendered="#{!controller.newBatch}"
											value="#{bundle.aon_finance_batch}" />
										<aon:selectOneMenu id="ContrataBatch_selection"
											rendered="#{!controller.newBatch}"
											value="#{controller.batch}" >
											<f:selectItems value="#{controller.pendingBatchList}" />
										</aon:selectOneMenu>
										
										<aon:outputLabel for="ContrataBatch_date" 
											rendered="#{controller.newBatch}"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="ContrataBatch_date" rendered="#{controller.newBatch}"
											value="#{controller.batch.date}" required="#{true}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
											
									</aon:panelGrid>
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
