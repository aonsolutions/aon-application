<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:if test="#{contrataBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/sepe/facelet/batch/contrata/form_new.xhtml" />
	</aon:if>
	
	<aon:if test="#{!contrataBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/sepe/facelet/batch/form.xhtml">
			<ui:param name="toolbarTitle" value="#{bundle.sepe_contrataBatch_module}" />
			<ui:param name="controller" value="#{contrataBatch}" />
			<ui:param name="controllerDetail" value="#{contrataBatchDetail}" />
			<ui:param name="controllerAttach" value="#{contrataBatchAttach}" />
			
			<ui:define name="moreToolbarContent" >
				<aon:commandButton id="contractContrata-batch-communication"
					value="#{bundle.sepe_contrata}"
					rendered="#{controller.recorded and contrataBatch.to.type=='CONTRACT'}" ajaxSingle="true"
					reRender="showContrataCommunicationWindow-#{contractContrata.contrataModelName}"
					styleClass="aon-finding-toolbar-item aon-icon-sepe-contrata" >
					<f:setPropertyActionListener
						target="#{contractContrata.showCommunicationWindow}" value="#{true}" />
				</aon:commandButton>
				<aon:commandButton id="extensionContrata-batch-communication"
					value="#{bundle.sepe_contrata}"
					rendered="#{controller.recorded and contrataBatch.to.type=='EXTENSION'}" ajaxSingle="true"
					reRender="showContrataCommunicationWindow-#{extensionContrata.contrataModelName}"
					styleClass="aon-finding-toolbar-item aon-icon-sepe-contrata" >
					<f:setPropertyActionListener
						target="#{extensionContrata.showCommunicationWindow}" value="#{true}" />
				</aon:commandButton>
				<aon:commandButton id="transformContrata-batch-communication"
					value="#{bundle.sepe_contrata}"
					rendered="#{controller.recorded and contrataBatch.to.type=='TRANSFORMATION'}" ajaxSingle="true"
					reRender="showContrataCommunicationWindow-#{transformContrata.contrataModelName}"
					styleClass="aon-finding-toolbar-item aon-icon-sepe-contrata" >
					<f:setPropertyActionListener
						target="#{transformContrata.showCommunicationWindow}" value="#{true}" />
				</aon:commandButton>
			</ui:define>        
			
			<ui:define name="batchContent" >
				<aon:panelGrid id="dataTable" columns="4" style="width: 60%;"
					columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto">
	
					<aon:outputLabel for="ContrataBatch_date" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="ContrataBatch_date" 
						required="#{true}"
						disabled="#{!contrataBatch.nevv}"
						value="#{contrataBatch.to.date}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
					
					<aon:outputText value="#{bundle.aon_status}" />
					<aon:outputText value="#{contrataBatch.to.status}" />
					
					<aon:outputLabel for="ContrataBatch_type" 
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="ContrataBatch_type"
						required="#{true}"
						disabled="#{!contrataBatch.nevv}"
						value="#{contrataBatch.to.type}" >
						<f:selectItem itemLabel=" - " value="#{null}" />
						<f:selectItems value="#{sepeCollections.contrataFileTypeList}" />
					</aon:selectOneMenu>
					
					<aon:outputText value="&#160;" />
					<aon:outputText value="&#160;" />
					
				</aon:panelGrid>
			</ui:define>
			
			<ui:define name="batchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/contrata/formDetail.xhtml" />
			</ui:define>
			
			<ui:define name="noBatchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/contrata/formNoBatched.xhtml" >
					<ui:param name="controller" value="#{contrataBatch}" />
				</ui:include>
			</ui:define>
			
			<ui:define name="documentTabContent" >
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/formDocument.xhtml" >
					<ui:param name="controllerAttach" value="#{contrataBatchAttach}" />
				</ui:include>
			</ui:define>
			
			<ui:define name="afterFormContent" >
				<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
				<aon:lookupButtonPopup lookup="#{personLookup}" />
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/contrata/modalSearch.xhtml">
					<ui:param name="controller" value="#{contrataList}" />
					<ui:param name="searchReRender" value="listToolBarDiv, listDataDiv" />
				</ui:include>
				
				<!-- SEPE ONLINE COMMUNICATION -->
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalCommunication.xhtml" >
					<ui:param name="controller" value="#{contractContrata}" />
					<ui:param name="skipBatchButton" value="#{true}" />
					<ui:param name="skipDownloadButton" value="#{true}" />
				</ui:include>
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalCommunication.xhtml" >
					<ui:param name="controller" value="#{extensionContrata}" />
					<ui:param name="skipBatchButton" value="#{true}" />
					<ui:param name="skipDownloadButton" value="#{true}" />
				</ui:include>
				<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalCommunication.xhtml" >
					<ui:param name="controller" value="#{transformContrata}" />
					<ui:param name="skipBatchButton" value="#{true}" />
					<ui:param name="skipDownloadButton" value="#{true}" />
				</ui:include>
				
			</ui:define>
			
		</ui:decorate>
	</aon:if>

</ui:composition>
