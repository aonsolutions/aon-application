<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sepeTablesList">

			<aon:div ajaxRendered="true" layout="none">
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{bundle.sepe_sepeTables_module}" />
					<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
						<aon:div styleClass="aon-panelGrid-search-info">
							<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
						</aon:div>
						<aon:panelGrid columns="1">
							<aon:inputText id="sepeTablesFilter" size="150" value="#{sepeTables.tablesFilter}">
								<a4j:support 
									event="onkeyup"
									actionListener="#{sepeTables.onInitTablesModels}"
									reRender="sepeTablesTab"
									eventsQueue="sepeTablesFilterKeyUp"
									requestDelay="500"
									ajaxSingle="true"
									ignoreDupResponses="true"
									limitToList="true"/>
							</aon:inputText>
						</aon:panelGrid>	
					</aon:div>
				
					<aon:panelTabSet id="sepeTablesTab" selectedTab="#{sepeTables.selectedTab}">
						
						<ui:include template="/com/esferalia/aon/ui/sepe/facelet/sepeTables/list_contrataTab.xhtml" >
							<ui:param name="controller" value="#{sepeTables}" />
							<ui:param name="listAction" value="sepeCodes_list" />
						</ui:include>
						
						<ui:include template="/com/esferalia/aon/ui/sepe/facelet/sepeTables/list_certificadosTab.xhtml" >
							<ui:param name="controller" value="#{sepeTables}" />
							<ui:param name="listAction" value="sepeCodes_list" />
						</ui:include>
						
					</aon:panelTabSet>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
