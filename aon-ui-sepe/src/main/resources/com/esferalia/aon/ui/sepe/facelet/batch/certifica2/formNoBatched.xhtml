<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<ui:decorate template="/com/esferalia/aon/ui/sepe/facelet/batch/formNoBatched.xhtml">
		
		<ui:param name="controllerList" value="#{certifica2List}" />
		<ui:param name="checkReRender" value="listToolBarDiv, listDataDiv" />
		<ui:param name="checkboxTooltipText" value="El trabajador ya existe en la remesa." />
		<ui:param name="enterpriseLookupRequired" value="#{true}" />
		
		<ui:define name="afterToolbarContent" >
			<aon:div id="suspensionCauseForAll-div" style="float:right;">
				<aon:outputText value="#{bundle.certifica2Batch_suspension_cause}: " />
				<aon:inputText size="5"
					value="#{certifica2List.suspensionCauseForAllValue}" >
					<a4j:support event="onchange" reRender="suspensionCauseForAll-div" />
				</aon:inputText>
				<aon:commandButton id="showSuspensionCauseWindow"
					value="&#160;"
					styleClass="aon-icon-commandButton aon-lookupButton aon-margin-left" >
					<f:setPropertyActionListener
						target="#{certifica2List.showSuspensionCauseWindow}" value="#{true}" />
					<f:setPropertyActionListener
						target="#{certifica2List.rowSuspensionCauseSelected}" value="#{false}" />
				</aon:commandButton>
				<aon:inputText disabled="#{true}" size="40"
					value="#{certifica2List.suspensionCauseForAll}">
					<rich:toolTip>
						<aon:outputText value="#{certifica2List.suspensionCauseForAll}" />
					</rich:toolTip>
				</aon:inputText>
				<aon:commandButton id="apply-massiveSuspensionCause"
					disabled="#{certifica2List.checkHandler.checkedCount le 0}"
					value="#{bundle.payroll_apply_to_all}"
					styleClass="aon-icon-commandButton aon-icon-accept aon-margin-left" >
					<aon:actionListener method="#{certifica2List.onApplyAllSuspensionCause}" />
				</aon:commandButton>
			</aon:div>
		</ui:define>
		
		<ui:define name="searchContent" >
			<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/certifica2/search_content.xhtml" >
				<ui:param name="controller" value="#{certifica2List}" />
				<ui:param name="searchReRender" value="listToolBarDiv, listDataDiv" />
			</ui:include>
		</ui:define>
		
		<ui:define name="listDataColumns" >
			<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/certifica2/listColumns.xhtml" />
		</ui:define>
		
	</ui:decorate>
	
</ui:composition>
