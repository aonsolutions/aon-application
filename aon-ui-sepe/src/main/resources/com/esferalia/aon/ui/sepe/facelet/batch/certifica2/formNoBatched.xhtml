<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	
	<ui:decorate template="/com/esferalia/aon/ui/sepe/facelet/batch/formNoBatched.xhtml">
		<ui:param name="controller" value="#{certifica2Batch}" />
		<ui:param name="controllerList" value="#{certifica2List}" />
		<ui:param name="checkReRender" value="listToolBarDiv, listDataDiv" />
		
		<ui:define name="afterToolbarContent" >
				<aon:div style="float:right;width:300px;">
					<rich:inplaceSelect id="suspensionCauseApplyAll" 
						disabled="#{certifica2List.checkHandler.checkedCount le 0}" 
					 	value="#{certifica2List.suspensionCauseForAll}"
					 	listHeight="300px" listWidth="300px" 
					 	style="margin-left: 10px; border-bottom-style:none; cursor: pointer;"
						defaultLabel="#{bundle.certifica2Batch_suspension_cause_select}" >
						<f:selectItems value="#{sepeCollections.suspensionCauses}" />
					</rich:inplaceSelect>
				</aon:div>
			<aon:div style="float:right;">
				<aon:commandButton id="apply"
					disabled="#{certifica2List.checkHandler.checkedCount le 0}"
					value="#{bundle.payroll_apply_to_all}"
					styleClass="aon-icon-commandButton aon-icon-accept aon-margin-left" >
					<aon:actionListener method="#{certifica2List.onApplyAllSuspensionCause}" />
				</aon:commandButton>
			</aon:div>
		</ui:define>
		
		<ui:define name="searchContent" >
			<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/certifica2/search_content.xhtml" >
				<ui:param name="controller" value="#{certifica2List}" />
				<ui:param name="searchReRender" value="listToolBarDiv, listDataDiv" />
			</ui:include>
		</ui:define>
		
		<ui:define name="listDataColumns" >
			<ui:include src="/com/esferalia/aon/ui/sepe/facelet/batch/certifica2/listColumns.xhtml" />
		</ui:define>
		
	</ui:decorate>
	
</ui:composition>
