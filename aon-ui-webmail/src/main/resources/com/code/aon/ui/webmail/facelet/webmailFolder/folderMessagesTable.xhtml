<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"	
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	>
<body>

<ui:composition>

	<aon:div id="noFolderSelected"
		rendered="#{!webmailFolder.folderSelected and webmail.logged}">
		<aon:div styleClass="aon-content-home">
			<aon:outputText value="NO FOLDER SELECTED" />
		</aon:div>
	</aon:div>

	<aon:div id="folderSelected"
		rendered="#{webmailFolder.folderSelected and webmail.logged}">

		<aon:div id="messageGrid">

			<aon:div id="messagesDiv" layout="none">

				<aon:div styleClass="aon-box aon-box-outstanding2"
					rendered="#{webmailFolder.folder.messageCount==0}">
					<aon:outputText value="#{webmailBundle.webmail_nomessages}" />
				</aon:div>
			
				<aon:div style="width:99%" rendered="#{webmailFolder.folder.messageCount>0}">
					
					<aon:dataTable id="messageDataTable" style="border-right:#ccc 1px solid;"
						value="#{webmailFolder.model}" var="to" rows="#{webmailFolder.folder.pageSize}"
						columnClasses="aon-width-80,
								aon-width-200 aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-width-150 aon-editDataTable-textColumn,
								aon-width-60 aon-editDataTable-textColumn">
								
						<aon:rowSelector action="#{webmailFolder.getSelectedMessageAction}"
							actionListener="#{webmailFolder.changeSelectedMessage}" />							
								
						<aon:column id="folderCol">
							<f:facet name="header" >
								<aon:div>
									<aon:commandButton id="selectButton" style="margin-right:10px;"
										actionListener="#{webmailFolder.selectAllPageMessages}"
										reRender="messageGrid"
										styleClass="aon-icon-commandButton-disabled aon-icon-checkAll">
									</aon:commandButton>
					
									<aon:commandButton id="deselectButton"
										actionListener="#{webmailFolder.deselectAllPageMessages}"
										reRender="messageGrid"
										styleClass="aon-icon-commandButton-disabled aon-icon-checkNone">
									</aon:commandButton>
								</aon:div>
							</f:facet>
							<aon:selectBooleanCheckbox styleClass="aon-float-left"
								id="checkMessage" value="#{to.selected}"
								onmouseover="disableRowSelector();" onmouseout="enableRowSelector();">
							</aon:selectBooleanCheckbox>
							<aon:div styleClass="aon-float-left">
	 							<rich:dragSupport dragIndicator="messageIndicator" dragType="MESSAGE" dragValue="#{to}" />
								<aon:outputText rendered="#{!to.readed}" value="&#160;"
									styleClass="aon-icon aon-icon-mailInbox"
									style="cursor: pointer;width:16px;" />
								<aon:outputText rendered="#{to.readed and !to.answered}"
									value="&#160;" styleClass="aon-icon aon-icon-mailInbox-read"
									style="cursor: pointer;width:16px;" />
								<aon:outputText rendered="#{to.answered}" value="&#160;"
									styleClass="aon-icon aon-icon-mailInbox-answered"
									style="cursor: pointer;width:16px;" />
							</aon:div>
							<aon:div styleClass="aon-float-left">
								<aon:graphicImage
									value="#{aonResource.resolve['/images/aon-icon/aon-icon-attach-file.png']}"
									rendered="#{to.attachment}" />
							</aon:div>
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:div>
									<aon:commandLink action="folder"
										actionListener="#{webmailFolder.orderByFrom}"
										rendered="#{!webmailFolder.sentItemColumn}">
										<aon:outputText value="#{webmailBundle.webmail_from}" />
									</aon:commandLink>
									<aon:commandLink action="folder"
										actionListener="#{webmailFolder.orderByTo}"
										rendered="#{webmailFolder.sentItemColumn}">
										<aon:outputText value="#{webmailBundle.webmail_to}" />
									</aon:commandLink>
								</aon:div>
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText escape="false" title="#{to.senderEmail}"
									value="#{to.senderSummary}"
									rendered="#{!webmailFolder.sentItemColumn and to.readed}" >
									<aon:abbreviateConverter maxWidth="35" />
								</aon:outputText>
								<aon:outputText escape="false" title="#{to.senderEmail}"
									value="#{to.senderSummary}"
									rendered="#{!webmailFolder.sentItemColumn and !to.readed}"
									style="font-weight: bold" >
									<aon:abbreviateConverter maxWidth="35" />
								</aon:outputText>
								<aon:outputText escape="false" title="#{to.recipientsToEmail}"
									value="#{to.recipientsToSummary}"
									rendered="#{webmailFolder.sentItemColumn}" >
									<aon:abbreviateConverter maxWidth="35" />
								</aon:outputText>
							</aon:div>
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:commandLink action="folder"
									actionListener="#{webmailFolder.orderBySubject}">
									<aon:outputText value="#{webmailBundle.webmail_subject}" />
								</aon:commandLink>
							</f:facet>
							<aon:outputText escape="false" value="#{to.subject}"
								style="#{to.readed?'':'font-weight: bold'}" >
								<aon:abbreviateConverter maxWidth="60" />
							</aon:outputText>
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:commandLink action="folder"
									actionListener="#{webmailFolder.orderByDate}">
									<aon:outputText value="#{webmailBundle.webmail_date}" />
								</aon:commandLink>
							</f:facet>
							<aon:div style="white-space:nowrap">
								<aon:outputText value="#{to.sentDateString}"
									style="#{to.readed?'':'font-weight: bold'}" />
							</aon:div>
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:commandLink action="folder"
									actionListener="#{webmailFolder.orderBySize}">
									<aon:outputText value="#{webmailBundle.webmail_size}" />
								</aon:commandLink>
							</f:facet>
							<aon:div style="white-space:nowrap">
								<aon:outputText value="#{to.displaySize}"
									style="#{to.readed?'':'font-weight: bold'}" />
							</aon:div>
						</aon:column>						
					</aon:dataTable>

					<aon:dataScroller2 for="messageDataTable" page="#{webmailFolder.currentPage}" />
	
				</aon:div>
				
			</aon:div>

		</aon:div>
	</aon:div>

</ui:composition>

</body>
</html>
