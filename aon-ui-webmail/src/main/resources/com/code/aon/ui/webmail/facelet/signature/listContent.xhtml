<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/webmail/facelet/util/listInnerToolbar.xhtml" >
		<ui:param name="toolbarTitle" value="#{webmailBundle.webmail_signature}" />
		<ui:param name="skipSearchButton" value="#{true}" />
	</ui:include>

	<!--  aon-region-body -->
	<aon:div styleClass="aon-scroll-area">
		<c:if test="#{innerToolbar}" >
			<aon:methodParam name="rowSelectorAction" default="" />
		</c:if>				
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:define name="columns">

				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.name}" />
				</aon:column>

			</ui:define>
		</ui:decorate>

	</aon:div>

</ui:composition>
