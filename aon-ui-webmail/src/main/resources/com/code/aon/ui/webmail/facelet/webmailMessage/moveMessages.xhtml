<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGroup id="folderWindow">
		<c:if test="#{mailConfig.showFolderWindow}">
		
			<aon:methodParam name="moveMessagesAction" default="" />
			<aon:valueParam name="folderPanelTitle" default="#{bundle.webmail_move_message}" />
			<aon:valueParam name="folderModel" default="#{webmailTree.treeNode}" />
		
			<rich:modalPanel id="folderModalPanel"
				rendered="#{mailConfig.showFolderWindow}" showWhenRendered="true"
				minHeight="250" height="350" width="440" top="100" >

				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{folderPanelTitle}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close"
						immediate="true">
						<rich:componentControl for="folderModalPanel" operation="hide"
							event="onclick" />
						<f:setPropertyActionListener target="#{mailConfig.showFolderWindow}"
							value="#{false}" />							
					</aon:commandButton>
				</f:facet>
				<aon:div styleClass="modalPanel-scroll1">
					<rich:tree id="folderTree"
						nodeSelectListener="#{moveMessagesActionListener}"
						ajaxSubmitSelection="true" switchType="ajax"
						value="#{folderModel}" var="folderTreeItem" nodeFace="#{folderTreeItem.folderTypeName}">
						<ui:decorate template="/com/code/aon/ui/webmail/facelet/webmailMessage/treeNodes.xhtml" >
							<ui:define name="nodeContent">
								<aon:commandLink value="#{folderTreeItem.name}" action="#{moveMessagesAction}">
									<rich:componentControl for="folderModalPanel" operation="hide"
										event="onclick" />
									<f:setPropertyActionListener target="#{mailConfig.showFolderWindow}"
										value="#{false}" />																	
								</aon:commandLink>
							</ui:define>
						</ui:decorate>				
					</rich:tree>
				</aon:div>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
