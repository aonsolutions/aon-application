<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="innerToolbar" default="#{false}"/>

	<ui:include src="/com/code/aon/ui/webmail/facelet/util/listInnerToolbar.xhtml" >
		<ui:param name="toolbarTitle" value="#{mailConfig.mailAccountTitle}" />
		<ui:param name="skipSearchButton" value="#{true}" />
	</ui:include>

	<!--  aon-region-body -->
	<aon:div styleClass="aon-scroll-area">
		<aon:if test="#{innerToolbar}" >
			<aon:methodParam name="rowSelectorAction" default="" />
		</aon:if>	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:define name="columns">

				<aon:column alias="MailAccount.name"
					styleClass="aon-editDataTable-textColumn aon-width-80 aon-nowrap">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.name}" />
				</aon:column>

				<aon:column alias="MailAccount.displayName"
					styleClass="aon-editDataTable-textColumn aon-nowrap">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_displayName}" />
					</f:facet>
					<aon:outputText value="#{to.displayName}" />
				</aon:column>
				
				<aon:column alias="MailAccount.email"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_email}" />
					</f:facet>
					<aon:outputText value="#{to.email}" />
				</aon:column>

				<aon:column alias="MailAccount.signature.name"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_signature}" />
					</f:facet>
					<aon:outputText value="#{to.signature.name}" />
				</aon:column>
				
				<aon:if test="#{!mailConfig.skipTypeColumn}">	
					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.type}" />
					</aon:column>
				</aon:if>
				
				<aon:if test="#{domainSwitcher.betaEnabled}" >
					<aon:column  styleClass="aon-editDataTable-textColumn aon-nowrap ">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:div>
							<aon:div styleClass="aon-valign-items-middle" rendered="#{controller.getVerificationStatus(to)=='SUCCESS'}" >
								<aon:outputText styleClass="material-icons-outlined aon-color-green" value="check_circle" />
								<aon:outputText styleClass="aon-color-green aon-padding-left" value="#{bundle.webmail_mailAccount_Verified}" />
							</aon:div>
							<aon:div styleClass="aon-valign-items-middle"  rendered="#{controller.getVerificationStatus(to)=='UNKNOW' || controller.getVerificationStatus(to)=='FAILED'}">
								<aon:outputText styleClass="material-icons-outlined aon-label-error" value="cancel" />
								<aon:outputText styleClass="aon-label-error aon-padding-left" value="#{bundle.webmail_mailAccount_Unverified}" />
							</aon:div>
							<aon:div styleClass="aon-valign-items-middle"  rendered="#{controller.getVerificationStatus(to)=='PENDING' || controller.getVerificationStatus(to)=='NOT_STARTED'}">
								<aon:outputText styleClass="material-icons-outlined aon-pending" value="cancel" />
								<aon:outputText styleClass="aon-pending aon-padding-left" value="#{bundle.webmail_mailAccount_Pending}" />
							</aon:div>
							<aon:div styleClass="aon-valign-items-middle"  rendered="#{controller.isProtocolAon(to) and controller.getVerificationStatus(to) eq null }">
								<aon:outputText styleClass="material-icons-outlined aon-pending rotate-animation"  value="sync" />
								<aon:outputText styleClass="aon-pending aon-padding-left" value="" />
							</aon:div>
						</aon:div>
					</aon:column>
				</aon:if>

				<aon:if test="#{!mailConfig.skipDefaultAccountColumn}">	
					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.webmail_mailAccount_default_account}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseup="disableRowSelector();"
							onmouseout="enableRowSelector();" >
							<aon:commandLink
								rendered="#{!to.defaultAccount}" 
								actionListener="#{mailConfig.onSetDefault}" >
								<aon:outputText value="&#160;"
									styleClass="aon-icon aon-icon-check" />							
							</aon:commandLink>
							<aon:outputText value="&#160;" rendered="#{to.defaultAccount}"
								styleClass="aon-icon aon-icon-checked" />					
						</aon:div>
					</aon:column>
				</aon:if>

			</ui:define>
				
		</ui:decorate>

		<a4j:jsFunction 
			id="updateEmailIdentities" 
			name="updateEmailIdentities" 
			reRender="#{controller.beanName}Data" 
			action="#{controller.updateEmailIdentities}" 
			>
		</a4j:jsFunction>
		<script type="text/javascript">
		//<![CDATA[
			updateEmailIdentities();
		//]]>
		</script>
	</aon:div>

</ui:composition>
