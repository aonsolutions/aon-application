<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition>

	<aon:panelGroup id="showNewMessageWindow">
		<c:if test="#{webmailMessage.showNewMessageWindow}">
			<rich:modalPanel id="showNewMessageModalPanel"
				rendered="#{webmailMessage.showNewMessageWindow}" showWhenRendered="true"
				minHeight="540" height="590" width="680" >
				
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{webmailBundle.webmail_newmail}" />
					</aon:div>
				</f:facet>
				
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							immediate="true" reRender="showNewMessageWindow">
							<f:setPropertyActionListener target="#{webmailMessage.showNewMessageWindow}"
								value="#{false}" />
							<rich:componentControl for="showNewMessageWindow" operation="hide"
								event="onclick" />
						</aon:commandButton>
					</aon:form>
				</f:facet>				

				<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewContent.xhtml" >
					<aon:valueParam name="inputTextSize" default="70" />
					<aon:valueParam name="skipSaveDraftButton" default="true" />				
					<aon:valueParam name="skipSendCancelButton" default="true" />
					<aon:valueParam name="sendButtonReRender" default="showNewMessageWindow" />
					<aon:valueParam name="contentHeight" default="250" />
					<aon:valueParam name="innerToolbar" default="true" />
				</ui:include>

			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
	
</ui:composition>

</body>
</html>
