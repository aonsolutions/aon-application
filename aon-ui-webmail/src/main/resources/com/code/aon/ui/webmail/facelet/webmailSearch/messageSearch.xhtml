<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="webmailForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.webmail_main}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton
						title="#{bundle.aon_back}"
						action="home"
						actionListener="#{webmailSearch.onExit}"
						value="#{bundle.aon_back}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			
			<!-- fin de barra de menu y titulo -->		
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
		
				<ui:define name="searchContent">	
					<ui:param name="searchReRender" value="webmailSearchResult" />			
					<aon:methodParam name="searchActionListener" value="#{webmailSearch.searchMessagesCurrentFolder}" type="actionListener" />
					<aon:methodParam name="searchAction" />
			
					<aon:outputText value="" />
			        <aon:div styleClass="aon-italic" style="padding-bottom:0.5em;">
			        	<aon:outputFormat value="#{bundle.webmail_search_message}" escape="false">
			        		<f:param value="#{webmailFolder.folder.name}" />
			        	</aon:outputFormat>
			        </aon:div>
		           
					<aon:outputLabel for="SearchMail_from" 
						value="#{bundle.aon_of}: " />
					<aon:inputText id="SearchMail_from"
						size="80"
						value="#{webmailSearch.address_from}"/>
	
					<aon:outputLabel for="SearchMail_to" 
						value="#{bundle.webmail_to}: " />
					<aon:inputText id="SearchMail_to"
						size="80"
						value="#{webmailSearch.address_cc}"/>
	
					<aon:outputLabel for="SearchMail_subject" 
						value="#{bundle.aon_subject}: " />
					<aon:inputText id="SearchMail_subject"
						size="80"
						value="#{webmailSearch.subject}"/>
	
					<aon:outputLabel for="SearchMail_bodyText" 
						value="#{bundle.aon_content}: " />
					<aon:inputText id="SearchMail_bodyText"
						size="80"
						value="#{webmailSearch.bodyText}"/>						
	        	
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area" id="webmailSearchResult">	
				<aon:div rendered="#{webmailSearch.showResults}">
					<aon:div rendered="#{!webmailSearch.messagesFound}" styleClass="aon-box aon-box-outstanding2">
						<aon:div styleClass="aon-icon aon-icon-info" style="padding-top:2px;padding-bottom:2px;font-weight:bold;">
							<aon:outputText value="#{bundle.webmail_search_none}"/>
						</aon:div>
					</aon:div>
					<aon:div rendered="#{webmailSearch.messagesFound}">
					
						<aon:methodParam name="rowSelectorAction" value="message" />
						<aon:methodParam name="rowSelectorActionListener" value="#{webmailSearch.changeSelectedMessage}" type="actionListener" />				
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{webmailSearch}" />
							<ui:define name="columns">
																			
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-250"
									sortBy="#{to.sender}" sortOrder="#{webmailSearch.sortOrders[0]}">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_of}"/>
									</f:facet>
									<aon:outputText title="#{to.senderEmail}"
										value="#{to.senderSummary}" />
								</aon:column>
								
								<aon:column styleClass="aon-editDataTable-textColumn"
									sortBy="#{to.subject}" sortOrder="#{webmailSearch.sortOrders[1]}">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_subject}"/>
									</f:facet>
									<aon:outputText value="#{to.subject}" />
								</aon:column>
										  
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-100"
									sortBy="#{to.sentDate}" sortOrder="#{webmailSearch.sortOrders[2]}">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_date}"/>
									</f:facet>
									<aon:outputText value="#{to.sentDateString}"
										title="#{to.sentDateFullString}" />								
								</aon:column>		  
							</ui:define>
						</ui:decorate>
					</aon:div>
				</aon:div>		
			</aon:div>		    
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
