<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		
		<aon:methodParam name="sendActionListener" default="#{webmailMessage.onSend}" type="actionListener" />
		<aon:methodParam name="sendAction" default="#{webmailMessage.getReturnAction}" />
		<aon:methodParam name="saveDraftActionListener" default="#{webmailMessage.onSaveDraft}" type="actionListener" />
		<aon:methodParam name="saveDraftAction" default="" />
		<aon:methodParam name="sendCancelActionListener" default="#{webmailMessage.onCancelSend}" type="actionListener" />
		<aon:methodParam name="sendCancelAction" default="#{webmailMessage.getReturnAction}" />
		<aon:valueParam name="inputTextSize" default="120" />
		<aon:valueParam name="contentHeight" default="400" />		
		<aon:if test="#{!innerToolbar}">
			<ui:param name="toolbarTitle" value="#{bundle.webmail_main}" />
			<ui:param name="toolbarDescription" value="#{bundle.webmail_newmail}" />
		</aon:if>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:define name="toolbarContent">
				<aon:if test="#{!skipSendButton}">
					<aon:commandButton id="send#{messageSuffix}"
						value="#{bundle.webmail_send}"
						styleClass="aon-icon-accept aon-finding-toolbar-item"
						action="#{sendAction}" actionListener="#{sendActionListener}"
						reRender="#{sendButtonReRender}"
						onclick="Richfaces.showModalPanel('emailWaitProccess#{messageSuffix}')" 
		     			oncomplete="Richfaces.hideModalPanel('emailWaitProccess#{messageSuffix}')" />
				</aon:if>
				<aon:if test="#{!skipSaveDraftButton}">
					<aon:commandButton id="save_draft#{messageSuffix}" 
						value="#{bundle.webmail_save_draft}"
						styleClass="aon-icon aon-icon-mail-save aon-finding-toolbar-item"
						action="#{saveDraftAction}" actionListener="#{saveDraftActionListener}"
						reRender="#{saveDraftButtonReRender}" />
				</aon:if>
				<aon:if test="#{!skipSendCancelButton}">				
		     		<aon:confirmButton id="sendCancel#{messageSuffix}" immediate="true"
						title="#{bundle.aon_back}" value="#{bundle.aon_back}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.webmail_back_confirm}"
						confirmActionListener="#{sendCancelActionListener}"
						confirmAction="#{sendCancelAction}"
						accesskey="#{bundle.aon_key_cancel}"
						confirmReRender="#{sendCancelButtonReRender}"
						styleClass="aon-icon-cancel aon-finding-toolbar-item" >
					</aon:confirmButton>
				</aon:if>	
			</ui:define>
		</ui:decorate>

		<aon:div styleClass="aon-scroll-area">
	
			<aon:div id="newMessageHeader#{messageSuffix}">
				<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%;"
				columnClasses="aon-panelGrid-odd aon-width-130 aon-text-right,aon-panelGrid-even">

					<aon:div rendered="#{mailConfig.mailAccountCount &gt; 1}">
						<aon:outputLabel for="NewMail_From#{messageSuffix}" 
							value="#{bundle.aon_of}" />
					</aon:div>							
					<aon:selectOneMenu id="NewMail_From#{messageSuffix}"
						reRender="messageContent#{messageSuffix},NewMail_optionsGrid#{messageSuffix}, NewMail_GenericTemplate#{messageSuffix}"
						rendered="#{mailConfig.mailAccountCount &gt; 1}"
						converter="#{mailConfig.mailAccountConverter}"
						valueChangeListener="#{webmailMessage.onMailAccountChanged}"
						value="#{webmailMessage.senderMailAccount}">
						<f:selectItems value="#{mailConfig.mailAccounts}" />
					</aon:selectOneMenu>

					<aon:div rendered="#{webmailMessage.showTemplates and (marketingTemplate.templateCount &gt; 0)}">
						<aon:outputLabel for="NewMail_Template#{messageSuffix}" 
							value="#{bundle.marketing_mail_template}" />
					</aon:div>							
					<aon:selectOneMenu id="NewMail_Template#{messageSuffix}"
						reRender="messageContent#{messageSuffix}"
						rendered="#{webmailMessage.genericMessage and webmailMessage.showTemplates and (marketingTemplate.templateCount &gt; 0)}"
						valueChangeListener="#{webmailMessage.onTemplateChanged}"
						value="#{webmailMessage.template}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{marketingTemplate.templates}" />
					</aon:selectOneMenu>
					
					<aon:selectOneMenu id="NewMail_GenericTemplate#{messageSuffix}"
						reRender="messageContent#{messageSuffix}"
						rendered="#{!webmailMessage.genericMessage and webmailMessage.showTemplates and (marketingTemplate.templateCount &gt; 0)}"
						valueChangeListener="#{webmailMessage.onTemplateChanged}"
						value="#{webmailMessage.template}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{webmailMessage.templates}" />
					</aon:selectOneMenu>
					
					<aon:if test="#{!skipRecipients}" >
						<aon:if test="#{!skipToEmail}" >
							<aon:div styleClass="aon-text-right">							
								<aon:commandButton id="addToEmail#{messageSuffix}"
									reRender="showEmailWindow#{messageSuffix}" disabled="#{disableContacts}"
									actionListener="#{webmailMessage.openEmailsToPanelPopup}"
									styleClass="new-mail-button"
									value="#{bundle.webmail_to}"/>							
							</aon:div>
							<aon:div>
								<aon:inputText id="NewMail_to#{messageSuffix}"
									size="#{inputTextSize}"
									value="#{webmailMessage.recipientsTo}"/>
								<aon:if test="#{!disableContacts}" >
									<ui:include src="/com/code/aon/ui/webmail/facelet/util/suggestEmail.xhtml">
										<ui:param name="inputId" value="NewMail_to#{messageSuffix}" />
									</ui:include>	
								</aon:if>							
							</aon:div>
						</aon:if>
	
						<aon:div styleClass="aon-text-right">						
							<aon:commandButton id="addCcEmail#{messageSuffix}"
								reRender="showEmailWindow#{messageSuffix}" disabled="#{disableContacts}"
								actionListener="#{webmailMessage.openEmailsCcPanelPopup}"
								styleClass="new-mail-button"
								value="#{bundle.webmail_cc}" />							
						</aon:div>
						<aon:div>
							<aon:inputText id="NewMail_cc#{messageSuffix}"
							size="#{inputTextSize}"
							value="#{webmailMessage.recipientsCc}"/>
							<aon:if test="#{!disableContacts}" >								
								<ui:include src="/com/code/aon/ui/webmail/facelet/util/suggestEmail.xhtml">
									<ui:param name="inputId" value="NewMail_cc#{messageSuffix}" />
								</ui:include>
							</aon:if>								
						</aon:div>
						
						<aon:div styleClass="aon-text-right">							
							<aon:commandButton id="addBccEmail#{messageSuffix}"
								reRender="showEmailWindow#{messageSuffix}" disabled="#{disableContacts}"
								actionListener="#{webmailMessage.openEmailsBccPanelPopup}" 
								styleClass="new-mail-button"
								value="#{bundle.webmail_bcc}" />							
						</aon:div>
						<aon:div>
							<aon:inputText id="NewMail_Bcc#{messageSuffix}"
								size="#{inputTextSize}"
								value="#{webmailMessage.recipientsBcc}"/>
							<aon:if test="#{!disableContacts}" >
								<ui:include src="/com/code/aon/ui/webmail/facelet/util/suggestEmail.xhtml">
									<ui:param name="inputId" value="NewMail_Bcc#{messageSuffix}" />
								</ui:include>
							</aon:if>								
						</aon:div>
					</aon:if>
					
					<aon:div>
						<aon:outputLabel for="NewMail_Subject#{messageSuffix}" 
						value="#{bundle.aon_subject}" />
					</aon:div>										
					<aon:inputText id="NewMail_Subject#{messageSuffix}"
						size="#{inputTextSize}"
						value="#{webmailMessage.subject}"/>			

					<aon:if test="#{!skipAttachments}" >
						<aon:outputLabel for="attach_file#{messageSuffix}" 
							value="#{bundle.webmail_attach_file}" />
						<aon:div>
							<aon:fileUpload id="attach_file#{messageSuffix}"
								fileUploadListener="#{webmailMessage.fileUploaded}"
								maxFilesQuantity="20">
								<f:facet name="label">
									<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>								
								<a4j:support event="onuploadcomplete" reRender="attachDataTable#{messageSuffix}" />
								<a4j:support event="onupload" oncomplete="showFileUploadProgress();" />
								<a4j:support event="onclear" oncomplete="hideFileUploadProgress();" />
							</aon:fileUpload>			
							<rich:jQuery name="showFileUploadProgress" timing="onJScall"
								selector="#attach_file#{messageSuffix} .rich-fileupload-list-overflow" query="height(70);" />
							<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
								selector="#attach_file#{messageSuffix} .rich-fileupload-list-overflow" query="height(0);" />
							<aon:div id="attachDataTable#{messageSuffix}">
								<aon:dataTable value="#{webmailMessage.files}" rowKeyVar="row"
									var="attachment" styleClass="aon-panelGrid-formatting">
									<aon:column>
										<aon:outputText value="#{attachment.fileName} (#{attachment.sizeToDisplay})" styleClass="aon-bold" />
										<aon:commandLink
											reRender="attachDataTable#{messageSuffix}" 
											value="#{bundle.aon_remove}"
											style="font-size:0.9em;margin-left:20px;"
											styleClass="aon-icon-commandButton aon-icon-delete">
								            <a4j:actionparam name="selected"
								            	value="#{row}" assignTo="#{webmailMessage.attachRemoveIndex}"
								            	actionListener="#{webmailMessage.onRemoveAttachment}" />											
										</aon:commandLink>
									</aon:column>
								</aon:dataTable>						
							</aon:div>
						</aon:div>		
					</aon:if>

				</aon:panelGrid>
				<aon:panelGrid id="NewMail_optionsGrid#{messageSuffix}"
					columns="2" cellpadding="0" cellspacing="0" style="width:100%;"
					columnClasses="aon-panelGrid-odd aon-width-130 aon-noborder-top,aon-panelGrid-even aon-noborder-top">

					<aon:outputText value=""
						rendered="#{webmailMessage.showAppendSignature or webmailMessage.showSaveSent}" />
					<aon:div id="NewMail_optionDiv#{messageSuffix}"
						rendered="#{webmailMessage.showAppendSignature or webmailMessage.showSaveSent}">
						<aon:outputLabel for="NewMail_saveSent#{messageSuffix}"
							rendered="#{webmailMessage.showSaveSent}"
							value="#{bundle.webmail_save_sent}" />
						<aon:selectBooleanCheckbox
							id="NewMail_saveSent#{messageSuffix}"
							rendered="#{webmailMessage.showSaveSent}"
							value="#{webmailMessage.saveSent}" />
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:outputLabel for="NewMail_appendSignature#{messageSuffix}"
								rendered="#{webmailMessage.showAppendSignature}"
								value="#{bundle.webmail_signature_include}" />
							<aon:selectBooleanCheckbox
								id="NewMail_appendSignature#{messageSuffix}"
								value="#{webmailMessage.appendSignature}"
								rendered="#{webmailMessage.showAppendSignature}">
								<a4j:support event="onchange" ajaxSingle="true"
									actionListener="#{webmailMessage.onAppendSignatureChanged}"
									reRender="messageContent#{messageSuffix}" />
							</aon:selectBooleanCheckbox>
						</aon:div>								
					</aon:div>

				</aon:panelGrid>

			</aon:div>			
			
			<!-- Message Body -->
			<aon:div id="messageContent#{messageSuffix}" styleClass="padding-top">
				<aon:inputRichText
					value="#{webmailMessage.content}" 
					height="#{contentHeight}" configuration="tinyMCE" />	
			</aon:div>
		</aon:div>

	</aon:form>

	<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/waitProcess.xhtml" />	

	<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/showEmails.xhtml" />
		
</ui:composition>
