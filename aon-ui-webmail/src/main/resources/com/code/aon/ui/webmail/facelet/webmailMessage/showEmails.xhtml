<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGroup id="showEmailWindow#{messageSuffix}">
		<aon:if test="#{webmailMessage.showEmailsWindow}">
			<rich:modalPanel id="showEmailsModalPanel#{messageSuffix}"
				rendered="#{webmailMessage.showEmailsWindow}" showWhenRendered="true"
				minHeight="390" height="390" width="650" top="50" zindex="2000">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText
							rendered="#{webmailMessage.selectedDestinyContainer=='To'}"
							value="#{bundle.webmail_to}" />
						<aon:outputText
							rendered="#{webmailMessage.selectedDestinyContainer=='Cc'}"
							value="#{bundle.webmail_cc}" />
						<aon:outputText
							rendered="#{webmailMessage.selectedDestinyContainer=='Bcc'}"
							value="#{bundle.webmail_bcc}" />
						<aon:outputText value="-" />
						<aon:outputText
							value="#{bundle.webmail_message_selectEmail}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							immediate="true" reRender="showEmailWindow#{messageSuffix},newMessageHeader#{messageSuffix}">
							<f:setPropertyActionListener target="#{webmailMessage.showEmailsWindow}"
								value="#{false}" />
							<rich:componentControl for="showEmailsModalPanel#{messageSuffix}" operation="hide"
								event="onclick" />
						</aon:commandButton>
					</aon:form>
				</f:facet>

				<aon:form>
					<aon:div styleClass="aon-toolbar">
						<aon:commandButton id="selectEmail#{messageSuffix}"
							actionListener="#{webmailMessage.onAcceptAllEmailItems}"
							value="#{bundle.aon_key_accept_description}"
							reRender="showEmailWindow#{messageSuffix},newMessageHeader#{messageSuffix}"
							styleClass="aon-icon-commandButton aon-icon-accept">
							<f:setPropertyActionListener target="#{webmailMessage.showEmailsWindow}"
								value="#{false}" />
							<rich:componentControl for="showEmailsModalPanel#{messageSuffix}" operation="hide"
								event="onclick" />
						</aon:commandButton>
					</aon:div>
					<aon:div>
					
						<aon:methodParam name="rowSelectorAction" value="" />
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{multiSelectionEmailBean}" />
							<ui:param name="rowSelectorReRender" value="messageSelected#{messageSuffix}" />
							<ui:param name="skipSelectButton" value="true" />
							<ui:define name="columns">
	
								<aon:column styleClass="aon-editDataTable-iconColumn aon-width-50">
									<f:facet name="header">
										<aon:div>
											<aon:commandButton id="selectButton#{messageSuffix}" style="margin-right:10px;"
												actionListener="#{multiSelectionEmailBean.onSelectAllPageContacts}"
												reRender="messageSelected#{messageSuffix}" ajaxSingle="true"
												styleClass="aon-icon-commandButton-disabled aon-icon-checkAll">
											</aon:commandButton>
							
											<aon:commandButton id="deselectButton#{messageSuffix}"
												actionListener="#{multiSelectionEmailBean.onDeselectAllPageContacts}"
												reRender="messageSelected#{messageSuffix}" ajaxSingle="true"
												styleClass="aon-icon-commandButton-disabled aon-icon-checkNone">
											</aon:commandButton>
										</aon:div>
									</f:facet>
									<aon:selectBooleanCheckbox id="messageSelected#{messageSuffix}"
										styleClass="aon-float-left" value="#{to.readOnlySelected}">
									</aon:selectBooleanCheckbox>
								</aon:column>
								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_displayName}" />
									</f:facet>
									<aon:outputText value="#{to.email.displayName}"
										styleClass="aon-list-icon #{to.email.contactGroup?'aon-icon-contactGroup':'aon-icon-contact'}" />
								</aon:column>
								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_email_abrv}" />
									</f:facet>
									<aon:outputText value="#{to.email.emails}" />
								</aon:column>
							</ui:define>
						</ui:decorate>	
					</aon:div>
				</aon:form>					
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>
	
</ui:composition>
