<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="innerToolbar" default="#{false}"/>

	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
		<aon:if test="#{innerToolbar}" >
			<ui:param name="skipToolbarTitle" value="true" />
			<ui:param name="skipToolbarDescription" value="true" />
			
			<aon:methodParam name="searchAction" value="" />
			<ui:param name="searchButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="resetAction" value="" />
			<ui:param name="resetButtonReRender" value="#{controller.beanName}Div" />
		</aon:if>	
	</ui:include>
			
</ui:composition>
