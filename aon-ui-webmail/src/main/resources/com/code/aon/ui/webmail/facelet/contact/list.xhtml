<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contactList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{webmailBundle.webmail_contacts}" />
				<ui:param name="controller" value="#{contact}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="contactDataList" value="#{contact.model}"
					var="to" rows="20" rendered="#{contact.model.rowCount > 0}">

					<aon:rowSelector action="contact_form" actionListener="#{contact.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_displayName}" />
						</f:facet>
						<aon:outputText value="#{to.displayName}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_email}" />
						</f:facet>
						<aon:outputText value="#{to.email}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_organization}" />
						</f:facet>
						<aon:outputText value="#{to.organization}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_phone}" />
						</f:facet>
						<aon:outputText value="#{to.phone}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_cellular_phone}" />
						</f:facet>
						<aon:outputText value="#{to.cellularPhone}"/>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="contactDataList" showNote="true" />

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
