<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>

		<aon:menuBar id="mainMenu">

			<aon:commandLink id="offers"
				value="#{commercialBundle.commercial_offers_module}"
				action="offer_search" actionListener="#{offer.onEditSearch}"
				styleClass="aon-top-menu-item" />
			<aon:commandLink id="target" action="target_search"
				actionListener="#{target.onEditSearch}"
				styleClass="aon-top-menu-item"
				value="#{commercialBundle.commercial_target_module}" />
			<aon:dropDownMenu value="#{productBundle.product_module}"
				styleClass="aon-top-menu-item">
				<aon:menuItem id="item" action="item_search"
					actionListener="#{item.onEditSearch}"
					value="#{productBundle.product_module}" />
				<aon:menuSeparator />
				<aon:menuItem id="catalogue" action="catalogue_search"
					actionListener="#{catalogue.onEditSearch}"
					value="#{productBundle.product_catalogue_module}" />
				<aon:menuSeparator />
				<aon:menuItem id="productCategory" action="productCategory"
					value="#{productBundle.product_category_module}">
					<aon:actionListener method="#{productCategory.onEditSearch}" />
					<aon:actionListener method="#{productCategory.onSearch}" />
				</aon:menuItem>
				<aon:menuSeparator />
				<aon:menuItem id="productCategoryGroup" action="productCategoryGroup"
					value="#{productBundle.product_categoryGroup_module}">
					<aon:actionListener method="#{productCategoryGroup.onEditSearch}" />
					<aon:actionListener method="#{productCategoryGroup.onSearch}" />
				</aon:menuItem>
				<aon:menuSeparator />
				<aon:menuItem id="brand" action="brand"
					value="#{productBundle.product_brand_module}" />
				<aon:menuSeparator />
				<aon:menuItem id="tariff" action="tariff_list"
					actionListener="#{tariff.onSearch}"
					value="#{productBundle.product_tariff_module}" />

			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.menu_edesign}"
				styleClass="aon-top-menu-item">
				<aon:menuItem id="company" action="company"
					actionListener="#{company.onLoad}"
					value="#{companyBundle.company_data_module}" />
				<aon:menuSeparator rendered="#{ecconfig.ecParam}" />
				<aon:menuItem id="paymethod" value="formas de pago"
					rendered="#{ecconfig.ecParam}" action="pmethod_list"
					immediate="true">
					<aon:actionListener method="#{pmethod.onEditSearch}" />
					<aon:actionListener method="#{pmethod.onSearch}" />

				</aon:menuItem>
				<aon:menuSeparator rendered="#{ecconfig.ecParam}" />
				<aon:menuItem id="series" value="series" action="series"
					rendered="#{ecconfig.ecParam}" immediate="true" />
				<aon:menuSeparator />
				<aon:menuItem id="EC-CONFIG"
					value="#{appBundle.menu_efunctionality}" immediate="true"
					action="ecconfig_form">
					<aon:actionListener method="#{ecconfig.onEditSearch}" />
					<aon:actionListener method="#{ecconfig.onSearch}" />
					<aon:actionListener method="#{ecconfig.onSelectFirst}" />
					<aon:actionListener method="#{eccatalogue.onEditSearch}" />
					<aon:actionListener method="#{eccatalogue.onSearch}" />
					<!-- <aon:actionListener method="#{ecconfig.setPayMethodTab}" /> -->
				</aon:menuItem>
			</aon:dropDownMenu>


			<aon:outputLink target="_blank"
				styleClass="aon-finding-toolbar-item aon-icon-advanced-search"
				value="#{ecconfig.url}">
				<f:verbatim>SHOW ECOMMERCE</f:verbatim>
			</aon:outputLink>

		</aon:menuBar>
	</aon:form>

</ui:composition>
