<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="stockList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_stock_module}" />
				<ui:param name="controller" value="#{stock}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="showMoreMenu" value="true" />
				
				<ui:define name="moreMenuContent">
					<aon:menuItem id="removeStock0"
						value="#{bundle.warehouse_remove_stock0}" immediate="#{true}"
						iconClass="aon-icon-delete"
						actionListener="#{stock.onRemoveStock0}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />	

					<aon:menuItem id="removeNoInventoriables2"
						value="#{bundle.warehouse_remove_no_inventoriable}" 
						iconClass="aon-icon-delete"
						actionListener="#{stock.onRemoveNoInventoriables}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
									
					<aon:menuItem id="removeDiscontinued2"
						value="#{bundle.warehouse_remove_discontinued}"
						iconClass="aon-icon-delete"
						actionListener="#{stock.onRemoveDiscontinued}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
 				</ui:define>
				<ui:define name="beforeSpinToolbarContent">	
					<aon:htmlCommandLink id="stockWarehouseList-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="stockList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="stockWarehouseList-report"
						value="#{bundle.aon_report}"
						action="#{report.onExecute}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="stockList" />
					</aon:htmlCommandLink>
					
					<ui:include
							src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
					<aon:commandLink id="stock-export" value="Exportar"
							onclick="stockx('#{stockExport.warehouse.id}','#{stockExport.quantity}','#{stockExport.code}','#{stockExport.name}','#{stockExport.barcode}','#{stockExport.provider}','#{stockExport.brand.id}','#{stockExport.category.id}','#{stockExport.statusesStr}','#{stockExport.typesStr}','#{stockExport.tagsStr}')"
							styleClass="aon-finding-toolbar-item aon-icon-export-excel-trans">
					</aon:commandLink>
					
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{stock}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
						
					<ui:define name="columns">

						<aon:column alias="Stock.warehouse.id"
							styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_warehouse}" />
							</f:facet>
							<aon:outputText value="#{to.warehouse.name}" />
						</aon:column>

						<aon:column alias="Stock.item.product.code"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.item.product.code}" />
						</aon:column>
	
						<aon:column alias="Stock.item.product.name,Stock.item.detail"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_product}" />
							</f:facet>
							<aon:outputText value="#{to.item.fullName}" />
						</aon:column>
	
						<aon:column alias="Stock.quantity"
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:panelGroup>
									<aon:outputText value="#{bundle.aon_quantity}" />
								</aon:panelGroup>
							</f:facet>
							<aon:outputText value="#{to.quantity}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
