<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />
	
	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="WarehouseTransfer_issueTime-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="WarehouseTransfer_issueTime-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="WarehouseTransfer_issueTime-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="WarehouseTransfer_issueTime-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputLabel for="WarehouseTransfer_sourceWarehouse_id" value="#{bundle.aon_source}" />
	<aon:selectOneMenu id="WarehouseTransfer_sourceWarehouse_id"
		value="#{warehouseTransferSearch.sourceWarehouse}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{warehouseCollections.warehouses}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="WarehouseTransfer_targetWarehouse_id" value="#{bundle.warehouse_stock_target}" />
	<aon:selectOneMenu id="WarehouseTransfer_targetWarehouse_id"
		value="#{warehouseTransferSearch.targetWarehouse}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{warehouseCollections.warehouses}" />
	</aon:selectOneMenu>

	<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
		<ui:param name="lookupBean" value="#{allItemLookup}" />
		<ui:param name="lookupTo" value="#{warehouseTransferSearch.item}" />
		<ui:param name="skipNewButton" value="#{true}" />
		<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
	</ui:include>

	<aon:outputLabel for="WarehouseTransfer_details_quantity"
		value="#{bundle.aon_quantity}" />
	<aon:inputText id="WarehouseTransfer_details_quantity"
		valueChangeListener="#{controller.addExpression}" size="10" />

</ui:composition>
