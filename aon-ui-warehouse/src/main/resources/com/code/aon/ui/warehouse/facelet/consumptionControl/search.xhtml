<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="stockReportSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{(consumptionControl.errorControl)?
					bundle.warehouse_count_error_control:bundle.warehouse_consumption_control}" />
				<ui:param name="controller" value="#{consumptionControl}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{consumptionControl}" />
				<ui:param name="skipSearchButton" value="#{true}" />

				<ui:define name="searchContent">
					<aon:outputLabel for="Stock_warehouse_id"
						value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="Stock_warehouse_id"
						reRender="Stock_beforeInventory,Stock_afterInventory,reportButtons"
						actionListener="#{controller.onWarehouseChanged}"
						value="#{controller.warehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{controller.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Stock_afterInventory"
						value="#{bundle.warehouse_inventory_final}" />
					<aon:selectOneMenu id="Stock_afterInventory"
						disabled="#{consumptionControl.errorControl}"
						reRender="Stock_beforeInventory,reportButtons"
						actionListener="#{controller.onInventoryAfterChanged}"
						value="#{controller.inventoryAfter}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{controller.afterInventories}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Stock_beforeInventory"
						value="#{bundle.warehouse_inventory_initial}" />
					<aon:selectOneMenu id="Stock_beforeInventory"
						disabled="#{consumptionControl.errorControl}"
						reRender="Stock_afterInventory,reportButtons"
						actionListener="#{controller.onInventoryBeforeChanged}"
						value="#{controller.inventoryBefore}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{controller.beforeInventories}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ConsumptionDetail"
						value="Detallado" />
					<aon:selectBooleanCheckbox id="ConsumptionDetail"
						reRender="reportButtons"
						actionListener="#{controller.onDetailChanged}"
						value="#{controller.detail}">
					</aon:selectBooleanCheckbox>

					<aon:outputText value="" />
					<aon:div id="reportButtons">
				
						<aon:div styleClass="aon-search-lookup-button" style="display: inline-block;">
								<aon:htmlCommandLink id="SearchButton-pdf" 
									disabled="#{(controller.inventoryBefore==null) or (controller.inventoryAfter==null)}"
									value="#{bundle.aon_listing}"
									action="#{report.onExecute}"
									target="_blank"
									accesskey="#{bundle.aon_key_search}"
									styleClass="aon-icon-commandButton aon-icon-pdf">
									<f:param name="reportKey" value="consumptionControl" />
									<f:param name="outputFormat" value="PDF" />
									<f:setPropertyActionListener
										target="#{controller.printHeader}" value="#{true}" />									
								</aon:htmlCommandLink>
						</aon:div>
						<ui:include
							src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
						<aon:div styleClass="aon-search-lookup-button" style="display: inline-block;margin-left:-2em;">
								<aon:commandLink id="SearchButton-excel" 
									disabled="#{(controller.inventoryBefore==null) or (controller.inventoryAfter==null)}"
									value="#{bundle.aon_listing}"
									onclick="consumptionx(#{controller.warehouse.id},#{controller.inventoryBefore.inventoryDate.time}, #{controller.inventoryAfter.inventoryDate.time},#{controller.inventoryBefore.id},#{controller.inventoryAfter.id},#{consumptionControl.errorControl?'1':'0'},#{controller.detail})"
									accesskey="#{bundle.aon_key_search}"
									styleClass="aon-icon-commandButton aon-icon-excel">								
								</aon:commandLink>
						</aon:div>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
	
</ui:composition>
