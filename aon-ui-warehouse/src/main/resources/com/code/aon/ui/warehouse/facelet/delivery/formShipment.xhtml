<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2" 
		columnClasses="aon-noborder aon-vertical-align-top, aon-noborder aon-padding-left aon-vertical-align-top">
	
		<aon:panelGrid columns="4" style="width:600px;">
				
			<c:if test="#{carrierCollections.carriersCount>0}">
				<aon:outputLabel for="Delivery_carrier"
					value="#{bundle.warehouse_delivery_carrier}" />
				<aon:selectOneMenu id="Delivery_carrier" 
					value="#{delivery.to.carrier}">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{carrierCollections.carriers}" />
				</aon:selectOneMenu>
					
				<aon:outputText value="&#160;" />
				<aon:outputText value="&#160;" />
			</c:if>
				
			<aon:outputLabel for="Delivery_numberPlate"
				value="#{bundle.tas_publicCode}" />
			<aon:inputText id="Delivery_numberPlate" 
				value="#{delivery.to.numberPlate}" />
				
			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />
				
			<aon:outputLabel for="Delivery_driver"
				value="#{bundle.warehouse_delivery_shipment_driver}" />
			<aon:inputText id="Delivery_driver" 
				value="#{delivery.to.driver}" />
				
			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />
			
			<aon:outputLabel for="Delivery_driverDocument"
				value="#{bundle.aon_document}" />
			<aon:inputText id="Delivery_driverDocument" 
				value="#{delivery.to.driverDocument}" />
				
			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />
			
			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />
			
			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />
			
			<aon:outputLabel for="Delivery_trackingNumber"
				value="#{bundle.warehouse_delivery_shipment_trackingNumber}" />
			<aon:inputText id="Delivery_trackingNumber"  
				value="#{delivery.to.trackingNumber}" />
				
			<aon:outputLabel for="Delivery_shippingContact"
				value="#{bundle.purchase_shipping_contact}" />
			<aon:inputText id="Delivery_shippingContact"  
				value="#{delivery.to.shippingContact}" />
				
			<aon:outputLabel for="Delivery_shippingStatus"
				value="#{bundle.aon_status}" />
			<aon:selectOneMenu id="Delivery_shippingStatus" 
				value="#{delivery.to.shippingStatus}">
				<f:selectItem itemLabel=" - " itemValue="#{null}" />
				<f:selectItems value="#{carrierCollections.shipmentStatuses}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="Delivery_shippingPeriod"
				value="#{bundle.aon_calendar_schedule}" />
			<aon:selectOneMenu id="Delivery_shippingPeriod" 
				value="#{delivery.to.shippingPeriod}">
				<f:selectItem itemLabel=" - " itemValue="#{null}" />
				<f:selectItems value="#{carrierCollections.shipmentPeriods}" />
			</aon:selectOneMenu>
				
			<aon:outputLabel for="Delivery_modificationDate"
				value="#{bundle.warehouse_delivery_shipment_deliveryDate}" />
			<aon:selectInputDate id="Delivery_modificationDate"
				direction="auto"
				value="#{delivery.to.statusModificationDate}" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"/>
				
			<aon:outputLabel for="Delivery_totalPackages"
				value="#{bundle.warehouse_delivery_shipment_totalPackages}" />
			<aon:inputText id="Delivery_totalPackages"  
				value="#{delivery.to.totalPackages}" />
				
			<aon:outputLabel for="Delivery_modificationTime"
				value="#{bundle.warehouse_delivery_shipment_deliveryTime}" />
			<aon:div id="Delivery_modificationTime">
				<aon:selectOneMenu id="Delivery_modificationTime-hour" value="#{delivery.to.statusModificationHour}">
					<f:selectItem itemValue="#{null}" itemLabel=" - " />
					<f:selectItems value="#{delivery.hours}" />
				</aon:selectOneMenu>
				<aon:outputText value=" : " />
				<aon:selectOneMenu id="Delivery_modificationTime-minute" value="#{delivery.to.statusModificationMinute}">
					<f:selectItem itemValue="#{null}" itemLabel=" - " />
					<f:selectItems value="#{delivery.minutes}" />
				</aon:selectOneMenu>
			</aon:div>
				
			<aon:outputLabel for="Delivery_totalWeight"
				value="#{bundle.warehouse_delivery_shipment_totalWeight}" />
			<aon:inputText id="Delivery_totalWeight"  
				value="#{delivery.to.totalWeight}" />
			
		</aon:panelGrid>
		
		<aon:panel id="alternativeShippingAddressPanel" style="width:600px;">
			<f:facet name="header">
				<aon:div style="display:inline;">
					<aon:selectBooleanCheckbox id="shippingAlternativeAddressSelect" 
						value="#{delivery.shippingAlternativeAddress}" >
						<a4j:support event="onclick" 
							ajaxSingle="true"
							ignoreDumpResponses="true"
							limitToList="true"
							eventsQueue="shippingAlternativeAddress"
							reRender="alternativeShippingAddressPanel" />
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="shippingAlternativeAddressSelect" value="#{bundle.carrier_shipment_alternativeAddress}" />
				</aon:div>
			</f:facet>
		
			<aon:panelGrid columns="2" rendered="#{delivery.shippingAlternativeAddress}"  
				styleClass="aon-width-all">
					
				<aon:outputLabel for="Delivery_shippingAlternativeRecipient" 
					value="#{bundle.purchase_shipping_recipient}" />
				<aon:inputText id="Delivery_shippingAlternativeRecipient" 
					value="#{delivery.to.shippingAlternativeRecipient}" size="64" maxlength="64"/>
		
				<aon:outputLabel for="Delivery_shippingAlternativeAddress" value="#{bundle.aon_address}" />
				<aon:inputText id="shippingAlternativeAddress" maxlength="128" size="80"
					value="#{delivery.to.shippingAlternativeAddress}" />
				
				<aon:outputLabel for="Delivery_shippingAlternativeAddress2" value="#{bundle.registry_address_detail}" />
				<aon:inputText id="Delivery_shippingAlternativeAddress2" maxlength="128" size="80"
					value="#{delivery.to.shippingAlternativeAddress2}" />
				
				<aon:outputLabel for="Delivery_shippingAlternativeZip" 
					value="#{bundle.aon_postal_code}" />
				<aon:inputText id="Delivery_shippingAlternativeZip" 
					value="#{delivery.to.shippingAlternativeZip}" size="16" maxlength="16"/>
					
				<aon:outputLabel for="Delivery_shippingAlternativeCity" 
					value="#{bundle.registry_city}" />
				<aon:inputText id="Delivery_shippingAlternativeCity" 
					value="#{delivery.to.shippingAlternativeCity}" size="64" maxlength="64"/>
					
				<aon:outputLabel for="Delivery_shippingAlternativePhone" 
					value="#{bundle.aon_phone}" />
				<aon:inputText id="Delivery_shippingAlternativePhone"
					value="#{delivery.to.shippingAlternativePhone}" />
			
			</aon:panelGrid>
			
		</aon:panel>
		
	</aon:panelGrid>
	
</ui:composition>
