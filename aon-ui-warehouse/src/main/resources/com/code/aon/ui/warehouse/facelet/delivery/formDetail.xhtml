<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:methodParam name="newSaveActionListener" value="#{deliveryDetail.checkStockWarning}" type="actionListener" />					
	<aon:methodParam name="saveActionListener" value="#{deliveryDetail.checkStockWarning}" type="actionListener" />					
	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="dataTableId" value="deliveryDetails" />
		<ui:param name="controller" value="#{deliveryDetail}" />
		<ui:param name="rows" value="0" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="skipResetButton" value="#{!delivery.pending}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="rowSelectorReRender" value="menuExt" />
		<ui:param name="resetButtonReRender" value="menuExt" />
		<ui:param name="newCancelButtonReRender" value="menuExt" />
		<ui:param name="cancelButtonReRender" value="menuExt" />
		<ui:param name="newSaveButtonReRender" value="menuExt,Delivery_total,showConfirmStockWindow,Delivery_workPlace,Delivery_warehouse" />
		<ui:param name="saveButtonReRender" value="menuExt,Delivery_total,showConfirmStockWindow,Delivery_workPlace,Delivery_warehouse" />
		<ui:param name="removeButtonReRender" value="menuExt,Delivery_total,Delivery_workPlace,Delivery_warehouse" />
		<ui:param name="focusOnAdd" value="Item_id-New" />
		<ui:param name="focusOnSelect" value="Item_id" />
		<ui:define name="beginFormListContent">
			<aon:commandLink id="#{dataTableId}-selectButton"
				styleClass="aon-table-row-link" value="&#160;"
				immediate="true" ajaxSingle="true" requestDelay="100"
				rendered="#{delivery.pending}"
				actionListener="#{deliveryDetail.onSelect}"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="#{dataTableId}SelectRow(this)"
				onblur="#{dataTableId}DeselectRow(this)"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
			</aon:commandLink>
		</ui:define>

		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="DeliveryDetail_line" value="#{bundle.aon_line}" />
				</f:facet>
				<aon:outputText value="#{to.line}"
					rendered="#{formList}" />
				<aon:inputText id="DeliveryDetail_line" 
					value="#{controller.to.line}" rendered="#{formEdit}"
					required="true" size="1" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="DeliveryDetail_line-New" 
						value="#{controller.to.line}" rendered="#{formNew}"
						required="true" size="1" maxlength="3" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupTo" value="#{deliveryDetail.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="skipSuggestText" value="#{deliveryDetail.to.item != null and deliveryDetail.to.item.id != null}" />
					<ui:param name="lookupInputOnFocus" value="DeliveryDetail_description" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupDisabled" value="#{!controller.editable}" />
					<ui:param name="lookupReRender" 
						value="deliveryDetailItemEdit,DeliveryDetail_quantity,DeliveryDetail_price,DeliveryDetail_discount,
								DeliveryDetail_amount" />
					<aon:methodParam name="lookupChangeListener"
						value="#{deliveryDetail.onItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<aon:panelGroup id="deliveryDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
					<c:if test="#{aonConfiguration.bean.product.showStock}">
						<aon:commandButton value="&#160;"
							title="#{productBundle.product_info}"
							rendered="#{deliveryDetail.to.item != null and deliveryDetail.to.item.id != null and deliveryDetail.to.item.product.inventoriable}"
							styleClass="aon-icon aon-icon-edit-end aon-icon-info"
							actionListener="#{itemInfo.onShowPanel}"
							reRender="itemInfoContainer">
							<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
							<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
							<aon:set var="#{itemInfo.item}" value="#{deliveryDetail.to.item}" /> 
							<aon:set var="#{itemInfo.warehouse}" value="#{delivery.warehouse}" /> 
							<aon:set var="#{itemInfo.rowStock}" value="#{deliveryDetail.rowStock}" /> 
							<aon:set var="#{itemInfo.componentId}" value="DeliveryDetail_item_product_code" />
							<aon:set var="#{itemInfo.alternativeMethod}" value="deliveryDetail.onItemChanged" />
						</aon:commandButton>															
					</c:if>
					<aon:inputTextarea id="DeliveryDetail_description" 
						value="#{deliveryDetail.to.description}"
						rendered="#{deliveryDetail.to.item != null and deliveryDetail.to.item.id != null}"
						cols="60" rows="#{!deliveryDetail.longDescription?1:5}"
						style="#{!deliveryDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
						<f:validateLength maximum="1024" />
					</aon:inputTextarea>
					<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
						actionListener="#{deliveryDetail.onShortDescription}" reRender="DeliveryDetail_description"
						rendered="#{deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
					<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
						actionListener="#{deliveryDetail.onLongDescription}" reRender="DeliveryDetail_description"
						rendered="#{!deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
							<ui:param name="lookupTo" value="#{deliveryDetail.to.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{deliveryDetail.to.item != null and deliveryDetail.to.item.id != null}" />
							<ui:param name="lookupInputOnFocus" value="DeliveryDetail_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupReRender" 
								value="deliveryDetailItemNew,DeliveryDetail_quantity-New,DeliveryDetail_price-New,
										DeliveryDetail_discount-New,DeliveryDetail_amount-New" />
							<aon:methodParam name="lookupChangeListener"
								value="#{deliveryDetail.onItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="deliveryDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
							<c:if test="#{aonConfiguration.bean.product.showStock}">
								<aon:commandButton value="&#160;"
									title="#{productBundle.product_info}"
									rendered="#{deliveryDetail.to.item != null and deliveryDetail.to.item.id != null and deliveryDetail.to.item.product.inventoriable}"
									styleClass="aon-icon aon-icon-edit-end aon-icon-info"
									actionListener="#{itemInfo.onShowPanel}"
									reRender="itemInfoContainer">
									<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.item}" value="#{deliveryDetail.to.item}" /> 
									<aon:set var="#{itemInfo.warehouse}" value="#{delivery.warehouse}" /> 
									<aon:set var="#{itemInfo.rowStock}" value="#{deliveryDetail.rowStock}" /> 
									<aon:set var="#{itemInfo.componentId}" value="Item_id-New" />
									<aon:set var="#{itemInfo.alternativeMethod}" value="deliveryDetail.onItemChanged" />
								</aon:commandButton>															
							</c:if>
							<aon:inputTextarea id="DeliveryDetail_description-New" 
								value="#{deliveryDetail.to.description}"
								rendered="#{deliveryDetail.to.item != null and deliveryDetail.to.item.id != null}"
								cols="60" rows="#{!deliveryDetail.longDescription?1:5}"
								style="#{!deliveryDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
								actionListener="#{deliveryDetail.onShortDescription}" reRender="DeliveryDetail_description-New"
								rendered="#{deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
							<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
								actionListener="#{deliveryDetail.onLongDescription}" reRender="DeliveryDetail_description-New"
								rendered="#{!deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
						</aon:panelGroup>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="DeliveryDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList or !controller.modelEditable}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:inputText id="DeliveryDetail_quantity" 
					value="#{controller.to.quantity}" rendered="#{formEdit and controller.editable}"
					valueChangeListener="#{controller.onQuantityChanged}" 
					reRender="DeliveryDetail_price,DeliveryDetail_discount,DeliveryDetail_amount" 
					required="true" size="5" focus="DeliveryDetail_price" />
				<f:facet name="footer">
					<aon:inputText id="DeliveryDetail_quantity-New" 
						value="#{controller.to.quantity}" rendered="#{formNew}" 
						valueChangeListener="#{controller.onQuantityChanged}" 
						reRender="DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New" 
						required="true" size="5" focus="DeliveryDetail_price-New" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="DeliveryDetail_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="DeliveryDetail_price" 
					value="#{controller.to.price}" rendered="#{formEdit}"
					reRender="DeliveryDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="DeliveryDetail_price-New" 
						value="#{controller.to.price}" rendered="#{formNew}"
						reRender="DeliveryDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="DeliveryDetail_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="DeliveryDetail_discount" 
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
					reRender="DeliveryDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="DeliveryDetail_discount-New" 
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
						reRender="DeliveryDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="DeliveryDetail_amount" value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{controller.modelAmount}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:outputText id="DeliveryDetail_amount" 
					value="#{controller.amount}" rendered="#{formEdit}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:outputText id="DeliveryDetail_amount-New" 
							value="#{controller.amount}" rendered="#{formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText id="Delivery_taxableBase" 
							value="#{delivery.taxableBase}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="INFO" />
				</f:facet>
				<aon:commandLink id="deliveryDetailSourceLink" immediate="true"
					styleClass="aon-button-goto" style="padding-right: 20px;"
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{to.salesDetail != null and to.salesDetail.id != null}" 
					actionListener="#{controller.onLoadSales}"
					action="sales_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.lineSourceInfo}" />
				</aon:commandLink>
			</aon:column>
		</ui:define>
	
	</ui:decorate>

</ui:composition>
