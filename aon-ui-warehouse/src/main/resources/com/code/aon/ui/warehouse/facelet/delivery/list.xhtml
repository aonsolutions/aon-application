<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryList">
		
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_delivery_module}" />
				<ui:param name="controller" value="#{delivery}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="deliveryList-excel-report" value="&#160;" 
						target="_new" rendered="#{!delivery.nevv}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="deliveryList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="deliveryList-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!delivery.nevv}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="deliveryList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="deliveryDetailledList-excel-report" value="&#160;"
						target="_new" rendered="#{!delivery.nevv}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="deliveryDetailledList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="deliveryDetailledList-report" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!delivery.nevv}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="deliveryDetailledList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{delivery}" />
					<ui:define name="columns">
						<aon:column alias="Delivery.issueTime"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueTime}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Delivery.series,Delivery.number"
							styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_delivery_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>

						<aon:column alias="Delivery.customer.registry.name"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_customer}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.fullName}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Delivery.customer.registry.document"
							styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.document}" />
						</aon:column>

						<aon:if test="#{companyCollections.workPlacesCount > 1}">
							<aon:column alias="Income.workPlace.description"
								styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
								<f:facet name="header">
									<aon:outputText value="#{bundle.purchase_workplace}" />
								</f:facet>
								<aon:outputText value="#{to.workPlace.description}" />
							</aon:column>
						</aon:if>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{controller.deliveryTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div id="listTotalDiv" styleClass="aon-text-right"
									rendered="#{controller.rowCount &lt; 500}">
									<aon:commandLink id="showTotals" immediate="true" 
										styleClass="aon-dataTable-link aon-nowrap aon-bold"
										value="#{bundle.aon_total_sum}"
										rendered="#{controller.listTotal == null}"
										actionListener="#{controller.obtainListTotals}"									
										reRender="listTotalDiv" />
									<aon:outputText	styleClass="aon-bold" 
										value="#{controller.listTotal}"
										rendered="#{controller.listTotal != null}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_invoice_abbr}" />
							</f:facet>
							<aon:outputText title="#{bundle.finance_invoiced}"
								styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
								value="&#160;"
								rendered="#{to.invoiced}" />
							<aon:outputText title="#{bundle.aon_pending}"
								styleClass="aon-text-center"
								value="-"
								rendered="#{!to.invoiced}" />
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalIngenet.xhtml" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml">
			<ui:param name="addWaitProcessPoll" value="#{true}" />
		</ui:include>
		
		<aon:if test="#{company.ediSupportEnabled}">
			<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
				<ui:param name="logPanelTitle" value="#{bundle.aon_import} #{bundle.registry_stat_delivery} INGENET" />
				<ui:param name="closeButtonReRender" value="aonContent" />
				<aon:methodParam name="closeButtonAction" value="delivery_list" />
				<aon:valueParam name="pollInterval" value="2000" />
				<aon:methodParam name="closeLogPanelAtionListener"
					default="#{delivery.udapaDeliveryHandler.onLogPanelFinish}" type="actionListener" />
			</ui:include>
		</aon:if>
		
	</ui:define>
</ui:composition>
