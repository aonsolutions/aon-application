<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
	
		<aon:panelCollapsible expanded="true" label="#{bundle.warehouse_income_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/warehouse/facelet/income/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" label="#{bundle.warehouse_income_detail}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
			
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupTo" value="#{searchController.item}" />
					<ui:param name="skipNewButton" value="#{true}" />
				</ui:include>

				<aon:outputLabel for="Income_lines_quantity"
					value="#{bundle.aon_quantity}" />
				<aon:inputText id="Income_lines_quantity"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Income_lines_price"
					value="#{bundle.aon_price}" />
				<aon:inputText id="Income_lines_price"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Income_lines_taxableBase"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Income_lines_taxableBase"
					valueChangeListener="#{controller.addExpression}" size="40" />
								
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.finance_invoice_supplier_data}" >
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.registry_address_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contacts}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
		</aon:panelCollapsible>

	</aon:div>

</ui:composition>
