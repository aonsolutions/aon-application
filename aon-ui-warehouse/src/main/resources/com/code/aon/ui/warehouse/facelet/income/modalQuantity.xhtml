<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showQuantityAdjustWindow">
		<aon:if test="#{controller.showQuantityAdjustWindow}">
			<rich:modalPanel id="quantityAdjustModalPanel" minHeight="240"
				minWidth="520" rendered="#{controller.showQuantityAdjustWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_quantity_adjust}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showQuantityAdjustWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showQuantityAdjustWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="quantityAdjustForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="quantityAdjust-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onPurchaseQuantityAdjust}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="quantityAdjustModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showQuantityAdjustWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="quantityAdjust-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showQuantityAdjustWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showQuantityAdjustWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="IncomeDetail_quantityAdjust"
											value="#{bundle.aon_quantity}" />
										<aon:inputText id="IncomeDetail_quantityAdjust"
											value="#{controller.incomeDetail.quantity}" 
											required="true" size="4" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
