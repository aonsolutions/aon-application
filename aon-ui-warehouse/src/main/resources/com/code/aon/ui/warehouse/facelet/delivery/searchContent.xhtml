<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
	
		<aon:panelCollapsible expanded="true" label="#{bundle.warehouse_delivery_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" label="#{bundle.warehouse_delivery_detail}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
			
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{saleItemLookup}" />
					<ui:param name="lookupTo" value="#{searchController.item}" />
					<ui:param name="skipNewButton" value="#{true}" />
					<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
				</ui:include>
				
				<aon:if test="#{aonConfiguration.bean.product.showBarcode}">
					<aon:outputLabel for="Delivery_lines_item_barcode"
						value="#{bundle.product_barcode}" />
					<aon:inputText id="Delivery_lines_item_barcode" size="25"
						valueChangeListener="#{controller.addExpression}" />
				</aon:if>				
				
				<aon:outputLabel for="Delivery_lines_item_suppliers_code"
					value="#{bundle.product_item_supplier_code}" />
				<aon:inputText id="Delivery_lines_item_suppliers_code" size="25"
					valueChangeListener="#{controller.addExpression}" />				
				
				<aon:outputLabel for="Delivery_lines_item_product_category_id"
					value="#{bundle.aon_category}" />
				<aon:selectOneMenu id="Delivery_lines_item_product_category_id"
					value="#{searchController.category}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{productCollections.categories}" />
				</aon:selectOneMenu>				

				<aon:if test="#{aonConfiguration.bean.product.showBrand and productCollections.brandsCount > 0}">
					<aon:outputLabel for="Delivery_lines_item_product_brand_id"
						value="#{bundle.tas_make}" />
					<aon:selectOneMenu id="Delivery_lines_item_product_brand_id"
						value="#{productCollections.brand}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{productCollections.brands}" />
					</aon:selectOneMenu>
				</aon:if>
				
				<aon:outputLabel for="Delivery_lines_quantity"
					value="#{bundle.aon_quantity}" />
				<aon:inputText id="Delivery_lines_quantity"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Delivery_lines_price"
					value="#{bundle.aon_price}" />
				<aon:inputText id="Delivery_lines_price"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Delivery_lines_taxableBase"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Delivery_lines_taxableBase"
					valueChangeListener="#{controller.addExpression}" size="40" />
							
				<aon:outputLabel for="Delivery_lines_warehouse_id"
					value="#{bundle.aon_warehouse}" />
				<aon:selectOneMenu id="Delivery_lines_warehouse_id"
					value="#{searchController.warehouse}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{searchController.warehouses}" />
				</aon:selectOneMenu>	
					
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.registry_customer_data}" >
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.registry_address_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contacts}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
		</aon:panelCollapsible>

		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml" />
		
	</aon:div>

</ui:composition>
