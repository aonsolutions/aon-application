<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="stockReportSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{stockReport.title}" />
				<ui:param name="controller" value="#{stockReport}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{stockReport}" />
				<ui:param name="skipSearchButton" value="#{true}" />

				<ui:define name="searchContent">
					<aon:outputLabel for="Stock_warehouse_id" value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="Stock_warehouse_id"
						value="#{stockReport.warehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>
				
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
						<ui:param name="lookupBean" value="#{allItemLookup}" />
						<ui:param name="lookupTo" value="#{stockReport.item}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="skipSearchButton" value="#{false}" />
						<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
					</ui:include>

					<aon:outputLabel for="Stock_quantity" value="#{bundle.aon_quantity}" />
					<aon:inputText id="Stock_quantity" size="10"
						value="#{stockReport.quantity}" />				
				
					<aon:outputLabel for="Stock_price_type" value="#{bundle.warehouse_valued_by}" rendered="#{stockReport.valued}"/>
					<aon:selectOneMenu id="Stock_price_type" rendered="#{stockReport.valued}"
						value="#{stockReport.priceType}">
						<f:selectItems value="#{warehouseCollections.priceTypes}" />
					</aon:selectOneMenu>

					<aon:outputText value="" />
					<aon:div>
						<aon:div styleClass="aon-search-commandButton-left" style="display: inline-block;">
							<aon:div styleClass="aon-search-commandButton-right">
								<aon:htmlCommandLink id="SearchButton-pdf" 
									value="#{bundle.aon_listing}"
									action="#{report.onExecute}"
									target="_blank"
									accesskey="#{bundle.aon_key_search}"
									styleClass="aon-icon-commandButton aon-icon-pdf">
									<f:param name="reportKey" value="#{stockReport.reportKey}" />
									<f:param name="outputFormat" value="PDF" />
								</aon:htmlCommandLink>
							</aon:div>
						</aon:div>
						<aon:div styleClass="aon-search-commandButton-left" style="display: inline-block;margin-left:0.7em;">
							<aon:div styleClass="aon-search-commandButton-right">
								<aon:htmlCommandLink id="SearchButton-excel" 
									value="#{bundle.aon_listing}"
									action="#{report.onExecute}"
									target="_blank"
									accesskey="#{bundle.aon_key_search}"
									styleClass="aon-icon-commandButton aon-icon-excel">
									<f:param name="reportKey" value="#{stockReport.reportKey}" />
									<f:param name="outputFormat" value="MS Excel" />
								</aon:htmlCommandLink>
							</aon:div>
						</aon:div>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{allItemLookup}" />
	</ui:define>
	
</ui:composition>
