<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="warehouseGrid">
			<aon:div ajaxRendered="true" layout="none">
			
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.warehouse_warehouse_module}" />
					<ui:param name="controller" value="#{warehouse}" />
				</ui:decorate>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:decorate 
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{warehouse}" />

						<ui:define name="columns">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-400"
								alias="Warehouse.name" >
								<f:facet name="header">
									<aon:outputLabel for="Warehouse_name"
										value="#{bundle.aon_module_warehouse}" />
								</f:facet>
								<aon:outputText value="#{to.name}"
									rendered="#{formList}" />
								<aon:inputText id="Warehouse_name" required="true"
									rendered="#{formEdit}" size="32"
									value="#{controller.to.name}" maxlength="32" />
								<f:facet name="footer">
									<aon:inputText id="Warehouse_name-New" required="true"
										rendered="#{formNew}" size="32"
										value="#{controller.to.name}" maxlength="32" />
								</f:facet>
							</aon:column>
							
							<aon:column alias="Warehouse.active" 
							 	styleClass="aon-text-center aon-editDataTable-textColumn aon-width-50">
								<f:facet name="header">
									<aon:outputLabel for="Warehouse_active" value="#{bundle.aon_active}" />
								</f:facet>
								<aon:outputText rendered="#{formList}"
									value="&#160;"
									styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}" 
									style="padding-left:20px; background-position: 5px 2px;" />
								<aon:selectBooleanCheckbox id="Warehouse_active"
									rendered="#{formEdit}" value="#{controller.to.active}" />
								<f:facet name="footer">
									<aon:selectBooleanCheckbox id="Warehouse_active-New"
										rendered="#{formNew}" value="#{controller.to.active}" />
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto"
								alias="Warehouse.workPlace.description" >
								<f:facet name="header">
									<aon:outputLabel for="Warehouse_workPlace"
										value="#{bundle.purchase_workplace}" />
								</f:facet>
								<aon:outputText value="#{to.workPlace.description}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="Warehouse_workPlace"
									value="#{controller.to.workPlace}"
									rendered="#{formEdit}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Warehouse_workPlace-New" 
										value="#{controller.to.workPlace}"
										rendered="#{formNew}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:if test="#{actionDenied.moduleEnabled['hotel']}">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto"
									alias="Warehouse.department.name" >
									<f:facet name="header">
										<aon:outputLabel for="Warehouse_department"
											value="#{bundle.purchase_department}" />
									</f:facet>
									<aon:outputText value="#{to.department.name}"
										rendered="#{formList}" />
									<aon:selectOneMenu id="Warehouse_department"
										value="#{controller.to.department}"
										rendered="#{formEdit}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{companyCollections.departments}" />
									</aon:selectOneMenu>
									<f:facet name="footer">
										<aon:selectOneMenu id="Warehouse_department-New" 
											value="#{controller.to.department}"
											rendered="#{formNew}">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{companyCollections.departments}" />
										</aon:selectOneMenu>
									</f:facet>
								</aon:column>
							</aon:if>
							
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
