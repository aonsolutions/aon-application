<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="warehouseGrid">
			<aon:div ajaxRendered="true" layout="none">
			
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_warehouse_module}" />
					<ui:param name="controller" value="#{warehouse}" />
				</ui:decorate>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:decorate 
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{warehouse}" />
						<ui:param name="columnClasses" 
							value="aon-editDataTable-textColumn aon-width-400,aon-editDataTable-textColumn aon-width-auto" />

						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Warehouse_name"
										value="#{warehouseBundle.warehouse_warehouse}" />
								</f:facet>
								<aon:outputText value="#{to.name}"
									rendered="#{formList}" />
								<aon:inputText id="Warehouse_name" required="true"
									rendered="#{formEdit}" size="32"
									value="#{controller.to.name}" maxlength="32" />
								<f:facet name="footer">
									<aon:inputText id="Warehouse_name-New" required="true"
										rendered="#{formNew}" size="32"
										value="#{controller.to.name}" maxlength="32" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Warehouse_workPlace"
										value="#{companyBundle.company_workplace}" />
								</f:facet>
								<aon:outputText value="#{to.workPlace.description}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="Warehouse_workPlace" required="true"
									value="#{controller.to.workPlace}"
									rendered="#{formEdit}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{companyCollections.workPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Warehouse_workPlace-New" required="true" 
										value="#{controller.to.workPlace}"
										rendered="#{formNew}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{companyCollections.workPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
