<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showWarehouseChangeWindow">
		<aon:if test="#{income.showWarehouseChangeWindow}">
			<rich:modalPanel id="warehouseChangeModalPanel" minHeight="240"
				minWidth="520" rendered="#{income.showWarehouseChangeWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.warehouse_income_change_warehouse}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showWarehouseChangeWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{income.showWarehouseChangeWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="warehouseChangeForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="warehouseChange-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{income.onWarehouseChange}"
										reRender="incomeForm,showWarehouseChangeWindow"
										onclick="Richfaces.showModalPanel('waitProccess')" 
					     				oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="warehouseChangeModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{income.showWarehouseChangeWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="warehouseChange-cancel"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										immediate="true"
										value="#{bundle.aon_cancel}"
										reRender="showWarehouseChangeWindow">
										<f:setPropertyActionListener
											target="#{income.showWarehouseChangeWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="Income_warehouse"
											value="#{bundle.aon_warehouse}" />
										<aon:outputText id="Income_warehouse"
											value="#{income.warehouse.name}" />

										<aon:outputLabel for="Income_newWarehouse"
											value="#{bundle.aon_reset} #{bundle.aon_warehouse}" />
										<aon:selectOneMenu id="Income_newWarehouse" 
											value="#{income.newWarehouse}" required="#{true}">
											<f:selectItems value="#{income.warehouses}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
