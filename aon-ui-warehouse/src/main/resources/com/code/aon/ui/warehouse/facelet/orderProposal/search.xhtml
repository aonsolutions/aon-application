<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="stockReportSearch">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_order_proposal_module}" />
				<ui:param name="controller" value="#{orderProposal}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{orderProposal}" />
				<ui:param name="skipSearchButton" value="#{true}" />

				<ui:define name="searchContent">
					<aon:outputLabel for="warehouse_id" value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="warehouse_id"
						value="#{orderProposal.warehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="category_id" value="#{bundle.aon_category}" />
					<aon:selectOneMenu id="category_id"
						value="#{orderProposal.category}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{productCollections.categories}" />
					</aon:selectOneMenu>

					<aon:outputText value="" />
					<aon:div styleClass="aon-search-commandButton-left">
						<aon:div styleClass="aon-search-commandButton-right">
							<aon:htmlCommandLink id="SearchButton" 
								value="#{bundle.aon_search}"
								action="#{report.onExecute}"
								target="_blank"
								accesskey="#{bundle.aon_key_search}">
								<f:param name="reportKey" value="orderProposal" />
							</aon:htmlCommandLink>
						</aon:div>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
	
</ui:composition>
