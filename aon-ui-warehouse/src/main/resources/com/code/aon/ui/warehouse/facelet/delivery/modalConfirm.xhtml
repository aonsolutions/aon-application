<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showConfirmWindow">
		<aon:if test="#{controller.showConfirmWindow}">
			<rich:modalPanel id="confirmModalPanel" minHeight="200" minWidth="420" 
				rendered="#{controller.showConfirmWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_confirm_title}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showConfirmWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showConfirmWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="confirmForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-scroll-area" style="margin-top: 0.1em;" >
						
									<aon:div style="margin-bottom:20px;">
										<aon:outputText style="display: inline-block;" styleClass="aon-bold" 
											rendered="#{controller.transferedGreatherThanPending}"
											value="#{bundle.warehouse_income_purchase_quantity_update}" />
										<aon:div styleClass="aon-underline aon-margin-top aon-margin-bottom" 
											rendered="#{controller.transferedGreatherThanPending and controller.existsDetailToCancel}" />
										<aon:outputText style="display: inline-block;" styleClass="aon-bold" 
											rendered="#{controller.existsDetailToCancel}"
											value="#{bundle.warehouse_income_purchase_pending_cancel}" />
									</aon:div>

									<aon:div styleClass="aon-width-all aon-text-center">
										<aon:commandButton id="confirm-accept"
											styleClass="aon-commandButton"
											value="#{bundle.aon_confirm}"
											actionListener="#{controller.confirmSalesTrasfer}">
											<rich:componentControl for="confirmModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showConfirmWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
