<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<!-- PACKAGE VARIABLES -->
	<c:set var="handler" value="#{delivery.packagesHandler}"/>
	<c:set var="containerModel" value="#{delivery.packagesHandler.packagesContainerModel}"/>
	<c:set var="linesModel" value="#{delivery.packagesHandler.linesPackageModel}"/>
	
	<!-- EDI STRUCTURE VARIABLES -->
	<c:set var="ediTree" value="#{delivery.packagesHandler.ediTreeNode}"/>


	<c:set var="packagesModel" value="#{delivery.packagesHandler.packagesModel}"/>

	<!-- *********************** -->


	<aon:if test="#{aonRole.sysAdmin or domainSwitcher.snapshotVersion or (handler.packagesInRemark and empty handler.dataAttach.id)}">
		<aon:panel styleClass="aon-width-all aon-margin-top">
			<aon:commandButton value="#{bundle.aon_refresh}" 
				styleClass="aon-icon-commandButton aon-icon-sincronize aon-padding-left"
				actionListener="#{handler.onCreateAttachFromRemarks}">
			</aon:commandButton>
			<aon:if test="#{aonRole.sysAdmin or domainSwitcher.snapshotVersion}">
				<aon:div>
					<aon:inputTextarea cols="80" rows="4"
						value="#{handler.dataAttachValue}" />
				</aon:div>
			</aon:if>
		</aon:panel>
	</aon:if>
	
	<rich:panelBar styleClass="aon-width-all" selectedPanel="editPanel">
	
		<rich:panelBarItem id="editPanel" label="Jerarquia de envases" >
		    <aon:panel id="productPanel"
				styleClass="aon-width-all aon-margin-top">
				<f:facet name="header">
					<aon:outputText value="Productos y envases" />
				</f:facet>
				<aon:dataTable id="productData" var="to" 
					value="#{packagesModel}" >
					
					<aon:column id="linesPackage-selectColumn" 
						styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div rendered="#{handler.to != to}" layout="none">
							<aon:commandLink 
								styleClass="aon-table-row-link" value="&#160;"
								immediate="true" ajaxSingle="true" requestDelay="100"
								
								actionListener="#{handler.onSelect}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div layout="none">
								<aon:commandButton title="#{bundle.aon_reset}"
									actionListener="#{handler.onReset}"
									rendered="#{!handler.nevv}" reRender="productPanel"
									styleClass="aon-editDataTable-button aon-icon-reset" />
							</aon:div>
						</f:facet>
					</aon:column>
		
					<aon:column styleClass="aon-nowrap">
						<f:facet name="header">
							<aon:outputLabel for="packageContent" value="Contenido" />
						</f:facet>
						<aon:div rendered="#{handler.to!=to}">
							<aon:outputText value="linea #{to.content.line} " />
							<aon:outputText value=" (" />
							<aon:outputText value="#{to.content.quantity}" >
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText value=" x #{to.content.description}) " />
						</aon:div>
						<aon:selectOneMenu id="packageContent" value="#{to.content}"
							rendered="#{handler.to==to}" required="#{true}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{handler.availableItems}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="packageContent-New" value="#{handler.to.content}"
								rendered="#{handler.nevv}" required="#{true}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{handler.availableItems}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>
					<aon:column styleClass="aon-nowrap">
						<f:facet name="header">
							<aon:outputLabel for="packageContinent" value="Continente" />
						</f:facet>
						<aon:div rendered="#{handler.to!=to}">
							<aon:outputText value="linea #{to.continent.line} " />
							<aon:outputText value=" (" />
							<aon:outputText value="#{to.continent.quantity}" >
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText value=" x #{to.continent.description}) " />
						</aon:div>
						<aon:selectOneMenu id="packageContinent" value="#{to.continent}"
							rendered="#{handler.to==to}" required="#{true}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{handler.availablePackages}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="packageContinent-New" value="#{handler.to.continent}"
								rendered="#{handler.nevv}" required="#{true}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{handler.availablePackages}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>
					<aon:column styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div rendered="#{handler.to==to}" layout="none">			
							<aon:commandButton
								id="productData-save" title="#{bundle.aon_save}"
								actionListener="#{handler.onAccept}"
								reRender="productPanel"
								styleClass="aon-editDataTable-button aon-icon-accept" />
							<aon:commandButton
								id="productData-cancel" title="#{bundle.aon_cancel}"
								actionListener="#{handler.onCancel}"
								immediate="true" reRender="#{cancelButtonReRender}"
								styleClass="aon-editDataTable-button aon-icon-cancel" />
							<aon:confirmButton
								id="productData-remove" title="#{bundle.aon_remove}"
								immediate="true" 
								reRender="productPanel"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{handler.onRemove}"
								styleClass="aon-editDataTable-button aon-icon-delete" />
						</aon:div>
						<f:facet name="footer">
							<aon:div layout="none">
								<aon:commandButton
									id="productData-new-save" title="#{bundle.aon_save}"
									actionListener="#{handler.onAccept}"
									rendered="#{handler.nevv}"
									reRender="productPanel"
									styleClass="aon-editDataTable-button aon-icon-accept" />
								<aon:confirmButton
									id="productData-new-cancel" title="#{bundle.aon_cancel}"
									rendered="#{handler.nevv}" reRender="#{newCancelButtonReRender}"
									immediate="true"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_cancel_confirm}"
									confirmActionListener="#{handler.onCancel}"
									styleClass="aon-editDataTable-button aon-icon-cancel" />
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:dataTable>
			</aon:panel>
		
			<!--  
		    <aon:panel id="packagesContainerPanel"
				styleClass="aon-width-all aon-margin-top">
				<f:facet name="header">
					<aon:outputText value="PALET" />
				</f:facet>
		
				<aon:dataTable id="packagesContainerData" var="pair" 
					rendered="#{containerModel.rowCount > 0}" value="#{containerModel}" >
		
					<aon:column styleClass="aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="Contenido" />
						</f:facet>
						<aon:outputText value="linea #{pair.right.line} " />
						<aon:outputText value=" (" />
						<aon:outputText value="#{pair.right.quantity}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" x #{pair.right.description}) " />
						<f:facet name="footer">
							<aon:outputText value="Contenido" />
						</f:facet>
					</aon:column>
					<aon:column styleClass="aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="Continente" />
						</f:facet>
						<aon:outputText value="linea #{pair.left.line} " />
						<aon:outputText value=" (" />
						<aon:outputText value="#{pair.left.quantity}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" x #{pair.left.description}) " />
					</aon:column>
				</aon:dataTable>
		
			</aon:panel>
			-->
			
		</rich:panelBarItem>
	
		<aon:if test="#{company.ediSupportEnabled}">
			<rich:panelBarItem id="ediPanel" label="Estructura EDI">
			    <rich:tree style="width:300px" ajaxSubmitSelection="true" switchType="client"
	                value="#{ediTree}" var="ediItem" ajaxKeys="#{null}">
	            </rich:tree>
			</rich:panelBarItem>
		</aon:if>
		
		<rich:panelBarItem id="packagesPanel" label="Secuencia de envases">
            <aon:panel id="packagesContainerPanel"
				styleClass="aon-width-all aon-margin-top">
				<f:facet name="header">
					<aon:outputText value="Palets, Box, ..." />
				</f:facet>
		
				<aon:dataTable id="packagesContainerData" var="pair" 
					rendered="#{containerModel.rowCount > 0}"
					value="#{containerModel}" >
		
					<aon:column styleClass="aon-nowrap">
						<aon:outputText value="La linea" />
					</aon:column>
		
					<aon:column styleClass="aon-width-50">
						<aon:inputText value="#{pair.left.line}"
							required="true" disabled="true" size="2" />
					</aon:column>
					
					<aon:column>
						<aon:outputText value=" (" />
						<aon:outputText value="#{pair.left.quantity}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" x #{pair.left.description}) " />
					</aon:column>
		
					<aon:column styleClass="aon-nowrap">
						<aon:outputText value="contiene la linea" />
					</aon:column>
		
					<aon:column styleClass="aon-width-50">
						<aon:inputText value="#{pair.right.line}"
							required="true" disabled="true" size="2" />
					</aon:column>
					
					<aon:column>
						<aon:outputText value=" (" />
						<aon:outputText value="#{pair.right.quantity}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" x #{pair.right.description}) " />
					</aon:column>
				</aon:dataTable>
		
			</aon:panel>
			
			<aon:panel id="linesPackagePanel"
				styleClass="aon-width-all aon-margin-top">
				<f:facet name="header">
					<aon:outputText value="Envases" />
				</f:facet>
				<aon:dataTable id="linesPackageData" var="pair" 
					rendered="#{linesModel.rowCount > 0}"
					value="#{linesModel}" >
		
					<aon:column styleClass="aon-nowrap">
						<aon:outputText value="La linea" />
					</aon:column>
		
					<aon:column styleClass="aon-width-50">
						<aon:inputText value="#{pair.left.line}"
							required="true" disabled="true" size="2" />
					</aon:column>
					
					<aon:column>
						<aon:outputText value=" (" />
						<aon:outputText value="#{pair.left.quantity}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" x #{pair.left.description}) " />
					</aon:column>
		
					<aon:column styleClass="aon-nowrap">
						<aon:outputText value="contiene la linea" />
					</aon:column>
		
					<aon:column styleClass="aon-width-50">
						<aon:inputText value="#{pair.right.line}"
							required="true" disabled="true" size="2" />
					</aon:column>
					
					<aon:column>
						<aon:outputText value=" (" />
						<aon:outputText value="#{pair.right.quantity}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" x #{pair.right.description}) " />
					</aon:column>
				</aon:dataTable>
		
			</aon:panel>
	
		</rich:panelBarItem>
		
	</rich:panelBar>
	
</ui:composition>
