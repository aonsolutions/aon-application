<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="dataTableId" value="warehouseTransferDetails" />
		<ui:param name="controller" value="#{warehouseTransferDetail}" />
		<ui:param name="skipResetButton" value="#{warehouseTransfer.readOnly}" />
		<ui:param name="skipLineEdition" value="#{warehouseTransfer.readOnly}" />
		<ui:param name="skipSelectRow" value="#{warehouseTransfer.readOnly}" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="focusOnAdd" value="Item_id-New" />
		<ui:param name="focusOnSelect" value="Item_id" />
	
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.code} - #{to.item.fullName}" rendered="#{formList}" />
				
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{allItemLookup}" />
					<ui:param name="lookupTo" value="#{warehouseTransferDetail.to.item}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="lookupInputOnFocus" value="WarehouseTransferDetail_quantity" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
				</ui:include>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{allItemLookup}" />
							<ui:param name="lookupTo" value="#{warehouseTransferDetail.to.item}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="lookupInputOnFocus" value="WarehouseTransferDetail_quantity-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
				<f:facet name="header">
					<aon:outputLabel for="WarehouseTransferDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:inputText id="WarehouseTransferDetail_quantity" 
					value="#{controller.to.quantity}" rendered="#{formEdit}"
					validator="#{controller.quantityCheck}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="WarehouseTransferDetail_quantity-New" 
						value="#{controller.to.quantity}" rendered="#{formNew}"
						validator="#{controller.quantityCheck}" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
		</ui:define>
		<ui:define name="endFormListContent">
			<aon:div>
				<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
					<ui:param name="auditableTO" value="#{to}" />
				</ui:include>
			</aon:div>
		</ui:define>
	</ui:decorate>

</ui:composition>
