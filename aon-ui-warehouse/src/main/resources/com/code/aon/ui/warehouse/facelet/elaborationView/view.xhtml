<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="elaborationViewList">
		
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="elaborationViewToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_manufacturing_order}" />
				<ui:param name="toolbarDescription"	value="#{bundle.aon_list}" />
				<ui:define name="additionalToolbarContent">
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:dataTable id="elaborationData" value="#{elaborationView.elaborationModel}"
					var="to" rows="10" rendered="#{elaborationView.elaborationModel.rowCount > 0}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-numberColumn , aon-editDataTable-textColumn,
						aon-editDataTable-dateColumn , aon-editDataTable-iconColumn">
						
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="serie/numero" />
						</f:facet>
						<aon:div>
							<aon:outputText value="#{to.series}" />
							<aon:outputText value="/" />
							<aon:outputText value="#{to.number}" />
						</aon:div>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="Producto" />
						</f:facet>
						<aon:outputText value="#{to.item.product.name}" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="Almacen" />
						</f:facet>
						<aon:outputText value="#{to.warehouse}" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="Cantidad" />
						</f:facet>
						<aon:outputText value="#{to.quantity}">
							<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
						</aon:outputText>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="Estado" />
						</f:facet>
						<aon:outputText value="#{to.status==0?'Pendiente':(to.status==1?'Cerrado':'En progreso')}" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="Fecha creacion" />
						</f:facet>
						<aon:outputText value="#{to.creationDate}" >
							<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="Origen" />
						</f:facet>
						<aon:commandLink id="elaborationSourceLink" immediate="true"
							styleClass="aon-button-goto" style="padding-right: 20px;"
							value="&#160;" title="#{bundle.aon_go}" 
							rendered="#{to.source != null and to.sourceId != null}" 
							actionListener="#{elaborationView.onLoadLineSource}"
							action="sales_form"
							reRender="aonContent">
							<rich:toolTip value="#{elaborationView.lineSourceInfo}" />
						</aon:commandLink>
					</aon:column>
					
				</aon:dataTable>
	
				<aon:dataScroller for="elaborationData" showNote="true" pageSize="25"
					rowCount="#{elaborationView.elaborationModel.rowCount}" />
	
<!--  
				<aon:div id="detailDataContainer">
					<aon:dataTable id="detailData" value="#{elaborationView.elaborationDetailModel}"
						var="to" rows="0" rendered="#{elaborationView.elaborationDetailModel.rowCount > 0}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
							aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
							aon-editDataTable-numberColumn, aon-editDataTable-numberColumn">
	
	
					</aon:dataTable>
					
					<aon:dataScroller for="detailData" showNote="true" pageSize="10"
						rowCount="#{elaborationView.elaborationDetailModel.rowCount}" />
						
				</aon:div>
-->

			</aon:div>
		</aon:form>
		
	</ui:define>
</ui:composition>
