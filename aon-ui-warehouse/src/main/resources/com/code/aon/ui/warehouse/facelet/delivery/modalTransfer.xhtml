<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showSalesTransferWindow">
		<aon:if test="#{delivery.showSalesTransferWindow}">
			<rich:modalPanel id="salesTransferModalPanel" minHeight="580"
				minWidth="775" rendered="#{delivery.showSalesTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.warehouse_delivery_sales_pending}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showSalesTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{delivery.showSalesTransferWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{delivery.salesTransferManager}"
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="salesTransferForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="salesTransfer-selectAll"
										value="#{bundle.aon_check_all}"
										rendered="#{delivery.salesTransferManager.salesModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkAll"
										actionListener="#{delivery.salesTransferManager.checkAllSales}" 
										reRender="salesData,detailDataContainer" />
									<aon:commandButton id="salesTransfer-selectNone"
										value="#{bundle.aon_uncheck_all}"
										rendered="#{delivery.salesTransferManager.salesModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkNone"
										actionListener="#{delivery.salesTransferManager.checkNoneSales}" 
										reRender="salesData,detailDataContainer" />	
									<aon:commandButton id="salesTransfer-accept"
										value="#{bundle.warehouse_delivery_to_transfer}"
										rendered="#{delivery.salesTransferManager.salesModel.rowCount > 0}"
										reRender="showSalesTransferWindow,deliveryForm,showConfirmWindow"
										actionListener="#{delivery.onSalesTransfer}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
									</aon:commandButton>
									<aon:commandButton id="salesTransfer-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showSalesTransferWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{delivery.showSalesTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{delivery.salesTransferManager}"
											value="#{null}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">

									<aon:dataTable id="salesData" value="#{delivery.salesTransferManager.salesModel}"
										var="to" rows="10" rendered="#{delivery.salesTransferManager.salesModel.rowCount > 0}"
										columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
											aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">

										<aon:column styleClass="#{delivery.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:selectBooleanCheckbox id="SalesCheck"
												value="#{delivery.salesTransferManager.salesRowChecked}"
												valueChangeListener="#{delivery.salesTransferManager.salesRowSelected}"
												reRender="detailDataContainer" ajaxSingle="true" />	
										</aon:column>
			
										<aon:column styleClass="#{delivery.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
											</f:facet>
											<aon:outputText value="#{to.referenceCode}" />
										</aon:column>

										<aon:column styleClass="#{delivery.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.issueDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{delivery.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_customer}" />
											</f:facet>
											<aon:outputText value="#{to.customer.registry.fullName}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{delivery.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_total}" />
											</f:facet>
											<aon:outputText value="#{delivery.salesTransferManager.salesTotalPrice}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{delivery.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:commandButton value="&#160;" immediate="true"
												title="#{bundle.warehouse_delivery_see_sales_details}"
												styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
												actionListener="#{delivery.salesTransferManager.onSelectSales}"
												reRender="salesData,detailDataContainer" ajaxSingle="true">
											</aon:commandButton>															
										</aon:column>
									</aon:dataTable>
					
									<aon:dataScroller for="salesData" showNote="true" pageSize="10"
										rowCount="#{delivery.salesTransferManager.salesModel.rowCount}" />

									<aon:div id="detailDataContainer">
										<aon:dataTable id="detailData" value="#{delivery.salesTransferManager.detailModel}"
											var="to" rows="0" rendered="#{delivery.salesTransferManager.detailModel.rowCount > 0}"
											columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
												aon-editDataTable-iconColumn">
	
											<aon:column>
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:selectBooleanCheckbox id="DetailCheck"
													value="#{delivery.salesTransferManager.detailRowChecked}"
													rendered="#{!to.item.wildCard}"
													valueChangeListener="#{delivery.salesTransferManager.detailRowSelected}"
													reRender="salesData,transfered" ajaxSingle="true" />	
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_product}" />
												</f:facet>
												<aon:outputText value="#{to.description}">
													<aon:abbreviateConverter maxWidth="50" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_price}" />
												</f:facet>
												<aon:outputText value="#{(to.price)}">
													<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_discount}" />
												</f:facet>
												<aon:outputText value="#{to.discountExpression.discountExpr}">
													<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_pending}" />
												</f:facet>
												<aon:outputText value="#{(to.pendingQuantity)}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_transfer}" />
												</f:facet>
												<aon:inputText id="transfered"
													value="#{to.transfered}" size="4"
													rendered="#{!to.item.wildCard}">	
													<a4j:support event="onchange" reRender="salesData,detailDataContainer" ajaxSingle="true" requestDelay="10"
														actionListener="#{delivery.salesTransferManager.onTransferedChanged}" />
												</aon:inputText>
											</aon:column>
											
											<aon:column id="buttonColumn">
												<f:facet name="header">
													<h:outputText value="&#160;" />
												</f:facet>
												<aon:div>
													<aon:outputText value="&#160;&#160;&#160;"
														rendered="#{delivery.salesTransferManager.transferedGreatherThanPending}" 
														styleClass="aon-padding-right aon-icon-point-orange" 
														title="#{bundle.warehouse_income_transfered_gt_quantity}" />
													
													<aon:commandButton value="&#160;" immediate="true"
														rendered="#{delivery.salesTransferManager.detailRowChecked and delivery.salesTransferManager.transferedLessThanPending}" 
														title="#{(to.forcePendingQuantityCancel)?(bundle.warehouse_income_purchase_product_transfered):(bundle.warehouse_income_purchase_product_pending)}"
														styleClass="aon-icon-commandButton #{(to.forcePendingQuantityCancel)?('aon-icon-point-red'):('aon-icon-point-light-green')}"
														actionListener="#{delivery.salesTransferManager.detailToCloseRowSelected}"
														reRender="buttonColumn" ajaxSingle="true">
													</aon:commandButton>
													
													<aon:outputText value="&#160;"
														title="#{bundle.product_item_serializable_wildcard_error}"
														rendered="#{to.item.wildCard}"
														styleClass="aon-finding-toolbar-item aon-icon-errorwarning aon-finding-toolbar-item-no-border" />
												</aon:div>
											</aon:column>
	
										</aon:dataTable>
									</aon:div>
					
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
