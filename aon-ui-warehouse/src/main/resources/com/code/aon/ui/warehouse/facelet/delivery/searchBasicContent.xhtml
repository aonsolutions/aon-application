<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="currentUserScopes" default="#{configCollections.currentUserScopes}" />

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.customer}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{searchController.project}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Delivery_issueTime-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Delivery_issueTime-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Delivery_issueTime-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Delivery_issueTime-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
	<aon:outputLabel for="Delivery_workPlace_id"
		value="#{bundle.purchase_workplace}" />
	<aon:selectOneMenu id="Delivery_workPlace_id"
		value="#{searchController.workPlace}"
		valueChangeListener="#{controller.addIdEqualExpression}"
		reRender="aonContent:deliverySearch:Delivery_lines_warehouse_id">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
	</aon:selectOneMenu>		

	<aon:if test="#{currentUserScopes[1] != null}">
		<aon:outputLabel for="Delivery_scope_id"
			value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="Delivery_scope_id"
			value="#{configCollections.scope}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{currentUserScopes}" />
		</aon:selectOneMenu>
	</aon:if>					

	<aon:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Delivery_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Delivery_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</aon:if>

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{searchController.deliveryStatuses}">
		<f:selectItems value="#{warehouseCollections.deliveryStatuses}" />
	</aon:selectManyCheckbox>						
	
</ui:composition>
