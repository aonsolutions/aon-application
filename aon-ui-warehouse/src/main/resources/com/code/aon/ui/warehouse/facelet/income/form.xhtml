<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="incomeForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{warehouseBundle.warehouse_income_module}" />
					<ui:param name="controller" value="#{income}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!income.pending}" />
					<ui:param name="skipRemoveButton" value="#{!income.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="purchaseTransfer"
							value="#{warehouseBundle.warehouse_income_purchase}"
							immediate="#{true}" rendered="#{!income.new and income.pending}"
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							actionListener="#{income.onPurchaseTransferShow}"
							reRender="showPurchaseTransferWindow">
							<f:setPropertyActionListener target="#{income.showPurchaseTransferWindow}"
								value="#{true}" />
						</aon:commandButton>
						<c:if test="#{aonRole.financeOperator}">
							<aon:commandButton id="invoice"
								value="#{warehouseBundle.warehouse_income_to_invoice}"
								immediate="#{true}" rendered="#{income.pending and incomeDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-favorite"
								actionListener="#{income.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{income.showInvoiceWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<aon:htmlCommandLink id="incomeForm-report" value="#{warehouseBundle.warehouse_income}"
							target="_new" rendered="#{!income.new and incomeDetail.model.rowCount > 0}"
							action="#{report.onExecute}" 
							disabled="#{incomeDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="incomeForm" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Income_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:inputText id="Income_series" 
									value="#{income.to.series}" rendered="#{income.pending}"
									size="4" />
								<aon:inputText id="Income_number" styleClass="aon-margin-left" 
									value="#{income.to.number}" rendered="#{income.pending}"
									required="true" size="7" />
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{income.to.referenceCode}"
									rendered="#{!income.pending}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Income_securityLevel"
										value="#{income.to.confidential}"
										rendered="#{income.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{income.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!income.pending and income.to.confidential}" />
								</c:if>

								<aon:outputText styleClass="aon-margin-left"
									value="#{income.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{financeBundle.finance_invoice}: "
									rendered="#{income.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{income.invoiceCode}"
									rendered="#{income.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{income.invoiced}" />
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Income_issueTime" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Income_issueTime"
						value="#{income.to.issueTime}" 
						required="true" disabled="#{!income.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
						<ui:param name="lookupTo" value="#{income.to.supplier}" />
						<ui:param name="lookupDisabled" value="#{!income.pending}" />
						<ui:param name="lookupReRender" 
							value="Supplier_registry_document,IncomeAddress,Income_scope,Income_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{income.supplierData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Supplier_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Supplier_registry_document" 
						value="#{income.to.supplier.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Income_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="IncomeAddress">
						<aon:selectOneMenu id="Income_address" 
							value="#{income.to.registryAddress}" rendered="#{income.addressCount > 0}"
							disabled="#{!income.pending}">
							<f:selectItems value="#{income.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{income.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Income_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Income_scope" 
						value="#{income.to.scope}"
						disabled="#{!income.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Income_warehouse" 
						value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Income_warehouse" 
						value="#{income.warehouse}"
						disabled="#{!income.new}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Income_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Income_workPlace" 
						value="#{income.to.workPlace}"
						disabled="#{!income.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Income_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Income_defaultPayMethod" 
						value="#{income.defaultPayMethod}"
						disabled="#{!income.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_income_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_income_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Income_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Income_total" styleClass="aon-bold" 
						value="#{income.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{income.defaultPayMethod != null and !income.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Income_payMethod" 
								value="#{income.to.payMethod}"
								disabled="#{!income.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Income_numberOfPayments"
								value="#{income.to.numberOfPayments}"
								disabled="#{!income.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Income_daysToFirstPayment"
								value="#{income.to.daysToFirstPayment}"
								disabled="#{!income.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Income_daysBetweenPayments"
								value="#{income.to.daysBetweenPayments}"
								disabled="#{!income.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Income_paymentDays"
								value="#{income.to.paymentDays}" 
								disabled="#{!income.pending}" size="5" />
							<ui:include src="/com/code/aon/ui/registry/facelet/rbank/lookup.xhtml">
								<ui:param name="lookupTo" value="#{income.to.bank}" />
								<ui:param name="lookupDisabled" value="#{!income.pending}" />
							</ui:include>								
							<aon:div>
								<aon:inputText id="Income_bank_office"
									value="#{income.to.bankAccount.office}"
									disabled="#{!income.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Income_bank_control"
									value="#{income.to.bankAccount.control}"
									disabled="#{!income.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Income_bank_account"
									value="#{income.to.bankAccount.account}"
									disabled="#{!income.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!income.new}">
						<f:facet name="header">
							<aon:outputText value="#{warehouseBundle.warehouse_income_detail}" />
						</f:facet>
						<ui:include src="/com/code/aon/ui/warehouse/facelet/income/formDetail.xhtml" />
					</aon:panel>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/income/modalTransfer.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/income/modalInvoice.xhtml" />
 	</ui:define>
</ui:composition>
