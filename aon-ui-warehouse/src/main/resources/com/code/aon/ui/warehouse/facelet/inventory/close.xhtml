<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="inventoryCloseForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_inventory_remake_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">		
					<aon:commandButton id="search" 
						value="#{bundle.aon_search}" immediate="true"
						action="inventory_search" actionListener="#{inventory.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:commandButton id="back"
						value="#{bundle.aon_back}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						actionListener="#{inventory.onCancel}"
						action="inventory_list"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:commandButton id="accept"
						value="#{warehouseBundle.warehouse_inventory_close}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{inventory.onClosing}"
						action="inventory_form"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Inventory_warehouse"
						value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Inventory_warehouse" 
						value="#{inventory.warehouse}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Inventory_inventory_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Inventory_inventory_date" 
						value="#{inventory.to.inventoryDate}" required="true" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
							
					<aon:outputLabel for="Inventory_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Inventory_description" 
						value="#{inventory.to.description}"
						required="true" size="64" />

					<aon:outputLabel for="Inventory_init"
						value="#{warehouseBundle.warehouse_inventory_init_stock}" />
					<aon:selectOneRadio id="Inventory_init"
						value="#{inventory.initStock}">
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
					</aon:selectOneRadio>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
	
</ui:composition>
