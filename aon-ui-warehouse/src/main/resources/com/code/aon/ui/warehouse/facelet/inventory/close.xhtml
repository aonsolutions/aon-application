<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="inventoryCloseForm">
			<aon:div id="closeToolbar">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{bundle.warehouse_inventory_remake_module}" />
					<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />
					<ui:define name="toolbarContent">		
						<aon:if test="#{inventory.closeButton1}">
							<aon:commandButton id="accept"
								value="#{bundle.warehouse_inventory_close_module}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{inventory.onClosing}"
								action="inventory_form"
								accesskey="#{bundle.aon_key_cancel}" />
						</aon:if>
						<aon:if test="#{inventory.closeButton2}">
							<aon:commandButton id="accept22"
								value="#{bundle.warehouse_inventory_close_module}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{inventory.onContinueClosing}"
								accesskey="#{bundle.aon_key_cancel}" 
								reRender="showSeriesNumberWindow" >
							</aon:commandButton>
						</aon:if>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Inventory_warehouse"
						value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="Inventory_warehouse" 
						value="#{inventory.warehouse}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Inventory_inventory_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Inventory_inventory_date" 
						value="#{inventory.to.inventoryDate}" required="true" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
							
					<aon:outputLabel for="Inventory_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Inventory_description" 
						value="#{inventory.to.description}"
						required="true" size="64" />

					<aon:outputLabel for="Inventory_init"
						value="#{bundle.warehouse_inventory_init_stock}" />
					<aon:selectOneRadio id="Inventory_init"
						value="#{inventory.initStock}"
						reRender="closeToolbar"
						>
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
						
					</aon:selectOneRadio>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{allItemLookup}" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/inventory/modalSeriesNumber.xhtml" />
		
	</ui:define>
	
</ui:composition>
