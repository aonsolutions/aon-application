<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="warehouseTransferList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_transfer_module}" />
				<ui:param name="controller" value="#{warehouseTransfer}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{warehouseTransfer}" />
					
					<ui:define name="columns">
						<aon:column alias="WarehouseTransfer.series,WarehouseTransfer.number"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>

						<aon:column alias="WarehouseTransfer.issueTime"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueTime}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="WarehouseTransfer.sourceWarehouse.name"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_source}" />
							</f:facet>
							<aon:outputText value="#{to.sourceWarehouse.name}" />
						</aon:column>

						<aon:column alias="WarehouseTransfer.targetWarehouse.name"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<h:outputText value="#{warehouseBundle.warehouse_stock_target}" />
							</f:facet>
							<aon:outputText value="#{to.targetWarehouse.name}" />
						</aon:column>
						
						<aon:column alias="WarehouseTransfer.comments"
							styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_comment}" />
							</f:facet>
							<aon:outputText value="#{to.comments}" />
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
