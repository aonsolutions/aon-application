<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="inventoryList">

			<aon:methodParam name="resetActionListener" value="#{inventory.onStartClosing}" type="actionListener" />
			<aon:methodParam name="resetAction" value="inventory_close"/>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_inventory_closed_module}" />
				<ui:param name="controller" value="#{inventory}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="inventory-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="inventory" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>				
					<aon:htmlCommandLink id="inventory-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory" />
					</aon:htmlCommandLink>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{inventory}" />
					<ui:define name="columns">

						<aon:column alias="Inventory.inventoryDate" 
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.inventoryDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									type="both" timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column	alias="Inventory.id" 
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{(to.closed)?(bundle.aon_closed):(bundle.aon_opened)}" />
						</aon:column>
												
						<aon:column alias="Inventory.warehouse.id"
							 styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_warehouse}" />
							</f:facet>
							<aon:outputText value="#{to.warehouse.name}" />
						</aon:column>

						<aon:column alias="Inventory.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
