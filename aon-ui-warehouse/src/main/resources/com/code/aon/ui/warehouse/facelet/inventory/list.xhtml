<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="inventoryList">

			<aon:methodParam name="resetActionListener" value="#{inventory.onStartClosing}" type="actionListener" />
			<aon:methodParam name="resetAction" value="inventoryClose"/>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_inventory_remake_module}" />
				<ui:param name="controller" value="#{inventory}" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="inventoryData" value="#{inventory.model}"
					var="to" rows="20" rendered="#{inventory.model.rowCount > 0}"
					columnClasses="aon-editDataTable-numberColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-numberColumn">

					<aon:rowSelector action="inventory_form" actionListener="#{inventory.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.inventoryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								type="both" timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{warehouseBundle.warehouse_warehouse}" />
						</f:facet>
						<aon:outputText value="#{to.warehouse.name}" />
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="inventoryData" showNote="true" />
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
