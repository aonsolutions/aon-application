<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="stockSearch" onload="#{stockExport.initialize}">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_stock_module}" />
				<ui:param name="controller" value="#{stock}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:define name="additionalToolbarContent">
						<ui:include
							src="/com/esferalia/aon/gwt/aio/facelet/templates/silent.xhtml" />
						<aon:commandLink id="stock-export" value="Exportar"
							onclick="stockx()"
							styleClass="aon-finding-toolbar-item aon-icon-export-excel-trans">
						</aon:commandLink>
				</ui:define>
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{stock}" />
				<ui:param name="searchController" value="#{stockSearch}" />
				<ui:param name="skipAfterSearch" value="#{true}" />

				<ui:define name="searchContent">
				
					<aon:outputText value="" />
					<aon:div styleClass="aon-width-650">
				
						<aon:panelCollapsible expanded="true" label="#{bundle.aon_general}">
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">

								<aon:outputLabel for="Stock_warehouse_id" value="#{bundle.aon_module_warehouse}" />
								<aon:selectOneMenu id="Stock_warehouse_id"
									value="#{stockExport.warehouse}"
									valueChangeListener="#{stock.addIdEqualExpression}">
									<f:selectItem itemLabel="-" value="#{null}"/>
									<f:selectItems value="#{warehouseCollections.warehouses}" />
								</aon:selectOneMenu>
							
								<aon:outputLabel for="Stock_quantity" value="#{bundle.aon_quantity}" />
								<aon:inputText id="Stock_quantity" size="10"
									value="#{stockExport.quantity}"
									valueChangeListener="#{stock.addExpression}" />				

							</aon:panelGrid>
						</aon:panelCollapsible>					
									
						<aon:panelCollapsible expanded="true" label="#{bundle.aon_product}" >
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		

								<aon:outputLabel for="Stock_item_product_code"
									value="#{bundle.aon_id}" />
								<aon:inputText id="Stock_item_product_code" size="25"
									value="#{stockExport.code}"
									valueChangeListener="#{controller.addExpression}"
									onblur="toUpperCase(this);" />
							
								<aon:outputLabel for="Stock_item_product_name"
									value="#{bundle.aon_name}" />
								<aon:inputText id="Stock_item_product_name" size="50"
									value="#{stockExport.name}"
									valueChangeListener="#{controller.addExpression}" />
							
								<aon:if test="#{aonConfiguration.bean.product.showBarcode}">
									<aon:outputLabel for="Stock_item_barcode"
										value="#{bundle.product_barcode}" />
									<aon:inputText id="Stock_item_barcode" size="25"
										value="#{stockExport.barcode}"
										valueChangeListener="#{controller.addExpression}" />
								</aon:if>

								<aon:outputLabel for="Stock_item_suppliers_code"
									value="#{bundle.product_item_supplier_code}" />
								<aon:inputText id="Stock_item_suppliers_code" size="25"
									value="#{stockExport.provider}"
									valueChangeListener="#{controller.addExpression}" />
							
								<aon:outputLabel for="Stock_item_product_category_id"
									value="#{bundle.aon_category}" />
								<aon:selectOneMenu id="Stock_item_product_category_id"
									value="#{searchController.category}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{productCollections.categories}" />
								</aon:selectOneMenu>
								
								<aon:if test="#{aonConfiguration.bean.product.showType}">
									<aon:outputLabel for="Stock_item_product_type"
										value="#{bundle.aon_type}" />
									<aon:selectOneMenu id="Stock_item_product_type"
										converter="aon.EnumConverter"
										valueChangeListener="#{controller.addExpression}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{productCollections.commonProductTypes}" />
									</aon:selectOneMenu>
								</aon:if>	

								<aon:if test="#{aonConfiguration.bean.product.showBrand and productCollections.brandsCount > 0}">
									<aon:outputLabel for="Stock_item_product_brand_id"
										value="#{bundle.tas_make}" />
									<aon:selectOneMenu id="Stock_item_product_brand_id"
										value="#{stockExport.brand}"
										valueChangeListener="#{controller.addIdEqualExpression}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{productCollections.brands}" />
									</aon:selectOneMenu>
								</aon:if>
														
								<ui:include 
									src="/com/code/aon/ui/config/facelet/tag/input.xhtml" />
								
								<aon:outputText for="Stock_item_product_status"
									value="#{bundle.aon_status}"/>
								<aon:selectManyCheckbox id="Stock_item_product_status"
									value="#{searchController.statuses}">
									<f:selectItems value="#{productCollections.productStatuses}"/>
								</aon:selectManyCheckbox>				

							</aon:panelGrid>
						</aon:panelCollapsible>
								
					</aon:div>				
				
				</ui:define>
			</ui:decorate>
		</aon:form>

	</ui:define>
	
</ui:composition>
