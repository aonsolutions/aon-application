<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="stockSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_stock_module}" />
				<ui:param name="controller" value="#{stock}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{stock}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="Stock_warehouse_id"
						value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Stock_warehouse_id"
						value="#{warehouseCollections.warehouse}"
						valueChangeListener="#{stock.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>
				
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
						<ui:param name="lookupTo" value="#{stockSearch.item}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<aon:outputLabel for="Stock_quantity"
						value="#{bundle.aon_quantity}" />
					<aon:inputText id="Stock_quantity" size="60"
						valueChangeListener="#{stock.addExpression}" />				
				
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
	
</ui:composition>
