<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEdiFtpWindow">
		<aon:if test="#{delivery.ftpEdiUploader.showEdiFtpWindow}">
			<rich:modalPanel id="ediFtpModalPanel" minHeight="240"
				minWidth="520" rendered="#{delivery.ftpEdiUploader.showEdiFtpWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Servidor FTP de Seres: enviar albaran" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showEdiFtpWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{delivery.ftpEdiUploader.showEdiFtpWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="ediFtpForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:outputText value="&#160;"
										styleClass="aon-finding-toolbar-item" />
									<!--  
									<aon:commandButton id="ediFtp-accept"
										value="Enviar"
										actionListener="#{delivery.ftpEdiUploader.onEdiFtpTransfer}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="ediFtpModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{delivery.ftpEdiUploader.showEdiFtpWindow}"
											value="#{false}" />
									</aon:commandButton>
									-->
									<aon:commandButton id="ediFtp-showSettings"
										value="&#160;" ajaxSingle="#{true}"
										title="Mostrar opciones de configuracion"
										rendered="#{!delivery.ftpEdiUploader.showFtpServerConnectionData}"
										actionListener="#{delivery.ftpEdiUploader.onShowFtpServerConnectionData}"
										reRender="showEdiFtpWindow"
										styleClass="aon-finding-toolbar-item aon-noborder aon-icon-config"
										style="font-size:1em;font-weight:bold;float:right;">
									</aon:commandButton>
									<aon:commandButton id="ediFtp-hideSettings"
										value="&#160;" ajaxSingle="#{true}"
										title="Ocultar opciones de configuracion"
										rendered="#{delivery.ftpEdiUploader.showFtpServerConnectionData}"
										actionListener="#{delivery.ftpEdiUploader.onShowFtpServerConnectionData}"
										reRender="showEdiFtpWindow"
										styleClass="aon-finding-toolbar-item aon-noborder aon-icon-config"
										style="font-size:1em;font-weight:bold;float:right;">
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									
									<aon:if test="#{delivery.ftpEdiUploader.showFtpServerConnectionData}">
										<aon:panelGrid columns="2" dir="true" style="width: 100%;">
											<aon:outputLabel for="EdiFtp_serverName"
												value="Nombre servidor" />
											<aon:inputText id="EdiFtp_serverName"
												value="#{delivery.ftpEdiUploader.server}"
												size="30"
												required="#{true}" />
												
											<aon:outputLabel for="EdiFtp_remotePath"
												value="Directorio remoto FTP" />
											<aon:inputText id="EdiFtp_remotePath"
												value="#{delivery.ftpEdiUploader.remotePath}"
												size="30"
												required="#{true}" />
										</aon:panelGrid>
											
										<aon:panel>
											<f:facet name="header">
												<aon:outputText value="Datos de acceso" />
											</f:facet>
											<aon:panelGrid columns="4" dir="true" style="width: 100%;">
												<aon:outputLabel for="EdiFtp_username"
													value="Usuario" />
												<aon:inputText id="EdiFtp_username"
													value="#{delivery.ftpEdiUploader.user}"
													required="#{true}" />
												
												<aon:outputLabel for="EdiFtp_password"
													value="Contraseña" />
												<aon:inputSecret id="EdiFtp_password"
													value="#{delivery.ftpEdiUploader.password}"
													redisplay="true"
													required="#{true}" />
											</aon:panelGrid>
										</aon:panel>
									</aon:if>
									
									<aon:commandButton id="ediFtp-accept"
										value="Enviar"
										actionListener="#{delivery.ftpEdiUploader.onEdiFtpTransfer}"
										styleClass="aon-commandButton aon-padding aon-width-all aon-border"
										onclick="Richfaces.showModalPanel('waitProccess')" 
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="ediFtpModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{delivery.ftpEdiUploader.showEdiFtpWindow}"
											value="#{false}" />
									</aon:commandButton>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
