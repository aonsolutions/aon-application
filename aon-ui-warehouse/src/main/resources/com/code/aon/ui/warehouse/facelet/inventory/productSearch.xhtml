<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<a4j:region>
		<aon:panelCollapsible 
			label="#{warehouseBundle.warehouse_inventory_filter}:"
			headerClass="aon-panelGrid-search-info" 
			bodyClass="aon-panelGrid-search"				
			value="#{inventoryDetail.showSearchPanel}" >

			<aon:panelGrid columns="2">
				
				<aon:outputLabel for="Inventory_productCode"
					value="#{bundle.aon_id}" />
				<aon:inputText id="Inventory_productCode" size="15"
					value="#{inventoryDetail.code}" />
				
				<aon:outputLabel for="Inventory_productDescription"
					value="#{bundle.aon_product}" />
				<aon:inputText id="Inventory_productDescription" size="80"
					value="#{inventoryDetail.description}" />
			
				<aon:outputLabel for="Inventory_category"
			  		value="#{bundle.aon_category}"  />
				<aon:selectOneMenu id="Inventory_category" 
					value="#{inventoryDetail.category}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{productCollections.categories}" />
				</aon:selectOneMenu>		
			
				<aon:outputLabel for="Inventory_productBrand"
			  		value="#{productBundle.product_brand}"  />
				<aon:selectOneMenu id="Inventory_productBrand" 
					value="#{inventoryDetail.brand}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{productCollections.brands}" />
				</aon:selectOneMenu>		
				
				<aon:outputText value="" />
				<aon:commandButton id="search"
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}" status="aonStatus"
					styleClass="aon-icon-rubber aon-search-lookup-button"
					actionListener="#{inventoryDetail.loadDetailModel}"
					requestDelay="100" accesskey="#{bundle.aon_key_search}" >
					<aon:actionHotKey key="return" />
					<ui:insert name="searchButtonContent"/>
				</aon:commandButton>
			
			</aon:panelGrid>
		</aon:panelCollapsible>
	</a4j:region>

</ui:composition>
