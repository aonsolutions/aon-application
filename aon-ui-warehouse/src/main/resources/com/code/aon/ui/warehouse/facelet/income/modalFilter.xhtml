<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showPurchaseFilterWindow">
		<c:if test="#{income.showPurchaseFilterWindow}">
			<rich:modalPanel id="purchaseFilterModalPanel" minHeight="400"
				minWidth="650" rendered="#{income.showPurchaseFilterWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_filter}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showPurchaseFilterWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{income.showPurchaseFilterWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="purchaseFilterForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="purchaseFilter-search"
										value="#{bundle.aon_search}"
										reRender="showPurchaseTransferWindow,showPurchaseFilterWindow"
										actionListener="#{income.onFilterTransferModel}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
					     				oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="purchaseFilterModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{income.showPurchaseFilterWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="purchaseFilter-clear"
										value="#{bundle.aon_clear}"
										reRender="showPurchaseFilterWindow"
										styleClass="aon-finding-toolbar-item aon-icon-rubber" >
										<f:setPropertyActionListener
											target="#{income.purchaseTransferManager.filterParams}"
											value="#{null}" />
									</aon:commandButton>
									<aon:commandButton id="purchaseFilter-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showPurchaseFilterWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{income.showPurchaseFilterWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								
								<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
									<ui:param name="skipSearchButton" value="#{true}" />
									<ui:param name="skipFocusFirst" value="#{true}" />
									<ui:define name="searchContent">
										<aon:outputLabel for="#{aliasPreffix}_series"
											value="#{bundle.aon_series}" />
										<aon:div>
											<aon:inputText id="#{aliasPreffix}_series"
												onblur="toUpperCase(this);"
												value="#{income.purchaseTransferManager.filterParams.series}"
												size="5" maxlength="5">
											</aon:inputText>
											<aon:outputLabel for="#{aliasPreffix}_number-From"
												styleClass="aon-form-date-label aon-padding-right"
												value="#{bundle.aon_date_from} #{bundle.aon_number}:" />
											<aon:inputText id="#{aliasPreffix}_number-From"
												converter="javax.faces.Integer" size="7"
												value="#{income.purchaseTransferManager.filterParams.numberFrom}" />							
											<aon:outputLabel for="#{aliasPreffix}_number-To"
												styleClass="aon-form-date-label aon-padding-right"
												value="#{bundle.aon_date_to} #{bundle.aon_number}:" />							
											<aon:inputText id="#{aliasPreffix}_number-To"
												converter="javax.faces.Integer" size="7"
												value="#{income.purchaseTransferManager.filterParams.numberTo}" />							
										</aon:div>
	
										<aon:outputText for="PurchaseTransfer_date"
											value="#{bundle.aon_date}" />
										<aon:div>
											<aon:outputLabel for="IncomeTransfer_date-From"
												styleClass="aon-form-date-label aon-padding-right"
												value="#{bundle.aon_date_from}" />
											<aon:selectInputDate id="IncomeTransfer_date-From"
												value="#{income.purchaseTransferManager.filterParams.fromDate}"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
											<aon:outputLabel for="IncomeTransfer_date-To"
												styleClass="aon-form-date-label aon-padding-right"
												value="#{bundle.aon_date_to}" />							
											<aon:selectInputDate id="IncomeTransfer_date-To"
												value="#{income.purchaseTransferManager.filterParams.toDate}"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
										</aon:div>
									</ui:define>
								</ui:decorate>

							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
