<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{warehouseBundle.warehouse_delivery_module}" />
					<ui:param name="controller" value="#{delivery}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!delivery.pending}" />
					<ui:param name="skipRemoveButton" value="#{!delivery.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="salesTransfer"
							value="#{warehouseBundle.warehouse_delivery_sales}"
							immediate="#{true}" rendered="#{!delivery.new and delivery.pending}"
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							actionListener="#{delivery.onSalesTransferShow}"
							reRender="showSalesTransferWindow">
							<f:setPropertyActionListener target="#{delivery.showSalesTransferWindow}"
								value="#{true}" />
						</aon:commandButton>
						<c:if test="#{aonRole.financeOperator}">
							<aon:commandButton id="invoice"
								value="#{warehouseBundle.warehouse_delivery_to_invoice}"
								immediate="#{true}" rendered="#{delivery.pending and deliveryDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-favorite"
								actionListener="#{delivery.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{delivery.showInvoiceWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<aon:commandButton value="&#160;" id="email"
							title="#{webmailBundle.webmail_send_email}"
							rendered="#{deliveryDetail.model.rowCount > 0 and deliveryDetail.to == null}"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
							<aon:actionListener method="#{delivery.onSendByEmail}" />
						</aon:commandButton>															
						<aon:htmlCommandLink id="delivery-report" value="#{warehouseBundle.warehouse_delivery}"
							target="_new" rendered="#{!delivery.new and deliveryDetail.model.rowCount > 0}"
							action="#{report.onExecute}" 
							disabled="#{deliveryDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="delivery" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Delivery_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:selectOneMenu id="Delivery_series" 
									value="#{delivery.to.series}" rendered="#{delivery.new}"
									valueChangeListener="#{delivery.onSeriesChanged}" 
									reRender="Delivery_number,Delivery_securityLevel">
									<f:selectItem itemLabel=" " itemValue="#{null}" />
									<f:selectItems value="#{configCollections.deliverySeriesIds}" />
								</aon:selectOneMenu>
								<aon:inputText id="Delivery_number" styleClass="aon-margin-left" 
									value="#{delivery.to.number}" rendered="#{delivery.new}" 
									required="true" size="7" />
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{delivery.to.referenceCode}"
									rendered="#{!delivery.new}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Delivery_securityLevel"
										value="#{delivery.to.confidential}"
										rendered="#{delivery.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{delivery.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!delivery.pending and delivery.to.confidential}" />
								</c:if>

								<aon:outputText styleClass="aon-margin-left"
									value="#{delivery.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{financeBundle.finance_invoice}: "
									rendered="#{delivery.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{delivery.invoiceCode}"
									rendered="#{delivery.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{delivery.invoiced}" />
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Delivery_issueTime" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Delivery_issueTime"
						value="#{delivery.to.issueTime}" 
						required="true" disabled="#{!delivery.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{delivery.to.customer}" />
						<ui:param name="lookupDisabled" value="#{!delivery.pending or delivery.to.project.id != null}" />
						<ui:param name="lookupReRender" 
							value="Customer_registry_document,DeliveryAddress,DeliveryProject,Delivery_scope,Delivery_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{delivery.customerData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Customer_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document" 
						value="#{delivery.to.customer.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Delivery_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="DeliveryAddress">
						<aon:selectOneMenu id="Delivery_address" 
							value="#{delivery.to.registryAddress}" rendered="#{delivery.addressCount > 0}"
							disabled="#{!delivery.pending}">
							<f:selectItems value="#{delivery.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{delivery.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Delivery_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Delivery_scope" 
						value="#{delivery.to.scope}"
						disabled="#{!delivery.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_warehouse" 
						value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Delivery_warehouse" 
						value="#{delivery.warehouse}"
						disabled="#{!delivery.new}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Delivery_workPlace" 
						value="#{delivery.to.workPlace}"
						disabled="#{!delivery.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Delivery_defaultPayMethod" 
						value="#{delivery.defaultPayMethod}"
						disabled="#{!delivery.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_delivery_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_delivery_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Delivery_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Delivery_total" styleClass="aon-bold" 
							value="#{delivery.totalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>
 
				</aon:panelGrid>

				<aon:div id="DeliveryProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{delivery.to.project.id != null or (delivery.pending and delivery.projectCount > 0)}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<c:if test="#{!aonConfiguration.bean.delivery.showTasData}">
							<aon:outputLabel for="Delivery_project"
								value="#{projectBundle.project_project}" />
						</c:if>
						<c:if test="#{aonConfiguration.bean.delivery.showTasData}">
							<aon:outputLabel for="Delivery_project"
								value="#{tasBundle.tas_projectTas}" />
						</c:if>
						<aon:div>
							<aon:selectOneMenu id="Delivery_project"
								rendered="#{delivery.pending and delivery.to.project.id == null and delivery.projectCount > 0}"
								value="#{delivery.to.project}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{delivery.projects}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{delivery.to.project.name}" 
								rendered="#{delivery.to.project.id != null}" />
							<aon:div layout="inline" styleClass="aon-margin-left">
								<aon:commandButton id="removeDeliveryProject" 
									value="&#160;" title="#{bundle.aon_remove}" 
									styleClass="aon-icon-commandButton aon-icon-delete"
									rendered="#{delivery.pending and delivery.to.project.id != null}"
									actionListener="#{delivery.removeDeliveryProject}" 
									reRender="deliveryForm" />
							</aon:div>
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div>
						<aon:outputLabel for="Delivery_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Delivery_comments" cols="80" rows="3"
						disabled="#{!delivery.pending}"
						value="#{delivery.to.comments}" />

					<aon:div>
						<aon:outputLabel for="Delivery_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Delivery_remarks" cols="80" rows="3"
						disabled="#{!delivery.pending}"
						value="#{delivery.to.remarks}" />

				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{delivery.defaultPayMethod != null and !delivery.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Delivery_payMethod" 
								value="#{delivery.to.payMethod}"
								disabled="#{!delivery.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Delivery_numberOfPayments"
								value="#{delivery.to.numberOfPayments}"
								disabled="#{!delivery.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Delivery_daysToFirstPayment"
								value="#{delivery.to.daysToFirstPayment}"
								disabled="#{!delivery.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Delivery_daysBetweenPayments"
								value="#{delivery.to.daysBetweenPayments}"
								disabled="#{!delivery.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Delivery_paymentDays"
								value="#{delivery.to.paymentDays}" 
								disabled="#{!delivery.pending}" size="5" />
							<ui:include src="/com/code/aon/ui/registry/facelet/rbank/lookup.xhtml">
								<ui:param name="lookupTo" value="#{delivery.to.bank}" />
								<ui:param name="lookupDisabled" value="#{!delivery.pending}" />
							</ui:include>								
							<aon:div>
								<aon:inputText id="Delivery_bank_office"
									value="#{delivery.to.bankAccount.office}"
									disabled="#{!delivery.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Delivery_bank_control"
									value="#{delivery.to.bankAccount.control}"
									disabled="#{!delivery.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Delivery_bank_account"
									value="#{delivery.to.bankAccount.account}"
									disabled="#{!delivery.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!delivery.new}">
						<f:facet name="header">
							<aon:outputText value="#{warehouseBundle.warehouse_delivery_detail}" />
						</f:facet>
						<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/formDetail.xhtml" />
					</aon:panel>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalTransfer.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalInvoice.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalConfirmStock.xhtml" />
		<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>
