<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.warehouse_delivery_module}" />
					<ui:param name="controller" value="#{delivery}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!delivery.pending}" />
					<ui:param name="skipRemoveButton" value="#{!delivery.pending}" />
					<ui:param name="saveButtonReRender" value="deliveryForm" />
					<ui:param name="showMoreMenu" value="#{!delivery.nevv and deliveryDetail.to == null}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton value="&#160;" id="email"
							title="#{bundle.webmail_send_email}"
							rendered="#{deliveryDetail.model.rowCount > 0 and deliveryDetail.to == null}"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
							<aon:actionListener method="#{delivery.onSendByEmail}" />
						</aon:commandButton>															
						<aon:htmlCommandLink id="delivery-report" value="#{bundle.aon_invoice_delivery}"
							target="_new" rendered="#{!delivery.nevv and deliveryDetail.model.rowCount > 0}"
							action="#{report.onExecute}" 
							disabled="#{deliveryDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="#{delivery.reportTemplate}" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
						<aon:if test="#{company.ediSupportEnabled}">
							<aon:htmlCommandLink id="delivery-udapaEdi" 
								value="#{bundle.aon_edi}" target="_blank"
								title="#{bundle.webmail_download}"
								actionListener="#{delivery.onExportUdapaEdiFile}" 
								styleClass="aon-finding-toolbar-item aon-icon-file-download">
							</aon:htmlCommandLink>
							<aon:htmlCommandLink id="delivery-edi" 
								value="#{bundle.aon_edi} (CONNECT)" target="_blank"
								title="#{bundle.webmail_download}"
								actionListener="#{delivery.onExportEdiFile}" 
								styleClass="aon-finding-toolbar-item aon-icon-file-download">
							</aon:htmlCommandLink>
							<aon:commandButton id="delivery-ediFtp"
								value="SERESNET"
								title="Enviar al servidor FTP de Seresnet"
								actionListener="#{delivery.ftpEdiUploader.onShowFtpEdi}"
								styleClass="aon-finding-toolbar-item aon-icon-seresnet">
								<f:setPropertyActionListener target="#{delivery.ftpEdiUploader.showEdiFtpWindow}"
									value="#{true}" />
							</aon:commandButton>
						</aon:if>
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:menuItem id="salesTransfer"
							value="#{bundle.aon_invoice_sales2}"
							immediate="#{true}" rendered="#{delivery.pending}"
							iconClass="aon-icon-sincronize"
							actionListener="#{delivery.onSalesTransferShow}"
							reRender="showSalesTransferWindow">
							<f:setPropertyActionListener target="#{delivery.showSalesTransferWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.financeOperator}">
							<aon:menuItem id="invoice"
								value="#{bundle.aon_key_invoice_description}"
								immediate="#{true}" rendered="#{delivery.pending and deliveryDetail.model.rowCount > 0}"
								iconClass="aon-icon-favorite"
								actionListener="#{delivery.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{delivery.showInvoiceWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="modifyWarehouse"
							value="#{bundle.warehouse_change_warehouse}"
							immediate="#{true}"
							iconClass="aon-icon-warehouse"
							actionListener="#{delivery.onWarehouseChangeShow}"
							reRender="showWarehouseChangeWindow">
							<f:setPropertyActionListener target="#{delivery.showWarehouseChangeWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:menuItem id="corporateIdentityLabel"
							value="#{bundle.registry_corporateIdentity_label}"
							iconClass="aon-icon-pdf"
							action="corporateIdentity_label"
							actionListener="#{delivery.onSelectCorporateIdentity}" />
							
						<aon:if test="#{company.ediSupportEnabled}">
							<rich:menuSeparator id="ediMenuSeparator" />
							<aon:if test="#{company.ediSupport eq 'seresnet_udapa'}">
								<aon:menuItem id="sincronizeIngenet-delivery"
									value="Sincronizar INGENET"
									iconClass="aon-icon-sincronize"
									actionListener="#{delivery.udapaDeliveryHandler.onSincronizeIngenet}" />
							</aon:if>
						</aon:if>
						
						<ui:include
							src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area" id="deliveryList">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Delivery_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
						
							<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
								<ui:param name="controller" value="#{delivery}" />
								<ui:param name="seriesChangedReRender" value="Delivery_securityLevel" />
								<ui:param name="skipSeriesLabel" value="#{true}" />
							</ui:include>
							<aon:div>
								<aon:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Delivery_securityLevel"
										value="#{delivery.to.confidential}"
										rendered="#{delivery.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{delivery.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!delivery.pending and delivery.to.confidential}" />
								</aon:if>

								<aon:outputText styleClass="aon-margin-left"
									value="#{delivery.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{bundle.finance_invoice}: "
									rendered="#{delivery.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{delivery.invoiceCode}"
									rendered="#{delivery.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{delivery.invoiced}" />
								<aon:commandLink id="invoice_link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									rendered="#{delivery.invoiced}"
									actionListener="#{delivery.onLoadInvoice}"
									action="saleInvoice_form" />
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Delivery_issueTime" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Delivery_issueTime"
						value="#{delivery.to.issueTime}" 
						required="true" disabled="#{!delivery.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{delivery.to.customer}" />
						<ui:param name="lookupDisabled" value="#{!delivery.pending or delivery.customerReadOnly}" />
						<ui:param name="lookupReRender" 
							value="Customer_registry_document,DeliveryAddress,DeliveryProject,Delivery_scope,Delivery_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{delivery.customerData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Customer_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document" 
						value="#{delivery.to.customer.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Delivery_address"
						value="#{bundle.aon_address}" />
					<aon:div id="DeliveryAddress">
						<aon:selectOneMenu id="Delivery_address" 
							value="#{delivery.to.registryAddress}" rendered="#{delivery.addressCount > 0}"
							disabled="#{!delivery.pending}">
							<f:selectItems value="#{delivery.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{bundle.registry_no_address_available}"
							rendered="#{delivery.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Delivery_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Delivery_scope" 
						value="#{delivery.to.scope}"
						disabled="true">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_workPlace" 
						value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="Delivery_workPlace" 
						value="#{delivery.to.workPlace}" required="#{true}"
						disabled="#{deliveryDetail.model.rowCount>0 and delivery.warehouse.workPlace.id!=null}"
						valueChangeListener="#{delivery.onWorkPlaceChanged}" 
						reRender="Delivery_warehouse,Delivery_scope">
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_warehouse" 
						value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="Delivery_warehouse" 
						value="#{delivery.warehouse}" required="#{true}"
						disabled="#{deliveryDetail.model.rowCount>0}">
						<f:selectItems value="#{delivery.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_defaultPayMethod" 
						value="#{bundle.finance_payMethod}" />
					<aon:selectOneRadio id="Delivery_defaultPayMethod" 
						value="#{delivery.defaultPayMethod}"
						disabled="#{!delivery.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{bundle.aon_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Delivery_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Delivery_total" styleClass="aon-bold" 
							value="#{delivery.totalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>
 
				</aon:panelGrid>

				<aon:div id="DeliveryProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{delivery.to.project.id != null or (delivery.pending and delivery.projectCount > 0)}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<aon:if test="#{!aonConfiguration.bean.delivery.showTasData}">
							<aon:outputLabel for="Delivery_project"
								value="#{bundle.aon_project}" />
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.delivery.showTasData}">
							<aon:outputLabel for="Delivery_project"
								value="#{bundle.tas_project_tas}" />
						</aon:if>
						<aon:div>
							<aon:selectOneMenu id="Delivery_project"
								rendered="#{delivery.pending and delivery.to.project.id == null and delivery.projectCount > 0}"
								value="#{delivery.to.project}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{delivery.projects}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{delivery.to.project.name}" 
								rendered="#{delivery.to.project.id != null}" />
							<aon:div layout="inline" styleClass="aon-margin-left">
								<aon:commandButton id="removeDeliveryProject" 
									value="&#160;" title="#{bundle.aon_remove}" 
									styleClass="aon-icon-commandButton aon-icon-delete"
									rendered="#{delivery.pending and delivery.to.project.id != null}"
									actionListener="#{delivery.removeDeliveryProject}" 
									reRender="deliveryForm" />
							</aon:div>
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div>
						<aon:outputLabel for="Delivery_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Delivery_comments" cols="80" rows="3"
						disabled="#{!delivery.pending}"
						value="#{delivery.to.comments}" />

					<aon:div>
						<aon:outputLabel for="Delivery_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Delivery_remarks" cols="80" rows="3"
						disabled="#{!delivery.pending}"
						value="#{delivery.to.remarks}" />

				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:if test="#{delivery.defaultPayMethod != null and !delivery.defaultPayMethod}">
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_payMethod}" />
							</f:facet>
							<aon:panelGrid columns="8" styleClass="aon-width-all" style="font-size:0.9em;"
								rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
								columnClasses="aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-50,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-100,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-150,
									aon-panelGrid-even aon-width-100">

								<aon:outputLabel for="Delivery_payMethod" value="#{bundle.aon_type}"/>
								<aon:outputLabel for="Delivery_numberOfPayments" value="#{bundle.registry_number_of_payments}" />
								<aon:outputLabel for="Delivery_daysToFirstPayment" value="#{bundle.registry_days_to_first_payment}" />
								<aon:outputLabel for="Delivery_daysBetweenPayments" value="#{bundle.registry_days_between_payments}" />
								<aon:outputLabel for="Delivery_paymentDays" value="#{bundle.registry_payment_days}" />
								<aon:outputLabel value="#{bundle.aon_iban}" />
								<aon:outputLabel for="Delivery_bankAlias" value="#{bundle.aon_bank}" />
								<aon:outputLabel for="Delivery_bic" value="#{bundle.aon_bic}" />

								<aon:selectOneMenu id="Delivery_payMethod" 
									value="#{delivery.to.payMethod}"
									disabled="#{!delivery.pending}">
									<f:selectItems value="#{configCollections.payMethods}" />
								</aon:selectOneMenu>
								<aon:inputText id="Delivery_numberOfPayments"
									value="#{delivery.to.numberOfPayments}"
									disabled="#{!delivery.pending}" size="3" maxlength="2">
									<f:validateLongRange minimum="1" />
								</aon:inputText>	
								<aon:inputText id="Delivery_daysToFirstPayment"
									value="#{delivery.to.daysToFirstPayment}"
									disabled="#{!delivery.pending}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Delivery_daysBetweenPayments"
									value="#{delivery.to.daysBetweenPayments}"
									disabled="#{!delivery.pending}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Delivery_paymentDays"
									value="#{delivery.to.paymentDays}" 
									disabled="#{!delivery.pending}" size="5" />

								<aon:div>
									<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
										<ui:param name="bankAccountController" value="#{delivery.accountHelper}" />
										<ui:param name="bankAccountPrefix" value="Delivery" />
										<ui:param name="bankAccountDisabled" value="#{!delivery.pending}" />
										<ui:param name="bankCodeChangeReRender" value="Delivery_bankAlias,Delivery_bic" />
									</ui:include>
								</aon:div>
								<aon:inputText id="Delivery_bankAlias"
									value="#{delivery.to.bankAlias}" 
									disabled="#{!delivery.pending}" 
									required="#{delivery.to.bankAccount.validIbanLength}" size="25" maxlength="25" />
								<aon:inputText id="Delivery_bic"
									value="#{delivery.to.bic}" validator="BICValidator" 
									disabled="#{!delivery.pending}" 
									required="#{delivery.to.bankAccount.validIbanLength}" size="12" maxlength="11">
								</aon:inputText>

							</aon:panelGrid>
						</aon:panel>
					</aon:if>
				</aon:div>
				
				<aon:if test="#{!delivery.nevv}">
					<aon:panelTabSet selectedTab="#{sales.selectedTab}">
						<aon:panelTab id="deliveryDetail" 
							label="#{bundle.warehouse_delivery_detail}">
							<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/formDetail.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="deliveryShipment" 
							label="#{bundle.carrier_shipment}">
							<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/formShipment.xhtml" />
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:if>
				
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalTransfer.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalConfirm.xhtml" >
			<ui:param name="controller" value="#{delivery}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalInvoice.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/shared/modalWarehouseChange.xhtml">
			<ui:param name="controller" value="#{delivery}" />
			<ui:param name="changeReRender" value="deliveryForm" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalConfirmStock.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalIngenet.xhtml" />
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalEdiFtp.xhtml" />
		<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{delivery}" />
		</ui:include>						
		<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
			<ui:param name="bankAccountController" value="#{delivery.accountHelper}" />
			<ui:param name="modalReRender" value="payMethodDiv" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/product/facelet/product/item/modalPackage.xhtml">
			<ui:param name="controller" value="#{deliveryDetail}" />
		</ui:include>
		<aon:if test="#{company.ediSupportEnabled}">
			<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
				<ui:param name="logPanelTitle" value="#{bundle.aon_import} #{bundle.registry_stat_delivery} INGENET" />
				<ui:param name="closeButtonReRender" value="aonContent" />
				<aon:methodParam name="closeButtonAction" value="delivery_list" />
				<aon:valueParam name="pollInterval" value="2000" />
				<aon:methodParam name="closeLogPanelAtionListener"
					default="#{delivery.udapaDeliveryHandler.onLogPanelFinish}" type="actionListener" />
			</ui:include>
		</aon:if>		
	</ui:define>
</ui:composition>
