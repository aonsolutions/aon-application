<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showIngenetWindow">
		<aon:if test="#{delivery.udapaDeliveryHandler.showIngenetWindow}">
			<rich:modalPanel id="ingenetModalPanel" minHeight="250" minWidth="420" 
				rendered="#{delivery.udapaDeliveryHandler.showIngenetWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_confirm_title}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showIngenetWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{delivery.udapaDeliveryHandler.showIngenetWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="ingenetForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
							
								<aon:if test="#{!delivery.udapaDeliveryHandler.ingenetPendingDeliveries}">
									<aon:div styleClass="aon-scroll-area" style="margin-top: 0.1em;" >
										<aon:div style="margin-bottom:20px;">
											<aon:outputText style="display: inline-block;" styleClass="aon-bold" 
												value="No hay albaranes pendientes" />
										</aon:div>
									</aon:div>
								</aon:if>
								
								<aon:if test="#{delivery.udapaDeliveryHandler.ingenetPendingDeliveries}">
									<aon:div styleClass="aon-scroll-area" style="margin-top: 0.1em;" >
										<aon:div style="margin-bottom:20px;">
											<aon:outputText style="display: inline-block;" styleClass="aon-bold" 
												value="Seleccionar albaranes pendientes:" />
										</aon:div>
										
										<aon:dataTable id="listData" value="#{delivery.udapaDeliveryHandler.model}"
											var="id" rows="20" rendered="#{delivery.udapaDeliveryHandler.model.rowCount > 0}" >	
											<aon:rowSelector id="noBatched-select" toggleOnClick="#{false}"/>
											<aon:column styleClass="aon-editDataTable-iconColumn">
												<aon:selectBooleanCheckbox id="Included_Row_checked"
													value="#{delivery.udapaDeliveryHandler.rowChecked}"
													ajaxSingle="#{true}"
													valueChangeListener="#{delivery.udapaDeliveryHandler.rowSelected}" >
													<a4j:support event="onclick" reRender="ingenetForm" />
												</aon:selectBooleanCheckbox>
											</aon:column>
											<aon:column styleClass="aon-editDataTable-textColumn">
												<aon:outputText value="#{delivery.udapaDeliveryHandler.ingenetDeliveries[id]}" />
											</aon:column>
										</aon:dataTable>
										
										<aon:panelGrid columns="2" styleClass="aon-width-all aon-margin-top">
											<aon:outputLabel for="Ingenet_Delivery_warehouse" 
												value="#{bundle.aon_module_warehouse}" />
											<aon:selectOneMenu id="Ingenet_Delivery_warehouse" 
												value="#{delivery.udapaDeliveryHandler.warehouse}" required="#{true}"
												disabled="#{fn:length(delivery.udapaDeliveryHandler.warehouses) eq 1}">
												<f:selectItems value="#{delivery.udapaDeliveryHandler.warehouses}" />
											</aon:selectOneMenu>
										</aon:panelGrid>
									</aon:div>
									
									<aon:div styleClass="aon-width-all aon-text-center">
										<aon:commandButton id="confirm-accept"
											styleClass="aon-commandButton"
											value="#{bundle.aon_confirm}"
											reRender="showIngenetWindow,deliverySearch,deliveryForm"
											actionListener="#{delivery.udapaDeliveryHandler.confirmIngenetDeliveries}">
											<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
											<f:setPropertyActionListener
												target="#{delivery.udapaDeliveryHandler.showIngenetWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
								</aon:if>

							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
