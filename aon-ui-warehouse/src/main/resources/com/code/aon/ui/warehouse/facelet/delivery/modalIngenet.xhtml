<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showIngenetWindow">
		<aon:if test="#{delivery.showIngenetWindow}">
			<rich:modalPanel id="ingenetModalPanel" minHeight="250" minWidth="420" 
				rendered="#{delivery.showIngenetWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_confirm_title}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showIngenetWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{delivery.showIngenetWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="ingenetForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-scroll-area" style="margin-top: 0.1em;" >
									
									<aon:if test="#{!delivery.ingenetPendingDeliveries}">
										<aon:div style="margin-bottom:20px;">
											<aon:outputText style="display: inline-block;" styleClass="aon-bold" 
												value="No hay datos por traspasar" />
										</aon:div>
									</aon:if>

									<aon:if test="#{delivery.ingenetPendingDeliveries}">
										<aon:div style="margin-bottom:20px;">
											<aon:outputText style="display: inline-block;" styleClass="aon-bold" 
												value="Se han encontrado los siguientes resutados:" />
										</aon:div>
										<ui:repeat var="delivery" value="#{delivery.ingenetDeliveries}">
											<aon:outputText value="#{delivery}" />
										</ui:repeat>
	
										<aon:div styleClass="aon-width-all aon-text-center">
											<aon:commandButton id="confirm-accept"
												styleClass="aon-commandButton"
												value="#{bundle.aon_confirm}"
												actionListener="#{delivery.confirmIngenetDeliveries}">
												<rich:componentControl for="ingenetModalPanel"
													event="onclick" operation="hide"/>																					
												<f:setPropertyActionListener
													target="#{delivery.showIngenetWindow}"
													value="#{false}" />
											</aon:commandButton>
										</aon:div>
									</aon:if>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
