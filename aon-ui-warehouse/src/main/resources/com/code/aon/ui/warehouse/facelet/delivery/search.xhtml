<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<ui:include src="/com/esferalia/aon/gwt/template/facelet/silent_templates.xhtml" />
		<aon:form id="deliverySearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_delivery_module}" />
				<ui:param name="controller" value="#{delivery}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandLink id="proposal-import" value="Confirmación de Envíos"
						onclick="deliveryx()"
						styleClass="aon-finding-toolbar-item aon-icon-export-excel-trans">
					</aon:commandLink>
					<aon:if test="#{company.ediSupportEnabled}">
						<aon:commandButton	id="sincronizeIngenet-delivery" 
							value="Sincronizar INGENET"
							styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-sincronize"
							actionListener="#{delivery.onSincronizeIngenet}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					</aon:if>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{delivery}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/searchContent.xhtml" >
						<ui:param name="searchController" value="#{deliverySearch}" />
					</ui:include>					
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />		
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		
		<ui:include src="/com/code/aon/ui/warehouse/facelet/delivery/modalIngenet.xhtml" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml">
			<ui:param name="addWaitProcessPoll" value="#{true}" />
		</ui:include>
				
	</ui:define>
</ui:composition>
