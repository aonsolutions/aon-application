<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="inventoryForm">

			<aon:methodParam name="resetActionListener" value="#{inventory.onStartClosing}" type="actionListener" />
			<aon:methodParam name="resetAction" value="inventory_close"/>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_inventory_closed_module}" />
				<ui:param name="controller" value="#{inventory}" />
				<ui:param name="skipSaveButton" value="true" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="inventory_close-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="inventory_close" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>								
					<aon:htmlCommandLink id="inventory_close-report"
						value="#{bundle.warehouse_inventory_report_title}"
						action="#{report.onExecute}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory_close" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="inventory_valued-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="inventory_valued" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>				
					<aon:htmlCommandLink id="inventory_valued-report"
						value="#{bundle.warehouse_inventory_valued_title}"
						action="#{report.onExecute}"  target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="inventory_valued" />
					</aon:htmlCommandLink>
					<aon:if test = "#{inventory.to.closed != 'true'}">
						<ui:include
							src="/com/esferalia/aon/gwt/template/facelet/silent_templates.xhtml" />
						<aon:commandLink id="stock-import" value="Importar"
							onclick="stock()"
							styleClass="aon-finding-toolbar-item aon-icon-import-excel-trans">
						</aon:commandLink>
					</aon:if>
				</ui:define>				
				
			</ui:decorate>
	
			<aon:div styleClass="aon-scroll-area">

				<aon:div styleClass="aon-padding-bottom">
					<aon:panelGrid columns="8" style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-80
								,aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-80
								,aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-250
								,aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-auto">

						<aon:outputText value="#{bundle.aon_date}" />
						<aon:outputText value="#{inventory.to.inventoryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								type="both" timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						
						<aon:outputText value="#{bundle.aon_status}" />
						<aon:outputText value="#{(inventory.to.closed)?(bundle.aon_closed):(bundle.aon_opened)}" />
						
						<aon:outputText value="#{bundle.aon_module_warehouse}" />
						<aon:outputText value="#{inventory.to.warehouse.name}"/>

						<aon:outputText value="#{bundle.aon_description}" />
						<aon:outputText value="#{inventory.to.description}" size="64" />
					</aon:panelGrid>
				</aon:div>
	
				<ui:include src="/com/code/aon/ui/warehouse/facelet/inventory/productSearch.xhtml" />

				<aon:methodParam name="resetActionListener" value="#{inventoryDetail.onReset}" type="actionListener" />
				<aon:methodParam name="resetAction" value="" />													
				<aon:methodParam name="saveActionListener" value="#{inventoryDetail.onAcceptNext}" type="actionListener" />

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
					<ui:param name="controller" value="#{inventoryDetail}" />				
					<ui:param name="skipRemoveButton" value="true" />
					<ui:param name="skipResetButton" value="#{inventory.to.closed}" />
					<ui:param name="skipLineEdition" value="#{inventory.to.closed}" />
					<ui:param name="showNote" value="true" />
					<ui:param name="showDataTable" value="#{inventoryDetail.model.rowCount > 0}" />
					
					<ui:define name="columns">					
					
						<aon:column alias="InventoryDetail.item.product.code"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText id="InventoryDetail_item_product_code"
								value="#{to.item.product.code}" />
							<f:facet name="footer">
								<aon:outputText id="InventoryDetail_item_product_code-New"
									rendered="#{formNew}"
									value="#{controller.to.item.product.code}" />
							</f:facet>
						</aon:column>
		
						<aon:column alias="InventoryDetail.item.product.name"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_product}" />
							</f:facet>
							<aon:outputText value="#{to.item.product.name} #{to.item.detail}" />
							<f:facet name="footer">
								<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
									<ui:param name="lookupTo" value="#{controller.to.item}" />
									<ui:param name="idRequired" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupRendered" value="#{formNew}" />
									<ui:param name="lookupReRender" 
										value="InventoryDetail_item_product_code-New,InventoryDetail_realQuantity-New,
										InventoryDetail_cost-New,InventoryDetail_costAmount-New" />
									<ui:param name="lookupControllerListener"
										value="#{controller.itemFilter}" />										
									<aon:methodParam name="lookupChangeListener"
										value="#{controller.onItemChanged}" type="lookupChangeListener" />										
								</ui:include>
							</f:facet>								
						</aon:column>
						
						<aon:column alias="InventoryDetail.realQuantity"
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.warehouse_inventory}" />
							</f:facet>
							<aon:outputText value="#{to.realQuantity}" rendered="#{to.id!=inventoryDetail.to.id}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:inputText id="InventoryDetail_realQuantity" rendered="#{formEdit}"
								ajaxSingle="true" reRender="InventoryDetail_costAmount"
								value="#{controller.to.realQuantity}" required="true" />
							<f:facet name="footer">
								<aon:inputText id="InventoryDetail_realQuantity-New" rendered="#{formNew}"
									ajaxSingle="true" reRender="InventoryDetail_costAmount-New"
									value="#{controller.to.realQuantity}" required="true" />
							</f:facet>									
						</aon:column>
	
						<aon:column alias="InventoryDetail.cost"
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_cost}"	/>
							</f:facet>
							<aon:outputText value="#{to.cost}" rendered="#{to.id!=inventoryDetail.to.id}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:outputText id="InventoryDetail_cost"
								value="#{controller.to.cost}" rendered="#{formEdit}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:outputText id="InventoryDetail_cost-New"
									value="#{controller.to.cost}" rendered="#{formNew}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</f:facet>									
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.costAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>							
							<f:facet name="footer">
								<aon:outputText id="InventoryDetail_costAmount-New"
									value="#{controller.to.costAmount}" rendered="#{formNew}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</f:facet>
						</aon:column>
					
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
