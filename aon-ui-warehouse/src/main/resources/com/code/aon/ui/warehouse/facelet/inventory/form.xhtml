<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form style="display:none">
			<aon:commandButton id="inventoryDetailRefreshButton" reRender="inventoryDetailList"
				actionListener="#{inventoryDetail.onRefresh}" />
			<script type="text/javascript">
            	//<![CDATA[
					refreshInventoryDetail = function(){
						#{rich:element('inventoryDetailRefreshButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>
		
		<aon:form id="inventoryForm">
			<ui:include	src="/com/esferalia/aon/gwt/template/facelet/silent_templates.xhtml" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_inventory_closed_module}" />
				<ui:param name="controller" value="#{inventory}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="showMoreMenu" value="#{!inventory.nevv}" />
				<ui:define name="moreMenuContent">
					<aon:menuItem id="processAdjustment"
						value="#{bundle.warehouse_inventory_process}"
						rendered="#{!inventory.to.closed}"
						iconClass="aon-icon-accept"
						actionListener="#{inventory.onStartAdjustment}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"					
						reRender="showInventoryAdjustmentWindow">
						<f:setPropertyActionListener
								target="#{warehouseTransfer.workplace}"
								value="#{inventory.to.warehouse.workPlace}" />
					</aon:menuItem>
					
					<aon:if test="#{aonRole.accountingManager}">
						<aon:menuItem id="inventory-revert"
							value="#{bundle.warehouse_inventory_revert}"
							rendered="#{inventory.showRevert}"
							iconClass="aon-icon-task-liberate"
							actionListener="#{inventory.onStartRevert}"
							reRender="showConfirmWindow" />
					</aon:if>
					
					<aon:if test="#{!inventory.to.closed}">
						<aon:menuItem id="stock-import"
							value="#{bundle.aon_import}"
							iconClass="aon-icon-import-excel-trans"
							onclick="stock('#{inventory.to.warehouse.name}','#{inventory.to.id}', window)" />
					</aon:if>
					<aon:menuItem id="stock-export"
						value="#{bundle.account_export}"
						iconClass="aon-icon-export-excel-trans"
						onclick="stockx2('#{inventory.to.warehouse.name}','#{inventoryDetail.category.id}','#{inventoryDetail.brand.id}','#{inventoryDetail.code}','#{inventoryDetail.description}','#{inventoryDetail.stock}','#{inventory.to.id}')" />
		
					<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
 				</ui:define>
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandLink id="inventory_close-excel-report"
						value="&#160;" onclick="inventoryx('#{true}','#{inventory.to.id}')" 
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:commandLink>							
					<aon:htmlCommandLink id="inventory_close-report"
						value="#{bundle.warehouse_inventory_report_title}"
						action="#{report.onExecute}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory_close" />
					</aon:htmlCommandLink>

					<aon:commandLink id="inventory_valued-excel-report"
						value="&#160;" onclick="inventoryx('#{false}','#{inventory.to.id}')" 
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:commandLink>				
					<aon:htmlCommandLink id="inventory_valued-report"
						value="#{bundle.warehouse_inventory_valued_title}"
						action="#{report.onExecute}"  target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="inventory_valued" />
					</aon:htmlCommandLink>
				</ui:define>				
				
			</ui:decorate>
	
			<aon:div styleClass="aon-scroll-area" id="inventoryDetailList">

				<aon:div styleClass="aon-padding-bottom">
					<aon:panelGrid columns="8" style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-80
								,aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-80
								,aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-250
								,aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-auto">

						<aon:outputText value="#{bundle.aon_date}" />
						<aon:outputText value="#{inventory.to.inventoryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								type="both" timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						
						<aon:outputText value="#{bundle.aon_status}" />
						<aon:outputText value="#{inventory.to.status}" />
						
						<aon:outputText value="#{bundle.aon_module_warehouse}" />
						<aon:outputText value="#{inventory.to.warehouse.name}"/>

						<aon:outputText value="#{bundle.aon_description}" />
						<aon:outputText value="#{inventory.to.description}" size="64" />
					</aon:panelGrid>
				</aon:div>
	
				<ui:include src="/com/code/aon/ui/warehouse/facelet/inventory/productSearch.xhtml" />

				<aon:methodParam name="resetActionListener" value="#{inventoryDetail.onReset}" type="actionListener" />
				<aon:methodParam name="resetAction" value="" />													
				<aon:methodParam name="saveActionListener" value="#{inventoryDetail.onAcceptNext}" type="actionListener" />

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
					<ui:param name="dataTableId" value="inventoryDetails" />
					<ui:param name="controller" value="#{inventoryDetail}" />				
					<ui:param name="skipRemoveButton" value="true" />
					<ui:param name="skipResetButton" value="#{inventory.to.closed}" />
					<ui:param name="skipLineEdition" value="#{true}" />
					<ui:param name="showNote" value="true" />
					<ui:param name="showDataTable" value="#{inventoryDetail.model.rowCount > 0}" />
					
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="rowSelectorReRender" value="menuExt" />
					<ui:param name="resetButtonReRender" value="menuExt" />
					<ui:param name="newCancelButtonReRender" value="menuExt" />
					<ui:param name="cancelButtonReRender" value="menuExt" />
					<ui:param name="newSaveButtonReRender" value="menuExt,Income_total,Income_workPlace,Income_warehouse" />
					<ui:param name="saveButtonReRender" value="menuExt,Income_total,Income_workPlace,Income_warehouse" />
					<ui:param name="focusOnAdd" value="Item_id-New" />
					<ui:param name="focusOnSelect" value="Item_id" />
					
					
					
					<ui:define name="beginFormListContent">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							rendered="#{!inventory.to.closed}"
							actionListener="#{inventoryDetail.onSelect}"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>
					
					<ui:define name="columns">					
					
						<aon:column alias="InventoryDetail.item.product.code"
							styleClass="aon-editDataTable-textColumn aon-width-120">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText id="InventoryDetail_item_product_code"
								value="#{to.item.product.code}" />
							<f:facet name="footer">
								<aon:outputText id="InventoryDetail_item_product_code-New"
									rendered="#{formNew}"
									value="#{controller.to.item.product.code}" />
							</f:facet>
						</aon:column>
		
						<aon:column alias="InventoryDetail.item.product.name"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_product}" />
							</f:facet>
							<aon:outputText value="#{to.item.fullName}" />
							<f:facet name="footer">
								<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
									<ui:param name="lookupBean" value="#{allItemLookup}" />
									<ui:param name="lookupTo" value="#{controller.to.item}" />
									<ui:param name="idRequired" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupRendered" value="#{formNew}" />
									<ui:param name="lookupReRender" 
										value="InventoryDetail_item_product_code-New,InventoryDetail_realQuantity-New,
										InventoryDetail_cost-New,InventoryDetail_costAmount-New" />
									<ui:param name="lookupControllerListener"
										value="#{controller.itemFilter}" />										
									<aon:methodParam name="lookupChangeListener"
										value="#{controller.onItemChanged}" type="lookupChangeListener" />										
								</ui:include>
							</f:facet>								
						</aon:column>
						
						<aon:column alias="InventoryDetail.actualQuantity"
							styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_closing}" />
							</f:facet>
							<aon:outputText value="#{to.actualQuantity}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:outputText value="#{controller.to.actualQuantity}" rendered="#{formNew}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</f:facet>									
						</aon:column>
												
						<aon:column alias="InventoryDetail.realQuantity"
							styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_count}" />
							</f:facet>
							<aon:outputText value="#{to.realQuantity}" rendered="#{formList}"
								style="#{(to.realQuantity!=to.actualQuantity)?'color:red;':''}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:inputText id="InventoryDetail_realQuantity" rendered="#{formEdit}"
								ajaxSingle="true" reRender="InventoryDetail_costAmount"
								value="#{controller.to.realQuantity}" required="true" size="10">
								 <f:validateLongRange minimum="0"></f:validateLongRange>	
							</aon:inputText>
							<f:facet name="footer">
								<aon:inputText id="InventoryDetail_realQuantity-New" rendered="#{formNew}"
									ajaxSingle="true" reRender="InventoryDetail_costAmount-New"
									value="#{controller.to.realQuantity}" required="true" size="10">
									<f:validateLongRange minimum="0"></f:validateLongRange>		
								</aon:inputText>
							</f:facet>									
						</aon:column>
	
						<aon:column alias="InventoryDetail.cost"
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_cost}"	/>
							</f:facet>
							<aon:outputText value="#{to.cost}" rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:outputText id="InventoryDetail_cost"
								value="#{controller.to.cost}" rendered="#{formEdit}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:outputText id="InventoryDetail_cost-New"
									value="#{controller.to.cost}" rendered="#{formNew}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</f:facet>									
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.costAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>							
							<f:facet name="footer">
								<aon:outputText id="InventoryDetail_costAmount-New"
									value="#{controller.to.costAmount}" rendered="#{formNew}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</f:facet>
						</aon:column>
					
					</ui:define>
					<ui:define name="endFormListContent">
						<aon:div>
							<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
								<ui:param name="auditableTO" value="#{to}" />
							</ui:include>
						</aon:div>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{allItemLookup}" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<aon:if test="#{!inventory.to.closed}" >
			<ui:include src="/com/code/aon/ui/warehouse/facelet/inventory/modalInventoryAdjustment.xhtml" />
		</aon:if>		
		<ui:decorate template="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{inventoryDetail}" />
		</ui:decorate>
		<ui:include src="/com/code/aon/ui/warehouse/facelet/inventory/modalConfirm.xhtml">
			<ui:param name="controller" value="#{inventory}" />
		</ui:include>
	</ui:define>
</ui:composition>
