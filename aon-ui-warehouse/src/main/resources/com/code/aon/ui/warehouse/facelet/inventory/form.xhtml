<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="inventoryForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_inventory_remake_module}" />
				<ui:param name="controller" value="#{inventory}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="beforeSpinToolbarContent">
					<h:commandLink value="#{warehouseBundle.warehouse_inventory_report_title}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory_close" />
					</h:commandLink>

					<h:commandLink value="#{warehouseBundle.warehouse_inventory_valued_title}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="inventory_valued" />
					</h:commandLink>
				</ui:define>				
				
			</ui:decorate>
	
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Inventory_id"
						value="#{bundle.aon_id}" />
					<aon:outputText value="#{inventory.to.id}" size="14" />

					<aon:outputLabel for="Inventory_inventoryDate"
						value="#{bundle.aon_date}" />
					<aon:outputText value="#{inventory.to.inventoryDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							type="both" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputLabel for="Inventory_description"
						value="#{bundle.aon_description}" />
					<aon:outputText value="#{inventory.to.description}" size="64" />
				</aon:panelGrid>
								
				<aon:panelGrid columns="2"> 
					<aon:outputLabel for="Inventory_category"
						value="#{productBundle.product_category}"  />
					<aon:div>
						<aon:selectOneMenu id="Inventory_category" 
							value="#{inventoryDetail.categoryId}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{productCollections.categories}" />
						</aon:selectOneMenu>
						<aon:commandButton title="#{bundle.aon_accept}"
							actionListener="#{inventoryDetail.loadDetailModel}" 
							value="" accesskey="#{bundle.aon_key_save_line}" />
					</aon:div>
				</aon:panelGrid>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
					<ui:param name="controller" value="#{inventoryDetail}" />					
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="skipRemoveButton" value="true" />
					<ui:define name="columns">
						<aon:column styleClass="aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.item.product.code}" />
						</aon:column>
		
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_item}" />
							</f:facet>
							<aon:div>
								<aon:outputText value="#{to.item.product.name} #{to.item.detail}" />
							</aon:div>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_inventory}" />
							</f:facet>
							<aon:div>
								<aon:outputText value="#{to.realQuantity}" rendered="#{to.id!=inventoryDetail.to.id}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
								<aon:inputText rendered="#{to.id==inventoryDetail.to.id}"
									value="#{inventoryDetail.to.realQuantity}" required="true" />
							</aon:div>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_inventoryDetail_cost}"	/>
							</f:facet>
							<aon:div>
								<aon:outputText value="#{to.cost}" rendered="#{to.id!=inventoryDetail.to.id}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
								<aon:outputText value="#{inventoryDetail.to.cost}" rendered="#{to.id==inventoryDetail.to.id}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</aon:div>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:div>
								<aon:outputText value="#{to.realQuantity * to.cost}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
							</aon:div>
						</aon:column>
					
					</ui:define>
				</ui:decorate>
