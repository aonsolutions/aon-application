<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="inventoryForm" styleClass="aon-form">

			<aon:div styleClass="aon-content-toolbar">
				<aon:div styleClass="aon-content-toolbar-internal">
				<aon:div styleClass="aon-content-toolbar-item-group">
					<aon:commandButton id="accept" value="#{bundle.aon_search}"
						actionListener="#{inventory.onSearch}" action="inventory_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-accept"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-accept'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-accept'" 
						accesskey="#{bundle.aon_key_search}"/>
					<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
						actionListener="#{inventory.onCancel}" action="inventory_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
						accesskey="#{bundle.aon_key_cancel}"/>
					<aon:commandButton id="clear" value="#{bundle.aon_clear}"
						type="reset"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'" />
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						actionListener="#{inventory.onReset}" action="inventoryclosing_search"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" 
						accesskey="#{bundle.aon_key_new}"/>
				</aon:div>
				</aon:div>
			</aon:div>
			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				>
				<aon:div styleClass="aon-content-subtitle-internal">
				<aon:outputText value="#{bundle.aon_search_header}" />
				</aon:div>
			</aon:div>
			<aon:div  id="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">
					<aon:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<aon:outputLabel for="Inventory_id"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
							value="#{warehouseBundle.inventory_id}" />
						<aon:inputText id="Inventory_id" size="14"
							styleClass="aon-form-input-text"
							valueChangeListener="#{inventory.addExpression}" />
	
						<aon:outputLabel for="Inventory_inventoryDate"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
							value="#{warehouseBundle.inventory_date}" />
						<aon:inputText id="Inventory_inventoryDate" size="15"
							styleClass="aon-form-input-text"
							valueChangeListener="#{inventory.addExpression}" />
							
						<aon:outputLabel for="Inventory_description"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
							value="#{warehouseBundle.inventory_description}" />
						<aon:inputText id="Inventory_description" size="64"
							styleClass="aon-form-input-text"
							valueChangeListener="#{inventory.addExpression}" />
						
					</aon:panelGrid>
				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
