<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form style="display:none">
			<aon:commandButton id="warehouseTransferRefreshButton" reRender="warehouseTransferList"
				actionListener="#{warehouseTransferDetail.onRefresh}" />
			<script type="text/javascript">
            	//<![CDATA[
					refreshWarehouseTransfer = function(){
						#{rich:element('warehouseTransferRefreshButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>
		<aon:form id="warehouseTransferForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_transfer_module}" />
				<ui:param name="controller" value="#{warehouseTransfer}" />
				<ui:param name="skipSaveButton" value="#{warehouseTransfer.readOnly}" />
				<ui:param name="skipRemoveButton" value="#{warehouseTransfer.readOnly}" />				
				<ui:define name="beforeSpinToolbarContent">
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />											
					<aon:if test="#{!warehouseTransfer.nevv and !warehouseTransfer.readOnly}">
						<ui:include
							src="/com/esferalia/aon/gwt/aio/facelet/templates/silent.xhtml" />
						<aon:commandLink id="transfer-stock-import" value="#{bundle.aon_import}"
							onclick="transferStock('#{warehouseTransfer.to.sourceWarehouse.name}','#{warehouseTransfer.to.targetWarehouse.name}','#{warehouseTransfer.to.series}','#{warehouseTransfer.to.number}')"
							styleClass="aon-finding-toolbar-item aon-icon-import-excel-trans">
						</aon:commandLink>
					</aon:if>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" id="warehouseTransferList">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<ui:decorate template="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
						<ui:param name="controller" value="#{warehouseTransfer}" />
						<ui:define name="additionalSeriesContent">
							<aon:commandLink immediate="true"
								rendered="#{warehouseTransfer.to.inventory.id != null}"
								styleClass="aon-button-goto"
								style="margin-left: 5px; padding-left: 17px;" 
								actionListener="#{warehouseTransfer.onGoToInventory}" 
								action="inventory_form"
								title="#{bundle.warehouse_inventory_goTo}"
								alt="#{bundle.warehouse_inventory_goTo}" />
						</ui:define>
					</ui:decorate>

					<aon:outputLabel for="WarehouseTransfer_issueTime" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="WarehouseTransfer_issueTime"
						value="#{warehouseTransfer.to.issueTime}" required="true" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="WarehouseTransfer_sourceWarehouse_id" value="#{bundle.aon_source}" />
					<aon:selectOneMenu id="WarehouseTransfer_sourceWarehouse_id"
						disabled="#{!warehouseTransfer.nevv}"
						value="#{warehouseTransfer.to.sourceWarehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="WarehouseTransfer_targetWarehouse_id" value="#{bundle.warehouse_stock_target}" />
					<aon:selectOneMenu id="WarehouseTransfer_targetWarehouse_id"
						disabled="#{!warehouseTransfer.nevv}"
						value="#{warehouseTransfer.to.targetWarehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;"
					styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="WarehouseTransfer_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="WarehouseTransfer_comments" cols="130" rows="2"
						value="#{warehouseTransfer.to.comments}" />
				</aon:panelGrid>

				<aon:if test="#{!warehouseTransfer.nevv}">
					<aon:div styleClass="aon-padding-top">
						<ui:include src="/com/code/aon/ui/warehouse/facelet/warehouseTransfer/formDetail.xhtml" />
					</aon:div>
				</aon:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{allItemLookup}" />
		<ui:decorate template="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{warehouseTransfer}" />
		</ui:decorate>
 	</ui:define>
</ui:composition>
