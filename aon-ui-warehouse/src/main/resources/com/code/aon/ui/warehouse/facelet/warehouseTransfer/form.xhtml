<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="warehouseTransferForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_transfer_module}" />
				<ui:param name="controller" value="#{warehouseTransfer}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">



					<aon:outputLabel for="WarehouseTransfer_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="WarehouseTransfer_series" 
							value="#{warehouseTransfer.to.series}"
							valueChangeListener="#{warehouseTransfer.onSeriesChanged}" 
							reRender="WarehouseTransfer_number">
							<f:selectItem itemLabel=" " itemValue="#{null}" />
							<f:selectItems value="#{configCollections.deliverySeriesIds}" />
						</aon:selectOneMenu>
						<aon:inputText id="WarehouseTransfer_number" styleClass="aon-margin-left aon-inputText" 
							value="#{warehouseTransfer.to.number}" 
							required="true" size="7" />
 					</aon:div>

					<aon:outputLabel for="WarehouseTransfer_issueTime" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="WarehouseTransfer_issueTime"
						value="#{warehouseTransfer.to.issueTime}" required="true" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="WarehouseTransfer_sourceWarehouse_id" value="#{warehouseBundle.warehouse_stock_source}" />
					<aon:selectOneMenu id="WarehouseTransfer_sourceWarehouse_id"
						disabled="#{!warehouseTransfer.new}"
						value="#{warehouseTransfer.to.sourceWarehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="WarehouseTransfer_targetWarehouse_id" value="#{warehouseBundle.warehouse_stock_target}" />
					<aon:selectOneMenu id="WarehouseTransfer_targetWarehouse_id"
						disabled="#{!warehouseTransfer.new}"
						value="#{warehouseTransfer.to.targetWarehouse}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;"
					styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="WarehouseTransfer_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="WarehouseTransfer_comments" cols="130" rows="2"
						value="#{warehouseTransfer.to.comments}" />
				</aon:panelGrid>

				<c:if test="#{!warehouseTransfer.new}">
					<aon:div styleClass="aon-padding-top">
						<ui:include src="/com/code/aon/ui/warehouse/facelet/warehouseTransfer/formDetail.xhtml" />
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
 	</ui:define>
</ui:composition>
