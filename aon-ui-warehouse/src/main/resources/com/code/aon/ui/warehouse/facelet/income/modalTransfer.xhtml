<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showPurchaseTransferWindow">
		<aon:if test="#{income.showPurchaseTransferWindow}">
			<rich:modalPanel id="purchaseTransferModalPanel" minHeight="580"
				minWidth="850" rendered="#{income.showPurchaseTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.warehouse_income_purchase_pending}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showPurchaseTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{income.showPurchaseTransferWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{income.purchaseTransferManager}"
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="purchaseTransferForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="purchaseTransfer-selectAll"
										value="#{bundle.aon_check_all}"
										rendered="#{income.purchaseTransferManager.purchaseModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkAll"
										actionListener="#{income.purchaseTransferManager.checkAllPurchases}" 
										reRender="purchaseData,detailDataContainer" />
									<aon:commandButton id="purchaseTransfer-selectNone"
										value="#{bundle.aon_uncheck_all}"
										rendered="#{income.purchaseTransferManager.purchaseModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkNone"
										actionListener="#{income.purchaseTransferManager.checkNonePurchases}" 
										reRender="purchaseData,detailDataContainer" />	
									<aon:commandButton id="purchaseTransfer-filter"
										value="#{bundle.aon_filter}"
										styleClass="aon-finding-toolbar-item aon-icon-search"
										reRender="showPurchaseFilterWindow" >
										<f:setPropertyActionListener target="#{income.showPurchaseFilterWindow}"
											value="#{true}" />
									</aon:commandButton>
									<aon:commandButton id="purchaseTransfer-accept"
										value="#{bundle.warehouse_income_to_transfer}"
										rendered="#{income.purchaseTransferManager.purchaseModel.rowCount > 0}"
										reRender="showPurchaseTransferWindow,incomeForm,showConfirmWindow"
										actionListener="#{income.onPurchaseTransfer}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
									</aon:commandButton>
									<aon:commandButton id="purchaseTransfer-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showPurchaseTransferWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{income.showPurchaseTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{income.purchaseTransferManager}"
											value="#{null}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">

									<aon:dataTable id="purchaseData" value="#{income.purchaseTransferManager.purchaseModel}"
										var="to" rows="10" rendered="#{income.purchaseTransferManager.purchaseModel.rowCount > 0}"
										columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
											aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
											aon-editDataTable-iconColumn">

										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:selectBooleanCheckbox id="PurchaseCheck"
												value="#{income.purchaseTransferManager.purchaseRowChecked}"
												valueChangeListener="#{income.purchaseTransferManager.purchaseRowSelected}"
												reRender="detailDataContainer" ajaxSingle="true" />	
										</aon:column>
			
										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
											</f:facet>
											<aon:outputText value="#{to.referenceCode}" />
										</aon:column>

										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.issueDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_supplier}" />
											</f:facet>
											<aon:outputText value="#{to.supplier.registry.fullName}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
										</aon:column>
										
										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_total}" />
											</f:facet>
											<aon:div>
												<aon:outputText value="#{income.purchaseTransferManager.purchaseTotalPrice}">
													<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
												</aon:outputText>
												<aon:outputText value=" (" />
												<aon:outputText value="#{income.purchaseTransferManager.purchaseLinesCount}"/>
												<aon:outputText value=")" />
											</aon:div>
										</aon:column>

										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_pending}" />
											</f:facet>
											<aon:div>
												<aon:outputText value=" (" />
												<aon:outputText value="#{income.purchaseTransferManager.purchasePendingLinesCount}"/>
												<aon:outputText value=")" />
											</aon:div>
										</aon:column>

										<aon:column styleClass="#{income.purchaseTransferManager.selectedPurchaseId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:commandButton value="&#160;" immediate="true"
												title="#{bundle.warehouse_income_see_purchase_details}"
												styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
												actionListener="#{income.purchaseTransferManager.onSelectPurchase}"
												reRender="purchaseData,detailDataContainer" ajaxSingle="true">
											</aon:commandButton>															
										</aon:column>
									</aon:dataTable>
					
									<aon:dataScroller for="purchaseData" showNote="true" pageSize="10"
										rowCount="#{income.purchaseTransferManager.purchaseModel.rowCount}" />

									<aon:div id="detailDataContainer">
										<aon:div styleClass="aon-toolbar"
											rendered="#{income.purchaseTransferManager.detailModel.rowCount > 0}">
											<aon:div styleClass="aon-text-right">
												<aon:outputLabel for="purchaseTransfer-massiveDiscountExpr" 
													value="#{bundle.aon_discount_abrv}: "
													styleClass="aon-margin-left" />
												<aon:inputText id="purchaseTransfer-massiveDiscountExpr"
													value="#{income.purchaseTransferManager.massiveDiscountExpr}" size="5" />
												<aon:commandButton value="#{bundle.aon_apply_to_all}"
													actionListener="#{income.purchaseTransferManager.onApplyMassiveDiscount}"
													reRender="detailDataContainer"
													styleClass="aon-finding-toolbar-item aon-icon-accept" />
											</aon:div>
										</aon:div>
										
										<aon:dataTable id="detailData" value="#{income.purchaseTransferManager.detailModel}"
											var="to" rows="0" rendered="#{income.purchaseTransferManager.detailModel.rowCount > 0}"
											columnClasses="aon-editDataTable-textColumn, 
												aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
												aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
												aon-editDataTable-iconColumn">
	
											<aon:column>
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:selectBooleanCheckbox id="Detail_Row_checked"
													value="#{income.purchaseTransferManager.detailRowChecked}"
													rendered="#{!to.item.wildCard}"
													valueChangeListener="#{income.purchaseTransferManager.detailRowSelected}">
													<a4j:support event="onclick" 
														ajaxSingle="true"
														ignoreDumpResponses="true"
														limitToList="true"
														eventsQueue="detailCheckList"
														reRender="purchaseData,detailDataContainer" />
												</aon:selectBooleanCheckbox>
											</aon:column>
											
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.purchase_item_supplier_code_abrv}" />
												</f:facet>
												<aon:outputText value="#{to.itemSupplierCode}">
													<aon:abbreviateConverter maxWidth="50" />
												</aon:outputText>
											</aon:column>
											
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_product}" />
												</f:facet>
												<aon:outputText value="#{to.description}">
													<aon:abbreviateConverter maxWidth="50" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_price}" />
												</f:facet>
												<aon:outputText value="#{(to.price)}">
													<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_discount_abrv}" />
												</f:facet>
												<aon:inputText 
													value="#{to.discountExpression.discountExpr}" size="4" >	
													<a4j:support event="onchange" reRender="purchaseData,detailDataContainer" 
														ajaxSingle="true" requestDelay="10" />
												</aon:inputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_invoice_sales}" />
												</f:facet>
												<aon:outputText value="#{(to.quantity)}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_pending}" />
												</f:facet>
												<aon:outputText value="#{(to.pendingQuantity)}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_transfer}" />
												</f:facet>
												<aon:inputText id="transfered"
													value="#{to.transfered}" size="4"	
													rendered="#{!to.item.wildCard}">
													<a4j:support event="onchange" reRender="purchaseData,detailDataContainer" ajaxSingle="true" requestDelay="10"
														actionListener="#{income.purchaseTransferManager.onTransferedChanged}" />
												</aon:inputText>	
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_amount}" />
												</f:facet>
												<aon:inputText disabled="#{true}" size="4"
													value="#{income.purchaseTransferManager.transferAmount}" />
											</aon:column>
	
											<aon:column id="buttonColumn">
												<f:facet name="header">
													<h:outputText value="&#160;" />
												</f:facet>
												<aon:div>
													<aon:outputText value="&#160;&#160;&#160;"
														rendered="#{income.purchaseTransferManager.transferedGreatherThanPending}" 
														styleClass="aon-padding-right aon-icon-point-orange" 
														title="#{bundle.warehouse_income_transfered_gt_quantity}" />
													
													<aon:commandButton value="&#160;" immediate="true"
														rendered="#{income.purchaseTransferManager.detailRowChecked and income.purchaseTransferManager.transferedLessThanPending}" 
														title="#{(to.forcePendingQuantityCancel)?(bundle.warehouse_income_purchase_product_transfered):(bundle.warehouse_income_purchase_product_pending)}"
														styleClass="aon-icon-commandButton #{(to.forcePendingQuantityCancel)?('aon-icon-point-red'):('aon-icon-point-light-green')}"
														actionListener="#{income.purchaseTransferManager.detailToCloseRowSelected}"
														reRender="buttonColumn" ajaxSingle="true">
													</aon:commandButton>
													
													<aon:outputText value="&#160;"
														title="#{bundle.product_item_serializable_wildcard_error}"
														rendered="#{to.item.wildCard}"
														styleClass="aon-finding-toolbar-item aon-icon-errorwarning aon-finding-toolbar-item-no-border" />
												</aon:div>
											</aon:column>
	
										</aon:dataTable>
									</aon:div>
					
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
