<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<style>
.title {
	font-size: 2.5rem;
	text-align: center;
}

.div-horizontal-center {
	display: flex;
	justify-content: center;
}

.box-column {
	display: flex;
	flex-direction: column;
}

.list {
	padding: 0 5rem;
	align-items: center;
}

.list>.list-item {
	height: 3rem;
	width: 100%;
	border-bottom: 1px solid #f1f1f1;
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 1rem 2rem;
	transition: background-color .25s;
	border-radius: .25rem;
	max-width: 50rem;
}

.list>.list-item:hover {
	/*background-color: #f6f6f6;*/
}

.list>.list-item>.button {
	height: 100%;
	background-size: 3rem;
	padding: 0;
	padding-left: 4.5rem;
	display: flex;
	align-items: center;
	font-size: 1.25rem;
	background-position: left center;
}

.list>.list-item>.button:hover {
	transform: none;
}

.list>.list-item>.icon-toolbar .icon {
	margin-left: .3rem;
	border-radius: 100%;
	padding: .2rem;
	cursor: pointer;
	color: #ccc;
	transition: color .15s, transform .15s;
}

.list>.list-item .icon-toolbar .icon:hover {
	color: #163776;
	transform: scale(1.1);
}

video {
	user-select: none;
	-moz-user-select: none;
	-webkit-user-select: none;
	-ms-user-select: none;
	border-radius: .35rem;
	box-shadow: 0px 0.25rem .5rem rgba(0, 0, 0, .15);
	max-width: 50rem;
	margin-bottom: 2rem;
}

* {
	scroll-behavior: smooth;
}

</style>
	<script>
		function showVideo(video) {
			const source = document.querySelector("#video-player > source");
			const player = document.querySelector("#video-player");
			const start = document.querySelector("#start");

			if (!player || !source)
				return;

			start.scrollIntoView();
			source.src = "http://ayudat.aonsolutions.net:8080/aon-aio/DriveServlet?action=video&amp;name="	+ video;
			player.load();
			player.play();
			
		}
	</script>
	<script type="module" src="./js/pdf/viewer.js"></script> 
	<script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script> 
	
	<div class="div-horizontal-center box-column">
	<span id="start"></span>
		<aon:div styleClass="box-column list">

			<video width="100%" controls="true" id="video-player" oncontextmenu="return false;"> 
				<source
					src="http://ayudat.aonsolutions.net:8080/aon-aio/DriveServlet?action=video&amp;name=intro.mp4"
					type="video/mp4" /> 
			</video>

		</aon:div>
	</div>
	
</ui:composition>
