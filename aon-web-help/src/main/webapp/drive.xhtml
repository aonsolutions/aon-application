<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

<style>
.div-horizontal-center {
	display: flex;
	justify-content: center;
	position: relative; 
	width:100%;
}

.box-column {
	display: flex;
	flex-direction: column;
}

.list {
	padding: 0 .2rem;
}

.list form {
	width: 100%;
}

.list .list-item {
	height: 3rem;
	border-bottom: 1px solid #f1f1f1;
	display: flex;
	justify-content: flex-start;
	align-items: center;
	padding: 1rem 2rem;
	transition: background-color .25s;
	border-radius: .25rem;
	font-weight: normal;
	color: #909090;
	
	font-size: 1.05rem;
	
	cursor:pointer;
	margin-right: 1rem;
}

.list .list-item:hover {
	background-color: #f6f6f6;
	color: #163776;
}

.list .list-item>.button {
	height: 100%;
	background-size: 3rem;
	padding: 0;
	padding-left: 4.5rem;
	display: flex;
	align-items: center;
	font-size: 1.25rem;
	background-position: left center;
}

.list .list-item>.button:hover {
	transform: none;
}

.list .list-item .icon {
	margin-right: .3rem;
	border-radius: 100%;
	padding: .2rem;
	cursor: pointer;
	color: #ccc;
	transition: color .15s, transform .15s;
	font-size: 1.60rem;
}

.list .list-item:hover .icon {
	color: #163776;
	/*transform: scale(1.1);*/
}


* {
	scroll-behavior: smooth;
}

.breadcrumb {
	/* background: dodgerblue;*/
	width: 100%;
	height: 2rem;
	display: flex;
	justify-content: flex-start;
	align-items: center;
	padding: 0 1rem;
	color: #ccc;
}

.breadcrumb .link {
	font-size: .8rem;
	font-weight: 900;
	cursor: pointer;
	color: #bbb;
	transition: .15s;
}

.breadcrumb .link:hover {
	color: #163776;
}

.breadcrumb form {
	display: flex;
	justify-content: center;
	align-items: center;
}

.breadcrumb separator {
	font.size: 1.35rem;
}

</style>	
	<ui:insert name="menu" >
		<ui:include src="/facelet/homepage/menu.xhtml" />
	</ui:insert>

	<aon:div styleCass="div-horizontal-center box-column" id="driveDiv">
		<span id="start"></span>
		<ui:include src="/facelet/breadcrumb/breadcrumb.xhtml" /> 
		
		<aon:div styleClass="box-column list">
		<c:forEach items="#{help.content}" var="file">
		
			<aon:form>
			
				<!-- FOLDER -->
				<aon:if test="${file.isFolder()}">
					<aon:commandLink  				
					styleClass="list-item" 
					reRender="driveDiv" 
					>
						<f:setPropertyActionListener target="#{help.file}" value="#{file}" />
						<aon:outputText value="folder" styleClass="icon material-icons" />
						<aon:outputText value="#{file.name}"/>
					</aon:commandLink>
				</aon:if>
				
				<!-- PDF -->
				<aon:if test="${file.isPDF()}">
					<aon:commandLink  				
					styleClass="list-item" 
					action="pdf_viewer"
					>
						<f:setPropertyActionListener target="#{help.file}" value="#{file}" />
						<aon:outputText value="picture_as_pdf" styleClass="icon material-icons" />
						<aon:outputText value="#{file.name}"/>
					</aon:commandLink>		
					
				</aon:if>
				
				<!-- VIDEO -->
				<aon:if test="${file.isVideo()}">		
					<aon:commandLink  				
					styleClass="list-item" 
					action="video_viewer"
					>
						<f:setPropertyActionListener target="#{help.file}" value="#{file}" />
						<aon:outputText value="play_circle" styleClass="icon material-icons" />
						<aon:outputText value="#{file.name}"/>
					</aon:commandLink>		
					
				</aon:if>
				
			</aon:form>
			
		</c:forEach>
				
		</aon:div>
	</aon:div>
	
</ui:composition>
