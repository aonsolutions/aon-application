<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<style>
		.breadcrumb {
			position: relative;
			box-sizing: border-box;
			width: 100%;
			height: 2rem;
			display: flex;
			justify-content: flex-start;
			align-items: center;
			padding: 0 1rem;
			color: #ccc;
		}
		
		.breadcrumb .link {
			font-size: .8rem;
			font-weight: 900;
			cursor: pointer;
			color: #bbb;
			transition: .15s;
		}
		
		.breadcrumb .link:hover {
			color: #163776;
		}
		
		.breadcrumb form {
			display: flex;
			justify-content: center;
			align-items: center;
		}
		
		.breadcrumb separator {
			font.size: 1.35rem;
		}
	</style>
	
	<aon:div styleClass="breadcrumb" >			
			<c:forEach items="#{help.breadcrumb}" var="file">
				<aon:form>
						<!-- immediate="true" reRender="driveDiv" -->
					<!-- FOLDER -->
					<aon:if test="${file.isFolder()}">
						<aon:commandLink  
							action="drive"
							styleClass="list-item" 
							>
							<f:setPropertyActionListener target="#{help.file}" value="#{file}" />
						<span class="link">#{file.name}</span>
						</aon:commandLink>
					</aon:if>
					
					<!-- PDF -->
					<aon:if test="${file.isPDF()}">
						<aon:commandLink  
								styleClass="list-item" 
								action="pdf_viewer"
								>
								<f:setPropertyActionListener target="#{help.file}" value="#{file}" />
							<span class="link">#{file.name}</span>
							</aon:commandLink>
					</aon:if>			
							
					<!-- VIDEO -->
					<aon:if test="${file.isVideo()}">
						<aon:commandLink   
								styleClass="list-item" 
								action="video_viewer"
								>
								<f:setPropertyActionListener target="#{help.file}" value="#{file}" />
							<span class="link">#{file.name}</span>
							</aon:commandLink>
					</aon:if>		
					
					<span class="separator material-icons">navigate_next</span>
				</aon:form>
			</c:forEach>
			
		</aon:div>
	
</ui:composition>
