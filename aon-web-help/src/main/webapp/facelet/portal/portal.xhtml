	<script type="text/javascript">
		//<![CDATA[
		
		var dotContainer = document.getElementsByClassName("dotContainer")[0];
		var dotsHTML = ""
		for (i = 0; i < slideCount; i++) {
			var x = i+1;
			dotsHTML += "<span class='dot' onclick='currentSlide(" + x + ")'></span>"
		}
		dotContainer.innerHTML = dotsHTML; 

		showSlides(slideIndex);
		
		// Next/previous controls
		function plusSlides(n) {
			showSlides(slideIndex += n);
		}

		// Thumbnail image controls
		function currentSlide(n) {
			showSlides(slideIndex = n);
		}

		function showSlides(n) {
			var i;
			var slides = document.getElementsByClassName("mySlides");
			var dots = document.getElementsByClassName("dot");
			if (n > slides.length) {slideIndex = 1}
			if (n < 1) {slideIndex = slides.length}
			for (i = 0; i < slides.length; i++) {
				slides[i].style.display = "none";
			}
			for (i = 0; i < dots.length; i++) {
				dots[i].className = dots[i].className.replace(" active", "");
			}
			slides[slideIndex-1].style.display = "block";
			dots[slideIndex-1].className += " active";
			
			// ÑAPON para hacer que el gráfico se pinte on el tamaño adecuado
			// al estar el DIV con "display:none", el chart no sabe sus dimensiones
			// se repinta una vez es "display:block"
			if ( slideIndex == drawChartsYearPygGraphIndex) {
				drawChartsYearPygGraph();
			} else if ( slideIndex == drawChartsMonthPygGraphIndex) {
				drawChartsMonthPygGraph();
			} else  if ( slideIndex == drawChartsAccountExpenseGraphIndex) {
				drawChartsAccountExpenseGraph();
			}
			// ---------------------
			// ---------------------
		}
		//]]>
	</script>
