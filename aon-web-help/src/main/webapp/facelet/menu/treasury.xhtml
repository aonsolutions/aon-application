<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="treasuryMenu">

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{aonRole.financeOperator}">
					<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
	
						<aon:panelGroup>
	
							<aon:panelGrid id="group_treasury_charge"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-charge aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_charge_menu}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financeCharge-treasury"
											action="finance_search-Charge"
											actionListener="#{finance.onEditSearchCharge}"
											value="#{bundle.finance_charge_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fbatchCharge" 
											action="fbatch_search-Charge"
											actionListener="#{fbatch.onEditSearchCharge}"
											value="#{bundle.finance_fbatch_charge_module}">
											<f:setPropertyActionListener target="#{fbatch.payroll}"
												value="#{false}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
	
							<aon:panelGrid id="group_treasury_payment"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-payment aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_payment_menu}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financePayment-treasury"
											action="finance_search-Payment"
											actionListener="#{finance.onEditSearchPayment}"
											value="#{bundle.finance_payment_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fbatchPayment" 
											action="fbatch_search-Payment"
											actionListener="#{fbatch.onEditSearchPayment}"
											value="#{bundle.finance_fbatch_payment_module}">
											<f:setPropertyActionListener target="#{fbatch.payroll}"
												value="#{false}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="fPaymentPrint" 
											action="fPaymentPrint_search"
											actionListener="#{fPaymentPrint.onEditSearchPayment}"
											value="#{bundle.finance_fPaymentPrint_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
	
							<aon:if test="#{bankStatement.availableRegistryBanks > 0}">
								<aon:panelGrid id="group_treasury_bank_statement"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-icon-statement aon-direct-access-panel">
									<f:facet name="header">
										<aon:outputText value="#{bundle.finance_statement_menu}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="bankStatement"
												action="bankStatement_search"
												actionListener="#{bankStatement.onEditSearch}"
												value="#{bundle.finance_bank_statement_module}"/>
										</aon:div>
									</aon:div>
								</aon:panelGrid>
							</aon:if>
	
							<aon:if test="#{actionDenied.moduleEnabled['hotel']}">
								<aon:panelGrid id="group_treasury_fbatch_utilities"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-icon-utilities-folder aon-direct-access-panel">
									<f:facet name="header">
										<aon:outputText value="#{bundle.finance_fbatch_utilities}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="pos_finance_batch" 
												action="posFinance_search"
												actionListener="#{posFinance.onEditSearch}"
												value="#{bundle.finance_posFinance_module}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="reservation_finance_batch" 
												action="reservationFinanceBatch"
												actionListener="#{reservationFinanceBatch.onEditSearch}"
												value="#{bundle.pms_reservation_finance_batch_module}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="paymentCardSettle" 
												action="paymentCardSettle_search"
												actionListener="#{paymentCardSettle.onInit}"
												value="#{bundle.pms_paymentCardSettle_module}" />
										</aon:div>
									</aon:div>
								</aon:panelGrid>
							</aon:if>									

						</aon:panelGroup>
	
						<aon:panelGroup>

							<aon:panelGrid id="group_treasury_prepayment"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-product aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_prepayments}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="prepayment-trasury"
											action="prepayment_search"
											actionListener="#{prepayment.onEditSearch}"
											value="#{bundle.finance_prepayment_module}" />
									</aon:div>
									<div style='height: 26px;'></div>
								</aon:div>
							</aon:panelGrid>

							<aon:if test="#{cashFlowForecast.availableRegistryBanks > 0}">
								<aon:panelGrid id="group_treasury_forecast"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-icon-forecast aon-direct-access-panel">
									<f:facet name="header">
										<aon:outputText value="#{bundle.finance_forecast_menu}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="cashFlowForecast"
												action="cashFlowForecast_search"
												actionListener="#{cashFlowForecast.onEditSearch}"
												value="#{bundle.finance_cashflow_forecast_module}"/>
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="cashFlowForecastReport"
												action="cashFlowForecastReport_search"
												actionListener="#{cashFlowForecastReport.onEditSearch}"
												value="#{bundle.finance_cashflow_forecast_report_module}"/>
										</aon:div>
										<aon:if test="#{domainSwitcher.betaDomain}">
											<aon:div styleClass="aon-direct-access-list-element">
												<aon:commandLink id="gwt_fee_print_anual"
													action="gwt_fee_projection"
													title="#{bundle.finance_fee_print_proy_module}">
													<aon:outputText styleClass="aon-fiscal-link-label aon-icon-beta-text"
														style="margin-left: 5px; padding-left: 20px;" 
														value="#{bundle.finance_fee_print_proy_module}" />												
												</aon:commandLink>
											</aon:div>
										</aon:if>
									</aon:div>
								</aon:panelGrid>
							</aon:if>
	
							<aon:panelGrid id="group_treasury_utilities"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_utilities}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="corporateIdentityReceipt"
											action="corporateIdentity_receipt"
											actionListener="#{corporateIdentity.onInit}"
											value="#{bundle.registry_corporateIdentity_receipt}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="checks"
											action="financePrint_checking"
											value="#{bundle.finance_checking_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="checks2"
											action="financeChecking_form"
											value="#{bundle.finance_invoice_checking_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sddMandate"
											action="sddMandate_search"
											actionListener="#{sddMandate.onEditSearch}"
											value="#{bundle.finance_sddMandate_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
	
						</aon:panelGroup>
	
					</h:panelGrid>
				</aon:if>
			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
