<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle"
					value="#{accountBundle.account_leasing_fee_entry_module}" />
				<ui:param name="toolbarDescription"
					value="#{leasingFeeEntry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{leasingFeeEntry.accept}"
						action="account_entry_form" 
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return true;">
					</aon:commandButton>
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{leasingFeeEntry.onReset}"
						rendered="#{!leasingFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
					</aon:commandButton>
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{leasingFeeEntry.onRemove}"
						rendered="#{!leasingFeeEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
						onclick="if (confirm('#{bundle.aon_remove_confirm}')) return true;">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="invoice_series"
						value="#{accountBundle.account_series_number}" />
					<aon:div>
						<aon:inputText id="invoice_series"
							value="#{leasingFeeEntry.header.series}" size="4" maxlength="5" />
						<aon:inputText id="invoice_number"
							value="#{leasingFeeEntry.header.number}" size="7" maxlength="7">
							<f:validateLength maximum="7" />
						</aon:inputText>
					</aon:div>

					<aon:outputLabel for="date"
						value="#{accountBundle.account_concept}" />
					<aon:selectOneMenu value="#{leasingFeeEntry.header.concept}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{accountCollections.autoConcepts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate size="8" id="date" required="true"
						value="#{leasingFeeEntry.header.leasingFeeDate}"
						enableManualInput="true" datePattern="dd/MM/yyyy"
						timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="leasing"
						value="#{accountBundle.account_leasing}" />
					<aon:selectOneMenu id="leasing" required="true"
						ajaxSingle="true"
						reRender="vat_percentage,taxableBase,total,supplierName,supplierDocument"
						value="#{leasingFeeEntry.header.leasing}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{accountCollections.leasings}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="supplierName"
						value="#{bundle.aon_company_name}" />
					<aon:inputText id="supplierName"
						value="#{leasingFeeEntry.header.leasing.supplierName}" size="60" />

					<aon:outputLabel for="supplierDocument"
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="supplierDocument"
						value="#{leasingFeeEntry.header.leasing.supplierDocument}"
						size="12" />

					<aon:outputLabel for="amortization"
						value="#{accountBundle.account_amortization}" />
					<aon:inputText id="amortization"
						reRender="taxableBase,total" ajaxSingle="true"
						value="#{leasingFeeEntry.header.amortization}" size="7" />

					<aon:outputLabel for="interest"
						value="#{accountBundle.account_interest}" />
					<aon:inputText id="interest" reRender="taxableBase,total"
						ajaxSingle="true" value="#{leasingFeeEntry.header.interest}"
						size="7" />

					<aon:outputLabel for="taxableBase"
						value="#{accountBundle.account_taxableBase}" />
					<aon:inputText id="taxableBase"
						value="#{leasingFeeEntry.header.taxableBase}" disabled="true"
						size="7" />

					<aon:outputLabel for="vat_percentage"
						value="#{accountBundle.account_vat}" />
					<aon:inputText id="vat_percentage" disabled="true"
						value="#{leasingFeeEntry.header.leasing.vat.percentage}"
						size="7" />

					<aon:outputLabel for="expenses"
						value="#{accountBundle.account_expenses}" />
					<aon:inputText id="expenses" reRender="total"
						ajaxSingle="true" value="#{leasingFeeEntry.header.expenses}"
						size="7" />

					<aon:outputLabel for="total"
						value="#{accountBundle.account_total}" />
					<aon:inputText id="total"
						value="#{leasingFeeEntry.header.total}" disabled="true" size="7" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{financeBundle.finance_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{leasingFeeEntry.header.RBank}"
						reRender="RegistryBank_bankAccount" ajaxSingle="true">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{financeBundle.finance_bank_account}" />
					<aon:div id="RegistryBank_bankAccount">
						<aon:outputText value="#{leasingFeeEntry.header.RBank.bankAccount}" />
						<aon:outputText value="&#160;" />
					</aon:div>

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{leasingFeeEntry.header.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
