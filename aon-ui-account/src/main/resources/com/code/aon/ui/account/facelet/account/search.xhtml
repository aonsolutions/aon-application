				<ui:define name="toolbarContent">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{account.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="account_list" />				
				
					<aon:outputLabel for="Account_id"
						value="#{accountBundle.aon_account_id}" />
					<aon:inputText id="Account_id" size="50"
						valueChangeListener="#{account.addExpression}" />

					<aon:outputLabel for="Account_description"
						value="#{accountBundle.aon_account_description}" />
					<aon:inputText id="Account_description" size="50"
						valueChangeListener="#{account.addExpression}" />

					<aon:outputLabel for="Account_alias"
						value="#{accountBundle.aon_account_alias}" />
					<aon:inputText id="Account_alias" size="50"
						valueChangeListener="#{account.addExpression}" />

					<aon:outputLabel for="Account_entryEnabled"
						value="#{accountBundle.aon_account_entryEnabled}" />
					<aon:selectOneMenu id="Account_entryEnabled"
						valueChangeListener="#{account.addExpression}">
						<f:selectItem itemLabel="-" itemDisabled="true" itemValue="" />
						<f:selectItem itemLabel="#{accountBundle.aon_yes}"
							itemValue="true" />
						<f:selectItem itemLabel="#{accountBundle.aon_no}"
							itemValue="false" />
					</aon:selectOneMenu>
