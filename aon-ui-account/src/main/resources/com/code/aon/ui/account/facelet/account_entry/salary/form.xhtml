<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountSalaryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{appBundle.account_salary_entry}" />
				<ui:param name="toolbarDescription" value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">

					<h:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountSalary.accept}"
						action="account_entry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))" />
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountSalary.onReset}"
						rendered="#{!accountSalary.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<h:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountSalary.onRemove}"
						rendered="#{!accountSalary.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'))" />
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" required="true" id="Account_date"
						value="#{accountSalary.header.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy"
						timeZone="#{timeZoneController.timeZone}">
					</aon:selectInputDate>

					<aon:outputLabel for="Account_Period"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:selectOneMenu id="Account_Period"
						value="#{accountSalary.header.period.id}">
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_description"
						value="#{accountBundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{accountSalary.header.description}" size="60" />

					<aon:outputLabel for="Account_gross_salary"
						value="#{accountBundle.aon_gross_salary}" />
					<aon:inputText id="Account_gross_salary"
						value="#{accountSalary.header.grossSalary}" size="15"
						ajaxSingle="true" reRender="Account_net_salary">
						<!-- 
						<f:validateDoubleRange />
 -->
					</aon:inputText>

					<aon:outputLabel for="Account_retention"
						value="#{accountBundle.aon_retention}" />
					<aon:inputText id="Account_retention"
						value="#{accountSalary.header.retention}" size="15"
						ajaxSingle="true" reRender="Account_net_salary">
						<!-- 
						<f:validateDoubleRange />
-->
					</aon:inputText>

					<h:outputLabel for="Account_social_insurance"
						value="#{accountBundle.aon_social_insurance}" />
					<aon:inputText id="Account_social_insurance"
						value="#{accountSalary.header.socialInsurance}" size="15"
						ajaxSingle="true" reRender="Account_net_salary">
						<!-- 
						<f:validateDoubleRange />
						 -->
					</aon:inputText>

					<aon:outputLabel for="Account_net_salary"
						value="#{accountBundle.aon_net_salary}" />
					<aon:inputText id="Account_net_salary"
						value="#{accountSalary.header.netSalary}" disabled="true"
						size="15">
						<!-- 
						<f:validateDoubleRange />
 -->
					</aon:inputText>

					<aon:outputLabel for="RegistryBank_id"
						value="#{accountBundle.aon_bank}" />
					<aon:selectOneMenu id="RegistryBank_id"
						value="#{accountSalary.header.RBank.id}"
						reRender="RegistryBank_bankAccount"
						valueChangeListener="#{accountSalary.onRBankChange}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{financeBundle.aon_bank_account}" />
					<aon:div id="RegistryBank_bankAccount">
						<aon:outputText value="#{accountSalary.header.RBank.bankAccount}" />
						<aon:outputText value="&#160;" />
					</aon:div>

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{accountSalary.header.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
