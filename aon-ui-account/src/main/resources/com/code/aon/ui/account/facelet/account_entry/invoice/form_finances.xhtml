<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:panelCollapsible>
		<f:facet name="header">
			<aon:outputText value="#{accountBundle.aon_finances}" />
		</f:facet>

		<aon:editDataTable id="FinancesData" var="financeTo" rows="0"
			value="#{accountInvoice.finances}"
			columnClasses="aon-editDataTable-iconColumn, 
					aon-editDataTable-textColumn,
					aon-editDataTable-textColumn,
					aon-editDataTable-textColumn,
					aon-editDataTable-textColumn,
					aon-editDataTable-numberColumn,
					aon-editDataTable-buttonsColumn">

			<h:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:commandLink immediate="#{true}" reRender="FinancesData"
					styleClass="aon-table-row-selected"
					rendered="#{financeTo!=accountInvoice.currentFinance}"
					disabled="#{!accountInvoice.accountSource}"
					actionListener="#{accountInvoice.onSelectFinance}" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton value="" reRender="FinancesData"
							styleClass="aon-editDataTable-button aon-icon-new"
							title="#{accountBundle.aon_newLine}"
							disabled="#{!accountInvoice.accountSource}"
							actionListener="#{accountInvoice.onNewFinance}"
							rendered="#{!accountInvoice.newFinance}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</h:column>

			<h:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_date}" />
				</f:facet>
				<aon:outputText id="Account_Finance_DueDate"
					rendered="#{financeTo!=accountInvoice.currentFinance}"
					value="#{financeTo.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate size="8" id="Account_Finance_DueDate-Edit"
					rendered="#{financeTo==accountInvoice.currentFinance}"
					value="#{accountInvoice.currentFinance.dueDate}"
					enableManualInput="true" datePattern="#{bundle.aon_date_pattern}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}" />
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:selectInputDate size="8" id="Account_Finance_DueDate-New"
							rendered="#{accountInvoice.newFinance}"
							value="#{accountInvoice.currentFinance.dueDate}"
							enableManualInput="true" datePattern="#{bundle.aon_date_pattern}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}" />
						</aon:selectInputDate>
					</aon:div>
				</f:facet>
			</h:column>

			<h:column>
				<f:facet name="header">
					<h:outputText value="#{accountBundle.aon_pay_method}" />
				</f:facet>
				<h:outputText value="#{financeTo.payMethod.name}"
					rendered="#{financeTo!=accountInvoice.currentFinance}" />
				<h:selectOneMenu styleClass="aon-form-selectOneMenu-field"
					rendered="#{financeTo==accountInvoice.currentFinance}"
					value="#{accountInvoice.currentFinance.payMethod.id}"
					valueChangeListener="#{accountInvoice.onPayMethodChange}">
					<f:selectItems value="#{financeCollections.payMethods}" />
				</h:selectOneMenu>
				<f:verbatim>&#160;</f:verbatim>
				<f:facet name="footer">
					<h:selectOneMenu styleClass="aon-form-selectOneMenu-field"
						rendered="#{accountInvoice.newFinance}"
						value="#{accountInvoice.currentFinance.payMethod.id}"
						valueChangeListener="#{accountInvoice.onPayMethodChange}">
						<f:selectItems value="#{financeCollections.payMethods}" />
					</h:selectOneMenu>
				</f:facet>
			</h:column>

			<aon:column width="300">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_bank}" />
				</f:facet>
				<aon:outputText value="#{financeTo.bank.name}"
					rendered="#{financeTo!=accountInvoice.currentFinance}" />

				<ui:decorate template="/com/code/aon/ui/finance/lookup/bank/bankIdInput.xhtml">
					<ui:param name="bank_id" value="bankId" />
					<ui:param name="renderedAttr"
						value="#{financeTo==accountInvoice.currentFinance and accountInvoice.sales}" />
					<ui:param name="disabled" value="#{false}" />
					<ui:param name="reRenderAttr" value="none" />
					<ui:param name="required" value="#{false}" />
					<ui:param name="renderDescription" value="#{false}" />
					<ui:param name="bankEntity"
						value="#{accountInvoice.currentFinance.bank}" />
					<ui:param name="bankELExpression"
						value="accountInvoice.currentFinance.bank" />
				</ui:decorate>
				<f:facet name="footer">
					<ui:decorate template="/com/code/aon/ui/finance/lookup/bank/bankIdInput.xhtml">
						<ui:param name="bank_id" value="bankIdNew" />
						<ui:param name="renderedAttr"
							value="#{accountInvoice.newFinance and accountInvoice.sales}" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="required" value="#{false}" />
						<ui:param name="renderDescription" value="#{false}" />
						<ui:param name="bankEntity"
							value="#{accountInvoice.currentFinance.bank}" />
						<ui:param name="bankELExpression"
							value="accountInvoice.currentFinance.bank" />
					</ui:decorate>
				</f:facet>
			</aon:column>

			<h:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_bank_account}" />
				</f:facet>
				<aon:outputText id="RegistryBank_Lookup_bankAccount"
					rendered="#{financeTo!=accountInvoice.currentFinance}"
					value="#{financeTo.bankAccount}">
				</aon:outputText>
				<aon:inputText id="RegistryBank_Lookup_bankAccount-Edit"
					rendered="#{financeTo==accountInvoice.currentFinance}"
					value="#{accountInvoice.currentFinance.bankAccount}"
					required="#{true}" />
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:inputText id="RegistryBank_Lookup_bankAccount-New"
							rendered="#{accountInvoice.newFinance}"
							value="#{accountInvoice.currentFinance.bankAccount}">
						</aon:inputText>
					</aon:div>
				</f:facet>
			</h:column>

			<h:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_amount}" />
				</f:facet>
				<aon:outputText id="Account_Finance_Amount"
					rendered="#{financeTo!=accountInvoice.currentFinance}"
					value="#{financeTo.amount}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Finance_Amount-Edit" size="10"
					rendered="#{financeTo==accountInvoice.currentFinance}"
					value="#{accountInvoice.currentFinance.amount}" required="#{true}" />
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:inputText id="Account_Finance_Amount-New" size="10"
							rendered="#{accountInvoice.newFinance}"
							value="#{accountInvoice.currentFinance.amount}">
						</aon:inputText>
					</aon:div>
				</f:facet>
			</h:column>

			<h:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div rendered="#{financeTo==accountInvoice.currentFinance}">
					<aon:commandButton title="#{bundle.aon_save}"
						reRender="FinancesData"
						actionListener="#{accountInvoice.onUpdateFinance}"
						styleClass="aon-editDataTable-button aon-icon-accept" value=""
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						reRender="FinancesData"
						actionListener="#{accountInvoice.onCancelFinance}"
						immediate="#{true}"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton title="#{bundle.aon_remove}"
						reRender="FinancesData"
						actionListener="#{accountInvoice.onRemoveFinance}"
						immediate="#{true}"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-delete" value=""
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{accountInvoice.newFinance}">
							<aon:commandButton title="#{bundle.aon_save}"
								reRender="FinancesData"
								actionListener="#{accountInvoice.onAddFinance}"
								onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-accept" value=""
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{accountInvoice.onCancelFinance}"
								reRender="FinancesData" immediate="#{true}"
								onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</aon:div>
				</f:facet>
			</h:column>
		</aon:editDataTable>
	</aon:panelCollapsible>

</ui:composition>
