<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountEntryForm" styleClass="aon-form">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.account_entry}" />
				<ui:param name="toolbarDescription" value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="additionalToolbarContent">
					<h:commandButton type="reset" id="clear"
						value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}" action="account_entry_form"
						actionListener="#{accountEntry.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<h:commandButton id="back" value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}" action="account_entry_list"
						actionListener="#{accountEntry.onCancel}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" />
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">

					<aon:methodParam name="searchActionListener"
						value="#{accountEntry.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="account_entry_form" />

					<aon:outputLabel for="AccountEntry_id"
						value="#{accountBundle.aon_id}" />
					<aon:inputText id="AccountEntry_id" size="10"
						valueChangeListener="#{accountEntry.addExpression}" />

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:inputText id="AccountEntry_accountPeriod" size="10"
						valueChangeListener="#{accountEntry.addExpression}" />

					<aon:outputLabel for="AccountEntry_type"
						value="#{accountBundle.aon_type}" />
					<aon:selectOneMenu id="AccountEntry_type"
						converter="accountEntryTypeConverter"
						valueChangeListener="#{accountEntry.addEqualExpression}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountCollections.accountTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{accountBundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="AccountEntry_entryDate-From"
							styleClass="aon-tip" value="#{accountBundle.aon_date_from}" />
						<aon:selectInputDate size="8" id="AccountEntry_entryDate-From"
							value="#{accountEntry.fromDate}"
							valueChangeListener="#{accountEntry.addEntryDateFromExpression}">
						</aon:selectInputDate>
						<aon:outputLabel for="AccountEntry_entryDate-To"
							styleClass="aon-tip" value="#{accountBundle.aon_date_to}" />
						<aon:selectInputDate size="8" id="AccountEntry_entryDate-To"
							value="#{accountEntry.toDate}"
							valueChangeListener="#{accountEntry.addEntryDateToExpression}">
						</aon:selectInputDate>
					</aon:div>

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						converter="enumConverter"
						valueChangeListener="#{accountEntry.addDirectExpression}">
						<f:selectItem value="#{nullItem.value}" />
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
