<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{menuBundle.account_loan_entry}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountLoan.accept}" action="account_entry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;">
					</aon:commandButton>
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountLoan.onRemove}"
						rendered="#{!accountLoan.new}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;">
					</aon:commandButton>
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountLoan.onReset}"
						rendered="#{!accountLoan.new}"
						styleClass="aon-finding-toolbar-item aon-icon-new">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date" required="true"
						value="#{accountLoan.loan.loanDate}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="Account_description"
						value="#{accountBundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{accountLoan.loan.description}" size="60" />

					<aon:outputLabel for="Account_term"
						value="#{accountBundle.aon_loan_term}" />
					<aon:inputText id="Account_term" value="#{accountLoan.loan.term}"
						size="16"/>

					<aon:outputLabel for="Account_interest"
						value="#{accountBundle.aon_loan_interest}" />
					<aon:inputText id="Account_interest"
						value="#{accountLoan.loan.interest}" size="60" />

					<aon:outputLabel for="Account_review"
						value="#{accountBundle.aon_loan_review}" />
					<aon:inputText id="Account_review"
						value="#{accountLoan.loan.review}" size="60" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{accountBundle.aon_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{accountLoan.loan.registryBank.id}"
						reRender="RegistryBank_bankAccount"
						valueChangeListener="#{accountLoan.onRBankChange}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_bankAccount"
						value="#{financeBundle.aon_bank_account}" />
					<aon:inputText id="RegistryBank_bankAccount"
						value="#{accountLoan.loan.registryBank.bankAccount}"
						disabled="true" size="35" />

					<aon:outputLabel for="Account_amount"
						value="#{accountBundle.aon_loan_amount}" />
					<aon:inputText id="Account_amount"
						value="#{accountLoan.loan.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Account_expenses"
						value="#{accountBundle.aon_loan_expenses}" />
					<aon:inputText id="Account_expenses"
						value="#{accountLoan.loan.expenses}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Leasing_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="Leasing_securityLevel"
						value="#{accountLoan.loan.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
