<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.account_abstract}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{accStatement.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="accStatement_search" />
				</ui:define>
<!-- 
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="trialBalance" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="trialBalance" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
				</ui:define>
 -->				
				
			</ui:decorate>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="statementList" value="#{accStatement.model}"
					rows="#{accStatement.rowsPerPage}" var="to"
					rendered="#{accStatement.model.rowCount > 0}">

					<aon:column styleClass="#{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account}" />
						</f:facet>
						<h:commandLink immediate="#{true}" 
							style="margin-left: #{(to.level-1)/2}em;" 
							styleClass="aon-dataTable-link"
							actionListener="#{accStatement.onStatement}"
							action="accStatement_list">
							<aon:outputText value="#{to.id}" />
						</h:commandLink>
					</aon:column>

					<aon:column styleClass="#{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.shortDescription}" />
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{accountBundle.aon_total}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{accStatement.summaryCollection.debit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{accStatement.summaryCollection.credit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_debit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.unpaidBalance}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{accStatement.summaryCollection.unpaidBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_credit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.creditBalance}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{accStatement.summaryCollection.creditBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="statementList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
