<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="Account_id" value="#{bundle.aon_id}" />
	<aon:inputText id="Account_id" value="#{controller.to.id}"
		required="#{true}" size="10" maxlength="9" disabled="#{!controller.new}">
		<f:validateLength maximum="9" />
		<a4j:support event="onchange" ajaxSingle="true"
			actionListener="#{controller.onIdentifierChanged}" reRender="dataTable"
			focus="Account_description" />
	</aon:inputText>

	<aon:outputLabel for="Account_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Account_description"
		value="#{controller.to.description}" required="#{true}" size="60">
		<f:validateLength maximum="100" />
	</aon:inputText>

	<aon:outputLabel for="Account_alias" value="#{bundle.aon_alias}" />
	<aon:inputText id="Account_alias" value="#{controller.to.alias}" size="20">
		<f:validateLength maximum="32" />
	</aon:inputText>
</ui:composition>
