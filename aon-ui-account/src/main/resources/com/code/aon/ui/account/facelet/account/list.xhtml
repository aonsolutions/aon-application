<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.account_module}" />
				<ui:param name="controller" value="#{account}" />
				
				<ui:define name="additionalToolbarContent">
					<ui:include src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
					<aon:commandLink id="pgc-export"  value="&#160;" 
							onclick="pgcx('#{pgcExport.code}', '#{pgcExport.description}',
									'#{pgcExport.alias}', '#{pgcExport.active}',
									'#{pgcExport.costCenter}', '#{pgcExport.entryEnabled}')"
							styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:commandLink>
					<aon:htmlCommandLink id="accountModule-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="accountModule" />
					</aon:htmlCommandLink>
				</ui:define>
					
			</ui:decorate>			
 
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{account}" />
					<ui:define name="columns">
 
						<ui:decorate template="/com/code/aon/ui/account/facelet/account/listContent.xhtml"/>						
							
						<aon:column alias="Account.alias"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" />
						</aon:column>
	
						<aon:column alias="Account.active"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_active}" />
							</f:facet>
							<aon:div styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}">
								<aon:outputText value="&#160;" />
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
