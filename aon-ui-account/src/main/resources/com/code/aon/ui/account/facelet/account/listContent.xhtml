<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column alias="Account.code"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.code}"
			style="margin-left: #{(to.level-1)/2}em;"/>
	</aon:column>

	<aon:column alias="Account.description"
		styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}" />
	</aon:column>

	<aon:column alias="Account.costCenter"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{accountBundle.account_cost_center}" />
		</f:facet>
		<aon:outputText value="#{to.costCenter}"/>
	</aon:column>

</ui:composition>
