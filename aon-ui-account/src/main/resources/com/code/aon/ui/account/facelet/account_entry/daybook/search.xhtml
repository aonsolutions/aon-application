<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="abstractForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/toolbar.xhtml">
				<ui:define name="toolbarTitle">
					<aon:outputText value="#{appBundle.account_daybook}" />
				</ui:define>

				<ui:define name="toolbarDescription">
					<aon:outputText value="#{bundle.aon_search}" />
				</ui:define>

				<ui:define name="toolbarContent">

					<h:commandButton id="search" value="#{bundle.aon_search}"
						accesskey="#{bundle.aon_key_search}" action="daybook_list"
						actionListener="#{accountEntryReport.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
					<h:commandButton type="reset" id="clear"
						value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountEntryReport.period}"
						valueChangeListener="#{accountEntryReport.addExpression}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{accountBundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{accountBundle.aon_date_from}" />
						<aon:selectInputDate size="8"
							id="AccountEntryDetail_accountEntry_entryDate-From"
							enableManualInput="true" value="#{accountEntryReport.fromDate}"
							valueChangeListener="#{accountEntryReport.addEntryDateFromExpression}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}" />
						</aon:selectInputDate>
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{accountBundle.aon_date_to}" />
						<aon:selectInputDate size="8"
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{accountEntryReport.toDate}"
							valueChangeListener="#{accountEntryReport.addEntryDateToExpression}"
							enableManualInput="true">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}" />
						</aon:selectInputDate>
					</aon:panelGrid>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_securityLevel"
						converter="enumConverter" forceId="#{true}"
						valueChangeListener="#{accountEntryReport.addDirectExpression}">
						<f:selectItem value="#{nullItem.value}" />
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
