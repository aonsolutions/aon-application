<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.account_abstract}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{accStatement.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction"
						value="#{accStatement.getNextView}" />

					<aon:outputLabel for="reportDate"
						value="#{accountBundle.aon_report_date}" />
					<aon:selectInputDate size="8" id="reportDate"
						value="#{accStatement.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="Account_id"
						value="#{accountBundle.aon_account}" />
					<aon:inputText id="Account_id" value="#{accStatement.account}"
						size="14" />

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accStatement.period}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{accountBundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							styleClass="aon-form-date-label"
							value="#{accountBundle.aon_date_from}" />
						<aon:selectInputDate size="8"
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{accStatement.fromDate}" enableManualInput="true"
							datePattern="dd/MM/yyyy"
							timeZone="#{timeZoneController.timeZone}" />

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							styleClass="aon-form-date-label"
							value="#{accountBundle.aon_date_to}" />
						<aon:selectInputDate size="8"
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{accStatement.toDate}" enableManualInput="true"
							datePattern="dd/MM/yyyy"
							timeZone="#{timeZoneController.timeZone}" />
					</aon:panelGrid>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_zero_sum"
							value="#{accStatement.zeroSumVisible}" />
						<aon:outputLabel for="Account_zero_sum" styleClass="aon-bold"
							value="#{accountBundle.aon_zero_account}" />
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
