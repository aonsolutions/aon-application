<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="skipLabel" default="#{true}" />

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookup.xhtml" >
		<ui:param name="controller" value="#{account}" />
		<ui:param name="lookupBean" value="#{accountLookup}" />
		<ui:param name="lookupInputSize" value="10"/>
		<ui:param name="lookupInputMaxLength" value="9"/>
		<ui:param name="lookupInputSuggestValue" value="#{lookupTo.description}"/>
		<ui:param name="lookupInputSuggestExpression" value="#{lto.id} (#{lto.description})"/>
		<ui:param name="lookupInputSuggestSize" value="40" />
		<ui:param name="lookupInputOnSubmit" 
			value="if (this.value.indexOf('.') != -1) {
						arr = this.value.split('.');
						if (arr.length > 1) {
							account_prefix = arr[0];
							account_suffix = arr[1];
							for (i=(account_prefix.length + account_suffix.length); i&lt;9; i++) {
								account_prefix += '0';
							}
							this.value = account_prefix + account_suffix;
						}
					};"/>		
		<ui:param name="searchButtonTitle" value="#{accountBundle.account_selection}" />
		<ui:param name="newButtonTitle" value="#{accountBundle.account_module}" />
	</ui:decorate>

</ui:composition>
