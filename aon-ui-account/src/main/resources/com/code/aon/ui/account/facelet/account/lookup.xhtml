<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="skipLabel" default="#{true}" />

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookup.xhtml" >
		<ui:param name="controller" value="#{account}" />
		<ui:param name="lookupBean" value="#{accountLookup}" />
		<ui:param name="skipInputText" value="#{true}"/>
		<ui:param name="lookupInputSuggestValue" value="#{lookupTo.description}"/>
		<ui:param name="lookupInputSuggestExpression" value="#{lto.id} (#{lto.description})"/>
		<ui:param name="lookupInputSuggestSize" value="40" />
		<ui:param name="searchButtonTitle" value="#{accountBundle.account_selection}" />
		<ui:param name="newButtonTitle" value="#{accountBundle.account_module}" />
		
		<ui:define name="beforeLookupContent">
			<aon:lookupSuggestText id="#{pojoName}_id#{lookupSuffix}"
				lookup="#{lookupBean}" lookupProperty="#{lookupProperty}"
				value="#{lookupTo.id}" property="#{lookupTo}" 
				suggestAlias="Account_id" matchBeginOnly="#{true}"
				columnExpression="#{lookupInputSuggestExpression}"
				size="10" maxlength="9" disabled="#{lookupDisabled}"
				minChars="2" focus="#{lookupInputOnFocus}"
				selectReRender="#{lookup_reRender}" />		
		</ui:define>
		
	</ui:decorate>

</ui:composition>
