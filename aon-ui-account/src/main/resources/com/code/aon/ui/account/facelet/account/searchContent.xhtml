<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="Account_code"
		value="#{bundle.aon_id}" />
	<aon:inputText id="Account_code" size="15"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Account_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Account_description" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Account_alias"
		value="#{bundle.aon_alias}" />
	<aon:inputText id="Account_alias" size="30"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Account_costCenter"
		value="#{accountBundle.account_cost_center}" />
	<aon:inputText id="Account_costCenter" size="20"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Account_entryEnabled"
		value="#{bundle.account_entryEnabled}" />
	<aon:selectOneMenu id="Account_entryEnabled"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="#{bundle.aon_common_all}"
			itemValue="#{null}" />
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneMenu>
	
</ui:composition>
