<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

		<aon:div styleClass="aon-bold aon-text-center aon-margin-left aon-margin-right">
			<aon:outputText value="#{employeeBundle.employee_salary_description}" styleClass="aon-underline"/>
		</aon:div>
		
		<aon:panelGrid columns="2"
			columnClasses="aon-panelGrid-even aon-noborder aon-width-400
			              ,aon-panelGrid-even aon-noborder aon-width-400">

			<aon:outputText value="&#160;#{employeeBundle.employee_enterprise}:&#160;" 
				styleClass="aon-italic" style="position: relative; top: 8px; margin-left: 5px; background-color: white; font-size: 0.9em;"/>
			<aon:outputText value="&#160;#{employeeBundle.employee_name}:&#160;" 
				styleClass="aon-italic" style="position: relative; top: 8px; margin-left: 5px; background-color: white;  font-size: 0.9em;"/>

			<aon:div style="background-color: #F6F6F6;" styleClass="aon-border aon-padding">
				<aon:div styleClass="aon-bold">
					<aon:outputText value="#{controller.to.enterpriseName}"/>
				</aon:div>
				<aon:div styleClass="aon-italic">
					<aon:outputText value="#{companyBundle.company_workplace_address}:"/>
				</aon:div>
				<aon:div styleClass="aon-bold">
					<aon:outputText styleClass="aon-margin-left" value="#{controller.to.enterpriseAddress}"/>
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{bundle.aon_company_document}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" 
						value="#{controller.to.enterpriseDocument}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_ccc}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.ccc}" />
				</aon:div>
			</aon:div>

			<aon:div style="background-color: #F6F6F6;" styleClass="aon-border aon-padding">
				<aon:div styleClass="aon-bold">
					<aon:outputText value="#{controller.to.employeeName}"/>
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{bundle.aon_person_document}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.employeeDocument}" />
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{employeeBundle.employee_salary_registration}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.registration}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_ss_number}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.socialSecurityNumber}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_category}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.category}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_group_category}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.quoteGroup}"/>
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{employeeBundle.employee_salary_seniority_date}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.to.seniorityDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:div>
			</aon:div>
	
		</aon:panelGrid>
	
		<aon:div styleClass="aon-margin-top aon-text-right" style="width: 815px;">

			<h:panelGrid columns="3" style="width: 100%;">
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{bundle.aon_type}:&#160;"/>
					<aon:outputText value="#{controller.to.type}" styleClass="aon-bold"/>
				</aon:div>
				
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_issue_date}:&#160;"/>
					<aon:panelGroup styleClass="aon-bold">
						<aon:outputText value="#{controller.to.month}"/>
						<aon:outputText styleClass="aon-italic" value="&#160;/&#160;"/>
						<aon:outputText value="#{controller.to.issueYear}"/>
					</aon:panelGroup>
				</aon:div>

				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_period}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_period_from}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-bold" value="#{controller.to.startDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-italic" value="#{employeeBundle.employee_salary_period_to}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-bold" value="#{controller.to.endDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{employeeBundle.employee_salary_days}:"/>
					<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" value="#{controller.to.timeUnits}"/>
				</aon:div>
				
			</h:panelGrid>
		
		</aon:div>

</ui:composition>
