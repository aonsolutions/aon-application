<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="campaignForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{campaignBundle.aon_process_monitor}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{campaign.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							actionListener="#{campaign.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{campaign.onCancel}" action="campaign_list"
							immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="remove" value="#{bundle.aon_remove}"
							actionListener="#{campaign.onRemoveCampaign}"
							action="campaign_list" rendered="#{!campaign.new}"
							disabled="#{campaign.deleted or campaign.finished}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							actionListener="#{campaign.onReset}" rendered="#{!campaign.new}"
							action="campaign_form" accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							actionListener="#{campaign.onEditSearch}"
							action="campaign_search" accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="startCampaign"
							value="#{campaignBundle.campaign_start}"
							styleClass="aon-finding-toolbar-item aon-icon-process-start"
							actionListener="#{campaign.onStartCampaign}"
							action="campaign_form"
							rendered="#{!campaign.new and campaign.pending}" />
						<aon:commandButton id="finishCampaign"
							value="#{campaignBundle.campaign_finish}"
							onclick="if(confirm('#{campaignBundle.campaign_finish_confirm}')){Richfaces.showModalPanel('waitProccess');}else{ return false; }"
							oncomplete="Richfaces.hideModalPanel('waitProccess')"							
							styleClass="aon-finding-toolbar-item aon-icon-process-stop"
							actionListener="#{campaign.onFinishCampaign}"
							action="campaign_form"
							rendered="#{!campaign.new and campaign.inProgress}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Campaign_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Campaign_description"
						value="#{campaign.to.description}" required="#{true}" size="60"
						disabled="#{!campaign.pending and !campaign.inProgress}" />

					<aon:outputLabel for="Campaign_startDate"
						value="#{campaignBundle.aon_initial_date}" />
					<aon:selectInputDate id="Campaign_startDate"
						value="#{campaign.to.startDate}" required="#{true}"
						disabled="#{!campaign.pending}" renderAsPopup="true"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>


					<aon:outputLabel for="Campaign_endDate"
						value="#{campaignBundle.aon_final_date}" />
					<aon:selectInputDate id="Campaign_endDate"
						value="#{campaign.to.endDate}" required="#{true}"
						disabled="#{!campaign.pending and !campaign.inProgress}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputText value="#{campaignBundle.process_process}" />
					<aon:selectOneMenu value="#{campaign.to.process}"
						rendered="#{campaign.pending}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{campaignCollections.processes}" />
					</aon:selectOneMenu>
					<aon:inputText size="50" disabled="true"
						rendered="#{!campaign.pending}"
						value="#{campaign.to.process.description}" />

					<aon:outputText value="#{projectBundle.activity_activity_type}" />
					<aon:selectOneMenu value="#{campaign.to.activityType}"
						rendered="#{campaign.pending}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{projectCollections.activityTypes}" />
					</aon:selectOneMenu>
					<aon:inputText size="40" disabled="true"
						rendered="#{!campaign.pending}"
						value="#{campaign.to.activityType.description}" />

					<aon:outputLabel for="Campaign_workGroup"
						value="#{campaignBundle.campaign_supervisor}" />
					<aon:selectOneMenu id="Campaign_workGroup"
						value="#{campaign.to.workGroup}"
						disabled="#{!campaign.pending and !campaign.inProgress}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.workgroups}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{bundle.aon_type}" />
					<aon:selectOneMenu value="#{campaign.to.type}"
						rendered="#{campaign.pending}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{campaignCollections.campaignTypes}" />
					</aon:selectOneMenu>
					<aon:inputText size="20" disabled="true"
						rendered="#{!campaign.pending}" value="#{campaign.to.type}" />

					<aon:outputText value="#{bundle.aon_status}" rendered="#{!campaign.pending}" />
					<aon:inputText size="20" disabled="true"
						rendered="#{!campaign.pending}" value="#{campaign.to.status}" />

				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{!campaign.pending}">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputLabel for="CampaignDossierDataList"
							rendered="#{!campaign.pending}"
							value="#{campaignBundle.campaign_dossiers}" />
					</aon:div>
					<aon:div styleClass="aon-form-group-body">
						<aon:dataTable id="CampaignDossierDataList" var="to"
							value="#{campaignDossier.model}" rendered="#{!campaign.pending}">

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<!-- 
								<aon:selectBooleanCheckbox id="Row_checked"
									value="#{campaignDossier.rowChecked}"
									valueChangeListener="#{campaignDossier.rowSelected}"
									onmouseover="enableRowSubmit(false)"
									onmouseout="enableRowSubmit(true)"
									styleClass="aon-form-selectBooleanCheckbox-field"
									rendered="#{campaignDossier.processDetail != null}" />
								<aon:div style="width:14px; heighaon:20px;"
									rendered="#{campaignDossier.processDetail == null}">
									<h:graphicImage url="/css/images/icons/aon-lock.gif"
										alt="#{campaignBundle.campaign_process_finished}" />
								</aon:div>
 -->
								<aon:commandButton immediate="true"
									styleClass="aon-icon-commandButton aon-icon-rowSelector"
									action="campaign_view_task"
									actionListener="#{activityProcess.onSearchTasks}" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:commandLink actionListener="#{campaignDossier.sort}">
										<aon:outputText
											value="#{projectBundle.aon_daily_tracking_dossier}" />
										<f:setPropertyActionListener
											value="CampaignDossier_dossier_number"
											target="#{campaignDossier.sortColumn}" />
									</aon:commandLink>
								</f:facet>
								<aon:outputText value="#{to.dossier.number}" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:commandLink actionListener="#{campaignDossier.sort}">
										<aon:outputText value="#{customerBundle.customer_customer}" />
										<f:setPropertyActionListener
											value="CampaignDossier_customer_name"
											target="#{campaignDossier.sortColumn}" />
									</aon:commandLink>
								</f:facet>
								<aon:outputText value="#{to.dossier.customer.registry.fullName}" />
							</aon:column>
							<!-- 
							<aon:column>
								<f:facet name="header">
									<aon:commandLink actionListener="#{campaignDossier.sort}">
										<aon:outputText value="#{customerBundle.customer_surname}" />
										<f:setPropertyActionListener
											value="CampaignDossier_customer_surname"
											target="#{campaignDossier.sortColumn}" />
									</aon:commandLink>
								</f:facet>
								<aon:outputText value="#{to.dossier.customer.registry.surname}" />
							</aon:column>
							<aon:column>
								<f:facet name="header">
									<aon:commandLink actionListener="#{campaignDossier.sort}">
										<aon:outputText value="#{customerBundle.customer_document}" />
										<f:setPropertyActionListener
											value="CampaignDossier_customer_document"
											target="#{campaignDossier.sortColumn}" />
									</aon:commandLink>
								</f:facet>
								<aon:outputText value="#{to.dossier.customer.registry.document}" />
							</aon:column>
-->
							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{campaignBundle.campaign_current_action}" />
								</f:facet>

								<aon:outputText value="#{campaignDossier.processDetail}" />
								<!-- 
								<aon:outputText value="#{campaignDossier.processDetail}"
									rendered="#{campaignDossier.processDetail != null}" />
								<aon:outputText
									value="#{campaignBundle.campaign_process_finished}"
									rendered="#{campaignDossier.processDetail == null}" />
 -->
							</aon:column>
						</aon:dataTable>
						<!-- 
						<aon:div rendered="#{campaign.inProgress}">
							<aon:commandButton title="#{campaignBundle.campaign_add_dossier}"
								styleClass="aon-form-button-plus"
								value="#{campaignBundle.campaign_add_dossier}"
								actionListener="#{addCampaignDossier.onSearchDossiers}"
								action="campaign_add_dossier" onclick="viewDialog.show();" />
							<aon:commandButton
								title="#{campaignBundle.campaign_exclude_dossier}"
								styleClass="aon-form-button-minus"
								value="#{campaignBundle.campaign_exclude_dossier}"
								actionListener="#{campaignDossier.onRemoveCampaignDossier}"
								onclick="viewDialog.show();" />
						</aon:div>
 -->
						<aon:dataScroller2 for="CampaignDossierDataList" showNote="false" />
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" /> 
	</ui:define>
</ui:composition>
