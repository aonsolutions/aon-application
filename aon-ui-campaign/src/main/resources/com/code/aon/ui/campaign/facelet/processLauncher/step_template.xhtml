<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_process_launcher}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<ui:insert name="step_name" />
					</aon:div>

					<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="prev" immediate="true"
							value="#{campaignBundle.process_wizard_previous}"
							action="#{processWizard.previous}"
							styleClass="aon-finding-toolbar-item aon-icon-launch-process-previous"
							rendered="#{processWizard.previousAvailable}" />
						<aon:commandButton id="next"
							value="#{campaignBundle.process_wizard_next}"
							action="#{processWizard.next}"
							rendered="#{processWizard.nextAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-launch-process-next" />
						<aon:commandButton id="end"
							value="#{campaignBundle.process_wizard_finalice}"
							action="#{processWizard.finalice}"
							disabled="#{processWizard.dossiersModel.rowCount == 0}"
							rendered="#{processWizard.finaliceAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-accept" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">
				<ui:insert name="step_content" />
			</aon:div>
		</aon:form>
		<ui:insert name="after_form" />
	</ui:define>
</ui:composition>
