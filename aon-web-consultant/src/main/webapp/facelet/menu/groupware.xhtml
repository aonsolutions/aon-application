<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

<ui:define name="content">
	<aon:form id="groupwareMenu">

		<aon:div styleClass="aon-scroll-area">

			<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
				columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

				<aon:panelGroup>
				
					<aon:panelGrid id="group_general_task"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-task">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.groupware_task_management}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_taskInbox"
									action="task_list"
									actionListener="#{task.onLaunch}"
									value="#{groupwareBundle.groupware_task_inbox}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_gantt"
									action="gantt_form"
									actionListener="#{gantt.onLaunch}"
									value="#{groupwareBundle.groupware_gantt_diagram}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
				
					<aon:panelGrid id="group_general_dailyTracking"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-version">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.aon_daily_tracking_module}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_dailyTracking"
									action="dailyTracking_form"
									actionListener="#{dailyTracking.onReset}"
									value="#{groupwareBundle.aon_daily_tracking_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_dailyTracking_reports"
									actionListener="#{dailyTrackingReport.onResetReportSearch}"
									action="daily_tracking_report"
									value="#{bundle.aon_reports}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_job_type"
									action="job_type"
									value="#{groupwareBundle.aon_job_type_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
					
					<aon:panelGrid id="group_general_processes"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-tree-root">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.groupware_process_management}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_process"
									action="process_list"
									actionListener="#{process.onSearch}"
									value="#{groupwareBundle.groupware_process_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_processTransitionType"
									action="process_transition_type"
									actionListener="#{processTransitionType.onSearch}"
									value="#{groupwareBundle.groupware_process_transition_types}" />
							</aon:div>
							<c:if test="#{aonRole.taskMonitor}">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="groupware_process_launcher"
										action="#{processWizard.start}"
										value="#{groupwareBundle.groupware_process_launcher}" />
								</aon:div>
							</c:if>
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_general_campaigns"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-campaign">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.groupware_campaigns}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<c:if test="#{aonRole.taskMonitor}">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="groupware_campaigns"
										action="campaign_search"
										actionListener="#{campaign.onEditSearch}"
										value="#{groupwareBundle.groupware_campaign_monitor}" />
								</aon:div>
							</c:if>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_campaignTypes"
									action="campaign_type"
									actionListener="#{campaignType.onSearch}"
									value="#{groupwareBundle.groupware_campaign_types}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
				</aon:panelGroup>

				<aon:panelGroup>
				
					<aon:panelGrid id="group_general_notices"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-call">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.aon_notice}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_notice"
									action="notice_list"
									actionListener="#{notice.onEditSearch}"
									value="#{groupwareBundle.aon_notice}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_general_notes"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-notes">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.aon_notes}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_note"
									action="note_search"
									actionListener="#{note.onEditSearch}"
									value="#{groupwareBundle.aon_notes}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_general_favorites"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-favorite">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.aon_favorites}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_favorite"
									action="favorite_search"
									actionListener="#{favorite.onSearch}"
									value="#{groupwareBundle.aon_favorites}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="groupware_favorite_category"
									action="favorite_category"
									actionListener="#{favoriteCategory.onSearch}"
									value="#{groupwareBundle.aon_favorite_category}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_general_taskHolders"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-contactGroup">
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.groupware_user_management}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="taskHolder-management"
									action="taskHolder_search"
									actionListener="#{taskHolder.onEditSearch}"
									value="#{groupwareBundle.groupware_taskHolders}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="workgroup-management"
									action="workgroup_list"
									actionListener="#{workGroup.onEditSearch}"
									value="#{configBundle.config_workgroup_module}" />
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="costProfile-management"
									action="costProfile_list"
									actionListener="#{costProfile.onSearch}"
									value="#{groupwareBundle.groupware_cost_profiles}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
				
					<aon:panelGrid id="group_project_management"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-statistics">
						<f:facet name="header">
							<aon:outputText value="#{projectBundle.project_projects}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="project_type"
									action="projectType_list"
									actionListener="#{projectType.onSearch}"
									value="#{projectBundle.project_project_type}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="activity_type"
									action="activityTypeStandalone_grid"
									actionListener="#{activityTypeStandalone.onSearch}"
									value="#{projectBundle.project_activity_type}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
					
				</aon:panelGroup>

			</h:panelGrid>
		</aon:div>
	</aon:form>
</ui:define>
	
</ui:composition>
