<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="treasuryMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_task_management"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-task aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.groupware_task_management}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="task"
										value="#{groupwareBundle.groupware_task_inbox}" action="task_list" />
								</aon:div>
								<c:if test="#{aonRole.taskMonitor}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="process_wizard_step0"
											value="#{groupwareBundle.groupware_process_launcher}"
											action="#{processWizard.start}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="process_monitor" 
											value="#{groupwareBundle.groupware_campaign_monitor}"
											actionListener="#{campaign.onEditSearch}"
											action="campaign_search" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_task_time_management"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-time aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.aon_daily_tracking_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="daily_tracking"
										value="#{groupwareBundle.aon_daily_tracking_module}"
										action="dailyTracking_form"
										actionListener="#{dailyTracking.onReset}" />
								</aon:div>
								<c:if test="#{aonRole.taskMonitor}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="daily_tracking_report"
											value="#{bundle.aon_reports}"
											actionListener="#{dailyTrackingReport.onResetReportSearch}"
											action="daily_tracking_report" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<aon:panelGroup>
						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_task_configuration"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-config aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_configuration}"/>
								</f:facet>					
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="project_type"
											value="#{projectBundle.project_project_type}"
											action="projectType_list" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="activity_type"
											value="#{projectBundle.project_activity_type}"
											action="activityType_standalone" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="job_type"
											value="#{groupwareBundle.groupware_job_type}" action="job_type" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="process_module" 
											value="#{groupwareBundle.groupware_process_module}"
											action="process_list" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="process_transition_type" 
											value="#{groupwareBundle.groupware_process_transition_types}"
											action="process_transition_type" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="groupware_campaignTypes"
											action="campaign_type"
											actionListener="#{campaignType.onSearch}"
											value="#{groupwareBundle.groupware_campaign_types}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
