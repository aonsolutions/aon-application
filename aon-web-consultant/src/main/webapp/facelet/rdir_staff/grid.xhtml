<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="rdirStaffForm">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{customer.to.registry.name} #{customer.to.registry.surname}, #{customerBundle.customer_document}: #{customer.to.registry.document}" />
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal" style="padding-top:0">

					<t:div styleClass="aon-content-menu" rendered="#{!customer.new}"
						id="aon-content-menu" forceId="#{true}">
						<t:panelGrid columns="7" cellpadding="0" cellspacing="0"
							border="0">
							<t:panelGroup>
								<t:commandLink id="customer_data" forceId="#{true}"
									value="#{appBundle.aon_personal_data}" action="customer_form"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="economic_data" forceId="#{true}"
									visibleOnUserRole="DatosEconomicos"
									value="#{appBundle.aon_economic_data}"
									actionListener="#{customerFee.onCustomerFee}"
									action="economic_data" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_dossier" forceId="#{true}"
									value="#{projectBundle.dossier_dossiers}"
									actionListener="#{dossier.onDossier}" action="dossier_list"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_business_data"
									value="#{appBundle.aon_business_data}" forceId="#{true}"
									styleClass="aon-content-menu-item-active" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_rnote" forceId="#{true}"
									value="#{appBundle.aon_monitoring}"
									actionListener="#{rnote.onSearch}" action="rnote"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_relationship" forceId="#{true}"
									value="#{appBundle.aon_rRelationship}"
									actionListener="#{rRelationship.onSearch}"
									action="rrelationship" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="record_data" forceId="#{true}"
									value="#{appBundle.aon_record_data}"
									actionListener="#{recordData.onRecordData}"
									action="record_data_list" styleClass="aon-content-menu-item" />
							</t:panelGroup>
						</t:panelGrid>
					</t:div>

					<t:div styleClass="aon-content-toolbar" forceId="#{true}"
						id="aon-content-toolbar">
						<t:div styleClass="aon-content-toolbar-internal">
							<t:div styleClass="aon-content-toolbar-item-group">
								<h:commandButton id="save" value="#{bundle.aon_save}"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
									actionListener="#{rdirStaff.onAccept}"
									rendered="#{rdirStaff.to!=null}"
									onclick="return (confirm('#{bundle.aon_save_confirm}'));"
									accesskey="#{bundle.aon_key_save}" />
								<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
									immediate="#{true}"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
									actionListener="#{rdirStaff.onCancel}"
									rendered="#{rdirStaff.to!=null}"
									onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
									accesskey="#{bundle.aon_key_cancel}" />
								<h:commandButton id="remove" value="#{bundle.aon_remove}"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
									actionListener="#{rdirStaff.onRemove}"
									rendered="#{rdirStaff.to!=null and !rdirStaff.new}"
									onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
									accesskey="#{bundle.aon_key_remove}" />
								<h:commandButton id="reset" value="#{bundle.aon_reset}"
									styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
									onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
									onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
									actionListener="#{rdirStaff.onReset}"
									rendered="#{!rdirStaff.new}" accesskey="#{bundle.aon_key_new}" />
							</t:div>
						</t:div>
					</t:div>

					<t:div styleClass="aon-table-hack">
						<t:dataTable id="rdirStaffDataList" value="#{rdirStaff.model}"
							rows="20" var="to" rowIndexVar="rowIndex"
							rendered="#{rdirStaff.model.rowCount > 0 or rdirStaff.new}"
							rowOnMouseOver="selectRow( this )"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
							styleClass="aon-edit-table" headerClass="aon-edit-table-header"
							footerClass="aon-edit-table-footer"
							rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
							columnClasses="aon-edit-table-body aon-edit-table-body-icon, 
								aon-edit-table-body aon-edit-table-body-string,
								aon-edit-table-body aon-edit-table-body-string,
								aon-edit-table-body aon-edit-table-body-icon,
								aon-edit-table-body aon-edit-table-body-icon,
								aon-edit-table-body aon-edit-table-body-icon,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-string,								
								aon-edit-table-body aon-edit-table-body-buttons">

							<t:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:commandLink immediate="#{true}"
									styleClass="aon-table-row-selected"
									rendered="#{to.id!=rdirStaff.to.id}"
									actionListener="#{rdirStaff.onSelect}" />
								<f:verbatim>&#160;</f:verbatim>
								<f:facet name="footer">
									<t:div>
										<t:commandButton id="reset" alt="[#{bundle.aon_reset}]"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
											actionListener="#{rdirStaff.onReset}"
											rendered="#{!rdirStaff.new}" value=""
											accesskey="#{bundle.aon_key_new_line}">
										</t:commandButton>
									</t:div>
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<t:outputText value="#{appBundle.aon_cif_nif}" />
								</f:facet>
								<t:outputText value="#{to.document}"
									rendered="#{to!=rdirStaff.to}" />
								<t:div rendered="#{to==rdirStaff.to}">
									<t:inputText id="Registry_Lookup_document-Edit" size="16"
										forceId="#{true}" styleClass="aon-form-input-text"
										onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','registryLookup','Registry_Lookup_document-Edit[#{rowIndex}]','Registry_document|Registry_Lookup_document-Edit[#{rowIndex}],Registry_full_name|Registry_full_name-Edit[#{rowIndex}]');"
										onblur="disableInputs( #{rowIndex} );"
										value="#{rdirStaff.to.document}" />
								</t:div>
								<f:facet name="footer">
									<t:div rendered="#{rdirStaff.new}">
										<t:inputText id="Registry_Lookup_document-New" size="16"
											forceId="#{true}" styleClass="aon-form-input-text"
											onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','registryLookup','Registry_Lookup_document-New','Registry_document|Registry_Lookup_document-New,Registry_full_name|Registry_full_name-New');"
											onblur="disableInputs( -1 );" required="true"
											value="#{rdirStaff.to.document}" />
									</t:div>
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.aon_name}" />
								</f:facet>
								<h:outputText value="#{to.name}"
									rendered="#{to.id!=rdirStaff.to.id}" />
								<t:inputText id="Registry_full_name-Edit" forceId="#{true}"
									rendered="#{to.id==rdirStaff.to.id}"
									styleClass="aon-form-input-text" size="40"
									value="#{rdirStaff.to.name}" />
								<f:verbatim>&#160;</f:verbatim>
								<f:facet name="footer">
									<t:inputText id="Registry_full_name-New" forceId="#{true}"
										rendered="#{rdirStaff.new}" styleClass="aon-form-input-text"
										size="40" value="#{rdirStaff.to.name}" />
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_is_shareholder}" />
								</f:facet>
								<t:div rendered="#{to.id!=rdirStaff.to.id}"
									styleClass="#{to.shareHolder?'aon-table-boolean-check-on':'aon-table-boolean-check-off'}">
									<f:verbatim>&#160;</f:verbatim>
								</t:div>
								<t:selectBooleanCheckbox id="RegistryDirStaff_shareHolder-Edit"
									forceId="#{true}" rendered="#{to.id==rdirStaff.to.id}"
									onclick="shareholderClicked( #{rowIndex} )"
									value="#{rdirStaff.to.shareHolder}"
									styleClass="aon-form-selectBooleanCheckbox-field" />
								<f:facet name="footer">
									<t:selectBooleanCheckbox id="RegistryDirStaff_shareHolder-New"
										forceId="#{true}" rendered="#{rdirStaff.new}"
										onclick="shareholderClicked( -1 )"
										value="#{rdirStaff.to.shareHolder}"
										styleClass="aon-form-selectBooleanCheckbox-field" />
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_is_representative}" />
								</f:facet>
								<t:div rendered="#{to.id!=rdirStaff.to.id}"
									styleClass="#{to.representative?'aon-table-boolean-check-on':'aon-table-boolean-check-off'}">
									<f:verbatim>&#160;</f:verbatim>
								</t:div>
								<t:selectBooleanCheckbox
									id="RegistryDirStaff_representative-Edit"
									rendered="#{to.id==rdirStaff.to.id}" forceId="#{true}"
									value="#{rdirStaff.to.representative}"
									onclick="reprOrDirClicked( #{rowIndex} )"
									styleClass="aon-form-selectBooleanCheckbox-field" />
								<f:facet name="footer">
									<t:selectBooleanCheckbox
										id="RegistryDirStaff_representative-New"
										rendered="#{rdirStaff.new}" forceId="#{true}"
										value="#{rdirStaff.to.representative}"
										onclick="reprOrDirClicked( -1 )"
										styleClass="aon-form-selectBooleanCheckbox-field" />
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_is_director}" />
								</f:facet>
								<t:div rendered="#{to.id!=rdirStaff.to.id}"
									styleClass="#{to.director?'aon-table-boolean-check-on':'aon-table-boolean-check-off'}">
									<f:verbatim>&#160;</f:verbatim>
								</t:div>
								<t:selectBooleanCheckbox id="RegistryDirStaff_director-Edit"
									rendered="#{to.id==rdirStaff.to.id}" forceId="#{true}"
									value="#{rdirStaff.to.director}"
									onclick="reprOrDirClicked( #{rowIndex} )"
									styleClass="aon-form-selectBooleanCheckbox-field" />
								<f:facet name="footer">
									<t:selectBooleanCheckbox id="RegistryDirStaff_director-New"
										rendered="#{rdirStaff.new}" forceId="#{true}"
										value="#{rdirStaff.to.director}"
										onclick="reprOrDirClicked( -1 )"
										styleClass="aon-form-selectBooleanCheckbox-field" />
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_percent_shares}" />
								</f:facet>
								<h:outputText value="#{to.percentShare}"
									rendered="#{to.id!=rdirStaff.to.id}">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
								<t:inputText id="RegistryDirStaff_percentShare-Edit"
									rendered="#{to.id==rdirStaff.to.id}" forceId="#{true}"
									styleClass="aon-form-input-text" size="5"
									value="#{rdirStaff.to.percentShare}" />
								<f:verbatim>&#160;</f:verbatim>
								<f:facet name="footer">
									<t:div>
										<t:div rendered="#{!rdirStaff.new}" 
											style="text-align:right; font-weight:normal; padding-right:2px;">
											<t:outputText value="#{rdirStaff.totalPercentShare}">
												<f:convertNumber pattern="#,##0.00" />
											</t:outputText>
										</t:div>
										<t:inputText id="RegistryDirStaff_percentShare-New"
											rendered="#{rdirStaff.new}" forceId="#{true}"
											styleClass="aon-form-input-text" size="5"
											value="#{rdirStaff.to.percentShare}" />
									</t:div>	
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_share_number}" />
								</f:facet>
								<h:outputText value="#{to.shareNumber}"
									rendered="#{to.id!=rdirStaff.to.id}" />
								<t:inputText id="RegistryDirStaff_shareNumber-Edit"
									rendered="#{to.id==rdirStaff.to.id}" forceId="#{true}"
									styleClass="aon-form-input-text" size="5"
									value="#{rdirStaff.to.shareNumber}" />
								<f:verbatim>&#160;</f:verbatim>
								<f:facet name="footer">
									<t:div>
										<t:div rendered="#{!rdirStaff.new}" 
											style="text-align:right; font-weight:normal; padding-right:2px;">
											<t:outputText value="#{rdirStaff.totalShareNumber}"/>
										</t:div>
										<t:inputText id="RegistryDirStaff_shareNumber-New"
											rendered="#{rdirStaff.new}" forceId="#{true}"
											styleClass="aon-form-input-text" size="5"
											value="#{rdirStaff.to.shareNumber}" />
									</t:div>	
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_nominal_value}" />
								</f:facet>
								<h:outputText value="#{to.nominalValue}"
									rendered="#{to.id!=rdirStaff.to.id}">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
								<t:inputText id="RegistryDirStaff_nominalValue-Edit"
									rendered="#{to.id==rdirStaff.to.id}" forceId="#{true}"
									styleClass="aon-form-input-text" size="5"
									value="#{rdirStaff.to.nominalValue}" />
								<f:verbatim>&#160;</f:verbatim>
								<f:facet name="footer">
									<t:div>
										<t:div rendered="#{!rdirStaff.new}" 
											style="text-align:right; font-weight:normal; padding-right:2px;">
											<t:outputText value="#{rdirStaff.totalNominalValue}">
												<f:convertNumber pattern="#,##0.00" />
											</t:outputText>
										</t:div>
										<t:inputText id="RegistryDirStaff_nominalValue-New"
										rendered="#{rdirStaff.new}" forceId="#{true}"
										styleClass="aon-form-input-text" size="5"
										value="#{rdirStaff.to.nominalValue}" />
									</t:div>	
								</f:facet>
							</t:column>

							<t:column width="85">
								<f:facet name="header">
									<h:outputText value="#{appBundle.rdir_staff_date}" />
								</f:facet>
								<t:outputText value="#{to.dueDate}"
									rendered="#{to.id!=rdirStaff.to.id}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</t:outputText>
								<t:div id="RegistryDirStaff_dueDate_Div-Edit" forceId="#{true}">
									<t:inputCalendar size="8" required="true"
										id="RegistryDirStaff_dueDate-Edit"
										rendered="#{to.id==rdirStaff.to.id}"
										value="#{rdirStaff.to.dueDate}" forceId="#{true}"
										monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
										currentDayCellClass="currentDayCell" renderAsPopup="true"
										styleClass="aon-form-input-text"
										popupButtonStyleClass="aon-form-calendar-button"
										popupTodayString="#{bundle.aon_popup_today}"
										popupWeekString="#{bundle.aon_popup_week}" />
								</t:div>
								<f:facet name="footer">
									<t:div id="RegistryDirStaff_dueDate_Div-New" forceId="#{true}">
										<t:inputCalendar size="8" id="RegistryDirStaff_dueDate-New"
											rendered="#{rdirStaff.new}" value="#{rdirStaff.to.dueDate}"
											monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
											forceId="#{true}"
											popupButtonStyleClass="aon-form-calendar-button"
											currentDayCellClass="currentDayCell" required="true"
											renderAsPopup="true" styleClass="aon-form-input-text"
											popupTodayString="#{bundle.aon_popup_today}"
											popupWeekString="#{bundle.aon_popup_week}" />
									</t:div>
								</f:facet>
							</t:column>

							<t:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:commandButton title="#{bundle.aon_accept}"
									actionListener="#{rdirStaff.onAccept}"
									onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
									value="" rendered="#{to.id==rdirStaff.to.id}"
									accesskey="#{bundle.aon_key_save_line}" />
								<t:commandButton title="#{bundle.aon_cancel}"
									actionListener="#{rdirStaff.onCancel}" immediate="#{true}"
									onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
									value="" accesskey="#{bundle.aon_key_cancel_line}"
									rendered="#{to.id==rdirStaff.to.id}" />
								<t:commandButton title="#{bundle.aon_remove}"
									actionListener="#{rdirStaff.onRemove}"
									onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
									value="" accesskey="#{bundle.aon_key_remove_line}"
									rendered="#{to.id==rdirStaff.to.id}" />
								<f:verbatim rendered="#{to.id!=rdirStaff.to.id}">&#160;</f:verbatim>
								<f:facet name="footer">
									<t:div>
										<f:verbatim rendered="#{!rdirStaff.new}">&#160;</f:verbatim>
										<t:commandButton title="#{bundle.aon_accept}"
											actionListener="#{rdirStaff.onAccept}"
											onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
											value="" accesskey="#{bundle.aon_key_save_line}"
											rendered="#{rdirStaff.new}" />
										<t:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{rdirStaff.onCancel}" immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
											value="" accesskey="#{bundle.aon_key_cancel_line}"
											rendered="#{rdirStaff.new}" />
									</t:div>
								</f:facet>
							</t:column>

						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="rdirStaffDataList" />
						<ui:param name="model" value="#{rdirStaff.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<script>
			function shareholderClicked( index ){
				shareHolderName = "RegistryDirStaff_shareHolder";
				percentShareName = "RegistryDirStaff_percentShare";
				shareNumberName = "RegistryDirStaff_shareNumber";
				nominalValueName = "RegistryDirStaff_nominalValue";
				if(index != -1){
					shareHolderName = shareHolderName + "-Edit[" + index + "]";
					percentShareName = percentShareName + "-Edit[" + index + "]";
					shareNumberName = shareNumberName + "-Edit[" + index + "]";
					nominalValueName = nominalValueName + "-Edit[" + index + "]";
				}else{
					shareHolderName = shareHolderName + "-New";
					percentShareName = percentShareName + "-New";
					shareNumberName = shareNumberName + "-New";
					nominalValueName = nominalValueName + "-New";
				}
				shareHolder = document.getElementById(shareHolderName);
				document.getElementById( percentShareName ).value = "0.0";
				document.getElementById( shareNumberName ).value = "0";				
				document.getElementById( nominalValueName ).value = "0.0";
				document.getElementById( percentShareName ).disabled = !shareHolder.checked;
				document.getElementById( shareNumberName ).disabled = !shareHolder.checked;
				document.getElementById( nominalValueName ).disabled = !shareHolder.checked;
			}
			function reprOrDirClicked( index ){
				directorName = "RegistryDirStaff_director";
				dateNameDiv = "RegistryDirStaff_dueDate_Div";
				dateName = "RegistryDirStaff_dueDate";
				if(index != -1){
					directorName = directorName + "-Edit[" + index + "]";
