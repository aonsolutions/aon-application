<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<!-- start toolbar navigation -->
	<aon:div>
		<aon:div styleClass="aon-toolbar" rendered="#{lookup.showSearchButtons}">
			<aon:commandButton value="#{bundle.aon_search}"
				actionListener="#{lookup.onListCancel}" reRender="#{lookupId}LookupContent"
				oncomplete="#{focusFirstInput}"
				styleClass="aon-finding-toolbar-item aon-icon-accept"
				accesskey="#{bundle.aon_key_search}" />
			<aon:commandButton value="#{bundle.aon_back}"
				actionListener="#{lookup.onCloseWindow}" immediate="true"
				reRender="#{lookupId}ReRender"
				styleClass="aon-finding-toolbar-item aon-icon-cancel"
				accesskey="#{bundle.aon_key_cancel}">
				<rich:componentControl for="#{lookupId}" event="onclick"
					disableDefault="true" operation="hide" />
			</aon:commandButton>
		</aon:div>
		<!-- end toolbar navigation -->
		<aon:div style="width:98%;">
			<aon:dataTable id="#{lookup.beanName}Data" var="to"
				value="#{lookup.model}" rows="15" rowKeyVar="rowKey" stateVar="state">
				<aon:rowSelector actionListener="#{lookup.onListSelect}"
					reRender="#{lookup.component.selectReRender}"
					oncomplete="Richfaces.hideModalPanel('#{lookupId}')" />
					
				<aon:column styleClass="aon-editDataTable-iconColumn">
					<aon:commandButton id="selectButton"
						styleClass="aon-editDataTable-button aon-icon-rowSelector"
						immediate="true" ajaxSingle="true" requestDelay="100"
						actionListener="#{lookup.onListSelect}"
						reRender="#{lookup.component.selectReRender}"
						title="Soy #{rowKey-state.range.firstRow}" alt="Soy #{rowKey-state.range.firstRow}"
						onkeyup="aonTableKeyUp(event.keyCode,#{rowKey-state.range.firstRow})"
						onfocus="aonChangeRowSelection(#{rowKey-state.range.firstRow})"
						oncomplete="Richfaces.hideModalPanel('#{lookupId}')" >
					</aon:commandButton>
				</aon:column>
					
				<ui:include src="#{lookup.listPagePath}" />
			</aon:dataTable>

			<aon:dataScroller2 for="#{lookup.beanName}Data" showNote="true"
				oncomplete="#{selectFirstRow}" />

		</aon:div>
		
	</aon:div>
</ui:composition>

</body>
</html>
