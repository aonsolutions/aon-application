<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div styleClass="aon-finding-title-toolbar">
		<aon:panelGrid columns="2" dir="true" 
				columnClasses="aon-finding-title,aon-finding-toolbar">					
	
			<aon:div styleClass="aon-finding-title-internal">
				<aon:outputText
					value="#{lookup.new?(bundle.aon_reset):(bundle.aon_editing)}" />
			</aon:div>
	

			<aon:div styleClass="aon-finding-toolbar-item-group">
				<aon:commandButton id="saveLookup" value="#{bundle.aon_save}"
					actionListener="#{lookup.accept}"
					styleClass="aon-finding-toolbar-item aon-content-toolbar-item-save"
					accesskey="#{bundle.aon_key_save}" />
				<aon:commandButton id="cancelLookup" value="#{bundle.aon_cancel}"
					actionListener="#{lookup.onCloseWindow}" rendered="#{lookup.new}" partialSubmit="true"
					styleClass="aon-finding-toolbar-item aon-content-toolbar-item-cancel"
					accesskey="#{bundle.aon_key_cancel}" />
				<aon:commandButton id="closeLookup" value="#{bundle.aon_close}"
					rendered="#{!lookup.new}" partialSubmit="true"
					actionListener="#{lookup.onFormSelect}"
					styleClass="aon-finding-toolbar-item aon-content-toolbar-item-close"
					accesskey="#{bundle.aon_key_close}"/>					
			</aon:div>
	  </aon:panelGrid>
	</aon:div>	

	<ui:include src="#{lookup.newPagePath}" />			
	
</ui:composition>

</body>
</html>
