<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div styleClass="aon-toolbar">
		<aon:commandButton id="saveLookup" value="#{bundle.aon_save}"
			actionListener="#{lookup.accept}" reRender="#{lookupId}LookupContent"
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			accesskey="#{bundle.aon_key_save}" />
		<aon:commandButton id="cancelLookup" value="#{bundle.aon_cancel}" immediate="true"
			actionListener="#{lookup.onCloseWindow}" rendered="#{lookup.new}"
			styleClass="aon-finding-toolbar-item aon-icon-cancel"
			accesskey="#{bundle.aon_key_cancel}" >
			<rich:componentControl for="#{lookupId}" event="onclick"
				disableDefault="true" operation="hide" />					
		</aon:commandButton>
		<aon:commandButton id="closeLookup" value="#{bundle.aon_close}"
			rendered="#{!lookup.new}" immediate="true" 
			actionListener="#{lookup.onFormSelect}"
			styleClass="aon-finding-toolbar-item aon-icon-cancel"
			accesskey="#{bundle.aon_key_close}"
			reRender="#{lookup.component.selectReRender}">
			<rich:componentControl for="#{lookupId}" event="onclick"
				disableDefault="true" operation="hide" />					
		</aon:commandButton>					
	</aon:div>

	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid columns="2" dir="true">

			<ui:include src="#{lookup.newPagePath}" />
			
		</aon:panelGrid>
	</aon:div>			
	
</ui:composition>

</body>
</html>
