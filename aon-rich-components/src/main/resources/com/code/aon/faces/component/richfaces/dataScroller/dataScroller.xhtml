<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div styleClass="aon-note" rendered="#{rowCount == 0 and showNote}">
		<aon:div styleClass="aon-note-internal">
			<aon:panelGroup>
				<aon:outputText value="#{bundle.aon_search_no_results}" />
			</aon:panelGroup>
		</aon:div>
	</aon:div>

	<aon:div styleClass="aon-dataScroller" rendered="#{rowCount>0}">					
	    <aon:panelGrid id="#{dataTable}MessageDataScroller" 
	    	columns="3" columnClasses="aon-dataScroller2-text aon-nowrap,aon-width-all,aon-dataScroller2-text aon-nowrap aon-float-right">
			<aon:panelGroup>
				<aon:outputFormat rendered="#{(rowCount &lt;= pageSize) or (pageSize &lt; 1)}"
					value="#{bundle.aon_scroll}">
					<f:param value="#{1}" />
					<f:param value="#{rowCount}" />
					<f:param value="#{rowCount}" />
				</aon:outputFormat>		    	
				<aon:dataPaginator
					for="#{dataTable}" id="#{dataTable}PaginatorInfo" page="#{page}"
					rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex" lastRowIndexVar="lastRowIndex"
					styleClass="aon-dataScroller-text">
					<f:facet name="pages">
						<h:outputFormat value="#{bundle.aon_scroll}">
							<f:param value="#{firstRowIndex}" />
							<f:param value="#{lastRowIndex}" />
							<f:param value="#{rowsCount}" />
						</h:outputFormat>
					</f:facet>
				</aon:dataPaginator>
			</aon:panelGroup>
	    	<aon:panelGroup>
				<aon:dataPaginator for="#{dataTable}"  
					fastStep="5" paginator="true"
					paginatorMaxPages="7" 
					rendered="#{(pageSize > 0) and (rowCount > pageSize)}"
					ajaxSingle="true" 
					oncomplete="#{oncomplete}" 
					page="#{page}"
					fastControls="#{'hide'}"
					styleClass="aon-dataScroller-buttons" 
					reRender="#{dataTable}PaginatorInfo"/>
			</aon:panelGroup>			    	
			<aon:panelGroup rendered="#{!hidePageSizeSelector}" styleClass="text-right">
				<aon:outputText styleClass="aon-margin-right"
					value="#{bundle.aon_row_number}"/>
				<aon:selectOneMenu value="#{pageSize}" >
					<f:selectItems value="#{commonCollections.pageLimits}" />
					<a4j:support event="onchange" ajaxSingle="true" 
						reRender="#{dataTable},#{dataTable}MessageDataScroller">
						<f:setPropertyActionListener target="#{page}" value="#{1}" />
					</a4j:support>				
				</aon:selectOneMenu>
			</aon:panelGroup>		    	
		</aon:panelGrid>	
	</aon:div>

</ui:composition>
