<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

	<aon:form id="uploadFileForm">

		<rich:modalPanel id="uploadFileModalPanel" height="120" width="400">
			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{richBundle.aon_file_upload}" />
				</aon:div>
			</f:facet>
			<f:facet name="controls">
				<aon:commandButton type="button" styleClass="aon-popupWindow-close"
					immediate="true" reRender="aonStatus">
					<rich:componentControl for="uploadFileModalPanel" operation="hide"
						event="onclick" />
				</aon:commandButton>
			</f:facet>

			<h:panelGrid 
				width="100%" cellpadding="2" cellspacing="0" columns="2"
				styleClass="aon-panelGrid-formatting">
				<a4j:region>
					<aon:fileUpload id="file_upload"
						fileUploadListener="#{controller.fileUploaded}">							
						<f:facet name="label">
							<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
						</f:facet>
						<a4j:support event="onuploadcomplete" oncomplete="Richfaces.hideModalPanel('uploadFileModalPanel');" />
						<a4j:support event="onupload" oncomplete="showFileUploadProgress();" />
						<a4j:support event="onclear" oncomplete="hideFileUploadProgress();" />
					</aon:fileUpload>
					<rich:jQuery name="showFileUploadProgress" timing="onJScall" 
						selector="#file_upload .rich-fileupload-list-overflow" query="height(70);" />
					<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
						selector="#file_upload .rich-fileupload-list-overflow" query="height(0);" />
				</a4j:region>
			</h:panelGrid>
		</rich:modalPanel>

	</aon:form>

</ui:composition>

</body>
</html>
