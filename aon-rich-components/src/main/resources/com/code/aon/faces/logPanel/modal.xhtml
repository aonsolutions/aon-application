<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:methodParam name="closeButtonAction" default="" />

    <a4j:region>
        <h:form>
            <a4j:poll id="logPanel_poll" interval="10000" enabled="#{logPanel.activePoll}"
            	status="aonStatus" actionListener="#{logPanel.onDoNothig}"
            	reRender="logPanel_poll,logPanel_content"/>
        </h:form>
    </a4j:region>
	<aon:form>
        <rich:modalPanel id="logPanel"
			minHeight="550" height="550" minWidth="1000" width="1000">
			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{logPanelTitle}" />
				</aon:div>
			</f:facet>
	        <f:facet name="controls">
				<aon:commandButton styleClass="aon-popupWindow-close"
					action="#{closeButtonAction}" actionListener="#{logPanel.onCloseWindow}" immediate="true"
					reRender="aonStatus,logPanel_poll,logPanel_content#{(closeButtonReRender != null)?',':''}#{closeButtonReRender}">
					<rich:componentControl for="logPanel"
						operation="hide" event="onclick" />
				</aon:commandButton>
	        </f:facet>
			<rich:panel id="logPanel_content">
				<aon:panelGrid styleClass="aon-width-all" columnClasses="aon-panel-head">
					<aon:div>
						<aon:outputText value="#{bundle.aon_messages}" styleClass="aon-panel-title"/>
					</aon:div>
				</aon:panelGrid>
				<rich:panel bodyClass="aon-log-panel">
			        <rich:dataList var="msg" value="#{logPanel.status}">
						<aon:outputText escape="false" value="#{msg}"/>
					</rich:dataList>
				</rich:panel>
         		<aon:div styleClass="aon-margin-top">
					<aon:panelGrid styleClass="aon-width-all" columnClasses="aon-panel-head">
						<aon:div>
							<aon:outputText value="#{bundle.aon_errors}" styleClass="aon-panel-title"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
				<rich:panel bodyClass="aon-log-panel">
			        <rich:dataList var="msg" value="#{logPanel.errors}">
						<aon:outputText style="color:red;" escape="false" value="#{msg}"/>
					</rich:dataList>
				</rich:panel>
			</rich:panel>
        </rich:modalPanel>
	</aon:form>
</ui:composition>
