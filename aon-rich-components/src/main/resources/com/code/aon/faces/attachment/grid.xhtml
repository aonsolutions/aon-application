<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipSelectRow" value="#{true}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton id="#{dataTableId}-selectButton"
					styleClass="aon-editDataTable-button aon-table-row-link"
					rendered="#{!skipEditSelectedTo}"
					actionListener="#{rowSelectorActionListener}" reRender="#{rowSelectorReRender}"
					focus="#{(focusOnSelect != null)?(focusOnSelect):''}" />
				<f:facet name="footer">
					<aon:div>
						<aon:if test="#{!skipResetButton}">
							<aon:commandButton
								id="#{dataTableId}-resetButton" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
								action="#{resetAction}" actionListener="#{resetActionListener}"
								rendered="#{!formNew}" reRender="#{resetButtonReRender}"
								styleClass="aon-editDataTable-button aon-icon-reset"
								accesskey="#{bundle.aon_key_new_line}" 
								focus="#{(focusOnAdd != null)?(focusOnAdd):''}"/>
						</aon:if>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.description"
				styleClass="aon-editDataTable-textColumn aon-width-200 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="#{controller.beanName}_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="#{controller.beanName}_description" required="true"
					value="#{controller.to.description}" maxlength="64"
					rendered="#{formEdit}" size="25" />
				<f:facet name="footer">
					<aon:inputText id="#{controller.beanName}_description-New" required="true"
						value="#{controller.to.description}" maxlength="64"
						rendered="#{formNew}" size="25" />
				</f:facet>
			</aon:column>
 
 			<ui:insert name="additionalColumns"/>
 			
 			<ui:include src="/com/code/aon/faces/attachment/fileColumn.xhtml" />
		
		</ui:define>
	</ui:decorate>
</ui:composition>
