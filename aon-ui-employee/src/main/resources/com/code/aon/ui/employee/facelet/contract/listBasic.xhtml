<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{!skipNameColumn}">
		<aon:column alias="Contract.person.firstSurname,Contract.person.registry.name" styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.registry_person}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.person.fullName}"/>
			</aon:div>
		</aon:column>
	</c:if>

	<c:if test="#{!skipNssColumn}">
		<aon:column alias="Contract.person.socialSecurityNumber" styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.registry_person_nss}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.person.socialSecurityNumber}"/>
			</aon:div>
		</aon:column>
	</c:if>

	<aon:column alias="Contract.startDate" styleClass="aon-editDataTable-dateColumn aon-width-150">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_start_date}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>

	<aon:column alias="Contract.endDate" styleClass="aon-editDataTable-dateColumn aon-width-150">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_end_date}" />
		</f:facet>
		<aon:outputText value="#{to.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>

	<c:if test="#{!skipWorkPlaceColumn}">
		<aon:column alias="Contract.workPlace.description" styleClass="aon-editDataTable-textColumn aon-width-250">
			<f:facet name="header">
				<aon:outputText value="#{companyBundle.company_workplace}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.workPlace.description}"/>
			</aon:div>
		</aon:column>
	</c:if>

	<c:if test="#{!skipEnterpriseColumn}">		
		<aon:column alias="Contract.workPlace.enterprise.registry.name"	styleClass="aon-editDataTable-textColumn aon-width-250">
			<f:facet name="header">
				<aon:outputText value="#{companyBundle.company_enterprise}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}"/>
			</aon:div>
		</aon:column>
	</c:if>

	<c:if test="#{!skipModelColumn}">		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText value="#{employeeBundle.employee_contract_model}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{contract.currentContractData.code.value}" />
				<rich:toolTip direction="top-left" layout="block">
		            <aon:outputText value="#{contract.currentContractData.code}" />
		        </rich:toolTip>
			</aon:div>
		</aon:column>
	</c:if>
	
	<c:if test="#{!skipDocumentColumn}">
		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<h:commandLink target="_blank" 
				disabled="#{to.document==null}"
				title="#{(to.document!=null)?('pdf'):('no pdf')}"
				actionListener="#{contract.onDownloadContract}"
				styleClass="aon-editDataTable-button #{(to.document!=null)?('aon-icon-pdf'):('aon-icon-pdf-disabled')}"
				value="&#160;" />
		</aon:column>
	</c:if>

</ui:composition>
