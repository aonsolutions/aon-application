<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{employeeBundle.employee_contract_module}" />
				<ui:param name="controller" value="#{contract}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{contract}" />
					<ui:define name="columns">
					
						<aon:column alias="Contract.person.registry.surname,Contract.person.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{registryBundle.registry_person}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="#{to.person.registry.fullName}"/>
							</aon:div>
						</aon:column>
					
						<aon:column alias="Contract.workPlace.enterprise.registry.surname,Contract.workPlace.enterprise.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{companyBundle.company_enterprise}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}"/>
							</aon:div>
						</aon:column>
					
						<aon:column alias="Contract.contractType.description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{employeeBundle.employee_contractType}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="#{to.contractType.description}"/>
							</aon:div>
						</aon:column>
						
						<aon:column alias="Contract.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
	
					</ui:define>
				</ui:decorate>
	
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
