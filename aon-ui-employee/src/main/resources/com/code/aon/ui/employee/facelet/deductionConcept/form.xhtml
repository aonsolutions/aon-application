<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="deductionConceptForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{employeeBundle.employee_deductionConcept_module}" />
				<ui:param name="controller" value="#{deductionConcept}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" >
					
					<aon:outputLabel for="DeductionConcept_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="DeductionConcept_code" size="5" maxlength="5"
						value="#{deductionConcept.to.code}" />

					<aon:outputLabel for="DeductionConcept_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="DeductionConcept_description" size="64" maxlength="64"
						value="#{deductionConcept.to.description}" />
						
					<aon:outputLabel for="DeductionConcept_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="DeductionConcept_type" 
						value="#{deductionConcept.to.type}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{employeeCollections.deductionTypes}" />
					</aon:selectOneMenu>	

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
