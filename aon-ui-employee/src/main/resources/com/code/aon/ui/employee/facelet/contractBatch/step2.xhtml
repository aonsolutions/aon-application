<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/employee/facelet/contractBatch/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{employeeBundle.contractBatch_step2}" />
	</ui:define>

	<ui:define name="step_content">
	
		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="Remesa i18n"/>
			</f:facet>

			<aon:panelGrid columns="4" dir="true" width="100%">
				<aon:outputText value="#{bundle.aon_id}" />
				<aon:outputText
					value="#{contractBatchWizard.batch.id}" />
	
				<aon:outputText value="#{bundle.aon_date}" />
				<aon:outputText value="#{contractBatchWizard.batch.date}">
					<f:convertDateTime type="date"
						pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
		
			</aon:panelGrid>
		</aon:panel>
		
		<aon:dataTable id="contractData" value="#{contractBatchWizard.model}"
			var="to" rows="20" rendered="#{contractBatchWizard.model.rowCount > 0}"
			columnClasses="
			aon-editDataTable-textColumn, 
			aon-editDataTable-textColumn, 
			aon-editDataTable-textColumn, 
			aon-editDataTable-dateColumn,
			aon-editDataTable-textColumn aon-width-250">
			
			<ui:include src="/com/code/aon/ui/employee/facelet/contractBatch/columns.xhtml" />
	
		</aon:dataTable>
	
	</ui:define>

</ui:composition>
