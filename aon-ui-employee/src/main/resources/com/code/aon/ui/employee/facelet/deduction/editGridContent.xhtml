<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="rows" value="#{controller.pageLimit}" />
		<ui:define name="columns">	
		
			<c:if test="#{!skipStartDateColumn}">
				<aon:column alias="ContractDeduction.startDate"
					styleClass="aon-editDataTable-dateColumn">
					<f:facet name="header">
						<aon:outputLabel for="ContractDeduction_startDate"
							value="#{bundle.aon_start_date}" />
					</f:facet>
					<aon:outputText value="#{to.startDate}" rendered="#{formList}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
					<aon:selectInputDate id="ContractDeduction_startDate" rendered="#{formEdit}"
						value="#{controller.to.startDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
					<f:facet name="footer">
						<aon:selectInputDate id="ContractDeduction_startDate-New" rendered="#{formNew}"
							value="#{controller.to.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</f:facet>
				</aon:column>
			</c:if>
			
			<c:if test="#{!skipEndDateColumn}">
				<aon:column alias="ContractDeduction.endDate"
					styleClass="aon-editDataTable-dateColumn">
					<f:facet name="header">
						<aon:outputLabel for="ContractDeduction_endDate"
							value="#{bundle.aon_end_date}" />
					</f:facet>
					<aon:outputText value="#{to.endDate}" rendered="#{formList}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
					<aon:selectInputDate id="ContractDeduction_endDate" rendered="#{formEdit}"
						value="#{controller.to.startDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
					<f:facet name="footer">
						<aon:selectInputDate id="ContractDeduction_endDate-New" rendered="#{formNew}"
							value="#{controller.to.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</f:facet>	
				</aon:column>
			</c:if>
		
			<aon:column alias="ContractDeduction.type"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="ContractDeduction_type"
						value="#{employeeBundle.employee_salary_deductionType}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.type}" />
				<aon:selectOneMenu id="ContractDeduction_type" 
					value="#{controller.to.type}" rendered="#{formEdit}">
					<f:selectItems value="#{employeeCollections.deductionTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ContractDeduction_type-New" 
						value="#{controller.to.type}" rendered="#{formNew}">
						<f:selectItems value="#{employeeCollections.deductionTypes}" />
					</aon:selectOneMenu>
				</f:facet>		
			</aon:column>
			
			<aon:column alias="ContractDeduction.description"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="ContractDeduction_description"
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText rendered="#{formList}" 
					value="#{to.description}" />
				<aon:inputText id="ContractDeduction_description" rendered="#{formEdit}" 
					size="40" maxlength="64"
					value="#{controller.to.description}" />
				<f:facet name="footer">
					<aon:inputText id="ContractDeduction_description-New" rendered="#{formNew}"
						size="40" maxlength="64"
						value="#{controller.to.description}" />
				</f:facet>		
			</aon:column>
			
			<aon:column alias="ContractDeduction.expression"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="ContractDeduction_expression"
						value="#{employeeBundle.employee_salary_expression}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.expression}" />		
				<aon:inputText id="ContractDeduction_expression" rendered="#{formEdit}" size="20"
						maxlength="128" value="#{controller.to.expression}"
						required="true" />
				<f:facet name="footer">
					<aon:inputText id="ContractDeduction_expression-New" rendered="#{formNew}" size="20"
							maxlength="128" value="#{controller.to.expression}"
							required="true" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>
	
</ui:composition>
