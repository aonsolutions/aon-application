<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="rows" value="#{controller.pageLimit}" />
		<ui:define name="columns">	
		
			<c:if test="#{!skipStartDateColumn}">
				<aon:column alias="ContractPayment.startDate"
					styleClass="aon-editDataTable-dateColumn">
					<f:facet name="header">
						<aon:outputLabel for="Contract_startDate"
							value="#{bundle.aon_start_date}" />
					</f:facet>
					<aon:outputText value="#{to.startDate}" rendered="#{formList}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate id="Contract_startDate" rendered="#{formEdit}"
						value="#{controller.to.startDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
					<f:facet name="footer">
						<aon:selectInputDate id="Contract_startDate-New" rendered="#{formNew}"
							value="#{controller.to.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</f:facet>		
				</aon:column>
			</c:if>
			
			<c:if test="#{!skipEndDateColumn}">
				<aon:column alias="ContractPayment.endDate"
					styleClass="aon-editDataTable-dateColumn">
					<f:facet name="header">
						<aon:outputLabel for="Contract_endDate"
							value="#{bundle.aon_end_date}" />
					</f:facet>
					<aon:outputText value="#{to.endDate}" rendered="#{formList}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
					<aon:selectInputDate id="Contract_endDate" rendered="#{formEdit}"
						value="#{controller.to.startDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
					<f:facet name="footer">
						<aon:selectInputDate id="Contract_endDate-New" rendered="#{formNew}"
							value="#{controller.to.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</f:facet>		
				</aon:column>
			</c:if>
			
			<aon:column alias="SalaryPayment.type"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="SalaryPayment_type"
						value="#{employeeBundle.employee_salary_deductionType}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.type}" />
				<aon:selectOneMenu id="SalaryPayment_type" 
					value="#{controller.to.type}" rendered="#{formEdit}">
					<f:selectItems value="#{employeeCollections.paymentTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="SalaryPayment_type-New" 
						value="#{controller.to.type}" rendered="#{formNew}">
						<f:selectItems value="#{employeeCollections.paymentTypes}" />
					</aon:selectOneMenu>
				</f:facet>		
			</aon:column>
			
			<aon:column alias="SalaryPayment.description"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="SalaryPayment_description"
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText rendered="#{formList}" 
					value="#{to.description}" />
				<aon:inputText id="SalaryPayment_description" rendered="#{formEdit}" 
					size="40" maxlength="64"
					value="#{controller.to.description}" />
				<f:facet name="footer">
					<aon:inputText id="SalaryPayment_description-New" rendered="#{formNew}" 
						size="40" maxlength="64"
						value="#{controller.to.description}" />
				</f:facet>		
			</aon:column>
			
			<aon:column alias="SalaryPayment.function"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="SalaryPayment_function"
						value="#{employeeBundle.employee_salary_function}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.function}" />		
				<aon:inputText id="SalaryPayment_function" rendered="#{formEdit}" size="20"
						maxlength="128" value="#{controller.to.function}"
						required="true" />
				<f:facet name="footer">
					<aon:inputText id="SalaryPayment_function-New" rendered="#{formNew}" size="20"
							maxlength="128" value="#{controller.to.function}"
							required="true" />
				</f:facet>
			</aon:column>
			
			<c:if test="#{!skipAmountColumn}">
				<aon:column alias="SalaryPayment.amount"
					styleClass="aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputLabel for="SalaryPayment_amount"
							value="#{employeeBundle.employee_salary_amount}" />
					</f:facet>
					<aon:outputText rendered="#{!formNew}"
						value="#{controller.amount}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:column>
			</c:if>
		</ui:define>
	</ui:decorate>
	
</ui:composition>
