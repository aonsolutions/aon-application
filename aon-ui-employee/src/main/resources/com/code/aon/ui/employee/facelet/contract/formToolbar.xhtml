<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<c:if test="#{!contract.new}" >
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{employeeBundle.employee_contract_module}" />
			<ui:param name="controller" value="#{contract}" />
			<ui:param name="skipSaveButton" value="true" />
			<ui:param name="skipRemoveButton" value="true" />
			<ui:define name="beforeSpinToolbarContent">
				<aon:commandButton 
					value="#{employeeBundle.employee_contractCalendarEvent}"
					styleClass="aon-finding-toolbar-item aon-icon-contract-calendar"
					rendered="#{!contract.new}"
					action="contractCalendarEvent_form" />
			</ui:define>
		</ui:decorate>
	</c:if>
	<c:if test="#{contract.new}" >
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{employeeBundle.employee_contract_module}" />
			<ui:param name="controller" value="#{contract}" />
			<ui:param name="skipRemoveButton" value="true" />
		</ui:decorate>
	</c:if>

</ui:composition>
