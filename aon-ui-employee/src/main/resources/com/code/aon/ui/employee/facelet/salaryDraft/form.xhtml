<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryDraftForm">
			<aon:methodParam name="saveAction" value="salaryDraft_form" />
			<aon:methodParam name="saveActionListener" value="#{contract.onSalarySave}" type="actionListener" />
			<aon:methodParam name="searchAction" value="salaryDraft_search" />
			<aon:methodParam name="backAction" value="salaryDraft_list" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{employeeBundle.employee_salaryDraft_module}" />
				<ui:param name="controller" value="#{contract}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
<!--  
					<aon:htmlCommandLink id="currentSalary-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{employeeBundle.employee_salary}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="currentSalaryReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
-->
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">		
				<ui:include src="/com/code/aon/ui/employee/facelet/salaryDraft/formEditContent.xhtml" >
					<ui:param name="controller" value="#{contract}" />
				</ui:include>
			</aon:div>
			<aon:div styleClass="aon-scroll-area" rendered="#{!contract.new}">
				<aon:div styleClass="aon-form-group-title">
					<aon:div styleClass="aon-form-group-title-internal">
						<aon:outputText value="#{employeeBundle.employee_salary_payment}" />
					</aon:div>
				</aon:div>
				<ui:include src="/com/code/aon/ui/employee/facelet/payment/gridContent.xhtml" >
					<ui:param name="controller" value="#{contractPayment}" />
					<ui:param name="skipAmountColumn" value="true" />
				</ui:include>
				<aon:div styleClass="aon-form-group-title">
					<aon:div styleClass="aon-form-group-title-internal">
						<aon:outputText value="#{employeeBundle.employee_salary_deduction}" />
					</aon:div>
				</aon:div>
				<ui:include src="/com/code/aon/ui/employee/facelet/deduction/gridContent.xhtml" >
					<ui:param name="controller" value="#{contractDeduction}" />
					<ui:param name="skipAmountColumn" value="true" />
				</ui:include>
			</aon:div>
		</aon:form>
<!--  
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{contractTypeLookup}" />
-->		
	</ui:define>
</ui:composition>
