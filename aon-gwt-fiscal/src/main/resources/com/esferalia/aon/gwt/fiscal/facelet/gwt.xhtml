<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<meta name="gwt:property" content="locale=es_ES" />
	
	<aon:valueParam name="entryPoint" default="" />
	<aon:valueParam name="subEntryPoint" default="" />
	<aon:valueParam name="gwtDomain" default="#{domainSwitcher.domainId}" />
	<aon:valueParam name="gwtDomainName" default="#{domainSwitcher.domainNameURL}" />
	<aon:valueParam name="gwtUser" default="#{domainSwitcher.currentUser}" />
	
  	<aon:if test="#{!userUtils.newAONTheme}">
		<style>
			body {
				margin: 0;
			}
		</style>
	</aon:if>
  	<aon:if test="#{userUtils.newAONTheme}">
		<style>
			body {
				margin: 0;
			}
			
			#rootPanel > div {
				left: 68px !important;
			} 
		</style>
	</aon:if>

	<ui:include src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />
	<ui:include src="/facelet/homepage/menu.xhtml" />
	
	<div id="rootPanel"
		style="width: 100%; min-height: 100%; height: auto !important; height: 100%; margin: 0;">
	</div>

  	<aon:if test="#{userUtils.newAONTheme}">
		<aon:div style="overflow: auto; height: calc(100vh - 66px); width: min-content; position:fixed; z-index: 6; background-color: #fff" id="sidebarScrollDiv" >
			<ui:include src="/facelet/new/sidebar.xhtml" />
		</aon:div>
	</aon:if>

	<script type="text/javascript">
	<![CDATA[
		
		/* LOADS 'CLEAN.CSS' IF IT HAS BEEN REMOVED */
        if ([...document.styleSheets].filter(sts => /^.*clean\/clean\.css$/.test(sts.href)).length < 1) {
            let head  = document.getElementsByTagName('head')[0];
            let link  = document.createElement('link');
            link.rel  = 'stylesheet';
            link.type = 'text/css';
            link.href = '/aon_gwt_fiscal/gwt/clean/clean.css';
            link.media = 'all';
            head.appendChild(link);
        }
		
	 	function getCurrentDomain() {
			return #{gwtDomain};
		}
		
	 	function getCurrentDomainName() {
	       	return "#{gwtDomainName}"
	  	}
		
		function getCurrentUser() {
	       	return "#{gwtUser}"
	  	}
		
		function getSubEntryPoint() {
        	return "#{subEntryPoint}";
        }

		var search = "/#{module}.nocache.js";
		var scripts = window.document.getElementsByTagName("script");
		for (var i = 0; i < scripts.length; ++i) {
			var script = scripts[i]; 
			if (script.src != null && script.src.indexOf(search) != -1) {
				var parent = script.parentNode;
				parent.removeChild(script);
				break;
			}
		}

		var iframes = window.document.getElementsByTagName("iframe");
		for (var i = 0; i < iframes.length; ++i) {
			var iframe = iframes[i]; 
			if (iframe.src != null && iframe.id == "#{module}") {
				var parent = iframe.parentNode;
				parent.removeChild(iframe);
				break;
			}
		}

	    	 
		function startModule() {
			localStorage.removeItem('rootPanel');
		    localStorage.removeItem('aon_solutions');
		    localStorage.removeItem('aon_session_id');
			if (window.document.createElement && window.document.getElementsByTagName) {
				var script = window.document.createElement("script");
				script.type = "text/javascript";
				script.defer = "true";
				script.src = "#{module}/#{module}.nocache.js?entryPoint=#{entryPoint}";
				var heads = window.document.getElementsByTagName("head");
				if (heads && heads[0]) {
					heads[0].appendChild(script);
					triggerModuleStart();
				}
			}
		}
	
	    function triggerModuleStart(){
	        try{
	        	#{module}.onInjectionDone("#{module}");
	        	if ( !window.document.createEventObject ) {
	            	var evt = window.document.createEvent("HTMLEvents");
	            	evt.initEvent("DOMContentLoaded", true, true);
	            	window.document.dispatchEvent(evt);
	           	}
	        } catch ( e ) {
	        	// window.setTimeout("triggerModuleStart()", 100 );
	        } 
	    }
	    
		startModule();
	]]>
	</script>

</ui:composition>
